l_simp_chinese:
 mapmode_cm_breadbasket_name: "粮仓"
 MAPMODE_CM_BREADBASKET: "#T $mapmode_cm_breadbasket_name$#!\n高亮显示当前已设置运行自动粮食的[locations|e]。"
 MAPMODE_CM_BREADBASKET_TT_ENABLED: "[ROOT.GetLocation.GetName] 已配置自动粮食。"
 MAPMODE_CM_BREADBASKET_TT_OWNED: "[ROOT.GetLocation.GetName] 归你所有，但未启用自动食物。"
 MAPMODE_CM_BREADBASKET_TT_FOREIGN: "[ROOT.GetLocation.GetName] 不属于你。"
 MAPMODE_CM_BREADBASKET_TT_UNCOLONIZED: "[ROOT.GetLocation.GetName]尚未被殖民。"
 MAPMODE_CM_BREADBASKET_TT_WATER: "$cm_txt_tt_sea_zone$"

 cm_breadbasket_enabled_legend_key: "自动粮食已启用"
 cm_breadbasket_owned_legend_key: "您的其他位置"
 cm_breadbasket_foreign_legend_key: "外国地点"
 cm_breadbasket_uncolonized_legend_key: "未殖民"

 mapmode_cm_location_food_potential_name: "每级资源采集业的粮食潜力"
 MAPMODE_CM_LOCATION_FOOD_POTENTIAL: "#T $mapmode_cm_location_food_potential_name$#!\n此模式根据每[rgo|e]等级的自然粮食潜力为[locations|e]着色。该评分综合了[rgo|e][food|e]值、累积[food_productivity|e]（地形、植被、气候、命名的静态修正，如斯科讷鲱鱼市场或肥沃的尼罗河三角洲、[rgo|e]特定的产出修正等）、水源准入，以及在[rgo|e]允许的情况下，来自[ShowBuildingTypeName('windmill')]、[ShowBuildingTypeName('farming_village')]和[ShowBuildingTypeName('irrigation_systems')]的假设最大加成。\n\n[development|e]已被排除，且每个[location|e]都按其作为农村定居点进行评分，因此该评分显示的是地形潜力而非当前产出。"
 mapmode_cm_location_food_potential_hidden_name: "$mapmode_cm_location_food_potential_name$"
 MAPMODE_CM_LOCATION_FOOD_POTENTIAL_HIDDEN: "$MAPMODE_CM_LOCATION_FOOD_POTENTIAL$"
 MAPMODE_CM_LOCATION_FOOD_POTENTIAL_TT_LAND: "[ROOT.GetLocation.GetName]每级[rgo|e]的食物潜力为[ROOT.GetLocation.MakeScope.ScriptValue('cm_location_food_potential')|1Y]。"
 MAPMODE_CM_LOCATION_FOOD_POTENTIAL_TT_WATER: "[ROOT.GetLocation.GetName]不是陆地，因此没有粮食潜力。"

 cm_location_food_potential_auto_food_legend_key: "自动粮食已启用 (条纹)"
 cm_location_food_potential_bright_green_legend_key: "45 (最大可能)"
 cm_location_food_potential_green_legend_key: "27.5 (极佳)"
 cm_location_food_potential_yellow_legend_key: "20 (良好)"
 cm_location_food_potential_orange_legend_key: "12.5 (尚可)"
 cm_location_food_potential_red_legend_key: "3.75 (低)"
 cm_location_food_potential_black_legend_key: "0 (无)"
