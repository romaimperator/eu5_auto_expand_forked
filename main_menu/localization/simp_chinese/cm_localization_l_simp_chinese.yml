 cm_txt_dbg_run_feature_desc: "立即运行此功能，而无需等待月度更替。在其启动的周期内不会建造其他任何内容，且“暂停自动化”不会阻止其运行。"
 cm_txt_dbg_run_category_desc: "立即独立运行此类别，无需等待月度更替。它将支出其剩余份额，因此本月已完成支出的类别将不会进行建造。“暂停自动化”不会阻碍此操作。"
