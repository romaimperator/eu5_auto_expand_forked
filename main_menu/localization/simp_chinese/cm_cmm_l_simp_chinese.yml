 cm__urbanize_rural_to_town_name: "乡村至城镇"
 cm__urbanize_rural_to_town_desc: "每月将符合条件的农村定居点提升为城镇。要求人口达到 30,000（即可立即获得城市资格），或距离人口上限不足 1,000（否则增长将在农村上限处停滞）。若某地区的 RGO 在下方的忽略列表中被勾选，则会跳过该地区。受“批量自动食物”覆盖的地区也会被跳过，以便其保持农村状态并继续生产食物。"
