 cm__ab_master_name: "控制面板"
 cm__ab_custom_name: "自定义"
 cm__ab_core_name: "核心商品"
 cm__ab_food_name: "粮食"
 cm__ab_production_name: "生产"
 cm__ab_roads_name: "道路"
 cm__ab_governors_name: "总督"
 cm__ab_master__ab_master_name: "$cm__ab_master_name$" # NO-TRANSLATE
 cm__ab_master__ab_master_desc: "自动建设。每月，下方的各个类别将动用国库中超出黄金储备的资金，用于当前可进行的最佳建设。该功能与其他自动化功能并行运行，且不会改动它们的设置。"
 cm__ab_enabled_name: "启用自动建造"
 cm__ab_enabled_desc: "开启或关闭自动建造。"
 cm__ab_save_unaffordable_name: "为无法负担的建筑保留资金"
 cm__ab_save_unaffordable_desc: "类别即使在成本超过其当月份额的情况下，也会购买所找到的最佳建筑，并在随后的月份中弥补该差额。关闭时，该类别不会购买任何其无法直接全额支付的建筑。"
 cm__ab_min_proximity_name: "最小邻近度"
 cm__ab_min_proximity_desc: "在选择建造地点时，低于此接近度的地点将被跳过。控制力建筑和 @settlement_building! [ShowBuildingTypeNameWithNoTooltip('settlement_building')] 无论如何都会建造，因为正是这些建筑让低接近度的土地值得持有。设置为 0 时，不会跳过任何地点。"
 cm__ab_min_proximity_format: "[CMMV('cm__ab_min_proximity')]%" # NO-TRANSLATE
 cm__ab_master__ab_priority_list_name: "自动建造类别"
 cm__ab_master__ab_priority_list_desc: "拖动以重新排序。每月按从上到下的顺序处理各类别。若两个类别都需要同一种建筑，由优先级较高者建造；若所有类别分配完资金后仍有黄金剩余，则由优先级较高者获得。"
 cm__ab_priority_list_item_column_name: "分类"
 cm__ab_priority_list_i1_name: "$cm__ab_custom_name$" # NO-TRANSLATE
 cm__ab_priority_list_i1_desc: "在所有合适的地方建造配套基础设施。首府建筑优先建造，其次是管控建筑，随后是市场中心建筑，最后是您自行选择的建筑。执达吏将建造在原材料售价最高的地点，其他管控建筑建造在最富裕的地点，而市场则建造在市场准入度最低的地点。"
 cm__ab_priority_list_i2_name: "$cm__ab_core_name$" # NO-TRANSLATE
 cm__ab_priority_list_i2_desc: "扩大建筑材料的生产以压低其价格。在你拥有市场中心的市场中生效。产量最高的地区优先，且每次增加数级，即使工人尚未到位的生产地也会开始建设。你的首都、生产粮食的地区以及若无补贴将产生亏损的生产地均会被跳过。"
 cm__ab_priority_list_i3_name: "$cm__ab_food_name$" # NO-TRANSLATE
 cm__ab_priority_list_i3_desc: "监控你拥有市场中心之市场的全年粮食供应，若中位月份供应不足，则在粮食潜力最高的地点开启自动粮食生产。系统选择的地点会像玩家手动开启的地点一样发光，但开关控制权仍归你所有；除非该地点不再是你拥有的乡村定居点、你不再拥有其市场中心，或同一市场内有更优的地点取代了它，否则它们永远不会被关闭。"
 cm__ab_priority_list_i4_name: "$cm__ab_production_name$" # NO-TRANSLATE
 cm__ab_priority_list_i4_desc: "建造、扩张并升级能以税收收入最快回本的生产建筑与资源采集作业（RGO）。若当地任何类型的工人都已短缺，则不会干涉运行自动粮食生产的地区。"
 cm__ab_priority_list_i5_name: "$cm__ab_roads_name$" # NO-TRANSLATE
 cm__ab_priority_list_i5_desc: "以最高的性价比建设道路网络，权衡道路带来的三项收益：邻近度、市场准入以及将地点连接至首都。每隔四年以及每当首都迁移时，它会针对这些收益计算通往你拥有的每个地点的最佳路线，并根据路段所能提升的税收基础（计入该路段后续的所有收益）进行排序；在多人模式中，仅在点击“强制重新规划道路”时才会执行此操作。每个月，它会按顺序处理该列表，并在遇到第一个无法开工的路段时停止，而不会直接跳过。系统会优先铺设廉价的平原走廊；只有当优先级较高的路段在当月未进行建设，且并未在为尚无法负担的路段积攒资金时，优先级较低的路段才会获得资金。"
 cm__ab_priority_list_i6_name: "$cm__ab_governors_name$" # NO-TRANSLATE
 cm__ab_priority_list_i6_desc: "规划总督的驻地并将其安排到位，优先选择最佳位置。每当总督职位空缺或每过二十五年，系统都会重新进行规划。仅限单人模式。"
 cm__ab_priority_list__budget_name: "预算份额"
 cm__ab_priority_list__budget_desc: "每个月分配给该类别的、超出黄金储备部分的国库份额。这是一个下限而非上限：未被任何类别使用的资金将从列表顶部重新分配，因此在排名较低的类别没有建设需求的月份，某个类别的支出可以远超其份额。"
 cm__ab_priority_list__budget_postfix: "%" # NO-TRANSLATE
 cm__ab_priority_list__enabled_name: "$cm_txt_enabled$" # NO-TRANSLATE
 cm__ab_priority_list__enabled_desc: "允许此类别进行建造。"
 cm__ab_priority_list__settings_name: "设置"
 cm__ab_priority_list__settings_desc: "前往该类别的专属设置。"
 cm__ab_priority_list__settings_text: "打开"
 cm__ab_master__debug_name: "$cm_txt_debug$" # NO-TRANSLATE
 cm__dbg_run_auto_build_name: "运行自动建造"
 cm__dbg_run_auto_build_desc: "现在将依次处理列表中的每个已启用类别，而不再等待月份更替。每个类别会支出其份额的剩余部分，因此本月已耗尽份额的类别将不再建造。“暂停自动化”不会阻碍此操作。"
 cm__dbg_run_auto_build_text: "$cm_txt_run_now$" # NO-TRANSLATE
 cm__ab_custom__ab_custom_name: "$cm__ab_custom_name$" # NO-TRANSLATE
 cm__ab_custom__ab_custom_desc: "集合每月按自上而下的顺序处理，因此排在前面的集合会优先消耗金币。"
 cm__ab_custom_item_column_name: "建筑"
 cm__ab_custom_i1_name: "首都建筑"
 cm__ab_custom_i1_desc: "在首都建造仅限首都的建筑：王室法庭、最高法院、陆军学院及其余建筑。它们的建造优先级高于此类别中的其他任何建筑。"
 cm__ab_custom_i2_name: "控制建筑"
 cm__ab_custom_i2_desc: "在原材料售价最高的地方建造执达吏，并在最富有的地区建造国家拥有的任何能提高控制度的独特建筑。在处理下一个地点之前，当前地点会先建造所有可容纳的独特建筑。"
 cm__ab_custom_i3_name: "市场中心建筑"
 cm__ab_custom_i3_desc: "在你拥有的每个市场中心，建造在该处能产生收益的建筑。"
 cm__ab_custom_i4_name: "选择建筑"
 cm__ab_custom_i4_desc: "建造下方列出的建筑。"
 cm__ab_custom__enabled_name: "$cm_txt_enabled$" # NO-TRANSLATE
 cm__ab_custom__enabled_desc: "建造此集合。"
 cm__ab_custom__auto_build_list_name: "$cm__ab_custom_i4_name$" # NO-TRANSLATE
 cm__ab_custom__auto_build_list_desc: "拖动以重新排序。建筑每月按自上而下的顺序进行处理，因此越靠上的建筑将优先获得资金。"
 cm__auto_build_list_i22_name: "@lazaretto! [ShowBuildingTypeName('lazaretto')]" # NO-TRANSLATE
