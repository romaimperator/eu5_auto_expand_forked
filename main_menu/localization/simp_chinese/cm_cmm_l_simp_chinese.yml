 cm__auto_grant_town_rights: "cm__auto_grant_town_rights"
 cm__auto_town_rights_list: "cm__auto_town_rights_list"
 cm__auto_town_rights_list__enabled: "cm__auto_town_rights_list__enabled"
 cm__expand_metric_name: "自动扩建指标"
 cm__expand_metric_desc: "选择自动扩建用于决定是否增加建筑或 RGO 等级的依据。"
 cm__expand_metric_option_1_name: "@income! 税收"
 cm__expand_metric_option_1_desc: "仅当其每月税收收入至少为您设置的最小税收收入时，才增加一个新等级。"
 cm__expand_metric_option_2_name: "@wealth! 利润"
 cm__expand_metric_option_2_desc: "仅在其每月总利润不低于你设定的最小利润时，才增加一级。"
 cm__expand_metric_option_3_name: "@efficiency! 投资回报 (税收)"
 cm__expand_metric_option_3_desc: "仅当税收收入能在您设置的最大投资回报年限内收回建设成本时，才增加一个新等级。"
 cm__expand_metric_option_4_name: "@efficiency! 投资回报率 (利润)"
 cm__expand_metric_option_4_desc: "仅当利润能在您设定的最大投资回报年限内收回建造费用时，才添加新等级。"
 cm__auto_town_rights_list_i32_name: "@market_charter! [ShowTownRightsName('market_charter')]"
 cm__auto_town_rights_list_i33_name: "@free_town_charter! [ShowTownRightsName('free_town_charter')]"
 cm__auto_town_rights_list_i34_name: "@fortress_town! [ShowTownRightsName('fortress_town')]"
 cm__auto_town_rights_list_i35_name: "@mining_charter! [ShowTownRightsName('mining_charter')]"
 cm__auto_town_rights_list_i36_name: "@studium_privileges! [ShowTownRightsName('studium_privileges')]"
 cm__auto_town_rights_list_i37_name: "@agrarian_community_town_right! [ShowTownRightsName('agrarian_community_town_right')]"
 cm__auto_town_rights_list_i38_name: "@enlightened_leadership_reform_town_right! [ShowTownRightsName('enlightened_leadership_reform_town_right')]"
 cm__expand_metric: "cm__expand_metric"
 cm__town_rights_free_grants_name: "移除城镇权利开销"
 cm__town_rights_free_grants_desc: "开启时，授予城市权利不消耗政府权力，撤回城市权利不消耗稳定度。"
 cm__town_rights_min_gov_power_name: "最低政府权力"
 cm__town_rights_min_gov_power_desc: "当下次授予会导致你的政府力量（正统性、共和传统、虔诚或部落团结，取决于政府类型）低于此值时，自动授予将停止授予城市权利。"
 cm__allowed_building_overbuild_levels_format: "[CMMV('cm__allowed_building_overbuild_levels')][Select_CString(GreaterThanOrEqualTo_CFixedPoint(CMMV('cm__allowed_building_overbuild_levels'), CMMMapValue('cmm_max', 'cm__allowed_building_overbuild_levels')), '+', '')]"
 cm__auto_build_capital_name: "首都建筑"
 cm__auto_build_capital_desc: "当条件允许时，自动在你的首都所在地建造仅限首都的建筑（王室法庭、最高法院、战争学院等）。这些建筑将优先于下方列表中的项目进行建造。"
 cm__urbanize_city_to_megalopolis_name: "城市到巨型都市"
 cm__urbanize_city_to_megalopolis_desc: "一旦你的首都成为拥有至少 400,000 人口的市场中心城市，即可将其升级为特大城市。"
 cm__megalopolis_ignore_capital_name: "巨型城市：忽略首都要求"
 cm__megalopolis_ignore_capital_desc: "允许你在非首都城市中建造“建立巨型都市”。"
 cm__megalopolis_ignore_market_center_name: "巨型城市：忽略市场中心需求"
 cm__megalopolis_ignore_market_center_desc: "允许你在非市场中心的城市建造建立大都市。"
 cm__deurbanize_name: "去城市化"
 cm__deurbanize_desc: "每月，如果所拥有地点的RGO货物在下方的“禁止城市化”列表中被勾选，则将其降级为乡村定居点。您的首都、被征服的地点以及提供邻近度的地点（如总督驻地）将不受影响。"
 cm__auto_urbanize_ignore_list_i20_name: "@wool! [ShowGoodsName('wool')] ([GetGlobalVariable('cm_goods_wool').GetGoods.GetDefaultMarketPrice]@gold!)"
 cm__full_automation_name: "全自动化"
 cm__full_automation__full_automation_name: "全自动化"
 cm__full_automation__full_automation_desc: "自动建设。每月，下列类别将动用金库中超出黄金储备的资金，投资于可建造的最佳建筑。此功能可与其他自动化功能并行运行，且不会影响其各自的设置。"
 cm__fa_enabled_name: "启用全自动化"
 cm__fa_enabled_desc: "开启或关闭全面自动化。"
 cm__fa_reserve_name: "黄金储备"
 cm__fa_reserve_desc: "完全自动化绝不会使你的国库低于此金额。独立于“设置”选项卡中的“黄金储备”。"
 cm__fa_reserve_format: "[CMMV('cm__fa_reserve')]@gold!"
 cm__fa_save_unaffordable_name: "为负担不起的建筑保留资金"
 cm__fa_save_unaffordable_desc: "当开启时，分类将购买其找到的最佳建筑，即使成本超过其当月配额，并在后续月份补足差额前不再进行建设。关闭时，每个分类仅花费配额内的资金，并将剩余部分转交给后续分类。"
 cm__full_automation__fa_priority_list_name: "优先级"
 cm__full_automation__fa_priority_list_desc: "拖动以重新排序。各类别每月按从上到下的顺序处理。若两个类别需要同一个建筑，则排序靠上的类别优先建造。"
 cm__fa_priority_list_item_column_name: "分类"
 cm__fa_priority_list_i1_name: "粮食"
 cm__fa_priority_list_i1_desc: "监控你所拥有的市场中心所在市场的全年粮食供应；在供应中值月份出现短缺的市场中，将在粮食潜力最高的地点启用自动粮食生产。选中的地点会像玩家手动启用时一样发光，但开关状态仍由你控制；除非该地点不再是你拥有的乡村定居点，或你不再拥有其所属的市场中心，否则系统绝不会将其关闭。"
 cm__fa_priority_list_i2_name: "工业"
 cm__fa_priority_list_i2_desc: "建造、扩张及升级那些能通过税收收入最快回本的生产建筑与RGO。若某地区已开启自动粮食管理，且当地任何类型的工人均已短缺，则不会对其进行干涉。"
 cm__fa_priority_list_i3_name: "价格崩溃"
 cm__fa_priority_list_i3_desc: "扩大建筑材料的生产以压低其价格。在你拥有市场中心的所有市场中生效。产出效率最高的地区将优先扩建，且每次会直接增加数个等级，甚至在工人尚未抵达的地方也会开始建设。你的首都、产粮地区以及若无补贴则会亏损的生产设施都将被跳过。"
 cm__fa_priority_list_i4_name: "道路"
 cm__fa_priority_list_i4_desc: "根据道路带来的三种收益（邻近度、市场准入以及连接地点至都城），以最高的性价比建设道路网络。系统每年会为这三个目标分别计算通往你名下每个地点的最佳路线，随后每月开始动工修筑那些能提升最多税收基础的路段（计入该路段后方整条路线的所有收益）。优先铺设廉价的平原走廊，且只有当优先级较高的目标没有可修筑的路段时，低优先级的目标才会获得资金分配。"
 cm__fa_priority_list_i5_name: "公共设施"
 cm__fa_priority_list_i5_desc: "在所有合适的地方建造支持性基础设施：依次为首都建筑、自动建造名单、汞齐化场、市场中心建筑、执达吏以及你国家拥有的任何增加控制力的独特建筑，然后是市场、防疫建筑，最后是粮仓。控制建筑优先建造在最富裕的地点，而市场优先建造在市场准入度最低的地点。"
 cm__fa_priority_list_i6_name: "建筑清理"
 cm__fa_priority_list_i6_desc: "每年一次，关闭已停止盈利且未获得补贴的生产建筑；若所在地处于其支持的建筑等级十级以内，则改为将其拆除。一旦该类建筑在该市场中再次盈利，已关闭的建筑将重新开放；若所在地空间耗尽，则稍后将被拆除。@farming_village! [ShowBuildingTypeNameWithNoTooltip('farming_village')] 绝不会被关闭或拆除。"
 cm__fa_priority_list_i7_name: "总督"
 cm__fa_priority_list_i7_desc: "规划总督应驻扎的位置并将其安置于该处，优先选择最佳位置。每当有总督席位空缺时都会重新规划，此外每隔二十五年也会进行一次。仅限单人模式。"
 cm__fa_priority_list_i8_name: "城市权利"
 cm__fa_priority_list_i8_desc: "在你的城镇和城市中授予城市特权。优先授予 [ShowTownRightsNameWithNoTooltip('granary_town')]，随后从适合该地所产货物的选项中随机抽取一项专业化特权。"
 cm__fa_priority_list__budget_name: "预算份额"
 cm__fa_priority_list__budget_desc: "此类别每月可支出的、国库中超出黄金储备部分的比例。"
 cm__fa_priority_list__budget_postfix: "%"
 cm__fa_priority_list__enabled_name: "已启用"
 cm__fa_priority_list__enabled_desc: "允许此类别进行建造。"
 cm__full_automation__fa_industry_name: "工业"
 cm__full_automation__fa_industry_desc: "上方工业类别的设置。"
 cm__fa_industry_algorithm_name: "建设策略"
 cm__fa_industry_algorithm_desc: "工业如何选择建造项目。"
 cm__fa_industry_algorithm_option_1_name: "贪婪"
 cm__fa_industry_algorithm_option_1_desc: "优先建造回本最快的选项，且仅限那些与生产相同货物的最佳地点相近的选项。"
 cm__fa_industry_max_rel_roi_name: "最大相对投资回报率"
 cm__fa_industry_max_rel_roi_desc: "规定了在允许建造的前提下，建筑或升级项的投资回收速度相比生产同类商品的最优地点可以慢多少。若设为30%，且最优地点在10年内回本，则只有回本年限在13年内的建筑会被建造；任何更慢的都会等待。若设为0%，每月仅建造每种商品回收效率最高的一处。若设为100%及以上，则不设此限，仅受“最大投资回收年限”约束。无论建筑类型如何，所有生产同类商品的建筑都会被统一衡量。RGO扩张总是按投资回收顺序建造。"
 cm__fa_industry_max_rel_roi_format: "[CMMV('cm__fa_industry_max_rel_roi')]%[Select_CString(GreaterThanOrEqualTo_CFixedPoint(CMMV('cm__fa_industry_max_rel_roi'), CMMMapValue('cmm_max', 'cm__fa_industry_max_rel_roi')), '+', '')]"
 cm__fa_industry_min_roi_name: "最大回本年限"
 cm__fa_industry_min_roi_desc: "仅考虑税收收入能在指定年数内收回建设成本的建筑。设置为 0 以禁用此检查。"
 cm__fa_industry_min_roi_format: "[CMMV('cm__fa_industry_min_roi')]年 @efficiency!"
 cm__full_automation__fa_collapsar_name: "价格塌缩"
 cm__full_automation__fa_collapsar_desc: "上方价格崩盘类别的设置。材料将按列表从上到下的顺序处理，且资源采集作业 (RGO) 的扩建优先于生产建筑。"
 cm__fa_collapsar_target_name: "目标价格"
 cm__fa_collapsar_target_desc: "停止某种材料建设的价格，相对于其基础价格。设置为 -33% 时，将持续建造生产设施，直到该材料的交易价格低于基础价格 33%。设置为 0% 时，直到其达到基础价格。设置为 +33% 时，仅当价格高于基础价格 33% 以上时才进行建造。"
 cm__fa_collapsar_target_format: "[CMMV('cm__fa_collapsar_target')]%"
 cm__fa_collapsar_item_column_name: "材料"
 cm__fa_collapsar_i1_name: "@masonry! [ShowGoodsName('masonry')]"
 cm__fa_collapsar_i2_name: "@lumber! [ShowGoodsName('lumber')]"
 cm__fa_collapsar_i3_name: "@sand! [ShowGoodsName('sand')]"
 cm__fa_collapsar_i4_name: "@glass! [ShowGoodsName('glass')]"
 cm__fa_collapsar__enabled_name: "已启用"
 cm__fa_collapsar__enabled_desc: "致力于降低该材料的价格。"
 cm__full_automation__fa_food_name: "粮食"
 cm__full_automation__fa_food_desc: "上方粮食类别的设置。"
 cm__fa_food_target_name: "盈余目标"
 cm__fa_food_target_desc: "一个市场会持续增加产粮地，直到其供应量达到需求的这一比例。若设为125%，则任何一年中位月份盈余未达25%的市场都会扩张粮食生产。调高此值可保留更多缓冲空间，调低此值则仅帮助更接近短缺的市场。"
 cm__fa_food_target_format: "[CMMV('cm__fa_food_target')]%"
 cm__fa_food_min_potential_name: "最低粮食潜力"
 cm__fa_food_min_potential_desc: "自动产粮仅在每个RGO等级的粮食潜力达到此分值的地域启用，该分值与$mapmode_cm_location_food_potential_name$地图模式显示的分值相同。提高此值以保留给更优质的农田，降低此值以接受较差的土地。"
 cm__fa_food_min_potential_format: "[CMMV('cm__fa_food_min_potential')]"
 cm__full_automation__fa_urban_rights_name: "城市权利"
 cm__full_automation__fa_urban_rights_desc: "上述城镇权利类别的设置。"
 cm__fa_urban_rights_window_name: "匹配阈值"
 cm__fa_urban_rights_window_desc: "一项专业化权利相对于当地最契合的权利所需达到的契合度，方可进入备选范围。设定为50%时，任何契合度至少达到最高值一半的权利都可能被选中，且越契合的权利被选中的概率越高。设定为100%时，仅会授予最契合的权利。"
 cm__fa_urban_rights_window_format: "[CMMV('cm__fa_urban_rights_window')]%"
 cm__fa_urban_rights_reserve_name: "政府权力储备"
 cm__fa_urban_rights_reserve_desc: "当支付费用会导致你的政府权力（根据政府类型，指正统性、共和传统、虔诚或部落团结度）低于此值时，将不会授予城市特权。"
 cm__fa_urban_rights_expand_name: "扩张受加成的产业"
 cm__fa_urban_rights_expand_desc: "当授予专业化特权时，同时也为该地区中受该特权强化的产业及其生产的原材料开启自动扩建。这与在“推荐城镇特权”地图模式下右键点击授予按钮的效果相同。"
 cm__full_automation__fa_cleanup_name: "建筑清理"
 cm__full_automation__fa_cleanup_desc: "上方建筑清理类别的设置。"
 cm__fa_cleanup_min_profit_name: "最低利润"
 cm__fa_cleanup_min_profit_desc: "每月收益低于此值的建筑将被视为不值得经营，除非获得补贴，否则将被关闭或拆除。同一市场中，同类建筑中处于开启状态的建筑一次最多只有一半会被关闭或拆除。"
 cm__fa_cleanup_min_profit_format: "[Divide_CFixedPoint(CMMV('cm__fa_cleanup_min_profit'), '(CFixedPoint)100')|2]@gold!"
 cm__fa_cleanup_core_goods_name: "优先建筑材料"
 cm__fa_cleanup_core_goods_desc: "将主要消耗 @masonry![ShowGoodsNameWithNoTooltip('masonry')]、@lumber![ShowGoodsNameWithNoTooltip('lumber')]、@sand![ShowGoodsNameWithNoTooltip('sand')] 或 @glass![ShowGoodsNameWithNoTooltip('glass')] 的建筑维持在最低利润的两倍或 0.1@gold!（取两者中较高者）。生产这四种资源之一的建筑则按常规最低利润判定。"
 cm__fa_cleanup_auto_food_name: "清除自动粮食地区"
 cm__fa_cleanup_auto_food_desc: "当自动粮食管理运行且任何类型的工人都已短缺时，摧毁不生产粮食的生产建筑。@market_village! [ShowBuildingTypeNameWithNoTooltip('market_village')] 将被降至一级而非直接摧毁。"
 cm__full_automation__fa_roads_name: "道路"
 cm__full_automation__fa_roads_desc: "上方道路类别的设置。"
 cm__fa_roads_proximity_name: "邻近度"
 cm__fa_roads_proximity_desc: "铺设单位金币邻近度提升最高的路段，并将该路段后方路线上的所有地点都计算在内。"
 cm__fa_roads_market_access_name: "市场准入"
 cm__fa_roads_market_access_desc: "铺设金币性价比最高的市场准入度提升路段。仅在当月已无可铺设的邻近度路段时才进行支出。"
 cm__fa_roads_capital_name: "首都连接"
 cm__fa_roads_capital_desc: "铺设路段以将你的地点连接至首都，从已连接的地点向外延伸。仅在没有剩余的“邻近度”和“市场准入”路段需要铺设的月份，才会进行此项支出。"
 cm__full_automation__fa_governors_name: "总督"
 cm__full_automation__fa_governors_desc: "上方总督分类的设置。"
 cm__fa_gov_move_seats_name: "允许移动总督"
 cm__fa_gov_move_seats_desc: "当所有总督席位已满时，撤换一名总督并将其改派往更佳的位置。该更佳位置必须已经是城市，或者评分比被替换的位置高出 10% 以上。禁用此项后，总督只会被派往空余席位。"
 cm__fa_gov_prepare_sites_name: "允许准备新地区"
 cm__fa_gov_prepare_sites_desc: "优先考虑尚不能指派总督的所在地并为其做好整备，在当地建立城镇或城市并修建通往首都的道路。若禁用此项，则仅会考虑那些已是城市且拥有通往首都道路的所在地。"
 cm__map_modes_name: "地图模式"
 cm__map_modes__placement_finder_name: "推荐的首都与总督所在地"
 cm__map_modes__placement_finder_desc: "推荐总督与推荐首都选址地图模式的设置。"
 cm__placement_finder_method_name: "选址查找器评分"
 cm__placement_finder_method_desc: "推荐总督与推荐首都地图模式如何为您的地区排名。"
 cm__placement_finder_method_option_1_name: "税基"
 cm__placement_finder_method_option_1_desc: "按在该处设置总督或首都所能提高的总税基进行排序。越富裕的地区权重越高。"
 cm__placement_finder_method_option_2_name: "邻近度"
 cm__placement_finder_method_option_2_desc: "按在此处设置总督或首都所增加的邻近度排序。"
 cm__placement_finder_roads_name: "陆上基础设施"
 cm__placement_finder_roads_desc: "“推荐总督”和“推荐首都”地图模式是假设理想的陆地基础设施，还是使用你实际已建造的设施。"
 cm__placement_finder_roads_option_1_name: "当前"
 cm__placement_finder_roads_option_1_desc: "使用你实际建造的道路。"
 cm__placement_finder_roads_option_2_name: "最大道路"
 cm__placement_finder_roads_option_2_desc: "假设所有连接处均已建造你已解锁的最高等级道路。"
 cm__placement_finder_roads_option_3_name: "最佳可能"
 cm__placement_finder_roads_option_3_desc: "假设你已解锁的最佳道路已在每一条连接路径上建造，且每一个能提高陆地邻近度的已解锁建筑都已在所有符合条件的地点建造。"
 cm__placement_finder_naval_name: "海军基础设施"
 cm__placement_finder_naval_desc: "“推荐总督”与“推荐首都”地图模式是假设理想的海军基础设施，还是使用你当前的港口容量和海军存在。"
 cm__placement_finder_naval_option_1_name: "当前"
 cm__placement_finder_naval_option_1_desc: "使用您当前的港口容量和海军存在。"
 cm__placement_finder_naval_option_2_name: "最大存在"
 cm__placement_finder_naval_option_2_desc: "假设在当前港口容量下，各地均有完全的海军存在。"
 cm__placement_finder_naval_option_3_name: "最佳"
 cm__placement_finder_naval_option_3_desc: "假设完全的海军存在，并在每个沿海地区建造已解锁的最佳港口建筑。"
 cm__placement_finder_accuracy_name: "搜索精度"
 cm__placement_finder_accuracy_desc: "“建议总督”和“建议首都”地图模式搜索最佳地点的详尽程度。被跳过的地点将显示为黑色。"
 cm__placement_finder_accuracy_option_1_name: "详尽"
 cm__placement_finder_accuracy_option_1_desc: "评估所有地点。最准确，但速度最慢。"
 cm__placement_finder_accuracy_option_2_name: "彻底"
 cm__placement_finder_accuracy_option_2_desc: "跳过无法排入前三名的位置。前三名及其得分与“穷举”模式完全一致，但速度更快。"
 cm__placement_finder_accuracy_option_3_name: "均衡"
 cm__placement_finder_accuracy_option_3_desc: "跳过那些不可能是最佳选址的地点。最佳选址仍保证精确；第二和第三位的标记偶尔会有所出入。"
 cm__placement_finder_accuracy_option_4_name: "快速"
 cm__placement_finder_accuracy_option_4_desc: "同时跳过那些极不可能是最佳地点的选项。所找到的最佳地点与理论最佳地点的偏差在 20% 以内，且通常仍然是完全一致的。"
 cm__placement_finder_accuracy_option_5_name: "最快"
 cm__placement_finder_accuracy_option_5_desc: "评估每个省份中最具潜力的地点，然后围绕这些领先者进行精细化调整。大国运行速度更快，但可能会错过最佳地点。"
 cm__debug_name: "调试"
 cm__debug__logging_name: "行动日志"
 cm__debug__logging_desc: "本模组的哪些操作将被记录在模组操作日志中。"
 cm__log_cycle_name: "建设周期"
 cm__log_cycle_desc: "因上一周期仍在结算而跳过的月度周期，以及连续两次跳过后的重置。"
 cm__log_industry_name: "工业"
 cm__log_industry_desc: "工业类别排队的每座建筑和其考虑的每个原材料扩建条目，包含各自的回本周期与收益。"
 cm__log_collapsar_name: "价格崩盘"
 cm__log_collapsar_desc: "追踪单个地块在 Price Collapsar 周期中的记录：市场的短缺量与请求等级，以及该地块获得的分配、评分和建造情况。请先使用控制台命令 effect location:<key> = { cm_fa_col_watch_on = yes } 标记该地块。"
 cm__log_food_name: "自动粮食"
 cm__log_food_desc: "粮食类别详情：各市场的月度粮食供给、需求和比例，用于对比目标进行判定的年度比例中位数，该市场已在生产粮食的地点数量，以及其启用或禁用的每个地点。"
 cm__log_roads_name: "道路"
 cm__log_roads_desc: "为“道路”类别订购的每条道路显示一行，说明位置、购买该道路的三种原因之一以及所花费用。"
 cm__log_cleanup_name: "建筑清理"
 cm__log_cleanup_desc: "年度建筑清理流程记录：针对其关闭、削减、拆除或重新开启的每个建筑，列出其利润以及判定的底线标准。"
 cm__log_governors_name: "总督"
 cm__log_governors_desc: "总督计划的项目：选址与弃址、城镇与城市升级、布置、搬迁与拒绝，以及幸运国家的首都搬迁。"
 cm__log_military_name: "幸运国家军事"
 cm__log_military_desc: "幸运国家拆除要塞并建造人力建筑。"
 cm__log_government_name: "幸运国家政府"
 cm__log_government_desc: "幸运国家移除官僚机构或执行阶级行动的文本。"
 cm__debug__diagnostics_name: "诊断"
 cm__placement_finder_debug_path_name: "启用调试诊断"
 cm__placement_finder_debug_path_desc: "在“推荐总督”和“推荐首都”地图模式工具提示中添加一个诊断区块：显示从首都到每个地点的预测路径、每段路程的消耗，以及预测距离与实际距离的对比。"
 cm__debug__probes_name: "探针"
 cm__debug__probes_desc: "一次性诊断信息已写入MOD操作日志。"
 cm__probe_budget_name: "全自动化预算"
 cm__probe_budget_desc: "每个全自动化类别的余额（为正表示正在为尚未负担得起的选择预留资金，为负表示因超支而欠款）、工业回本期限，以及本周期跳过的市场中等待的最佳候选。"
 cm__probe_budget_text: "运行"
 cm__probe_governors_name: "总督规划"
 cm__probe_governors_desc: "总督规划的进度：其所处阶段、已占用和待安置的建筑位数量、是否占用国库、已支付的总督，以及其正在占用的槽位与席位。"
 cm__probe_governors_text: "运行"
 cm__probe_military_name: "幸运国军事"
 cm__probe_military_desc: "国家当前的人力建筑等级、是否可以建造、首都关联状态、军事预算，以及可建造该等级的地区数量与已拥有该等级的地区数量的对比。"
 cm__probe_military_text: "运行"
 cm__probe_industry_anchors_name: "工业锚点"
 cm__probe_industry_anchors_desc: "每种商品各占一行，列出工业记录的最佳回本时间及由此设定的回本限额，并标明相关的建筑与地点。"
 cm__probe_industry_anchors_text: "运行"
 cm__probe_industry_rgo_name: "工业原材料"
 cm__probe_industry_rgo_desc: "每一行显示工业略过该地原材料的一个原因，若未略过则仅显示一行。除非使用控制台命令 effect location:<key> = { cm_fa_col_watch_on = yes } 标记特定地区，否则读取首都。"
 cm__probe_industry_rgo_text: "运行"
 cm__probe_collapsar_name: "价格坍缩"
 cm__probe_collapsar_desc: "Price Collapsar 在某地读取的所有数值，每个都显示在游戏自身读取值的旁边，随后是该地市场在一个周期内可以吸收的量。除非你通过控制台命令 effect location:<key> = { cm_fa_col_watch_on = yes } 标记特定地点，否则将读取首都；由于首都永远不会成为 Price Collapsar 的候选地，因此请标记一个它会进行建设的地点来查看其读取的数据。"
 cm__probe_collapsar_text: "运行"
 cm__probe_roads_name: "道路"
 cm__probe_roads_desc: "道路规划为邻近度、市场准入和首都连接分别保留的走廊数量、其中尚可开始建设的首都连接数量、已在建设中的道路数量，以及该类别池中剩余的数量。"
 cm__probe_roads_text: "运行"
 cm__probe_log_gate_name: "行动日志开关"
 cm__probe_log_gate_desc: "Price Collapsar 日志类别会显示两次，分别代表日志判定读取的状态与菜单存储的状态，以便显示在其中一处开启而在另一处关闭的类别。"
 cm__probe_log_gate_text: "运行"
