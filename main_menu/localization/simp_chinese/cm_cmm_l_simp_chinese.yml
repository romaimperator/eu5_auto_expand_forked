 # Mod
 cm_name: "建设管理器"
 cm_desc: "一个大型生活质量改进模组，增加了全新的自动化、筛选器和地图模式，极大提升了 EU5 的建设体验。"

 # Settings (settings) Tab
 ## Global Control (settings) Group
 cm__pause_auto_expand_name: "暂停自动化"
 cm__pause_auto_expand_desc: "暂停本模组添加的所有自动化功能。"
 cm__minimum_gold_name: "黄金储备"
 cm__minimum_gold_desc: "任何自动化都不会使您的国库余额低于此金额。"
 cm__minimum_gold_format: "[CMMV('cm__minimum_gold')]@gold!"
 cm__allowed_building_overbuild_levels_name: "超建上限"
 cm__allowed_building_overbuild_levels_desc: "设定一个地点在停止将新建筑加入建造队列之前，允许其超过“可支持建筑等级”上限的总等级数。食物、总督及位于他国地点的建筑不受此限。设置为 0 时，不允许任何超限建造；设置为 200+ 时，则没有限制。"

 ## Priority List Group
 cm__priority_list_item_column_name: "功能"
 cm__priority_list_i1_name: "已启用自动扩建的建筑"
 cm__priority_list_i1_desc: "当有利可图、有可用人口且黄金高于你的黄金储备时，自动扩建多级生产与非生产类建筑。适用于在特定地点或针对整个建筑类型开启了自动扩建的情况，包括位于其他国家地点的外国建筑。"
 cm__priority_list_i2_name: "已启用自动扩建的 RGO"
 cm__priority_list_i2_desc: "当劳工可用且资源允许时，在已开启自动扩建资源采集点的地点自动提升资源采集点等级。"
 cm__priority_list_i3_name: "在已启用的地点自动扩建粮食"
 cm__priority_list_i3_desc: "在你开启了自动食物功能的乡村地块中自动建造生产食物的 RGO 和建筑，并选择食物产出效率最高的选项。"
 cm__priority_list_i4_name: "自动升级所有建筑"
 cm__priority_list_i4_desc: "自动升级所有已过时的建筑，无论该建筑是否启用了自动扩张。"
 cm__priority_list__enabled_name: "$cm_txt_enabled$"
 cm__priority_list__enabled_desc: "启用或禁用此功能。"
 cm__priority_list__min_profit_name: "最低税收收入"
 cm__priority_list__min_profit_desc: "在建设排队前每级所需的最低月度金币。设置为 0 以禁用此项检查。"
 cm__priority_list__min_profit_postfix: "@gold!"
 cm__priority_list__min_discount_name: "$cm_txt_min_discount$"
 cm__priority_list__min_discount_desc: "$cm_txt_min_discount_desc$"
