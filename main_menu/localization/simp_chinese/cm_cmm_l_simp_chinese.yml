l_simp_chinese:
 # Mod
 cm_name: "建设管理器"
 cm_desc: "一个大型游戏体验优化 (QoL) 模组，通过增加全新的自动化功能、筛选器和地图模式，极大地提升了 EU5 的建造体验。"

 # Settings (settings) Tab
 cm__settings_name: "设置"
 ## Global Control (settings) Group
 cm__pause_auto_expand_name: "暂停自动化"
 cm__pause_auto_expand_desc: "暂停所有自动化功能：自动扩建建筑、自动扩建 RGO、升级所有建筑、自动建造、自动建造都城建筑、自动粮食管理、自动城镇化、自动授予城镇权利，以及全面自动化。"
 cm__minimum_gold_name: "黄金储备"
 cm__minimum_gold_desc: "需保留的最低黄金储备。适用于除“全自动化”以外的所有自动化功能。"
 cm__minimum_gold_format: "[CMMV('cm__minimum_gold')]@gold!"
 cm__allowed_building_overbuild_levels_name: "超建上限"
 cm__allowed_building_overbuild_levels_desc: "地点在自动扩张停止排队新建设之前，可以超过其“支持的建筑等级”上限的总建筑等级数。设为 0 时，不允许任何超限建筑。设为 200+ 时，则没有限制。"

 ## Priority List Group
 cm__settings__priority_list_name: "建筑自动化"
 cm__settings__priority_list_desc: "拖动以重新排序功能优先级。每个月，已启用的功能将按从上到下的顺序运行，但“自动城市化”除外，它始终在所有其他功能及“完全自动化”之后最后运行。"
 cm__priority_list_item_column_name: "功能"
 cm__priority_list_i1_name: "自动扩建建筑"
 cm__priority_list_i1_desc: "当盈利、有人口可用且金币保持在你的黄金储备之上时，自动扩建多级生产与非生产建筑。适用于针对特定地区或整个建筑类型开启了自动扩建的情况，包括位于其他国家地区的外国建筑。"
 cm__priority_list_i2_name: "自动扩建资源采集点"
 cm__priority_list_i2_desc: "当劳工可用且资源允许时，在已开启自动扩建资源采集点的地点自动提升资源采集点等级。"
 cm__priority_list_i3_name: "自动建造"
 cm__priority_list_i3_desc: "根据“自动建造”选项卡中配置的顺序和设置，自动建造首府建筑以及每地限建一个的建筑（如议事厅、图书馆等）。"
 cm__priority_list_i4_name: "自动粮食"
 cm__priority_list_i4_desc: "在农村地区自动建造生产粮食的 RGO 与建筑，并选取粮食产出效率最高的选项。可在“自动粮食”页签中进行配置。"
 cm__priority_list_i5_name: "自动城市化"
 cm__priority_list_i5_desc: "每月升级地点等级：乡村定居点升级为城镇，城镇升级为城市，城市升级为巨型都市。跳过被征服的地点。在“自动城市化”选项卡中进行配置。"
 cm__priority_list_i6_name: "自动升级所有建筑"
 cm__priority_list_i6_desc: "自动升级所有已过时的建筑，无论该建筑是否启用了自动扩建。"
 cm__priority_list__enabled_name: "已启用"
 cm__priority_list__enabled_desc: "启用或禁用此功能。"
 cm__priority_list__min_profit_name: "最低税收收入"
 cm__priority_list__min_profit_desc: "在建设排队前每级所需的最低月度金币。设置为 0 以禁用此项检查。"
 cm__priority_list__min_profit_postfix: "@gold!"
 cm__priority_list__min_discount_name: "最小折扣"
 cm__priority_list__min_discount_desc: "允许的最大建筑材料价格涨幅。设置为 -33% 时，仅在材料价格低于基准价格 33% 时进行建造；设置为 0% 时，仅在不高于基准价格时进行建造；设置为 +33% 时，即使价格高出基准价格 33% 也会进行建造。"
 cm__priority_list__min_discount_postfix: "%"
 cm__priority_list__min_discount_prefix_high: "#R "
 cm__priority_list__min_discount_postfix_high: "%#!"
 cm__priority_list__min_discount_prefix_low: "#G "
 cm__priority_list__min_discount_postfix_low: "%#!"

