l_simp_chinese:
 # Mod
 cm_name: "建设管理器"
 cm_desc: "一个大型易用性增强模组，添加了全新的自动化功能、筛选器和地图模式，极大地优化了 EU5 的建造体验。"

 # Settings (settings) Tab
 cm__settings_name: "设置"
 ## Global Control (settings) Group
 cm__pause_auto_expand_name: "暂停自动化"
 cm__pause_auto_expand_desc: "暂停所有自动化功能：自动扩建建筑、自动扩建RGO、升级所有建筑、自动建造、自动补粮以及自动城市化。"
 cm__minimum_gold_name: "黄金储备"
 cm__minimum_gold_desc: "需保留的最低金币储备。若建设开支会导致国库低于此数值，则不会将其加入建设队列。此设置适用于除自动城市化升级（其拥有独立的金币设置）以外的所有自动化功能。"
 cm__minimum_gold_format: "[CMMV('cm__minimum_gold')]@gold!"
 cm__allowed_building_overbuild_levels_name: "超建上限"
 cm__allowed_building_overbuild_levels_desc: "一个地点在自动扩建停止加入新建设队列前，允许超出其“支持建筑等级上限”的总建筑等级。若设为0，则不允许任何超量建设。"

 ## Priority List Group
 cm__settings__priority_list_name: "建筑自动化"
 cm__settings__priority_list_desc: "拖动以重新排列功能优先级。每月，启用的功能将按从上到下的顺序运行。对于自动扩建，每个功能旁边的数值代表扩建在建造前必须达到的优劣标准，衡量依据为您在“自动扩建指标”中选择的度量方式：对于“税收收入”和“利润”，指每级每月的最低金币收益；对于“投资回报率 (ROI)”，指回收建设成本的最长年限（0 = 禁用）。“最小折扣”设置了允许的最高建筑材料加价幅度（-33% = 仅在便宜时，0 = 按基准价格，+33% = 即使在价格上涨时）。"
 cm__priority_list_item_column_name: "功能"
 cm__priority_list_i1_name: "自动扩建建筑"
 cm__priority_list_i1_desc: "当盈利、有可用人口且黄金高于黄金储备时，自动扩建多级生产与非生产建筑。仅适用于已开启自动扩建的地点。"
 cm__priority_list_i2_name: "自动扩建资源采集点"
 cm__priority_list_i2_desc: "当劳工可用且资源允许时，在已开启自动扩建资源采集点的地点自动提升资源采集点等级。"
 cm__priority_list_i3_name: "自动升级所有建筑"
 cm__priority_list_i3_desc: "自动升级所有已过时的建筑，无论该建筑是否启用了自动扩建。"
 cm__priority_list_i4_name: "自动建造"
 cm__priority_list_i4_desc: "根据在“自动建造”页签中配置的顺序和设置，自动建造每地限建一座的建筑（如议会、图书馆等）。"
 cm__priority_list_i5_name: "自动粮食"
 cm__priority_list_i5_desc: "自动在乡村地区建造产粮 RGO 与建筑，并选取边际粮食产量最高的一项。可在“自动产粮”页签中进行配置。"
 cm__priority_list_i6_name: "自动城市化"
 cm__priority_list_i6_desc: "每月提升地区等级：将乡村定居点提升为城镇，将城镇提升为城市。乡村提升至城镇的要求为：拥有 30,000 人口（即刻具备城市化资格），或距离人口上限不足 1,000（否则增长将在乡村上限处停滞）。跳过未整合地区。可在“自动城市化”页签中配置。"
 cm__priority_list_i7_name: "自动建造首都建筑"
 cm__priority_list_i7_desc: "当条件允许时，自动在你的都城所在地建造仅限都城的建筑（宫廷、最高法院、战争学院等）。"
 cm__priority_list__enabled_name: "已启用"
 cm__priority_list__enabled_desc: "启用或禁用此功能。已禁用的功能每月将被跳过。"
 cm__priority_list__min_profit_name: "最低税收收入"
 cm__priority_list__min_profit_desc: "在建设排队前每级所需的最低月度金币。设置为 0 以禁用此项检查。"
 cm__priority_list__min_profit_postfix: "@gold!"
 cm__priority_list__min_discount_name: "最小折扣"
 cm__priority_list__min_discount_desc: "允许的最大建筑材料价格涨幅。设置为 -33% 时，仅在材料价格低于基准价格 33% 时进行建造；设置为 0% 时，仅在不高于基准价格时进行建造；设置为 +33% 时，即使价格高出基准价格 33% 也会进行建造。"
 cm__priority_list__min_discount_postfix: "%"
 cm__priority_list__min_discount_prefix_high: "#R "
 cm__priority_list__min_discount_postfix_high: "%#!"
 cm__priority_list__min_discount_prefix_low: "#G "
 cm__priority_list__min_discount_postfix_low: "%#!"

