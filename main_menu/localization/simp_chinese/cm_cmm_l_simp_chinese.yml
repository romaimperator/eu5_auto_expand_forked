 cm__expand_metric_name: "自动扩建指标"
 cm__expand_metric_desc: "选择自动扩建用于判定是否增加建筑或RGO等级的依据。“税收收入”与“利润”可设定每级每月的最小金币收益；“投资回报率 (ROI)”选项则可设定收回建设成本所需的最大年限。"
 cm__expand_metric_option_1_name: "@income! 税收"
 cm__expand_metric_option_1_desc: "仅当其每月税收收入至少为您设置的最小税收收入时，才增加一个新等级。"
 cm__expand_metric_option_2_name: "@wealth! 利润"
 cm__expand_metric_option_2_desc: "仅在其每月总利润不低于你设定的最小利润时，才增加一级。"
 cm__expand_metric_option_3_name: "@efficiency! 投资回报 (税收)"
 cm__expand_metric_option_3_desc: "仅当税收收入能在您设置的最大投资回报年限内收回建设成本时，才增加一个新等级。"
 cm__expand_metric_option_4_name: "@efficiency! 投资回报率 (利润)"
 cm__expand_metric_option_4_desc: "仅当利润能在您设定的最大投资回报年限内收回建造费用时，才添加新等级。"
