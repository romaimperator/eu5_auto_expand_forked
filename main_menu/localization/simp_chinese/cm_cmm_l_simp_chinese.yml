 cm__auto_grant_town_rights: "cm__auto_grant_town_rights"
 cm__auto_town_rights_list: "cm__auto_town_rights_list"
 cm__auto_town_rights_list__enabled: "cm__auto_town_rights_list__enabled"
 cm__expand_metric_name: "自动扩建指标"
 cm__expand_metric_desc: "选择自动扩展用于决定是否增加建筑或 RGO 等级的依据。"
 cm__expand_metric_option_1_name: "@income! 税收"
 cm__expand_metric_option_1_desc: "仅当其每月税收收入至少为您设置的最小税收收入时，才增加一个新等级。"
 cm__expand_metric_option_2_name: "@wealth! 利润"
 cm__expand_metric_option_2_desc: "仅在其每月总利润不低于你设定的最小利润时，才增加一级。"
 cm__expand_metric_option_3_name: "@efficiency! 投资回报 (税收)"
 cm__expand_metric_option_3_desc: "仅当税收收入能在您设置的最大投资回报年限内收回建设成本时，才增加一个新等级。"
 cm__expand_metric_option_4_name: "@efficiency! 投资回报率 (利润)"
 cm__expand_metric_option_4_desc: "仅当利润能在您设定的最大投资回报年限内收回建造费用时，才添加新等级。"
 cm__auto_town_rights_list_i32_name: "@market_charter! [ShowTownRightsName('market_charter')]"
 cm__auto_town_rights_list_i33_name: "@free_town_charter! [ShowTownRightsName('free_town_charter')]"
 cm__auto_town_rights_list_i34_name: "@fortress_town! [ShowTownRightsName('fortress_town')]"
 cm__auto_town_rights_list_i35_name: "@mining_charter! [ShowTownRightsName('mining_charter')]"
 cm__auto_town_rights_list_i36_name: "@studium_privileges! [ShowTownRightsName('studium_privileges')]"
 cm__auto_town_rights_list_i37_name: "@agrarian_community_town_right! [ShowTownRightsName('agrarian_community_town_right')]"
 cm__auto_town_rights_list_i38_name: "@enlightened_leadership_reform_town_right! [ShowTownRightsName('enlightened_leadership_reform_town_right')]"
 cm__expand_metric: "cm__expand_metric"
 cm__town_rights_free_grants_name: "移除城镇权利开销"
 cm__town_rights_free_grants_desc: "开启时，授予城市权利不消耗政府权力，撤回城市权利不消耗稳定度。"
 cm__town_rights_min_gov_power_name: "最低政府权力"
 cm__town_rights_min_gov_power_desc: "当下次授予会导致你的政府力量（正统性、共和传统、虔诚或部落团结，取决于政府类型）低于此值时，自动授予将停止授予城市权利。"
 cm__allowed_building_overbuild_levels_format: "[CMMV('cm__allowed_building_overbuild_levels')][Select_CString(GreaterThanOrEqualTo_CFixedPoint(CMMV('cm__allowed_building_overbuild_levels'), CMMMapValue('cmm_max', 'cm__allowed_building_overbuild_levels')), '+', '')]"
 cm__auto_build_capital_name: "首都建筑"
 cm__auto_build_capital_desc: "当条件允许时，在你的首都所在地自动建造仅限首都的建筑（王室法庭、最高法院、战争学院等）。这些建筑会先于下方列表进行建造。"
 cm__urbanize_city_to_megalopolis_name: "城市至特大城市"
 cm__urbanize_city_to_megalopolis_desc: "当首都成为拥有至少400,000人口的市场中心城市时，将其升级为巨型都市。"
 cm__megalopolis_ignore_capital_name: "巨型都市：忽略首都要求"
 cm__megalopolis_ignore_capital_desc: "允许你在非首都城市中建造“建立大都市”。"
 cm__megalopolis_ignore_market_center_name: "巨型都市：忽略市场中心需求"
 cm__megalopolis_ignore_market_center_desc: "允许你在非市场中心的城市中建造“建立巨型都市”。"
 cm__deurbanize_name: "去城市化"
 cm__deurbanize_desc: "每月，当所拥有的地区的RGO产出在下方的“禁止城市化”列表中被勾选时，将其降级回乡村定居点。您的首都、被征服的地区以及提供邻近度的地区（如总督驻地）将不受影响。"
 cm__auto_urbanize_ignore_list_i20_name: "@wool! [ShowGoodsName('wool')] ([GetGlobalVariable('cm_goods_wool').GetGoods.GetDefaultMarketPrice]@gold!)"
 cm__full_automation_name: "完全自动化"
 cm__full_automation__full_automation_name: "完全自动化"
 cm__full_automation__full_automation_desc: "自动建设。每月，下列类别将动用国库中超出黄金储备的资金，用于当前可用的最佳建设。该功能与其他自动化功能并行，且不会更改它们的设置。"
 cm__fa_enabled_name: "启用全自动化"
 cm__fa_enabled_desc: "开启或关闭全自动。"
 cm__fa_reserve_name: "黄金储备"
 cm__fa_reserve_desc: "完全自动化永远不会使你的国库余额低于此金额。这与“设置”标签页中的黄金储备是分开的。"
 cm__fa_reserve_format: "[CMMV('cm__fa_reserve')]@gold!"
 cm__fa_save_unaffordable_name: "为无法负担的建筑预留资金"
 cm__fa_save_unaffordable_desc: "该类别即使在建筑成本超过其当月份额时也会购买其发现的最优建筑，并在之后的月份补足差额前不再支出。关闭时，每个类别仅支出其所能支付的部分，并将剩余资金向下传递。"
 cm__full_automation__fa_priority_list_name: "优先级"
 cm__full_automation__fa_priority_list_desc: "拖动以重新排序。每月按自上而下的顺序处理各个类别。若两个类别需要建造同一建筑，则由排序靠前者建造。"
 cm__fa_priority_list_item_column_name: "分类"
 cm__fa_priority_list_i1_name: "粮食"
 cm__fa_priority_list_i1_desc: "监控你拥有其市场中心的市场全年的粮食供应情况，并在月份中位数供应不足时，在粮食潜力最高的地点启用自动粮食生产。系统选中的地点会像玩家手动启用的一样发光，但开关仍由你控制；除非该地点不再是你拥有的乡村定居点，或你不再拥有其市场中心，否则它们绝不会被关闭。"
 cm__fa_priority_list_i2_name: "工业"
 cm__fa_priority_list_i2_desc: "建造、扩张及升级通过税收收入回本最快的生产建筑与资源采集点 (RGO)。若某地任何类型的工人都已短缺，则不会对运行自动产粮的地点进行改动。"
 cm__fa_priority_list_i3_name: "价格塌缩"
 cm__fa_priority_list_i3_desc: "扩大建筑材料的生产以压低其价格。在你拥有市场中心的市场中生效。产出效率最高的地点将优先扩建，且每次会提升数个等级；即使在工人尚未到位的地点，生产设施也会开始建设。你的首都、生产粮食的地点，以及若无补贴就会亏损的生产设施均会被跳过。"
 cm__fa_priority_list_i4_name: "道路"
 cm__fa_priority_list_i4_desc: "建设金币性价比最高的道路网络，衡量标准涵盖道路带来的三项收益：邻近度、市场准入度以及将地点连接至首都。系统每年会为您的每个地点计算出针对这三项的最佳路径，随后每月开始铺设能提升最多税基的路段，并计入该路段后方路径上的所有后续收益。廉价的平原走廊会优先铺设，只有当优先级较高的项目在本月无路可铺时，下方的两项才会获得资金。"
 cm__fa_priority_list_i5_name: "公用设施"
 cm__fa_priority_list_i5_desc: "在所有合适的位置建造配套基础设施：首都建筑、自动建造名录、汞齐化场、市场中心建筑、司法官以及你国家拥有的任何提高控制力的独特建筑、市场、防疫建筑，最后是粮仓。控制类建筑优先建造在最富裕的地点，而市场优先建造在市场准入度最低的地点。"
 cm__fa_priority_list_i6_name: "建筑清理"
 cm__fa_priority_list_i6_desc: "每年一次，关闭已停止盈利且未获得补贴的生产建筑，若所在地处于其支持建筑等级的十级以内，则改为将其拆除。被关闭的建筑在该市场同类建筑再次盈利后将重新开启，若所在地空间耗尽，则随后会被拆除。@farming_village! [ShowBuildingTypeNameWithNoTooltip('farming_village')] 绝不会被关闭或拆除。"
 cm__fa_priority_list_i7_name: "总督"
 cm__fa_priority_list_i7_desc: "规划总督驻地并将其派往该处，优先选择最佳位置。每当总督席位空缺时，或在其他情况下每隔二十五年，都会重新进行规划。仅限单人模式。"
 cm__fa_priority_list_i8_name: "城市权利"
 cm__fa_priority_list_i8_desc: "在你的所有城镇和城市中授予城市权利。首先是 [ShowTownRightsNameWithNoTooltip('granary_town')]，随后从适合该地所产商品的权利中随机抽取一项专业化权利。"
 cm__fa_priority_list__budget_name: "预算份额"
 cm__fa_priority_list__budget_desc: "此类别每月可支出的超出黄金储备部分的国库份额。"
 cm__fa_priority_list__budget_postfix: "%"
 cm__fa_priority_list__enabled_name: "已启用"
 cm__fa_priority_list__enabled_desc: "允许此类别建造。"
 cm__full_automation__fa_industry_name: "工业"
 cm__full_automation__fa_industry_desc: "上方工业类别的设置。"
 cm__fa_industry_algorithm_name: "建造策略"
 cm__fa_industry_algorithm_desc: "工业如何选择建造内容。"
 cm__fa_industry_algorithm_option_1_name: "贪婪"
 cm__fa_industry_algorithm_option_1_desc: "优先建造回本最快的选项，且仅限那些与该商品最佳产地条件相近的地点。"
 cm__fa_industry_max_rel_roi_name: "最大相对投资回报率"
 cm__fa_industry_max_rel_roi_desc: "设定建筑或升级相对于生产相同货物的最佳地点，其成本回本速度慢出多少比例时仍可被建造。若设为 30%，且最佳地点在 10 年内回本，则仅建造能在 13 年内回本的建筑；任何更慢的都会等待。若设为 0%，每月仅建造每种货物的最佳生产设施。若设为 100% 以上，则不设限制，仅受“最大回本年数”约束。无论建筑种类如何，所有生产相同货物的建筑都将统一评估。RGO 的扩张始终按回本顺序建造。"
 cm__fa_industry_max_rel_roi_format: "[CMMV('cm__fa_industry_max_rel_roi')]%[Select_CString(GreaterThanOrEqualTo_CFixedPoint(CMMV('cm__fa_industry_max_rel_roi'), CMMMapValue('cmm_max', 'cm__fa_industry_max_rel_roi')), '+', '')]"
 cm__fa_industry_min_roi_name: "最大回本年数"
 cm__fa_industry_min_roi_desc: "仅考虑其税收收入能在该年限内回收建造成本的建筑。设置为 0 以禁用此项检查。"
 cm__fa_industry_min_roi_format: "[CMMV('cm__fa_industry_min_roi')]年 @efficiency!"
 cm__full_automation__fa_collapsar_name: "价格坍缩"
 cm__full_automation__fa_collapsar_desc: "以上价格折叠分类的设置。材料按列表从上到下的顺序处理，且 RGO 的扩建优先于生产建筑。"
 cm__fa_collapsar_target_name: "目标价格"
 cm__fa_collapsar_target_desc: "材料停止建设的价格，相对于其基础价格。设置为 -33% 时，将持续建造生产建筑，直到该材料的交易价格低于基础价格 33%。设置为 0% 时，建造将持续到其达到基础价格为止。设置为 +33% 时，仅当其价格高于基础价格 33% 以上时才会进行建造。"
 cm__fa_collapsar_target_format: "[CMMV('cm__fa_collapsar_target')]%"
 cm__fa_collapsar_item_column_name: "材料"
 cm__fa_collapsar_i1_name: "@masonry! [ShowGoodsName('masonry')]"
 cm__fa_collapsar_i2_name: "@lumber! [ShowGoodsName('lumber')]"
 cm__fa_collapsar_i3_name: "@sand! [ShowGoodsName('sand')]"
 cm__fa_collapsar_i4_name: "@glass! [ShowGoodsName('glass')]"
 cm__fa_collapsar__enabled_name: "已启用"
 cm__fa_collapsar__enabled_desc: "致力于降低该物资的价格。"
 cm__full_automation__fa_food_name: "粮食"
 cm__full_automation__fa_food_desc: "上方粮食类别的设置。"
 cm__fa_food_target_name: "盈余目标"
 cm__fa_food_target_desc: "市场将增加更多粮食产地，直到其供给达到此需求比例。设为 125% 时，若某市场一年中月度中位数未达到 25% 的盈余，则会扩张其粮食生产。调高此值可保留更多缓冲，调低此值则仅帮助更接近短缺的市场。"
 cm__fa_food_target_format: "[CMMV('cm__fa_food_target')]%"
 cm__fa_food_min_potential_name: "最低粮食潜力"
 cm__fa_food_min_potential_desc: "仅在每个RGO等级的粮食潜力达到此分值的地点启用自动粮食功能，该分值与$mapmode_cm_location_food_potential_name$地图模式显示的分值相同。调高此值以保留给更优质的农田，调低此值以接受产出较弱的土地。"
 cm__fa_food_min_potential_format: "[CMMV('cm__fa_food_min_potential')]"
 cm__full_automation__fa_urban_rights_name: "城市权利"
 cm__full_automation__fa_urban_rights_desc: "上方城市权利类别的设置。"
 cm__fa_urban_rights_window_name: "适应度阈值"
 cm__fa_urban_rights_window_desc: "决定专业化特权进入候选名单所需的适配程度（相对于该地区最适配的特权）。设置为50%时，任何适配度至少达到最佳特权一半的特权都可能被选取，且适配度越高，被选取的频率越高。设置为100%时，仅会授予最适配的特权。"
 cm__fa_urban_rights_window_format: "[CMMV('cm__fa_urban_rights_window')]%"
 cm__fa_urban_rights_reserve_name: "政府力量储备"
 cm__fa_urban_rights_reserve_desc: "若支付费用会导致你的政府权力（正统性、共和传统、虔诚或部落团结，视政府类型而定）低于该值，则不会授予城市权利。"
 cm__fa_urban_rights_expand_name: "扩建受强化的工业"
 cm__fa_urban_rights_expand_desc: "当授予一项专业化特权时，同时也为该地点中受该特权强化的产业及其生产的原材料开启自动扩张。这与在“推荐城市特权”地图上右键点击授予按钮的效果相同。"
 cm__full_automation__fa_cleanup_name: "建筑清理"
 cm__full_automation__fa_cleanup_desc: "上方建筑清理类别的设置。"
 cm__fa_cleanup_min_profit_name: "最低利润"
 cm__fa_cleanup_min_profit_desc: "每月收益低于此值的建筑将被视为不值得运行，除非获得补贴，否则将被关闭或拆除。在一个市场中，同类建筑每次最多只有一半的开放建筑会被同时处理。"
 cm__fa_cleanup_min_profit_format: "[Divide_CFixedPoint(CMMV('cm__fa_cleanup_min_profit'), '(CFixedPoint)100')|2]@gold!"
 cm__fa_cleanup_core_goods_name: "优先建筑材料"
 cm__fa_cleanup_core_goods_desc: "将主要消耗 @masonry![ShowGoodsNameWithNoTooltip('masonry')]、@lumber![ShowGoodsNameWithNoTooltip('lumber')]、@sand![ShowGoodsNameWithNoTooltip('sand')] 或 @glass![ShowGoodsNameWithNoTooltip('glass')] 的建筑维持在两倍最低利润或 0.1@gold!，以较高者为准。生产这四种资源之一的建筑则按常规最低利润进行评判。"
 cm__fa_cleanup_auto_food_name: "清除自动粮食位置"
 cm__fa_cleanup_auto_food_desc: "在自动粮食供应运行且任何类型的劳动力已经短缺时，拆除不产出粮食的生产建筑。@market_village! [ShowBuildingTypeNameWithNoTooltip('market_village')] 将被削减至一级而非拆除。"
 cm__full_automation__fa_roads_name: "道路"
 cm__full_automation__fa_roads_desc: "上方道路类别的设置。"
 cm__fa_roads_proximity_name: "接近度"
 cm__fa_roads_proximity_desc: "铺设单位金币提升贴近度最高的路段，并计入路径后方的每一个地点。"
 cm__fa_roads_market_access_name: "市场准入"
 cm__fa_roads_market_access_desc: "铺设提升单位金钱市场准入度最高的道路段。仅在当月已无可铺设的提升接近度的道路段时才会进行此类花费。"
 cm__fa_roads_capital_name: "首都连接"
 cm__fa_roads_capital_desc: "铺设路段以将你的所在地连接至首都，从已连接的地区向外扩展。仅在邻近度和市场准入路段已无剩余可铺设时，才会在该月进行花费。"
 cm__full_automation__fa_governors_name: "总督"
 cm__full_automation__fa_governors_desc: "上方总督类别的设置。"
 cm__fa_gov_move_seats_name: "允许调动总督"
 cm__fa_gov_move_seats_desc: "当所有总督槽位已满时，撤下一名总督并在更优的位置重新指派。该位置必须已是城市，或者评分比被替换的位置高出 10% 以上。若关闭此项，总督将仅进入空余槽位。"
 cm__fa_gov_prepare_sites_name: "允许准备新地点"
 cm__fa_gov_prepare_sites_desc: "考虑那些尚不能指派总督的地区并优先使其准备就绪，在当地建立城镇或城市，并修建通往首都的道路。若关闭此项，则仅考虑那些已经是城市且拥有通往首都道路的地区。"
 cm__map_modes_name: "地图模式"
 cm__map_modes__placement_finder_name: "推荐首都与总督驻地"
 cm__map_modes__placement_finder_desc: "推荐总督与推荐首都布局地图模式的设置。"
 cm__placement_finder_method_name: "选址器评分"
 cm__placement_finder_method_desc: "推荐总督和推荐首都地图模式如何为你的区块进行排名。"
 cm__placement_finder_method_option_1_name: "税基"
 cm__placement_finder_method_option_1_desc: "按在该处安置总督或首都能增加的总税基进行排序。越富裕的地点权重越高。"
 cm__placement_finder_method_option_2_name: "邻近度"
 cm__placement_finder_method_option_2_desc: "按在此处设立总督或首都所能增加的邻近度排序。"
 cm__placement_finder_roads_name: "陆地基础设施"
 cm__placement_finder_roads_desc: "“推荐总督”和“推荐首都”地图模式是假设理想的陆上基础设施，还是使用你实际已建造的设施。"
 cm__placement_finder_roads_option_1_name: "当前"
 cm__placement_finder_roads_option_1_desc: "使用你实际建造的道路。"
 cm__placement_finder_roads_option_2_name: "最大道路"
 cm__placement_finder_roads_option_2_desc: "假设在所有连接处都已建造了你所解锁的最高级道路。"
 cm__placement_finder_roads_option_3_name: "最佳可能"
 cm__placement_finder_roads_option_3_desc: "假设已解锁的最佳道路已在每个连接处建成，且所有已解锁的提高陆上邻近度的建筑已在所有符合条件的地点建成。"
 cm__placement_finder_naval_name: "海军基础设施"
 cm__placement_finder_naval_desc: "“推荐总督”和“推荐首都”地图模式是假设理想的海军基础设施，还是使用你当前的港口容量和海军存在。"
 cm__placement_finder_naval_option_1_name: "当前"
 cm__placement_finder_naval_option_1_desc: "使用你当前的海港容量和海军存在。"
 cm__placement_finder_naval_option_2_name: "最大影响力"
 cm__placement_finder_naval_option_2_desc: "假定在各地都拥有满额的海军存在，并使用当前的港口容量。"
 cm__placement_finder_naval_option_3_name: "最佳可能"
 cm__placement_finder_naval_option_3_desc: "假设海军全面存在，并在每个沿海地块建造了你已解锁的最好的港口建筑。"
 cm__placement_finder_accuracy_name: "搜索精度"
 cm__placement_finder_accuracy_desc: "“推荐总督”和“推荐首都”地图模式搜索最佳位置的详尽程度。跳过的位置将显示为黑色。"
 cm__placement_finder_accuracy_option_1_name: "彻底"
 cm__placement_finder_accuracy_option_1_desc: "评估每个地域。最准确，速度最慢。"
 cm__placement_finder_accuracy_option_2_name: "彻底"
 cm__placement_finder_accuracy_option_2_desc: "跳过无法排入前三名的地点。前三名及其得分与“穷举”模式完全一致，但速度更快。"
 cm__placement_finder_accuracy_option_3_name: "均衡"
 cm__placement_finder_accuracy_option_3_desc: "跳过那些无法成为唯一最佳地点的地点。最佳地点仍保证准确；第二和第三名的标记偶尔可能会有出入。"
 cm__placement_finder_accuracy_option_4_name: "快速"
 cm__placement_finder_accuracy_option_4_desc: "同时也跳过那些极不可能是最佳的地块。所找到的最佳地块与实际最佳地块的误差在 20% 以内，且通常仍是完全一致的。"
 cm__placement_finder_accuracy_option_5_name: "最快"
 cm__placement_finder_accuracy_option_5_desc: "评估每个省份中最具潜力的地点，然后围绕领先地点进行细化。对大国而言速度快得多；可能会错过最佳地点。"
 cm__debug_name: "调试"
 cm__debug__logging_name: "操作日志"
 cm__debug__logging_desc: "该模组的哪些操作将被记录到模组操作日志中。"
 cm__log_cycle_name: "建设周期"
 cm__log_cycle_desc: "因前一周期仍在处理而跳过的月度周期，以及连续两次跳过后的重置。"
 cm__log_industry_name: "工业"
 cm__log_industry_desc: "工业类别自动建造的每一座建筑，以及其考虑的每一项原材料扩建，并附带各自的回本周期和收益。"
 cm__log_collapsar_name: "价格坍缩"
 cm__log_collapsar_desc: "追踪单个地点在一次价格崩塌周期中的记录：市场的短缺量及其请求的等级，以及该地点获得的分配、评分和建造。请先使用控制台命令 effect location:<key> = { cm_fa_col_watch_on = yes } 来标记该地点。"
 cm__log_food_name: "自动粮食"
 cm__log_food_desc: "粮食类目行：每个市场的月度粮食供应、需求和比率，用于对照目标进行评估的该比率年度中位数，已在其中生产粮食的地点数量，以及其启用或禁用的每个地点。"
 cm__log_roads_name: "道路"
 cm__log_roads_desc: "“道路”分类所订购的每条道路各占一行，列出地点、购买该道路的三种用途之一以及所费成本。"
 cm__log_cleanup_name: "建筑清理"
 cm__log_cleanup_desc: "年度建筑清理流程的日志项，包含其关闭、削减、摧毁或重新开启的每个建筑，以及各自的利润和作为判定依据的底线。"
 cm__log_governors_name: "总督"
 cm__log_governors_desc: "总督计划条目：选址的选取与放弃、城镇与城市升级、布局、搬迁与拒绝，以及幸运国家的迁都。"
 cm__log_military_name: "幸运国家军事"
 cm__log_military_desc: "幸运国家拆除要塞并建造人力建筑。"
 cm__log_government_name: "幸运国家政府"
 cm__log_government_desc: "幸运国家移除官僚机构或执行阶层行动的相关文本。"
 cm__debug__diagnostics_name: "诊断"
 cm__placement_finder_debug_path_name: "启用调试诊断"
 cm__placement_finder_debug_path_desc: "在“推荐总督”和“推荐首都”地图模式工具提示中添加一个诊断信息块：包含从首都到各地区的预测路线及每段跳点的成本，并将预测接近度与实际接近度进行对比。"
 cm__debug__probes_name: "探针"
 cm__debug__probes_desc: "写入 mod 操作日志的一次性诊断信息。"
 cm__probe_budget_name: "全自动化预算"
 cm__probe_budget_desc: "每个全自动类别的余额（正值表示正在为尚未负担得起的选择预留金币，负值表示因超支而欠款），以及工业投资回收限制和本周期跳过的市场中等待的最佳候选。"
 cm__probe_budget_text: "运行"
 cm__probe_governors_name: "总督计划"
 cm__probe_governors_desc: "总督计划的进度：其所处阶段、已持有和待部署的选址数量、是否正在占用国库、已支付费用的总督，以及其占用的槽位与席位。"
 cm__probe_governors_text: "运行"
 cm__probe_military_name: "幸运国家军事"
 cm__probe_military_desc: "国家当前的人力建筑等级、是否可以建造、首都对的状态、军事预算，以及可建造该等级的地点数量与已拥有该等级的地点数量。"
 cm__probe_military_text: "运行"
 cm__probe_industry_anchors_name: "工业锚点"
 cm__probe_industry_anchors_desc: "每种商品占一行，列出工业记录的该商品最佳投资回收情况及其设定的回收上限，并注明对应的建筑与位置。"
 cm__probe_industry_anchors_text: "运行"
 cm__probe_industry_rgo_name: "工业原材料"
 cm__probe_industry_rgo_desc: "工业跳过某地原始资源的每个原因各占一行，若未跳过则仅显示一行。除非使用控制台命令 effect location:<key> = { cm_fa_col_watch_on = yes } 标记了特定地点，否则默认读取首都信息。"
 cm__probe_industry_rgo_text: "运行"
 cm__probe_collapsar_name: "价格坍缩"
 cm__probe_collapsar_desc: "Price Collapsar 在某地点读取的每个数值，均列在游戏原生数值旁边，随后是该地点市场在一个周期内可吸收的量。除非使用控制台命令 effect location:<key> = { cm_fa_col_watch_on = yes } 标记一个地点，否则将读取首都；首都永远不会是 Price Collapsar 的候选对象，因此请标记一个地点以读取它将在其中建造时的数值。"
 cm__probe_collapsar_text: "运行"
 cm__probe_roads_name: "道路"
 cm__probe_roads_desc: "道路规划中针对邻近度、市场准入和首都连接各自包含的走廊数量，其中有多少个首都连接走廊目前可以启动，正在建造的道路数量，以及该类别资源池的剩余量。"
 cm__probe_roads_text: "运行"
 cm__probe_log_gate_name: "操作日志门限"
 cm__probe_log_gate_desc: "价格崩塌日志类别会出现两次，分别为日志闸门读取的状态和菜单存储的状态，因此在其中一处开启而在另一处关闭的类别会显示出来。"
 cm__probe_log_gate_text: "运行"
