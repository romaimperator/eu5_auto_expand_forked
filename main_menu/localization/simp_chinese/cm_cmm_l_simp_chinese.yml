 cm__dbg_run_custom_name: "运行自定义"
 cm__dbg_run_custom_desc: "$cm_txt_dbg_run_category_desc$" # NO-TRANSLATE
 cm__dbg_run_custom_text: "$cm_txt_run_now$" # NO-TRANSLATE
 cm__ab_core__ab_core_name: "$cm__ab_core_name$" # NO-TRANSLATE
 cm__ab_core__ab_core_desc: "核心商品设置。材料将按列表从上到下的顺序进行处理，且在扩建生产建筑之前会先扩建RGO。"
 cm__ab_core_target_name: "价格目标"
 cm__ab_core_target_desc: "停止某种材料施工的价格，相对于其基础价格。在 -33% 时，将持续建造生产设施，直到该材料的交易价格低于基础价格 33%。在 0% 时，持续建造直到其达到基础价格。在 +33% 时，仅当价格高于基础价格 33% 以上时才会建造。"
 cm__ab_core_target_format: "[CMMV('cm__ab_core_target')]%" # NO-TRANSLATE
 cm__ab_core_item_column_name: "材料"
 cm__ab_core_i1_name: "@masonry! [ShowGoodsName('masonry')]" # NO-TRANSLATE
 cm__ab_core_i2_name: "@lumber! [ShowGoodsName('lumber')]" # NO-TRANSLATE
 cm__ab_core_i3_name: "@sand! [ShowGoodsName('sand')]" # NO-TRANSLATE
 cm__ab_core_i4_name: "@glass! [ShowGoodsName('glass')]" # NO-TRANSLATE
 cm__ab_core__enabled_name: "$cm_txt_enabled$" # NO-TRANSLATE
 cm__ab_core__enabled_desc: "努力降低此物资的价格。"
 cm__ab_core__debug_name: "$cm_txt_debug$" # NO-TRANSLATE
 cm__dbg_run_core_name: "运行核心商品"
 cm__dbg_run_core_desc: "$cm_txt_dbg_run_category_desc$" # NO-TRANSLATE
 cm__dbg_run_core_text: "$cm_txt_run_now$" # NO-TRANSLATE
 cm__ab_food__ab_food_name: "$cm__ab_food_name$" # NO-TRANSLATE
 cm__ab_food_target_name: "盈余目标"
 cm__ab_food_target_desc: "市场将持续增加食物产地，直到其供应达到需求的这一比例。设定为 125% 时，若一个市场在一年中中位数月份的盈余未达到 25%，则会扩建食物产地。调高此值可维持更大的缓冲空间，调低此值则仅帮助更接近短缺的市场。"
 cm__ab_food_target_format: "[CMMV('cm__ab_food_target')]%" # NO-TRANSLATE
 cm__ab_food_min_potential_name: "最小食物潜力"
 cm__ab_food_min_potential_desc: "仅在每级 RGO 的粮食潜力达到该分值的地点开启自动粮食，该分值与 $mapmode_cm_location_food_potential_name$ 地图模式显示的一致。提高此值以保留给更好的农田，降低此值以接受产力较弱的土地。"
 cm__ab_food_min_potential_format: "[CMMV('cm__ab_food_min_potential')]" # NO-TRANSLATE
 cm__ab_food_subsidize_name: "补贴粮食建筑"
 cm__ab_food_subsidize_desc: "为“自动粮食”功能所建造的产粮建筑提供补贴。不盈利的建筑无法雇佣人手，也不会产出粮食，这会导致贫瘠土地上的农业村庄陷入闲置；提供补贴可使其维持人员编制并确保收成。补贴开启后将永不关闭。"
 cm__ab_food_run_now_name: "强制重新规划粮食"
 cm__ab_food_run_now_desc: "现在依据本月的粮食平衡及已采样的月份重新选择粮食产地，而非等待年度检查。"
 cm__ab_food_run_now_text: "$cm_txt_run_now$" # NO-TRANSLATE
 cm__ab_food__debug_name: "$cm_txt_debug$" # NO-TRANSLATE
 cm__dbg_run_food_name: "运行粮食"
 cm__dbg_run_food_desc: "$cm_txt_dbg_run_category_desc$" # NO-TRANSLATE
 cm__dbg_run_food_text: "$cm_txt_run_now$" # NO-TRANSLATE
 cm__ab_production__ab_production_name: "$cm__ab_production_name$" # NO-TRANSLATE
 cm__ab_production_algorithm_name: "建造策略"
 cm__ab_production_algorithm_desc: "生产如何选择建造内容。"
 cm__ab_production_algorithm_option_1_name: "贪婪"
 cm__ab_production_algorithm_option_1_desc: "优先建造回本最快的选项，且仅限那些接近同类商品最优产地的选项。"
 cm__ab_production_max_rel_roi_name: "最大相对投资回报率"
 cm__ab_production_max_rel_roi_desc: "相比生产同类货物的最佳地点，建筑或升级在回收成本速度上慢多少仍可被允许建造。设为30%时，如果最佳地点在10年内回收，则只有在13年内回收的建筑会被建造；更慢的将进入等待。设为0%时，每月仅建造每种货物的最佳产地。设为100%及以上则没有限制，仅适用“最大投资回收年限”。无论建筑类型为何，所有生产相同货物的建筑都会被统一评估。RGO扩张总是按投资回收顺序建造。"
 cm__ab_production_max_rel_roi_format: "[CMMV('cm__ab_production_max_rel_roi')]%[Select_CString(GreaterThanOrEqualTo_CFixedPoint(CMMV('cm__ab_production_max_rel_roi'), CMMMapValue('cmm_max', 'cm__ab_production_max_rel_roi')), '+', '')]" # NO-TRANSLATE
 cm__ab_production_min_roi_name: "最大回本年限"
 cm__ab_production_min_roi_desc: "仅考虑其税收收入能在设定年限内回收建设成本的建筑。设置为 0 以禁用该项检查。"
 cm__ab_production_min_roi_format: "[CMMV('cm__ab_production_min_roi')]y @efficiency!" # NO-TRANSLATE
 cm__ab_production_min_discount_name: "$cm_txt_min_discount$" # NO-TRANSLATE
 cm__ab_production_min_discount_desc: "$cm_txt_min_discount_desc$" # NO-TRANSLATE
 cm__ab_production_min_discount_format: "[CMMV('cm__ab_production_min_discount')]%" # NO-TRANSLATE
 cm__ab_production__debug_name: "$cm_txt_debug$" # NO-TRANSLATE
 cm__dbg_run_production_name: "运行生产"
 cm__dbg_run_production_desc: "$cm_txt_dbg_run_category_desc$" # NO-TRANSLATE
 cm__dbg_run_production_text: "$cm_txt_run_now$" # NO-TRANSLATE
 cm__ab_roads__ab_roads_name: "$cm__ab_roads_name$" # NO-TRANSLATE
 cm__ab_roads_proximity_name: "$cm_txt_proximity$" # NO-TRANSLATE
 cm__ab_roads_proximity_desc: "铺设性价比最高的提升亲近度的路段，并计入该路线后方的所有地点。"
 cm__ab_roads_market_access_name: "市场准入"
 cm__ab_roads_market_access_desc: "铺设单位金币提升市场准入最多的道路段。仅在“邻近度”机制当月未铺设任何内容，且并未在为暂时无法负担的路段攒钱时才会进行支出。"
 cm__ab_roads_capital_name: "首都连接"
 cm__ab_roads_capital_desc: "铺设路段以将你的地点连接至首都，并从已连接的地点开始向外扩展。仅当邻近度与市场准入在本月均未铺设且均未在为目前无法负担的路段存钱时才进行支出。"
 cm__ab_roads_min_discount_name: "$cm_txt_min_discount$" # NO-TRANSLATE
 cm__ab_roads_min_discount_desc: "允许的最大建筑材料溢价。在 -33% 时，仅当所需的木材、石材和沙子价格低于基准价 33% 时才会进行铺设；在 0% 时，仅在不高于基准价时铺设；在 +33% 时，即使价格高于基准价 33% 也会进行铺设。"
 cm__ab_roads_min_discount_format: "[CMMV('cm__ab_roads_min_discount')]%" # NO-TRANSLATE
 cm__ab_roads_run_now_name: "强制重新规划道路"
 cm__ab_roads_run_now_desc: "立即确定现在要铺设哪些道路路段，而不是等待计划周期。在多人模式下，这是唯一能处理它们的方式。其本身不铺设道路；所确定的路段将在道路预算覆盖它们时进行建造。"
 cm__ab_roads_run_now_text: "$cm_txt_run_now$" # NO-TRANSLATE
 cm__ab_roads__debug_name: "$cm_txt_debug$" # NO-TRANSLATE
 cm__dbg_run_roads_name: "运行道路建设"
 cm__dbg_run_roads_desc: "立即依据当前规划下令铺设路段，无需等待月份更替。此操作会消耗其剩余份额，因此本月已耗尽份额的类别将不再进行铺设。“暂停自动化”无法阻止此操作。"
 cm__dbg_run_roads_text: "$cm_txt_run_now$" # NO-TRANSLATE
 cm__ab_governors__ab_governors_name: "$cm__ab_governors_name$" # NO-TRANSLATE
 cm__ab_gov_move_seats_name: "允许移动总督"
 cm__ab_gov_move_seats_desc: "当所有总督槽位已满时，撤下一名总督并在更好的位置重新派驻。更好的位置必须已经是城市，或者评分比被替换的位置高出10%以上。关闭此项时，总督只会进入空余槽位。"
 cm__ab_gov_prepare_sites_name: "允许准备新地点"
 cm__ab_gov_prepare_sites_desc: "考虑那些尚不能指派总督的地点并优先让其准备就绪，在当地建立城镇或城市，并修建通往首都的道路。若关闭此项，则仅考虑那些已经是城市且拥有通往首都道路的地点。"
 cm__ab_governors__debug_name: "$cm_txt_debug$" # NO-TRANSLATE
 cm__dbg_run_governors_name: "启动总督计划"
 cm__dbg_run_governors_desc: "立即启动一个新计划，而非等待通常的二十五年轮次。计划随后将像往常一样在接下来的几个月内分阶段执行。这仍需满足处于和平状态、拥有首都，且没有其他正在进行的搜索。"
 cm__dbg_run_governors_text: "开始"
 cm__urbanization_name: "城市化"
 cm__auto_urbanize_enabled_name: "$cm_txt_enabled$" # NO-TRANSLATE
 cm__auto_urbanize_enabled_desc: "启用或禁用自动城市化。"
 cm__auto_urbanize_min_discount_name: "$cm_txt_min_discount$" # NO-TRANSLATE
 cm__auto_urbanize_min_discount_desc: "允许的最大建筑材料加价。在 -33% 时，仅当材料价格低于基准价 33% 时才会建立城镇和城市。在 0% 时，仅在基准价或更低时建立。在 +33% 时，即使价格高于基准价 33% 也会建立。"
 cm__auto_urbanize_min_discount_format: "[CMMV('cm__auto_urbanize_min_discount')]%" # NO-TRANSLATE
 cm__auto_urbanize__debug_name: "$cm_txt_debug$" # NO-TRANSLATE
 cm__dbg_run_auto_urbanize_name: "运行自动城市化"
 cm__dbg_run_auto_urbanize_desc: "现在将独立运行等级升级，而无需等待月度更替。在其启动的周期内不会建造其他任何建筑，且“暂停自动化”不会阻止其运行。"
 cm__dbg_run_auto_urbanize_text: "$cm_txt_run_now$" # NO-TRANSLATE
 cm__auto_town_rights__auto_town_rights_specialization_name: "智能专业化权利授予者"
 cm__auto_town_rights__auto_town_rights_specialization_desc: "在自定义权利授予器执行完毕后授予。"
 cm__auto_grant_specialization_name: "自动授予专业化城市权利"
 cm__auto_grant_specialization_desc: "为每个地点授予一项特化权，从契合周边产出货物的选项中选择金币价值最高的一项。"
 cm__specialization_window_name: "适用阈值"
 cm__specialization_window_desc: "特化特权与地点的契合度相较于最契合特权所需达到的比例，以使其进入候选名单。设为 50% 时，契合度至少达到最佳者一半的任何特权都将入选，并授予其中价值金币最高的一个。设为 100% 时，仅授予最契合的特权。"
 cm__specialization_window_format: "[CMMV('cm__specialization_window')]%" # NO-TRANSLATE
 cm__specialization_expand_name: "扩展受加成的产业"
 cm__specialization_expand_desc: "当授予一项专业化权利时，也会在该地区开启受该权利加成的产业及其产出的原材料的自动扩建。这与在“推荐城市权利”地图模式下右键点击授予按钮的效果相同。"
 cm__auto_town_rights__debug_name: "$cm_txt_debug$" # NO-TRANSLATE
 cm__dbg_run_town_rights_name: "运行自动授予城市特权"
 cm__dbg_run_town_rights_desc: "现在立即授予，无需等待月份更替。优先处理已启用列表，随后处理专业化权利。“暂停自动化”不会阻止此操作。"
 cm__dbg_run_town_rights_text: "$cm_txt_run_now$" # NO-TRANSLATE
 cm__miscellaneous_name: "杂项"
 cm__cleanup_name: "建筑清理"
 cm__cleanup__cleanup_name: "$cm__cleanup_name$" # NO-TRANSLATE
 cm__cleanup_close_open_name: "开启与关闭建筑"
 cm__cleanup_close_open_desc: "每年一次，关闭不再盈利且未获得补贴的生产建筑。一旦该类型的建筑在该市场再次盈利，被关闭的建筑将重新开启。@farming_village! [ShowBuildingTypeNameWithNoTooltip('farming_village')] 和 @market_village! [ShowBuildingTypeNameWithNoTooltip('market_village')] 永远不会被关闭。"
 cm__cleanup_destroy_name: "拆除建筑"
 cm__cleanup_destroy_desc: "每年一次，拆除那些不再盈利且所在地等级在其支持的建筑等级十级以内的生产建筑，以及那些已经关闭且所在地空间已耗尽的建筑。@market_village! [ShowBuildingTypeNameWithNoTooltip('market_village')] 将改为削减至一级，@fruit_orchard! [ShowBuildingTypeNameWithNoTooltip('fruit_orchard')] 无论收益如何都将被拆除且不再重建，而 @farming_village! [ShowBuildingTypeNameWithNoTooltip('farming_village')] 则永远不会被拆除。"
 cm__cleanup_min_profit_name: "每级最低利润"
 cm__cleanup_min_profit_desc: "每月每等级收入低于此值的建筑将被视为不值得经营，除非获得补贴，否则将被关闭或拆除。"
 cm__cleanup_min_profit_format: "[Divide_CFixedPoint(CMMV('cm__cleanup_min_profit'), '(CFixedPoint)100')|2]@gold!" # NO-TRANSLATE
 cm__cleanup_max_changed_name: "每轮最大变更数"
 cm__cleanup_max_changed_desc: "在一个市场中，某种建筑类型的建筑在一年周期内可变动的比例。设为 50% 时，其半数已开启的建筑可以被关闭或拆除，半数已关闭的建筑可以被重新开启。变动数量永远不会少于一个，因此该类型的最后一个建筑仍可被关闭。"
 cm__cleanup_max_changed_format: "[CMMV('cm__cleanup_max_changed')]%" # NO-TRANSLATE
 cm__cleanup_core_goods_name: "优先建筑材料"
 cm__cleanup_core_goods_desc: "将主要消耗 @masonry![ShowGoodsNameWithNoTooltip('masonry')]、@lumber![ShowGoodsNameWithNoTooltip('lumber')]、@sand![ShowGoodsNameWithNoTooltip('sand')] 或 @glass![ShowGoodsNameWithNoTooltip('glass')] 的建筑维持在每级最低利润的两倍或每级 0.1@gold!（以较高者为准）。开启此项时，生产这四种资源之一的建筑绝不会被关闭或拆除。"
 cm__cleanup_auto_food_name: "清除自动粮食地块"
 cm__cleanup_auto_food_desc: "在启用自动粮食管理且任何类型的劳工已经短缺的情况下，拆除不生产粮食的生产建筑。@market_village! [ShowBuildingTypeNameWithNoTooltip('market_village')]将被降至一级而非拆除。"
 cm__cleanup_run_now_name: "运行建筑清理"
 cm__cleanup_run_now_desc: "立即执行清理，而非等待年度处理。"
 cm__cleanup_run_now_text: "$cm_txt_run_now$" # NO-TRANSLATE
 cm__placement_finder_method_option_3_name: "人口"
 cm__placement_finder_method_option_3_desc: "根据在此处设置总督或首都所能增加的接近度进行排序，并按各地点的居住人口进行计算。在大量人口上获得的小幅增益，其价值低于在少量人口上获得的大幅增益。"
 cm__log_production_name: "$cm__ab_production_name$" # NO-TRANSLATE
 cm__log_production_desc: "显示生产类别队列中的每个建筑，以及其考虑的每一项原材料扩产，并附带各自的投资回收期和收益。"
 cm__log_core_name: "$cm__ab_core_name$" # NO-TRANSLATE
 cm__log_core_desc: "追踪单个地点在核心商品周期中的记录：市场的短缺量和请求的等级，随后是该地点的分配、评分和建造情况。首先通过控制台命令 effect location:<key> = { cm_ab_core_watch_on = yes } 标记该地点。"
 cm__debug__rotation_name: "市场轮换"
 cm__debug__rotation_desc: "大国会分批次处理其市场，每项自动化功能都会在当前处理的市场集合中进行建设。"
 cm__dbg_rotate_slice_name: "轮换市场"
 cm__dbg_rotate_slice_desc: "移动到下一组市场。从“立即运行”按钮启动的运行会停留在其找到的那组市场上，因此当游戏处于暂停状态时，需通过此操作来推动其继续运行。"
 cm__dbg_rotate_slice_text: "轮换"
 cm__probe_production_anchors_name: "生产锚点"
 cm__probe_production_anchors_desc: "每种商品显示一行，包含生产记录中的最佳回本周期及所设定的回本上限，并标明对应的建筑与地点。"
 cm__probe_production_anchors_text: "$cm_txt_run$" # NO-TRANSLATE
 cm__probe_production_rgo_name: "生产原材料"
 cm__probe_production_rgo_desc: "为生产跳过地点原始资源的每个原因显示一行，若未跳过任何项则仅显示一行。除非使用控制台指令 effect location:<key> = { cm_ab_core_watch_on = yes } 标记了特定地点，否则将读取首都的数据。"
 cm__probe_production_rgo_text: "$cm_txt_run$" # NO-TRANSLATE
 cm__probe_core_name: "$cm__ab_core_name$" # NO-TRANSLATE
 cm__probe_core_desc: "显示核心商品在某地区读取的各项数值，每项数值都位于游戏原生数值的旁边，随后显示的是该地区市场在一个周期内可吸收的量。默认读取首都，除非你使用控制台命令 effect location:<key> = { cm_ab_core_watch_on = yes } 标记一个地区；由于首都绝非核心商品的候选地，请标记一个会进行扩建的地区来读取数据。"
 cm__probe_core_text: "$cm_txt_run$" # NO-TRANSLATE
 cm__probe_setup_name: "$cm_txt_setup_data$" # NO-TRANSLATE
 cm__probe_setup_desc: "存档携带的地图数据、每项数据的计算版本，以及本机是否被允许计算这些数据。版本 0 表示该项尚未计算，将在下一次加载时进行。"
 cm__probe_setup_text: "$cm_txt_run$" # NO-TRANSLATE
 cm__debug__setup_name: "$cm_txt_setup_data$" # NO-TRANSLATE
 cm__debug__setup_desc: "模组仅计算一次地图数据，并在后续游戏进程中直接读取。"
 cm__dbg_rebuild_setup_name: "重建设置数据"
 cm__dbg_rebuild_setup_desc: "重新解析地图数据：R.G.O. 奖励过滤器背后的原材料、推荐城市特权背后的工业覆盖面、$mapmode_cm_location_food_potential_name$ 背后的评分、选址器路径中的河流跨越点，以及建筑的升级关系。处理过程需要几秒钟，在此期间游戏将保持运行。"
 cm__dbg_rebuild_setup_text: "重建"
