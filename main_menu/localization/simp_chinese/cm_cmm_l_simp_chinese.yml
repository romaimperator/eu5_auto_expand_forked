 cm__map_modes__placement_finder_desc: "推荐总督与推荐首都选址地图模式的设置。"
 cm__placement_finder_method_name: "选址查找器评分"
 cm__placement_finder_method_desc: "推荐总督和推荐首都地图模式对您的地点进行排名的方式。"
 cm__placement_finder_method_option_1_name: "$cm_txt_tax_base$"
 cm__placement_finder_method_option_1_desc: "按在该处设置总督或首都所能提高的总税基进行排序。越富裕的地区权重越高。"
 cm__placement_finder_method_option_2_name: "$cm_txt_proximity$"
 cm__placement_finder_method_option_2_desc: "按在此处设置总督或首都所增加的邻近度排序。"
 cm__placement_finder_roads_name: "陆上基础设施"
 cm__placement_finder_roads_desc: "“推荐总督”和“推荐首都”地图模式是假设理想的陆上基础设施，还是使用你实际已建造的基础设施。"
 cm__placement_finder_roads_option_1_name: "$cm_txt_current$"
 cm__placement_finder_roads_option_1_desc: "使用你实际建造的道路。"
 cm__placement_finder_roads_option_2_name: "最大道路"
 cm__placement_finder_roads_option_2_desc: "假设所有连接处均已建造你已解锁的最高等级道路。"
 cm__placement_finder_roads_option_3_name: "$cm_txt_best_possible$"
 cm__placement_finder_roads_option_3_desc: "假设你已解锁的最佳道路已在每一条连接路径上建造，且每一个能提高陆地邻近度的已解锁建筑都已在所有符合条件的地点建造。"
 cm__placement_finder_naval_name: "海军基础设施"
 cm__placement_finder_naval_desc: "“推荐总督”与“推荐首都”地图模式是假定理想的海军基础设施，还是使用当前的港口容量和海军存在。"
 cm__placement_finder_naval_option_1_name: "$cm_txt_current$"
 cm__placement_finder_naval_option_1_desc: "使用您当前的港口容量和海军存在。"
 cm__placement_finder_naval_option_2_name: "最大存在"
 cm__placement_finder_naval_option_2_desc: "假设在当前港口容量下，各地均有完全的海军存在。"
 cm__placement_finder_naval_option_3_name: "$cm_txt_best_possible$"
 cm__placement_finder_naval_option_3_desc: "假设完全的海军存在，并在每个沿海地区建造已解锁的最佳港口建筑。"
 cm__placement_finder_accuracy_name: "搜索精度"
 cm__placement_finder_accuracy_desc: "“推荐总督”和“推荐首都”地图模式搜索最佳位置的详尽程度。被跳过的位置将显示为黑色。"
 cm__placement_finder_accuracy_option_1_name: "详尽"
 cm__placement_finder_accuracy_option_1_desc: "评估所有地点。最准确，但速度最慢。"
 cm__placement_finder_accuracy_option_2_name: "彻底"
 cm__placement_finder_accuracy_option_2_desc: "跳过无法排入前三名的位置。前三名及其得分与“穷举”模式完全一致，但速度更快。"
 cm__placement_finder_accuracy_option_3_name: "均衡"
 cm__placement_finder_accuracy_option_3_desc: "跳过那些不可能是最佳选址的地点。最佳选址仍保证精确；第二和第三位的标记偶尔会有所出入。"
 cm__placement_finder_accuracy_option_4_name: "快速"
 cm__placement_finder_accuracy_option_4_desc: "同时跳过那些极不可能是最佳地点的选项。所找到的最佳地点与理论最佳地点的偏差在 20% 以内，且通常仍然是完全一致的。"
 cm__placement_finder_accuracy_option_5_name: "最快"
 cm__placement_finder_accuracy_option_5_desc: "评估每个省份中最具潜力的地点，然后围绕这些领先者进行精细化调整。大国运行速度更快，但可能会错过最佳地点。"
 cm__debug_name: "$cm_txt_debug$"
 cm__debug__logging_name: "行动日志"
 cm__debug__logging_desc: "本模组的哪些操作将被记录在模组操作日志中。"
 cm__log_cycle_name: "建设周期"
 cm__log_cycle_desc: "因上一周期仍在结算而跳过的月度周期，以及连续两次跳过后的重置。"
 cm__log_food_name: "$cm__ab_food_name$"
 cm__log_food_desc: "粮食类别详情：各市场的月度粮食供给、需求和比例，用于对比目标进行判定的年度比例中位数，该市场已在生产粮食的地点数量，以及其启用或禁用的每个地点。"
 cm__log_roads_name: "$cm__ab_roads_name$"
 cm__log_roads_desc: "为“道路”类别订购的每条道路显示一行，说明位置、购买该道路的三种原因之一以及所花费用。"
 cm__log_cleanup_name: "$cm__cleanup_name$"
 cm__log_cleanup_desc: "年度建筑清理流程记录：针对其关闭、削减、拆除或重新开启的每个建筑，列出其利润以及判定的底线标准。"
 cm__log_governors_name: "$cm__ab_governors_name$"
 cm__log_governors_desc: "总督计划的项目：选址与弃址、城镇与城市升级、布置、搬迁与拒绝，以及幸运国家的首都搬迁。"
 cm__log_military_name: "$cm_txt_lucky_nation_military$"
 cm__log_military_desc: "幸运国家拆除要塞并建造人力建筑。"
 cm__log_government_name: "幸运国家政府"
 cm__log_government_desc: "幸运国家移除官僚机构或执行阶级行动的文本。"
 cm__debug__diagnostics_name: "诊断"
 cm__placement_finder_debug_path_name: "启用调试诊断"
 cm__placement_finder_debug_path_desc: "为“推荐总督”和“推荐首都”地图模式工具提示增加一个诊断区块：显示从首都到各位置的预测路径及每段跳跃的成本，并将预测接近度与实际接近度进行对比。"
 cm__debug__probes_name: "探针"
 cm__debug__probes_desc: "一次性诊断信息已写入MOD操作日志。"
 cm__probe_budget_name: "自动建造预算"
 cm__probe_budget_desc: "每个自动建造类别的余额（正值表示为尚无法负担的选项而预留的金币，负值表示因超支而产生的欠款），随后是上个月各类别均未使用的金币、生产回本限制，以及在本周期被跳过的市场中等待的最佳候选项目。"
 cm__probe_budget_text: "$cm_txt_run$"
 cm__probe_governors_name: "总督规划"
 cm__probe_governors_desc: "总督规划的进度：其所处阶段、已占用和待安置的建筑位数量、是否占用国库、已支付的总督，以及其正在占用的槽位与席位。"
 cm__probe_governors_text: "$cm_txt_run$"
 cm__probe_military_name: "$cm_txt_lucky_nation_military$"
 cm__probe_military_desc: "国家当前的人力建筑等级、是否可以建造、首都关联状态、军事预算，以及可建造该等级的地区数量与已拥有该等级的地区数量的对比。"
 cm__probe_military_text: "$cm_txt_run$"
 cm__probe_roads_name: "$cm__ab_roads_name$"
 cm__probe_roads_desc: "道路计划为邻近度、市场准入和首都连接各保留了多少条走廊，其中有多少条首都连接走廊目前可以开始建设，有多少条道路已在建设中，有多少条因市场缺乏建筑物资而受阻，以及该类别池中还剩下多少。"
 cm__probe_roads_text: "$cm_txt_run$"
 cm__probe_log_gate_name: "行动日志开关"
 cm__probe_log_gate_desc: "核心商品日志类别会出现两次，分别按日志开关读取的状态和菜单存储的状态，因此若某一类别在其中一处开启而在另一处关闭，它仍会显示。"
 cm__probe_log_gate_text: "$cm_txt_run$"
