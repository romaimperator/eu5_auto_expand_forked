 MAPMODE_CM_BEST_TOWN_RIGHT: "#T $mapmode_cm_best_town_right_name$#!\n根据专业化[town_rights|e]为每个[location|e]着色，该专业化所加成的建筑能从[province|e]的[rgo|e]中获取最大份额的[goods|e]投入品。将鼠标悬停在[location|e]上可查看所有专业化选项的排名。\n将鼠标悬停在工具提示中产业的百分比上，以查看其最佳生产方式投入品的明细。\n并列最佳将显示为条纹状的第二种颜色：即并列专业化的颜色，若有3个及以上并列则显示特定颜色。"
