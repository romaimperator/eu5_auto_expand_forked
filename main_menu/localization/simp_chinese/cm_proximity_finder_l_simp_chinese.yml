 cm_pf_gov_source_line: "现有 [proximity|e] 来源: [ROOT.GetLocation.GetModifierValueFixed('local_proximity_source')|0]"
 cm_pf_cap_tt_head: "预计距首都最大平均[proximity|e]：[ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_cf_avg_value')|1]%\n来自[proximity|e]的最大预计税基：+[ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_cf_taxgain_value')|1]"
