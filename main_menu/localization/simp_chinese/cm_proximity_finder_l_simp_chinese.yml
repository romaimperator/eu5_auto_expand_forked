 mapmode_cm_capital_finder_name: "推荐的首都位置"
 MAPMODE_CM_CAPITAL_FINDER: "#T $mapmode_cm_capital_finder_name$#!\n根据在当地建设 [capital|e] 传播 [proximity|e] 的效率为你的 [locations|e] 着色。现有的总督将被忽略。带有条纹的地块已经拥有接近度来源，例如当前的首都或总督。\n这是一个估算值：“放置查找器评分”设置决定了地块是按税基还是按原始 [proximity|e] 排序，而“陆地基础设施”和“海军基础设施”设置决定了其假设的道路、建筑和 [maritime_presence|e]。当你打开此地图模式时，它会重新计算，最多每 4 年一次；使用操作栏的刷新按钮可强制进行重新计算。颜色将在计算完成后刷新。"
 MAPMODE_CM_CAPITAL_FINDER_TT_SCORED: "计入首都影响的预测最大平均[proximity|e]：[ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_cf_avg_value')|1]%\n来自[proximity|e]的最大预测税基：+[ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_cf_taxgain_value')|1]\n评分：最佳地点的[ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_cf_pct_value')|0]%[ROOT.GetLocation.Custom('cm_pf_cf_status')]"
 MAPMODE_CM_CAPITAL_FINDER_TT_BEST: "包含首都的预计最高平均[proximity|e]：[ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_cf_avg_value')|1]%\n来自[proximity|e]的最大预计税基：+[ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_cf_taxgain_value')|1]\n您的最佳地点"
 MAPMODE_CM_CAPITAL_FINDER_TT_SCORED_DEBUG: "$MAPMODE_CM_CAPITAL_FINDER_TT_SCORED$$CM_PF_DEBUG_BLOCK$"
 MAPMODE_CM_CAPITAL_FINDER_TT_BEST_DEBUG: "$MAPMODE_CM_CAPITAL_FINDER_TT_BEST$$CM_PF_DEBUG_BLOCK$"
 MAPMODE_CM_CAPITAL_FINDER_TT_SOURCE: "$MAPMODE_CM_CAPITAL_FINDER_TT_SCORED$\n现有邻近度来源：[ROOT.GetLocation.GetModifierValueFixed('local_proximity_source')|0]"
