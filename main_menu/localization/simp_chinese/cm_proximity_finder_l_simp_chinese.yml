l_simp_chinese:
 mapmode_cm_governor_finder_name: "推荐总督安置"
 MAPMODE_CM_GOVERNOR_FINDER: "#T $mapmode_cm_governor_finder_name$#!\n根据在该处建造新的地方长官或海军长官能增加多少[proximity|e]来为您的[locations|e]上色，这考虑到了您的[capital|e]和现有来源已提供的亲近度。越绿代表效果越好。您的首都和现有的亲近度来源显示为条纹状。\n这是一个估算值：“位置查找评分”设置决定了地点是按税基还是按原始[proximity|e]进行排名，而“陆地基础设施”和“海军基础设施”设置则决定了其假设的道路、建筑和[maritime_presence|e]。该数值在您打开此地图模式时会重新计算，最多每4年一次；使用操作栏的刷新按钮可强制进行重新计算。颜色会在计算完成后刷新。"
 MAPMODE_CM_GOVERNOR_FINDER_TT_SCORED: "预计最大平均[proximity|e]收益：+[ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_gf_avg_value')|1]%\n从[proximity|e]获得的最大预计税基：+[ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_gf_taxgain_value')|1]\n评分：你最佳区划的[ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_gf_pct_value')|0]%[ROOT.GetLocation.Custom('cm_pf_gf_status')]"
 MAPMODE_CM_GOVERNOR_FINDER_TT_BEST: "预计最大平均[proximity|e]增益：+[ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_gf_avg_value')|1]%\n从[proximity|e]获得的最大预计税基：+[ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_gf_taxgain_value')|1]\n你的最佳地点"
 MAPMODE_CM_GOVERNOR_FINDER_TT_SCORED_DEBUG: "$MAPMODE_CM_GOVERNOR_FINDER_TT_SCORED$$CM_PF_DEBUG_BLOCK$"
 MAPMODE_CM_GOVERNOR_FINDER_TT_BEST_DEBUG: "$MAPMODE_CM_GOVERNOR_FINDER_TT_BEST$$CM_PF_DEBUG_BLOCK$"
 MAPMODE_CM_GOVERNOR_FINDER_TT_CAPITAL: "你的 [capital|e] 已经从这里传播 [proximity|e]。"
 MAPMODE_CM_GOVERNOR_FINDER_TT_CAPITAL_DEBUG: "$MAPMODE_CM_GOVERNOR_FINDER_TT_CAPITAL$$CM_PF_DEBUG_BLOCK$"
 MAPMODE_CM_GOVERNOR_FINDER_TT_SOURCE: "现有[proximity|e]来源：[ROOT.GetLocation.GetModifierValueFixed('local_proximity_source')|0]\n$MAPMODE_CM_GOVERNOR_FINDER_TT_SCORED$"
 MAPMODE_CM_GOVERNOR_FINDER_TT_SOURCE_DEBUG: "$MAPMODE_CM_GOVERNOR_FINDER_TT_SOURCE$$CM_PF_DEBUG_BLOCK$"
 MAPMODE_CM_GOVERNOR_FINDER_TT_SOURCE_NOGAIN: "现有 [proximity|e] 来源：[ROOT.GetLocation.GetModifierValueFixed('local_proximity_source')|0]\n$MAPMODE_CM_GOVERNOR_FINDER_TT_NOGAIN$"
 MAPMODE_CM_GOVERNOR_FINDER_TT_SOURCE_NOGAIN_DEBUG: "$MAPMODE_CM_GOVERNOR_FINDER_TT_SOURCE_NOGAIN$$CM_PF_DEBUG_BLOCK$"
 MAPMODE_CM_GOVERNOR_FINDER_TT_NOGAIN: "一位总督最多提供 80 [proximity|e]，而该地点[ROOT.GetLocation.Custom('cm_pf_nogain_basis')]，因此在此处建造总督不会有任何收益。"
