 # Action bar refresh button
 cm_pf_refresh: "cm_pf_refresh"
 cm_pf_refresh_color: "深青色"
 cm_pf_refresh_icon: "@cm_pf_refresh!"
 cm_pf_refresh_name: "重新计算放置评分"
 cm_pf_refresh_tooltip: "强制对当前边界的总督与首都选址评分进行重新计算。否则，这些评分最多会沿用4年。"
 cm_pf_estimate_note: "这是一个估值：“选址查找评分”设置决定了地点是按税基还是按原始 [proximity|e] 进行排名，而“陆上基础设施”和“海军基础设施”设置则决定了其假设的道路、建筑和 [maritime_presence|e]。当你打开此地图模式时，它会重新计算，频率最多每 4 年一次；使用操作栏的刷新按钮可强制进行重新计算。计算完成后颜色将刷新。"
 cm_pf_tt_no_data: "尚未评分。请使用操作栏的刷新按钮来计算当前疆域的评分。"
 cm_pf_tt_skipped: "未评估：搜索精度设置跳过了此地点。将其设置为“详尽”并刷新以评估每个地点。"
 cm_pf_tt_foreign: "不属于你的国家。"
 cm_pf_source_legend: "现有的邻近度来源（斜纹）"
 cm_pf_of_best: "之最佳"
