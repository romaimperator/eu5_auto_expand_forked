l_simp_chinese:
 mapmode_cm_breadbasket_name: "粮仓"
 MAPMODE_CM_BREADBASKET: "#T $mapmode_cm_breadbasket_name$#!\n高亮显示目前已设置运行自动食物管理的[locations|e]。"
 MAPMODE_CM_BREADBASKET_TT_ENABLED: "[ROOT.GetLocation.GetName]已配置自动食物。"
 MAPMODE_CM_BREADBASKET_TT_OWNED: "[ROOT.GetLocation.GetName] 属于你，但尚未启用自动粮食。"
 MAPMODE_CM_BREADBASKET_TT_FOREIGN: "[ROOT.GetLocation.GetName]不属于你。"
 MAPMODE_CM_BREADBASKET_TT_UNCOLONIZED: "[ROOT.GetLocation.GetName] 未被殖民。"
 MAPMODE_CM_BREADBASKET_TT_WATER: "[ROOT.GetLocation.GetName]是一个海域。"

 cm_breadbasket_enabled_legend_key: "已启用自动粮食"
 cm_breadbasket_owned_legend_key: "您的其他地点"
 cm_breadbasket_foreign_legend_key: "外国地块"
 cm_breadbasket_uncolonized_legend_key: "未殖民"

 mapmode_cm_location_food_potential_name: "每个RGO等级的粮食潜力"
 MAPMODE_CM_LOCATION_FOOD_POTENTIAL: "#T $mapmode_cm_location_food_potential_name$#!\n此模式根据每单位[rgo|e]等级的天然产粮潜力为[locations|e]着色。该分数综合了[rgo|e] [food|e]数值、累积的[food_productivity|e]（地形、植被、气候、命名的静态修正如斯科内鲱鱼市场或肥沃的尼罗河三角洲、特定[rgo|e]的产出修正等）、水源接入，以及在[rgo|e]允许的情况下，来自[ShowBuildingTypeName('windmill')]、[ShowBuildingTypeName('farming_village')]和[ShowBuildingTypeName('irrigation_systems')]的假设最大加成。\n\n[development|e]的贡献被排除在外，因此该分数反映的是纯粹的地形潜力，而非当前投资状况的快照。"
 mapmode_cm_location_food_potential_hidden_name: "$mapmode_cm_location_food_potential_name$"
 MAPMODE_CM_LOCATION_FOOD_POTENTIAL_HIDDEN: "$MAPMODE_CM_LOCATION_FOOD_POTENTIAL$"
 MAPMODE_CM_LOCATION_FOOD_POTENTIAL_TT_LAND: "[ROOT.GetLocation.GetName]每级[rgo|e]的食物潜力为[ROOT.GetLocation.MakeScope.ScriptValue('cm_location_food_potential')|1Y]。"
 MAPMODE_CM_LOCATION_FOOD_POTENTIAL_TT_WATER: "[ROOT.GetLocation.GetName]不是陆地，因此没有粮食潜力。"

 cm_location_food_potential_auto_food_legend_key: "已启用粮食自动扩展 (条纹)"
 cm_location_food_potential_bright_green_legend_key: "45 (最大可能)"
 cm_location_food_potential_green_legend_key: "27.5 (优秀)"
 cm_location_food_potential_yellow_legend_key: "20 (商品)"
 cm_location_food_potential_orange_legend_key: "12.5 (尚可)"
 cm_location_food_potential_red_legend_key: "3.75 (低)"
 cm_location_food_potential_black_legend_key: "0 (无)"
