l_simp_chinese:
 mapmode_cm_location_proximity_modifier_name: "邻近度效率影响"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER: "#T $mapmode_cm_location_proximity_modifier_name$#!\n根据[locations|e]的$mapmode_cm_location_proximity_modifier_name$进行染色：即其[topography|e]与[vegetation|e]对[proximity|e]（山地、丘陵、高原、湿地、森林、丛林等）造成的综合惩罚。绿色表示地形不阻碍亲近度；红色表示严重阻碍。地貌惩罚会根据所有者的亲近度影响加成（例如来自首都地形或进展的加成）进行缩放；未拥有的地点显示基础地形数值。地点上的[road|e]或[river|e]会抵消其[vegetation|e]惩罚；[topography|e]惩罚始终适用。\n\n水域则显示所选[country|e]在该处的[maritime_presence|e]，颜色从最低的绿色经浅绿色到充满时的浅蓝色。高存在感会减少穿过[seazone|e]时损失的[proximity|e]。"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_LAND: "$mapmode_cm_location_proximity_modifier_name$: [ROOT.GetLocation.MakeScope.ScriptValue('cm_location_proximity_modifier')|+=%]"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_LAND_HARBOR: "$MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_LAND$\n天然港口适宜度：[ROOT.GetLocation.GetModifierValueFixed('natural_harbor_suitability')|0%]"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER: "[ROOT.GetLocation.GetName]不是陆地，因此没有$mapmode_cm_location_proximity_modifier_name$，且所选的[country|e]在此处没有[maritime_presence|e]。"

 cm_location_proximity_modifier_none_legend_key: "0% (无惩罚)"
 cm_location_proximity_modifier_light_legend_key: "-25% (轻度)"
 cm_location_proximity_modifier_noticeable_legend_key: "-35% (显著)"
 cm_location_proximity_modifier_moderate_legend_key: "-50%（中等）"
 cm_location_proximity_modifier_heavy_legend_key: "-65% (重度)"
 cm_location_proximity_modifier_severe_legend_key: "-75% (严重)"
 cm_location_proximity_modifier_worst_legend_key: "-100% (最差)"
 cm_location_proximity_modifier_harbor_legend_key: "天然港口适宜度（条纹）"
 cm_location_proximity_modifier_maritime_none_legend_key: "无海上存在 (开阔水域)"
 cm_location_proximity_modifier_maritime_low_legend_key: "低海事存在感"
 cm_location_proximity_modifier_maritime_half_legend_key: "50% 海事存在"
 cm_location_proximity_modifier_maritime_full_legend_key: "100% 海上存在"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER_M0: "[maritime_presence|E]: 0-10%"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER_M10: "[maritime_presence|E]: 10-20%"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER_M20: "[maritime_presence|E]: 20-30%"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER_M30: "[maritime_presence|E]: 30-40%"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER_M40: "[maritime_presence|E]: 40-50%"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER_M50: "[maritime_presence|E]: 50-60%"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER_M60: "[maritime_presence|E]: 60-70%"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER_M70: "[maritime_presence|E]: 70-80%"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER_M80: "[maritime_presence|E]: 80-90%"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER_M90: "[maritime_presence|E]: 90-100%"
