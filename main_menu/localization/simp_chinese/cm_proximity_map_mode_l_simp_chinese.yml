l_simp_chinese:
 mapmode_cm_location_proximity_modifier_name: "邻近度效率影响"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER: "#T $mapmode_cm_location_proximity_modifier_name$#!\n根据其距离效率影响对[locations|e]进行染色：即[topography|e]与[vegetation|e]对[proximity|e]（山脉、丘陵、高原、湿地、森林、丛林等）造成的综合惩罚。绿色表示地形不阻碍距离；红色则表示严重阻碍。地形惩罚会根据所有者的距离影响加成（如来自首都地形或进步的加成）进行缩放；无主地点显示基础地形数值。地点上的[road|e]或[river|e]会抵消其[vegetation|e]惩罚；[topography|e]惩罚始终适用。"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_LAND: "邻近效率影响：[ROOT.GetLocation.MakeScope.ScriptValue('cm_location_proximity_modifier')|+=%]"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_LAND_HARBOR: "邻近效率影响：[ROOT.GetLocation.MakeScope.ScriptValue('cm_location_proximity_modifier')|+=%]\n天然港口适宜度：[ROOT.GetLocation.GetModifierValueFixed('natural_harbor_suitability')|0%]"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER: "[ROOT.GetLocation.GetName]不是陆地，因此没有邻近效率影响。"

 cm_location_proximity_modifier_none_legend_key: "0% (无惩罚)"
 cm_location_proximity_modifier_light_legend_key: "-25% (轻度)"
 cm_location_proximity_modifier_noticeable_legend_key: "-35% (显著)"
 cm_location_proximity_modifier_moderate_legend_key: "-50%（中等）"
 cm_location_proximity_modifier_heavy_legend_key: "-65% (重度)"
 cm_location_proximity_modifier_severe_legend_key: "-75% (严重)"
 cm_location_proximity_modifier_worst_legend_key: "-100% (最差)"
 cm_location_proximity_modifier_harbor_legend_key: "天然港口适宜度（条纹）"
