 cm__urbanize_rural_to_town_name: "Ländlich zu Stadt"
 cm__urbanize_rural_to_town_desc: "Baut qualifizierte ländliche Siedlungen jeden Monat zu Städten aus. Erfordert 30.000 Einwohner oder maximal 1.000 unter der Bevölkerungsobergrenze. Standorte, deren RGO in der untenstehenden Liste „Nicht urbanisieren“ markiert ist, werden übersprungen. Standorte, die durch Massen-Auto-Nahrung abgedeckt sind, werden ebenfalls übersprungen."
