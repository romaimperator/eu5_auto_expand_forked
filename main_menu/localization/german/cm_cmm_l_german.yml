 # Auto-Urbanize (auto_urbanize) Tab
 cm__auto_urbanize_name: "Auto-Urbanisierung"
 ## Auto-Urbanize Settings (auto_urbanize) Group
 cm__auto_urbanize__auto_urbanize_name: "Auto-Urbanisierungseinstellungen"
 cm__auto_urbanize__auto_urbanize_desc: "Wählen Sie aus, welche Standortrang-Aufwertungen monatlich durchgeführt werden sollen."
 cm__urbanize_town_to_city_name: "Stadt zur Großstadt"
 cm__urbanize_town_to_city_desc: "Berechtigte Kleinstädte jeden Monat zu Städten aufstufen."
 cm__urbanize_rural_to_town_name: "Ländlich zu Stadt"
 cm__urbanize_rural_to_town_desc: "Wertet qualifizierte ländliche Siedlungen jeden Monat zu Städten auf. Erfordert 30.000 Pops (sofort stadtberechtigt) oder eine Differenz von weniger als 1.000 zur Bevölkerungsobergrenze (da das Wachstum sonst am ländlichen Limit stagnieren würde). Standorte, deren RGO in der untenstehenden Ignorierliste markiert ist, werden übersprungen. Standorte, die von „Mass Auto-Food“ abgedeckt werden, werden ebenfalls übersprungen, damit sie ländlich bleiben und weiterhin Nahrung produzieren."
