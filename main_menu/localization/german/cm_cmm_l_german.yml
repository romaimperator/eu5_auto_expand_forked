 cm__ab_priority_list__enabled_desc: "Diese Kategorie bauen lassen."
 cm__ab_priority_list__settings_name: "Einstellungen"
 cm__ab_priority_list__settings_desc: "Zu den eigenen Einstellungen dieser Kategorie."
 cm__ab_priority_list__settings_text: "Öffnen"
 cm__ab_master__debug_name: "$cm_txt_debug$" # NO-TRANSLATE
 cm__dbg_run_auto_build_name: "Auto-Bau ausführen"
 cm__dbg_run_auto_build_desc: "Geht nun jede aktivierte Kategorie der Liste nach unten durch, anstatt auf den Monatswechsel zu warten. Jede gibt den Rest ihres Anteils aus, sodass eine Kategorie, die ihr Monatsbudget bereits verbraucht hat, nichts baut. „Automatisierung pausieren“ hält dies nicht auf."
 cm__dbg_run_auto_build_text: "$cm_txt_run_now$" # NO-TRANSLATE
 cm__ab_custom__ab_custom_name: "$cm__ab_custom_name$" # NO-TRANSLATE
 cm__ab_custom__ab_custom_desc: "Sets werden jeden Monat von oben nach unten abgearbeitet, sodass die weiter oben stehenden das Gold zuerst erhalten."
 cm__ab_custom_item_column_name: "Gebäude"
 cm__ab_custom_i1_name: "Hauptstadtgebäude"
 cm__ab_custom_i1_desc: "Errichtet die nur in der Hauptstadt verfügbaren Gebäude in Eurer Hauptstadt: den Königshof, das Oberste Gericht, die Kriegsakademie und die restlichen. Diese werden vor allem anderen errichtet, was in dieser Kategorie gebaut wird."
 cm__ab_custom_i2_name: "Gebäude steuern"
 cm__ab_custom_i2_desc: "Baue Vögte dort, wo Rohstoffe am teuersten verkauft werden, sowie alle einzigartigen Gebäude Ihres Landes, welche die Kontrolle erhöhen, an den wohlhabendsten Standorten. Ein Standort erhält jedes mögliche einzigartige Gebäude, bevor der nächste Standort bedient wird."
 cm__ab_custom_i3_name: "Marktzentrum-Gebäude"
 cm__ab_custom_i3_desc: "Baut die Gebäude, die sich an einem Marktzentrum rentieren, in jedem eurer Marktzentren."
 cm__ab_custom_i4_name: "Gebäude auswählen"
 cm__ab_custom_i4_desc: "Baut die unten aufgeführten Gebäude."
 cm__ab_custom__enabled_name: "$cm_txt_enabled$" # NO-TRANSLATE
 cm__ab_custom__enabled_desc: "Dieses Set bauen."
 cm__ab_custom__auto_build_list_name: "$cm__ab_custom_i4_name$" # NO-TRANSLATE
 cm__ab_custom__auto_build_list_desc: "Zum Umordnen ziehen. Gebäude werden jeden Monat von oben nach unten abgearbeitet, sodass die weiter oben stehenden das Gold zuerst erhalten."
