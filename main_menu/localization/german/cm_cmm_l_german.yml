 cm__placement_finder_method_name: "Platzierungsfinder-Bewertung"
 cm__placement_finder_method_desc: "Wie die Kartenmodi „Empfohlener Gouverneur“ und „Empfohlene Hauptstadt“ Eure Standorte bewerten."
 cm__placement_finder_method_option_1_name: "$cm_txt_tax_base$"
 cm__placement_finder_method_option_1_desc: "Sortierung danach, wie stark ein dort eingesetzter Gouverneur oder eine dort platzierte Hauptstadt die gesamte Steuerbasis erhöhen würde. Wohlhabendere Standorte werden stärker gewichtet."
 cm__placement_finder_method_option_2_name: "$cm_txt_proximity$"
 cm__placement_finder_method_option_2_desc: "Sortieren nach der Proximität, die ein dort platzierter Gouverneur oder eine Hauptstadt hinzufügen würde."
 cm__placement_finder_roads_name: "Landinfrastruktur"
 cm__placement_finder_roads_desc: "Ob die Kartenmodi „Empfohlener Statthalter“ und „Empfohlene Hauptstadt“ von einer idealen Landinfrastruktur ausgehen oder die tatsächlich gebaute Infrastruktur verwenden."
 cm__placement_finder_roads_option_1_name: "$cm_txt_current$"
 cm__placement_finder_roads_option_1_desc: "Nutze die Straßen, die du tatsächlich gebaut hast."
 cm__placement_finder_roads_option_2_name: "Max. Straßen"
 cm__placement_finder_roads_option_2_desc: "Geht davon aus, dass auf jeder Verbindung die beste freigeschaltete Straße gebaut ist."
 cm__placement_finder_roads_option_3_name: "$cm_txt_best_possible$"
 cm__placement_finder_roads_option_3_desc: "Angenommen, die beste freigeschaltete Straße ist auf jeder Verbindung gebaut und jedes freigeschaltete Gebäude, das die Landnähe verbessert, ist an allen geeigneten Standorten errichtet."
 cm__placement_finder_naval_name: "Marineinfrastruktur"
 cm__placement_finder_naval_desc: "Ob die Kartenmodi „Empfohlener Statthalter“ und „Empfohlene Hauptstadt“ von einer idealen Marineinfrastruktur ausgehen oder die aktuelle Hafenkapazität und Marinepräsenz berücksichtigen."
 cm__placement_finder_naval_option_1_name: "$cm_txt_current$"
 cm__placement_finder_naval_option_1_desc: "Nutzt eure aktuelle Hafenkapazität und Flottenpräsenz."
 cm__placement_finder_naval_option_2_name: "Maximale Präsenz"
 cm__placement_finder_naval_option_2_desc: "Geht überall von vollständiger Marinepräsenz aus, basierend auf Eurer aktuellen Hafenkapazität."
 cm__placement_finder_naval_option_3_name: "$cm_txt_best_possible$"
 cm__placement_finder_naval_option_3_desc: "Geht von voller maritimer Präsenz und den besten freigeschalteten Hafengebäuden aus, die in jedem Küstenort errichtet wurden."
 cm__placement_finder_accuracy_name: "Suchgenauigkeit"
 cm__placement_finder_accuracy_desc: "Wie gründlich die Kartenmodi „Empfohlener Statthalter“ und „Empfohlene Hauptstadt“ nach den besten Standorten suchen. Übersprungene Standorte werden schwarz dargestellt."
 cm__placement_finder_accuracy_option_1_name: "Erschöpfend"
 cm__placement_finder_accuracy_option_1_desc: "Wertet jeden Standort aus. Am genauesten und am langsamsten."
 cm__placement_finder_accuracy_option_2_name: "Gründlich"
 cm__placement_finder_accuracy_option_2_desc: "Überspringt Standorte, die nicht unter die Top Drei kommen können. Die Top Drei und deren Punktzahlen sind identisch mit der Methode „Vollständig“, nur schneller."
 cm__placement_finder_accuracy_option_3_name: "Ausgeglichen"
 cm__placement_finder_accuracy_option_3_desc: "Überspringe Standorte, die nicht der alleinige Spitzenreiter sein können. Der beste Standort ist weiterhin garantiert exakt; die Markierungen für den 2. und 3. Platz können gelegentlich abweichen."
 cm__placement_finder_accuracy_option_4_name: "Schnell"
 cm__placement_finder_accuracy_option_4_desc: "Zudem werden Standorte übersprungen, die sehr unwahrscheinlich die besten sind. Der gefundene beste Standort liegt innerhalb von 20 % des tatsächlichen Bestwerts und ist meistens dennoch exakt."
 cm__placement_finder_accuracy_option_5_name: "Am schnellsten"
 cm__placement_finder_accuracy_option_5_desc: "Bewertet den vielversprechendsten Standort jeder Provinz und verfeinert diesen dann anhand der Spitzenreiter. Deutlich schneller für große Länder; kann den besten Standort übersehen."
 cm__debug_name: "$cm_txt_debug$"
 cm__debug__logging_name: "Aktionsprotokoll"
 cm__debug__logging_desc: "Welche Aktionen dieser Mod in das Mod-Aktionsprotokoll geschrieben werden."
 cm__log_cycle_name: "Bauzyklus"
 cm__log_cycle_desc: "Zeilen für einen monatlichen Zyklus, der übersprungen wurde, da der vorherige noch nicht abgeschlossen war, und für die Zurücksetzung nach zwei aufeinanderfolgenden Auslassungen."
 cm__log_food_name: "$cm__ab_food_name$"
 cm__log_food_desc: "Zeilen für die Kategorie Nahrung: Das monatliche Nahrungsangebot, die Nachfrage und das Verhältnis jedes Marktes, der jährliche Median, anhand dessen dieses Verhältnis im Vergleich zum Zielwert beurteilt wird, die Anzahl der Standorte, die dort bereits Nahrung anbauen, sowie jeder Standort, der dadurch aktiviert oder deaktiviert wird."
 cm__log_roads_name: "$cm__ab_roads_name$"
 cm__log_roads_desc: "Eine Zeile für jede von der Kategorie „Straßen“ in Auftrag gegebene Straße, mit Angabe des Standorts, für welchen der drei Zwecke die Straße gekauft wurde und was sie gekostet hat."
 cm__log_cleanup_name: "$cm__cleanup_name$"
 cm__log_cleanup_desc: "Zeilen für den jährlichen Gebäude-Bereinigungsdurchlauf sowie für jedes Gebäude, das geschlossen, reduziert, zerstört oder wiedereröffnet wird, mitsamt dem jeweiligen Gewinn und dem Schwellenwert, gegen den es geprüft wurde."
 cm__log_governors_name: "$cm__ab_governors_name$"
 cm__log_governors_desc: "Zeilen für den Gouverneursplan: Ausgewählte und verworfene Standorte, Upgrades für Märkte und Städte, Platzierungen, Verlegungen und Ablehnungen sowie der Hauptstadtumzug einer Glücklichen Nation."
 cm__log_military_name: "$cm_txt_lucky_nation_military$"
 cm__log_military_desc: "Zeilen für eine glückliche Nation, die Festungen zerstört und Mannstärke-Gebäude errichtet."
 cm__log_government_name: "Glückliche-Nation-Regierung"
 cm__log_government_desc: "Zeilen für eine glückliche Nation beim Entfernen von Bürokratie oder beim Durchführen einer Standesaktion."
 cm__debug__diagnostics_name: "Diagnose"
 cm__placement_finder_debug_path_name: "Debug-Diagnose aktivieren"
 cm__placement_finder_debug_path_desc: "Fügt den Tooltips der Kartenmodi „Empfohlener Statthalter“ und „Empfohlene Hauptstadt“ einen Diagnoseblock hinzu: die vorhergesagte Route von Eurer Hauptstadt zu jedem Standort mit den Kosten für jeden Sprung sowie die vorhergesagte Proximität im Vergleich zur tatsächlichen Proximität."
 cm__debug__probes_name: "Sonden"
 cm__debug__probes_desc: "Einmalige Diagnosen, die in das Mod-Aktionsprotokoll geschrieben werden."
 cm__probe_budget_name: "Autobau-Budget"
 cm__probe_budget_desc: "Der Saldo jeder Auto-Ausbau-Kategorie, positiv, wenn Gold für eine noch nicht erschwingliche Auswahl zurückgehalten wird, und negativ bei Schulden durch Mehrausgaben, dann das Gold, das im letzten Monat von keiner Kategorie ausgegeben wurde, das Produktions-Amortisationslimit und der beste Kandidat, der in einem Markt wartet und in diesem Zyklus übergangen wurde."
 cm__probe_budget_text: "$cm_txt_run$"
 cm__probe_governors_name: "Gouverneursplan"
 cm__probe_governors_desc: "Der aktuelle Stand des Gouverneursplans: seine Phase, wie viele Standorte er hält und noch zu platzieren hat, ob er den Staatsschatz beansprucht, die bezahlten Gouverneure sowie die Plätze und Sitze, gegen die er arbeitet."
 cm__probe_governors_text: "$cm_txt_run$"
 cm__probe_military_name: "$cm_txt_lucky_nation_military$"
 cm__probe_military_desc: "Die Rekrutenreserve-Gebäudestufe, auf der sich das Land befindet, ob es diese bauen kann, der Zustand des Hauptstadt-Paares, das Militärbudget und wie viele Standorte diese Stufe erhalten können im Vergleich dazu, wie viele sie bereits besitzen."
 cm__probe_military_text: "$cm_txt_run$"
 cm__probe_roads_name: "$cm__ab_roads_name$"
 cm__probe_roads_desc: "Wie viele Korridore der Straßenplan jeweils für Proximity, Marktzugang und Hauptstadtverbindung enthält, wie viele der Hauptstadtverbindungen bereits begonnen werden können, wie viele Straßen bereits im Bau sind, wie viele aufgrund eines Mangels an Baumaterialien im Markt blockiert sind und was im Pool der Kategorie verbleibt."
 cm__probe_roads_text: "$cm_txt_run$"
 cm__probe_log_gate_name: "Aktionslog-Schwelle"
 cm__probe_log_gate_desc: "Die Log-Kategorie für Kernwaren wird doppelt aufgeführt, so wie der Log-Filter sie liest und das Menü sie speichert, sodass eine Kategorie, die in der einen aktiv und in der anderen inaktiv ist, angezeigt wird."
 cm__probe_log_gate_text: "$cm_txt_run$"
