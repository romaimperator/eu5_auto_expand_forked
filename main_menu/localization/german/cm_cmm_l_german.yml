 cm__urbanize_rural_to_town_desc: "Wertet qualifizierte ländliche Siedlungen monatlich zu Städten auf. Erfordert 30.000 Pops oder einen Wert innerhalb von 1.000 der Bevölkerungsobergrenze. Orte, deren RGO in der untenstehenden Liste „Nicht urbanisieren“ markiert ist, werden übersprungen. Orte, die durch die Massen-Auto-Nahrung abgedeckt sind, werden ebenfalls übersprungen."
