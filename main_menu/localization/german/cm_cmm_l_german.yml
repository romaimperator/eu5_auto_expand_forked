l_german:
 # Mod
 cm_name: "Baumanager"
 cm_desc: "Eine umfassende Quality-of-Life-Mod, die neue Automatisierungen, Filter und Kartenmodi hinzufügt, um das EU5-Bauerlebnis erheblich zu verbessern."

 # Settings (settings) Tab
 cm__settings_name: "Einstellungen"
 ## Global Control (settings) Group
 cm__pause_auto_expand_name: "Automatisierung pausieren"
 cm__pause_auto_expand_desc: "Pausiert alle Automatisierungsfunktionen: automatischer Gebäudeausbau, automatischer RGO-Ausbau, Aufwertung aller Gebäude, automatischer Bau, automatische Nahrungsverwaltung und automatische Urbanisierung."
 cm__minimum_gold_name: "Goldreserve"
 cm__minimum_gold_desc: "Die einzuhaltende Mindestgoldreserve. Bauvorhaben werden nicht in die Warteschlange gestellt, wenn der Staatsschatz dadurch unter diesen Betrag fallen würde. Gilt für alle Automatisierungsfunktionen außer Auto-Urbanisierungs-Upgrades (die über eine eigene Goldeinstellung verfügen)."
 cm__minimum_gold_format: "[CMMV('cm__minimum_gold')]@gold!"
 cm__allowed_building_overbuild_levels_name: "Überbauungslimit"
 cm__allowed_building_overbuild_levels_desc: "Wie viele Gebäudelevel ein Ort sein Limit für unterstützte Gebäudelevel überschreiten darf, bevor der automatische Ausbau keine weiteren Bauaufträge mehr einreiht. Bei einem Wert von Null ist kein Überbauen zulässig."

 ## Priority List Group
 cm__settings__priority_list_name: "Bauautomatisierung"
 cm__settings__priority_list_desc: "Ziehen, um die Priorität der Funktionen zu ändern. Jeden Monat werden aktivierte Funktionen von oben nach unten ausgeführt. Beim automatischen Ausbau gibt der Wert neben jeder Funktion an, wie rentabel ein Ausbau sein muss, bevor er gebaut wird, basierend auf der gewählten „Metrik für automatischen Ausbau“: ein monatlicher Mindestbetrag in Gold pro Stufe für Steuereinnahmen und Gewinn oder eine maximale Anzahl von Jahren bis zur Amortisation der Baukosten für den ROI (0 = deaktiviert). „Mindestrabatt“ legt den maximal zulässigen Preisaufschlag für Baumaterialien fest (-33 % = nur wenn günstig, 0 = zum Basispreis, +33 % = auch bei Teuerung)."
 cm__priority_list_item_column_name: "Funktion"
 cm__priority_list_i1_name: "Gebäude automatisch ausbauen"
 cm__priority_list_i1_desc: "Erweitert automatisch mehrstufige Produktions- und Nicht-Produktionsgebäude, wenn diese profitabel sind, Pops verfügbar sind und das Gold über Eurer Goldreserve bleibt. Gilt nur an Standorten, an denen der automatische Ausbau aktiviert ist."
 cm__priority_list_i2_name: "RGOs automatisch ausbauen"
 cm__priority_list_i2_desc: "Erweitert automatisch die RGO-Stufen in Standorten, in denen der automatische RGO-Ausbau aktiviert ist, sofern Arbeiter verfügbar sind und die Ressourcen es zulassen."
 cm__priority_list_i3_name: "Alle Gebäude automatisch ausbauen"
 cm__priority_list_i3_desc: "Wertet automatisch jedes veraltete Gebäude auf, unabhängig davon, ob die automatische Erweiterung für dieses Gebäude aktiviert ist."
 cm__priority_list_i4_name: "Autobau"
 cm__priority_list_i4_desc: "Baut automatisch Gebäude, die nur einmal pro Standort vorkommen (Räte, Bibliotheken usw.), in der im Reiter „Automatischer Bau“ konfigurierten Reihenfolge und mit den dort gewählten Einstellungen."
 cm__priority_list_i5_name: "Auto-Nahrung"
 cm__priority_list_i5_desc: "Baut automatisch nahrungserzeugende RGOs und Gebäude an ländlichen Standorten und wählt dabei die Option mit der höchsten marginalen Nahrungsproduktion. Die Konfiguration erfolgt im Reiter „Auto-Nahrung“."
 cm__priority_list_i6_name: "Auto-Urbanisieren"
 cm__priority_list_i6_desc: "Befördert jeden Monat den Standortrang: ländliche Siedlungen zu Kleinstädten und Kleinstädte zu Städten. Der Aufstieg von ländlich zu Kleinstadt erfordert 30.000 Einwohner (wodurch sie sofort für den Stadtstatus berechtigt sind) oder einen Abstand von maximal 1.000 zur Bevölkerungsobergrenze (da das Wachstum sonst am ländlichen Limit stagnieren würde). Überspringt nicht integrierte Standorte. Konfiguration im Reiter „Auto-Urbanisierung“."
 cm__priority_list_i7_name: "Automatischer Bau von Hauptstadtgebäuden"
 cm__priority_list_i7_desc: "Baut automatisch nur in der Hauptstadt verfügbare Gebäude (Königshof, Oberster Gerichtshof, Kriegsakademie usw.) an Eurem Hauptstadtstandort, wenn die Bedingungen es zulassen."
 cm__priority_list__enabled_name: "Aktiviert"
 cm__priority_list__enabled_desc: "Aktivieren oder deaktivieren Sie diese Funktion. Deaktivierte Funktionen werden jeden Monat übersprungen."
 cm__priority_list__min_profit_name: "Min. Steuereinnahmen"
 cm__priority_list__min_profit_desc: "Erforderliches monatliches Minimum an Gold pro Stufe, bevor der Bau in die Warteschlange eingereiht wird. Auf 0 setzen, um die Prüfung zu deaktivieren."
 cm__priority_list__min_profit_postfix: "@gold!"
 cm__priority_list__min_discount_name: "Min. Rabatt"
 cm__priority_list__min_discount_desc: "Maximal zulässiger Preisaufschlag für Baumaterialien. Bei -33 % wird nur gebaut, wenn die Materialkosten 33 % unter dem Basispreis liegen. Bei 0 % nur zum Basispreis oder darunter. Bei +33 % wird selbst dann gebaut, wenn die Preise 33 % über dem Basispreis liegen."
 cm__priority_list__min_discount_postfix: "%"
 cm__priority_list__min_discount_prefix_high: "#R "
 cm__priority_list__min_discount_postfix_high: "%#!"
 cm__priority_list__min_discount_prefix_low: "#G "
 cm__priority_list__min_discount_postfix_low: "%#!"

