l_german:
 # Mod
 cm_name: "Baumanager"
 cm_desc: "Eine umfangreiche Quality-of-Life-Mod, die neue Automatisierungen, Filter und Kartenmodi hinzufügt, um das Bauerlebnis in EU5 erheblich zu verbessern."

 # Settings (settings) Tab
 ## Global Control (settings) Group
 cm__pause_auto_expand_name: "Automatisierung pausieren"
 cm__pause_auto_expand_desc: "Pausiert jede Automatisierungsfunktion, die diese Mod hinzufügt."
 cm__minimum_gold_name: "Goldreserve"
 cm__minimum_gold_desc: "Keine Automatisierung gibt Geld aus, wenn Ihr Staatsschatz unter diesen Betrag fällt."
 cm__minimum_gold_format: "[CMMV('cm__minimum_gold')]@gold!"
 cm__allowed_building_overbuild_levels_name: "Überbauungslimit"
 cm__allowed_building_overbuild_levels_desc: "Wie viele Gebäudestufen ein Standort sein Limit für unterstützte Gebäudestufen insgesamt überschreiten darf, bevor dort keine neuen Bauvorhaben mehr in die Warteschlange eingereiht werden. Nahrung, Statthalter und Gebäude an Standorten anderer Länder sind ausgenommen. Bei Null ist keine Überbauung zulässig. Ab 200+ gibt es kein Limit."

 ## Priority List Group
 cm__priority_list_item_column_name: "Funktion"
 cm__priority_list_i1_name: "Auto-Ausbau aktivierte Gebäude"
 cm__priority_list_i1_desc: "Erweitert automatisch mehrstufige Produktions- und Nicht-Produktionsgebäude, wenn diese rentabel sind, Pops verfügbar sind und das Gold über Eurer Goldreserve bleibt. Gilt dort, wo der automatische Ausbau für einen Standort oder einen gesamten Gebäudetyp aktiviert ist, einschließlich ausländischer Gebäude an Standorten anderer Länder."
 cm__priority_list_i2_name: "RGOs mit aktiviertem automatischem Ausbau"
 cm__priority_list_i2_desc: "Erweitert automatisch die RGO-Stufen in Standorten, in denen der automatische RGO-Ausbau aktiviert ist, sofern Arbeiter verfügbar sind und die Ressourcen es zulassen."
 cm__priority_list_i3_name: "Nahrung in aktivierten Standorten automatisch ausbauen"
 cm__priority_list_i3_desc: "Baut automatisch nahrungsproduzierende RGOs und Gebäude in ländlichen Orten, für die Ihr die automatische Nahrungsmittelversorgung aktiviert, und wählt dabei die nahrungseffizienteste Option aus."
 cm__priority_list_i4_name: "Alle Gebäude automatisch ausbauen"
 cm__priority_list_i4_desc: "Aktualisiert automatisch jedes Gebäude, das veraltet ist, unabhängig davon, ob der automatische Ausbau für dieses Gebäude aktiviert ist."
 cm__priority_list__enabled_name: "$cm_txt_enabled$"
 cm__priority_list__enabled_desc: "Aktiviert oder deaktiviert diese Funktion."
 cm__priority_list__min_profit_name: "Min. Steuereinnahmen"
 cm__priority_list__min_profit_desc: "Erforderliches monatliches Minimum an Gold pro Stufe, bevor der Bau in die Warteschlange eingereiht wird. Auf 0 setzen, um die Prüfung zu deaktivieren."
 cm__priority_list__min_profit_postfix: "@gold!"
 cm__priority_list__min_discount_name: "$cm_txt_min_discount$"
 cm__priority_list__min_discount_desc: "$cm_txt_min_discount_desc$"
 cm__priority_list__min_discount_postfix: "%"
 cm__priority_list__min_discount_prefix_high: "#R "
 cm__priority_list__min_discount_postfix_high: "%#!"
 cm__priority_list__min_discount_prefix_low: "#G "
 cm__priority_list__min_discount_postfix_low: "%#!"

