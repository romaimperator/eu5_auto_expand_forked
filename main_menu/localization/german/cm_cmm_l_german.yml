 cm__expand_metric_desc: "Wählen Sie aus, wonach der automatische Ausbau entscheidet, ob eine Gebäude- oder RGO-Stufe hinzugefügt wird."
 cm__expand_metric_option_1_name: "@income! Steuereinnahmen"
 cm__expand_metric_option_1_desc: "Fügt eine neue Stufe nur hinzu, wenn deren monatliches Steuereinkommen mindestens dem von Euch festgelegten Mindest-Steuereinkommen entspricht."
 cm__expand_metric_option_2_name: "@wealth! Gewinn"
 cm__expand_metric_option_2_desc: "Füge eine neue Stufe nur hinzu, wenn ihr monatlicher Gesamtgewinn mindestens den eingestellten Mindestgewinn erreicht."
 cm__expand_metric_option_3_name: "@efficiency! Rendite (Steuer)"
 cm__expand_metric_option_3_desc: "Fügt eine neue Stufe nur hinzu, wenn deren Steuereinnahmen die Baukosten innerhalb der von Euch festgelegten maximalen ROI-Jahre amortisieren."
 cm__expand_metric_option_4_name: "@efficiency! ROI (Gewinn)"
 cm__expand_metric_option_4_desc: "Fügt eine neue Stufe nur dann hinzu, wenn deren Gewinn die Baukosten innerhalb der festgelegten maximalen ROI-Jahre amortisiert."
 cm__auto_town_rights_list_i32_name: "@market_charter! [ShowTownRightsName('market_charter')]"
 cm__auto_town_rights_list_i33_name: "@free_town_charter! [ShowTownRightsName('free_town_charter')]"
 cm__auto_town_rights_list_i34_name: "@fortress_town! [ShowTownRightsName('fortress_town')]"
 cm__auto_town_rights_list_i35_name: "@mining_charter! [ShowTownRightsName('mining_charter')]"
 cm__auto_town_rights_list_i36_name: "@studium_privileges! [ShowTownRightsName('studium_privileges')]"
 cm__auto_town_rights_list_i37_name: "@agrarian_community_town_right! [ShowTownRightsName('agrarian_community_town_right')]"
 cm__auto_town_rights_list_i38_name: "@enlightened_leadership_reform_town_right! [ShowTownRightsName('enlightened_leadership_reform_town_right')]"
 cm__expand_metric: "cm__expand_metric"
 cm__town_rights_free_grants_name: "Kosten für Stadtrechte entfernen"
 cm__town_rights_free_grants_desc: "Wenn aktiviert, kostet das Gewähren von Stadtrechten keine Regierungsgewalt und deren Entzug keine Stabilität."
 cm__town_rights_min_gov_power_name: "Minimale Regierungsmacht"
 cm__town_rights_min_gov_power_desc: "Die automatische Vergabe von Stadtrechten stoppt, wenn die nächste Vergabe Eure Regierungsmacht (Legitimität, republikanische Tradition, Ergebenheit oder Hordeneinheit, je nach Regierungsform) unter diesen Wert senken würde."
 cm__allowed_building_overbuild_levels_format: "[CMMV('cm__allowed_building_overbuild_levels')][Select_CString(GreaterThanOrEqualTo_CFixedPoint(CMMV('cm__allowed_building_overbuild_levels'), CMMMapValue('cmm_max', 'cm__allowed_building_overbuild_levels')), '+', '')]"
 cm__auto_build_capital_name: "Hauptstadtgebäude"
 cm__auto_build_capital_desc: "Baut automatisch Nur-Hauptstadt-Gebäude (Königshof, Oberster Gerichtshof, Kriegsakademie usw.) in Eurer Hauptstadt, wenn die Bedingungen es zulassen. Diese werden vor der untenstehenden Liste gebaut."
 cm__urbanize_city_to_megalopolis_name: "Stadt zur Megalopolis"
 cm__urbanize_city_to_megalopolis_desc: "Wertet Eure Hauptstadt zu einer Megalopolis auf, sobald sie eine Handelszentrum-Stadt mit mindestens 400.000 Einwohnern ist."
 cm__megalopolis_ignore_capital_name: "Megalopolis: Hauptstadt-Anforderung ignorieren"
 cm__megalopolis_ignore_capital_desc: "Ermöglicht den Bau von „Megalopolis gründen“ in einer Stadt, die nicht Eure Hauptstadt ist."
 cm__megalopolis_ignore_market_center_name: "Megalopolis: Marktzentrum-Anforderung ignorieren"
 cm__megalopolis_ignore_market_center_desc: "Ermöglicht den Bau von „Megalopolis gründen“ in einer Stadt, die kein Marktzentrum ist."
 cm__deurbanize_name: "De-urbanisieren"
 cm__deurbanize_desc: "Jeden Monat werden eigene Standorte wieder zu ländlichen Siedlungen zurückgestuft, wenn ihr RGO-Gut in der untenstehenden „Nicht urbanisieren“-Liste markiert ist. Eure Hauptstadt, eroberte Standorte und Standorte, die Proximität bieten, wie etwa Gouverneurssitze, bleiben unberührt."
 cm__auto_urbanize_ignore_list_i20_name: "@wool! [ShowGoodsName('wool')] ([GetGlobalVariable('cm_goods_wool').GetGoods.GetDefaultMarketPrice]@gold!)"
 cm__full_automation_name: "Vollständige Automatisierung"
 cm__full_automation__full_automation_name: "Vollständige Automatisierung"
 cm__full_automation__full_automation_desc: "Automatischer Bau. Jeden Monat geben die unten stehenden Kategorien den Teil des Staatsschatzes, der die Goldreserve übersteigt, für die besten verfügbaren Bauprojekte aus. Läuft parallel zu anderen Automatisierungsfunktionen, ohne deren Einstellungen zu verändern."
 cm__fa_enabled_name: "Vollständige Automatisierung aktivieren"
 cm__fa_enabled_desc: "Vollständige Automatisierung ein- oder ausschalten."
 cm__fa_reserve_name: "Goldreserve"
 cm__fa_reserve_desc: "Die Vollautomatisierung senkt Ihren Staatsschatz niemals unter diesen Betrag. Unabhängig von der Goldreserve im Reiter „Einstellungen“."
 cm__fa_reserve_format: "[CMMV('cm__fa_reserve')]@gold!"
 cm__fa_save_unaffordable_name: "Sparen für unerschwingliche Gebäude"
 cm__fa_save_unaffordable_desc: "Eine Kategorie kauft das beste gefundene Gebäude, selbst wenn es mehr als ihren monatlichen Anteil kostet, und setzt danach so lange aus, bis spätere Monate die Differenz ausgeglichen haben. Im deaktivierten Zustand gibt jede Kategorie aus, was sie kann, und reicht den Rest weiter."
 cm__full_automation__fa_priority_list_name: "Prioritäten"
 cm__full_automation__fa_priority_list_desc: "Ziehen zum Umordnen. Kategorien werden jeden Monat von oben nach unten abgearbeitet. Wenn zwei Kategorien dasselbe Gebäude anfordern, baut es die höher platzierte."
 cm__fa_priority_list_item_column_name: "Kategorie"
 cm__fa_priority_list_i1_name: "Nahrung"
 cm__fa_priority_list_i1_desc: "Überwacht die Lebensmittelversorgung im Jahresverlauf in Märkten, deren Marktzentrum Ihr besitzt, und aktiviert an Orten mit dem höchsten Lebensmittelpotenzial die Lebensmittel-Automatik, falls der Medianmonat ein Defizit aufwies. Die ausgewählten Orte leuchten wie vom Spieler aktivierte, doch der Schalter bleibt in Eurer Hand; sie werden nie deaktiviert, es sei denn, der Ort ist keine ländliche Siedlung in Eurem Besitz mehr oder Ihr besitzt nicht mehr dessen Marktzentrum."
 cm__fa_priority_list_i2_name: "Industrie"
 cm__fa_priority_list_i2_desc: "Baut, erweitert und verbessert jene Produktionsgebäude und RGOs, die ihre Kosten am schnellsten über Steuereinnahmen amortisieren. Standorte mit automatischer Lebensmittelproduktion werden ignoriert, solange dort bereits ein Mangel an Arbeitskräften jeglicher Art herrscht."
 cm__fa_priority_list_i3_name: "Preiskollapsar"
 cm__fa_priority_list_i3_desc: "Erweitert die Produktion von Baumaterialien, um deren Preise zu senken. Wirkt in Märkten, deren Marktzentrum Ihr besitzt. Die produktivsten Standorte werden zuerst ausgebaut und erhalten jeweils mehrere Stufen auf einmal, wobei die Produktion selbst dort beginnt, wo noch keine Arbeiter eingetroffen sind. Eure Hauptstadt, nahrungsproduzierende Standorte und Betriebe, die ohne Subventionen Verluste machen würden, werden übersprungen."
 cm__fa_priority_list_i4_name: "Straßen"
 cm__fa_priority_list_i4_desc: "Baut das Straßennetz mit dem besten Preis-Leistungs-Verhältnis hinsichtlich dreier Faktoren: Proximität, Marktzugang und die Anbindung an Eure Hauptstadt. Einmal im Jahr wird die beste Route zu jedem Eurer Orte berechnet; jeden Monat werden dann die Abschnitte begonnen, welche die Steuerbasis am stärksten erhöhen würden, wobei alle dahinterliegenden Orte der Route berücksichtigt werden. Günstige, flache Korridore werden zuerst angelegt, und die unteren beiden Kategorien erhalten nur in Monaten Gold, in denen für die darüber liegende Kategorie nichts mehr zu bauen übrig ist."
 cm__fa_priority_list_i5_name: "Versorgung"
 cm__fa_priority_list_i5_desc: "Baut unterstützende Infrastruktur überall dort, wo sie passt: Hauptstadtgebäude, die Auto-Ausbauliste, Quecksilber-Patios, Marktzentrum-Gebäude, Vögte und alle einzigartigen Gebäude Eures Landes, die die Kontrolle erhöhen, Marktplätze, krankheitsresistente Gebäude und zuletzt Kornspeicher. Kontrollgebäude werden zuerst in den wohlhabendsten Standorten errichtet und Marktplätze zuerst in den Standorten mit dem geringsten Marktzugang."
 cm__fa_priority_list_i6_name: "Gebäudebereinigung"
 cm__fa_priority_list_i6_desc: "Schließt einmal jährlich Produktionsgebäude, die keinen Gewinn mehr erwirtschaften und nicht subventioniert werden, und zerstört sie stattdessen, wenn der Standort innerhalb von zehn Stufen der unterstützten Gebäudestufen liegt. Geschlossene Gebäude werden wiedereröffnet, sobald dieser Typ in diesem Markt wieder rentabel ist, und später zerstört, falls der Standort keinen Platz mehr bietet. @farming_village! [ShowBuildingTypeNameWithNoTooltip('farming_village')] wird niemals geschlossen oder zerstört."
 cm__fa_priority_list_i7_name: "Gouverneure"
 cm__fa_priority_list_i7_desc: "Plant, wo Eure Gouverneure residieren sollen, und setzt sie dort ein, wobei der beste Standort zuerst gewählt wird. Die Planung erfolgt erneut, sobald ein Gouverneursplatz frei wird, ansonsten alle 25 Jahre. Nur für den Einzelspieler."
 cm__fa_priority_list_i8_name: "Stadtrechte"
 cm__fa_priority_list_i8_desc: "Verleiht Euren Märkten und Städten Stadtrechte. [ShowTownRightsNameWithNoTooltip('granary_town')] erfolgt zuerst, gefolgt von einem Spezialisierungsrecht, das zufällig aus jenen ausgewählt wird, die zu den am Standort produzierten Gütern passen."
 cm__fa_priority_list__budget_name: "Budgetanteil"
 cm__fa_priority_list__budget_desc: "Der Anteil des Staatsschatzes oberhalb der Goldreserve, den diese Kategorie jeden Monat ausgeben darf."
 cm__fa_priority_list__budget_postfix: "%"
 cm__fa_priority_list__enabled_name: "Aktiviert"
 cm__fa_priority_list__enabled_desc: "Diese Kategorie bauen lassen."
 cm__full_automation__fa_industry_name: "Industrie"
 cm__full_automation__fa_industry_desc: "Einstellungen für die Industriekategorie oben."
 cm__fa_industry_algorithm_name: "Baustrategie"
 cm__fa_industry_algorithm_desc: "Wie die Industrie auswählt, was gebaut wird."
 cm__fa_industry_algorithm_option_1_name: "Gierig"
 cm__fa_industry_algorithm_option_1_desc: "Baue zuerst die Optionen mit der schnellsten Amortisierung und nur jene, die sich in der Nähe des besten Standorts zur Herstellung derselben Güter befinden."
 cm__fa_industry_max_rel_roi_name: "Maximale relative Kapitalrendite"
 cm__fa_industry_max_rel_roi_desc: "Wie viel langsamer ein Gebäude oder eine Verbesserung seine Kosten im Vergleich zum rentabelsten Ort für dieselben Güter amortisieren darf, um dennoch gebaut zu werden. Bei 30 % werden, wenn sich der beste Ort in 10 Jahren amortisiert, nur jene gebaut, die sich innerhalb von 13 Jahren amortisieren; alles Langsamere wartet. Bei 0 % wird jeden Monat nur der beste Produzent jeder Güterart gebaut. Ab 100 %+ gibt es keine Beschränkung und es gelten nur die Max Payback Years. Alle Gebäude, die dieselben Güter produzieren, werden zusammen gewertet, ungeachtet ihrer Art. RGO-Erweiterungen werden immer in der Reihenfolge ihrer Amortisation gebaut."
 cm__fa_industry_max_rel_roi_format: "[CMMV('cm__fa_industry_max_rel_roi')]%[Select_CString(GreaterThanOrEqualTo_CFixedPoint(CMMV('cm__fa_industry_max_rel_roi'), CMMMapValue('cmm_max', 'cm__fa_industry_max_rel_roi')), '+', '')]"
 cm__fa_industry_min_roi_name: "Maximale Amortisationsjahre"
 cm__fa_industry_min_roi_desc: "Es werden nur Bauvorhaben berücksichtigt, deren Steuereinnahmen die Baukosten innerhalb dieser Anzahl an Jahren decken. Auf 0 setzen, um die Prüfung zu deaktivieren."
 cm__fa_industry_min_roi_format: "[CMMV('cm__fa_industry_min_roi')] und @efficiency!"
 cm__full_automation__fa_collapsar_name: "Preiskollaps"
 cm__full_automation__fa_collapsar_desc: "Einstellungen für die obige Preis-Kollapsar-Kategorie. Materialien werden von oben nach unten in der Liste abgearbeitet, wobei RGOs vor Produktionsgebäuden ausgebaut werden."
 cm__fa_collapsar_target_name: "Preisziel"
 cm__fa_collapsar_target_desc: "Der Preis, bei dem der Bau für ein Material stoppt, relativ zu seinem Basispreis. Bei -33 % werden Produktionsstätten gebaut, bis das Material 33 % unter dem Basispreis gehandelt wird. Bei 0 % bis zum Erreichen des Basispreises. Bei +33 % nur, solange es mehr als 33 % über dem Basispreis kostet."
 cm__fa_collapsar_target_format: "[CMMV('cm__fa_collapsar_target')]%"
 cm__fa_collapsar_item_column_name: "Material"
 cm__fa_collapsar_i1_name: "@masonry! [ShowGoodsName('masonry')]"
 cm__fa_collapsar_i2_name: "@lumber! [ShowGoodsName('lumber')]"
 cm__fa_collapsar_i3_name: "@sand! [ShowGoodsName('sand')]"
 cm__fa_collapsar_i4_name: "@glass! [ShowGoodsName('glass')]"
 cm__fa_collapsar__enabled_name: "Aktiviert"
 cm__fa_collapsar__enabled_desc: "Arbeitet daran, den Preis dieses Materials zu senken."
 cm__full_automation__fa_food_name: "Nahrung"
 cm__full_automation__fa_food_desc: "Einstellungen für die obige Kategorie Nahrung."
 cm__fa_food_target_name: "Überschussziel"
 cm__fa_food_target_desc: "Ein Markt erhält so lange zusätzliche Nahrungsmittelstandorte, bis sein Angebot diesen Anteil seines Bedarfs erreicht. Bei 125 % wird die Nahrungsproduktion in jedem Markt ausgebaut, dessen Medianmonat des Jahres keinen Überschuss von 25 % erreicht hat. Erhöhen Sie den Wert, um einen größeren Puffer beizubehalten, oder senken Sie ihn, um nur Märkten zu helfen, die kurz vor einem Mangel stehen."
 cm__fa_food_target_format: "[CMMV('cm__fa_food_target')]%"
 cm__fa_food_min_potential_name: "Minimales Nahrungspotenzial"
 cm__fa_food_min_potential_desc: "Auto-Nahrung wird nur an Standorten aktiviert, deren Nahrungspotenzial pro RGO-Stufe diesen Wert erreicht, denselben Wert, den der Kartenmodus $mapmode_cm_location_food_potential_name$ anzeigt. Erhöhen Sie ihn, um auf besseres Ackerland zu warten, oder senken Sie ihn, um schwächeres Land zu akzeptieren."
 cm__fa_food_min_potential_format: "[CMMV('cm__fa_food_min_potential')]"
 cm__full_automation__fa_urban_rights_name: "Stadtrechte"
 cm__full_automation__fa_urban_rights_desc: "Einstellungen für die Kategorie Stadtrechte oben."
 cm__fa_urban_rights_window_name: "Eignungsschwellenwert"
 cm__fa_urban_rights_window_desc: "Wie gut ein Spezialisierungsrecht im Vergleich zum dort am besten geeigneten Recht zu einem Standort passen muss, um in die Auswahl zu kommen. Bei 50 % kann jedes Recht gezogen werden, das mindestens halb so gut passt, wobei besser geeignete häufiger gezogen werden. Bei 100 % wird nur das am besten geeignete Recht gewährt."
 cm__fa_urban_rights_window_format: "[CMMV('cm__fa_urban_rights_window')]%"
 cm__fa_urban_rights_reserve_name: "Regierungsmachtreserve"
 cm__fa_urban_rights_reserve_desc: "Es wird kein Stadtrecht gewährt, wenn die Kosten dafür Eure Regierungsmacht (Legitimität, republikanische Tradition, Ergebenheit oder Hordeneinheit, je nach Regierungsform) unter diesen Wert senken würden."
 cm__fa_urban_rights_expand_name: "Die geförderten Industrien ausbauen"
 cm__fa_urban_rights_expand_desc: "Wenn ein Spezialisierungsrecht gewährt wird, aktiviert dies an diesem Standort auch den Auto-Ausbau für die vom Recht geförderten Industrien sowie für deren Rohstoffe, sofern der Standort diese produziert. Entspricht dem Rechtsklick auf eine Schaltfläche zum Erteilen auf der Karte für Empfohlene Stadtrechte."
 cm__full_automation__fa_cleanup_name: "Gebäudebereinigung"
 cm__full_automation__fa_cleanup_desc: "Einstellungen für die Kategorie Gebäude-Bereinigung oben."
 cm__fa_cleanup_min_profit_name: "Mindestprofit"
 cm__fa_cleanup_min_profit_desc: "Ein Gebäude, das weniger als diesen Betrag pro Monat erwirtschaftet, gilt als nicht rentabel und wird geschlossen oder abgerissen, sofern es nicht subventioniert wird. Höchstens die Hälfte der offenen Gebäude eines Gebäudetyps in einem Markt wird gleichzeitig stillgelegt."
 cm__fa_cleanup_min_profit_format: "[Divide_CFixedPoint(CMMV('cm__fa_cleanup_min_profit'), '(CFixedPoint)100')|2]@gold!"
 cm__fa_cleanup_core_goods_name: "Baumaterialien priorisieren"
 cm__fa_cleanup_core_goods_desc: "Halte Gebäude, die hauptsächlich @masonry![ShowGoodsNameWithNoTooltip('masonry')], @lumber![ShowGoodsNameWithNoTooltip('lumber')], @sand![ShowGoodsNameWithNoTooltip('sand')] oder @glass![ShowGoodsNameWithNoTooltip('glass')] verbrauchen, auf dem zweifachen Mindestprofit oder 0,1@gold!, je nachdem, welcher Wert höher ist. Gebäude, die eines der vier produzieren, werden nach dem normalen Mindestprofit bewertet."
 cm__fa_cleanup_auto_food_name: "Auto-Nahrungs-Standorte leeren"
 cm__fa_cleanup_auto_food_desc: "Wo die automatische Nahrungsproduktion aktiv ist und Arbeiter jeglicher Art bereits knapp sind, werden Produktionsgebäude zerstört, die keine Nahrung produzieren. Ein @market_village! [ShowBuildingTypeNameWithNoTooltip('market_village')] wird auf eine Stufe zurückgebaut, anstatt zerstört zu werden."
 cm__full_automation__fa_roads_name: "Straßen"
 cm__full_automation__fa_roads_desc: "Einstellungen für die obige Straßen-Kategorie."
 cm__fa_roads_proximity_name: "Nähe"
 cm__fa_roads_proximity_desc: "Baue die Straßenabschnitte, welche die Proximität für das Gold am meisten erhöhen, wobei jeder weitere Ort entlang der Route dahinter mitgezählt wird."
 cm__fa_roads_market_access_name: "Marktzugang"
 cm__fa_roads_market_access_desc: "Verlegt die Straßenabschnitte, die den Marktzugang am effizientesten pro Gold erhöhen. Es wird nur in Monaten investiert, in denen keine Proximity-Abschnitte mehr zum Verlegen vorhanden sind."
 cm__fa_roads_capital_name: "Hauptstadtverbindung"
 cm__fa_roads_capital_desc: "Verlegt Straßenabschnitte, um Ihre Standorte mit der Hauptstadt zu verbinden, ausgehend von den bereits angeschlossenen Standorten nach außen. Investiert in einem Monat nur dann, wenn keine Abschnitte für Nähe und Marktzugang mehr zu bauen sind."
 cm__full_automation__fa_governors_name: "Gouverneure"
 cm__full_automation__fa_governors_desc: "Einstellungen für die Gouverneurskategorie oben."
 cm__fa_gov_move_seats_name: "Statthalter versetzen erlauben"
 cm__fa_gov_move_seats_desc: "Wenn alle Statthalter-Plätze belegt sind, wird ein Statthalter abgezogen und stattdessen an einem besseren Standort eingesetzt. Der bessere Standort muss bereits eine Stadt sein oder eine um mehr als 10 % höhere Wertung erzielen als der ersetzte Standort. Ist diese Option deaktiviert, werden Statthalter nur in leere Plätze eingesetzt."
 cm__fa_gov_prepare_sites_name: "Vorbereitung neuer Standorte zulassen"
 cm__fa_gov_prepare_sites_desc: "Berücksichtigt Standorte, die noch keinen Statthalter aufnehmen können, und bereitet diese zuerst vor, indem dort eine Kleinstadt oder Stadt gegründet und eine Straße zu Eurer Hauptstadt gebaut wird. Ist dies deaktiviert, werden nur Standorte berücksichtigt, die bereits eine Stadt mit einer Straßenverbindung zu Eurer Hauptstadt sind."
 cm__map_modes_name: "Kartenmodi"
 cm__map_modes__placement_finder_name: "Empfohlene Hauptstadt & Gouverneurssitz"
 cm__map_modes__placement_finder_desc: "Einstellungen für die Kartenmodi „Empfohlener Statthalter“ und „Empfohlene Hauptstadtplatzierung“."
 cm__placement_finder_method_name: "Platzierungsfinder-Bewertung"
 cm__placement_finder_method_desc: "Wie die Kartenmodi „Empfohlener Statthalter“ und „Empfohlene Hauptstadt“ deine Standorte bewerten."
 cm__placement_finder_method_option_1_name: "Steuerbasis"
 cm__placement_finder_method_option_1_desc: "Sortieren danach, wie sehr ein dort eingesetzter Statthalter oder eine dort platzierte Hauptstadt eure gesamte Steuerbasis erhöhen würde. Wohlhabendere Orte zählen mehr."
 cm__placement_finder_method_option_2_name: "Nähe"
 cm__placement_finder_method_option_2_desc: "Sortieren nach der Proximität, die ein dort platzierter Statthalter oder eine Hauptstadt hinzufügen würde."
 cm__placement_finder_roads_name: "Landinfrastruktur"
 cm__placement_finder_roads_desc: "Ob die Kartenmodi „Empfohlener Gouverneur“ und „Empfohlene Hauptstadt“ von einer idealen Landinfrastruktur ausgehen oder das verwenden, was tatsächlich gebaut wurde."
 cm__placement_finder_roads_option_1_name: "Aktuell"
 cm__placement_finder_roads_option_1_desc: "Nutzt die Straßen, die Ihr tatsächlich gebaut habt."
 cm__placement_finder_roads_option_2_name: "Max. Straßen"
 cm__placement_finder_roads_option_2_desc: "Geht davon aus, dass die beste freigeschaltete Straße auf jeder Verbindung gebaut ist."
 cm__placement_finder_roads_option_3_name: "Bestmöglich"
 cm__placement_finder_roads_option_3_desc: "Geht davon aus, dass die beste freigeschaltete Straße auf jeder Verbindung und jedes freigeschaltete Gebäude, das die Landnähe verbessert, überall dort gebaut wurde, wo es zulässig ist."
 cm__placement_finder_naval_name: "Marineinfrastruktur"
 cm__placement_finder_naval_desc: "Ob die Kartenmodi für den empfohlenen Statthalter und die empfohlene Hauptstadt von einer idealen Marineinfrastruktur ausgehen oder eure aktuelle Hafenkapazität und Marinepräsenz verwenden."
 cm__placement_finder_naval_option_1_name: "Aktuell"
 cm__placement_finder_naval_option_1_desc: "Nutzt Eure aktuelle Hafenkapazität und Flottenpräsenz."
 cm__placement_finder_naval_option_2_name: "Maximale Präsenz"
 cm__placement_finder_naval_option_2_desc: "Gehe von vollständiger Marinepräsenz überall aus, bei deiner aktuellen Hafenskapazität."
 cm__placement_finder_naval_option_3_name: "Bestmöglich"
 cm__placement_finder_naval_option_3_desc: "Geht von voller Flottenpräsenz und den besten freigeschalteten Hafengebäuden aus, die an jedem Küstenstandort errichtet wurden."
 cm__placement_finder_accuracy_name: "Suchgenauigkeit"
 cm__placement_finder_accuracy_desc: "Wie gründlich die Kartenmodi für „Empfohlener Statthalter“ und „Empfohlene Hauptstadt“ nach den besten Standorten suchen. Übersprungene Standorte werden schwarz angezeigt."
 cm__placement_finder_accuracy_option_1_name: "Erschöpfend"
 cm__placement_finder_accuracy_option_1_desc: "Jeden Standort bewerten. Am genauesten und am langsamsten."
 cm__placement_finder_accuracy_option_2_name: "Gründlich"
 cm__placement_finder_accuracy_option_2_desc: "Überspringe Standorte, die nicht unter die Top Drei kommen können. Die Top Drei und deren Punktzahlen sind identisch mit „Vollständig“, nur schneller."
 cm__placement_finder_accuracy_option_3_name: "Ausgeglichen"
 cm__placement_finder_accuracy_option_3_desc: "Überspringe Standorte, die nicht der absolut beste sein können. Der beste Standort ist weiterhin garantiert exakt; die 2. und 3. Marker können gelegentlich abweichen."
 cm__placement_finder_accuracy_option_4_name: "Schnell"
 cm__placement_finder_accuracy_option_4_desc: "Überspringt zudem Standorte, die sehr unwahrscheinlich die besten sind. Der gefundene beste Standort liegt innerhalb von 20 % des tatsächlichen Bestwerts und ist meist dennoch exakt."
 cm__placement_finder_accuracy_option_5_name: "Am schnellsten"
 cm__placement_finder_accuracy_option_5_desc: "Bewertet den aussichtsreichsten Standort jeder Provinz und verfeinert dann um die Spitzenreiter. Deutlich schneller für große Länder; kann den optimalen Standort übersehen."
 cm__debug_name: "Debug"
 cm__debug__logging_name: "Aktionsprotokoll"
 cm__debug__logging_desc: "Welche Aktionen dieser Mod werden in das Mod-Aktionsprotokoll geschrieben."
 cm__log_cycle_name: "Bauzyklus"
 cm__log_cycle_desc: "Zeilen für einen monatlichen Zyklus, der übersprungen wurde, da der vorherige noch verarbeitet wurde, und für die Zurücksetzung nach zwei aufeinanderfolgenden Überspringen."
 cm__log_industry_name: "Industrie"
 cm__log_industry_desc: "Zeilen für jedes Gebäude, das die Kategorie Industrie einreiht, und jede berücksichtigte Rohstofferweiterung, mit der Amortisation und dem Einkommen dahinter."
 cm__log_collapsar_name: "Preis-Kollapsar"
 cm__log_collapsar_desc: "Zeilen, die einen Ort durch einen Price-Collapsar-Zyklus verfolgen: das Marktdefizit und die angeforderten Stufen, danach was diesem Ort zugewiesen, bewertet und gebaut wurde. Markiert den Ort zuerst mit dem Konsolenbefehl effect location:<key> = { cm_fa_col_watch_on = yes }."
 cm__log_food_name: "Auto-Nahrung"
 cm__log_food_desc: "Zeilen für die Kategorie Nahrung: monatliches Nahrungsangebot, Nachfrage und Verhältnis jedes Marktes, der jährliche Median, nach dem dieses Verhältnis im Vergleich zum Zielwert beurteilt wird, die Anzahl der Standorte, die dort bereits Nahrung produzieren, und jeder Standort, der dadurch aktiviert oder deaktiviert wird."
 cm__log_roads_name: "Straßen"
 cm__log_roads_desc: "Eine Zeile für jede Straße, welche die Kategorie Straßen in Auftrag gibt, mit Angabe des Ortes, für welchen der drei Zwecke die Straße gekauft wurde und was sie gekostet hat."
 cm__log_cleanup_name: "Gebäudebereinigung"
 cm__log_cleanup_desc: "Zeilen für den jährlichen Gebäude-Bereinigungsdurchlauf und für jedes Gebäude, das geschlossen, reduziert, zerstört oder wiedereröffnet wird, mit dem jeweiligen Gewinn und der Untergrenze, gegen die es geprüft wurde."
 cm__log_governors_name: "Gouverneure"
 cm__log_governors_desc: "Zeilen für den Gouverneursplan: Ausgewählte und verworfene Standorte, Ausbauten von Kleinstädten und Städten, Platzierungen, Umplatzierungen und Ablehnungen, sowie der Hauptstadtumzug einer Glücksnation."
 cm__log_military_name: "Militär der glücklichen Nation"
 cm__log_military_desc: "Zeilen für eine glückliche Nation, die Festungen abreißt und Rekrutenreserve-Gebäude baut."
 cm__log_government_name: "Glückliche Nation-Regierung"
 cm__log_government_desc: "Zeilen für eine glückliche Nation, die eine Bürokratie entfernt oder eine Standesaktion durchführt."
 cm__debug__diagnostics_name: "Diagnose"
 cm__placement_finder_debug_path_name: "Debug-Diagnose aktivieren"
 cm__placement_finder_debug_path_desc: "Fügt den Tooltips der Kartenmodi „Empfohlener Statthalter“ und „Empfohlene Hauptstadt“ einen Diagnoseblock hinzu: die vorhergesagte Route von Ihrer Hauptstadt zu jedem Standort mit den Kosten jedes Sprungs sowie die vorhergesagte Proximität im Vergleich zu Ihrer tatsächlichen Proximität."
 cm__debug__probes_name: "Sonden"
 cm__debug__probes_desc: "Einmalige Diagnosen, die in das Mod-Aktions-Log geschrieben werden."
 cm__probe_budget_name: "Budget für Vollautomatisierung"
 cm__probe_budget_desc: "Der Saldo jeder Vollautomatisierungs-Kategorie, positiv, wenn Gold für eine noch nicht bezahlbare Auswahl zurückgehalten wird, und negativ bei Schulden durch Mehrausgaben, zusammen mit dem Industrie-Amortisationslimit und dem besten Kandidaten, der in einem in diesem Zyklus übergangenen Markt wartet."
 cm__probe_budget_text: "Ausführen"
 cm__probe_governors_name: "Statthalterplan"
 cm__probe_governors_desc: "Der aktuelle Stand des Statthalterplans: seine Phase, wie viele Standorte er belegt und noch zu platzieren hat, ob er den Staatsschatz beansprucht, die bezahlten Statthalter sowie die Bauplätze und Sitze, gegen die er arbeitet."
 cm__probe_governors_text: "Ausführen"
 cm__probe_military_name: "Militär der glücklichen Nation"
 cm__probe_military_desc: "Die Rekrutenreserve-Gebäudestufe des Landes, ob es diese bauen kann, der Status des Hauptstadt-Paares, das Militärbudget und wie viele Standorte diese Stufe erhalten können im Vergleich dazu, wie viele sie bereits haben."
 cm__probe_military_text: "Ausführen"
 cm__probe_industry_anchors_name: "Industrieanker"
 cm__probe_industry_anchors_desc: "Eine Zeile pro Ware mit der besten von der Industrie verzeichneten Amortisation und der dadurch gesetzten Amortisationsgrenze, unter Angabe des jeweiligen Gebäudes und Standorts."
 cm__probe_industry_anchors_text: "Ausführen"
 cm__probe_industry_rgo_name: "Industrierohstoffe"
 cm__probe_industry_rgo_desc: "Eine Zeile für jeden Grund, warum die Industrie die Rohstoffe eines Standorts übergangen hat, oder eine einzelne Zeile, wenn keine übergangen wurden. Liest die Hauptstadt aus, sofern Ihr nicht einen Standort mit dem Konsolenbefehl effect location:<key> = { cm_fa_col_watch_on = yes } markiert."
 cm__probe_industry_rgo_text: "Ausführen"
 cm__probe_collapsar_name: "Preiskollapsar"
 cm__probe_collapsar_desc: "Jede Zahl, die Price Collapsar an einem Ort liest, jeweils neben der spieleigenen Anzeige, sowie das, was der Markt dieses Ortes in einem Zyklus absorbieren könnte. Liest die Hauptstadt aus, es sei denn, Ihr markiert einen Ort mit dem Konsolenbefehl effect location:<key> = { cm_fa_col_watch_on = yes }; die Hauptstadt ist niemals ein Kandidat für Price Collapsar, markiert also einen Ort, um einen zu lesen, in dem er bauen würde."
 cm__probe_collapsar_text: "Ausführen"
 cm__probe_roads_name: "Straßen"
 cm__probe_roads_desc: "Wie viele Korridore der Straßenplan für Nähe, Marktzugang und Hauptstadtverbindung jeweils vorsieht, wie viele der Hauptstadtverbindungen bereits begonnen werden können, wie viele Straßen bereits im Bau sind und was im Pool der Kategorie verbleibt."
 cm__probe_roads_text: "Ausführen"
 cm__probe_log_gate_name: "Aktionslog-Filter"
 cm__probe_log_gate_desc: "Die Log-Kategorie „Price Collapsar“ doppelt, so wie das Log-Gate sie liest und wie das Menü sie speichert, damit eine Kategorie, die in der einen aktiviert und in der anderen deaktiviert ist, angezeigt wird."
 cm__probe_log_gate_text: "Ausführen"
