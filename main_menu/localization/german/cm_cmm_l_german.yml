 cm__ab_food__ab_food_name: "$cm__ab_food_name$" # NO-TRANSLATE
 cm__ab_food_target_name: "Überschussziel"
 cm__ab_food_target_desc: "Ein Markt erhält mehr Nahrungsmittelstandorte, bis sein Angebot diesen Anteil seiner Nachfrage erreicht. Bei 125 % wird die Nahrungsmittelproduktion in jedem Markt ausgebaut, dessen Medianmonat des Jahres keinen Überschuss von 25 % erreicht hat. Erhöhen Sie diesen Wert, um einen größeren Puffer beizubehalten, oder senken Sie ihn, um nur Märkten zu helfen, die näher an einem Mangel liegen."
 cm__ab_food_target_format: "[CMMV('cm__ab_food_target')]%" # NO-TRANSLATE
 cm__ab_food_min_potential_name: "Minimales Nahrungspotenzial"
 cm__ab_food_min_potential_desc: "Auto-Nahrung wird nur an Standorten aktiviert, deren Nahrungspotenzial pro RGO-Stufe diesen Wert erreicht – denselben Wert, den der $mapmode_cm_location_food_potential_name$-Kartenmodus anzeigt. Erhöhen Sie ihn, um auf besseres Ackerland zu warten, oder senken Sie ihn, um auch schwächeres Land zu akzeptieren."
 cm__ab_food_min_potential_format: "[CMMV('cm__ab_food_min_potential')]" # NO-TRANSLATE
 cm__ab_food_subsidize_name: "Nahrungsgebäude subventionieren"
 cm__ab_food_subsidize_desc: "Subventioniert die nahrungsmittelproduzierenden Gebäude, die vom automatischen Nahrungsausbau errichtet werden. Ein Gebäude, das keinen Gewinn erwirtschaftet, stellt niemanden ein und produziert keine Nahrung, weshalb ein Bauerndorf auf kargem Boden brachliegt; Subventionen halten es besetzt und sichern die Ernte. Subventionen werden niemals wieder deaktiviert."
 cm__ab_food_run_now_name: "Nahrungsplanung neu erzwingen"
 cm__ab_food_run_now_desc: "Wählt die Lebensmittelstandorte jetzt erneut aus, basierend auf der Lebensmittelbilanz dieses Monats sowie den bereits erfassten Monaten, anstatt auf die jährliche Überprüfung zu warten."
 cm__ab_food_run_now_text: "$cm_txt_run_now$" # NO-TRANSLATE
 cm__ab_food__debug_name: "$cm_txt_debug$" # NO-TRANSLATE
 cm__dbg_run_food_name: "Nahrung ausführen"
 cm__dbg_run_food_desc: "$cm_txt_dbg_run_category_desc$" # NO-TRANSLATE
 cm__dbg_run_food_text: "$cm_txt_run_now$" # NO-TRANSLATE
 cm__ab_production__ab_production_name: "$cm__ab_production_name$" # NO-TRANSLATE
 cm__ab_production_algorithm_name: "Baustrategie"
 cm__ab_production_algorithm_desc: "Wie die Produktion auswählt, was gebaut werden soll."
 cm__ab_production_algorithm_option_1_name: "Gierig"
 cm__ab_production_algorithm_option_1_desc: "Baue zuerst die Optionen mit der schnellsten Amortisation und nur jene, die nahe dem besten gefundenen Ort für die Produktion derselben Güter liegen."
 cm__ab_production_max_rel_roi_name: "Max. relativer ROI"
 cm__ab_production_max_rel_roi_desc: "Bestimmt, um wie viel langsamer sich ein Gebäude oder eine Aufwertung im Vergleich zum besten gefundenen Standort für dieselben Güter amortisieren darf, um dennoch gebaut zu werden. Bei 30 % gilt: Wenn sich der beste Standort in 10 Jahren amortisiert, werden nur jene gebaut, die sich innerhalb von 13 Jahren amortisieren; alles Langsamere wartet. Bei 0 % wird jeden Monat nur der beste Produzent für jedes Gut gebaut. Ab 100 %+ gibt es keine Beschränkung mehr und es gelten nur noch die Maximalen Amortisationsjahre. Alle Gebäude, die dieselben Güter produzieren, werden unabhängig von ihrer Art gemeinsam bewertet. RGO-Erweiterungen werden immer in der Reihenfolge ihrer Amortisation gebaut."
 cm__ab_production_max_rel_roi_format: "[CMMV('cm__ab_production_max_rel_roi')]%[Select_CString(GreaterThanOrEqualTo_CFixedPoint(CMMV('cm__ab_production_max_rel_roi'), CMMMapValue('cmm_max', 'cm__ab_production_max_rel_roi')), '+', '')]" # NO-TRANSLATE
 cm__ab_production_min_roi_name: "Maximale Amortisationsjahre"
 cm__ab_production_min_roi_desc: "Es werden nur Bauvorhaben berücksichtigt, deren Steuereinnahmen die Baukosten innerhalb dieser Anzahl an Jahren amortisieren. Auf 0 setzen, um die Prüfung zu deaktivieren."
 cm__ab_production_min_roi_format: "[CMMV('cm__ab_production_min_roi')]y @efficiency!" # NO-TRANSLATE
 cm__ab_production_min_discount_name: "$cm_txt_min_discount$" # NO-TRANSLATE
 cm__ab_production_min_discount_desc: "$cm_txt_min_discount_desc$" # NO-TRANSLATE
 cm__ab_production_min_discount_format: "[CMMV('cm__ab_production_min_discount')]%" # NO-TRANSLATE
 cm__ab_production__debug_name: "$cm_txt_debug$" # NO-TRANSLATE
 cm__dbg_run_production_name: "Produktion ausführen"
 cm__dbg_run_production_desc: "$cm_txt_dbg_run_category_desc$" # NO-TRANSLATE
 cm__dbg_run_production_text: "$cm_txt_run_now$" # NO-TRANSLATE
 cm__ab_roads__ab_roads_name: "$cm__ab_roads_name$" # NO-TRANSLATE
 cm__ab_roads_proximity_name: "$cm_txt_proximity$" # NO-TRANSLATE
 cm__ab_roads_proximity_desc: "Verlegt die Straßenabschnitte, welche die Proximität für das Gold am meisten erhöhen, wobei jeder Ort weiter hinten auf der Route mitgezählt wird."
 cm__ab_roads_market_access_name: "Marktzugang"
 cm__ab_roads_market_access_desc: "Baue die Straßenabschnitte, die den Marktzugang im Verhältnis zum Gold am meisten erhöhen. Gibt nur in Monaten Geld aus, in denen durch Proximität nichts gebaut wurde und nicht für einen Abschnitt gespart wird, den sie sich noch nicht leisten kann."
 cm__ab_roads_capital_name: "Hauptstadtverbindung"
 cm__ab_roads_capital_desc: "Legen Sie Straßenabschnitte an, um Ihre Standorte mit Ihrer Hauptstadt zu verbinden, ausgehend von den bereits verbundenen. Es werden nur in Monaten Ausgaben getätigt, in denen sowohl Proximität als auch Marktzugang nichts gebaut haben und keiner von beiden für einen Abschnitt spart, den er sich noch nicht leisten kann."
 cm__ab_roads_min_discount_name: "$cm_txt_min_discount$" # NO-TRANSLATE
 cm__ab_roads_min_discount_desc: "Maximal zulässiger Preisaufschlag für Baumaterialien. Bei -33 % wird ein Bauabschnitt nur begonnen, wenn das benötigte Bauholz, Mauerwerk und der Sand 33 % unter dem Basispreis kosten. Bei 0 % nur zum Basispreis oder darunter. Bei +33 % wird er selbst dann begonnen, wenn die Preise 33 % über dem Basiswert liegen."
 cm__ab_roads_min_discount_format: "[CMMV('cm__ab_roads_min_discount')]%" # NO-TRANSLATE
 cm__ab_roads_run_now_name: "Straßenneuplanung erzwingen"
 cm__ab_roads_run_now_desc: "Ermittelt sofort, welche Straßenabschnitte neu verlegt werden sollen, anstatt auf den nächsten Planungszyklus zu warten. Im Mehrspielermodus ist dies die einzige Funktion, die diese berechnet. Verlegt selbst keine Straßen; die gefundenen Abschnitte werden gebaut, sobald das Straßenbudget sie abdeckt."
 cm__ab_roads_run_now_text: "$cm_txt_run_now$" # NO-TRANSLATE
 cm__ab_roads__debug_name: "$cm_txt_debug$" # NO-TRANSLATE
 cm__dbg_run_roads_name: "Straßenbau ausführen"
 cm__dbg_run_roads_desc: "Gibt Straßenabschnitte aus dem aktuellen Plan sofort eigenständig in Auftrag, anstatt auf den Monatswechsel zu warten. Es verbraucht den verbleibenden Anteil, sodass eine Kategorie, die ihr Monatsbudget bereits aufgebraucht hat, nichts baut. 'Automatisierung pausieren' hält diesen Vorgang nicht auf."
 cm__dbg_run_roads_text: "$cm_txt_run_now$" # NO-TRANSLATE
 cm__ab_governors__ab_governors_name: "$cm__ab_governors_name$" # NO-TRANSLATE
 cm__ab_gov_move_seats_name: "Versetzen von Statthaltern erlauben"
 cm__ab_gov_move_seats_desc: "Wenn alle Statthalter-Plätze belegt sind, wird ein Statthalter abberufen und stattdessen an einem besseren Standort eingesetzt. Der bessere Standort muss bereits eine Stadt sein oder eine um mehr als 10 % höhere Wertung erzielen als der bisherige. Ist dies deaktiviert, werden Statthalter nur auf freien Plätzen eingesetzt."
 cm__ab_gov_prepare_sites_name: "Vorbereitung neuer Standorte zulassen"
 cm__ab_gov_prepare_sites_desc: "Berücksichtigt Standorte, die noch keinen Statthalter aufnehmen können, und bereitet diese zuerst vor, indem dort eine Kleinstadt oder Stadt gegründet und eine Straße zu Eurer Hauptstadt gebaut wird. Wenn dies deaktiviert ist, werden nur Standorte berücksichtigt, die bereits eine Stadt mit einer Straßenverbindung zu Eurer Hauptstadt sind."
 cm__ab_governors__debug_name: "$cm_txt_debug$" # NO-TRANSLATE
 cm__dbg_run_governors_name: "Statthalterplan starten"
 cm__dbg_run_governors_desc: "Startet jetzt einen neuen Plan, anstatt im üblichen 25-Jahres-Rhythmus. Der Plan durchläuft dann wie gewohnt seine Phasen in den folgenden Monaten. Er erfordert weiterhin Frieden, eine Hauptstadt und dass kein anderer Suchvorgang bereits läuft."
 cm__dbg_run_governors_text: "Start"
 cm__urbanization_name: "Urbanisierung"
 cm__auto_urbanize_enabled_name: "$cm_txt_enabled$" # NO-TRANSLATE
 cm__auto_urbanize_enabled_desc: "Automatische Urbanisierung aktivieren oder deaktivieren."
 cm__auto_urbanize_min_discount_name: "$cm_txt_min_discount$" # NO-TRANSLATE
 cm__auto_urbanize_min_discount_desc: "Maximal zulässiger Preisaufschlag für Baumaterialien. Bei -33 % werden Städte und Orte nur gegründet, wenn die Materialkosten 33 % unter dem Basispreis liegen. Bei 0 % nur zum Basispreis oder darunter. Bei +33 % werden sie selbst dann gegründet, wenn die Preise 33 % über dem Basiswert liegen."
 cm__auto_urbanize_min_discount_format: "[CMMV('cm__auto_urbanize_min_discount')]%" # NO-TRANSLATE
 cm__auto_urbanize__debug_name: "$cm_txt_debug$" # NO-TRANSLATE
 cm__dbg_run_auto_urbanize_name: "Auto-Urbanisierung ausführen"
 cm__dbg_run_auto_urbanize_desc: "Führt die Rang-Upgrades nun sofort eigenständig aus, anstatt auf den Monatswechsel zu warten. In dem gestarteten Zyklus wird nichts anderes gebaut und „Automatisierung pausieren“ hält dies nicht auf."
 cm__dbg_run_auto_urbanize_text: "$cm_txt_run_now$" # NO-TRANSLATE
 cm__auto_town_rights__auto_town_rights_specialization_name: "Rechteverleiher für intelligente Spezialisierung"
 cm__auto_town_rights__auto_town_rights_specialization_desc: "Gewährt, nachdem der Custom Right Granter an der Reihe war."
 cm__auto_grant_specialization_name: "Spezialisierungs-Stadtrechte automatisch erteilen"
 cm__auto_grant_specialization_desc: "Gewährt ein Spezialisierungsrecht pro Standort, wobei dasjenige mit dem höchsten Goldwert gewählt wird, das zu den dort produzierten Gütern passt."
 cm__specialization_window_name: "Eignungsschwellenwert"
 cm__specialization_window_desc: "Wie gut ein Spezialisierungsrecht im Vergleich zum am besten geeigneten Recht zu einem Ort passen muss, um in die engere Auswahl zu kommen. Bei 50 % kommt jedes Recht in die Auswahl, das mindestens halb so gut geeignet ist, und dasjenige mit dem höchsten Goldwert wird gewährt. Bei 100 % wird nur das am besten geeignete Recht gewährt."
 cm__specialization_window_format: "[CMMV('cm__specialization_window')]%" # NO-TRANSLATE
 cm__specialization_expand_name: "Geförderte Industrien ausbauen"
 cm__specialization_expand_desc: "Wenn ein Spezialisierungsrecht gewährt wird, wird an diesem Standort auch der automatische Ausbau für die Industrien, die durch das Recht gefördert werden, sowie für die dort produzierten Rohstoffe aktiviert. Dies entspricht einem Rechtsklick auf die Schaltfläche zum Gewähren im Kartenmodus für empfohlene städtische Privilegien."
 cm__auto_town_rights__debug_name: "$cm_txt_debug$" # NO-TRANSLATE
 cm__dbg_run_town_rights_name: "Automatische Vergabe von Stadtrechten ausführen"
 cm__dbg_run_town_rights_desc: "Wird sofort gewährt, anstatt auf den Monatswechsel zu warten, wobei zuerst die aktivierte Liste und danach die Spezialisierungsrechte abgearbeitet werden. „Automatisierung pausieren“ hält dies nicht auf."
 cm__dbg_run_town_rights_text: "$cm_txt_run_now$" # NO-TRANSLATE
 cm__miscellaneous_name: "Sonstiges"
 cm__cleanup_name: "Gebäudebereinigung"
 cm__cleanup__cleanup_name: "$cm__cleanup_name$" # NO-TRANSLATE
 cm__cleanup_close_open_name: "Gebäude schließen und öffnen"
 cm__cleanup_close_open_desc: "Einmal im Jahr werden Produktionsgebäude geschlossen, die keinen Gewinn mehr erwirtschaften und nicht subventioniert werden. Geschlossene Gebäude werden wiedereröffnet, sobald dieser Gebäudetyp in diesem Markt wieder rentabel ist. @farming_village! [ShowBuildingTypeNameWithNoTooltip('farming_village')] und @market_village! [ShowBuildingTypeNameWithNoTooltip('market_village')] werden niemals geschlossen."
 cm__cleanup_destroy_name: "Gebäude abreißen"
 cm__cleanup_destroy_desc: "Einmal pro Jahr werden Produktionsgebäude zerstört, die keinen Gewinn mehr abwerfen, sofern der Standort innerhalb von zehn Stufen der unterstützten Gebäudestufen liegt, zusammen mit bereits geschlossenen Gebäuden, deren Standort seither keinen Platz mehr bietet. Ein @market_village! [ShowBuildingTypeNameWithNoTooltip('market_village')] wird stattdessen auf eine Stufe zurückgesetzt. @fruit_orchard! [ShowBuildingTypeNameWithNoTooltip('fruit_orchard')] wird zerstört und unabhängig vom Ertrag nie wieder aufgebaut, und @farming_village! [ShowBuildingTypeNameWithNoTooltip('farming_village')] wird niemals zerstört."
 cm__cleanup_min_profit_name: "Mindestgewinn pro Stufe"
 cm__cleanup_min_profit_desc: "Ein Gebäude, das weniger als diesen Betrag pro Stufe und Monat erwirtschaftet, gilt als unrentabel und wird geschlossen oder zerstört, sofern es nicht subventioniert wird."
 cm__cleanup_min_profit_format: "[Divide_CFixedPoint(CMMV('cm__cleanup_min_profit'), '(CFixedPoint)100')|2]@gold!" # NO-TRANSLATE
 cm__cleanup_max_changed_name: "Max. Änderungen pro Durchgang"
 cm__cleanup_max_changed_desc: "Der Anteil der Gebäude eines Gebäudetyps in einem Markt, der sich in einem jährlichen Durchgang ändern kann. Bei 50 % kann die Hälfte der offenen Gebäude geschlossen oder zerstört und die Hälfte der geschlossenen wiedereröffnet werden. Niemals weniger als eins, sodass das letzte Gebäude eines Typs immer noch geschlossen werden kann."
 cm__cleanup_max_changed_format: "[CMMV('cm__cleanup_max_changed')]%" # NO-TRANSLATE
 cm__cleanup_core_goods_name: "Baumaterialien priorisieren"
 cm__cleanup_core_goods_desc: "Halte Gebäude, die hauptsächlich @masonry![ShowGoodsNameWithNoTooltip('masonry')], @lumber![ShowGoodsNameWithNoTooltip('lumber')], @sand![ShowGoodsNameWithNoTooltip('sand')] oder @glass![ShowGoodsNameWithNoTooltip('glass')] verbrauchen, auf dem doppelten Mindestgewinn pro Stufe oder 0,1@gold! pro Stufe, je nachdem, was höher ist. Gebäude, die eines der vier produzieren, werden niemals geschlossen oder zerstört, solange dies aktiviert ist."
 cm__cleanup_auto_food_name: "Auto-Nahrungsstandorte leeren"
 cm__cleanup_auto_food_desc: "Wenn die automatische Nahrungsversorgung aktiv ist und Arbeitskräfte jeglicher Art bereits knapp sind, werden Produktionsgebäude, die keine Nahrung produzieren, zerstört. Ein @market_village! [ShowBuildingTypeNameWithNoTooltip('market_village')] wird auf eine Stufe zurückgebaut, anstatt zerstört zu werden."
 cm__cleanup_run_now_name: "Gebäudebereinigung ausführen"
 cm__cleanup_run_now_desc: "Führe die Bereinigung jetzt aus, anstatt auf den jährlichen Durchlauf zu warten."
 cm__cleanup_run_now_text: "$cm_txt_run_now$" # NO-TRANSLATE
 cm__placement_finder_method_option_3_name: "Bevölkerung"
 cm__placement_finder_method_option_3_desc: "Sortieren nach dem Zuwachs an Nähe, den ein dort platzierter Gouverneur oder eine Hauptstadt bewirken würde, wobei jeder Ort nach seiner Einwohnerzahl gewichtet wird. Ein geringer Zuwachs bei einer großen Bevölkerung ist weniger wert als ein großer Zuwachs bei einer kleinen."
 cm__log_production_name: "$cm__ab_production_name$" # NO-TRANSLATE
 cm__log_production_desc: "Zeilen für jedes Gebäude, das die Produktionskategorie in die Warteschlange stellt, und jeden Rohstoffausbau, den sie berücksichtigt, mit der Amortisation und dem Einkommen dahinter."
 cm__log_core_name: "$cm__ab_core_name$" # NO-TRANSLATE
 cm__log_core_desc: "Zeilen, die einen Standort durch einen Basisgüter-Zyklus verfolgen: das Marktdefizit und die angeforderten Stufen, gefolgt von dem, was diesem Standort zugewiesen, bewertet und gebaut wurde. Markieren Sie den Standort zuerst mit dem Konsolenbefehl effect location:<key> = { cm_ab_core_watch_on = yes }."
 cm__debug__rotation_name: "Marktrotation"
 cm__debug__rotation_desc: "Ein großes Land arbeitet seine Märkte schrittweise ab, und jede Automatisierung baut in der Gruppe, in der sie sich gerade befindet."
 cm__dbg_rotate_slice_name: "Märkte rotieren"
 cm__dbg_rotate_slice_desc: "Geht zur nächsten Gruppe von Märkten über. Ein Durchlauf, der über eine der „Jetzt ausführen“-Schaltflächen gestartet wurde, bleibt bei der gefundenen Gruppe; dies bewegt ihn also weiter, während das Spiel pausiert ist."
 cm__dbg_rotate_slice_text: "Rotieren"
 cm__probe_production_anchors_name: "Produktionsanker"
 cm__probe_production_anchors_desc: "Eine Zeile pro Ware mit der besten von der Produktion aufgezeichneten Amortisation und dem festgelegten Amortisationslimit, unter Nennung des jeweiligen Gebäudes und Standorts."
 cm__probe_production_anchors_text: "$cm_txt_run$" # NO-TRANSLATE
 cm__probe_production_rgo_name: "Produktion von Rohstoffen"
 cm__probe_production_rgo_desc: "Eine Zeile für jeden Grund, aus dem die Produktion die Rohstoffe eines Ortes übersprungen hat, oder eine einzelne Zeile, wenn keine übersprungen wurden. Liest die Hauptstadt aus, es sei denn, ein Ort wird mit dem Konsolenbefehl effect location:<key> = { cm_ab_core_watch_on = yes } markiert."
 cm__probe_production_rgo_text: "$cm_txt_run$" # NO-TRANSLATE
 cm__probe_core_name: "$cm__ab_core_name$" # NO-TRANSLATE
 cm__probe_core_desc: "Alle Werte, die Core Goods an einem Standort ausliest, jeweils neben der spieleigenen Anzeige, sowie die Menge, die der Markt dieses Standorts in einem Zyklus aufnehmen könnte. Liest die Hauptstadt aus, es sei denn, ein Standort wird mit dem Konsolenbefehl effect location:<key> = { cm_ab_core_watch_on = yes } markiert; die Hauptstadt ist niemals ein Kandidat für Core Goods, markiert also einen Standort, um die Werte für dort zu errichtende Gebäude zu sehen."
 cm__probe_core_text: "$cm_txt_run$" # NO-TRANSLATE
 cm__probe_setup_name: "$cm_txt_setup_data$" # NO-TRANSLATE
 cm__probe_setup_desc: "Welche Kartendaten der Spielstand enthält und mit welcher Version diese jeweils berechnet wurden, sowie ob dieser Rechner berechtigt ist, diese zu verarbeiten. Eine Version 0 bedeutet, dass noch keine Berechnung erfolgt ist und diese beim nächsten Laden durchgeführt wird."
 cm__probe_setup_text: "$cm_txt_run$" # NO-TRANSLATE
 cm__debug__setup_name: "$cm_txt_setup_data$" # NO-TRANSLATE
 cm__debug__setup_desc: "Die Kartendaten, die die Mod einmalig berechnet und dann für den Rest des Spiels ausliest."
 cm__dbg_rebuild_setup_name: "Setup-Daten neu erstellen"
 cm__dbg_rebuild_setup_desc: "Berechnet die Kartendaten erneut: die Rohstoffe hinter den R.G.O.-Bonusfiltern, die Industrieabdeckung hinter den Empfohlenen Stadtrechten, die Bewertungen hinter $mapmode_cm_location_food_potential_name$, die Flussüberquerungen, durch die die Standortfinder navigieren, und welche Gebäude in welche aufgewertet werden. Dies dauert einige Sekunden, während das Spiel weiterläuft."
 cm__dbg_rebuild_setup_text: "Wiederaufbauen"
