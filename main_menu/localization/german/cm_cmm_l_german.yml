 cm__expand_metric_desc: "Wählen Sie aus, was der automatische Ausbau verwendet, um zu entscheiden, ob eine Gebäude- oder RGO-Stufe hinzugefügt wird."
 cm__expand_metric_option_1_name: "@income! Steuereinnahmen"
 cm__expand_metric_option_1_desc: "Fügt eine neue Stufe nur hinzu, wenn deren monatliches Steuereinkommen mindestens dem von Euch festgelegten Mindest-Steuereinkommen entspricht."
 cm__expand_metric_option_2_name: "@wealth! Gewinn"
 cm__expand_metric_option_2_desc: "Füge eine neue Stufe nur hinzu, wenn ihr monatlicher Gesamtgewinn mindestens den eingestellten Mindestgewinn erreicht."
 cm__expand_metric_option_3_name: "@efficiency! Rendite (Steuer)"
 cm__expand_metric_option_3_desc: "Fügt eine neue Stufe nur hinzu, wenn deren Steuereinnahmen die Baukosten innerhalb der von Euch festgelegten maximalen ROI-Jahre amortisieren."
 cm__expand_metric_option_4_name: "@efficiency! ROI (Gewinn)"
 cm__expand_metric_option_4_desc: "Fügt eine neue Stufe nur dann hinzu, wenn deren Gewinn die Baukosten innerhalb der festgelegten maximalen ROI-Jahre amortisiert."
 cm__auto_town_rights_list_i32_name: "@market_charter! [ShowTownRightsName('market_charter')]"
 cm__auto_town_rights_list_i33_name: "@free_town_charter! [ShowTownRightsName('free_town_charter')]"
 cm__auto_town_rights_list_i34_name: "@fortress_town! [ShowTownRightsName('fortress_town')]"
 cm__auto_town_rights_list_i35_name: "@mining_charter! [ShowTownRightsName('mining_charter')]"
 cm__auto_town_rights_list_i36_name: "@studium_privileges! [ShowTownRightsName('studium_privileges')]"
 cm__auto_town_rights_list_i37_name: "@agrarian_community_town_right! [ShowTownRightsName('agrarian_community_town_right')]"
 cm__auto_town_rights_list_i38_name: "@enlightened_leadership_reform_town_right! [ShowTownRightsName('enlightened_leadership_reform_town_right')]"
 cm__expand_metric: "cm__expand_metric"
 cm__town_rights_free_grants_name: "Kosten für Stadtrechte entfernen"
 cm__town_rights_free_grants_desc: "Wenn aktiviert, kostet das Gewähren von Stadtrechten keine Regierungsgewalt und deren Entzug keine Stabilität."
 cm__town_rights_min_gov_power_name: "Minimale Regierungsmacht"
 cm__town_rights_min_gov_power_desc: "Die automatische Vergabe von Stadtrechten stoppt, wenn die nächste Vergabe Eure Regierungsmacht (Legitimität, republikanische Tradition, Ergebenheit oder Hordeneinheit, je nach Regierungsform) unter diesen Wert senken würde."
 cm__allowed_building_overbuild_levels_format: "[CMMV('cm__allowed_building_overbuild_levels')][Select_CString(GreaterThanOrEqualTo_CFixedPoint(CMMV('cm__allowed_building_overbuild_levels'), CMMMapValue('cmm_max', 'cm__allowed_building_overbuild_levels')), '+', '')]"
 cm__auto_build_capital_name: "Hauptstadtgebäude"
 cm__auto_build_capital_desc: "Errichtet automatisch nur in der Hauptstadt mögliche Gebäude (Königshof, Oberster Gerichtshof, Kriegsakademie usw.) an Eurem Hauptstadtstandort, sobald die Bedingungen dies zulassen. Diese werden vor der untenstehenden Liste gebaut."
 cm__urbanize_city_to_megalopolis_name: "Stadt zur Megalopolis"
 cm__urbanize_city_to_megalopolis_desc: "Wertet Eure Hauptstadt zu einer Megalopolis auf, sobald sie eine Marktzentrum-Stadt mit mindestens 400.000 Einwohnern ist."
 cm__megalopolis_ignore_capital_name: "Megalopolis: Hauptstadt-Anforderung ignorieren"
 cm__megalopolis_ignore_capital_desc: "Ermöglicht es Euch, eine Megalopolis in einer Stadt zu gründen, die nicht Eure Hauptstadt ist."
 cm__megalopolis_ignore_market_center_name: "Megalopolis: Marktzentrum-Voraussetzung ignorieren"
 cm__megalopolis_ignore_market_center_desc: "Ermöglicht es Euch, „Megalopolis gründen“ in einer Stadt zu bauen, die kein Marktzentrum ist."
 cm__deurbanize_name: "Deurbanisieren"
 cm__deurbanize_desc: "Jeden Monat werden eigene Standorte wieder zu ländlichen Siedlungen herabgestuft, wenn ihr RGO-Gut in der untenstehenden Liste „Nicht urbanisieren“ markiert ist. Eure Hauptstadt, eroberte Standorte und Standorte, die Proximität gewähren, wie etwa Gouverneurssitze, bleiben unberührt."
 cm__auto_urbanize_ignore_list_i20_name: "@wool! [ShowGoodsName('wool')] ([GetGlobalVariable('cm_goods_wool').GetGoods.GetDefaultMarketPrice]@gold!)"
 cm__full_automation_name: "Vollständige Automatisierung"
 cm__full_automation__full_automation_name: "Vollständige Automatisierung"
 cm__full_automation__full_automation_desc: "Automatischer Bau. Jeden Monat geben die unten aufgeführten Kategorien den Teil der Schatzkammer, der über der Goldreserve liegt, für die besten verfügbaren Bauvorhaben aus. Läuft parallel zu den anderen Automatisierungsfunktionen, ohne deren Einstellungen zu beeinflussen."
 cm__fa_enabled_name: "Vollständige Automatisierung aktivieren"
 cm__fa_enabled_desc: "Vollständige Automatisierung ein- oder ausschalten."
 cm__fa_reserve_name: "Goldreserve"
 cm__fa_reserve_desc: "Die vollständige Automatisierung wird den Staatsschatz niemals unter diesen Betrag senken. Unabhängig von der Goldreserve im Reiter „Einstellungen“."
 cm__fa_reserve_format: "[CMMV('cm__fa_reserve')]@gold!"
 cm__fa_save_unaffordable_name: "Sparen für unerschwingliche Gebäude"
 cm__fa_save_unaffordable_desc: "Eine Kategorie kauft das beste gefundene Gebäude, selbst wenn es mehr als ihren monatlichen Anteil kostet, und setzt danach so lange aus, bis spätere Monate die Differenz ausgeglichen haben. Im deaktivierten Zustand gibt jede Kategorie aus, was sie kann, und reicht den Rest weiter."
 cm__full_automation__fa_priority_list_name: "Prioritäten"
 cm__full_automation__fa_priority_list_desc: "Zum Umordnen ziehen. Kategorien werden jeden Monat von oben nach unten abgearbeitet. Wenn zwei Kategorien dasselbe Gebäude beanspruchen, baut es die höher platzierte."
 cm__fa_priority_list_item_column_name: "Kategorie"
 cm__fa_priority_list_i1_name: "Nahrung"
 cm__fa_priority_list_i1_desc: "Überwacht die Nahrungsmittelversorgung im Jahresverlauf in Märkten, deren Marktzentrum Ihr besitzt, und aktiviert dort, wo der Medianmonat ein Defizit aufwies, die automatische Nahrungsmittelproduktion in den Orten mit dem höchsten Nahrungsmittelpotenzial. Die ausgewählten Orte leuchten wie die vom Spieler aktivierten, aber der Schalter bleibt unter Eurer Kontrolle; sie werden niemals deaktiviert, es sei denn, der Ort ist keine ländliche Siedlung mehr in Eurem Besitz oder Ihr besitzt dessen Marktzentrum nicht mehr."
 cm__fa_priority_list_i2_name: "Industrie"
 cm__fa_priority_list_i2_desc: "Baut, erweitert und verbessert die Produktionsgebäude und RGOs, die ihre Kosten am schnellsten durch Steuereinnahmen amortisieren. Standorte mit automatischer Nahrungsmittelproduktion werden ignoriert, solange dort bereits ein Mangel an jeglicher Art von Arbeitern herrscht."
 cm__fa_priority_list_i3_name: "Preiskollapsar"
 cm__fa_priority_list_i3_desc: "Erweitert die Produktion von Baumaterialien, um deren Preise zu senken. Funktioniert in Märkten, deren Marktzentrum Ihr besitzt. Die produktivsten Standorte werden zuerst ausgebaut und erhalten jeweils mehrere Stufen auf einmal; die Produktion beginnt sogar dort, wo noch keine Arbeiter eingetroffen sind. Eure Hauptstadt, Standorte mit Nahrungsmittelproduktion und Betriebe, die ohne Subventionen Verluste machen würden, werden übersprungen."
 cm__fa_priority_list_i4_name: "Straßen"
 cm__fa_priority_list_i4_desc: "Baut das Straßennetz mit dem besten Kosten-Nutzen-Verhältnis basierend auf drei Faktoren: Nähe, Marktzugang und die Verbindung eines Standorts mit Eurer Hauptstadt. Einmal im Jahr wird die beste Route zu jedem Eurer Standorte für jeden dieser Faktoren ermittelt; jeden Monat werden dann die Abschnitte begonnen, welche die Steuerbasis am stärksten erhöhen würden, wobei alle dahinter liegenden Teile der Route mitgezählt werden. Günstige, flache Korridore werden zuerst angelegt, und die nachrangigen Faktoren erhalten nur in Monaten Gold, in denen für die jeweils übergeordneten keine Bauvorhaben mehr verbleiben."
 cm__fa_priority_list_i5_name: "Versorgung"
 cm__fa_priority_list_i5_desc: "Baut unterstützende Infrastruktur überall dort, wo sie passt: Hauptstadtsgebäude, die Autobau-Liste, Quecksilberhöfe, Marktzentrumgebäude, Vögte und alle einzigartigen Gebäude Ihres Landes, die die Kontrolle erhöhen, Marktplätze, krankheitsresistente Gebäude und zuletzt Kornspeicher. Kontrollgebäude werden zuerst in den wohlhabendsten Standorten errichtet und Marktplätze zuerst in den Standorten mit dem geringsten Marktzugang."
 cm__fa_priority_list_i6_name: "Gebäudebereinigung"
 cm__fa_priority_list_i6_desc: "Einmal jährlich schließt dies Produktionsgebäude, die keinen Gewinn mehr erzielen und nicht subventioniert werden, und zerstört sie stattdessen, wenn der Standort innerhalb von zehn Stufen der unterstützten Gebäudestufen liegt. Geschlossene Gebäude werden wiedereröffnet, sobald dieser Typ in diesem Markt wieder rentabel ist, und später zerstört, falls der Platz am Standort ausgeht. @farming_village! [ShowBuildingTypeNameWithNoTooltip('farming_village')] wird niemals geschlossen oder zerstört."
 cm__fa_priority_list_i7_name: "Gouverneure"
 cm__fa_priority_list_i7_desc: "Plant, wo Eure Statthalter residieren sollten, und setzt sie dorthin, wobei der beste Standort zuerst gewählt wird. Die Planung erfolgt erneut, wann immer ein Statthalterplatz frei wird, ansonsten alle 25 Jahre. Nur für Einzelspieler."
 cm__fa_priority_list_i8_name: "Stadtrechte"
 cm__fa_priority_list_i8_desc: "Verleiht euren Siedlungen und Städten Stadtrechte. [ShowTownRightsNameWithNoTooltip('granary_town')] erfolgt zuerst, gefolgt von einem Spezialisierungsrecht, das zufällig aus jenen ausgewählt wird, die zu den am Standort produzierten Gütern passen."
 cm__fa_priority_list__budget_name: "Budgetanteil"
 cm__fa_priority_list__budget_desc: "Der Anteil der Schatzkammer oberhalb der Goldreserve, den diese Kategorie jeden Monat ausgeben darf."
 cm__fa_priority_list__budget_postfix: "%"
 cm__fa_priority_list__enabled_name: "Aktiviert"
 cm__fa_priority_list__enabled_desc: "Diese Kategorie bauen lassen."
 cm__full_automation__fa_industry_name: "Industrie"
 cm__full_automation__fa_industry_desc: "Einstellungen für die Industriekategorie oben."
 cm__fa_industry_algorithm_name: "Baustrategie"
 cm__fa_industry_algorithm_desc: "Wie die Industrie auswählt, was gebaut wird."
 cm__fa_industry_algorithm_option_1_name: "Gierig"
 cm__fa_industry_algorithm_option_1_desc: "Baut zuerst die Optionen mit der schnellsten Amortisation und nur jene, die nahe dem besten gefundenen Ort zur Herstellung derselben Güter liegen."
 cm__fa_industry_max_rel_roi_name: "Maximaler relativer ROI"
 cm__fa_industry_max_rel_roi_desc: "Gibt an, wie viel langsamer als am bestmöglichen Standort für dieselben Güter ein Gebäude oder eine Modernisierung seine Kosten amortisieren darf, um dennoch gebaut zu werden. Bei 30 % werden, wenn der beste Wert bei 10 Jahren liegt, nur jene gebaut, die sich innerhalb von 13 Jahren amortisieren; alles Langsamere wartet. Bei 0 % wird jeden Monat nur der beste Produzent jedes Gutes gebaut. Ab 100 % gibt es kein Limit und es gelten nur die „Max. Amortisationsjahre“. Alle Gebäude, die dieselben Güter produzieren, werden gemeinsam bewertet, ungeachtet ihrer Art. RGO-Erweiterungen werden immer in der Reihenfolge ihrer Amortisation gebaut."
 cm__fa_industry_max_rel_roi_format: "[CMMV('cm__fa_industry_max_rel_roi')]%[Select_CString(GreaterThanOrEqualTo_CFixedPoint(CMMV('cm__fa_industry_max_rel_roi'), CMMMapValue('cmm_max', 'cm__fa_industry_max_rel_roi')), '+', '')]"
 cm__fa_industry_min_roi_name: "Maximale Amortisationsjahre"
 cm__fa_industry_min_roi_desc: "Es werden nur Bauvorhaben berücksichtigt, deren Steuereinnahmen die Baukosten innerhalb dieser Anzahl an Jahren amortisieren. Auf 0 setzen, um die Prüfung zu deaktivieren."
 cm__fa_industry_min_roi_format: "[CMMV('cm__fa_industry_min_roi')] und @efficiency!"
 cm__full_automation__fa_collapsar_name: "Preiskollaps"
 cm__full_automation__fa_collapsar_desc: "Einstellungen für die Kategorie „Preis-Collapsar“ oben. Materialien werden von oben nach unten in der Liste abgearbeitet, wobei RGOs vor Produktionsgebäuden ausgebaut werden."
 cm__fa_collapsar_target_name: "Zielpreis"
 cm__fa_collapsar_target_desc: "Der Preis, bei dem der Bau für ein Material stoppt, relativ zu seinem Basispreis. Bei -33 % werden Produktionsstätten gebaut, bis das Material 33 % unter dem Basispreis gehandelt wird. Bei 0 %, bis es den Basispreis erreicht. Bei +33 % nur dann, wenn es mehr als 33 % über dem Basispreis kostet."
 cm__fa_collapsar_target_format: "[CMMV('cm__fa_collapsar_target')]%"
 cm__fa_collapsar_item_column_name: "Material"
 cm__fa_collapsar_i1_name: "@masonry! [ShowGoodsName('masonry')]"
 cm__fa_collapsar_i2_name: "@lumber! [ShowGoodsName('lumber')]"
 cm__fa_collapsar_i3_name: "@sand! [ShowGoodsName('sand')]"
 cm__fa_collapsar_i4_name: "@glass! [ShowGoodsName('glass')]"
 cm__fa_collapsar__enabled_name: "Aktiviert"
 cm__fa_collapsar__enabled_desc: "Arbeitet daran, den Preis dieses Materials zu senken."
 cm__full_automation__fa_food_name: "Nahrung"
 cm__full_automation__fa_food_desc: "Einstellungen für die Nahrungskategorie oben."
 cm__fa_food_target_name: "Überschussziel"
 cm__fa_food_target_desc: "Ein Markt erhält so lange zusätzliche Lebensmittel-Standorte, bis sein Angebot diesen Anteil seiner Nachfrage erreicht. Bei 125 % wird die Nahrungsmittelproduktion in jedem Markt ausgebaut, dessen Median-Monat des Jahres keinen Überschuss von 25 % erreicht hat. Erhöhen Sie den Wert, um einen größeren Puffer zu bewahren, oder senken Sie ihn, um nur jenen Märkten zu helfen, die kurz vor einem Mangel stehen."
 cm__fa_food_target_format: "[CMMV('cm__fa_food_target')]%"
 cm__fa_food_min_potential_name: "Minimales Nahrungspotenzial"
 cm__fa_food_min_potential_desc: "Auto-Nahrung wird nur an Standorten aktiviert, deren Nahrungspotenzial pro RGO-Stufe diesen Wert erreicht, denselben Wert, den der $mapmode_cm_location_food_potential_name$-Kartenmodus anzeigt. Erhöhen Sie ihn, um auf besseres Ackerland zu warten, und senken Sie ihn, um schwächeres Land zu akzeptieren."
 cm__fa_food_min_potential_format: "[CMMV('cm__fa_food_min_potential')]"
 cm__full_automation__fa_urban_rights_name: "Stadtrechte"
 cm__full_automation__fa_urban_rights_desc: "Einstellungen für die Kategorie „Städtische Rechte“ oben."
 cm__fa_urban_rights_window_name: "Eignungsschwellenwert"
 cm__fa_urban_rights_window_desc: "Wie gut ein Spezialisierungsrecht im Vergleich zum am besten geeigneten Recht für einen Standort passen muss, um in die Auswahl zu kommen. Bei 50 % kann jedes Recht, das mindestens halb so gut passt, ausgewählt werden, wobei besser geeignete häufiger gezogen werden. Bei 100 % wird nur das am besten geeignete Recht gewährt."
 cm__fa_urban_rights_window_format: "[CMMV('cm__fa_urban_rights_window')]%"
 cm__fa_urban_rights_reserve_name: "Staatsmachtreserve"
 cm__fa_urban_rights_reserve_desc: "Es wird kein Stadtrecht gewährt, wenn die Bezahlung dafür Eure Regierungsmacht (Legitimität, republikanische Tradition, Hingabe oder Hordeneinheit, je nach Regierungsform) unter diesen Wert sinken lassen würde."
 cm__fa_urban_rights_expand_name: "Die geförderten Industrien erweitern"
 cm__fa_urban_rights_expand_desc: "Wenn ein Spezialisierungsrecht gewährt wird, wird an diesem Ort auch der automatische Ausbau für jene Industrien aktiviert, die durch das Recht begünstigt werden, sowie für die dort produzierten Rohstoffe. Dies entspricht einem Rechtsklick auf eine Schaltfläche zum Gewähren im Kartenmodus für empfohlene städtische Rechte."
 cm__full_automation__fa_cleanup_name: "Gebäudebereinigung"
 cm__full_automation__fa_cleanup_desc: "Einstellungen für die Kategorie Gebäudebereinigung oben."
 cm__fa_cleanup_min_profit_name: "Mindestgewinn"
 cm__fa_cleanup_min_profit_desc: "Ein Gebäude, das monatlich weniger als diesen Betrag erwirtschaftet, gilt als unrentabel und wird geschlossen oder abgerissen, sofern es nicht subventioniert wird. In einem Markt wird höchstens die Hälfte der offenen Gebäude eines Gebäudetyps gleichzeitig geschlossen."
 cm__fa_cleanup_min_profit_format: "[Divide_CFixedPoint(CMMV('cm__fa_cleanup_min_profit'), '(CFixedPoint)100')|2]@gold!"
 cm__fa_cleanup_core_goods_name: "Baumaterialien priorisieren"
 cm__fa_cleanup_core_goods_desc: "Halte Gebäude, die hauptsächlich @masonry![ShowGoodsNameWithNoTooltip('masonry')], @lumber![ShowGoodsNameWithNoTooltip('lumber')], @sand![ShowGoodsNameWithNoTooltip('sand')] oder @glass![ShowGoodsNameWithNoTooltip('glass')] verbrauchen, auf dem Doppelten des Mindestgewinns oder 0,1@gold!, je nachdem, was höher ist. Gebäude, die eines der vier produzieren, werden nach dem normalen Mindestgewinn beurteilt."
 cm__fa_cleanup_auto_food_name: "Auto-Nahrungsstandorte leeren"
 cm__fa_cleanup_auto_food_desc: "Wo die Lebensmittel-Automatik aktiv ist und Arbeitskräfte bereits knapp sind, werden Produktionsgebäude, die keine Lebensmittel produzieren, zerstört. Ein @market_village! [ShowBuildingTypeNameWithNoTooltip('market_village')] wird auf eine Stufe reduziert, anstatt zerstört zu werden."
 cm__full_automation__fa_roads_name: "Straßen"
 cm__full_automation__fa_roads_desc: "Einstellungen für die obige Kategorie „Straßen“."
 cm__fa_roads_proximity_name: "Nähe"
 cm__fa_roads_proximity_desc: "Verlegt die Straßenabschnitte, welche die Proximity für das Gold am meisten erhöhen, wobei jeder weitere Ort auf der Route dahinter mitgezählt wird."
 cm__fa_roads_market_access_name: "Marktzugang"
 cm__fa_roads_market_access_desc: "Verlegt jene Straßenabschnitte, die den Marktzugang für das eingesetzte Gold am stärksten erhöhen. Es werden nur in Monaten Ausgaben getätigt, in denen keine Proximity-Abschnitte mehr zum Verlegen vorhanden sind."
 cm__fa_roads_capital_name: "Hauptstadtverbindung"
 cm__fa_roads_capital_desc: "Verlegt Straßenabschnitte, um eure Standorte mit der Hauptstadt zu verbinden, ausgehend von den bereits verbundenen. Es wird nur in Monaten investiert, in denen keine Abschnitte für Nähe und Marktzugang mehr zu verlegen sind."
 cm__full_automation__fa_governors_name: "Gouverneure"
 cm__full_automation__fa_governors_desc: "Einstellungen für die Statthalter-Kategorie oben."
 cm__fa_gov_move_seats_name: "Versetzen von Statthaltern erlauben"
 cm__fa_gov_move_seats_desc: "Wenn alle Statthalter-Plätze belegt sind, wird ein Statthalter abberufen und stattdessen an einem besseren Ort eingesetzt. Der bessere Ort muss bereits eine Stadt sein oder eine um mehr als 10 % höhere Bewertung aufweisen als derjenige, den er ersetzt. Wenn dies deaktiviert ist, werden Statthalter nur auf leere Plätze verteilt."
 cm__fa_gov_prepare_sites_name: "Vorbereitung neuer Standorte erlauben"
 cm__fa_gov_prepare_sites_desc: "Berücksichtigt Orte, die noch keinen Statthalter aufnehmen können, und bereitet sie zuerst vor, indem dort ein Marktflecken oder eine Stadt gegründet und eine Straße zu Eurer Hauptstadt gebaut wird. Wenn dies deaktiviert ist, werden nur Orte berücksichtigt, die bereits eine Stadt mit einer Straße zu Eurer Hauptstadt sind."
 cm__map_modes_name: "Kartenmodi"
 cm__map_modes__placement_finder_name: "Empfohlene Hauptstadt & Gouverneurssitz"
 cm__map_modes__placement_finder_desc: "Einstellungen für die Kartenmodi „Empfohlener Statthalter“ und „Empfohlene Hauptstadtplatzierung“."
 cm__placement_finder_method_name: "Platzierungsfinder-Bewertung"
 cm__placement_finder_method_desc: "Wie die Kartenmodi „Empfohlener Gouverneur“ und „Empfohlene Hauptstadt“ Eure Standorte bewerten."
 cm__placement_finder_method_option_1_name: "Steuerbasis"
 cm__placement_finder_method_option_1_desc: "Sortierung danach, wie stark ein dort eingesetzter Gouverneur oder eine dort platzierte Hauptstadt die gesamte Steuerbasis erhöhen würde. Wohlhabendere Standorte werden stärker gewichtet."
 cm__placement_finder_method_option_2_name: "Nähe"
 cm__placement_finder_method_option_2_desc: "Sortieren nach der Proximität, die ein dort platzierter Gouverneur oder eine Hauptstadt hinzufügen würde."
 cm__placement_finder_roads_name: "Landinfrastruktur"
 cm__placement_finder_roads_desc: "Legt fest, ob die Kartenmodi für empfohlene Statthalter und Hauptstädte eine ideale Landinfrastruktur voraussetzen oder die tatsächlich vorhandene nutzen."
 cm__placement_finder_roads_option_1_name: "Aktuell"
 cm__placement_finder_roads_option_1_desc: "Nutze die Straßen, die du tatsächlich gebaut hast."
 cm__placement_finder_roads_option_2_name: "Max. Straßen"
 cm__placement_finder_roads_option_2_desc: "Geht davon aus, dass auf jeder Verbindung die beste freigeschaltete Straße gebaut ist."
 cm__placement_finder_roads_option_3_name: "Bestmöglich"
 cm__placement_finder_roads_option_3_desc: "Angenommen, die beste freigeschaltete Straße ist auf jeder Verbindung gebaut und jedes freigeschaltete Gebäude, das die Landnähe verbessert, ist an allen geeigneten Standorten errichtet."
 cm__placement_finder_naval_name: "Marineinfrastruktur"
 cm__placement_finder_naval_desc: "Ob die Kartenmodi „Empfohlener Statthalter“ und „Empfohlene Hauptstadt“ von einer idealen maritimen Infrastruktur ausgehen oder eure aktuelle Hafenkapazität und maritime Präsenz berücksichtigen."
 cm__placement_finder_naval_option_1_name: "Aktuell"
 cm__placement_finder_naval_option_1_desc: "Nutzt eure aktuelle Hafenkapazität und Flottenpräsenz."
 cm__placement_finder_naval_option_2_name: "Maximale Präsenz"
 cm__placement_finder_naval_option_2_desc: "Geht überall von vollständiger Marinepräsenz aus, basierend auf Eurer aktuellen Hafenkapazität."
 cm__placement_finder_naval_option_3_name: "Bestmöglich"
 cm__placement_finder_naval_option_3_desc: "Geht von voller maritimer Präsenz und den besten freigeschalteten Hafengebäuden aus, die in jedem Küstenort errichtet wurden."
 cm__placement_finder_accuracy_name: "Suchgenauigkeit"
 cm__placement_finder_accuracy_desc: "Wie gründlich die Kartenmodi „Empfohlener Gouverneur“ und „Empfohlene Hauptstadt“ nach den besten Standorten suchen. Übersprungene Standorte werden schwarz angezeigt."
 cm__placement_finder_accuracy_option_1_name: "Erschöpfend"
 cm__placement_finder_accuracy_option_1_desc: "Wertet jeden Standort aus. Am genauesten und am langsamsten."
 cm__placement_finder_accuracy_option_2_name: "Gründlich"
 cm__placement_finder_accuracy_option_2_desc: "Überspringt Standorte, die nicht unter die Top Drei kommen können. Die Top Drei und deren Punktzahlen sind identisch mit der Methode „Vollständig“, nur schneller."
 cm__placement_finder_accuracy_option_3_name: "Ausgeglichen"
 cm__placement_finder_accuracy_option_3_desc: "Überspringe Standorte, die nicht der alleinige Spitzenreiter sein können. Der beste Standort ist weiterhin garantiert exakt; die Markierungen für den 2. und 3. Platz können gelegentlich abweichen."
 cm__placement_finder_accuracy_option_4_name: "Schnell"
 cm__placement_finder_accuracy_option_4_desc: "Zudem werden Standorte übersprungen, die sehr unwahrscheinlich die besten sind. Der gefundene beste Standort liegt innerhalb von 20 % des tatsächlichen Bestwerts und ist meistens dennoch exakt."
 cm__placement_finder_accuracy_option_5_name: "Am schnellsten"
 cm__placement_finder_accuracy_option_5_desc: "Bewertet den vielversprechendsten Standort jeder Provinz und verfeinert diesen dann anhand der Spitzenreiter. Deutlich schneller für große Länder; kann den besten Standort übersehen."
 cm__debug_name: "Debug"
 cm__debug__logging_name: "Aktionsprotokoll"
 cm__debug__logging_desc: "Welche Aktionen dieser Mod in das Mod-Aktionsprotokoll geschrieben werden."
 cm__log_cycle_name: "Bauzyklus"
 cm__log_cycle_desc: "Zeilen für einen monatlichen Zyklus, der übersprungen wurde, da der vorherige noch nicht abgeschlossen war, und für die Zurücksetzung nach zwei aufeinanderfolgenden Auslassungen."
 cm__log_industry_name: "Industrie"
 cm__log_industry_desc: "Zeilen für jedes Gebäude, das die Kategorie Industrie in die Warteschlange stellt, und jede berücksichtigte Rohstofferweiterung, mit der Amortisation und dem Einkommen dahinter."
 cm__log_collapsar_name: "Preiskollapsar"
 cm__log_collapsar_desc: "Zeilen, die einen Ort durch einen Price-Collapsar-Zyklus verfolgen: das Marktdefizit und die angeforderten Stufen, sowie was diesem Ort zugewiesen, bewertet und gebaut wurde. Markiert den Ort zuerst mit dem Konsolenbefehl effect location:<key> = { cm_fa_col_watch_on = yes }."
 cm__log_food_name: "Auto-Nahrung"
 cm__log_food_desc: "Zeilen für die Kategorie Nahrung: Das monatliche Nahrungsangebot, die Nachfrage und das Verhältnis jedes Marktes, der jährliche Median, anhand dessen dieses Verhältnis im Vergleich zum Zielwert beurteilt wird, die Anzahl der Standorte, die dort bereits Nahrung anbauen, sowie jeder Standort, der dadurch aktiviert oder deaktiviert wird."
 cm__log_roads_name: "Straßen"
 cm__log_roads_desc: "Eine Zeile für jede von der Kategorie „Straßen“ in Auftrag gegebene Straße, mit Angabe des Standorts, für welchen der drei Zwecke die Straße gekauft wurde und was sie gekostet hat."
 cm__log_cleanup_name: "Gebäudebereinigung"
 cm__log_cleanup_desc: "Zeilen für den jährlichen Gebäude-Bereinigungsdurchlauf sowie für jedes Gebäude, das geschlossen, reduziert, zerstört oder wiedereröffnet wird, mitsamt dem jeweiligen Gewinn und dem Schwellenwert, gegen den es geprüft wurde."
 cm__log_governors_name: "Gouverneure"
 cm__log_governors_desc: "Zeilen für den Gouverneursplan: Ausgewählte und verworfene Standorte, Upgrades für Märkte und Städte, Platzierungen, Verlegungen und Ablehnungen sowie der Hauptstadtumzug einer Glücklichen Nation."
 cm__log_military_name: "Militär der Glücklichen Nation"
 cm__log_military_desc: "Zeilen für eine glückliche Nation, die Festungen zerstört und Mannstärke-Gebäude errichtet."
 cm__log_government_name: "Glückliche-Nation-Regierung"
 cm__log_government_desc: "Zeilen für eine glückliche Nation beim Entfernen von Bürokratie oder beim Durchführen einer Standesaktion."
 cm__debug__diagnostics_name: "Diagnose"
 cm__placement_finder_debug_path_name: "Debug-Diagnose aktivieren"
 cm__placement_finder_debug_path_desc: "Fügt den Tooltips der Kartenmodi „Empfohlener Statthalter“ und „Empfohlene Hauptstadt“ einen Diagnoseblock hinzu: die berechnete Route von Eurer Hauptstadt zu jedem Standort mit den Kosten jedes Sprungs sowie die vorhergesagte Proximität im Vergleich zur tatsächlichen Proximität."
 cm__debug__probes_name: "Sonden"
 cm__debug__probes_desc: "Einmalige Diagnosen, die in das Mod-Aktionsprotokoll geschrieben werden."
 cm__probe_budget_name: "Vollständiges Automatisierungsbudget"
 cm__probe_budget_desc: "Der Saldo jeder Kategorie der vollständigen Automatisierung, positiv bei Rücklagen für ein noch nicht erschwingliches Bauvorhaben und negativ bei Schulden durch Mehrausgaben, mitsamt dem Industrie-Rückzahlungslimit und dem besten Kandidaten, der in einem in diesem Zyklus übergangenen Markt wartet."
 cm__probe_budget_text: "Ausführen"
 cm__probe_governors_name: "Gouverneursplan"
 cm__probe_governors_desc: "Der aktuelle Stand des Gouverneursplans: seine Phase, wie viele Standorte er hält und noch zu platzieren hat, ob er den Staatsschatz beansprucht, die bezahlten Gouverneure sowie die Plätze und Sitze, gegen die er arbeitet."
 cm__probe_governors_text: "Ausführen"
 cm__probe_military_name: "Militär der glücklichen Nation"
 cm__probe_military_desc: "Die Rekrutenreserve-Gebäudestufe, auf der sich das Land befindet, ob es diese bauen kann, der Zustand des Hauptstadt-Paares, das Militärbudget und wie viele Standorte diese Stufe erhalten können im Vergleich dazu, wie viele sie bereits besitzen."
 cm__probe_military_text: "Ausführen"
 cm__probe_industry_anchors_name: "Industrieanker"
 cm__probe_industry_anchors_desc: "Eine Zeile pro Ware mit der besten für sie verzeichneten Amortisation und dem entsprechenden Amortisationslimit, unter Angabe des jeweiligen Gebäudes und Standorts."
 cm__probe_industry_anchors_text: "Ausführen"
 cm__probe_industry_rgo_name: "Industrierohstoffe"
 cm__probe_industry_rgo_desc: "Eine Zeile für jeden Grund, warum die Industrie die Rohstoffe eines Standorts übergangen hat, oder eine einzelne Zeile, wenn keine übergangen wurden. Liest die Hauptstadt aus, es sei denn, ein Standort wird mit dem Konsolenbefehl effect location:<key> = { cm_fa_col_watch_on = yes } markiert."
 cm__probe_industry_rgo_text: "Ausführen"
 cm__probe_collapsar_name: "Preis-Kollapsar"
 cm__probe_collapsar_desc: "Jede Zahl, die der Price Collapsar an einem Standort ausliest, jeweils neben der spieleigenen Anzeige, sowie das, was der Markt dieses Standorts in einem Zyklus absorbieren könnte. Liest die Hauptstadt aus, es sei denn, ein Standort wird mit dem Konsolenbefehl effect location:<key> = { cm_fa_col_watch_on = yes } markiert; die Hauptstadt ist niemals ein Kandidat für den Price Collapsar, markieren Sie also einen Standort, um einen auszulesen, in dem er bauen würde."
 cm__probe_collapsar_text: "Ausführen"
 cm__probe_roads_name: "Straßen"
 cm__probe_roads_desc: "Wie viele Korridore der Straßenplan jeweils für Proximität, Marktzugang und Hauptstadtverbindung bereithält, wie viele der Hauptstadtverbindungen bereits begonnen werden können, wie viele Straßen sich bereits im Bau befinden und wie viel im Pool der Kategorie verbleibt."
 cm__probe_roads_text: "Ausführen"
 cm__probe_log_gate_name: "Aktionslog-Schwelle"
 cm__probe_log_gate_desc: "Die Log-Kategorie „Price Collapsar“ wird doppelt aufgeführt, sowohl wie das Log-Gate sie liest als auch wie das Menü sie speichert, damit Kategorien erscheinen, die in der einen aktiv und in der anderen inaktiv sind."
 cm__probe_log_gate_text: "Ausführen"
