 cm__priority_list__min_profit_roi_name: "Maximale ROI-Jahre"
 cm__priority_list__min_profit_roi_desc: "Maximale Anzahl an Jahren, um die Baukosten zu amortisieren. Auf 0 setzen, um die Prüfung zu deaktivieren."
