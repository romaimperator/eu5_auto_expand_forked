 cm__auto_town_rights__auto_town_rights_desc: "Jeden Monat werden berechtigten Städten und Megalopolen aktivierte Stadtrechte in der unten konfigurierten Reihenfolge gewährt. Jede Gewährung kostet Regierungsgewalt."
