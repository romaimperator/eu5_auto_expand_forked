 cm__ab_master_name: "Kontrollzentrum"
 cm__ab_custom_name: "Benutzerdefiniert"
 cm__ab_core_name: "Kerngüter"
 cm__ab_food_name: "Nahrung"
 cm__ab_production_name: "Produktion"
 cm__ab_roads_name: "Straßen"
 cm__ab_governors_name: "Gouverneure"
 cm__ab_master__ab_master_name: "$cm__ab_master_name$" # NO-TRANSLATE
 cm__ab_master__ab_master_desc: "Automatisierter Bau. Jeden Monat geben die unten aufgeführten Kategorien den Staatsschatz oberhalb der Goldreserve für die besten verfügbaren Bauvorhaben aus. Läuft parallel zu den anderen Automatisierungsfunktionen, ohne deren Einstellungen zu verändern."
 cm__ab_enabled_name: "Automatischer Ausbau aktivieren"
 cm__ab_enabled_desc: "Schaltet den automatischen Ausbau ein oder aus."
 cm__ab_save_unaffordable_name: "Für unerschwingliche Gebäude sparen"
 cm__ab_save_unaffordable_desc: "Eine Kategorie kauft das beste gefundene Gebäude, selbst wenn es mehr kostet als ihr monatlicher Anteil, und setzt dann aus, bis spätere Monate die Differenz ausgeglichen haben. Wenn deaktiviert, kauft eine Kategorie nichts, was sie nicht sofort vollständig bezahlen kann."
 cm__ab_min_proximity_name: "Minimale Nähe"
 cm__ab_min_proximity_desc: "Standorte unterhalb dieser Proximität werden bei der Auswahl des Bauplatzes übersprungen. Kontrollgebäude und @settlement_building! [ShowBuildingTypeNameWithNoTooltip('settlement_building')] werden ungeachtet dessen gebaut, da sie Land mit geringer Proximität erst lohnenswert machen. Bei 0 wird nichts übersprungen."
 cm__ab_min_proximity_format: "[CMMV('cm__ab_min_proximity')]%" # NO-TRANSLATE
 cm__ab_master__ab_priority_list_name: "Auto-Ausbau-Kategorien"
 cm__ab_master__ab_priority_list_desc: "Zum Umordnen ziehen. Kategorien werden jeden Monat von oben nach unten abgearbeitet. Wenn zwei dasselbe Gebäude fordern, baut es die höhere, und wenn Gold übrig bleibt, nachdem jede Kategorie ihren Anteil erhalten hat, bekommt es die höher platzierte."
 cm__ab_priority_list_item_column_name: "Kategorie"
 cm__ab_priority_list_i1_name: "$cm__ab_custom_name$" # NO-TRANSLATE
 cm__ab_priority_list_i1_desc: "Errichtet überall dort unterstützende Infrastruktur, wo sie Platz findet. Zuerst werden Hauptstadtgebäude gebaut, gefolgt von Kontrollgebäuden, dann Marktzentrumsgebäuden und zuletzt den von Euch selbst ausgewählten Gebäuden. Vögte werden an Orten platziert, deren Rohstoffe die höchsten Preise erzielen, andere Kontrollgebäude an den wohlhabendsten Orten und Marktplätze an jenen Orten mit dem geringsten Marktzugang."
 cm__ab_priority_list_i2_name: "$cm__ab_core_name$" # NO-TRANSLATE
 cm__ab_priority_list_i2_desc: "Erweitert die Produktion von Baumaterialien, um deren Preise zu senken. Funktioniert in Märkten, deren Marktzentrum Ihr besitzt. Die produktivsten Standorte werden zuerst berücksichtigt und erhalten jeweils mehrere Stufen auf einmal; die Produktion beginnt sogar dort, wo die Arbeiter noch nicht eingetroffen sind. Eure Hauptstadt, nahrungsmittelproduzierende Standorte sowie Betriebe, die ohne Subventionen Verluste machen würden, werden übersprungen."
 cm__ab_priority_list_i3_name: "$cm__ab_food_name$" # NO-TRANSLATE
 cm__ab_priority_list_i3_desc: "Überwacht die Nahrungsmittelversorgung im Jahresverlauf in Märkten, deren Marktzentrum Ihr besitzt, und aktiviert an Standorten mit dem höchsten Nahrungspotenzial die Auto-Nahrung, falls der Medianmonat ein Defizit aufweist. Die ausgewählten Standorte leuchten wie vom Spieler aktivierte, doch der Schalter bleibt in Eurer Hand; sie werden niemals deaktiviert, es sei denn, der Standort ist keine ländliche Siedlung in Eurem Besitz mehr, Ihr besitzt das zugehörige Marktzentrum nicht mehr oder ein besserer Standort im selben Markt nimmt dessen Platz ein."
 cm__ab_priority_list_i4_name: "$cm__ab_production_name$" # NO-TRANSLATE
 cm__ab_priority_list_i4_desc: "Baut, erweitert und verbessert die Produktionsgebäude und RGOs, die ihre Kosten am schnellsten durch Steuereinnahmen amortisieren. Standorte mit automatischer Lebensmittelversorgung werden ignoriert, solange dort bereits ein Mangel an Arbeitskräften jeglicher Art herrscht."
 cm__ab_priority_list_i5_name: "$cm__ab_roads_name$" # NO-TRANSLATE
 cm__ab_priority_list_i5_desc: "Baut das kosteneffizienteste Straßennetz basierend auf den drei Vorteilen, die eine Straße bietet: Proximität, Marktzugang und die Anbindung eines Ortes an Eure Hauptstadt. Alle vier Jahre sowie bei jeder Verlegung der Hauptstadt wird die beste Route zu jedem Eurer Orte für jeden dieser Faktoren berechnet und die Abschnitte werden nach der Steuerbasis sortiert, die sie steigern würden, wobei alle nachfolgenden Orte auf der Route mitgezählt werden; im Mehrspielermodus geschieht dies nur, wenn Ihr „Straßenplanung erzwingen“ drückt. Jeden Monat wird diese Liste abgearbeitet und beim ersten Abschnitt gestoppt, der nicht begonnen werden kann, anstatt ihn zu überspringen. Günstige, flache Korridore werden zuerst angelegt, und ein nachrangiger erhält nur dann Gold in einem Monat, wenn der übergeordnete nichts gebaut hat und nicht für einen Abschnitt spart, den er sich noch nicht leisten kann."
 cm__ab_priority_list_i6_name: "$cm__ab_governors_name$" # NO-TRANSLATE
 cm__ab_priority_list_i6_desc: "Plant die Standorte Eurer Gouverneure und setzt sie dort ein, wobei der beste Standort zuerst gewählt wird. Die Planung wird erneut durchgeführt, sobald ein Gouverneursplatz frei wird, ansonsten alle fünfundzwanzig Jahre. Nur Einzelspieler."
 cm__ab_priority_list__budget_name: "Budgetanteil"
 cm__ab_priority_list__budget_desc: "Der Anteil des Staatsschatzes über der Goldreserve, der dieser Kategorie jeden Monat zugewiesen wird. Es handelt sich eher um eine Untergrenze als um ein Limit: Gold, das von keiner Kategorie ausgegeben wird, wird erneut vom Anfang der Liste an angeboten, sodass eine Kategorie weit über ihren Anteil hinaus bauen kann, wenn die nachfolgenden Kategorien in einem Monat nichts zu kaufen haben."
 cm__ab_priority_list__budget_postfix: "%" # NO-TRANSLATE
