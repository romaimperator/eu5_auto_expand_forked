l_german:
 # Mod
 cm_name: "Baumanager"
 cm_desc: "Eine umfangreiche Quality-of-Life-Mod, die neue Automatisierungen, Filter und Kartenmodi hinzufügt, um das Bauerlebnis in EU5 erheblich zu verbessern."

 # Settings (settings) Tab
 cm__settings_name: "Einstellungen"
 ## Global Control (settings) Group
 cm__pause_auto_expand_name: "Automatisierung pausieren"
 cm__pause_auto_expand_desc: "Pausiert alle Automatisierungsfunktionen: Gebäude automatisch ausbauen, RGOs automatisch ausbauen, alle Gebäude aufwerten, automatischer Bau, Hauptstadtgebäude automatisch bauen, Auto-Nahrung, automatische Urbanisierung, Stadtrechte automatisch gewähren und Vollständige Automatisierung."
 cm__minimum_gold_name: "Goldreserve"
 cm__minimum_gold_desc: "Die einzuhaltende Mindestgoldreserve. Gilt für jede Automatisierungsfunktion außer der Vollautomatisierung."
 cm__minimum_gold_format: "[CMMV('cm__minimum_gold')]@gold!"
 cm__allowed_building_overbuild_levels_name: "Überbauungslimit"
 cm__allowed_building_overbuild_levels_desc: "Legt fest, um wie viele Gebäudestufen ein Standort seine Obergrenze für unterstützte Gebäudestufen überschreiten darf, bevor der automatische Ausbau das Einreihen neuer Bauprojekte dort stoppt. Bei Null ist kein Überbauen erlaubt, ab 200+ gibt es keine Begrenzung."

 ## Priority List Group
 cm__settings__priority_list_name: "Bauautomatisierung"
 cm__settings__priority_list_desc: "Ziehen, um die Funktionspriorität neu zu ordnen. Jeden Monat werden aktivierte Funktionen von oben nach unten ausgeführt, außer Auto-Urbanisierung, die immer zuletzt ausgeführt wird, nach jeder anderen Funktion und nach der Vollautomatisierung."
 cm__priority_list_item_column_name: "Funktion"
 cm__priority_list_i1_name: "Gebäude automatisch ausbauen"
 cm__priority_list_i1_desc: "Erweitert automatisch mehrstufige Produktions- und Nicht-Produktionsgebäude, wenn diese profitabel sind, Bewohner verfügbar sind und das Gold über Eurer Goldreserve bleibt. Gilt dort, wo der automatische Ausbau für einen Ort oder einen gesamten Gebäudetyp aktiviert ist, einschließlich ausländischer Gebäude an Orten anderer Länder."
 cm__priority_list_i2_name: "RGOs automatisch ausbauen"
 cm__priority_list_i2_desc: "Erweitert automatisch die RGO-Stufen in Standorten, in denen der automatische RGO-Ausbau aktiviert ist, sofern Arbeiter verfügbar sind und die Ressourcen es zulassen."
 cm__priority_list_i3_name: "Automatischer Bau"
 cm__priority_list_i3_desc: "Baut automatisch Hauptgebäude und Gebäude, die nur einmal pro Standort existieren können (Räte, Bibliotheken usw.), in der Reihenfolge und mit den Einstellungen, die im Reiter „Automatischer Bau“ konfiguriert wurden."
 cm__priority_list_i4_name: "Auto-Nahrung"
 cm__priority_list_i4_desc: "Baut automatisch nahrungsproduzierende RGOs und Gebäude an ländlichen Standorten und wählt dabei die nahrungseffizienteste Option aus. Wird im Reiter „Auto-Nahrung“ konfiguriert."
 cm__priority_list_i5_name: "Auto-urbanisieren"
 cm__priority_list_i5_desc: "Wertet monatlich Standortränge auf: ländliche Siedlungen zu Kleinstädten, Kleinstädte zu Städten und Städte zu Megalopolen. Überspringt eroberte Standorte. Konfigurierbar im Reiter „Auto-Urbanisierung“."
 cm__priority_list_i6_name: "Alle Gebäude automatisch ausbauen"
 cm__priority_list_i6_desc: "Verbessert automatisch jedes Gebäude, das veraltet ist, unabhängig davon, ob der automatische Ausbau für dieses Gebäude aktiviert ist."
 cm__priority_list__enabled_name: "Aktiviert"
 cm__priority_list__enabled_desc: "Diese Funktion aktivieren oder deaktivieren."
 cm__priority_list__min_profit_name: "Min. Steuereinnahmen"
 cm__priority_list__min_profit_desc: "Erforderliches monatliches Minimum an Gold pro Stufe, bevor der Bau in die Warteschlange eingereiht wird. Auf 0 setzen, um die Prüfung zu deaktivieren."
 cm__priority_list__min_profit_postfix: "@gold!"
 cm__priority_list__min_discount_name: "Min. Rabatt"
 cm__priority_list__min_discount_desc: "Maximal zulässiger Preisaufschlag für Baumaterialien. Bei -33 % wird nur gebaut, wenn die Materialkosten 33 % unter dem Basispreis liegen. Bei 0 % nur zum Basispreis oder darunter. Bei +33 % wird selbst dann gebaut, wenn die Preise 33 % über dem Basispreis liegen."
 cm__priority_list__min_discount_postfix: "%"
 cm__priority_list__min_discount_prefix_high: "#R "
 cm__priority_list__min_discount_postfix_high: "%#!"
 cm__priority_list__min_discount_prefix_low: "#G "
 cm__priority_list__min_discount_postfix_low: "%#!"

