 cm__ab_core__ab_core_desc: "Einstellungen für Kerngüter. Materialien werden in der Liste von oben nach unten abgearbeitet, wobei RGOs vor Produktionsgebäuden ausgebaut werden."
 cm__ab_core_target_name: "Zielpreis"
 cm__ab_core_target_desc: "Der Preis, bei dem der Bau für ein Material stoppt, relativ zu seinem Basispreis. Bei -33 % werden Produktionsstätten gebaut, bis das Material 33 % unter dem Basispreis gehandelt wird. Bei 0 %, bis es den Basispreis erreicht. Bei +33 % nur, solange es mehr als 33 % über dem Basispreis kostet."
 cm__ab_core_target_format: "[CMMV('cm__ab_core_target')]%" # NO-TRANSLATE
