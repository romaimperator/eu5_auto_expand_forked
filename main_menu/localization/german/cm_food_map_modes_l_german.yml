l_german:
 mapmode_cm_breadbasket_name: "Kornkammern"
 MAPMODE_CM_BREADBASKET: "#T $mapmode_cm_breadbasket_name$#!\nHebt eure [locations|e] hervor, in denen Auto-Nahrung aktuell eingerichtet ist."
 MAPMODE_CM_BREADBASKET_TT_ENABLED: "[ROOT.GetLocation.GetName] ist für automatische Nahrungsproduktion eingerichtet."
 MAPMODE_CM_BREADBASKET_TT_OWNED: "[ROOT.GetLocation.GetName] gehört Euch, aber die automatische Nahrungsversorgung ist nicht aktiviert."
 MAPMODE_CM_BREADBASKET_TT_FOREIGN: "[ROOT.GetLocation.GetName] gehört Euch nicht."
 MAPMODE_CM_BREADBASKET_TT_UNCOLONIZED: "[ROOT.GetLocation.GetName] ist unkolonisiert."
 MAPMODE_CM_BREADBASKET_TT_WATER: "[ROOT.GetLocation.GetName] ist ein Seegebiet."

 cm_breadbasket_enabled_legend_key: "Auto-Nahrung aktiviert"
 cm_breadbasket_owned_legend_key: "Eure anderen Orte"
 cm_breadbasket_foreign_legend_key: "Ausländische Orte"
 cm_breadbasket_uncolonized_legend_key: "Unkolonisiert"

 mapmode_cm_location_food_potential_name: "Nahrungspotenzial pro RGO-Stufe"
 MAPMODE_CM_LOCATION_FOOD_POTENTIAL: "#T $mapmode_cm_location_food_potential_name$#!\nDies färbt [locations|e] nach ihrem natürlichen Nahrungspotenzial pro [rgo|e]-Stufe. Der Wert kombiniert den [rgo|e]-[food|e]-Wert, die kumulativen [food_productivity|e] (Gelände, Vegetation, Klima, benannte statische Modifikatoren wie der Heringsmarkt von Schonen oder das fruchtbare Nildelta, [rgo|e]-spezifische Ertragsmodifikatoren usw.), Wasserzugang und die angenommenen Maximalboni von [ShowBuildingTypeName('windmill')], [ShowBuildingTypeName('farming_village')] und [ShowBuildingTypeName('irrigation_systems')], sofern [rgo|e] dies erlaubt.\n\n[development|e] ist ausgeschlossen, sodass der Wert das Geländepotenzial anstelle des aktuellen Ertrags anzeigt."
 mapmode_cm_location_food_potential_hidden_name: "$mapmode_cm_location_food_potential_name$"
 MAPMODE_CM_LOCATION_FOOD_POTENTIAL_HIDDEN: "$MAPMODE_CM_LOCATION_FOOD_POTENTIAL$"
 MAPMODE_CM_LOCATION_FOOD_POTENTIAL_TT_LAND: "[ROOT.GetLocation.GetName] hat ein Nahrungspotenzial von [ROOT.GetLocation.MakeScope.ScriptValue('cm_location_food_potential')|1Y] pro Stufe [rgo|e]."
 MAPMODE_CM_LOCATION_FOOD_POTENTIAL_TT_WATER: "[ROOT.GetLocation.GetName] ist kein Land, daher hat es kein Nahrungspotenzial."

 cm_location_food_potential_auto_food_legend_key: "Auto-Nahrung aktiviert (gestreift)"
 cm_location_food_potential_bright_green_legend_key: "45 (maximal möglich)"
 cm_location_food_potential_green_legend_key: "27,5 (exzellent)"
 cm_location_food_potential_yellow_legend_key: "20 (gut)"
 cm_location_food_potential_orange_legend_key: "12,5 (annehmbar)"
 cm_location_food_potential_red_legend_key: "3.75 (niedrig)"
 cm_location_food_potential_black_legend_key: "0 (keine)"
