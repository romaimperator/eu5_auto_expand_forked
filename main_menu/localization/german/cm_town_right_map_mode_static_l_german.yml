 MAPMODE_CM_BEST_TOWN_RIGHT: "#T $mapmode_cm_best_town_right_name$#!\nFärbt jede [location|e] nach der Spezialisierung [town_rights|e], deren geförderte Gebäude den größten Anteil ihrer [goods|e] aus den [rgo|e]en von [province|e] beziehen können. Bewege die Maus über [location|e], um alle Spezialisierungsoptionen nach Rang geordnet zu sehen.\nBewege die Maus über den Prozentsatz einer Industrie im Tooltip für eine Aufschlüsselung der Eingaben ihrer besten Produktionsmethode.\nGleichstände beim Bestwert werden als gestreifte Zweitfarbe angezeigt: die Farbe der gleichgesetzten Spezialisierung oder eine eigene Farbe, wenn 3 oder mehr gleichauf liegen."
