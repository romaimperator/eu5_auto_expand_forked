l_german:
 mapmode_cm_location_proximity_modifier_name: "Auswirkung der Proximitätseffizienz"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER: "#T $mapmode_cm_location_proximity_modifier_name$#!\nFärbt [locations|e] nach ihrem $mapmode_cm_location_proximity_modifier_name$: der kombinierte Malus, den ihr [topography|e] und [vegetation|e] auf [proximity|e] ausüben (Gebirge, Hügel, Plateau, Feuchtgebiete, Wald, Dschungel usw.). Grün bedeutet, dass das Gelände die Proximität nicht behindert; Rot bedeutet, dass es sie stark behindert. Topographie-Mali werden durch die Proximitäts-Boni des Besitzers skaliert, wie etwa durch Hauptstadtgelände oder Fortschritte; unbesetzte Orte zeigen Basisgeländewerte. Ein [road|e] oder [river|e] an einem Ort hebt seinen [vegetation|e]-Malus auf; der [topography|e]-Malus gilt immer.\n\nWasser zeigt stattdessen die [maritime_presence|e], die das ausgewählte [country|e] dort hat, von Grün beim niedrigsten Wert über Hellgrün bis hin zu Hellblau beim Höchstwert. Eine hohe Präsenz verringert den [proximity|e]-Verlust beim Überqueren einer [seazone|e]."
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_LAND: "$mapmode_cm_location_proximity_modifier_name$: [ROOT.GetLocation.MakeScope.ScriptValue('cm_location_proximity_modifier')|+=%]"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_LAND_HARBOR: "$MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_LAND$\nEignung als natürlicher Hafen: [ROOT.GetLocation.GetModifierValueFixed('natural_harbor_suitability')|0%]"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER: "[ROOT.GetLocation.GetName] ist kein Land und hat daher kein $mapmode_cm_location_proximity_modifier_name$, und das ausgewählte [country|e] hat hier kein [maritime_presence|e]."

 cm_location_proximity_modifier_none_legend_key: "0 % (kein Abzug)"
 cm_location_proximity_modifier_light_legend_key: "-25% (leicht)"
 cm_location_proximity_modifier_noticeable_legend_key: "-35% (spürbar)"
 cm_location_proximity_modifier_moderate_legend_key: "-50% (moderat)"
 cm_location_proximity_modifier_heavy_legend_key: "-65% (schwer)"
 cm_location_proximity_modifier_severe_legend_key: "-75% (schwerwiegend)"
 cm_location_proximity_modifier_worst_legend_key: "-100% (am schlechtesten)"
 cm_location_proximity_modifier_harbor_legend_key: "Naturhafeneignung (gestreift)"
 cm_location_proximity_modifier_maritime_none_legend_key: "Keine maritime Präsenz (offenes Gewässer)"
 cm_location_proximity_modifier_maritime_low_legend_key: "Geringe maritime Präsenz"
 cm_location_proximity_modifier_maritime_half_legend_key: "50 % Maritime Präsenz"
 cm_location_proximity_modifier_maritime_full_legend_key: "100% Maritime Präsenz"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER_M0: "[maritime_presence|E]: 0-10%"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER_M10: "[maritime_presence|E]: 10-20%"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER_M20: "[maritime_presence|E]: 20-30%"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER_M30: "[maritime_presence|E]: 30-40%"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER_M40: "[maritime_presence|E]: 40-50%"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER_M50: "[maritime_presence|E]: 50-60%"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER_M60: "[maritime_presence|E]: 60-70%"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER_M70: "[maritime_presence|E]: 70-80%"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER_M80: "[maritime_presence|E]: 80-90%"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER_M90: "[maritime_presence|E]: 90-100%"
