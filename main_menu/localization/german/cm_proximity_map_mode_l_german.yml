l_german:
 mapmode_cm_location_proximity_modifier_name: "Auswirkung der Proximitätseffizienz"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER: "#T $mapmode_cm_location_proximity_modifier_name$#!\nFärbt [locations|e] nach ihrem Einfluss auf die Nähe-Effizienz: die kombinierte Strafe, die ihre [topography|e] und [vegetation|e] auf [proximity|e] (Gebirge, Hügel, Plateau, Feuchtgebiete, Wald, Dschungel usw.) ausüben. Grün bedeutet, dass das Gelände die Nähe nicht behindert; Rot bedeutet eine starke Behinderung. Topografie-Strafen werden durch die Nähe-Einfluss-Boni des Besitzers skaliert, etwa durch das Gelände der Hauptstadt oder Fortschritte; nicht im Besitz befindliche Standorte zeigen Basis-Geländewerte an. Ein [road|e] oder [river|e] an einem Standort hebt dessen [vegetation|e]-Strafe auf; die [topography|e]-Strafe gilt immer."
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_LAND: "Auswirkung der Proximitätseffizienz: [ROOT.GetLocation.MakeScope.ScriptValue('cm_location_proximity_modifier')|+=%]"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_LAND_HARBOR: "Einfluss der Näheneffizienz: [ROOT.GetLocation.MakeScope.ScriptValue('cm_location_proximity_modifier')|+=%]\nEignung als Naturhafen: [ROOT.GetLocation.GetModifierValueFixed('natural_harbor_suitability')|0%]"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER: "[ROOT.GetLocation.GetName] ist kein Land, daher hat es keine Auswirkung auf die Näheneffizienz."

 cm_location_proximity_modifier_none_legend_key: "0 % (kein Abzug)"
 cm_location_proximity_modifier_light_legend_key: "-25% (leicht)"
 cm_location_proximity_modifier_noticeable_legend_key: "-35% (spürbar)"
 cm_location_proximity_modifier_moderate_legend_key: "-50% (moderat)"
 cm_location_proximity_modifier_heavy_legend_key: "-65% (schwer)"
 cm_location_proximity_modifier_severe_legend_key: "-75% (schwerwiegend)"
 cm_location_proximity_modifier_worst_legend_key: "-100% (am schlechtesten)"
 cm_location_proximity_modifier_harbor_legend_key: "Naturhafeneignung (gestreift)"
