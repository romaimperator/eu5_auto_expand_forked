l_german:
 mapmode_cm_governor_finder_name: "Empfohlene Statthalterplatzierung"
 MAPMODE_CM_GOVERNOR_FINDER: "#T $mapmode_cm_governor_finder_name$#!\nFärbt Ihre [locations|e] danach ein, wie viel [proximity|e] ein dort neu errichteter Lokaler Gouverneur oder Marinegouverneur hinzufügen würde, basierend auf der Proximität, die Ihre [capital|e] und bestehende Quellen bereits bieten. Grüner ist besser. Ihre Hauptstadt und bestehende Proximitätsquellen sind gestreift.\n$cm_pf_estimate_note$"
 MAPMODE_CM_GOVERNOR_FINDER_TT_SCORED: "$cm_pf_gov_tt_head$\nPunktzahl: [ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_gf_pct_value')|0]% Ihres besten Standorts[ROOT.GetLocation.Custom('cm_pf_gf_status')]"
 MAPMODE_CM_GOVERNOR_FINDER_TT_BEST: "$cm_pf_gov_tt_head$\nIhr bester Standort"
 MAPMODE_CM_GOVERNOR_FINDER_TT_SCORED_DEBUG: "$MAPMODE_CM_GOVERNOR_FINDER_TT_SCORED$$CM_PF_DEBUG_BLOCK$"
 MAPMODE_CM_GOVERNOR_FINDER_TT_BEST_DEBUG: "$MAPMODE_CM_GOVERNOR_FINDER_TT_BEST$$CM_PF_DEBUG_BLOCK$"
 MAPMODE_CM_GOVERNOR_FINDER_TT_CAPITAL: "Euer [capital|e] verbreitet bereits [proximity|e] von hier aus."
 MAPMODE_CM_GOVERNOR_FINDER_TT_CAPITAL_DEBUG: "$MAPMODE_CM_GOVERNOR_FINDER_TT_CAPITAL$$CM_PF_DEBUG_BLOCK$"
 MAPMODE_CM_GOVERNOR_FINDER_TT_SOURCE: "$cm_pf_gov_source_line$\n$MAPMODE_CM_GOVERNOR_FINDER_TT_SCORED$"
 MAPMODE_CM_GOVERNOR_FINDER_TT_SOURCE_DEBUG: "$MAPMODE_CM_GOVERNOR_FINDER_TT_SOURCE$$CM_PF_DEBUG_BLOCK$"
 MAPMODE_CM_GOVERNOR_FINDER_TT_SOURCE_NOGAIN: "$cm_pf_gov_source_line$\n$MAPMODE_CM_GOVERNOR_FINDER_TT_NOGAIN$"
 MAPMODE_CM_GOVERNOR_FINDER_TT_SOURCE_NOGAIN_DEBUG: "$MAPMODE_CM_GOVERNOR_FINDER_TT_SOURCE_NOGAIN$$CM_PF_DEBUG_BLOCK$"
 MAPMODE_CM_GOVERNOR_FINDER_TT_NOGAIN: "Ein Statthalter bietet höchstens 80 [proximity|e] und dieser Standort [ROOT.GetLocation.Custom('cm_pf_nogain_basis')], daher würde ein hier gebauter Statthalter nichts hinzufügen."
