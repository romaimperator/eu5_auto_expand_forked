 # Action bar refresh button
 cm_pf_refresh: "cm_pf_refresh"
 cm_pf_refresh_color: "Dunkeltürkis"
 cm_pf_refresh_icon: "@cm_pf_refresh!"
 cm_pf_refresh_name: "Platzierungswerte neu berechnen"
 cm_pf_refresh_tooltip: "Erzwingt eine Neuberechnung der Platzierungswerte für Gouverneure und Hauptstädte für die aktuellen Grenzen. Andernfalls werden die Werte bis zu 4 Jahre lang wiederverwendet."
 cm_pf_estimate_note: "Dies ist eine Schätzung: Die Einstellung für die Bewertung der Standortermittlung legt fest, ob Standorte nach Steuerbasis, Bevölkerung oder rohem [proximity|e] eingestuft werden, und die Einstellungen für Landinfrastruktur und Marineinfrastruktur bestimmen die Straßen, Gebäude und [maritime_presence|e], von denen ausgegangen wird. Die Neuberechnung erfolgt beim Öffnen dieses Kartenmodus, höchstens jedoch einmal alle 4 Jahre; verwendet die Aktualisierungsschaltfläche in der Aktionsleiste, um eine neue Berechnung zu erzwingen. Die Farben werden nach Abschluss aktualisiert."
 cm_pf_tt_no_data: "Noch nicht bewertet. Nutzt die Aktualisieren-Schaltfläche in der Aktionsleiste, um die Punktzahlen für die aktuellen Grenzen zu berechnen."
 cm_pf_tt_skipped: "Nicht ausgewertet: Die Einstellung für die Suchgenauigkeit hat diesen Ort übersprungen. Stellen Sie sie auf 'Vollständig' ein und aktualisieren Sie, um jeden Ort auszuwerten."
 cm_pf_tt_foreign: "Nicht Teil Eures Landes."
 cm_pf_source_legend: "Vorhandene Proximitätsquelle (gestreift)"
 cm_pf_of_best: "der Besten"
 cm_pf_gov_tt_head: "Prognostizierter max. durchschnittlicher [proximity|e]-Zuwachs: +[ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_gf_avg_value')|1]%\nMax. prognostizierte Steuerbasis durch [proximity|e]: +[ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_gf_taxgain_value')|1]\nMax. prognostizierte erreichte Bevölkerung, gewichtet nach [proximity|e]-Zuwachs: +[ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_gf_popgain_value')|1]k"
 cm_pf_gov_source_line: "Bestehende [proximity|e]-Quelle: [ROOT.GetLocation.GetModifierValueFixed('local_proximity_source')|0]"
 cm_pf_cap_tt_head: "Prognostizierter max. Durchschnitt [proximity|e] mit Hauptstadt: [ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_cf_avg_value')|1]%\nMax. prognostizierte Steuerbasis von [proximity|e]: +[ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_cf_taxgain_value')|1]\nMax. prognostizierte erreichte Bevölkerung, gewichtet nach [proximity|e]: +[ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_cf_popgain_value')|1]k"
