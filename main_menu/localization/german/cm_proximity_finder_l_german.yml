 mapmode_cm_capital_finder_name: "Empfohlener Hauptstadtstandort"
 MAPMODE_CM_CAPITAL_FINDER: "#T $mapmode_cm_capital_finder_name$#!\nFärbt Ihre [locations|e] danach ein, wie gut ein [capital|e] dort [proximity|e] verbreiten würde. Bestehende Statthalter werden ignoriert. Gestreifte Orte besitzen bereits eine Proximitätsquelle, wie die aktuelle Hauptstadt oder einen Statthalter.\nDies ist eine Schätzung: Die Einstellung für die Bewertung der Platzierungssuche legt fest, ob Orte nach Steuerbasis oder roher [proximity|e] eingestuft werden, und die Einstellungen für Landinfrastruktur und Maritiminfrastruktur bestimmen die Straßen, Gebäude und [maritime_presence|e], die vorausgesetzt werden. Die Neuberechnung erfolgt beim Öffnen dieses Kartenmodus, höchstens einmal alle 4 Jahre; nutzen Sie die Schaltfläche zum Aktualisieren in der Aktionsleiste, um eine neue Berechnung zu erzwingen. Die Farben werden nach Abschluss aktualisiert."
 MAPMODE_CM_CAPITAL_FINDER_TT_SCORED: "Voraussichtlicher max. Durchschnitt [proximity|e] mit Hauptstadt: [ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_cf_avg_value')|1]%\nMax. voraussichtliche Steuerbasis durch [proximity|e]: +[ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_cf_taxgain_value')|1]\nWertung: [ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_cf_pct_value')|0]% Ihres besten Standorts[ROOT.GetLocation.Custom('cm_pf_cf_status')]"
 MAPMODE_CM_CAPITAL_FINDER_TT_BEST: "Prognostizierter max. Durchschnitt [proximity|e] mit Hauptstadt: [ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_cf_avg_value')|1]%\nMax. prognostizierte Steuerbasis aus [proximity|e]: +[ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_cf_taxgain_value')|1]\nEuer bester Standort"
 MAPMODE_CM_CAPITAL_FINDER_TT_SCORED_DEBUG: "$MAPMODE_CM_CAPITAL_FINDER_TT_SCORED$$CM_PF_DEBUG_BLOCK$"
 MAPMODE_CM_CAPITAL_FINDER_TT_BEST_DEBUG: "$MAPMODE_CM_CAPITAL_FINDER_TT_BEST$$CM_PF_DEBUG_BLOCK$"
 MAPMODE_CM_CAPITAL_FINDER_TT_SOURCE: "$MAPMODE_CM_CAPITAL_FINDER_TT_SCORED$\nVorhandene Proximitätsquelle: [ROOT.GetLocation.GetModifierValueFixed('local_proximity_source')|0]"
 MAPMODE_CM_CAPITAL_FINDER_TT_SOURCE_DEBUG: "$MAPMODE_CM_CAPITAL_FINDER_TT_SOURCE$$CM_PF_DEBUG_BLOCK$"
 MAPMODE_CM_CAPITAL_FINDER_TT_NO_DATA: "Noch nicht berechnet. Verwende die Aktualisieren-Schaltfläche in der Aktionsleiste, um die Punktzahlen für die aktuellen Grenzen zu berechnen."
 MAPMODE_CM_CAPITAL_FINDER_TT_SKIPPED: "Nicht ausgewertet: Die Einstellung Suchgenauigkeit hat diesen Standort übersprungen. Stellen Sie sie auf Erschöpfend ein und aktualisieren Sie, um jeden Standort auszuwerten."
 MAPMODE_CM_CAPITAL_FINDER_TT_SKIPPED_DEBUG: "$MAPMODE_CM_CAPITAL_FINDER_TT_SKIPPED$$CM_PF_DEBUG_BLOCK$"
 MAPMODE_CM_CAPITAL_FINDER_TT_FOREIGN: "Nicht Teil deines Landes."
 MAPMODE_CM_CAPITAL_FINDER_TT_WATER: "Dies ist ein Wasserstandort; Hauptstadtwertungen gelten für Euer eigenes Land."

 mapmode_cm_capital_finder_hidden_name: "$mapmode_cm_capital_finder_name$"
 MAPMODE_CM_CAPITAL_FINDER_HIDDEN: "$MAPMODE_CM_CAPITAL_FINDER$"

 cm_pf_cap_source_legend_key: "Bestehende Proximitätsquelle (gestreift)"

 # Action bar refresh button
 cm_pf_refresh: "cm_pf_refresh"
 cm_pf_refresh_color: "Dunkeltürkis"
 cm_pf_refresh_icon: "@cm_pf_refresh!"
 cm_pf_refresh_name: "Platzierungswerte neu berechnen"
 cm_pf_refresh_tooltip: "Erzwingt eine Neuberechnung der Platzierungswerte für Gouverneure und Hauptstädte für die aktuellen Grenzen. Andernfalls werden die Werte bis zu 4 Jahre lang wiederverwendet."
