 MAPMODE_CM_CAPITAL_FINDER: "#T $mapmode_cm_capital_finder_name$#!\nFärbt Ihre [locations|e] danach ein, wie gut ein [capital|e] dort [proximity|e] verbreiten würde. Bestehende Statthalter werden ignoriert. Gestreifte Orte verfügen bereits über eine Proximity-Quelle, wie die aktuelle Hauptstadt oder einen Statthalter.\n$cm_pf_estimate_note$"
 MAPMODE_CM_CAPITAL_FINDER_TT_SCORED: "$cm_pf_cap_tt_head$\nScore: [ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_cf_pct_value')|0] % deines besten Standorts[ROOT.GetLocation.Custom('cm_pf_cf_status')]"
 MAPMODE_CM_CAPITAL_FINDER_TT_BEST: "$cm_pf_cap_tt_head$\nIhr bester Standort"
 MAPMODE_CM_CAPITAL_FINDER_TT_SCORED_DEBUG: "$MAPMODE_CM_CAPITAL_FINDER_TT_SCORED$$CM_PF_DEBUG_BLOCK$"
 MAPMODE_CM_CAPITAL_FINDER_TT_BEST_DEBUG: "$MAPMODE_CM_CAPITAL_FINDER_TT_BEST$$CM_PF_DEBUG_BLOCK$"
 MAPMODE_CM_CAPITAL_FINDER_TT_SOURCE: "$MAPMODE_CM_CAPITAL_FINDER_TT_SCORED$\nVorhandene Proximitätsquelle: [ROOT.GetLocation.GetModifierValueFixed('local_proximity_source')|0]"
 MAPMODE_CM_CAPITAL_FINDER_TT_SOURCE_DEBUG: "$MAPMODE_CM_CAPITAL_FINDER_TT_SOURCE$$CM_PF_DEBUG_BLOCK$"
