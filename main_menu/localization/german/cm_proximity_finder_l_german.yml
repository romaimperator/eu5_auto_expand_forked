l_german:
 mapmode_cm_governor_finder_name: "Empfohlene Statthalterplatzierung"
 MAPMODE_CM_GOVERNOR_FINDER: "#T $mapmode_cm_governor_finder_name$#!\nFärbt eure [locations|e] danach ein, wie viel [proximity|e] ein dort gebauter neuer Lokaler Gouverneur oder Marinegouverneur hinzufügen würde, in Anbetracht der Proximität, die eure [capital|e] und bestehende Quellen bereits bieten. Grüner ist besser. Eure Hauptstadt und bestehende Proximitätsquellen sind gestreift.\nDies ist eine Schätzung: Die Einstellung für die Bewertung der Standortsuche bestimmt, ob Orte nach Steuerbasis oder rohem [proximity|e] eingestuft werden, und die Einstellungen für Land- und Marineinfrastruktur legen die Straßen, Gebäude und [maritime_presence|e] fest, die vorausgesetzt werden. Die Neuberechnung erfolgt beim Öffnen dieses Kartenmodus, höchstens einmal alle 4 Jahre; nutzt die Aktualisierungsschaltfläche in der Aktionsleiste, um eine neue Berechnung zu erzwingen. Die Farben werden nach Abschluss aktualisiert."
 MAPMODE_CM_GOVERNOR_FINDER_TT_SCORED: "Voraussichtlicher max. durchschnittlicher [proximity|e]-Zuwachs: +[ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_gf_avg_value')|1]%\nMax. voraussichtliche Steuerbasis durch [proximity|e]: +[ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_gf_taxgain_value')|1]\nBewertung: [ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_gf_pct_value')|0]% Eures besten Standorts[ROOT.GetLocation.Custom('cm_pf_gf_status')]"
 MAPMODE_CM_GOVERNOR_FINDER_TT_BEST: "Prognostizierter max. durchschnittlicher [proximity|e]-Zuwachs: +[ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_gf_avg_value')|1]%\nMax. prognostizierte Steuerbasis aus [proximity|e]: +[ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_gf_taxgain_value')|1]\nIhr bester Standort"
 MAPMODE_CM_GOVERNOR_FINDER_TT_SCORED_DEBUG: "$MAPMODE_CM_GOVERNOR_FINDER_TT_SCORED$$CM_PF_DEBUG_BLOCK$"
 MAPMODE_CM_GOVERNOR_FINDER_TT_BEST_DEBUG: "$MAPMODE_CM_GOVERNOR_FINDER_TT_BEST$$CM_PF_DEBUG_BLOCK$"
 MAPMODE_CM_GOVERNOR_FINDER_TT_CAPITAL: "Euer [capital|e] verbreitet bereits [proximity|e] von hier aus."
 MAPMODE_CM_GOVERNOR_FINDER_TT_CAPITAL_DEBUG: "$MAPMODE_CM_GOVERNOR_FINDER_TT_CAPITAL$$CM_PF_DEBUG_BLOCK$"
 MAPMODE_CM_GOVERNOR_FINDER_TT_SOURCE: "Bestehende [proximity|e]-Quelle: [ROOT.GetLocation.GetModifierValueFixed('local_proximity_source')|0]\n$MAPMODE_CM_GOVERNOR_FINDER_TT_SCORED$"
 MAPMODE_CM_GOVERNOR_FINDER_TT_SOURCE_DEBUG: "$MAPMODE_CM_GOVERNOR_FINDER_TT_SOURCE$$CM_PF_DEBUG_BLOCK$"
 MAPMODE_CM_GOVERNOR_FINDER_TT_SOURCE_NOGAIN: "Vorhandene [proximity|e]-Quelle: [ROOT.GetLocation.GetModifierValueFixed('local_proximity_source')|0]\n$MAPMODE_CM_GOVERNOR_FINDER_TT_NOGAIN$"
 MAPMODE_CM_GOVERNOR_FINDER_TT_SOURCE_NOGAIN_DEBUG: "$MAPMODE_CM_GOVERNOR_FINDER_TT_SOURCE_NOGAIN$$CM_PF_DEBUG_BLOCK$"
 MAPMODE_CM_GOVERNOR_FINDER_TT_NOGAIN: "Ein Statthalter bietet höchstens 80 [proximity|e] und dieser Standort [ROOT.GetLocation.Custom('cm_pf_nogain_basis')], daher würde ein hier gebauter Statthalter nichts hinzufügen."
 MAPMODE_CM_GOVERNOR_FINDER_TT_NOGAIN_DEBUG: "$MAPMODE_CM_GOVERNOR_FINDER_TT_NOGAIN$$CM_PF_DEBUG_BLOCK$"
 cm_pf_nogain_basis_current: "hat bereits mindestens so viel"
 cm_pf_nogain_basis_assumed: "würde unter der angenommenen Infrastruktur bereits mindestens so viel haben"
 CM_PF_DEBUG_BLOCK: "[ROOT.GetLocation.Custom('cm_pf_debug_block')]"
 cm_pf_debug_block_text: "\n--debug--\n[ROOT.GetLocation.Custom('cm_pf_pred_label')]: [ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_pred_value')|0]%\nAktuell [proximity|e]: [ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_current_proximity')|0]%[ROOT.GetLocation.Custom('cm_pf_path_block')]"
 cm_pf_pred_label_max: "Voraussichtliches Maximum [proximity|e] aus der Hauptstadt"
 cm_pf_pred_label_current: "Prognostizierte aktuelle [proximity|e] aus der Hauptstadt"
