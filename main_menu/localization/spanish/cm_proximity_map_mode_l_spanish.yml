l_spanish:
 mapmode_cm_location_proximity_modifier_name: "Impacto de la eficiencia de proximidad"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER: "#T $mapmode_cm_location_proximity_modifier_name$#!\nColorea [locations|e] según su $mapmode_cm_location_proximity_modifier_name$: la penalización combinada que su [topography|e] y [vegetation|e] imponen a [proximity|e] (montañas, colinas, mesetas, humedales, bosques, selvas, etc.). El verde significa que el terreno no dificulta la proximidad; el rojo significa que lo dificulta significativamente. Las penalizaciones de topografía se ajustan según las bonificaciones de impacto de proximidad del propietario, como las del terreno de la capital o los avances; las localizaciones sin dueño muestran los valores de terreno base. Un [road|e] o [river|e] en una localización cancela su penalización de [vegetation|e]; la penalización de [topography|e] siempre se aplica.\n\nEl agua muestra en su lugar la [maritime_presence|e] que el [country|e] seleccionado tiene allí, desde el verde en el nivel más bajo, pasando por el verde claro, hasta el azul claro al máximo. Una presencia alta reduce el [proximity|e] perdido al cruzar un [seazone|e]."
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_LAND: "$mapmode_cm_location_proximity_modifier_name$: [ROOT.GetLocation.MakeScope.ScriptValue('cm_location_proximity_modifier')|+=%]"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_LAND_HARBOR: "$MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_LAND$\nIdoneidad de puerto natural: [ROOT.GetLocation.GetModifierValueFixed('natural_harbor_suitability')|0%]"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER: "[ROOT.GetLocation.GetName] no es tierra, por lo que no tiene $mapmode_cm_location_proximity_modifier_name$, y el [country|e] seleccionado no tiene [maritime_presence|e] aquí."

 cm_location_proximity_modifier_none_legend_key: "0% (sin penalización)"
 cm_location_proximity_modifier_light_legend_key: "-25% (ligero)"
 cm_location_proximity_modifier_noticeable_legend_key: "-35% (notable)"
 cm_location_proximity_modifier_moderate_legend_key: "-50% (moderado)"
 cm_location_proximity_modifier_heavy_legend_key: "-65% (pesado)"
 cm_location_proximity_modifier_severe_legend_key: "-75% (grave)"
 cm_location_proximity_modifier_worst_legend_key: "-100% (peor)"
 cm_location_proximity_modifier_harbor_legend_key: "Idoneidad de puerto natural (rayado)"
 cm_location_proximity_modifier_maritime_none_legend_key: "Sin presencia marítima (mar abierto)"
 cm_location_proximity_modifier_maritime_low_legend_key: "Baja presencia marítima"
 cm_location_proximity_modifier_maritime_half_legend_key: "50% Presencia marítima"
 cm_location_proximity_modifier_maritime_full_legend_key: "100% Presencia marítima"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER_M0: "[maritime_presence|E]: 0-10%"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER_M10: "[maritime_presence|E]: 10-20%"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER_M20: "[maritime_presence|E]: 20-30%"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER_M30: "[maritime_presence|E]: 30-40%"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER_M40: "[maritime_presence|E]: 40-50%"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER_M50: "[maritime_presence|E]: 50-60%"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER_M60: "[maritime_presence|E]: 60-70%"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER_M70: "[maritime_presence|E]: 70-80%"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER_M80: "[maritime_presence|E]: 80-90%"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER_M90: "[maritime_presence|E]: 90-100%"
