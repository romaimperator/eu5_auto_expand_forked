l_spanish:
 mapmode_cm_location_proximity_modifier_name: "Impacto de la eficiencia de proximidad"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER: "#T $mapmode_cm_location_proximity_modifier_name$#!\nColorea [locations|e] según su Impacto en la Eficiencia de Proximidad: la penalización combinada que su [topography|e] y [vegetation|e] imponen a la [proximity|e] (montañas, colinas, mesetas, humedales, bosques, selvas, etc.). El verde significa que el terreno no entorpece la proximidad; el rojo significa que lo hace considerablemente. Las penalizaciones de topografía se ajustan según las bonificaciones de impacto de proximidad del propietario, tales como las del terreno de la capital o los avances; las localizaciones sin dueño muestran los valores de terreno base. Un [road|e] o [river|e] en una localización anula su penalización de [vegetation|e]; la penalización de [topography|e] siempre se aplica."
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_LAND: "Impacto de la eficiencia por proximidad: [ROOT.GetLocation.MakeScope.ScriptValue('cm_location_proximity_modifier')|+=%]"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_LAND_HARBOR: "Impacto de eficiencia por proximidad: [ROOT.GetLocation.MakeScope.ScriptValue('cm_location_proximity_modifier')|+=%]\nIdoneidad de puerto natural: [ROOT.GetLocation.GetModifierValueFixed('natural_harbor_suitability')|0%]"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER: "[ROOT.GetLocation.GetName] no es tierra, por lo que no tiene impacto en la eficiencia por proximidad."

 cm_location_proximity_modifier_none_legend_key: "0% (sin penalización)"
 cm_location_proximity_modifier_light_legend_key: "-25% (ligero)"
 cm_location_proximity_modifier_noticeable_legend_key: "-35% (notable)"
 cm_location_proximity_modifier_moderate_legend_key: "-50% (moderado)"
 cm_location_proximity_modifier_heavy_legend_key: "-65% (pesado)"
 cm_location_proximity_modifier_severe_legend_key: "-75% (grave)"
 cm_location_proximity_modifier_worst_legend_key: "-100% (peor)"
 cm_location_proximity_modifier_harbor_legend_key: "Idoneidad de puerto natural (rayado)"
