 cm__expand_metric_option_2_desc: "Añade un nuevo nivel solo cuando su beneficio mensual total sea al menos el Beneficio Mínimo establecido."
 cm__expand_metric_option_3_name: "@efficiency! ROI (Impuestos)"
 cm__expand_metric_option_3_desc: "Añade un nuevo nivel solo cuando sus ingresos fiscales recuperen el coste de construcción dentro de los Años de ROI Máx. establecidos."
 cm__expand_metric_option_4_name: "@efficiency! ROI (Beneficio)"
 cm__expand_metric_option_4_desc: "Añade un nuevo nivel solo cuando su beneficio recupere el coste de construcción dentro de los Años de ROI máx. establecidos."
 cm__auto_town_rights_list_i32_name: "@market_charter! [ShowTownRightsName('market_charter')]"
 cm__auto_town_rights_list_i33_name: "@free_town_charter! [ShowTownRightsName('free_town_charter')]"
 cm__auto_town_rights_list_i34_name: "@fortress_town! [ShowTownRightsName('fortress_town')]"
 cm__auto_town_rights_list_i35_name: "@mining_charter! [ShowTownRightsName('mining_charter')]"
 cm__auto_town_rights_list_i36_name: "@studium_privileges! [ShowTownRightsName('studium_privileges')]"
 cm__auto_town_rights_list_i37_name: "@agrarian_community_town_right! [ShowTownRightsName('agrarian_community_town_right')]"
 cm__auto_town_rights_list_i38_name: "@enlightened_leadership_reform_town_right! [ShowTownRightsName('enlightened_leadership_reform_town_right')]"
 cm__expand_metric: "cm__expand_metric"
 cm__town_rights_free_grants_name: "Eliminar costes de derechos urbanos"
 cm__town_rights_free_grants_desc: "Al estar activado, conceder derechos urbanos no cuesta poder de gobierno y revocarlos no cuesta estabilidad."
 cm__town_rights_min_gov_power_name: "Poder gubernamental mínimo"
 cm__town_rights_min_gov_power_desc: "La concesión automática deja de otorgar derechos urbanos cuando la siguiente concesión reduzca tu poder de gobierno (legitimidad, tradición republicana, devoción o unidad de horda, según el tipo de gobierno) por debajo de este valor."
 cm__allowed_building_overbuild_levels_format: "[CMMV('cm__allowed_building_overbuild_levels')][Select_CString(GreaterThanOrEqualTo_CFixedPoint(CMMV('cm__allowed_building_overbuild_levels'), CMMMapValue('cmm_max', 'cm__allowed_building_overbuild_levels')), '+', '')]"
 cm__auto_build_capital_name: "Edificios de la capital"
 cm__auto_build_capital_desc: "Construye automáticamente edificios exclusivos de la capital (corte real, tribunal supremo, academia de guerra, etc.) en tu ubicación capital cuando las condiciones lo permitan. Estos se construyen antes que la lista de abajo."
 cm__urbanize_city_to_megalopolis_name: "Ciudad a megalópolis"
 cm__urbanize_city_to_megalopolis_desc: "Mejora tu capital a megalópolis una vez que sea una ciudad centro de mercado con al menos 400.000 de población."
 cm__megalopolis_ignore_capital_name: "Megalópolis: ignorar requisito de capital"
 cm__megalopolis_ignore_capital_desc: "Permite construir Fundar megalópolis en una ciudad que no sea tu capital."
 cm__megalopolis_ignore_market_center_name: "Megalópolis: Ignorar requisito de centro de mercado"
 cm__megalopolis_ignore_market_center_desc: "Permite construir Fundar megalópolis en una ciudad que no sea un centro de mercado."
 cm__deurbanize_name: "Desurbanizar"
 cm__deurbanize_desc: "Cada mes, devuelve las localizaciones propias al estado de asentamientos rurales cuando su bien de ORE esté marcado en la lista de No urbanizar de abajo. Tu capital, las localizaciones conquistadas y las localizaciones que proporcionan proximidad, como las sedes de gobernador, no se verán afectadas."
 cm__auto_urbanize_ignore_list_i20_name: "@wool! [ShowGoodsName('wool')] ([GetGlobalVariable('cm_goods_wool').GetGoods.GetDefaultMarketPrice]@gold!)"
 cm__full_automation_name: "Automatización completa"
 cm__full_automation__full_automation_name: "Automatización completa"
 cm__full_automation__full_automation_desc: "Construcción automatizada. Cada mes, las categorías de abajo gastan el tesoro que supere la Reserva de Oro en las mejores construcciones disponibles. Funciona junto con las demás funciones de automatización sin modificar sus ajustes."
 cm__fa_enabled_name: "Activar automatización completa"
 cm__fa_enabled_desc: "Activa o desactiva la automatización completa."
 cm__fa_reserve_name: "Reserva de oro"
 cm__fa_reserve_desc: "La automatización total nunca gastará tu tesoro por debajo de esta cantidad. Es independiente de la Reserva de oro en la pestaña de Ajustes."
 cm__fa_reserve_format: "[CMMV('cm__fa_reserve')]@gold!"
 cm__fa_save_unaffordable_name: "Ahorrar para edificios no asequibles"
 cm__fa_save_unaffordable_desc: "Una categoría compra el mejor edificio que haya encontrado incluso cuando cuesta más que su asignación mensual, y luego no realiza más compras hasta que los meses posteriores hayan compensado la diferencia. Cuando está desactivado, cada categoría gasta lo que puede y transfiere el sobrante a las siguientes."
 cm__full_automation__fa_priority_list_name: "Prioridades"
 cm__full_automation__fa_priority_list_desc: "Arrastra para reordenar. Las categorías se procesan de arriba hacia abajo cada mes. Cuando dos categorías quieran el mismo edificio, la que esté más arriba lo construirá."
 cm__fa_priority_list_item_column_name: "Categoría"
 cm__fa_priority_list_i1_name: "Comida"
 cm__fa_priority_list_i1_desc: "Supervisa el suministro de alimentos a lo largo del año en los mercados cuyo centro de mercado poseas y, allí donde el mes mediano haya sido insuficiente, activa el autoalimento en las ubicaciones con el mayor potencial de alimentos. Las ubicaciones que seleccione brillarán como las activadas por el jugador, pero el interruptor seguirá siendo tuyo; nunca se desactivarán a menos que la ubicación deje de ser un asentamiento rural de tu propiedad o dejes de poseer su centro de mercado."
 cm__fa_priority_list_i2_name: "Industria"
 cm__fa_priority_list_i2_desc: "Construye, amplía y mejora los edificios de producción y RGO que amortizan su coste más rápido mediante ingresos fiscales. Las localizaciones con comida automática se ignoran si ya existe escasez de cualquier tipo de trabajador en ellas."
 cm__fa_priority_list_i3_name: "Colapsador de precios"
 cm__fa_priority_list_i3_desc: "Expande la producción de materiales de construcción para reducir sus precios. Funciona en mercados cuyo centro de mercado poseas. Las localizaciones con mayor producción van primero y a cada una se le asignan varios niveles a la vez; los productores comienzan incluso donde los trabajadores aún no han llegado. Se omiten tu capital, las localizaciones que producen alimentos y los productores que tendrían pérdidas sin subsidios."
 cm__fa_priority_list_i4_name: "Caminos"
 cm__fa_priority_list_i4_desc: "Construye la red de caminos con la mejor relación valor-precio basándose en tres beneficios: Proximidad, Acceso al mercado y conexión con la capital. Una vez al año calcula la mejor ruta hacia cada una de tus ubicaciones para cada criterio y, cada mes, inicia los tramos que más aumentarían la Base fiscal, sumando todo lo que se encuentre más adelante en la ruta. Los corredores llanos y económicos se trazan primero, y las dos categorías inferiores solo reciben inversión en los meses en los que la superior no tenga nada pendiente de construir."
 cm__fa_priority_list_i5_name: "Servicios públicos"
 cm__fa_priority_list_i5_desc: "Construye infraestructuras de apoyo en todos los lugares donde quepan: edificios de capital, la lista de autoconstrucción, patios de mercurio, edificios de centros de mercado, alguaciles y cualquier edificio único que tenga tu país que aumente el control, mercados, edificios de resistencia a enfermedades y, por último, graneros. Los edificios de control van primero a las localizaciones más ricas, y los mercados a las localizaciones con menor acceso al mercado primero."
 cm__fa_priority_list_i6_name: "Limpieza de edificios"
 cm__fa_priority_list_i6_desc: "Una vez al año, cierra los edificios de producción que han dejado de generar beneficios y no están subvencionados, y en su lugar los destruye cuando la localización se encuentra a diez niveles o menos del total de niveles de edificios que soporta. Los edificios cerrados se vuelven a abrir una vez que el tipo vuelve a generar beneficios en ese mercado, y se destruyen más tarde si la localización se queda sin espacio. @farming_village! [ShowBuildingTypeNameWithNoTooltip('farming_village')] nunca se cierra ni se destruye."
 cm__fa_priority_list_i7_name: "Gobernadores"
 cm__fa_priority_list_i7_desc: "Planifica dónde deben establecerse tus gobernadores y los coloca allí, priorizando las mejores ubicaciones. Vuelve a planificar cada vez que queda libre un puesto de gobernador y, de lo contrario, cada veinticinco años. Solo para un jugador."
 cm__fa_priority_list_i8_name: "Derechos urbanos"
 cm__fa_priority_list_i8_desc: "Otorga derechos urbanos en tus villas y ciudades. [ShowTownRightsNameWithNoTooltip('granary_town')] va primero, luego un derecho de especialización, elegido al azar entre los que se adapten a los bienes producidos en la localización."
 cm__fa_priority_list__budget_name: "Cuota del presupuesto"
 cm__fa_priority_list__budget_desc: "La proporción del tesoro por encima de la reserva de oro que esta categoría puede gastar cada mes."
 cm__fa_priority_list__budget_postfix: "%"
 cm__fa_priority_list__enabled_name: "Activado"
 cm__fa_priority_list__enabled_desc: "Permitir la construcción de esta categoría."
 cm__full_automation__fa_industry_name: "Industria"
 cm__full_automation__fa_industry_desc: "Ajustes para la categoría de industria de arriba."
 cm__fa_industry_algorithm_name: "Estrategia de construcción"
 cm__fa_industry_algorithm_desc: "Cómo la industria elige qué construir."
 cm__fa_industry_algorithm_option_1_name: "Codicioso"
 cm__fa_industry_algorithm_option_1_desc: "Construir primero las opciones de amortización más rápida y solo aquellas cercanas al mejor lugar encontrado para producir los mismos bienes."
 cm__fa_industry_max_rel_roi_name: "ROI Relativo Máximo"
 cm__fa_industry_max_rel_roi_desc: "Cuánto más lento que el mejor lugar encontrado para producir los mismos bienes puede un edificio o mejora amortizar su coste y aun así ser construido. Al 30%, si el mejor se amortiza en 10 años, solo se construirán los que se amorticen en un plazo de 13 años; cualquier cosa más lenta esperará. Al 0%, solo el mejor productor de cada bien se construye cada mes. Al 100%+ no hay límite y solo se aplica Años de amortización máximos. Todos los edificios que produzcan los mismos bienes se evalúan conjuntamente, sin importar de qué tipo sean. Las expansiones de RGO siempre se construyen por orden de amortización."
 cm__fa_industry_max_rel_roi_format: "[CMMV('cm__fa_industry_max_rel_roi')]%[Select_CString(GreaterThanOrEqualTo_CFixedPoint(CMMV('cm__fa_industry_max_rel_roi'), CMMMapValue('cmm_max', 'cm__fa_industry_max_rel_roi')), '+', '')]"
 cm__fa_industry_min_roi_name: "Años máximos de amortización"
 cm__fa_industry_min_roi_desc: "Solo se consideran las construcciones cuyos ingresos fiscales amorticen el coste de construcción en este número de años. Establécelo en 0 para desactivar la comprobación."
 cm__fa_industry_min_roi_format: "[CMMV('cm__fa_industry_min_roi')] y @efficiency!"
 cm__full_automation__fa_collapsar_name: "Colapsador de precios"
 cm__full_automation__fa_collapsar_desc: "Ajustes para la categoría Price Collapsar de arriba. Los materiales se procesan de arriba abajo en la lista, expandiendo las RGO antes que los edificios de producción."
 cm__fa_collapsar_target_name: "Precio objetivo"
 cm__fa_collapsar_target_desc: "El precio al que se detiene la construcción de un material, en relación con su precio base. Al -33 %, se construirán productores hasta que el material se comercialice un 33 % por debajo de su precio base. Al 0 %, hasta que alcance el precio base. Al +33 %, solo mientras cueste más de un 33 % por encima de la base."
 cm__fa_collapsar_target_format: "[CMMV('cm__fa_collapsar_target')]%"
 cm__fa_collapsar_item_column_name: "Material"
 cm__fa_collapsar_i1_name: "@masonry! [ShowGoodsName('masonry')]"
 cm__fa_collapsar_i2_name: "@lumber! [ShowGoodsName('lumber')]"
 cm__fa_collapsar_i3_name: "@sand! [ShowGoodsName('sand')]"
 cm__fa_collapsar_i4_name: "@glass! [ShowGoodsName('glass')]"
 cm__fa_collapsar__enabled_name: "Activado"
 cm__fa_collapsar__enabled_desc: "Trabajar para reducir el precio de este material."
 cm__full_automation__fa_food_name: "Comida"
 cm__full_automation__fa_food_desc: "Ajustes para la categoría de Alimentos de arriba."
 cm__fa_food_target_name: "Objetivo de excedente"
 cm__fa_food_target_desc: "Un mercado obtiene más emplazamientos de alimentos hasta que su oferta alcance esta proporción de su demanda. Al 125%, los alimentos se expanden en cualquier mercado cuyo mes mediano del año no haya alcanzado un superávit del 25%. Auméntalo para mantener un mayor margen, redúcelo para ayudar solo a los mercados que estén más cerca de la escasez."
 cm__fa_food_target_format: "[CMMV('cm__fa_food_target')]%"
 cm__fa_food_min_potential_name: "Potencial mínimo de alimentos"
 cm__fa_food_min_potential_desc: "La comida automática solo se activa en localizaciones cuyo potencial de comida por nivel de RGO alcance esta puntuación, la misma que muestra el modo de mapa $mapmode_cm_location_food_potential_name$. Auméntala para priorizar mejores tierras de cultivo o redúcela para aceptar tierras menos fértiles."
 cm__fa_food_min_potential_format: "[CMMV('cm__fa_food_min_potential')]"
 cm__full_automation__fa_urban_rights_name: "Derechos urbanos"
 cm__full_automation__fa_urban_rights_desc: "Ajustes para la categoría de Derechos Urbanos de arriba."
 cm__fa_urban_rights_window_name: "Umbral de ajuste"
 cm__fa_urban_rights_window_desc: "Qué tan bien debe adaptarse un derecho de especialización a una localización, respecto al derecho mejor adaptado allí, para ser elegible. Al 50 %, cualquier derecho que se adapte al menos la mitad de bien puede ser seleccionado, y los mejor adaptados se seleccionan con más frecuencia. Al 100 %, solo se otorga el derecho mejor adaptado."
 cm__fa_urban_rights_window_format: "[CMMV('cm__fa_urban_rights_window')]%"
 cm__fa_urban_rights_reserve_name: "Reserva de poder gubernamental"
 cm__fa_urban_rights_reserve_desc: "No se otorgará ningún derecho urbano cuando el pago por el mismo reduzca tu poder de gobierno (legitimidad, tradición republicana, devoción o unidad de horda, según el tipo de gobierno) por debajo de este valor."
 cm__fa_urban_rights_expand_name: "Expandir las industrias potenciadas"
 cm__fa_urban_rights_expand_desc: "Cuando se otorga un derecho de especialización, también se activa la expansión automática en esa localización para las industrias que el derecho potencia y para sus materias primas donde la localización las produzca. Es lo mismo que hacer clic derecho en un botón de concesión en el mapa de Derechos Urbanos Recomendados."
 cm__full_automation__fa_cleanup_name: "Limpieza de edificios"
 cm__full_automation__fa_cleanup_desc: "Ajustes para la categoría Limpieza de edificios de arriba."
 cm__fa_cleanup_min_profit_name: "Beneficio mínimo"
 cm__fa_cleanup_min_profit_desc: "Un edificio que genere menos de esto al mes se considera que no es rentable y se cerrará o destruirá a menos que esté subvencionado. Como máximo, se cerrará a la vez la mitad de los edificios abiertos de un mismo tipo en un mercado."
 cm__fa_cleanup_min_profit_format: "[Divide_CFixedPoint(CMMV('cm__fa_cleanup_min_profit'), '(CFixedPoint)100')|2]@gold!"
 cm__fa_cleanup_core_goods_name: "Priorizar materiales de construcción"
 cm__fa_cleanup_core_goods_desc: "Mantener los edificios que consumen principalmente @masonry![ShowGoodsNameWithNoTooltip('masonry')], @lumber![ShowGoodsNameWithNoTooltip('lumber')], @sand![ShowGoodsNameWithNoTooltip('sand')] o @glass![ShowGoodsNameWithNoTooltip('glass')] al doble del Beneficio Mínimo, o 0.1@gold!, lo que sea mayor. Los edificios que producen uno de los cuatro se rigen por el Beneficio Mínimo normal."
 cm__fa_cleanup_auto_food_name: "Limpiar ubicaciones de alimento automático"
 cm__fa_cleanup_auto_food_desc: "Cuando el auto-alimento esté en funcionamiento y cualquier tipo de trabajador ya escasee, destruye los edificios de producción que no produzcan alimentos. Un @market_village! [ShowBuildingTypeNameWithNoTooltip('market_village')] se reduce a un nivel en lugar de ser destruido."
 cm__full_automation__fa_roads_name: "Caminos"
 cm__full_automation__fa_roads_desc: "Configuración para la categoría de Caminos de arriba."
 cm__fa_roads_proximity_name: "Proximidad"
 cm__fa_roads_proximity_desc: "Construye los tramos de carretera que más aumenten la Proximidad por el oro invertido, contando cada ubicación situada más adelante en la ruta tras ellos."
 cm__fa_roads_market_access_name: "Acceso al mercado"
 cm__fa_roads_market_access_desc: "Tiende los tramos de carretera que más aumenten el acceso al mercado por cada ducado invertido. Solo gasta dinero en los meses en los que ya no queden tramos de proximidad por construir."
 cm__fa_roads_capital_name: "Conexión con la capital"
 cm__fa_roads_capital_desc: "Construye tramos de carretera para conectar tus ubicaciones con tu capital, avanzando hacia fuera desde las que ya están conectadas. Solo gasta en los meses en los que no queden tramos de Proximidad y Acceso al mercado por construir."
 cm__full_automation__fa_governors_name: "Gobernadores"
 cm__full_automation__fa_governors_desc: "Ajustes para la categoría de Gobernadores superior."
 cm__fa_gov_move_seats_name: "Permitir mover gobernadores"
 cm__fa_gov_move_seats_desc: "Cuando todos los espacios de gobernador estén llenos, retira a un gobernador y coloca a uno en una ubicación mejor en su lugar. La ubicación mejor debe ser ya una ciudad o tener una puntuación más de un 10 % superior a la del que reemplaza. Con esto desactivado, los gobernadores solo se colocarán en espacios que estén vacíos."
 cm__fa_gov_prepare_sites_name: "Permitir la preparación de nuevas localizaciones"
 cm__fa_gov_prepare_sites_desc: "Considera las localizaciones que aún no pueden albergar a un gobernador y prepáralas primero, fundando un pueblo o ciudad allí y construyendo un camino hasta tu capital. Con esto desactivado, solo se tendrán en cuenta las localizaciones que ya sean una ciudad con un camino hasta tu capital."
 cm__map_modes_name: "Modos de mapa"
 cm__map_modes__placement_finder_name: "Capital y ubicación del gobernador recomendadas"
 cm__map_modes__placement_finder_desc: "Configuración para los modos de mapa de Gobernador recomendado y Colocación de capital recomendada."
 cm__placement_finder_method_name: "Puntuación del buscador de ubicación"
 cm__placement_finder_method_desc: "Cómo los modos de mapa de Gobernador recomendado y Capital recomendada clasifican tus localizaciones."
 cm__placement_finder_method_option_1_name: "Base impositiva"
 cm__placement_finder_method_option_1_desc: "Clasificar según cuánto aumentaría tu base impositiva total un gobernador o una capital allí situados. Las localizaciones más ricas cuentan más."
 cm__placement_finder_method_option_2_name: "Proximidad"
 cm__placement_finder_method_option_2_desc: "Ordenar por la proximidad que añadiría un gobernador o capital situado allí."
 cm__placement_finder_roads_name: "Infraestructura terrestre"
 cm__placement_finder_roads_desc: "Si los modos de mapa de Gobernador recomendado y Capital recomendada asumen una infraestructura terrestre ideal o utilizan lo que realmente has construido."
 cm__placement_finder_roads_option_1_name: "Actual"
 cm__placement_finder_roads_option_1_desc: "Usa los caminos que realmente has construido."
 cm__placement_finder_roads_option_2_name: "Caminos máximos"
 cm__placement_finder_roads_option_2_desc: "Supone que la mejor carretera que has desbloqueado está construida en cada conexión."
 cm__placement_finder_roads_option_3_name: "Mejor posible"
 cm__placement_finder_roads_option_3_desc: "Se asume que la mejor carretera que hayas desbloqueado está construida en cada conexión, y que cada edificio desbloqueado que mejore la proximidad terrestre está construido donde sea posible."
 cm__placement_finder_naval_name: "Infraestructura naval"
 cm__placement_finder_naval_desc: "Si los modos de mapa de Gobernador recomendado y Capital recomendada asumen una infraestructura naval ideal o usan tu capacidad portuaria y presencia naval actuales."
 cm__placement_finder_naval_option_1_name: "Actual"
 cm__placement_finder_naval_option_1_desc: "Utiliza tu capacidad portuaria y presencia naval actuales."
 cm__placement_finder_naval_option_2_name: "Presencia máxima"
 cm__placement_finder_naval_option_2_desc: "Asume una presencia naval total en todas partes, con tu capacidad portuaria actual."
 cm__placement_finder_naval_option_3_name: "Mejor posible"
 cm__placement_finder_naval_option_3_desc: "Asume una presencia naval completa y los mejores edificios portuarios que hayas desbloqueado, construidos en cada ubicación costera."
 cm__placement_finder_accuracy_name: "Precisión de búsqueda"
 cm__placement_finder_accuracy_desc: "Qué tan minuciosamente buscan las mejores ubicaciones los modos de mapa de Gobernador Recomendado y Capital Recomendada. Las ubicaciones omitidas se muestran en negro."
 cm__placement_finder_accuracy_option_1_name: "Exhaustivo"
 cm__placement_finder_accuracy_option_1_desc: "Evaluar cada localización. La más precisa y la más lenta."
 cm__placement_finder_accuracy_option_2_name: "Exhaustivo"
 cm__placement_finder_accuracy_option_2_desc: "Omitir las ubicaciones que no puedan clasificarse entre las tres mejores. Las tres mejores y sus puntuaciones son idénticas a las de Exhaustivo, solo que más rápido."
 cm__placement_finder_accuracy_option_3_name: "Equilibrado"
 cm__placement_finder_accuracy_option_3_desc: "Omitir las ubicaciones que no puedan ser la mejor. La mejor ubicación sigue estando garantizada como exacta; el segundo y tercer marcador pueden diferir ocasionalmente."
 cm__placement_finder_accuracy_option_4_name: "Rápido"
 cm__placement_finder_accuracy_option_4_desc: "También omite las localizaciones con muy pocas probabilidades de ser las mejores. La mejor localización encontrada está dentro del 20% de la mejor real y normalmente sigue siendo exacta."
 cm__placement_finder_accuracy_option_5_name: "Más rápido"
 cm__placement_finder_accuracy_option_5_desc: "Evalúa la ubicación más prometedora de cada provincia y luego refina en torno a las principales. Mucho más rápido para países grandes; puede pasar por alto la mejor ubicación."
 cm__debug_name: "Depuración"
 cm__debug__logging_name: "Registro de acciones"
 cm__debug__logging_desc: "Qué acciones de este mod se registran en el registro de acciones del mod."
 cm__log_cycle_name: "Ciclo de construcción"
 cm__log_cycle_desc: "Líneas para un ciclo mensual que se omitió porque el anterior todavía se estaba agotando, y para el reinicio que sigue a dos omisiones consecutivas."
 cm__log_industry_name: "Industria"
 cm__log_industry_desc: "Líneas para cada edificio que pone en cola la categoría de Industria y cada expansión de materias primas que considere, con el retorno de inversión y los ingresos de cada uno."
 cm__log_collapsar_name: "Colapso de precios"
 cm__log_collapsar_desc: "Líneas que siguen a una localización a través de un ciclo de Colapso de Precios: el déficit del mercado y los niveles solicitados, luego lo que se le dio a esa localización, su puntuación y lo construido. Marca la localización primero con el comando de consola effect location:<key> = { cm_fa_col_watch_on = yes }."
 cm__log_food_name: "Auto-Alimentos"
 cm__log_food_desc: "Líneas para la categoría de Alimentos: oferta, demanda y ratio mensual de alimentos de cada mercado, la mediana anual con la que se juzga dicho ratio frente al objetivo, el recuento de ubicaciones que ya producen alimentos allí, y cada ubicación que habilita o deshabilita."
 cm__log_roads_name: "Caminos"
 cm__log_roads_desc: "Una línea por cada carretera que solicite la categoría Carreteras, indicando la ubicación, por cuál de los tres motivos se compró y su coste."
 cm__log_cleanup_name: "Limpieza de edificios"
 cm__log_cleanup_desc: "Líneas para la fase de limpieza anual de edificios y para cada edificio que cierre, reduzca, destruya o reabra, con el beneficio de cada uno y el umbral mínimo con el que se comparó."
 cm__log_governors_name: "Gobernadores"
 cm__log_governors_desc: "Líneas para el plan del gobernador: emplazamientos elegidos y descartados, mejoras de villas y ciudades, posicionamientos, reubicaciones y rechazos, además del traslado de capital de una nación afortunada."
 cm__log_military_name: "Militar de nación afortunada"
 cm__log_military_desc: "Líneas para una nación afortunada destruyendo fuertes y construyendo edificios de reserva militar."
 cm__log_government_name: "Gobierno de nación afortunada"
 cm__log_government_desc: "Líneas para una nación afortunada al eliminar una burocracia o realizar una acción de estamento."
 cm__debug__diagnostics_name: "Diagnósticos"
 cm__placement_finder_debug_path_name: "Activar diagnósticos de depuración"
 cm__placement_finder_debug_path_desc: "Añade un bloque de diagnóstico a los mensajes emergentes de los modos de mapa de Gobernador recomendado y Capital recomendada: la ruta prevista desde tu capital a cada ubicación con el coste de cada salto, y la proximidad prevista comparada con tu proximidad real."
 cm__debug__probes_name: "Sondas"
 cm__debug__probes_desc: "Diagnósticos puntuales escritos en el registro de acciones del mod."
 cm__probe_budget_name: "Presupuesto de automatización total"
 cm__probe_budget_desc: "El saldo de cada categoría de automatización completa, positivo cuando retiene oro para una opción que aún no puede costear y negativo cuando debe por exceso de gasto, junto con el límite de amortización de la industria y el mejor candidato esperando en un mercado que este ciclo ha omitido."
 cm__probe_budget_text: "Ejecutar"
 cm__probe_governors_name: "Plan del gobernador"
 cm__probe_governors_desc: "En qué punto se encuentra el plan del gobernador: su fase, cuántos emplazamientos posee y le quedan por colocar, si está reteniendo el tesoro, los gobernadores pagados y los huecos y asientos con los que está trabajando."
 cm__probe_governors_text: "Ejecutar"
 cm__probe_military_name: "Militar de nación afortunada"
 cm__probe_military_desc: "El nivel de edificio de reserva militar en el que se encuentra el país, si puede construirlo, el estado del par de capitales, el presupuesto militar y cuántas localizaciones pueden admitir el nivel frente a cuántas ya lo tienen."
 cm__probe_military_text: "Ejecutar"
 cm__probe_industry_anchors_name: "Anclas industriales"
 cm__probe_industry_anchors_desc: "Una línea por bien con el mejor retorno que la Industria haya registrado para este y el límite de retorno que establece, nombrando el edificio y la ubicación tras cada uno."
 cm__probe_industry_anchors_text: "Ejecutar"
 cm__probe_industry_rgo_name: "Materias primas industriales"
 cm__probe_industry_rgo_desc: "Una línea por cada razón por la que la industria ignoró las materias primas de una localización, o una sola línea cuando no ignoró ninguna. Lee la capital a menos que marques una localización con el efecto del comando de consola location:<key> = { cm_fa_col_watch_on = yes }."
 cm__probe_industry_rgo_text: "Ejecutar"
 cm__probe_collapsar_name: "Colapsador de precios"
 cm__probe_collapsar_desc: "Cada número que Price Collapsar lee en una localización, junto a la propia lectura del juego, seguido de lo que el mercado de esa localización podría absorber en un ciclo. Lee la capital a menos que marques una localización con el comando de consola effect location:<key> = { cm_fa_col_watch_on = yes }; la capital nunca es un candidato de Price Collapsar, así que marca una localización para leer una en la que este construiría."
 cm__probe_collapsar_text: "Ejecutar"
 cm__probe_roads_name: "Caminos"
 cm__probe_roads_desc: "Cuántos corredores mantiene el plan de carreteras para cada uno de los casos de proximidad, acceso al mercado y conexión con la capital, cuántos de los de la capital pueden iniciarse ya, cuántas carreteras se están construyendo ya y qué queda en la reserva de la categoría."
 cm__probe_roads_text: "Ejecutar"
 cm__probe_log_gate_name: "Umbral del registro de acciones"
 cm__probe_log_gate_desc: "La categoría de registro de Colapso de precios por duplicado, tal como la lee el filtro de registro y como la guarda el menú, de modo que aparezca cualquier categoría que esté activada en uno y desactivada en el otro."
 cm__probe_log_gate_text: "Ejecutar"
