 cm__ab_governors_name: "Gobernadores"
 cm__ab_master__ab_master_name: "$cm__ab_master_name$" # NO-TRANSLATE
 cm__ab_master__ab_master_desc: "Construcción automatizada. Cada mes, las categorías de abajo gastan el tesoro que exceda la Reserva de Oro en las mejores construcciones disponibles. Se ejecuta junto con las demás funciones de automatización sin modificar sus ajustes."
 cm__ab_enabled_name: "Habilitar construcción automática"
 cm__ab_enabled_desc: "Activar o desactivar la construcción automática."
 cm__ab_save_unaffordable_name: "Ahorrar para edificios inasequibles"
 cm__ab_save_unaffordable_desc: "Una categoría compra el mejor edificio que haya encontrado incluso cuando cuesta más que su cuota mensual, y luego se abstiene de comprar hasta que los meses posteriores hayan compensado la diferencia. Mientras esté desactivado, una categoría no compra nada que no pueda costear por completo."
 cm__ab_min_proximity_name: "Proximidad mínima"
 cm__ab_min_proximity_desc: "Las localizaciones por debajo de esta Proximidad se omiten al elegir dónde construir. Los Edificios de Control y @settlement_building! [ShowBuildingTypeNameWithNoTooltip('settlement_building')] se construyen de todas formas, ya que son lo que hace que valga la pena mantener tierras con baja Proximidad. Con 0, no se omite nada."
 cm__ab_min_proximity_format: "[CMMV('cm__ab_min_proximity')]%" # NO-TRANSLATE
 cm__ab_master__ab_priority_list_name: "Categorías de construcción automática"
 cm__ab_master__ab_priority_list_desc: "Arrastra para reordenar. Las categorías se procesan de arriba hacia abajo cada mes. Cuando dos solicitan el mismo edificio, la que esté más arriba lo construye, y si sobra oro después de que cada categoría haya recibido su parte, la que esté más arriba lo recibe."
 cm__ab_priority_list_item_column_name: "Categoría"
 cm__ab_priority_list_i1_name: "$cm__ab_custom_name$" # NO-TRANSLATE
 cm__ab_priority_list_i1_desc: "Construye infraestructura de apoyo en todos los lugares donde quepa. Los edificios de la capital se construyen primero, luego los edificios de control, después los edificios de centros de mercado y, por último, los edificios que selecciones tú mismo. Los alguaciles se destinan a las localizaciones cuyas materias primas se venden por más, otros edificios de control a las localizaciones más ricas y los mercados a las localizaciones con el menor acceso al mercado."
 cm__ab_priority_list_i2_name: "$cm__ab_core_name$" # NO-TRANSLATE
 cm__ab_priority_list_i2_desc: "Expande la producción de materiales de construcción para reducir sus precios. Funciona en mercados cuyo centro de mercado poseas. Las localizaciones con mejor producción van primero y a cada una se le otorgan varios niveles a la vez, y los productores comienzan incluso donde los trabajadores aún no han llegado. Se omiten tu capital, las localizaciones que producen alimentos y los productores que funcionarían con pérdidas sin un subsidio."
 cm__ab_priority_list_i3_name: "$cm__ab_food_name$" # NO-TRANSLATE
 cm__ab_priority_list_i3_desc: "Supervisa el suministro de alimentos a lo largo del año en los mercados cuyo centro de mercado poseas y, en aquellos donde el mes mediano haya sido insuficiente, activa el autoabastecimiento de comida en las localizaciones con mayor potencial de alimentos. Las localizaciones seleccionadas brillarán como las activadas por el jugador, pero el control sigue siendo tuyo; nunca se desactivarán a menos que la localización deje de ser un asentamiento rural de tu propiedad, dejes de poseer su centro de mercado o que una localización mejor en el mismo mercado ocupe su lugar."
 cm__ab_priority_list_i4_name: "$cm__ab_production_name$" # NO-TRANSLATE
 cm__ab_priority_list_i4_desc: "Construye, expande y mejora los edificios de producción y RGO que amorticen su coste más rápido mediante ingresos fiscales. Las localizaciones con gestión automática de comida se ignoran mientras haya escasez de cualquier tipo de trabajador."
 cm__ab_priority_list_i5_name: "$cm__ab_roads_name$" # NO-TRANSLATE
 cm__ab_priority_list_i5_desc: "Construye la red de caminos más rentable por el oro invertido, basándose en tres beneficios que aporta un camino: Proximidad, Acceso al mercado y la conexión de una ubicación con tu capital. Cada cuatro años, y siempre que tu capital se traslade, calcula la mejor ruta hacia cada ubicación de tu propiedad para cada uno de ellos y ordena los tramos según la Base impositiva que incrementarían, contabilizando todo lo que se encuentre más adelante en la ruta tras ellos; en el modo multijugador solo lo hace al pulsar Forzar replanificación de caminos. Cada mes recorre esa lista y se detiene en el primer tramo que no pueda iniciar en lugar de saltárselo. Los corredores llanos y económicos se trazan primero, y un tramo inferior solo recibe oro en los meses en los que el superior no haya construido nada y no esté ahorrando para un tramo que aún no pueda costear."
 cm__ab_priority_list_i6_name: "$cm__ab_governors_name$" # NO-TRANSLATE
 cm__ab_priority_list_i6_desc: "Planifica dónde deben estar tus gobernadores y los coloca allí, eligiendo primero la mejor ubicación. Vuelve a planificar cada vez que se libera un puesto de gobernador y, de lo contrario, cada veinticinco años. Solo para un jugador."
 cm__ab_priority_list__budget_name: "Cuota del presupuesto"
 cm__ab_priority_list__budget_desc: "La proporción del tesoro por encima de la Reserva de oro que se otorga a esta categoría cada mes. Es un mínimo en lugar de un límite: el oro que ninguna categoría gaste se vuelve a ofrecer desde el principio de la lista, por lo que una categoría puede construir mucho más allá de su parte en un mes en el que las categorías inferiores no tengan nada que comprar."
 cm__ab_priority_list__budget_postfix: "%" # NO-TRANSLATE
