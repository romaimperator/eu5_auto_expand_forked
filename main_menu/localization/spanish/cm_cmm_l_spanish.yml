l_spanish:
 # Mod
 cm_name: "Gestor de construcción"
 cm_desc: "Un mod masivo de calidad de vida que añade nuevas automatizaciones, filtros y modos de mapa para mejorar enormemente la experiencia de construcción en EU5."

 # Settings (settings) Tab
 ## Global Control (settings) Group
 cm__pause_auto_expand_name: "Pausar automatización"
 cm__pause_auto_expand_desc: "Pausa todas las funciones de automatización que añade este mod."
 cm__minimum_gold_name: "Reserva de oro"
 cm__minimum_gold_desc: "Ninguna automatización gastará de tu tesoro por debajo de esta cantidad."
 cm__minimum_gold_format: "[CMMV('cm__minimum_gold')]@gold!"
 cm__allowed_building_overbuild_levels_name: "Límite de sobreconstrucción"
 cm__allowed_building_overbuild_levels_desc: "Cuántos niveles de construcción totales puede exceder una localización su límite de Niveles de Construcción Soportados antes de que se dejen de poner nuevas construcciones en cola allí. La comida, los gobernadores y los edificios en localizaciones de otros países están exentos. En cero, no se permitirá sobrepasar el límite. Con 200+, no hay límite."

 ## Priority List Group
 cm__priority_list_item_column_name: "Característica"
 cm__priority_list_i1_name: "Edificios con auto-expansión habilitada"
 cm__priority_list_i1_desc: "Expande automáticamente los edificios de producción y no producción de varios niveles cuando sean rentables, haya población disponible y el oro se mantenga por encima de tu Reserva de oro. Se aplica donde la autoexpansión esté activada para una localización o para un tipo de edificio completo, incluyendo edificios extranjeros en localizaciones de otros países."
 cm__priority_list_i2_name: "RGOs con autoexpansión activada"
 cm__priority_list_i2_desc: "Expande automáticamente los niveles de RGO en las localizaciones donde la expansión automática de RGO esté activada, siempre que haya trabajadores disponibles y los recursos lo permitan."
 cm__priority_list_i3_name: "Autoexpandir alimentos en localizaciones habilitadas"
 cm__priority_list_i3_desc: "Construye automáticamente RGO y edificios de producción de alimentos en las localizaciones rurales para las que actives el autoalimento, eligiendo la opción más eficiente en cuanto a alimentos."
 cm__priority_list_i4_name: "Mejorar automáticamente todos los edificios"
 cm__priority_list_i4_desc: "Mejora automáticamente todos los edificios que hayan quedado obsoletos, independientemente de si la expansión automática está activada para dicho edificio."
 cm__priority_list__enabled_name: "$cm_txt_enabled$"
 cm__priority_list__enabled_desc: "Activa o desactiva esta función."
 cm__priority_list__min_profit_name: "Ingresos fiscales mín."
 cm__priority_list__min_profit_desc: "Oro mensual mínimo por nivel requerido antes de que la construcción se ponga en cola. Establézcalo en 0 para desactivar la comprobación."
 cm__priority_list__min_profit_postfix: "@gold!"
 cm__priority_list__min_discount_name: "$cm_txt_min_discount$"
 cm__priority_list__min_discount_desc: "$cm_txt_min_discount_desc$"
 cm__priority_list__min_discount_postfix: "%"
 cm__priority_list__min_discount_prefix_high: "#R "
 cm__priority_list__min_discount_postfix_high: "%#!"
 cm__priority_list__min_discount_prefix_low: "#G "
 cm__priority_list__min_discount_postfix_low: "%#!"

