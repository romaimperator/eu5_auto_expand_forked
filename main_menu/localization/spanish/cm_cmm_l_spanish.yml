l_spanish:
 # Mod
 cm_name: "Gestor de construcción"
 cm_desc: "Un mod masivo de calidad de vida que añade nuevas automatizaciones, filtros y modos de mapa para mejorar enormemente la experiencia de construcción de EU5."

 # Settings (settings) Tab
 cm__settings_name: "Ajustes"
 ## Global Control (settings) Group
 cm__pause_auto_expand_name: "Pausar automatización"
 cm__pause_auto_expand_desc: "Pausa todas las funciones de automatización: autoexpansión de edificios, autoexpansión de RGOs, mejora de todos los edificios, autoconstrucción, autoconstrucción de edificios de la capital, autoalimento, autourbanización, otorgamiento automático de derechos urbanos y automatización completa."
 cm__minimum_gold_name: "Reserva de oro"
 cm__minimum_gold_desc: "La reserva mínima de oro a mantener. Se aplica a todas las funciones de automatización, excepto a la Automatización completa."
 cm__minimum_gold_format: "[CMMV('cm__minimum_gold')]@gold!"
 cm__allowed_building_overbuild_levels_name: "Límite de sobreconstrucción"
 cm__allowed_building_overbuild_levels_desc: "Cuántos niveles de edificios totales puede superar una ubicación su límite de Niveles de edificios permitidos antes de que la expansión automática deje de poner nuevas construcciones en cola allí. Con un valor de cero, no permitirá la sobreconstrucción. Con 200 o más, no hay límite."

 ## Priority List Group
 cm__settings__priority_list_name: "Automatización de la construcción"
 cm__settings__priority_list_desc: "Arrastra para reordenar la prioridad de las funciones. Cada mes, las funciones activadas se ejecutan de arriba a abajo, excepto Auto-Urbanizar, que siempre se ejecuta al final, después de todas las demás funciones y de Automatización Total."
 cm__priority_list_item_column_name: "Característica"
 cm__priority_list_i1_name: "Expansión automática de edificios"
 cm__priority_list_i1_desc: "Expande automáticamente los edificios de producción y no producción de varios niveles cuando es rentable, hay población disponible y el oro se mantiene por encima de tu Reserva de Oro. Se aplica allí donde la autoexpansión esté activada para una localización o para un tipo de edificio completo, incluyendo edificios extranjeros en localizaciones de otros países."
 cm__priority_list_i2_name: "Autoexpandir RGOs"
 cm__priority_list_i2_desc: "Expande automáticamente los niveles de RGO en las localizaciones donde la expansión automática de RGO esté activada, siempre que haya trabajadores disponibles y los recursos lo permitan."
 cm__priority_list_i3_name: "Construcción automática"
 cm__priority_list_i3_desc: "Construye automáticamente edificios de capital y edificios de uno por localización (consejos, bibliotecas, etc.) en el orden y con los ajustes configurados en la pestaña de Construcción automática."
 cm__priority_list_i4_name: "Auto-comida"
 cm__priority_list_i4_desc: "Construye automáticamente RGO y edificios de producción de alimentos en ubicaciones rurales, seleccionando la opción más eficiente en cuanto a alimentos. Se configura en la pestaña Auto-Alimentos."
 cm__priority_list_i5_name: "Auto-urbanizar"
 cm__priority_list_i5_desc: "Mejora el rango de las localizaciones cada mes: de asentamientos rurales a villas, de villas a ciudades y de ciudades a megalópolis. Omite las localizaciones conquistadas. Se configura en la pestaña de Urbanización Automática."
 cm__priority_list_i6_name: "Automejorar todos los edificios"
 cm__priority_list_i6_desc: "Mejora automáticamente todos los edificios que se hayan quedado obsoletos, independientemente de si la expansión automática está activada para ese edificio."
 cm__priority_list__enabled_name: "Activado"
 cm__priority_list__enabled_desc: "Activar o desactivar esta función."
 cm__priority_list__min_profit_name: "Ingresos fiscales mín."
 cm__priority_list__min_profit_desc: "Oro mensual mínimo por nivel requerido antes de que la construcción se ponga en cola. Establézcalo en 0 para desactivar la comprobación."
 cm__priority_list__min_profit_postfix: "@gold!"
 cm__priority_list__min_discount_name: "Descuento mín."
 cm__priority_list__min_discount_desc: "Margen de sobreprecio máximo permitido para los materiales de construcción. Al -33%, solo construye cuando los materiales cuestan un 33% menos que el precio base. Al 0%, solo al precio base o inferior. Al +33%, construye incluso cuando los precios están un 33% por encima del precio base."
 cm__priority_list__min_discount_postfix: "%"
 cm__priority_list__min_discount_prefix_high: "#R "
 cm__priority_list__min_discount_postfix_high: "%#!"
 cm__priority_list__min_discount_prefix_low: "#G "
 cm__priority_list__min_discount_postfix_low: "%#!"

