l_spanish:
 # Mod
 cm_name: "Gestor de construcción"
 cm_desc: "Un mod masivo de calidad de vida que añade nuevas funciones de automatización, filtros y modos de mapa para mejorar considerablemente la experiencia de construcción en EU5."

 # Settings (settings) Tab
 cm__settings_name: "Ajustes"
 ## Global Control (settings) Group
 cm__pause_auto_expand_name: "Pausar automatización"
 cm__pause_auto_expand_desc: "Pausa todas las funciones de automatización: autoexpansión de edificios, autoexpansión de RGO, mejora de todos los edificios, autoconstrucción, autoconstrucción de edificios de capital, gestión automática de alimentos, autourbanización, autoconcesión de derechos urbanos y Automatización completa."
 cm__minimum_gold_name: "Reserva de oro"
 cm__minimum_gold_desc: "La reserva mínima de oro a mantener. Se aplica a todas las funciones de automatización, excepto a la Automatización Total."
 cm__minimum_gold_format: "[CMMV('cm__minimum_gold')]@gold!"
 cm__allowed_building_overbuild_levels_name: "Límite de sobreconstrucción"
 cm__allowed_building_overbuild_levels_desc: "Cuántos niveles de edificio totales puede superar una localización respecto a su límite de niveles de edificio soportados antes de que la expansión automática deje de poner en cola nuevas construcciones allí. En cero, no permitirá ninguna sobreconstrucción. Con más de 200, no hay límite."

 ## Priority List Group
 cm__settings__priority_list_name: "Automatización de la construcción"
 cm__settings__priority_list_desc: "Arrastra para reordenar la prioridad de las funciones. Cada mes, las funciones habilitadas se ejecutan de arriba a abajo, excepto Auto-urbanizar, que siempre se ejecuta en último lugar, después de cualquier otra función y de la Automatización completa."
 cm__priority_list_item_column_name: "Característica"
 cm__priority_list_i1_name: "Expansión automática de edificios"
 cm__priority_list_i1_desc: "Expande automáticamente los edificios de producción y no producción de varios niveles cuando sean rentables, haya población disponible y el oro se mantenga por encima de tu Reserva de oro. Se aplica donde la autoexpansión esté activada para una localización o para un tipo de edificio completo, incluyendo edificios extranjeros en localizaciones de otros países."
 cm__priority_list_i2_name: "Autoexpandir RGOs"
 cm__priority_list_i2_desc: "Expande automáticamente los niveles de RGO en las localizaciones donde la expansión automática de RGO esté activada, siempre que haya trabajadores disponibles y los recursos lo permitan."
 cm__priority_list_i3_name: "Construcción automática"
 cm__priority_list_i3_desc: "Construye automáticamente edificios de la capital y edificios únicos por localización (concejos, bibliotecas, etc.) en el orden y con los ajustes configurados en la pestaña de Construcción automática."
 cm__priority_list_i4_name: "Autoalimentos"
 cm__priority_list_i4_desc: "Construye automáticamente RGO y edificios de producción de alimentos en localizaciones rurales, eligiendo la opción más eficiente en alimentos. Se configura en la pestaña de Autoalimentos."
 cm__priority_list_i5_name: "Auto-urbanizar"
 cm__priority_list_i5_desc: "Mejora los rangos de las localizaciones cada mes: de asentamientos rurales a villas, de villas a ciudades y de ciudades a megalópolis. Omite las localizaciones conquistadas. Se configura en la pestaña de Urbanización Automática."
 cm__priority_list_i6_name: "Mejorar automáticamente todos los edificios"
 cm__priority_list_i6_desc: "Mejora automáticamente todos los edificios que hayan quedado obsoletos, independientemente de si la expansión automática está habilitada para dicho edificio."
 cm__priority_list__enabled_name: "Activado"
 cm__priority_list__enabled_desc: "Activa o desactiva esta función."
 cm__priority_list__min_profit_name: "Ingresos fiscales mín."
 cm__priority_list__min_profit_desc: "Oro mensual mínimo por nivel requerido antes de que la construcción se ponga en cola. Establézcalo en 0 para desactivar la comprobación."
 cm__priority_list__min_profit_postfix: "@gold!"
 cm__priority_list__min_discount_name: "Descuento mín."
 cm__priority_list__min_discount_desc: "Margen de sobreprecio máximo permitido para los materiales de construcción. Al -33%, solo construye cuando los materiales cuestan un 33% menos que el precio base. Al 0%, solo al precio base o inferior. Al +33%, construye incluso cuando los precios están un 33% por encima del precio base."
 cm__priority_list__min_discount_postfix: "%"
 cm__priority_list__min_discount_prefix_high: "#R "
 cm__priority_list__min_discount_postfix_high: "%#!"
 cm__priority_list__min_discount_prefix_low: "#G "
 cm__priority_list__min_discount_postfix_low: "%#!"

