 cm__expand_metric_option_1_desc: "Añade un nuevo nivel solo cuando su ingreso fiscal mensual sea al menos tu Ingreso Fiscal Mínimo establecido."
 cm__expand_metric_option_2_name: "@wealth! Beneficio"
