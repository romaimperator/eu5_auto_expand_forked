l_spanish:
 # Mod
 cm_name: "Gestor de construcción"
 cm_desc: "Un mod de calidad de vida masivo que añade nuevas funciones de automatización, filtros y modos de mapa para mejorar enormemente la experiencia de construcción en EU5."

 # Settings (settings) Tab
 cm__settings_name: "Ajustes"
 ## Global Control (settings) Group
 cm__pause_auto_expand_name: "Pausar automatización"
 cm__pause_auto_expand_desc: "Pausa todas las funciones de automatización: expansión automática de edificios, expansión automática de RGO, mejora de todos los edificios, construcción automática, comida automática y urbanización automática."
 cm__minimum_gold_name: "Reserva de oro"
 cm__minimum_gold_desc: "La reserva mínima de oro a mantener. No se pondrán construcciones en cola si el tesoro quedara por debajo de esta cantidad. Se aplica a todas las funciones de automatización, excepto a las mejoras de urbanización automática (que tienen su propio ajuste de oro)."
 cm__minimum_gold_format: "[CMMV('cm__minimum_gold')]@gold!"
 cm__allowed_building_overbuild_levels_name: "Límite de sobreconstrucción"
 cm__allowed_building_overbuild_levels_desc: "Cuántos niveles totales de edificio puede superar una ubicación su límite de Niveles de Edificio Soportados antes de que la expansión automática deje de poner en cola nuevas construcciones allí. Con un valor de cero, no se permitirá ninguna sobreconstrucción."

 ## Priority List Group
 cm__settings__priority_list_name: "Automatización de la construcción"
 cm__settings__priority_list_desc: "Arrastra para reordenar la prioridad de las funciones. Cada mes, las funciones habilitadas se ejecutan de arriba abajo. Para la autoexpansión, el valor junto a cada función indica cuán buena debe ser una expansión antes de ser construida, según la métrica elegida en Métrica de autoexpansión: un mínimo de oro mensual por nivel para Ingresos fiscales y Beneficios, o un número máximo de años para recuperar el coste de construcción para el ROI (0 = desactivado). Descuento mín. establece el recargo máximo permitido en el precio de los materiales de construcción (-33% = solo cuando sean baratos, 0 = al precio base, +33% = incluso si están inflados)."
 cm__priority_list_item_column_name: "Característica"
 cm__priority_list_i1_name: "Expansión automática de edificios"
 cm__priority_list_i1_desc: "Expande automáticamente edificios de producción y no producción de varios niveles cuando sea rentable, haya población disponible y el oro se mantenga por encima de tu Reserva de Oro. Solo se aplica en localizaciones donde la expansión automática esté activada."
 cm__priority_list_i2_name: "Autoexpandir RGOs"
 cm__priority_list_i2_desc: "Expande automáticamente los niveles de RGO en las localizaciones donde la expansión automática de RGO esté activada, siempre que haya trabajadores disponibles y los recursos lo permitan."
 cm__priority_list_i3_name: "Automejorar todos los edificios"
 cm__priority_list_i3_desc: "Mejora automáticamente todos los edificios que hayan quedado obsoletos, independientemente de si la expansión automática está activada para ese edificio."
 cm__priority_list_i4_name: "Construcción automática"
 cm__priority_list_i4_desc: "Construye automáticamente edificios de uno por ubicación (consejos, bibliotecas, etc.) según el orden y los ajustes configurados en la pestaña de Construcción automática."
 cm__priority_list_i5_name: "Auto-Alimentación"
 cm__priority_list_i5_desc: "Construye automáticamente edificios y RGO de producción de comida en ubicaciones rurales, eligiendo la opción con la mayor producción marginal de comida. Se configura en la pestaña de Auto-Comida."
 cm__priority_list_i6_name: "Auto-urbanizar"
 cm__priority_list_i6_desc: "Promueve el rango de las localizaciones cada mes: de asentamientos rurales a villas, y de villas a ciudades. El paso de rural a villa requiere 30.000 de población (elegible para ciudad de inmediato) o estar a menos de 1.000 del límite de población (de lo contrario, el crecimiento se estancaría en el límite rural). Omite las localizaciones no integradas. Se configura en la pestaña de Autourbanización."
 cm__priority_list_i7_name: "Autoconstruir edificios de la capital"
 cm__priority_list_i7_desc: "Construye automáticamente edificios exclusivos de la capital (corte real, tribunal supremo, academia de guerra, etc.) en la localización de tu capital cuando las condiciones lo permitan."
 cm__priority_list__enabled_name: "Activado"
 cm__priority_list__enabled_desc: "Activa o desactiva esta función. Las funciones desactivadas se omiten cada mes."
 cm__priority_list__min_profit_name: "Ingresos fiscales mín."
 cm__priority_list__min_profit_desc: "Oro mensual mínimo por nivel requerido antes de que la construcción se ponga en cola. Establézcalo en 0 para desactivar la comprobación."
 cm__priority_list__min_profit_postfix: "@gold!"
 cm__priority_list__min_discount_name: "Descuento mín."
 cm__priority_list__min_discount_desc: "Margen de sobreprecio máximo permitido para los materiales de construcción. Al -33%, solo construye cuando los materiales cuestan un 33% menos que el precio base. Al 0%, solo al precio base o inferior. Al +33%, construye incluso cuando los precios están un 33% por encima del precio base."
 cm__priority_list__min_discount_postfix: "%"
 cm__priority_list__min_discount_prefix_high: "#R "
 cm__priority_list__min_discount_postfix_high: "%#!"
 cm__priority_list__min_discount_prefix_low: "#G "
 cm__priority_list__min_discount_postfix_low: "%#!"

