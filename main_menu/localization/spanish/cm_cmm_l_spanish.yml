 cm__placement_finder_roads_option_1_name: "$cm_txt_current$"
 cm__placement_finder_roads_option_1_desc: "Usa los caminos que realmente has construido."
 cm__placement_finder_roads_option_2_name: "Caminos máximos"
 cm__placement_finder_roads_option_2_desc: "Supone que la mejor carretera que has desbloqueado está construida en cada conexión."
 cm__placement_finder_roads_option_3_name: "$cm_txt_best_possible$"
 cm__placement_finder_roads_option_3_desc: "Se asume que la mejor carretera que hayas desbloqueado está construida en cada conexión, y que cada edificio desbloqueado que mejore la proximidad terrestre está construido donde sea posible."
 cm__placement_finder_naval_name: "Infraestructura naval"
 cm__placement_finder_naval_desc: "Si los modos de mapa de Gobernador recomendado y Capital recomendada asumen una infraestructura naval ideal o utilizan tu capacidad portuaria y presencia naval actuales."
 cm__placement_finder_naval_option_1_name: "$cm_txt_current$"
 cm__placement_finder_naval_option_1_desc: "Utiliza tu capacidad portuaria y presencia naval actuales."
 cm__placement_finder_naval_option_2_name: "Presencia máxima"
 cm__placement_finder_naval_option_2_desc: "Asume una presencia naval total en todas partes, con tu capacidad portuaria actual."
 cm__placement_finder_naval_option_3_name: "$cm_txt_best_possible$"
 cm__placement_finder_naval_option_3_desc: "Asume una presencia naval completa y los mejores edificios portuarios que hayas desbloqueado, construidos en cada ubicación costera."
 cm__placement_finder_accuracy_name: "Precisión de búsqueda"
 cm__placement_finder_accuracy_desc: "Qué tan minuciosamente los modos de mapa de Gobernador recomendado y Capital recomendada buscan las mejores ubicaciones. Las ubicaciones omitidas se muestran en negro."
 cm__placement_finder_accuracy_option_1_name: "Exhaustivo"
 cm__placement_finder_accuracy_option_1_desc: "Evaluar cada localización. La más precisa y la más lenta."
 cm__placement_finder_accuracy_option_2_name: "Exhaustivo"
 cm__placement_finder_accuracy_option_2_desc: "Omitir las ubicaciones que no puedan clasificarse entre las tres mejores. Las tres mejores y sus puntuaciones son idénticas a las de Exhaustivo, solo que más rápido."
 cm__placement_finder_accuracy_option_3_name: "Equilibrado"
 cm__placement_finder_accuracy_option_3_desc: "Omitir las ubicaciones que no puedan ser la mejor. La mejor ubicación sigue estando garantizada como exacta; el segundo y tercer marcador pueden diferir ocasionalmente."
 cm__placement_finder_accuracy_option_4_name: "Rápido"
 cm__placement_finder_accuracy_option_4_desc: "También omite las localizaciones con muy pocas probabilidades de ser las mejores. La mejor localización encontrada está dentro del 20% de la mejor real y normalmente sigue siendo exacta."
 cm__placement_finder_accuracy_option_5_name: "Más rápido"
 cm__placement_finder_accuracy_option_5_desc: "Evalúa la ubicación más prometedora de cada provincia y luego refina en torno a las principales. Mucho más rápido para países grandes; puede pasar por alto la mejor ubicación."
 cm__debug_name: "$cm_txt_debug$"
 cm__debug__logging_name: "Registro de acciones"
 cm__debug__logging_desc: "Qué acciones de este mod se registran en el registro de acciones del mod."
 cm__log_cycle_name: "Ciclo de construcción"
 cm__log_cycle_desc: "Líneas para un ciclo mensual que se omitió porque el anterior todavía se estaba agotando, y para el reinicio que sigue a dos omisiones consecutivas."
 cm__log_food_name: "$cm__ab_food_name$"
 cm__log_food_desc: "Líneas para la categoría de Alimentos: oferta, demanda y ratio mensual de alimentos de cada mercado, la mediana anual con la que se juzga dicho ratio frente al objetivo, el recuento de ubicaciones que ya producen alimentos allí, y cada ubicación que habilita o deshabilita."
 cm__log_roads_name: "$cm__ab_roads_name$"
 cm__log_roads_desc: "Una línea por cada carretera que solicite la categoría Carreteras, indicando la ubicación, por cuál de los tres motivos se compró y su coste."
 cm__log_cleanup_name: "$cm__cleanup_name$"
 cm__log_cleanup_desc: "Líneas para la fase de limpieza anual de edificios y para cada edificio que cierre, reduzca, destruya o reabra, con el beneficio de cada uno y el umbral mínimo con el que se comparó."
 cm__log_governors_name: "$cm__ab_governors_name$"
 cm__log_governors_desc: "Líneas para el plan del gobernador: emplazamientos elegidos y descartados, mejoras de villas y ciudades, posicionamientos, reubicaciones y rechazos, además del traslado de capital de una nación afortunada."
 cm__log_military_name: "$cm_txt_lucky_nation_military$"
 cm__log_military_desc: "Líneas para una nación afortunada destruyendo fuertes y construyendo edificios de reserva militar."
 cm__log_government_name: "Gobierno de nación afortunada"
 cm__log_government_desc: "Líneas para una nación afortunada al eliminar una burocracia o realizar una acción de estamento."
 cm__debug__diagnostics_name: "Diagnósticos"
 cm__placement_finder_debug_path_name: "Activar diagnósticos de depuración"
 cm__placement_finder_debug_path_desc: "Añade un bloque de diagnóstico a las descripciones emergentes de los modos de mapa Gobernador recomendado y Capital recomendada: la ruta prevista desde tu capital a cada ubicación con el coste de cada salto, y la proximidad prevista comparada con tu proximidad real."
 cm__debug__probes_name: "Sondas"
 cm__debug__probes_desc: "Diagnósticos puntuales escritos en el registro de acciones del mod."
 cm__probe_budget_name: "Presupuesto de autoconstrucción"
 cm__probe_budget_desc: "El balance de cada categoría de construcción automática, positivo si está reservando oro para una opción que aún no puede costear y negativo si debe por exceso de gasto; luego el oro que ninguna categoría gastó el mes pasado, el límite de amortización de producción y el mejor candidato esperando en un mercado que este ciclo ha omitido."
 cm__probe_budget_text: "$cm_txt_run$"
 cm__probe_governors_name: "Plan del gobernador"
 cm__probe_governors_desc: "En qué punto se encuentra el plan del gobernador: su fase, cuántos emplazamientos posee y le quedan por colocar, si está reteniendo el tesoro, los gobernadores pagados y los huecos y asientos con los que está trabajando."
 cm__probe_governors_text: "$cm_txt_run$"
 cm__probe_military_name: "$cm_txt_lucky_nation_military$"
 cm__probe_military_desc: "El nivel de edificio de reserva militar en el que se encuentra el país, si puede construirlo, el estado del par de capitales, el presupuesto militar y cuántas localizaciones pueden admitir el nivel frente a cuántas ya lo tienen."
 cm__probe_military_text: "$cm_txt_run$"
 cm__probe_roads_name: "$cm__ab_roads_name$"
 cm__probe_roads_desc: "Cuántos corredores mantiene el plan de carreteras para proximidad, acceso al mercado y conexión con la capital; cuántos de la capital pueden iniciarse ya, cuántas carreteras se están construyendo, cuántas están bloqueadas por un mercado con escasez de bienes de construcción y qué queda en la reserva de la categoría."
 cm__probe_roads_text: "$cm_txt_run$"
 cm__probe_log_gate_name: "Umbral del registro de acciones"
 cm__probe_log_gate_desc: "La categoría del registro de Bienes Básicos aparece dos veces, según la lee el filtro del registro y según la almacena el menú, por lo que se muestra una categoría que esté activada en uno y desactivada en el otro."
