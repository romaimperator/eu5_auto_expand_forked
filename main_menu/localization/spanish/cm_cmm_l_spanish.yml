 cm__urbanize_town_to_city_desc: "Promocionar las villas que cumplan los requisitos a ciudades cada mes."
 cm__urbanize_rural_to_town_name: "Rural a Urbano"
 cm__urbanize_rural_to_town_desc: "Promociona los asentamientos rurales aptos a villas cada mes. Requiere 30 000 de población (elegible para ciudad de inmediato) o estar a menos de 1000 del límite de población (de lo contrario, el crecimiento se detendría en el límite rural). Se omitirán las localizaciones cuyo RGO esté marcado en la siguiente lista de exclusión. También se omitirán las localizaciones cubiertas por Autoalimento Masivo, para que sigan siendo rurales y continúen produciendo alimentos."
