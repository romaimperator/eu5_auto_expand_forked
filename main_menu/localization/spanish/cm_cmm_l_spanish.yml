 cm__dbg_run_food_name: "Ejecutar alimentos"
 cm__dbg_run_food_desc: "$cm_txt_dbg_run_category_desc$" # NO-TRANSLATE
 cm__dbg_run_food_text: "$cm_txt_run_now$" # NO-TRANSLATE
 cm__ab_production__ab_production_name: "$cm__ab_production_name$" # NO-TRANSLATE
 cm__ab_production_algorithm_name: "Estrategia de construcción"
 cm__ab_production_algorithm_desc: "Cómo la producción elige qué construir."
 cm__ab_production_algorithm_option_1_name: "Codicioso"
 cm__ab_production_algorithm_option_1_desc: "Construye primero las opciones de amortización más rápida, y solo aquellas cercanas al mejor lugar encontrado para producir los mismos bienes."
 cm__ab_production_max_rel_roi_name: "Máximo ROI relativo"
 cm__ab_production_max_rel_roi_desc: "Determina cuánto más lento, en comparación con el mejor lugar encontrado para producir los mismos bienes, puede un edificio o mejora amortizar su coste y aun así ser construido. Al 30%, si el mejor amortiza en 10 años, solo se construirán los que amortizan en 13 años; cualquier opción más lenta esperará. Al 0%, solo se construye el mejor productor de cada bien cada mes. Al 100%+ no hay límite y solo se aplica el Máximo de años de amortización. Todos los edificios que producen los mismos bienes se evalúan en conjunto, sea cual sea su tipo. Las expansiones de RGO siempre se construyen por orden de amortización."
 cm__ab_production_max_rel_roi_format: "[CMMV('cm__ab_production_max_rel_roi')]%[Select_CString(GreaterThanOrEqualTo_CFixedPoint(CMMV('cm__ab_production_max_rel_roi'), CMMMapValue('cmm_max', 'cm__ab_production_max_rel_roi')), '+', '')]" # NO-TRANSLATE
 cm__ab_production_min_roi_name: "Años máximos de amortización"
 cm__ab_production_min_roi_desc: "Solo se consideran las construcciones cuyos ingresos fiscales amorticen el coste de construcción en este número de años. Establécelo en 0 para desactivar la comprobación."
 cm__ab_production_min_roi_format: "[CMMV('cm__ab_production_min_roi')]y @efficiency!" # NO-TRANSLATE
 cm__ab_production_min_discount_name: "$cm_txt_min_discount$" # NO-TRANSLATE
 cm__ab_production_min_discount_desc: "$cm_txt_min_discount_desc$" # NO-TRANSLATE
 cm__ab_production_min_discount_format: "[CMMV('cm__ab_production_min_discount')]%" # NO-TRANSLATE
 cm__ab_production__debug_name: "$cm_txt_debug$" # NO-TRANSLATE
 cm__dbg_run_production_name: "Ejecutar producción"
 cm__dbg_run_production_desc: "$cm_txt_dbg_run_category_desc$" # NO-TRANSLATE
 cm__dbg_run_production_text: "$cm_txt_run_now$" # NO-TRANSLATE
 cm__ab_roads__ab_roads_name: "$cm__ab_roads_name$" # NO-TRANSLATE
 cm__ab_roads_proximity_name: "$cm_txt_proximity$" # NO-TRANSLATE
 cm__ab_roads_proximity_desc: "Construye los tramos de carretera que más aumenten la Proximidad por cada ducado, contando cada localización situada más adelante en la ruta tras ellos."
 cm__ab_roads_market_access_name: "Acceso al mercado"
 cm__ab_roads_market_access_desc: "Construye los tramos de carretera que más aumenten el acceso al mercado por cada moneda de oro. Solo gasta en meses en los que Proximidad no haya construido nada y no esté ahorrando para un tramo que aún no pueda costear."
 cm__ab_roads_capital_name: "Conexión con la capital"
 cm__ab_roads_capital_desc: "Tiende tramos de carretera para conectar tus localizaciones con tu capital, trabajando hacia afuera desde las que ya están conectadas. Solo gasta en meses en los que tanto Proximidad como Acceso al mercado no hayan construido nada y ninguno esté ahorrando para un tramo que aún no se puedan permitir."
 cm__ab_roads_min_discount_name: "$cm_txt_min_discount$" # NO-TRANSLATE
 cm__ab_roads_min_discount_desc: "Margen de precio máximo permitido para materiales de construcción. Con un -33 %, solo inicia un tramo cuando la madera, la mampostería y la arena que necesita cuestan un 33 % por debajo del precio base. Con un 0 %, solo al precio base o inferior. Con un +33 %, lo inicia incluso cuando los precios están un 33 % por encima del precio base."
 cm__ab_roads_min_discount_format: "[CMMV('cm__ab_roads_min_discount')]%" # NO-TRANSLATE
 cm__ab_roads_run_now_name: "Forzar replanificación de caminos"
 cm__ab_roads_run_now_desc: "Determina qué tramos de carretera volver a tender ahora, en lugar de esperar al siguiente ciclo de planificación. En multijugador, esta es la única forma de calcularlos. No construye carreteras por sí mismo; los tramos identificados se construyen a medida que el presupuesto de carreteras los cubra."
 cm__ab_roads_run_now_text: "$cm_txt_run_now$" # NO-TRANSLATE
 cm__ab_roads__debug_name: "$cm_txt_debug$" # NO-TRANSLATE
 cm__dbg_run_roads_name: "Ejecutar Caminos"
 cm__dbg_run_roads_desc: "Ordena tramos de carretera del plan actual ahora mismo, por sí solo, en lugar de esperar al cambio de mes. Gasta lo que queda de su asignación, por lo que una categoría que ya haya gastado su parte del mes no construye nada. Pausar automatización no lo detiene."
 cm__dbg_run_roads_text: "$cm_txt_run_now$" # NO-TRANSLATE
 cm__ab_governors__ab_governors_name: "$cm__ab_governors_name$" # NO-TRANSLATE
 cm__ab_gov_move_seats_name: "Permitir mover gobernadores"
 cm__ab_gov_move_seats_desc: "Cuando todos los espacios para gobernadores estén llenos, retira a un gobernador y asigna uno en una ubicación mejor en su lugar. La ubicación mejor debe ser ya una ciudad o tener una puntuación más de un 10 % superior a la del que reemplaza. Con esto desactivado, los gobernadores solo ocuparán espacios que estén vacíos."
 cm__ab_gov_prepare_sites_name: "Permitir preparar nuevas localizaciones"
 cm__ab_gov_prepare_sites_desc: "Considera las localizaciones que aún no pueden albergar un gobernador y prepáralas primero, fundando un pueblo o ciudad allí y construyendo un camino hacia tu capital. Con esto desactivado, solo se tendrán en cuenta las localizaciones que ya sean una ciudad y tengan un camino hasta tu capital."
 cm__ab_governors__debug_name: "$cm_txt_debug$" # NO-TRANSLATE
 cm__dbg_run_governors_name: "Iniciar plan del gobernador"
 cm__dbg_run_governors_desc: "Inicia un nuevo plan ahora en lugar de en su turno habitual de veinticinco años. El plan progresará a través de sus etapas durante los meses siguientes como de costumbre. Aún requiere paz, una capital y que no haya ninguna otra búsqueda en curso."
 cm__dbg_run_governors_text: "Iniciar"
 cm__urbanization_name: "Urbanización"
 cm__auto_urbanize_enabled_name: "$cm_txt_enabled$" # NO-TRANSLATE
 cm__auto_urbanize_enabled_desc: "Activar o desactivar la urbanización automática."
 cm__auto_urbanize_min_discount_name: "$cm_txt_min_discount$" # NO-TRANSLATE
 cm__auto_urbanize_min_discount_desc: "Margen de precio máximo permitido para los materiales de construcción. Con un -33%, solo funda pueblos y ciudades cuando los materiales cuestan un 33% por debajo del precio base. Con un 0%, solo al precio base o menos. Con un +33%, los funda incluso cuando los precios están un 33% por encima de la base."
 cm__auto_urbanize_min_discount_format: "[CMMV('cm__auto_urbanize_min_discount')]%" # NO-TRANSLATE
 cm__auto_urbanize__debug_name: "$cm_txt_debug$" # NO-TRANSLATE
 cm__dbg_run_auto_urbanize_name: "Ejecutar urbanización automática"
 cm__dbg_run_auto_urbanize_desc: "Ejecuta las mejoras de rango de forma independiente ahora, en lugar de esperar al cambio de mes. Nada más se construye en el ciclo que inicia, y Pausar automatización no lo detiene."
 cm__dbg_run_auto_urbanize_text: "$cm_txt_run_now$" # NO-TRANSLATE
 cm__auto_town_rights__auto_town_rights_specialization_name: "Otorgante del derecho de especialización inteligente"
 cm__auto_town_rights__auto_town_rights_specialization_desc: "Otorgado después de que el Otorgador de derechos personalizados haya tenido su turno."
 cm__auto_grant_specialization_name: "Otorgar automáticamente derechos urbanos de especialización"
 cm__auto_grant_specialization_desc: "Otorga un derecho de especialización por localización, eligiendo el de mayor valor en oro de entre los que se ajusten a los bienes producidos a su alrededor."
 cm__specialization_window_name: "Umbral de ajuste"
 cm__specialization_window_desc: "Qué tan bien debe adecuarse un derecho de especialización a una localización, en relación con el derecho mejor adaptado allí, para entrar en consideración. Al 50 %, cualquier derecho que se adecue al menos la mitad de bien entra en consideración y se otorga el que más oro valga. Al 100 %, solo se otorga el derecho mejor adaptado."
 cm__specialization_window_format: "[CMMV('cm__specialization_window')]%" # NO-TRANSLATE
 cm__specialization_expand_name: "Expandir las industrias potenciadas"
 cm__specialization_expand_desc: "Cuando se concede un derecho de especialización, activar también la expansión automática en esa localización para las industrias que el derecho potencia y para sus materias primas donde la localización las produzca. Igual que al hacer clic derecho en un botón de concesión en el mapa de Derechos Urbanos Recomendados."
 cm__auto_town_rights__debug_name: "$cm_txt_debug$" # NO-TRANSLATE
 cm__dbg_run_town_rights_name: "Ejecutar concesión automática de derechos urbanos"
 cm__dbg_run_town_rights_desc: "Se otorga ahora en lugar de esperar al cambio de mes, procesando primero la lista de activados y luego los derechos de especialización. Pausar automatización no lo detiene."
 cm__dbg_run_town_rights_text: "$cm_txt_run_now$" # NO-TRANSLATE
 cm__miscellaneous_name: "Miscelánea"
 cm__cleanup_name: "Limpieza de edificios"
 cm__cleanup__cleanup_name: "$cm__cleanup_name$" # NO-TRANSLATE
 cm__cleanup_close_open_name: "Cerrar y abrir edificios"
 cm__cleanup_close_open_desc: "Una vez al año, cierra los edificios de producción que hayan dejado de generar beneficios y no estén subvencionados. Los edificios cerrados se vuelven a abrir una vez que ese tipo de edificio vuelva a ser rentable en ese mercado. @farming_village! [ShowBuildingTypeNameWithNoTooltip('farming_village')] y @market_village! [ShowBuildingTypeNameWithNoTooltip('market_village')] nunca se cierran."
 cm__cleanup_destroy_name: "Destruir edificios"
 cm__cleanup_destroy_desc: "Una vez al año, destruye los edificios de producción que hayan dejado de ser rentables cuando la localización esté a menos de diez niveles de los niveles de edificio que soporta, junto con los ya cerrados cuya localización se haya quedado sin espacio desde entonces. Un @market_village! [ShowBuildingTypeNameWithNoTooltip('market_village')] se reduce a un solo nivel en su lugar. @fruit_orchard! [ShowBuildingTypeNameWithNoTooltip('fruit_orchard')] se destruye y nunca se vuelve a construir sin importar lo que gane, y @farming_village! [ShowBuildingTypeNameWithNoTooltip('farming_village')] nunca se destruye."
 cm__cleanup_min_profit_name: "Beneficio mínimo por nivel"
 cm__cleanup_min_profit_desc: "Un edificio que genere menos que esto por nivel al mes se considera que no es rentable y será cerrado o destruido, a menos que esté subvencionado."
 cm__cleanup_min_profit_format: "[Divide_CFixedPoint(CMMV('cm__cleanup_min_profit'), '(CFixedPoint)100')|2]@gold!" # NO-TRANSLATE
 cm__cleanup_max_changed_name: "Máximo cambiado por pasada"
 cm__cleanup_max_changed_desc: "La proporción de edificios de un tipo en un mercado que puede cambiar en un ciclo anual. Al 50 %, la mitad de sus edificios abiertos pueden cerrarse o destruirse, y la mitad de los cerrados pueden reabrirse. Nunca menos de uno, de modo que el último edificio de un tipo aún pueda cerrarse."
 cm__cleanup_max_changed_format: "[CMMV('cm__cleanup_max_changed')]%" # NO-TRANSLATE
 cm__cleanup_core_goods_name: "Priorizar materiales de construcción"
 cm__cleanup_core_goods_desc: "Mantener los edificios que consuman principalmente @masonry![ShowGoodsNameWithNoTooltip('masonry')], @lumber![ShowGoodsNameWithNoTooltip('lumber')], @sand![ShowGoodsNameWithNoTooltip('sand')] o @glass![ShowGoodsNameWithNoTooltip('glass')] al doble del Beneficio Mínimo por Nivel, o 0,1@gold! por nivel, lo que sea mayor. Los edificios que produzcan uno de los cuatro nunca se cerrarán ni destruirán mientras esto esté activado."
 cm__cleanup_auto_food_name: "Limpiar ubicaciones de comida automática"
 cm__cleanup_auto_food_desc: "Donde la gestión automática de alimentos esté activa y cualquier tipo de trabajador ya escasee, destruye los edificios de producción que no produzcan alimentos. Un @market_village! [ShowBuildingTypeNameWithNoTooltip('market_village')] se reduce a un nivel en lugar de ser destruido."
 cm__cleanup_run_now_name: "Ejecutar limpieza de edificios"
 cm__cleanup_run_now_desc: "Ejecutar la limpieza ahora en lugar de esperar al pase anual."
 cm__cleanup_run_now_text: "$cm_txt_run_now$" # NO-TRANSLATE
 cm__placement_finder_method_option_3_name: "Población"
 cm__placement_finder_method_option_3_desc: "Clasificar según cuánta proximidad añadiría un gobernador o capital situados allí, contando cada ubicación por la gente que vive en ella. Una ganancia pequeña sobre una población grande vale menos que una ganancia grande sobre una pequeña."
 cm__log_production_name: "$cm__ab_production_name$" # NO-TRANSLATE
 cm__log_production_desc: "Líneas para cada edificio que la categoría de Producción pone en cola y cada expansión de materias primas que considera, con el tiempo de amortización y los ingresos de cada uno."
 cm__log_core_name: "$cm__ab_core_name$" # NO-TRANSLATE
 cm__log_core_desc: "Líneas que siguen a una localización a través de un ciclo de Bienes Esenciales: el déficit del mercado y los niveles solicitados, luego lo que se le dio a esa localización, su puntuación y lo construido. Marca la localización primero con el comando de consola effect location:<key> = { cm_ab_core_watch_on = yes }."
 cm__debug__rotation_name: "Rotación del mercado"
 cm__debug__rotation_desc: "Un país grande gestiona sus mercados de pocos en pocos, y cada automatización construye en el conjunto en el que se encuentra."
 cm__dbg_rotate_slice_name: "Rotar mercados"
 cm__dbg_rotate_slice_desc: "Pasa al siguiente conjunto de mercados. Una ejecución iniciada desde uno de los botones de Ejecutar ahora permanece en el conjunto que encuentra, por lo que esto es lo que permite avanzar mientras el juego está en pausa."
 cm__dbg_rotate_slice_text: "Rotar"
 cm__probe_production_anchors_name: "Anclajes de producción"
 cm__probe_production_anchors_desc: "Una línea por bien con el mejor retorno registrado por Producción y el límite de retorno establecido, indicando el edificio y la ubicación de cada uno."
 cm__probe_production_anchors_text: "$cm_txt_run$" # NO-TRANSLATE
 cm__probe_production_rgo_name: "Producción de materias primas"
 cm__probe_production_rgo_desc: "Una línea por cada razón por la que la Producción omitió las materias primas de una localización, o una sola línea si no se omitió ninguna. Lee la capital a menos que marques una localización con el comando de consola effect location:<key> = { cm_ab_core_watch_on = yes }."
 cm__probe_production_rgo_text: "$cm_txt_run$" # NO-TRANSLATE
 cm__probe_core_name: "$cm__ab_core_name$" # NO-TRANSLATE
 cm__probe_core_desc: "Cada cifra que Bienes Básicos lee en una localización, junto a la propia lectura del juego, y lo que el mercado de dicha localización podría absorber en un ciclo. Lee la capital a menos que marques una localización con el comando de consola effect location:<key> = { cm_ab_core_watch_on = yes }; la capital nunca es candidata para Bienes Básicos, así que marca una localización para ver los datos de una en la que se construiría."
 cm__probe_core_text: "$cm_txt_run$" # NO-TRANSLATE
 cm__probe_setup_name: "$cm_txt_setup_data$" # NO-TRANSLATE
 cm__probe_setup_desc: "Qué datos de mapa contiene la partida guardada y la versión en la que se procesó cada uno, así como si esta máquina tiene permiso para procesar alguno de ellos. Una versión 0 significa que ese dato aún no se ha procesado y se hará en la siguiente carga."
 cm__probe_setup_text: "$cm_txt_run$" # NO-TRANSLATE
 cm__debug__setup_name: "$cm_txt_setup_data$" # NO-TRANSLATE
 cm__debug__setup_desc: "Los datos del mapa que el mod calcula una vez y luego lee durante el resto de la partida."
 cm__dbg_rebuild_setup_name: "Reconstruir datos de configuración"
 cm__dbg_rebuild_setup_desc: "Vuelve a procesar los datos del mapa: las materias primas tras los filtros de bonificación de O.R.R., la cobertura industrial tras Derechos urbanos recomendados, las puntuaciones tras $mapmode_cm_location_food_potential_name$, los cruces de ríos por los que trazan rutas los buscadores de ubicación y qué edificios mejoran a cuáles. Tarda unos segundos y el juego sigue funcionando mientras lo hace."
 cm__dbg_rebuild_setup_text: "Reconstruir"
