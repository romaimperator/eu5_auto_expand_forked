 cm__dbg_run_auto_build_name: "Ejecutar autoconstrucción"
 cm__dbg_run_auto_build_desc: "Procesa ahora cada categoría habilitada de la lista, en lugar de esperar al cambio de mes. Cada una gasta lo que queda de su asignación, por lo que una categoría que ya haya gastado su cuota mensual no construirá nada. Pausar automatización no detiene este proceso."
 cm__dbg_run_auto_build_text: "$cm_txt_run_now$" # NO-TRANSLATE
 cm__ab_custom__ab_custom_name: "$cm__ab_custom_name$" # NO-TRANSLATE
 cm__ab_custom__ab_custom_desc: "Los conjuntos se procesan de arriba abajo cada mes, por lo que los que están más arriba consumen el oro primero."
 cm__ab_custom_item_column_name: "Edificios"
 cm__ab_custom_i1_name: "Edificios de la capital"
 cm__ab_custom_i1_desc: "Construye los edificios exclusivos de la capital en tu capital: la corte real, el tribunal supremo, la academia de guerra y los demás. Se construirán antes que cualquier otra cosa que construya esta categoría."
 cm__ab_custom_i2_name: "Edificios de control"
 cm__ab_custom_i2_desc: "Construye alguaciles donde las materias primas se vendan por más, y cualquier edificio único de tu país que aumente el Control en las localizaciones más ricas. Una localización recibe todos los edificios únicos que pueda albergar antes de pasar a la siguiente localización."
 cm__ab_custom_i3_name: "Edificios de centros de mercado"
 cm__ab_custom_i3_desc: "Construye los edificios que resulten rentables en un centro de mercado, en todos los centros de mercado que poseas."
 cm__ab_custom_i4_name: "Seleccionar edificios"
 cm__ab_custom_i4_desc: "Construye los edificios enumerados a continuación."
 cm__ab_custom__enabled_name: "$cm_txt_enabled$" # NO-TRANSLATE
 cm__ab_custom__enabled_desc: "Construir este conjunto."
 cm__ab_custom__auto_build_list_name: "$cm__ab_custom_i4_name$" # NO-TRANSLATE
 cm__ab_custom__auto_build_list_desc: "Arrastra para reordenar. Los edificios se gestionan de arriba abajo cada mes, por lo que los que estén más arriba recibirán el oro primero."
