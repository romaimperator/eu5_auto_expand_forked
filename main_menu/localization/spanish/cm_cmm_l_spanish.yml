 cm__ab_core__ab_core_desc: "Ajustes de bienes básicos. Los materiales se procesan de arriba abajo en la lista, ampliando los RGO antes que los edificios de producción."
 cm__ab_core_target_name: "Precio objetivo"
 cm__ab_core_target_desc: "El precio al que se detiene la construcción de un material, en relación con su precio base. Con un -33%, se construyen productores hasta que el material cotiza un 33% por debajo del precio base. Con un 0%, hasta que alcanza el precio base. Con un +33%, solo mientras cueste más de un 33% por encima del precio base."
 cm__ab_core_target_format: "[CMMV('cm__ab_core_target')]%" # NO-TRANSLATE
 cm__ab_core_item_column_name: "Material"
 cm__ab_core_i1_name: "@masonry! [ShowGoodsName('masonry')]" # NO-TRANSLATE
 cm__ab_core_i2_name: "@lumber! [ShowGoodsName('lumber')]" # NO-TRANSLATE
 cm__ab_core_i3_name: "@sand! [ShowGoodsName('sand')]" # NO-TRANSLATE
 cm__ab_core_i4_name: "@glass! [ShowGoodsName('glass')]" # NO-TRANSLATE
 cm__ab_core__enabled_name: "$cm_txt_enabled$" # NO-TRANSLATE
 cm__ab_core__enabled_desc: "Trabajar para reducir el precio de este material."
 cm__ab_core__debug_name: "$cm_txt_debug$" # NO-TRANSLATE
 cm__dbg_run_core_name: "Ejecutar bienes básicos"
 cm__dbg_run_core_desc: "$cm_txt_dbg_run_category_desc$" # NO-TRANSLATE
 cm__dbg_run_core_text: "$cm_txt_run_now$" # NO-TRANSLATE
 cm__ab_food__ab_food_name: "$cm__ab_food_name$" # NO-TRANSLATE
 cm__ab_food_target_name: "Objetivo de excedente"
 cm__ab_food_target_desc: "Un mercado obtiene más emplazamientos de comida hasta que su oferta alcanza esta proporción de su demanda. Al 125%, la comida se expande en cualquier mercado cuyo mes mediano del año no haya alcanzado un excedente del 25%. Auméntalo para mantener un mayor margen de reserva, redúcelo para ayudar solo a los mercados más cercanos a la escasez."
 cm__ab_food_target_format: "[CMMV('cm__ab_food_target')]%" # NO-TRANSLATE
 cm__ab_food_min_potential_name: "Potencial de alimentos mínimo"
 cm__ab_food_min_potential_desc: "La producción automática de alimentos solo se activa en las localizaciones cuyo potencial de alimentos por nivel de RGO alcanza esta puntuación, la misma que muestra el modo de mapa $mapmode_cm_location_food_potential_name$. Auméntala para esperar a mejores tierras de cultivo o redúcela para aceptar tierras menos fértiles."
 cm__ab_food_min_potential_format: "[CMMV('cm__ab_food_min_potential')]" # NO-TRANSLATE
 cm__ab_food_subsidize_name: "Subvencionar edificios de alimentos"
 cm__ab_food_subsidize_desc: "Subvenciona los edificios de producción de alimentos que construye la gestión automática. Un edificio que no genera beneficios no contrata a nadie ni produce alimentos, por lo que una aldea agrícola en tierras pobres queda inactiva; subvencionarlo permite mantener el personal y asegurar la cosecha. Las subvenciones nunca se desactivan."
 cm__ab_food_run_now_name: "Forzar replanificación de alimentos"
 cm__ab_food_run_now_desc: "Volver a seleccionar las localizaciones de alimentos ahora, basándose en el balance de alimentos de este mes junto con los meses ya muestreados, en lugar de esperar a la comprobación anual."
 cm__ab_food_run_now_text: "$cm_txt_run_now$" # NO-TRANSLATE
