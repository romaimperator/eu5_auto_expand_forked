l_spanish:
 mapmode_cm_breadbasket_name: "Graneros"
 MAPMODE_CM_BREADBASKET: "#T $mapmode_cm_breadbasket_name$#!\nResalta tus [locations|e] donde la comida automática está configurada actualmente para funcionar."
 MAPMODE_CM_BREADBASKET_TT_ENABLED: "[ROOT.GetLocation.GetName] se ha configurado para la gestión automática de comida."
 MAPMODE_CM_BREADBASKET_TT_OWNED: "[ROOT.GetLocation.GetName] es tuyo, pero no tiene activada la comida automática."
 MAPMODE_CM_BREADBASKET_TT_FOREIGN: "[ROOT.GetLocation.GetName] no es tuyo."
 MAPMODE_CM_BREADBASKET_TT_UNCOLONIZED: "[ROOT.GetLocation.GetName] está sin colonizar."
 MAPMODE_CM_BREADBASKET_TT_WATER: "[ROOT.GetLocation.GetName] es una zona marítima."

 cm_breadbasket_enabled_legend_key: "Auto-comida activada"
 cm_breadbasket_owned_legend_key: "Tus otras ubicaciones"
 cm_breadbasket_foreign_legend_key: "Ubicaciones extranjeras"
 cm_breadbasket_uncolonized_legend_key: "No colonizado"

 mapmode_cm_location_food_potential_name: "Potencial de alimento por nivel de RGO"
 MAPMODE_CM_LOCATION_FOOD_POTENTIAL: "#T $mapmode_cm_location_food_potential_name$#!\nEsto colorea [locations|e] según su potencial alimentario natural por nivel de [rgo|e]. La puntuación combina el valor [rgo|e] [food|e], el [food_productivity|e] acumulativo (terreno, vegetación, clima, modificadores estáticos con nombre como el Mercado de arenques de Escania o el Delta del Nilo fértil, modificadores de producción específicos de [rgo|e], etc.), el acceso al agua y las bonificaciones máximas asumidas de [ShowBuildingTypeName('windmill')], [ShowBuildingTypeName('farming_village')] y [ShowBuildingTypeName('irrigation_systems')] donde el [rgo|e] lo permita.\n\n[development|e] se excluye, por lo que la puntuación muestra el potencial del terreno en lugar de la producción actual."
 mapmode_cm_location_food_potential_hidden_name: "$mapmode_cm_location_food_potential_name$"
 MAPMODE_CM_LOCATION_FOOD_POTENTIAL_HIDDEN: "$MAPMODE_CM_LOCATION_FOOD_POTENTIAL$"
 MAPMODE_CM_LOCATION_FOOD_POTENTIAL_TT_LAND: "[ROOT.GetLocation.GetName] tiene un potencial de alimentos por nivel de [rgo|e] de [ROOT.GetLocation.MakeScope.ScriptValue('cm_location_food_potential')|1Y]."
 MAPMODE_CM_LOCATION_FOOD_POTENTIAL_TT_WATER: "[ROOT.GetLocation.GetName] no es tierra, por lo que no tiene potencial de alimentos."

 cm_location_food_potential_auto_food_legend_key: "Auto-alimento activado (rayado)"
 cm_location_food_potential_bright_green_legend_key: "45 (máximo posible)"
 cm_location_food_potential_green_legend_key: "27.5 (excelente)"
 cm_location_food_potential_yellow_legend_key: "20 (bueno)"
 cm_location_food_potential_orange_legend_key: "12.5 (decente)"
 cm_location_food_potential_red_legend_key: "3.75 (bajo)"
 cm_location_food_potential_black_legend_key: "0 (ninguno)"
