 MAPMODE_CM_GOVERNOR_FINDER_TT_ZERO: "Ya tienes un alto [proximity|e] en todos los lugares a los que un gobernador aquí podría llegar, por lo que aportaría poco."
 MAPMODE_CM_GOVERNOR_FINDER_TT_NO_DATA: "Aún no se ha puntuado. Usa el botón de actualización de la barra de acciones para calcular las puntuaciones de las fronteras actuales."
 MAPMODE_CM_GOVERNOR_FINDER_TT_SKIPPED: "No evaluado: el ajuste de Precisión de búsqueda ha omitido esta localización. Establécelo en Exhaustivo y actualiza para evaluar cada localización."
 MAPMODE_CM_GOVERNOR_FINDER_TT_SKIPPED_DEBUG: "$MAPMODE_CM_GOVERNOR_FINDER_TT_SKIPPED$$CM_PF_DEBUG_BLOCK$"
 MAPMODE_CM_GOVERNOR_FINDER_TT_INELIGIBLE: "Sin evaluar: no se puede colocar ningún gobernador aquí ([ROOT.GetLocation.Custom('cm_pf_inelig_reason')])."
 cm_pf_inelig_reason_route: "sin conexión terrestre con tu capital y no es costera"
 cm_pf_inelig_reason_blocked: "[ShowBuildingTypeNameWithNoTooltip('seljuk_mint')] bloquea [ShowBuildingTypeNameWithNoTooltip('local_governor')], y [ShowBuildingTypeNameWithNoTooltip('naval_governor')] necesita una ubicación sin conexión por tierra con tu capital"
 MAPMODE_CM_GOVERNOR_FINDER_TT_INELIGIBLE_DEBUG: "$MAPMODE_CM_GOVERNOR_FINDER_TT_INELIGIBLE$$CM_PF_DEBUG_BLOCK$"
 MAPMODE_CM_GOVERNOR_FINDER_TT_FOREIGN: "No forma parte de tu país."
 MAPMODE_CM_GOVERNOR_FINDER_TT_WATER: "Esta es una localización marítima; las puntuaciones de colocación se aplican a tus propias tierras."

 # Shared status line appended to the scored tooltip: rank 2/3 or a displayed local maximum.
