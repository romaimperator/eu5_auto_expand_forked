 mapmode_cm_capital_finder_name: "Ubicación recomendada de la capital"
 MAPMODE_CM_CAPITAL_FINDER: "#T $mapmode_cm_capital_finder_name$#!\nColorea tus [locations|e] según lo bien que un [capital|e] allí propagaría [proximity|e]. Se ignoran los gobernadores existentes. Las ubicaciones rayadas ya cuentan con una fuente de proximidad, como la capital actual o un gobernador.\nEsto es una estimación: el ajuste Puntuación del buscador de ubicación elige si las ubicaciones se clasifican por base impositiva o por [proximity|e] bruto, y los ajustes de Infraestructura terrestre e Infraestructura naval eligen las carreteras, edificios y [maritime_presence|e] que asume. Se recalcula al abrir este modo de mapa, como máximo una vez cada 4 años; usa el botón de actualización de la barra de acciones para forzar un nuevo cálculo. Los colores se actualizan cuando termina."
 MAPMODE_CM_CAPITAL_FINDER_TT_SCORED: "[proximity|e] promedio máx. previsto con capital: [ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_cf_avg_value')|1]%\nBase impositiva máx. prevista de [proximity|e]: +[ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_cf_taxgain_value')|1]\nPuntuación: [ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_cf_pct_value')|0]% de tu mejor localización[ROOT.GetLocation.Custom('cm_pf_cf_status')]"
 MAPMODE_CM_CAPITAL_FINDER_TT_BEST: "Promedio máx. previsto de [proximity|e] con la capital: [ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_cf_avg_value')|1]%\nBase impositiva máx. prevista de [proximity|e]: +[ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_cf_taxgain_value')|1]\nTu mejor localización"
 MAPMODE_CM_CAPITAL_FINDER_TT_SCORED_DEBUG: "$MAPMODE_CM_CAPITAL_FINDER_TT_SCORED$$CM_PF_DEBUG_BLOCK$"
 MAPMODE_CM_CAPITAL_FINDER_TT_BEST_DEBUG: "$MAPMODE_CM_CAPITAL_FINDER_TT_BEST$$CM_PF_DEBUG_BLOCK$"
 MAPMODE_CM_CAPITAL_FINDER_TT_SOURCE: "$MAPMODE_CM_CAPITAL_FINDER_TT_SCORED$\nFuente de proximidad existente: [ROOT.GetLocation.GetModifierValueFixed('local_proximity_source')|0]"
 MAPMODE_CM_CAPITAL_FINDER_TT_SOURCE_DEBUG: "$MAPMODE_CM_CAPITAL_FINDER_TT_SOURCE$$CM_PF_DEBUG_BLOCK$"
 MAPMODE_CM_CAPITAL_FINDER_TT_NO_DATA: "Aún sin puntuar. Usa el botón de actualizar de la barra de acciones para calcular las puntuaciones de las fronteras actuales."
 MAPMODE_CM_CAPITAL_FINDER_TT_SKIPPED: "No evaluado: el ajuste de Precisión de búsqueda omitió esta ubicación. Establécelo en Exhaustivo y actualiza para evaluar todas las ubicaciones."
 MAPMODE_CM_CAPITAL_FINDER_TT_SKIPPED_DEBUG: "$MAPMODE_CM_CAPITAL_FINDER_TT_SKIPPED$$CM_PF_DEBUG_BLOCK$"
 MAPMODE_CM_CAPITAL_FINDER_TT_FOREIGN: "No forma parte de tu país."
 MAPMODE_CM_CAPITAL_FINDER_TT_WATER: "Esta es una ubicación de agua; las puntuaciones de la capital se aplican a tus propias tierras."

 mapmode_cm_capital_finder_hidden_name: "$mapmode_cm_capital_finder_name$"
 MAPMODE_CM_CAPITAL_FINDER_HIDDEN: "$MAPMODE_CM_CAPITAL_FINDER$"

 cm_pf_cap_source_legend_key: "Fuente de proximidad existente (rayada)"

 # Action bar refresh button
 cm_pf_refresh: "cm_pf_refresh"
 cm_pf_refresh_color: "turquesa oscuro"
 cm_pf_refresh_icon: "@cm_pf_refresh!"
 cm_pf_refresh_name: "Recalcular puntuaciones de colocación"
 cm_pf_refresh_tooltip: "Fuerza un nuevo cálculo de las puntuaciones de ubicación de gobernadores y capitales para las fronteras actuales. De lo contrario, las puntuaciones se reutilizarán durante un máximo de 4 años."
