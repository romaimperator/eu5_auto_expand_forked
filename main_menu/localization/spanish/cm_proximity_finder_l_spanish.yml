l_spanish:
 mapmode_cm_governor_finder_name: "Colocación recomendada del gobernador"
 MAPMODE_CM_GOVERNOR_FINDER: "#T $mapmode_cm_governor_finder_name$#!\nColorea tus [locations|e] según cuánto [proximity|e] añadiría un nuevo Gobernador Local o Gobernador Naval construido allí, dada la proximidad que ya proporcionan tu [capital|e] y las fuentes existentes. Cuanto más verde, mejor. Tu capital y las fuentes de proximidad existentes están rayadas.\nEsto es una estimación: el ajuste de Puntuación del Buscador de Ubicaciones elige si las ubicaciones se clasifican por base impositiva o por [proximity|e] bruto, y los ajustes de Infraestructura Terrestre e Infraestructura Naval eligen los caminos, edificios y [maritime_presence|e] que asume. Se recalcula al abrir este modo de mapa, como máximo una vez cada 4 años; usa el botón de actualizar de la barra de acciones para forzar un nuevo cálculo. Los colores se actualizan cuando termina."
 MAPMODE_CM_GOVERNOR_FINDER_TT_SCORED: "Ganancia media máxima prevista de [proximity|e]: +[ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_gf_avg_value')|1]%\nBase impositiva máxima prevista obtenida de [proximity|e]: +[ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_gf_taxgain_value')|1]\nPuntuación: [ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_gf_pct_value')|0]% de tu mejor ubicación[ROOT.GetLocation.Custom('cm_pf_gf_status')]"
 MAPMODE_CM_GOVERNOR_FINDER_TT_BEST: "Ganancia media máxima prevista de [proximity|e]: +[ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_gf_avg_value')|1]%\nBase impositiva máxima prevista obtenida de [proximity|e]: +[ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_gf_taxgain_value')|1]\nTu mejor ubicación"
 MAPMODE_CM_GOVERNOR_FINDER_TT_SCORED_DEBUG: "$MAPMODE_CM_GOVERNOR_FINDER_TT_SCORED$$CM_PF_DEBUG_BLOCK$"
 MAPMODE_CM_GOVERNOR_FINDER_TT_BEST_DEBUG: "$MAPMODE_CM_GOVERNOR_FINDER_TT_BEST$$CM_PF_DEBUG_BLOCK$"
 MAPMODE_CM_GOVERNOR_FINDER_TT_CAPITAL: "Tu [capital|e] ya extiende [proximity|e] desde aquí."
 MAPMODE_CM_GOVERNOR_FINDER_TT_CAPITAL_DEBUG: "$MAPMODE_CM_GOVERNOR_FINDER_TT_CAPITAL$$CM_PF_DEBUG_BLOCK$"
 MAPMODE_CM_GOVERNOR_FINDER_TT_SOURCE: "Fuente de [proximity|e] existente: [ROOT.GetLocation.GetModifierValueFixed('local_proximity_source')|0]\n$MAPMODE_CM_GOVERNOR_FINDER_TT_SCORED$"
 MAPMODE_CM_GOVERNOR_FINDER_TT_SOURCE_DEBUG: "$MAPMODE_CM_GOVERNOR_FINDER_TT_SOURCE$$CM_PF_DEBUG_BLOCK$"
 MAPMODE_CM_GOVERNOR_FINDER_TT_SOURCE_NOGAIN: "Fuente de [proximity|e] existente: [ROOT.GetLocation.GetModifierValueFixed('local_proximity_source')|0]\n$MAPMODE_CM_GOVERNOR_FINDER_TT_NOGAIN$"
 MAPMODE_CM_GOVERNOR_FINDER_TT_SOURCE_NOGAIN_DEBUG: "$MAPMODE_CM_GOVERNOR_FINDER_TT_SOURCE_NOGAIN$$CM_PF_DEBUG_BLOCK$"
 MAPMODE_CM_GOVERNOR_FINDER_TT_NOGAIN: "Un gobernador proporciona como máximo 80 [proximity|e], y esta localización [ROOT.GetLocation.Custom('cm_pf_nogain_basis')], por lo que un gobernador construido aquí no añadiría nada."
 MAPMODE_CM_GOVERNOR_FINDER_TT_NOGAIN_DEBUG: "$MAPMODE_CM_GOVERNOR_FINDER_TT_NOGAIN$$CM_PF_DEBUG_BLOCK$"
 cm_pf_nogain_basis_current: "ya tiene al menos esa cantidad"
 cm_pf_nogain_basis_assumed: "ya tendría al menos esa cantidad bajo la infraestructura asumida"
 CM_PF_DEBUG_BLOCK: "[ROOT.GetLocation.Custom('cm_pf_debug_block')]"
 cm_pf_debug_block_text: "\n--debug--\n[ROOT.GetLocation.Custom('cm_pf_pred_label')]: [ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_pred_value')|0]%\nActual [proximity|e]: [ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_current_proximity')|0]%[ROOT.GetLocation.Custom('cm_pf_path_block')]"
 cm_pf_pred_label_max: "[proximity|e] máximo previsto desde la capital"
 cm_pf_pred_label_current: "[proximity|e] actual proyectado desde la capital"
 cm_pf_blank: ""
