l_english:
 # Alternate names for the priority list's threshold column. cm_apply_expand_metric_bounds
 # points the column at one of these sets when the metric changes.
 cm__priority_list__min_profit_profit_name: "Min Profit"
 cm__priority_list__min_profit_roi_name: "Max ROI Years"
 cm__priority_list__min_profit_roi_desc: "Maximum years allowed to recoup the build cost. Set to 0 to disable the check."

 # Automation panel
 CM_AUTOMATION_TOGGLE: "Toggle auto-expand on or off"
 CM_AUTOMATION_TOGGLE_SMART_AUTOMATIONS: "Toggle Smart Automations on or off"
 CM_AUTOMATION_TOGGLE_CLEANUP: "Toggle the Building Cleaner on or off"
 AUTOMATED_SYSTEM_EXPANDBUILDINGS_CLICK:0 "Open Construction Manager Settings"
 AUTOMATED_SYSTEM_EXPANDRGO_CLICK:0 "Open Construction Manager Settings"
 AUTOMATED_SYSTEM_BUILDINGS_CLICK:0 "Open Construction Manager Settings"
 AUTOMATED_SYSTEM_CLOSEBUILDINGS_CLICK:0 "Open Construction Manager Settings"
 AUTOMATED_SYSTEM_EXPANDBUILDINGS_DESC:0 "Construction Manager automatically expands the buildings you mark for auto-expansion. Set the limits and priority in the Construction Manager settings."
 AUTOMATED_SYSTEM_EXPANDRGO_DESC:0 "Construction Manager automatically expands the raw goods you mark for auto-expansion. Set the limits and priority in the Construction Manager settings."
 AUTOMATED_SYSTEM_BUILDINGS_DESC:0 "Construction Manager's Smart Automations builds for you out of a share of your treasury, covering industry, food, construction materials and infrastructure. Set the budget shares and priorities in the Construction Manager settings."
 AUTOMATED_SYSTEM_CLOSEBUILDINGS_DESC:0 "Construction Manager closes production buildings that have stopped making money, reopens them once their industry is earning again in that market, and destroys them where the location has run out of room."
 MINIMUM_GOLD_TT:0 "Smart Automations will not start new construction below this amount of [gold|e]."

