l_english:
 mapmode_cm_governor_finder_name: "Recommended Governor Placement"
 MAPMODE_CM_GOVERNOR_FINDER: "#T $mapmode_cm_governor_finder_name$#!\nColors your [locations|e] by how much [proximity|e] a new Local Governor or Naval Governor built there would add, given the proximity your [capital|e] and existing governors already provide. Greener is better.\nThis is an estimate: it assumes the best roads you have unlocked are built everywhere and full [maritime_presence|e] at sea. It recalculates when you open this map mode, at most once every 4 years; use the action bar refresh button to force a fresh calculation. The colors refresh when it finishes."
 MAPMODE_CM_GOVERNOR_FINDER_TT_SCORED: "Predicted max average [proximity|e] gain: +[ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_gf_avg_value')|1]%\nMax predicted tax base gained from [proximity|e]: +[ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_gf_taxgain_value')|1]\nScore: [ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_gf_pct_value')|0]% of your best location[ROOT.GetLocation.Custom('cm_pf_gf_status')]"
 MAPMODE_CM_GOVERNOR_FINDER_TT_BEST: "Predicted max average [proximity|e] gain: +[ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_gf_avg_value')|1]%\nMax predicted tax base gained from [proximity|e]: +[ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_gf_taxgain_value')|1]\nYour best location"
 MAPMODE_CM_GOVERNOR_FINDER_TT_SCORED_DEBUG: "$MAPMODE_CM_GOVERNOR_FINDER_TT_SCORED$$CM_PF_DEBUG_BLOCK$"
 MAPMODE_CM_GOVERNOR_FINDER_TT_BEST_DEBUG: "$MAPMODE_CM_GOVERNOR_FINDER_TT_BEST$$CM_PF_DEBUG_BLOCK$"
 CM_PF_DEBUG_BLOCK: "\n--debug--\n[ROOT.GetLocation.Custom('cm_pf_pred_label')]: [ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_pred_value')|0]%\nCurrent [proximity|e]: [ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_current_proximity')|0]%"
 cm_pf_pred_label_max: "Predicted max [proximity|e] from capital"
 cm_pf_pred_label_current: "Predicted current [proximity|e] from capital"
 MAPMODE_CM_GOVERNOR_FINDER_TT_ZERO: "You already have high [proximity|e] everywhere a governor here could reach, so it would add little."
 MAPMODE_CM_GOVERNOR_FINDER_TT_NO_DATA: "Not scored yet. Use the action bar refresh button to calculate scores for the current borders."
 MAPMODE_CM_GOVERNOR_FINDER_TT_FOREIGN: "Not part of your country."
 MAPMODE_CM_GOVERNOR_FINDER_TT_WATER: "This is a water location; placement scores apply to your own land."

 # Shared status line appended to the scored tooltip: rank 2/3 or a displayed local maximum.
 cm_pf_status_second: "\nYour 2nd best location"
 cm_pf_status_third: "\nYour 3rd best location"
 cm_pf_status_localmax: "\nLocal Maximum: Better than all surrounding locations"

 mapmode_cm_governor_finder_hidden_name: "$mapmode_cm_governor_finder_name$"
 MAPMODE_CM_GOVERNOR_FINDER_HIDDEN: "$MAPMODE_CM_GOVERNOR_FINDER$"

 cm_pf_first_legend_key: "1st"
 cm_pf_second_legend_key: "2nd"
 cm_pf_third_legend_key: "3rd"
 cm_pf_good_legend_key: "100% of Best"
 cm_pf_moderate_legend_key: "75% of Best"
 cm_pf_fair_legend_key: "50% of Best"
 cm_pf_poor_legend_key: "25% of Best"
 cm_pf_bad_legend_key: "0% of Best"
 cm_pf_localmax_legend_key: "Local maximum (striped)"
 cm_pf_not_scored_legend_key: "Not scored yet"

 mapmode_cm_capital_finder_name: "Recommended Capital Location"
 MAPMODE_CM_CAPITAL_FINDER: "#T $mapmode_cm_capital_finder_name$#!\nColors your [locations|e] by how well a [capital|e] there would spread [proximity|e]. Existing governors are ignored, since moving the capital reshapes proximity everywhere. Striped locations already hold a proximity source, such as the current capital or a governor.\nThis is an estimate: it assumes the best roads you have unlocked are built everywhere and full [maritime_presence|e] at sea. It recalculates when you open this map mode, at most once every 4 years; use the action bar refresh button to force a fresh calculation. The colors refresh when it finishes."
 MAPMODE_CM_CAPITAL_FINDER_TT_SCORED: "Predicted max average [proximity|e] with capital: [ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_cf_avg_value')|1]%\nMax predicted tax base from [proximity|e]: +[ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_cf_taxgain_value')|1]\nScore: [ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_cf_pct_value')|0]% of your best location[ROOT.GetLocation.Custom('cm_pf_cf_status')]"
 MAPMODE_CM_CAPITAL_FINDER_TT_BEST: "Predicted max average [proximity|e] with capital: [ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_cf_avg_value')|1]%\nMax predicted tax base from [proximity|e]: +[ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_cf_taxgain_value')|1]\nYour best location"
 MAPMODE_CM_CAPITAL_FINDER_TT_SCORED_DEBUG: "$MAPMODE_CM_CAPITAL_FINDER_TT_SCORED$$CM_PF_DEBUG_BLOCK$"
 MAPMODE_CM_CAPITAL_FINDER_TT_BEST_DEBUG: "$MAPMODE_CM_CAPITAL_FINDER_TT_BEST$$CM_PF_DEBUG_BLOCK$"
 MAPMODE_CM_CAPITAL_FINDER_TT_SOURCE: "$MAPMODE_CM_CAPITAL_FINDER_TT_SCORED$\nExisting proximity source: [ROOT.GetLocation.GetModifierValueFixed('local_proximity_source')|0]"
 MAPMODE_CM_CAPITAL_FINDER_TT_SOURCE_DEBUG: "$MAPMODE_CM_CAPITAL_FINDER_TT_SOURCE$$CM_PF_DEBUG_BLOCK$"
 MAPMODE_CM_CAPITAL_FINDER_TT_NO_DATA: "Not scored yet. Use the action bar refresh button to calculate scores for the current borders."
 MAPMODE_CM_CAPITAL_FINDER_TT_FOREIGN: "Not part of your country."
 MAPMODE_CM_CAPITAL_FINDER_TT_WATER: "This is a water location; capital scores apply to your own land."

 mapmode_cm_capital_finder_hidden_name: "$mapmode_cm_capital_finder_name$"
 MAPMODE_CM_CAPITAL_FINDER_HIDDEN: "$MAPMODE_CM_CAPITAL_FINDER$"

 cm_pf_cap_source_legend_key: "Existing proximity source (striped)"

 # Action bar refresh button
 cm_pf_refresh: "cm_pf_refresh"
 cm_pf_refresh_color: "dark_turquoise"
 cm_pf_refresh_icon: "@cm_pf_refresh!"
 cm_pf_refresh_name: "Recompute Placement Scores"
 cm_pf_refresh_tooltip: "Force a fresh calculation of the governor and capital placement scores for the current borders. Otherwise scores are reused for up to 4 years."
