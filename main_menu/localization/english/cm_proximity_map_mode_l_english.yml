l_english:
 mapmode_cm_location_proximity_modifier_name: "Proximity Efficiency Impact"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER: "#T $mapmode_cm_location_proximity_modifier_name$#!\nColors [locations|e] by their Proximity Efficiency Impact: the combined penalty their [topography|e] and [vegetation|e] impose on [proximity|e] (mountains, hills, plateau, wetlands, forest, jungle, etc.). Green means the terrain does not hinder proximity; red means it heavily does. Topography penalties are scaled by the owner's proximity impact bonuses, such as from capital terrain or advances; unowned locations show base terrain values."
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_LAND: "Proximity Efficiency Impact: [ROOT.GetLocation.MakeScope.ScriptValue('cm_location_proximity_modifier')|+=%]"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_LAND_HARBOR: "Proximity Efficiency Impact: [ROOT.GetLocation.MakeScope.ScriptValue('cm_location_proximity_modifier')|+=%]\nNatural Harbor Suitability: [ROOT.GetLocation.GetModifierValueFixed('natural_harbor_suitability')|0%]"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER: "[ROOT.GetLocation.GetName] is not land so it has no Proximity Efficiency Impact."

 cm_location_proximity_modifier_none_legend_key: "0% (no penalty)"
 cm_location_proximity_modifier_light_legend_key: "-25% (light)"
 cm_location_proximity_modifier_noticeable_legend_key: "-35% (noticeable)"
 cm_location_proximity_modifier_moderate_legend_key: "-50% (moderate)"
 cm_location_proximity_modifier_heavy_legend_key: "-65% (heavy)"
 cm_location_proximity_modifier_severe_legend_key: "-75% (severe)"
 cm_location_proximity_modifier_worst_legend_key: "-100% (worst)"
 cm_location_proximity_modifier_harbor_legend_key: "Natural Harbor Suitability (striped)"
