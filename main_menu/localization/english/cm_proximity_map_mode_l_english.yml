l_english:
 mapmode_cm_location_proximity_modifier_name: "Proximity Efficiency Impact"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER: "#T $mapmode_cm_location_proximity_modifier_name$#!\nColors [locations|e] by their $mapmode_cm_location_proximity_modifier_name$: the combined penalty their [topography|e] and [vegetation|e] impose on [proximity|e] (mountains, hills, plateau, wetlands, forest, jungle, etc.). Green means the terrain does not hinder proximity; red means it heavily does. Topography penalties are scaled by the owner's proximity impact bonuses, such as from capital terrain or advances; unowned locations show base terrain values. A [road|e] or [river|e] on a location cancels its [vegetation|e] penalty; the [topography|e] penalty always applies.\n\nWater shows the [maritime_presence|e] the selected [country|e] has there instead, from green at the lowest through light green to light blue at full. High presence reduces the [proximity|e] lost when crossing a [seazone|e]."
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_LAND_HARBOR: "$MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_LAND$\nNatural Harbor Suitability: [ROOT.GetLocation.GetModifierValueFixed('natural_harbor_suitability')|0%]"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER: "[ROOT.GetLocation.GetName] is not land so it has no $mapmode_cm_location_proximity_modifier_name$, and the selected [country|e] has no [maritime_presence|e] here."
 cm_location_proximity_modifier_none_legend_key: "0% (no penalty)"
 cm_location_proximity_modifier_light_legend_key: "-25% (light)"
 cm_location_proximity_modifier_noticeable_legend_key: "-35% (noticeable)"
 cm_location_proximity_modifier_moderate_legend_key: "-50% (moderate)"
 cm_location_proximity_modifier_heavy_legend_key: "-65% (heavy)"
 cm_location_proximity_modifier_severe_legend_key: "-75% (severe)"
 cm_location_proximity_modifier_worst_legend_key: "-100% (worst)"
 cm_location_proximity_modifier_harbor_legend_key: "Natural Harbor Suitability (striped)"
 cm_location_proximity_modifier_maritime_none_legend_key: "No Maritime Presence (open water)"
 cm_location_proximity_modifier_maritime_low_legend_key: "Low Maritime Presence"
 cm_location_proximity_modifier_maritime_half_legend_key: "50% Maritime Presence"
 cm_location_proximity_modifier_maritime_full_legend_key: "100% Maritime Presence"

 # NO-TRANSLATE BELOW - data functions and shared-key references only.
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_LAND: "$mapmode_cm_location_proximity_modifier_name$: [ROOT.GetLocation.MakeScope.ScriptValue('cm_location_proximity_modifier')|+=%]"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER_M0: "[maritime_presence|E]: 0-10%"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER_M10: "[maritime_presence|E]: 10-20%"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER_M20: "[maritime_presence|E]: 20-30%"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER_M30: "[maritime_presence|E]: 30-40%"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER_M40: "[maritime_presence|E]: 40-50%"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER_M50: "[maritime_presence|E]: 50-60%"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER_M60: "[maritime_presence|E]: 60-70%"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER_M70: "[maritime_presence|E]: 70-80%"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER_M80: "[maritime_presence|E]: 80-90%"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER_M90: "[maritime_presence|E]: 90-100%"
