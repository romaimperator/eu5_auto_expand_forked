 cm__auto_build_list_i24_name: "@granary! [ShowBuildingTypeName('granary')]"
 cm__auto_build_list__enabled_name: "Enabled"
 cm__auto_build_list__enabled_desc: "Build this building type."
 cm__auto_build_list__in_subjects_name: "Subjects"
 cm__auto_build_list__in_subjects_desc: "Also build this building type in your subjects' locations, at your expense."
 cm__auto_build_list__min_control_name: "Min Control"
 cm__auto_build_list__min_control_desc: "Minimum Control in a location before this building is built there."
 cm__auto_build_list__min_control_postfix: "%"
 cm__auto_build_list__min_discount_name: "Min Discount"
 cm__auto_build_list__min_discount_desc: "Maximum construction material price markup allowed. Negative values require a discount, positive values allow a premium."
 cm__auto_build_list__min_discount_postfix: "%"
 cm__auto_build_list__min_discount_prefix_high: "#R "
 cm__auto_build_list__min_discount_postfix_high: "%#!"
 cm__auto_build_list__min_discount_prefix_low: "#G "
 cm__auto_build_list__min_discount_postfix_low: "%#!"
 cm__auto_build_list__min_rgos_name: "Min RGOs"
 cm__auto_build_list__min_rgos_desc: "Minimum RGO levels in a location before this building is built there."
 ## Industry (ab_industry) Group
 cm__ab_industry__ab_industry_name: "Industry"
 cm__ab_industry__ab_industry_desc: "Settings for Industry."
 cm__ab_industry_algorithm_name: "Build Strategy"
 cm__ab_industry_algorithm_desc: "How industry picks what to construct."
 cm__ab_industry_algorithm_option_1_name: "Greedy"
 cm__ab_industry_algorithm_option_1_desc: "Build the fastest-payback options first, and only those close to the best place found to make the same goods."
 cm__ab_industry_max_rel_roi_name: "Max Relative ROI"
 cm__ab_industry_max_rel_roi_desc: "How much slower than the best place found to make the same goods a building or upgrade may repay its cost and still be built. At 30%, if the best repays in 10 years, only those repaying within 13 years are built; anything slower waits. At 0%, only the best producer of each goods is built each month. At 100%+ there is no limit and only Max Payback Years applies. Every building making the same goods is measured together, whatever kind it is. RGO expansions are always built in payback order."
 cm__ab_industry_max_rel_roi_format: "[CMMV('cm__ab_industry_max_rel_roi')]%[Select_CString(GreaterThanOrEqualTo_CFixedPoint(CMMV('cm__ab_industry_max_rel_roi'), CMMMapValue('cmm_max', 'cm__ab_industry_max_rel_roi')), '+', '')]"
 cm__ab_industry_min_roi_name: "Max Payback Years"
 cm__ab_industry_min_roi_desc: "Only constructions whose tax income repays the build cost within this many years are considered. Set to 0 to disable the check."
 cm__ab_industry_min_roi_format: "[CMMV('cm__ab_industry_min_roi')]y @efficiency!"
 ## Price Collapsar (ab_collapsar) Group
 cm__ab_collapsar__ab_collapsar_name: "Price Collapsar"
 cm__ab_collapsar__ab_collapsar_desc: "Settings for the Price Collapsar. Materials are worked from the top of the list down, with RGOs expanded before producer buildings."
 cm__ab_collapsar_target_name: "Price Target"
 cm__ab_collapsar_target_desc: "The price at which construction for a material stops, relative to its base price. At -33%, producers are built until the material trades 33% below base price. At 0%, until it reaches base price. At +33%, only while it costs more than 33% above base."
 cm__ab_collapsar_target_format: "[CMMV('cm__ab_collapsar_target')]%"
 cm__ab_collapsar_item_column_name: "Material"
 cm__ab_collapsar_i1_name: "@masonry! [ShowGoodsName('masonry')]"
 cm__ab_collapsar_i2_name: "@lumber! [ShowGoodsName('lumber')]"
 cm__ab_collapsar_i3_name: "@sand! [ShowGoodsName('sand')]"
 cm__ab_collapsar_i4_name: "@glass! [ShowGoodsName('glass')]"
 cm__ab_collapsar__enabled_name: "Enabled"
 cm__ab_collapsar__enabled_desc: "Work to lower this material's price."
 ## Food (ab_food) Group
 cm__ab_food__ab_food_name: "Food"
 cm__ab_food__ab_food_desc: "Settings for Food."
 cm__ab_food_target_name: "Surplus Target"
 cm__ab_food_target_desc: "A market gets more food locations until its supply reaches this share of its demand. At 125%, food is expanded in any market whose median month of the year did not reach a 25% surplus. Raise it to keep more of a buffer, lower it to only help markets closer to a shortage."
 cm__ab_food_target_format: "[CMMV('cm__ab_food_target')]%"
 cm__ab_food_min_potential_name: "Minimum Food Potential"
 cm__ab_food_min_potential_desc: "Auto-food is only enabled on locations whose food potential per RGO level reaches this score, the same score the $mapmode_cm_location_food_potential_name$ map mode shows. Raise it to hold out for better farmland, lower it to accept weaker land."
 cm__ab_food_min_potential_format: "[CMMV('cm__ab_food_min_potential')]"
 ## Roads (ab_roads) Group
 cm__ab_roads__ab_roads_name: "Roads"
 cm__ab_roads__ab_roads_desc: "Settings for Roads."
 cm__ab_roads_proximity_name: "Proximity"
 cm__ab_roads_proximity_desc: "Lay the road stretches that raise Proximity the most for the gold, counting every location further down the route behind them."
 cm__ab_roads_market_access_name: "Market Access"
 cm__ab_roads_market_access_desc: "Lay the road stretches that raise Market Access the most for the gold. Only spends in a month the Proximity stretches have none left to lay."
 cm__ab_roads_capital_name: "Capital Connection"
 cm__ab_roads_capital_desc: "Lay road stretches to connect your locations to your capital, working outwards from the ones already connected. Only spends in a month the Proximity and Market Access stretches have none left to lay."
 ## Governors (ab_governors) Group
 cm__ab_governors__ab_governors_name: "Governors"
 cm__ab_governors__ab_governors_desc: "Settings for Governors."
 cm__ab_gov_move_seats_name: "Allow Moving Governors"
 cm__ab_gov_move_seats_desc: "When every governor slot is full, take a governor down and put one up at a better location instead. The better location has to be a City already, or score more than 10% higher than the one it replaces. With this off, governors only go into slots that are empty."
 cm__ab_gov_prepare_sites_name: "Allow Preparing New Locations"
 cm__ab_gov_prepare_sites_desc: "Consider locations that cannot take a governor yet and get them ready first, founding a Town or City there and building a road to your capital. With this off, only locations that are already a City with a road to your capital are considered."

 # Urbanization (urbanization) Tab
 cm__urbanization_name: "Urbanization"

 # Auto-Urbanize (auto_urbanize) Tab
 cm__auto_urbanize_name: "Auto-Urbanize"
 ## Auto-Urbanize Settings (auto_urbanize) Group
 cm__auto_urbanize__auto_urbanize_name: "Auto-Urbanize Settings"
 cm__auto_urbanize__auto_urbanize_desc: "Choose which location rank changes run each month."
 cm__auto_urbanize_enabled_name: "Enabled"
 cm__auto_urbanize_enabled_desc: "Enable or disable auto-urbanize."
 cm__auto_urbanize_min_discount_name: "Min Discount"
 cm__auto_urbanize_min_discount_desc: "Maximum construction material price markup allowed. At -33%, only founds towns and cities when materials cost 33% below base price. At 0%, only at base price or below. At +33%, founds them even when prices are 33% above base."
 cm__auto_urbanize_min_discount_format: "[CMMV('cm__auto_urbanize_min_discount')]%"
 cm__urbanize_town_to_city_name: "Town to City"
 cm__urbanize_town_to_city_desc: "Upgrade qualifying towns to cities each month."
 cm__urbanize_rural_to_town_name: "Rural to Town"
 cm__urbanize_rural_to_town_desc: "Upgrade qualifying rural settlements to towns each month. Requires 30,000 pops or within 1,000 of pop cap. Locations whose RGO is checked in the Do Not Urbanize list below are skipped."
 cm__urbanize_city_to_megalopolis_name: "City to Megalopolis"
 cm__urbanize_city_to_megalopolis_desc: "Upgrade your capital to a megalopolis once it is a market-center city with at least 400,000 population."
 cm__megalopolis_ignore_capital_name: "Megalopolis: Ignore Capital Requirement"
 cm__megalopolis_ignore_capital_desc: "Lets you build the Found Megalopolis in a city that is not your capital."
 cm__megalopolis_ignore_market_center_name: "Megalopolis: Ignore Market Center Requirement"
 cm__megalopolis_ignore_market_center_desc: "Lets you build the Found Megalopolis in a city that is not a market center."
 cm__deurbanize_name: "De-Urbanize"
 cm__deurbanize_desc: "Each month, take owned locations back down to rural settlements when their RGO good is checked in the Do Not Urbanize list below. Your capital, conquered locations, and locations providing Proximity such as governor seats are left alone."
 ## Do Not Urbanize (Shows Owned) (auto_urbanize_ignore_list) Group
