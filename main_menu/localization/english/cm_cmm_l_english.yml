 # Miscellaneous (miscellaneous) Tab
 cm__miscellaneous_name: "Miscellaneous"
 cm__cleanup_name: "Building Cleanup"
 cm__map_modes_name: "Map Modes"
 ## Building Cleanup (cleanup) Group
 cm__cleanup__cleanup_name: "Building Cleanup"
 cm__cleanup_close_open_name: "Close and Open Buildings"
 cm__cleanup_close_open_desc: "Once a year, close production buildings that have stopped making money and are not subsidized. Buildings it closed reopen once the type is earning again in that market. @farming_village! [ShowBuildingTypeNameWithNoTooltip('farming_village')] and @market_village! [ShowBuildingTypeNameWithNoTooltip('market_village')] are never closed."
 cm__cleanup_destroy_name: "Destroy Buildings"
 cm__cleanup_destroy_desc: "Once a year, destroy production buildings that have stopped making money where the location is within ten levels of the building levels it supports, along with the ones already closed whose location has since run out of room. A @market_village! [ShowBuildingTypeNameWithNoTooltip('market_village')] is cut back to one level instead. @fruit_orchard! [ShowBuildingTypeNameWithNoTooltip('fruit_orchard')] is destroyed and never rebuilt whatever it earns, and @farming_village! [ShowBuildingTypeNameWithNoTooltip('farming_village')] is never destroyed."
 cm__cleanup_min_profit_name: "Minimum Profit per Level"
 cm__cleanup_min_profit_desc: "A building making less than this per level each month counts as not worth running, and is closed or destroyed unless it is subsidized."
 cm__cleanup_min_profit_format: "[Divide_CFixedPoint(CMMV('cm__cleanup_min_profit'), '(CFixedPoint)100')|2]@gold!"
 cm__cleanup_max_changed_name: "Max Changed per Pass"
 cm__cleanup_max_changed_desc: "The share of a building type's buildings in a market that can change in one yearly pass. At 50%, half of its open buildings can be closed or destroyed, and half of its closed ones reopened. Never fewer than one, so the last building of a type can still be closed."
 cm__cleanup_max_changed_format: "[CMMV('cm__cleanup_max_changed')]%"
 cm__cleanup_core_goods_name: "Prioritize Construction Materials"
 cm__cleanup_core_goods_desc: "Hold buildings that mostly consume @masonry![ShowGoodsNameWithNoTooltip('masonry')], @lumber![ShowGoodsNameWithNoTooltip('lumber')], @sand![ShowGoodsNameWithNoTooltip('sand')] or @glass![ShowGoodsNameWithNoTooltip('glass')] to twice the Minimum Profit per Level, or 0.1@gold! a level, whichever is higher. Buildings that produce one of the four are never closed or destroyed while this is on."
 cm__cleanup_auto_food_name: "Clear Auto-Food Locations"
 cm__cleanup_auto_food_desc: "Where auto-food is running and any kind of worker is already in short supply, destroy the production buildings that are not making food. A @market_village! [ShowBuildingTypeNameWithNoTooltip('market_village')] is cut back to one level rather than destroyed."
 cm__cleanup_run_now_name: "Run Building Cleanup"
 cm__cleanup_run_now_desc: "Run the cleanup now instead of waiting for the yearly pass."
 cm__cleanup_run_now_text: "Run Now"
 ## Recommended Capital & Governor Location (placement_finder) Group
 cm__map_modes__placement_finder_name: "Recommended Capital & Governor Location"
 cm__map_modes__placement_finder_desc: "Settings for the Recommended Governor and Recommended Capital placement map modes."
 cm__placement_finder_method_name: "Placement Finder Scoring"
 cm__placement_finder_method_desc: "How the Recommended Governor and Recommended Capital map modes rank your locations."
 cm__placement_finder_method_option_1_name: "Tax Base"
 cm__placement_finder_method_option_1_desc: "Rank by how much a governor or capital placed there would raise your total tax base. Wealthier locations count for more."
 cm__placement_finder_method_option_2_name: "Proximity"
 cm__placement_finder_method_option_2_desc: "Rank by how much proximity a governor or capital placed there would add."
 cm__placement_finder_method_option_3_name: "Population"
 cm__placement_finder_method_option_3_desc: "Rank by how much proximity a governor or capital placed there would add, counting each location by the people living in it. A small gain over a large population is worth less than a large gain over a small one."
 cm__placement_finder_roads_name: "Land Infrastructure"
 cm__placement_finder_roads_desc: "Whether the Recommended Governor and Recommended Capital map modes assume ideal land infrastructure or use what you have actually built."
 cm__placement_finder_roads_option_1_name: "Current"
 cm__placement_finder_roads_option_1_desc: "Use the roads you have actually built."
 cm__placement_finder_roads_option_2_name: "Max Roads"
 cm__placement_finder_roads_option_2_desc: "Assume the best road you have unlocked is built on every connection."
 cm__placement_finder_roads_option_3_name: "Best Possible"
 cm__placement_finder_roads_option_3_desc: "Assume the best road you have unlocked is built on every connection, and every unlocked building that improves land proximity is built wherever eligible."
 cm__placement_finder_naval_name: "Naval Infrastructure"
 cm__placement_finder_naval_desc: "Whether the Recommended Governor and Recommended Capital map modes assume ideal naval infrastructure or use your current harbor capacity and naval presence."
 cm__placement_finder_naval_option_1_name: "Current"
 cm__placement_finder_naval_option_1_desc: "Use your current harbor capacity and naval presence."
 cm__placement_finder_naval_option_2_name: "Max Presence"
 cm__placement_finder_naval_option_2_desc: "Assume full naval presence everywhere, with your current harbor capacity."
 cm__placement_finder_naval_option_3_name: "Best Possible"
 cm__placement_finder_naval_option_3_desc: "Assume full naval presence and the best harbor buildings you have unlocked, built in every coastal location."
 cm__placement_finder_accuracy_name: "Search Accuracy"
 cm__placement_finder_accuracy_desc: "How thoroughly the Recommended Governor and Recommended Capital map modes search for the best locations. Skipped locations show as black."
 cm__placement_finder_accuracy_option_1_name: "Exhaustive"
 cm__placement_finder_accuracy_option_1_desc: "Evaluate every location. The most accurate and the slowest."
 cm__placement_finder_accuracy_option_2_name: "Thorough"
 cm__placement_finder_accuracy_option_2_desc: "Skip locations that cannot rank among your top three. The top three and their scores are identical to Exhaustive, just faster."
 cm__placement_finder_accuracy_option_3_name: "Balanced"
 cm__placement_finder_accuracy_option_3_desc: "Skip locations that cannot be the single best. The best location is still guaranteed exact; the 2nd and 3rd markers can occasionally differ."
 cm__placement_finder_accuracy_option_4_name: "Quick"
 cm__placement_finder_accuracy_option_4_desc: "Also skip locations very unlikely to be the best. The best location found is within 20% of the true best and usually still exact."
 cm__placement_finder_accuracy_option_5_name: "Fastest"
 cm__placement_finder_accuracy_option_5_desc: "Evaluate the most promising location of each province, then refine around the leaders. Much faster for large countries; can miss the best location."

 # Debug (debug) Tab
 cm__debug_name: "Debug"
 ## Action Log (logging) Group
 cm__debug__logging_name: "Action Log"
 cm__debug__logging_desc: "Which of this mod's actions are written to the mod action log."
 cm__log_cycle_name: "Construction Cycle"
 cm__log_cycle_desc: "Lines for a monthly cycle that was skipped because the previous one was still draining, and for the reset that follows two skips in a row."
 cm__log_production_name: "Production"
 cm__log_production_desc: "Lines for every building the Production category queues and every raw goods expansion it considers, with the payback and income behind each."
 cm__log_core_name: "Core Goods"
 cm__log_core_desc: "Lines following one location through a Core Goods cycle: the market's shortfall and the levels it asked for, then what that location was given, scored and built. Mark the location first with the console command effect location:<key> = { cm_ab_core_watch_on = yes }."
 cm__log_food_name: "Food"
 cm__log_food_desc: "Lines for the Food category: each market's monthly food supply, demand and ratio, the yearly median that ratio is judged on against the target, the count of locations already growing food there, and every location it enables or disables."
 cm__log_roads_name: "Roads"
 cm__log_roads_desc: "One line for every road the Roads category orders, naming the location, which of the three things the road was bought for, and what it cost."
 cm__log_cleanup_name: "Building Cleanup"
 cm__log_cleanup_desc: "Lines for the yearly Building Cleanup pass and for every building it closes, trims, destroys or reopens, with the profit behind each and the floor it was judged against."
 cm__log_governors_name: "Governors"
 cm__log_governors_desc: "Lines for the governor plan: sites picked and dropped, town and city upgrades, placements, relocations and refusals, plus a lucky nation's capital move."
 cm__log_military_name: "Lucky Nation Military"
 cm__log_military_desc: "Lines for a lucky nation destroying forts and building manpower buildings."
 cm__log_government_name: "Lucky Nation Government"
 cm__log_government_desc: "Lines for a lucky nation removing a bureaucracy or taking an estate action."
 ## Diagnostics (diagnostics) Group
 cm__debug__diagnostics_name: "Diagnostics"
 cm__placement_finder_debug_path_name: "Enable Debug Diagnostics"
 cm__placement_finder_debug_path_desc: "Adds a diagnostic block to the Recommended Governor and Recommended Capital map mode tooltips: the predicted route from your capital to each location with the cost of each jump, and the predicted proximity compared against your actual proximity."
 ## Market Rotation (rotation) Group
 cm__debug__rotation_name: "Market Rotation"
 cm__debug__rotation_desc: "A large country works through its markets a few at a time, and every automation builds in the set it is on."
 cm__dbg_rotate_slice_name: "Rotate Markets"
 cm__dbg_rotate_slice_desc: "Moves on to the next set of markets. A run started from one of the Run Now buttons stays on the set it finds, so this is what moves it along while the game is paused."
 cm__dbg_rotate_slice_text: "Rotate"
 ## Probes (probes) Group
 cm__debug__probes_name: "Probes"
 cm__debug__probes_desc: "One-off diagnostics written to the mod action log."
 cm__probe_budget_name: "Auto-Build Budget"
 cm__probe_budget_desc: "Each Auto-Build category's balance, positive where it is holding gold back for a pick it cannot yet afford and negative where it owes from overspending, then the gold no category would spend last month, the Production payback limit, and the best candidate waiting in a market this cycle passed over."
 cm__probe_budget_text: "Run"
 cm__probe_governors_name: "Governor Plan"
 cm__probe_governors_desc: "Where the governor plan has got to: its phase, how many sites it holds and has still to place, whether it is holding the treasury, the governors paid for, and the slots and seats it is working against."
 cm__probe_governors_text: "Run"
 cm__probe_military_name: "Lucky Nation Military"
 cm__probe_military_desc: "The manpower building tier the country is on, whether it can build it, the state of the capital pair, the Military budget, and how many locations can take the tier against how many already have it."
 cm__probe_military_text: "Run"
 cm__probe_production_anchors_name: "Production Anchors"
 cm__probe_production_anchors_desc: "One line per good with the best payback Production has recorded for it and the payback limit that sets, naming the building and location behind each."
 cm__probe_production_anchors_text: "Run"
 cm__probe_production_rgo_name: "Production Raw Goods"
 cm__probe_production_rgo_desc: "One line for every reason Production passed over a location's raw goods, or a single line when it passed over none. Reads the capital unless you mark a location with the console command effect location:<key> = { cm_ab_core_watch_on = yes }."
 cm__probe_production_rgo_text: "Run"
 cm__probe_core_name: "Core Goods"
 cm__probe_core_desc: "Every number Core Goods reads at a location, each beside the game's own reading of it, then what that location's market could absorb in a cycle. Reads the capital unless you mark a location with the console command effect location:<key> = { cm_ab_core_watch_on = yes }; the capital is never a Core Goods candidate, so mark a location to read one it would build in."
 cm__probe_core_text: "Run"
 cm__probe_roads_name: "Roads"
 cm__probe_roads_desc: "How many corridors the Roads plan is holding for each of proximity, market access and capital connection, how many of the capital ones can be started yet, how many roads are already being built, how many are blocked by a market short of construction goods, and what is left in the category's pool."
 cm__probe_roads_text: "Run"
 cm__probe_log_gate_name: "Action Log Gate"
 cm__probe_log_gate_desc: "The Core Goods log category twice, as the log gate reads it and as the menu stores it, so a category that is on in one and off in the other shows up."
 cm__probe_log_gate_text: "Run"
 ## Setup Data (setup) Group
 cm__probe_setup_name: "Setup Data"
 cm__probe_setup_desc: "Which map data the save is carrying and the version each was worked out at, then whether this machine is allowed to work any of it out. A 0 version means that one has not been worked out yet and will be on the next load."
 cm__probe_setup_text: "Run"
 cm__debug__setup_name: "Setup Data"
 cm__debug__setup_desc: "The map data the mod works out once and then reads for the rest of the game."
 cm__dbg_rebuild_setup_name: "Rebuild Setup Data"
 cm__dbg_rebuild_setup_desc: "Works the map data out again: the raw goods behind the R.G.O. Bonus filters, the industry coverage behind Recommended Urban Rights, the river crossings the placement finders path through, and which buildings upgrade into which. Takes a few seconds, and the game keeps running while it does."
 cm__dbg_rebuild_setup_text: "Rebuild"

