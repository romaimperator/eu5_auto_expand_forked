l_english:
 # Mod
 cm_name: "Construction Manager"
 cm_desc: "A massive quality of life mod that adds new automation, filters, and map modes, to greatly improve the EU5 construction experience."

 # General (general) Tab
 cm__general_name: "General"
 ## General (general) Group
 cm__general__general_name: "General"
 cm__general__general_desc: "Gold floors and the master pause."
 cm__minimum_gold_name: "Gold Reserve"
 cm__minimum_gold_desc: "No automation spends your treasury below this amount."
 cm__minimum_gold_format: "[CMMV('cm__minimum_gold')]@gold!"
 cm__auto_expand_reserve_name: "Auto-Expand Gold Reserve (Relative)"
 cm__auto_expand_reserve_desc: "Held on top of the Gold Reserve for the features on the Auto-Expand tab alone. With a 1000 Gold Reserve and a 100 reserve here, everything else stops at 1100 and the Auto-Expand tab keeps spending down to 1000."
 cm__auto_expand_reserve_format: "[CMMV('cm__auto_expand_reserve')]@gold!"
 cm__pause_auto_expand_name: "Pause Automation"
 cm__pause_auto_expand_desc: "Pauses every automation feature this mod adds."

 # Auto-Expand (auto_expand) Tab
 cm__auto_expand_name: "Auto-Expand"
 ## Construction Automation (priority_list) Group
 cm__auto_expand__priority_list_name: "Construction Automation"
 cm__auto_expand__priority_list_desc: "Drag to reorder feature priority. Each month, enabled features run top-to-bottom."
 cm__priority_list_item_column_name: "Feature"
 cm__priority_list_i1_name: "Auto-Expand Buildings"
 cm__priority_list_i1_desc: "Automatically expands multi-level production and non-production buildings when profitable, pops are available, and gold stays above your Gold Reserve. Applies where auto-expand is toggled on for a location or for a whole building type, including foreign buildings in other countries' locations."
 cm__priority_list_i2_name: "Auto-Expand RGOs"
 cm__priority_list_i2_desc: "Automatically expands RGO levels in locations where auto-expand RGO is toggled on, when laborers are available and resources permit."
 cm__priority_list_i3_name: "Auto-Food"
 cm__priority_list_i3_desc: "Automatically builds food-producing RGOs and buildings in the rural locations you switch auto-food on for, picking the most food-efficient option."
 cm__priority_list_i4_name: "Auto-Upgrade All Buildings"
 cm__priority_list_i4_desc: "Automatically upgrades every building that has become obsolete, regardless of whether auto-expand is enabled for that building."
 cm__priority_list__min_profit_name: "Min Tax Income"
 cm__priority_list__min_profit_desc: "Minimum monthly gold per level required before construction is queued. Set to 0 to disable the check."
 cm__priority_list__min_profit_postfix: "@gold!"
 cm__priority_list__min_discount_name: "Min Discount"
 cm__priority_list__min_discount_desc: "Maximum construction material price markup allowed. At -33%, only builds when materials cost 33% below base price. At 0%, only at base price or below. At +33%, builds even when prices are 33% above base."
 cm__priority_list__min_discount_postfix: "%"
 cm__priority_list__min_discount_prefix_high: "#R "
 cm__priority_list__min_discount_postfix_high: "%#!"
 cm__priority_list__min_discount_prefix_low: "#G "
 cm__priority_list__min_discount_postfix_low: "%#!"
 cm__priority_list__enabled_name: "Enabled"
 cm__priority_list__enabled_desc: "Enable or disable this feature."
 cm__expand_metric_name: "Auto-Expand Metric"
 cm__expand_metric_desc: "Choose what auto-expand uses to decide whether to add a building or RGO level."
 cm__expand_metric_option_1_name: "@income! Tax Income"
 cm__expand_metric_option_1_desc: "Add a new level only when its monthly tax income is at least your set Min Tax Income."
 cm__expand_metric_option_2_name: "@wealth! Profit"
 cm__expand_metric_option_2_desc: "Add a new level only when its total monthly profit is at least your set Min Profit."
 cm__expand_metric_option_3_name: "@efficiency! ROI (Tax)"
 cm__expand_metric_option_3_desc: "Add a new level only when its tax income recoups the build cost within your set Max ROI Years."
 cm__expand_metric_option_4_name: "@efficiency! ROI (Profit)"
 cm__expand_metric_option_4_desc: "Add a new level only when its profit recoups the build cost within your set Max ROI Years."
 cm__allowed_building_overbuild_levels_name: "Overbuild Limit"
 cm__allowed_building_overbuild_levels_desc: "How many total building levels a location may exceed its Supported Building Levels cap by before auto-expand will stop queueing new construction there. At zero, it won't allow any overbuilding. At 200+, there is no limit."
 cm__allowed_building_overbuild_levels_format: "[CMMV('cm__allowed_building_overbuild_levels')][Select_CString(GreaterThanOrEqualTo_CFixedPoint(CMMV('cm__allowed_building_overbuild_levels'), CMMMapValue('cmm_max', 'cm__allowed_building_overbuild_levels')), '+', '')]"

 # Auto-Build (auto_build) Tab
 cm__auto_build_name: "Auto-Build"
 cm__ab_master_name: "Control Panel"
 cm__ab_utilities_name: "Utilities"
 cm__ab_industry_name: "Industry"
 cm__ab_collapsar_name: "Price Collapsar"
 cm__ab_food_name: "Food"
 cm__ab_roads_name: "Roads"
 cm__ab_governors_name: "Governors"
 ## Control Panel (ab_master) Group
 cm__ab_master__ab_master_name: "Control Panel"
 cm__ab_master__ab_master_desc: "Hands-free construction. Every month the categories below spend the treasury above the Gold Reserve and the Auto-Expand Gold Reserve on the best constructions available. Runs alongside the other automation features without touching their settings."
 cm__ab_enabled_name: "Enable Auto-Build"
 cm__ab_enabled_desc: "Turn Auto-Build on or off."
 cm__ab_save_unaffordable_name: "Save for Unaffordable Buildings"
 cm__ab_save_unaffordable_desc: "A category buys the best building it found even when it costs more than its share for the month, and then goes without until later months have made the difference up. While off, each category spends what it can and hands the rest down."
 cm__ab_min_proximity_name: "Minimum Proximity"
 cm__ab_min_proximity_desc: "Locations below this Proximity are skipped when picking where to build. Proximity carries Control, so a location no source reaches earns little from anything built there. Control Buildings and @settlement_building! [ShowBuildingTypeNameWithNoTooltip('settlement_building')] are built regardless, since those are what make low-Proximity land worth holding. At 0, nothing is skipped."
 cm__ab_min_proximity_format: "[CMMV('cm__ab_min_proximity')]%"
 ## Smart Builders (ab_priority_list) Group
 cm__ab_master__ab_priority_list_name: "Smart Builders"
 cm__ab_master__ab_priority_list_desc: "Drag to reorder. Builders are worked from the top down each month. Where two want the same building, the higher one builds it."
 cm__ab_priority_list_item_column_name: "Category"
 cm__ab_priority_list_i1_name: "Food"
 cm__ab_priority_list_i1_desc: "Watches food supply over the year in markets whose market center you own and, where the median month fell short, enables auto-food on the locations with the highest food potential. Locations it picks glow like player-enabled ones, but the toggle stays yours; they are never turned off unless the location is no longer a rural settlement you own, or you no longer own its market center."
 cm__ab_priority_list_i2_name: "Industry"
 cm__ab_priority_list_i2_desc: "Builds, expands, and upgrades the production buildings and RGOs that repay their cost fastest in tax income. Locations running auto-food are left alone while any kind of worker there is already in short supply."
 cm__ab_priority_list_i3_name: "Price Collapsar"
 cm__ab_priority_list_i3_desc: "Expands production of construction materials to push their prices down. Works in markets whose market center you own. The best-producing locations go first and each is given several levels at once, and producers start even where the workers have not arrived yet. Your capital, locations growing food, and producers that would run at a loss without a subsidy are all skipped."
 cm__ab_priority_list_i4_name: "Roads"
 cm__ab_priority_list_i4_desc: "Builds the road network worth the most for the gold, across three things a road buys: Proximity, Market Access, and connecting a location to your capital. Once a year it works out the best route to every location you own for each of them, then each month starts the stretches that would lift the most Tax Base, counting everything further down the route behind them. Cheap flat corridors are laid first, and the lower two only get the gold in a month the one above has nothing left to lay."
 cm__ab_priority_list_i5_name: "Utilities"
 cm__ab_priority_list_i5_desc: "Builds supporting infrastructure everywhere it fits. Capital buildings go up first, then the control buildings, then the market center buildings, then the roster you order yourself. Control buildings go to the wealthiest locations first, and marketplaces to the locations with the least Market Access first."
 cm__ab_priority_list_i6_name: "Governors"
 cm__ab_priority_list_i6_desc: "Plans where your governors should sit and puts them there, taking the best location first. It plans again whenever a governor slot opens, and every twenty-five years otherwise. Single-player only."
 cm__ab_priority_list__budget_name: "Budget Share"
 cm__ab_priority_list__budget_desc: "The share of the treasury above the Gold Reserve this category may spend each month."
 cm__ab_priority_list__budget_postfix: "%"
 cm__ab_priority_list__enabled_name: "Enabled"
 cm__ab_priority_list__enabled_desc: "Let this category build."
 ## Utilities (ab_utilities) Group
 cm__ab_utilities__ab_utilities_name: "Utilities"
 cm__ab_utilities__ab_utilities_desc: "Settings for Utilities."
 cm__auto_build_capital_name: "Capital Buildings"
 cm__auto_build_capital_desc: "Build the capital-only buildings in your capital: the royal court, the supreme court, the war college and the rest. They go up before anything else this category builds."
 cm__ab_utilities_control_name: "Control Buildings"
 cm__ab_utilities_control_desc: "Build bailiffs, and any unique buildings your country has that raise Control, taking the wealthiest locations first."
 cm__ab_utilities_market_centers_name: "Market Center Buildings"
 cm__ab_utilities_market_centers_desc: "Build the trade buildings that only stand at a market center, at every market center you own."
 cm__auto_build_enabled_name: "Custom Buildings"
 cm__auto_build_enabled_desc: "Build the buildings listed below."
 ## Custom Buildings (auto_build_list) Group
 cm__ab_utilities__auto_build_list_name: "Custom Buildings"
 cm__ab_utilities__auto_build_list_desc: "Drag to reorder. Buildings are worked from the top down each month, so the ones nearer the top take the gold first."
