l_english:
 # Mod
 cm_name: "Construction Manager"
 cm_desc: "A massive quality of life mod that adds new automation, filters, and map modes, to greatly improve the EU5 construction experience."

 # Settings (settings) Tab
 cm__settings_name: "Settings"
 cm__pause_auto_expand_name: "Pause Automation"
 cm__pause_auto_expand_desc: "Pauses all automation features: auto-expand buildings, auto-expand RGOs, upgrade all buildings, auto-build, auto-food, and auto-urbanize."
 cm__minimum_gold_name: "Gold Reserve"
 cm__minimum_gold_desc: "The minimum gold reserve to keep. Construction will not be queued if it would leave the treasury below this amount. Applies to all automation features except auto-urbanize upgrades (which have their own gold setting)."
 cm__minimum_gold_format: "[CMMV('cm__minimum_gold')]@gold!"
 cm__allowed_building_overbuild_levels_name: "Overbuild Limit"
 cm__allowed_building_overbuild_levels_desc: "How many total building levels a location may exceed its Supported Building Levels cap by before auto-expand will stop queueing new construction there. At zero, it won't allow any overbuilding."

 ## Priority List Group
 cm__settings__priority_list_name: "Construction Automation"
 cm__settings__priority_list_desc: "Drag to reorder feature priority. Each month, enabled features run top-to-bottom. For auto-expand, the value beside each feature is how good an expansion must be before it is built, judged by the metric you pick in Auto-Expand Metric: a minimum monthly gold per level for Tax Income and Profit, or a maximum number of years to recoup the build cost for ROI (0 = disabled). Min Discount sets the highest construction material price markup allowed (-33% = only when cheap, 0 = at base price, +33% = even when inflated)."
 cm__priority_list_item_column_name: "Feature"
 cm__priority_list_i1_name: "Auto-Expand Buildings"
 cm__priority_list_i1_desc: "Automatically expands multi-level production and non-production buildings when profitable, pops are available, and gold stays above your Gold Reserve. Only applies in locations where auto-expand is toggled on."
 cm__priority_list_i2_name: "Auto-Expand RGOs"
 cm__priority_list_i2_desc: "Automatically expands RGO levels in locations where auto-expand RGO is toggled on, when laborers are available and resources permit."
 cm__priority_list_i3_name: "Auto-Upgrade All Buildings"
 cm__priority_list_i3_desc: "Automatically upgrades every building that has become obsolete, regardless of whether auto-expand is enabled for that building."
 cm__priority_list_i4_name: "Auto-Build"
 cm__priority_list_i4_desc: "Automatically constructs one-per-location buildings (councils, libraries, etc.) in the order and with the settings configured on the Auto-Build tab."
 cm__priority_list_i5_name: "Auto-Food"
 cm__priority_list_i5_desc: "Automatically builds food-producing RGOs and buildings in rural locations, picking the option with the highest marginal food output. Configured on the Auto-Food tab."
 cm__priority_list_i6_name: "Auto-Urbanize"
 cm__priority_list_i6_desc: "Promotes location ranks each month: rural settlements to towns, and towns to cities. Rural-to-town requires 30,000 pops (immediately city-eligible) or within 1,000 of pop cap (otherwise growth would stall at the rural cap). Skips unintegrated locations. Configured on the Auto-Urbanize tab."
 cm__priority_list_i7_name: "Auto-Build Capital Buildings"
 cm__priority_list_i7_desc: "Automatically constructs capital-only buildings (royal court, supreme court, war college, etc.) in your capital location when conditions allow."
 cm__priority_list__enabled_name: "Enabled"
 cm__priority_list__enabled_desc: "Enable or disable this feature. Disabled features are skipped each month."
 cm__priority_list__min_profit_name: "Min Tax Income"
 cm__priority_list__min_profit_profit_name: "Min Profit"
 cm__priority_list__min_profit_desc: "Minimum monthly gold per level required before construction is queued. Set to 0 to disable the check."
 cm__priority_list__min_profit_postfix: "@gold!"
 cm__priority_list__min_profit_roi_name: "Max ROI Years"
 cm__priority_list__min_profit_roi_desc: "Maximum years allowed to recoup the build cost. Set to 0 to disable the check."
 cm__priority_list__min_profit_roi_postfix: "y @efficiency!"
 cm__priority_list__min_discount_name: "Min Discount"
 cm__priority_list__min_discount_desc: "Maximum construction material price markup allowed. At -33%, only builds when materials cost 33% below base price. At 0%, only at base price or below. At +33%, builds even when prices are 33% above base."
 cm__priority_list__min_discount_postfix: "%"
 cm__priority_list__min_discount_prefix_high: "#R "
 cm__priority_list__min_discount_postfix_high: "%#!"
 cm__priority_list__min_discount_prefix_low: "#G "
 cm__priority_list__min_discount_postfix_low: "%#!"
 cm__expand_metric_name: "Auto-Expand Metric"
 cm__expand_metric_desc: "Choose what auto-expand uses to decide whether to add a building or RGO level. Tax Income and Profit set a minimum monthly gold per level; the ROI options set a maximum number of years to recoup the build cost."
 cm__expand_metric_option_1_name: "@income! Tax Income"
 cm__expand_metric_option_1_desc: "Add a new level only when its monthly tax income is at least your set Min Tax Income."
 cm__expand_metric_option_2_name: "@wealth! Profit"
 cm__expand_metric_option_2_desc: "Add a new level only when its total monthly profit is at least your set Min Profit."
 cm__expand_metric_option_3_name: "@efficiency! ROI (Tax)"
 cm__expand_metric_option_3_desc: "Add a new level only when its tax income recoups the build cost within your set Max ROI Years."
 cm__expand_metric_option_4_name: "@efficiency! ROI (Profit)"
 cm__expand_metric_option_4_desc: "Add a new level only when its profit recoups the build cost within your set Max ROI Years."

