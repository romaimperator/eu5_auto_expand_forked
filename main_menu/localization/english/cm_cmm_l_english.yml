l_english:
 # Mod
 cm_name: "Construction Manager"
 cm_desc: "A massive quality of life mod that adds new automation, filters, and mapmodes, to greatly improve the EU5 construction experience."

 # Settings (settings) Tab
 cm__settings_name: "Settings"
 cm__pause_auto_expand_name: "Pause Automation"
 cm__pause_auto_expand_desc: "Pauses all automation features: auto-expand buildings, auto-expand RGOs, upgrade all buildings, auto-build, auto-build capital buildings, auto-food, auto-urbanize, auto-grant urban rights, and Full Automation."
 cm__minimum_gold_name: "Gold Reserve"
 cm__minimum_gold_desc: "The minimum gold reserve to keep. Construction will not be queued if it would leave the treasury below this amount. Applies to every automation feature except Full Automation."
 cm__minimum_gold_format: "[CMMV('cm__minimum_gold')]@gold!"
 cm__allowed_building_overbuild_levels_name: "Overbuild Limit"
 cm__allowed_building_overbuild_levels_desc: "How many total building levels a location may exceed its Supported Building Levels cap by before auto-expand will stop queueing new construction there. At zero, it won't allow any overbuilding. At 200+, there is no limit."
 cm__allowed_building_overbuild_levels_format: "[CMMV('cm__allowed_building_overbuild_levels')][Select_CString(GreaterThanOrEqualTo_CFixedPoint(CMMV('cm__allowed_building_overbuild_levels'), CMMMapValue('cmm_max', 'cm__allowed_building_overbuild_levels')), '+', '')]"

 ## Priority List Group
 cm__settings__priority_list_name: "Construction Automation"
 cm__settings__priority_list_desc: "Drag to reorder feature priority. Each month, enabled features run top-to-bottom, except Auto-Urbanize, which always runs last, after every other feature and after Full Automation."
 cm__priority_list_item_column_name: "Feature"
 cm__priority_list_i1_name: "Auto-Expand Buildings"
 cm__priority_list_i1_desc: "Automatically expands multi-level production and non-production buildings when profitable, pops are available, and gold stays above your Gold Reserve. Applies where auto-expand is toggled on for a location or for a whole building type, including foreign buildings in other countries' locations."
 cm__priority_list_i2_name: "Auto-Expand RGOs"
 cm__priority_list_i2_desc: "Automatically expands RGO levels in locations where auto-expand RGO is toggled on, when laborers are available and resources permit."
 cm__priority_list_i3_name: "Auto-Build"
 cm__priority_list_i3_desc: "Automatically constructs capital buildings and one-per-location buildings (councils, libraries, etc.) in the order and with the settings configured on the Auto-Build tab."
 cm__priority_list_i4_name: "Auto-Food"
 cm__priority_list_i4_desc: "Automatically builds food-producing RGOs and buildings in rural locations, picking the most food-efficient option. Configured on the Auto-Food tab."
 cm__priority_list_i5_name: "Auto-Urbanize"
 cm__priority_list_i5_desc: "Promotes location ranks each month: rural settlements to towns, towns to cities, and cities to megalopolises. Skips unintegrated locations. Configured on the Auto-Urbanize tab."
 cm__priority_list_i6_name: "Auto-Upgrade All Buildings"
 cm__priority_list_i6_desc: "Automatically upgrades every building that has become obsolete, regardless of whether auto-expand is enabled for that building."
 cm__priority_list__enabled_name: "Enabled"
 cm__priority_list__enabled_desc: "Enable or disable this feature."
 cm__priority_list__min_profit_name: "Min Tax Income"
 cm__priority_list__min_profit_profit_name: "Min Profit"
 cm__priority_list__min_profit_desc: "Minimum monthly gold per level required before construction is queued. Set to 0 to disable the check."
 cm__priority_list__min_profit_postfix: "@gold!"
 cm__priority_list__min_profit_roi_name: "Max ROI Years"
 cm__priority_list__min_profit_roi_desc: "Maximum years allowed to recoup the build cost. Set to 0 to disable the check."
 cm__priority_list__min_profit_roi_postfix: "y @efficiency!"
 cm__priority_list__min_discount_name: "Min Discount"
 cm__priority_list__min_discount_desc: "Maximum construction material price markup allowed. At -33%, only builds when materials cost 33% below base price. At 0%, only at base price or below. At +33%, builds even when prices are 33% above base."
 cm__priority_list__min_discount_postfix: "%"
 cm__priority_list__min_discount_prefix_high: "#R "
 cm__priority_list__min_discount_postfix_high: "%#!"
 cm__priority_list__min_discount_prefix_low: "#G "
 cm__priority_list__min_discount_postfix_low: "%#!"
 cm__expand_metric_name: "Auto-Expand Metric"
 cm__expand_metric_desc: "Choose what auto-expand uses to decide whether to add a building or RGO level."
 cm__expand_metric_option_1_name: "@income! Tax Income"
 cm__expand_metric_option_1_desc: "Add a new level only when its monthly tax income is at least your set Min Tax Income."
 cm__expand_metric_option_2_name: "@wealth! Profit"
 cm__expand_metric_option_2_desc: "Add a new level only when its total monthly profit is at least your set Min Profit."
 cm__expand_metric_option_3_name: "@efficiency! ROI (Tax)"
 cm__expand_metric_option_3_desc: "Add a new level only when its tax income recoups the build cost within your set Max ROI Years."
 cm__expand_metric_option_4_name: "@efficiency! ROI (Profit)"
 cm__expand_metric_option_4_desc: "Add a new level only when its profit recoups the build cost within your set Max ROI Years."

