 # Auto-Grant Urban Rights (auto_town_rights) Tab
 cm__auto_town_rights_name: "Auto-Grant Urban Rights"
 ## Auto-Grant Urban Rights (auto_town_rights) Group
 cm__auto_town_rights__auto_town_rights_name: "Auto-Grant Urban Rights"
 cm__auto_town_rights__auto_town_rights_desc: "Each month, grant the urban rights enabled below to eligible towns, cities and megalopolises."
 cm__auto_grant_town_rights_name: "Enabled"
 cm__auto_grant_town_rights_desc: "Enable or disable the auto-grant pass."
 cm__town_rights_free_grants_name: "Remove Urban Rights Costs"
 cm__town_rights_free_grants_desc: "When on, granting urban rights costs no government power and revoking them costs no stability."
 cm__town_rights_min_gov_power_name: "Minimum Government Power"
 cm__town_rights_min_gov_power_desc: "Auto-grant stops granting urban rights when the next grant would drop your government power (legitimacy, republican tradition, devotion, or horde unity, depending on government type) below this value."
 ## Smart Specialization Right Granter (auto_town_rights_specialization) Group
 cm__auto_town_rights__auto_town_rights_specialization_name: "Smart Specialization Right Granter"
 cm__auto_town_rights__auto_town_rights_specialization_desc: "One specialization right for each location, drawn from those that suit the goods made around it. Granted after the Custom Right Granter has had its turn."
 cm__auto_grant_specialization_name: "Auto-Grant Specialization Urban Rights"
 cm__auto_grant_specialization_desc: "Grant one specialization right per location, drawn at random from those that suit the goods made around it, weighted by how well each suits it."
 cm__specialization_window_name: "Fit Threshold"
 cm__specialization_window_desc: "How well a specialization right must suit a location, next to the best-suited right there, to be in the running. At 50%, any right that suits it at least half as well can be drawn, and the better-suited ones are drawn more often. At 100%, only the best-suited right is granted."
 cm__specialization_window_format: "[CMMV('cm__specialization_window')]%"
 cm__specialization_expand_name: "Expand the Boosted Industries"
 cm__specialization_expand_desc: "When a specialization right is granted, also turn on auto-expand in that location for the industries the right boosts, and for its raw goods where the location produces them. The same as right-clicking a grant button on the Recommended Urban Rights map."

