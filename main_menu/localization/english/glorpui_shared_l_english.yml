 GLORP_UI_ROI_UNIT_MONTHS: "m"
 GLORP_UI_ROI_UNIT_YEARS: "y"
 GLORP_UI_B_ROI_TAX_MONTHS_VALUE: "[Divide_CFixedPoint(GetBuildOrExpandBuildingCost(BuildingType.Self, Location.Self), Building.GetIncomeToOwnerPerLevel)|0]$GLORP_UI_ROI_UNIT_MONTHS$ @efficiency!"
 GLORP_UI_B_ROI_TAX_YEARS_VALUE: "[Divide_CFixedPoint(Divide_CFixedPoint(GetBuildOrExpandBuildingCost(BuildingType.Self, Location.Self), Building.GetIncomeToOwnerPerLevel), '(CFixedPoint)12')|1]$GLORP_UI_ROI_UNIT_YEARS$ @efficiency!"
