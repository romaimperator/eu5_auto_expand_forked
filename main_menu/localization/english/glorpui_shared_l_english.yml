l_english:
 GLORP_UI_BUILDING_ROI_TT_TITLE: "Return on Investment"
 GLORP_UI_BUILDING_ROI_TT_DESC: "Months needed to recoup this building's construction cost."
 GLORP_UI_BUILDING_ROI_TT_COST: "Build cost"
 GLORP_UI_BUILDING_ROI_TT_TAX_INCOME: "Tax income / month"
