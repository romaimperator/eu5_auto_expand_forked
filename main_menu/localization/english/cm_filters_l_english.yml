l_english:
  search_filter_location_has_auto_expand_rgo_name: "Auto-Expand R.G.O. Enabled"
  search_filter_location_has_auto_expand_rgo_desc: "Show locations with [rgo|e] auto-expand enabled"
  search_filter_location_not_has_auto_expand_rgo_name: "Auto-Expand R.G.O. Disabled"
  search_filter_location_not_has_auto_expand_rgo_desc: "Show locations with [rgo|e] auto-expand disabled"
  search_filter_building_only_auto_expand_name: "Auto-Expand Enabled"
  search_filter_building_only_auto_expand_desc: "Show buildings that have at least one location with auto-expand enabled"
  search_filter_building_only_not_auto_expand_name: "Auto-Expand Disabled"
  search_filter_building_only_not_auto_expand_desc: "Show buildings that have at least one location with auto-expand disabled"
  search_filter_cm_building_owned_location_name: "Owned Locations"
  search_filter_cm_building_owned_location_desc: "Show buildings in locations you own"
  search_filter_cm_location_wealth_name: "Tax Base"
  search_filter_cm_location_wealth_desc: "Show locations within the specified tax base range. A maximum of 100 means no upper limit."
  search_filter_cm_location_raw_wealth_name: "Wealth"
  search_filter_cm_location_raw_wealth_desc: "Show locations within the specified wealth range (unscaled by control). A maximum of 100 means no upper limit."
  search_filter_cm_location_total_building_levels_name: "Building Levels Filled"
  search_filter_cm_location_total_building_levels_desc: "Show locations within the specified range of total building levels relative to supported capacity"
  search_filter_cm_building_production_efficiency_name: "Production Efficiency"
  search_filter_cm_building_production_efficiency_desc: "Show buildings within the specified production efficiency range"
  search_filter_cm_building_level_name: "Building Level"
  search_filter_cm_building_level_desc: "Show buildings within the specified level range"
  search_filter_cm_location_food_potential_desc: "Show locations with food potential per [rgo|e] level within the specified range. Uses the same score as the Food Potential mapmode (max 45 at the best non-special rural food rgo, higher for locations with rare static specials)."
  search_filter_cm_location_rgo_value_name: "R.G.O. Value"
  search_filter_cm_location_rgo_value_desc: "Show locations where the [rgo|e] has a base market price within the specified range"
  search_filter_cm_province_location_count_name: "Number of Locations"
  search_filter_cm_province_location_count_desc: "Show provinces with a number of locations within the specified range"
  search_filter_cm_location_attacker_penalty_name: "Attacker Penalty"
  search_filter_cm_location_attacker_penalty_desc: "Show locations within the specified [combat|e] attacker penalty range from terrain"
  search_filter_cm_location_good_migration_candidate_name: "Good Migration Candidate"
  search_filter_cm_location_good_migration_candidate_desc: "Show locations under 30k pops with an [rgo|e] base value below 3 that aren't blocked from being upgraded"
  search_filter_cm_building_rgo_bonus_name: "Local Access to Raw Materials Bonus"
  search_filter_cm_building_rgo_bonus_desc: "Show buildings within the specified range of [production_efficiency|e] bonus from Local Access to Raw Materials, granted when a building's consumed goods are produced as [raw_material|e] in the same [province|e]. A maximum of 25% means no upper limit."
  search_filter_cm_location_rgo_bonus_desc: "Show locations where the viewed building would get a [production_efficiency|e] bonus from Local Access to Raw Materials within the specified range. A maximum of 25% means no upper limit."
  search_filter_cm_character_is_administrator_name: "[cabinet_icon] Administrator"
  search_filter_cm_character_is_administrator_desc: "Shows characters with the Administrator cabinet trait"

 # NO-TRANSLATE BELOW - value formats and shared-key references only.
  search_filter_cm_location_wealth_format: "$VAL|0$"
  search_filter_cm_location_raw_wealth_format: "$VAL|0$"
  search_filter_cm_location_total_building_levels_format: "$VAL|%0$"
  search_filter_cm_building_production_efficiency_format: "$VAL|%0$"
  search_filter_cm_building_level_format: "$VAL|0$"
  search_filter_cm_location_food_potential_name: "$mapmode_cm_location_food_potential_name$"
  search_filter_cm_location_food_potential_format: "$VAL|0$"
  search_filter_cm_location_rgo_value_format: "$VAL|1$"
  search_filter_cm_province_location_count_format: "$VAL|0$"
  search_filter_cm_location_attacker_penalty_format: "$VAL|0$"
  search_filter_cm_building_rgo_bonus_format: "$VAL|%0$"
  search_filter_cm_location_rgo_bonus_name: "$search_filter_cm_building_rgo_bonus_name$"
  search_filter_cm_location_rgo_bonus_format: "$VAL|%0$"
