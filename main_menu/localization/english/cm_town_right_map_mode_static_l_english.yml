l_english:
 mapmode_cm_best_town_right_name: "Recommended Urban Rights"
 # Shared words. cm_town_right_map_mode_l_english.yml is generated against these,
 # so keep the key names when reworking them.
 # Note to translators: "Grant" is a verb, followed by the name of an urban right.
 cm_trmm_grant_word: "Grant"
 cm_trmm_tied_with_label: "Tied with:"
 cm_trmm_open_slot_here: "Open urban right slot in this location"
 MAPMODE_CM_BEST_TOWN_RIGHT: "#T $mapmode_cm_best_town_right_name$#!\nColors each [location|e] by the specialization [town_rights|e] whose boosted buildings can source the largest share of their input [goods|e] from the [province|e]'s [rgo|e]s. Hover a [location|e] to see every specialization option ranked.\nHover an industry's percentage in the tooltip for a breakdown of its best production method's inputs.\nTies for best show as a striped second color: the tied specialization's color, or a dedicated color when 3+ tie."
 MAPMODE_CM_BEST_TOWN_RIGHT_TT_NONE: "[ROOT.GetLocation.GetProvince.GetName] has no [raw_material|e] used by specialized industries.[ROOT.GetLocation.Custom('cm_trmm_stripe_reason')]"
 MAPMODE_CM_BEST_TOWN_RIGHT_TT_WATER: "[ROOT.GetLocation.GetName] is a sea zone."
 cm_trmm_legend_none: "No matching raw materials"
 cm_trmm_legend_granted_best: "Granted urban right at the best fit here (striped)"
 cm_trmm_legend_granted_poor: "Granted urban right far below the best fit (striped)"
 cm_trmm_legend_tied_multi: "3+ specializations tied (striped)"
 cm_trmm_legend_open_slot: "Open urban right slot (striped)"
 cm_trmm_legend_full_no_spec: "City full with no specialization granted (striped)"
 cm_trmm_reason_full_no_spec: "\n\nNo open urban right slot and no specialization granted here"
 cm_trmm_search_legend_100: "100% of inputs local"
 cm_trmm_search_legend_none: "No raw goods used by this right's industries"
 cm_trmm_search_legend_granted: "Already granted (striped)"
 cm_trmm_search_legend_best: "Best or tied-best specialization here (striped)"
 cm_trmm_search_legend_granted_other: "A different urban right granted (striped)"
 cm_trmm_search_granted_line: "\nAlready granted in this location"
 cm_trmm_search_best_line: "\nBest specialization for this location"
 cm_trmm_search_tied_best_line: "\nTied for best specialization in this location"
 CM_TRMM_GRANT_LABEL_FREE: "$cm_trmm_grant_word$ (Free):"
 CM_TRMM_GRANT_CANT_AFFORD: "@trigger_no! Not enough [government_power|e]."
 CM_TRMM_GRANT_REQUIREMENTS: "@trigger_no! This [location|e] does not meet the requirements for this [town_rights|e]."

 # NO-TRANSLATE BELOW - data functions and shared-key references only.
 cm_trmm_reason_open_slot: "\n\n$cm_trmm_open_slot_here$"
 cm_trmm_search_legend_open_slot: "$cm_trmm_legend_open_slot$"
 cm_trmm_search_open_slot_line: "\n$cm_trmm_open_slot_here$"
 cm_trmm_tied_with_prefix: " - $cm_trmm_tied_with_label$ "
 CM_TRMM_GRANT_LABEL: "$cm_trmm_grant_word$ (@government_power! [GetPlayer.MakeScope.ScriptValue('cm_grant_town_rights_cost')|0]):"
