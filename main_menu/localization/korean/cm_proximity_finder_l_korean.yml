 mapmode_cm_capital_finder_name: "추천 수도 위치"
 MAPMODE_CM_CAPITAL_FINDER: "#T $mapmode_cm_capital_finder_name$#!\n그곳의 [capital|e]가 [proximity|e]를 얼마나 잘 전파하는지에 따라 [locations|e]의 색상을 표시합니다. 기존 주지사는 무시됩니다. 빗금 친 지역은 현재 수도나 주지사와 같이 근접성 원천을 이미 보유한 곳입니다.\n이것은 추정치입니다. '배치 탐색 점수' 설정은 지역 순위를 조세 기반으로 매길지 아니면 가공되지 않은 [proximity|e]로 매길지 선택하며, '육상 기반시설' 및 '해상 기반시설' 설정은 가정할 도로, 건물, [maritime_presence|e]을 결정합니다. 이 지도 모드를 열 때 재계산되며, 최대 4년에 한 번 수행됩니다. 강제로 새로 계산하려면 액션 바의 새로고침 버튼을 사용하세요. 계산이 완료되면 색상이 갱신됩니다."
 MAPMODE_CM_CAPITAL_FINDER_TT_SCORED: "수도 기준 예상 최대 평균 [proximity|e]: [ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_cf_avg_value')|1]%\n[proximity|e]의 예상 최대 세금 기반: +[ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_cf_taxgain_value')|1]\n점수: 최고 지역의 [ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_cf_pct_value')|0]%[ROOT.GetLocation.Custom('cm_pf_cf_status')]"
 MAPMODE_CM_CAPITAL_FINDER_TT_BEST: "수도 포함 예상 최대 평균 [proximity|e]: [ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_cf_avg_value')|1]%\n[proximity|e]의 최대 예상 조세 기반: +[ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_cf_taxgain_value')|1]\n최적의 입지"
