 MAPMODE_CM_GOVERNOR_FINDER_TT_SCORED: "$cm_pf_gov_tt_head$\n점수: 최고 지역의 [ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_gf_pct_value')|0]%[ROOT.GetLocation.Custom('cm_pf_gf_status')]"
