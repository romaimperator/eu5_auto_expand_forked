l_korean:
 mapmode_cm_governor_finder_name: "권장 총독 배치"
 MAPMODE_CM_GOVERNOR_FINDER: "#T $mapmode_cm_governor_finder_name$#!\n[capital|e] 및 기존 공급원이 이미 제공하는 인접성을 고려하여, 새로운 지방 총독 또는 해군 총독 건설 시 추가될 [proximity|e] 수치에 따라 [locations|e]의 색상을 표시합니다. 녹색일수록 더 좋습니다. 수도와 기존 인접성 공급원은 빗금으로 표시됩니다.\n이것은 추정치입니다. 배치 탐색기 점수 계산 설정에 따라 지역 순위를 조세 기반 혹은 가공되지 않은 [proximity|e] 수치로 매길지 결정하며, 육상 및 해상 기반 시설 설정에 따라 가정할 도로, 건물 및 [maritime_presence|e]가 결정됩니다. 이 지도 모드를 열 때 다시 계산되나, 최대 4년에 한 번 수행됩니다. 강제로 다시 계산하려면 액션 바의 새로고침 버튼을 사용하십시오. 계산이 완료되면 색상이 갱신됩니다."
 MAPMODE_CM_GOVERNOR_FINDER_TT_SCORED: "예상 최대 평균 [proximity|e] 증가량: +[ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_gf_avg_value')|1]%\n[proximity|e]에서 얻는 최대 예상 조세 기반: +[ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_gf_taxgain_value')|1]\n점수: 최고 지역의 [ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_gf_pct_value')|0]%[ROOT.GetLocation.Custom('cm_pf_gf_status')]"
 MAPMODE_CM_GOVERNOR_FINDER_TT_BEST: "예상 최대 평균 [proximity|e] 증가량: +[ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_gf_avg_value')|1]%\n[proximity|e]에서 얻는 예상 최대 조세 기반: +[ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_gf_taxgain_value')|1]\n최고의 위치"
 MAPMODE_CM_GOVERNOR_FINDER_TT_SCORED_DEBUG: "$MAPMODE_CM_GOVERNOR_FINDER_TT_SCORED$$CM_PF_DEBUG_BLOCK$"
 MAPMODE_CM_GOVERNOR_FINDER_TT_BEST_DEBUG: "$MAPMODE_CM_GOVERNOR_FINDER_TT_BEST$$CM_PF_DEBUG_BLOCK$"
 MAPMODE_CM_GOVERNOR_FINDER_TT_CAPITAL: "귀하의 [capital|e]이(가) 이미 여기에서 [proximity|e]을(를) 확산시키고 있습니다."
 MAPMODE_CM_GOVERNOR_FINDER_TT_CAPITAL_DEBUG: "$MAPMODE_CM_GOVERNOR_FINDER_TT_CAPITAL$$CM_PF_DEBUG_BLOCK$"
 MAPMODE_CM_GOVERNOR_FINDER_TT_SOURCE: "기존 [proximity|e] 공급원: [ROOT.GetLocation.GetModifierValueFixed('local_proximity_source')|0]\n$MAPMODE_CM_GOVERNOR_FINDER_TT_SCORED$"
 MAPMODE_CM_GOVERNOR_FINDER_TT_SOURCE_DEBUG: "$MAPMODE_CM_GOVERNOR_FINDER_TT_SOURCE$$CM_PF_DEBUG_BLOCK$"
 MAPMODE_CM_GOVERNOR_FINDER_TT_SOURCE_NOGAIN: "기존 [proximity|e] 공급원: [ROOT.GetLocation.GetModifierValueFixed('local_proximity_source')|0]\n$MAPMODE_CM_GOVERNOR_FINDER_TT_NOGAIN$"
 MAPMODE_CM_GOVERNOR_FINDER_TT_SOURCE_NOGAIN_DEBUG: "$MAPMODE_CM_GOVERNOR_FINDER_TT_SOURCE_NOGAIN$$CM_PF_DEBUG_BLOCK$"
 MAPMODE_CM_GOVERNOR_FINDER_TT_NOGAIN: "총독은 최대 80의 [proximity|e]을 제공하며 이 지역은 [ROOT.GetLocation.Custom('cm_pf_nogain_basis')]이므로, 여기에 총독을 건설해도 아무런 효과가 없습니다."
