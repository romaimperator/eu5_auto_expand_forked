 # Action bar refresh button
 cm_pf_refresh: "cm_pf_refresh"
 cm_pf_refresh_color: "진한 청록색"
 cm_pf_refresh_icon: "@cm_pf_refresh!"
 cm_pf_refresh_name: "배치 점수 재계산"
 cm_pf_refresh_tooltip: "현재 국경에 대한 주지사 및 수도 배치 점수를 강제로 새로 계산합니다. 그러지 않으면 점수가 최대 4년 동안 재사용됩니다."
 cm_pf_estimate_note: "본 수치는 추정치입니다. 배치 탐색기 점수 산정 설정은 지역 순위를 조세 기반, 인구 또는 순수 [proximity|e] 중 무엇을 기준으로 매길지 결정하며, 지상 기반 시설 및 해군 기반 시설 설정은 가정할 도로, 건물 및 [maritime_presence|e]을 선택합니다. 이 지도 모드를 열 때 다시 계산되며, 최대 4년에 한 번 수행됩니다. 강제로 다시 계산하려면 액션 바의 새로고침 버튼을 사용하십시오. 계산이 완료되면 색상이 갱신됩니다."
 cm_pf_tt_no_data: "아직 점수가 산정되지 않았습니다. 액션 바의 새로고침 버튼을 사용하여 현재 국경에 대한 점수를 계산하십시오."
 cm_pf_tt_skipped: "평가되지 않음: 검색 정확도 설정이 이 지역을 건너뛰었습니다. 모든 지역을 평가하려면 설정을 '철저함'으로 변경하고 새로고침하십시오."
 cm_pf_tt_foreign: "자국 영토가 아닙니다."
