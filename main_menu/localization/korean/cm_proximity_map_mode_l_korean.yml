l_korean:
 mapmode_cm_location_proximity_modifier_name: "인접 효율 영향"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER: "#T $mapmode_cm_location_proximity_modifier_name$#!\n인접 효율 영향에 따라 [locations|e]의 색상을 표시합니다: [topography|e]와 [vegetation|e]가 [proximity|e](산맥, 언덕, 고원, 습지, 숲, 정글 등)에 부여하는 합산 패널티를 나타냅니다. 녹색은 지형이 인접도를 방해하지 않음을 의미하며, 적색은 심하게 방해함을 의미합니다. 지형 패널티는 수도 지형이나 발전과 같은 소유주의 인접 영향 보너스에 따라 조정되며, 소유주가 없는 지역은 기본 지형 값을 표시합니다. 지역의 [road|e] 또는 [river|e]는 [vegetation|e] 패널티를 무효화하지만, [topography|e] 패널티는 항상 적용됩니다."
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_LAND: "근접 효율 영향: [ROOT.GetLocation.MakeScope.ScriptValue('cm_location_proximity_modifier')|+=%]"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_LAND_HARBOR: "인접 효율 영향: [ROOT.GetLocation.MakeScope.ScriptValue('cm_location_proximity_modifier')|+=%]\n천연 항구 적합도: [ROOT.GetLocation.GetModifierValueFixed('natural_harbor_suitability')|0%]"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER: "[ROOT.GetLocation.GetName]은(는) 육지가 아니므로 근접 효율 영향이 없습니다."

 cm_location_proximity_modifier_none_legend_key: "0% (패널티 없음)"
 cm_location_proximity_modifier_light_legend_key: "-25% (가벼움)"
 cm_location_proximity_modifier_noticeable_legend_key: "-35% (눈에 띔)"
 cm_location_proximity_modifier_moderate_legend_key: "-50% (보통)"
 cm_location_proximity_modifier_heavy_legend_key: "-65% (무거움)"
 cm_location_proximity_modifier_severe_legend_key: "-75% (심각함)"
 cm_location_proximity_modifier_worst_legend_key: "-100% (최악)"
 cm_location_proximity_modifier_harbor_legend_key: "천연 항구 적합성 (빗금)"
