l_korean:
 mapmode_cm_location_proximity_modifier_name: "인접 효율 영향"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER: "#T $mapmode_cm_location_proximity_modifier_name$#!\n$mapmode_cm_location_proximity_modifier_name$에 따라 [locations|e]의 색상을 표시합니다. 이는 [topography|e]와 [vegetation|e]이 [proximity|e](산맥, 언덕, 고원, 습지, 숲, 정글 등)에 부여하는 합산 패널티입니다. 녹색은 지형이 인접성을 저해하지 않음을, 적색은 심하게 저해함을 의미합니다. 지형 패널티는 수도 지형이나 기술 발전 등 소유주의 인접성 영향 보너스에 따라 조정되며, 소유주가 없는 지역은 기본 지형 값을 표시합니다. 지역의 [road|e] 혹은 [river|e]는 [vegetation|e] 패널티를 무효화하지만, [topography|e] 패널티는 항상 적용됩니다.\n\n해역은 대신 선택된 [country|e]이 해당 구역에 가진 [maritime_presence|e]을 보여주며, 최저인 녹색부터 연두색을 거쳐 최대인 연하늘색으로 표시됩니다. 높은 영향력은 [seazone|e]을(를) 건널 때 손실되는 [proximity|e]을(를) 감소시킵니다."
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_LAND: "$mapmode_cm_location_proximity_modifier_name$: [ROOT.GetLocation.MakeScope.ScriptValue('cm_location_proximity_modifier')|+=%]"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_LAND_HARBOR: "$MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_LAND$\n천연 항구 적합도: [ROOT.GetLocation.GetModifierValueFixed('natural_harbor_suitability')|0%]"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER: "[ROOT.GetLocation.GetName]은(는) 육지가 아니므로 $mapmode_cm_location_proximity_modifier_name$이(가) 없으며, 선택된 [country|e]은(는) 이곳에 [maritime_presence|e]이(가) 없습니다."

 cm_location_proximity_modifier_none_legend_key: "0% (패널티 없음)"
 cm_location_proximity_modifier_light_legend_key: "-25% (가벼움)"
 cm_location_proximity_modifier_noticeable_legend_key: "-35% (눈에 띔)"
 cm_location_proximity_modifier_moderate_legend_key: "-50% (보통)"
 cm_location_proximity_modifier_heavy_legend_key: "-65% (무거움)"
 cm_location_proximity_modifier_severe_legend_key: "-75% (심각함)"
 cm_location_proximity_modifier_worst_legend_key: "-100% (최악)"
 cm_location_proximity_modifier_harbor_legend_key: "천연 항구 적합성 (빗금)"
 cm_location_proximity_modifier_maritime_none_legend_key: "해상 존재감 없음 (개활수역)"
 cm_location_proximity_modifier_maritime_low_legend_key: "낮은 해상 영향력"
 cm_location_proximity_modifier_maritime_half_legend_key: "50% 해상 영향력"
 cm_location_proximity_modifier_maritime_full_legend_key: "100% 해상 장악력"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER_M0: "[maritime_presence|E]: 0-10%"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER_M10: "[maritime_presence|E]: 10-20%"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER_M20: "[maritime_presence|E]: 20-30%"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER_M30: "[maritime_presence|E]: 30-40%"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER_M40: "[maritime_presence|E]: 40-50%"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER_M50: "[maritime_presence|E]: 50-60%"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER_M60: "[maritime_presence|E]: 60-70%"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER_M70: "[maritime_presence|E]: 70-80%"
