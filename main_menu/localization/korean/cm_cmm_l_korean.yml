 cm__urbanize_rural_to_town_name: "농촌에서 도시로"
 cm__urbanize_rural_to_town_desc: "매달 조건을 충족하는 농촌 정착지를 도시로 승격합니다. 인구 30,000명 이상이거나 인구 한도까지 남은 수치가 1,000명 이내여야 합니다. 아래 '도시화 금지' 목록에서 RGO가 체크된 지역은 제외됩니다."
