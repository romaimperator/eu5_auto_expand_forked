 cm__town_rights_free_grants_name: "도시 권리 비용 제거"
 cm__town_rights_free_grants_desc: "활성화 시 도시권 부여에 정부 역량이 소모되지 않으며, 이를 박탈할 때 안정도가 소모되지 않습니다."
 cm__town_rights_min_gov_power_name: "최소 정부 역량"
 cm__town_rights_min_gov_power_desc: "다음 부여 시 정부 수치(정부 형태에 따라 정통성, 공화정 전통, 신앙심, 또는 부족 결속도)가 이 값 미만으로 떨어지게 되면 도시권 자동 부여를 중단합니다."
 cm__allowed_building_overbuild_levels_format: "[CMMV('cm__allowed_building_overbuild_levels')][Select_CString(GreaterThanOrEqualTo_CFixedPoint(CMMV('cm__allowed_building_overbuild_levels'), CMMMapValue('cmm_max', 'cm__allowed_building_overbuild_levels')), '+', '')]"
 cm__urbanize_city_to_megalopolis_name: "도시에서 거대 도시로"
 cm__urbanize_city_to_megalopolis_desc: "시장 중심지 도시이자 인구가 최소 400,000명 이상이 되면 수도를 메갈로폴리스로 업그레이드하십시오."
 cm__megalopolis_ignore_capital_name: "메갈로폴리스: 수도 요구 사항 무시"
 cm__megalopolis_ignore_capital_desc: "수도가 아닌 도시에서도 메갈로폴리스 건설을 할 수 있게 해줍니다."
 cm__megalopolis_ignore_market_center_name: "메갈로폴리스: 시장 중심지 요구 사항 무시"
 cm__megalopolis_ignore_market_center_desc: "시장 중심지가 아닌 도시에서도 메갈로폴리스 건설을 할 수 있게 해줍니다."
 cm__deurbanize_name: "탈도시화"
 cm__deurbanize_desc: "매월, 아래의 도시화 금지 목록에서 해당 RGO 상품이 선택된 소유 거점들을 농촌 정착지로 되돌립니다. 수도, 시장 중심지, 정복된 거점, 그리고 총독부와 같이 근접도를 제공하는 거점들은 제외됩니다."
 cm__auto_urbanize_ignore_list_i20_name: "@wool! [ShowGoodsName('wool')] ([GetGlobalVariable('cm_goods_wool').GetGoods.GetDefaultMarketPrice]@gold!)"
 cm__map_modes_name: "지도 모드"
 cm__map_modes__placement_finder_name: "권장 수도 및 총독 위치"
 cm__map_modes__placement_finder_desc: "추천 총독 및 추천 수도 배치 지도 모드 설정."
 cm__placement_finder_method_name: "배치 탐색 점수"
 cm__placement_finder_method_desc: "추천 총독 및 추천 수도 지도 모드가 지역의 순위를 매기는 방식입니다."
 cm__placement_finder_method_option_1_name: "$cm_txt_tax_base$"
 cm__placement_finder_method_option_1_desc: "그곳에 총독이나 수도를 배치했을 때 전체 조세 기반이 얼마나 증가하는지에 따라 순위를 매깁니다. 부유한 지역일수록 더 큰 비중을 차지합니다."
 cm__placement_finder_method_option_2_name: "$cm_txt_proximity$"
 cm__placement_finder_method_option_2_desc: "해당 위치에 총독이나 수도를 배치할 경우 추가되는 근접도 순으로 정렬합니다."
 cm__placement_finder_roads_name: "육상 기반 시설"
 cm__placement_finder_roads_desc: "추천 총독 및 추천 수도 지도 모드에서 이상적인 육상 기반 시설을 상정할지, 아니면 실제로 건설된 시설을 사용할지 여부입니다."
 cm__placement_finder_roads_option_1_name: "$cm_txt_current$"
 cm__placement_finder_roads_option_1_desc: "실제로 건설한 도로 사용"
 cm__placement_finder_roads_option_2_name: "최대 도로"
 cm__placement_finder_roads_option_2_desc: "해금된 최상급 도로가 모든 연결로에 건설되어 있다고 가정합니다."
 cm__placement_finder_roads_option_3_name: "$cm_txt_best_possible$"
 cm__placement_finder_roads_option_3_desc: "해금된 가장 좋은 도로가 모든 연결로에 건설되어 있고, 육로 근접성을 개선하는 해금된 모든 건물이 건설 가능한 모든 위치에 건설되어 있다고 가정합니다."
 cm__placement_finder_naval_name: "해군 기반 시설"
 cm__placement_finder_naval_desc: "추천 총독 및 추천 수도 지도 모드에서 이상적인 해군 기반 시설을 가정할지, 아니면 현재 항구 수용량과 해군 주둔 상황을 반영할지 여부입니다."
 cm__placement_finder_naval_option_1_name: "$cm_txt_current$"
 cm__placement_finder_naval_option_1_desc: "현재 항구 수용량과 해군 주둔을 사용합니다."
 cm__placement_finder_naval_option_2_name: "최대 점유"
 cm__placement_finder_naval_option_2_desc: "현재 항구 수용량을 기준으로 모든 지역에 완전한 해군 주둔이 이루어지는 것으로 가정합니다."
 cm__placement_finder_naval_option_3_name: "$cm_txt_best_possible$"
 cm__placement_finder_naval_option_3_desc: "모든 해안 지역에 해금된 최고의 항구 건물이 건설되었으며, 완전한 해군력이 주둔하고 있다고 가정합니다."
 cm__placement_finder_accuracy_name: "검색 정확도"
 cm__placement_finder_accuracy_desc: "추천 총독 및 추천 수도 지도 모드에서 최적의 위치를 얼마나 철저하게 검색할지 결정합니다. 건너뛴 지역은 검은색으로 표시됩니다."
 cm__placement_finder_accuracy_option_1_name: "철저함"
 cm__placement_finder_accuracy_option_1_desc: "모든 지역을 평가합니다. 가장 정확하지만 가장 느립니다."
 cm__placement_finder_accuracy_option_2_name: "철저함"
 cm__placement_finder_accuracy_option_2_desc: "상위 3위 안에 들 수 없는 위치는 건너뜁니다. 상위 3곳과 그 점수는 '철저함(Exhaustive)' 방식과 동일하지만 더 빠릅니다."
 cm__placement_finder_accuracy_option_3_name: "균형"
 cm__placement_finder_accuracy_option_3_desc: "가장 좋은 단일 후보가 될 수 없는 지역은 건너뜁니다. 가장 좋은 위치는 여전히 정확하게 보장되지만, 2순위와 3순위 표시는 가끔 다를 수 있습니다."
 cm__placement_finder_accuracy_option_4_name: "빠름"
 cm__placement_finder_accuracy_option_4_desc: "또한 최적일 가능성이 매우 낮은 지역을 건너뜁니다. 검색된 최적의 지역은 실제 최적값의 20% 이내이며 보통 정확하게 일치합니다."
 cm__placement_finder_accuracy_option_5_name: "가장 빠름"
 cm__placement_finder_accuracy_option_5_desc: "각 프로빈스의 가장 유망한 입지를 평가한 후 상위 후보를 중심으로 정밀화합니다. 영토가 넓은 국가일수록 처리 속도가 훨씬 빠르지만, 최적의 입지를 놓칠 수 있습니다."
 cm__debug_name: "$cm_txt_debug$"
 cm__debug__logging_name: "활동 기록"
 cm__debug__logging_desc: "이 모드의 행동 중 어떤 것들이 모드 행동 로그에 기록될지 설정합니다."
 cm__log_cycle_name: "건설 주기"
 cm__log_cycle_desc: "이전 주기가 여전히 소모(draining) 중이라 건너뛴 월간 주기와 2회 연속 건너뛴 후의 초기화에 관한 문구입니다."
 cm__log_food_name: "$cm__ab_food_name$"
 cm__log_food_desc: "식량 카테고리 항목: 각 시장의 월간 식량 공급, 수요 및 비율, 목표 대비 판단 기준이 되는 연간 중앙값, 이미 식량을 생산 중인 지역의 수, 그리고 활성화 또는 비활성화되는 모든 지역입니다."
 cm__log_roads_name: "$cm__ab_roads_name$"
 cm__log_roads_desc: "도로 카테고리에서 주문한 각 도로에 대해 위치, 도로 구매 목적(세 가지 중 하나), 그리고 소모된 비용을 한 줄씩 표시합니다."
 cm__log_cleanup_name: "$cm__cleanup_name$"
 cm__log_cleanup_desc: "연례 건물 정리 과정 및 이 과정에서 폐쇄, 축소, 파괴 또는 재개장된 모든 건물에 대한 기록이며, 각 건물의 수익과 판단 기준이 된 하한선이 포함됩니다."
 cm__log_governors_name: "$cm__ab_governors_name$"
 cm__log_governors_desc: "주지사 계획 항목: 부지 선정 및 취소, 마을 및 도시 업그레이드, 배치, 재배치 및 거부, 그리고 행운의 국가 수도 이전."
 cm__log_military_name: "$cm_txt_lucky_nation_military$"
 cm__log_military_desc: "요새를 철거하고 인력 건물을 건설하는 행운의 국가를 위한 문구"
 cm__log_government_name: "운 좋은 국가 정부"
 cm__log_government_desc: "행운의 국가가 관료제를 제거하거나 계층 상호작용을 수행하기 위한 대기열입니다."
 cm__debug__diagnostics_name: "진단"
 cm__placement_finder_debug_path_name: "디버그 진단 활성화"
 cm__placement_finder_debug_path_desc: "추천 총독 및 추천 수도 지도 모드 툴팁에 진단 정보를 추가합니다: 수도에서 각 지역까지의 예상 경로와 각 단계별 비용, 실제 인접도와 비교한 예상 인접도를 보여줍니다."
 cm__debug__probes_name: "조사"
 cm__debug__probes_desc: "모드 작업 로그에 기록된 일회성 진단 정보입니다."
 cm__probe_budget_name: "자동 건설 예산"
 cm__probe_budget_desc: "각 자동 건설 카테고리의 잔액(비용 부족으로 비축 중인 경우 양수, 과다 지출 시 음수), 지난달에 어떤 카테고리도 지출하지 않은 골드, 생산 회수 한도, 그리고 이번 주기에서 건너뛴 시장 내 최적의 후보입니다."
 cm__probe_budget_text: "$cm_txt_run$"
 cm__probe_governors_name: "총독 계획"
 cm__probe_governors_desc: "주지사 계획의 진행 상황: 진행 단계, 보유 및 배치 예정 부지 수, 국고 점유 여부, 비용이 지불된 주지사, 그리고 현재 사용 중인 슬롯 및 좌석 정보입니다."
 cm__probe_governors_text: "$cm_txt_run$"
 cm__probe_military_name: "$cm_txt_lucky_nation_military$"
 cm__probe_military_desc: "국가의 인력 건물 단계, 건설 가능 여부, 수도 쌍 상태, 군사 예산, 그리고 해당 단계를 건설할 수 있는 지역 수 대비 이미 보유한 지역 수입니다."
 cm__probe_military_text: "$cm_txt_run$"
 cm__probe_roads_name: "$cm__ab_roads_name$"
 cm__probe_roads_desc: "인접도, 시장 접근성, 수도 연결 각각에 대해 도로 계획이 보유 중인 경로 수, 이 중 즉시 시작 가능한 수도 연결 경로 수, 현재 건설 중인 도로의 수, 건설 자재 부족으로 인해 차단된 도로의 수, 그리고 해당 범주의 풀에 남은 잔여량입니다."
 cm__probe_roads_text: "$cm_txt_run$"
 cm__probe_log_gate_name: "액션 로그 게이트"
 cm__probe_log_gate_desc: "핵심 상품 로그 범주가 로그 게이트가 읽는 방식과 메뉴가 저장하는 방식으로 두 번 표시되므로, 한쪽에서는 활성화되어 있고 다른 쪽에서는 비활성화된 범주가 표시됩니다."
 cm__probe_log_gate_text: "$cm_txt_run$"
