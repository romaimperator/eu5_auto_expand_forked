 cm__expand_metric: "cm__expand_metric"
 cm__town_rights_free_grants_name: "도시 권리 비용 제거"
 cm__town_rights_free_grants_desc: "활성화 시 도시권 부여에 정부 역량이 소모되지 않으며, 이를 박탈할 때 안정도가 소모되지 않습니다."
 cm__town_rights_min_gov_power_name: "최소 정부 역량"
 cm__town_rights_min_gov_power_desc: "다음 부여 시 정부 수치(정부 형태에 따라 정통성, 공화정 전통, 신앙심, 또는 부족 결속도)가 이 값 미만으로 떨어지게 되면 도시권 자동 부여를 중단합니다."
 cm__allowed_building_overbuild_levels_format: "[CMMV('cm__allowed_building_overbuild_levels')][Select_CString(GreaterThanOrEqualTo_CFixedPoint(CMMV('cm__allowed_building_overbuild_levels'), CMMMapValue('cmm_max', 'cm__allowed_building_overbuild_levels')), '+', '')]"
 cm__auto_build_capital_name: "수도 건물"
 cm__auto_build_capital_desc: "조건이 충족되면 수도 위치에 수도 전용 건물(왕실 법정, 최고 법원, 전쟁 대학 등)을 자동으로 건설합니다. 이 건물들은 아래 목록보다 먼저 건설됩니다."
 cm__urbanize_city_to_megalopolis_name: "도시에서 메갈로폴리스로"
 cm__urbanize_city_to_megalopolis_desc: "수도가 시장 중심지 도시이고 인구가 400,000명 이상이 되면 메갈로폴리스로 업그레이드하십시오."
 cm__megalopolis_ignore_capital_name: "메갈로폴리스: 수도 요구 사항 무시"
 cm__megalopolis_ignore_capital_desc: "수도가 아닌 도시에서도 거대도시 건설을 할 수 있게 합니다."
 cm__megalopolis_ignore_market_center_name: "메갈로폴리스: 시장 중심지 요구 사항 무시"
 cm__megalopolis_ignore_market_center_desc: "시장 중심지가 아닌 도시에 거대 도시 조성을 건설할 수 있게 합니다."
 cm__deurbanize_name: "탈도시화"
 cm__deurbanize_desc: "매달, 아래의 '도시화 금지' 목록에서 해당 RGO 상품이 선택된 소유 지역들을 농촌 정착지로 되돌립니다. 수도, 정복된 지역, 그리고 주청과 같이 인접성을 제공하는 지역은 제외됩니다."
 cm__auto_urbanize_ignore_list_i20_name: "@wool! [ShowGoodsName('wool')] ([GetGlobalVariable('cm_goods_wool').GetGoods.GetDefaultMarketPrice]@gold!)"
 cm__full_automation_name: "Full Automation"
 cm__full_automation__full_automation_name: "Full Automation"
 cm__full_automation__full_automation_desc: "Hands-free construction. Every month the categories below spend the treasury above the Gold Reserve on the best constructions available. Runs alongside the other automation features without touching their settings."
 cm__fa_enabled_name: "Enable Full Automation"
 cm__fa_enabled_desc: "Turn full automation on or off."
 cm__fa_reserve_name: "Gold Reserve"
 cm__fa_reserve_desc: "Full automation never spends your treasury below this amount. Separate from the Gold Reserve on the Settings tab."
 cm__fa_reserve_format: "[CMMV('cm__fa_reserve')]@gold!"
 cm__fa_save_unaffordable_name: "Save for Unaffordable Buildings"
 cm__fa_save_unaffordable_desc: "A category buys the best building it found even when it costs more than its share for the month, and then goes without until later months have made the difference up. While off, each category spends what it can and hands the rest down."
 cm__full_automation__fa_priority_list_name: "Priorities"
 cm__full_automation__fa_priority_list_desc: "Drag to reorder. Categories are worked from the top down each month. Where two categories want the same building, the higher one builds it."
 cm__fa_priority_list_item_column_name: "Category"
 cm__fa_priority_list_i1_name: "Food"
 cm__fa_priority_list_i1_desc: "Watches food supply over the year in markets whose market center you own and, where the median month fell short, enables auto-food on the locations with the highest food potential. Locations it picks glow like player-enabled ones, but the toggle stays yours; they are never turned off unless the location is no longer a rural settlement you own, or you no longer own its market center."
 cm__fa_priority_list_i2_name: "Industry"
 cm__fa_priority_list_i2_desc: "Builds, expands, and upgrades the production buildings and RGOs that repay their cost fastest in tax income. Locations running auto-food are left alone while any kind of worker there is already in short supply."
 cm__fa_priority_list_i3_name: "Price Collapsar"
 cm__fa_priority_list_i3_desc: "Expands production of construction materials to push their prices down. Works in markets whose market center you own. The best-producing locations go first and each is given several levels at once, and producers start even where the workers have not arrived yet. Your capital, locations growing food, and producers that would run at a loss without a subsidy are all skipped."
 cm__fa_priority_list_i4_name: "Roads"
 cm__fa_priority_list_i4_desc: "Builds the road network worth the most for the gold, across three things a road buys: Proximity, Market Access, and connecting a location to your capital. Once a year it works out the best route to every location you own for each of them, then each month starts the stretches that would lift the most Tax Base, counting everything further down the route behind them. Cheap flat corridors are laid first, and the lower two only get the gold in a month the one above has nothing left to lay."
 cm__fa_priority_list_i5_name: "Utilities"
 cm__fa_priority_list_i5_desc: "Builds supporting infrastructure everywhere it fits: capital buildings, the auto-build roster, mercury patios, market center buildings, bailiffs and any unique buildings your country has that raise control, marketplaces, disease-resisting buildings, then granaries last. Control buildings go to the wealthiest locations first, and marketplaces to the locations with the least market access first."
 cm__fa_priority_list_i6_name: "Building Cleanup"
 cm__fa_priority_list_i6_desc: "Once a year, closes production buildings that have stopped making money and are not subsidized, and destroys them instead where the location is within ten levels of the building levels it supports. Buildings it closed reopen once the type is earning again in that market, and are destroyed later if their location runs out of room. @farming_village! [ShowBuildingTypeNameWithNoTooltip('farming_village')] is never closed or destroyed."
 cm__fa_priority_list_i7_name: "Governors"
 cm__fa_priority_list_i7_desc: "Plans where your governors should sit and puts them there, taking the best location first. It plans again whenever a governor slot opens, and every twenty-five years otherwise. Single-player only."
 cm__fa_priority_list_i8_name: "Urban Rights"
 cm__fa_priority_list_i8_desc: "Grants urban rights across your towns and cities. [ShowTownRightsNameWithNoTooltip('granary_town')] comes first, then one specialization right, drawn at random from those that suit the goods made around the location."
 cm__fa_priority_list__budget_name: "Budget Share"
 cm__fa_priority_list__budget_desc: "The share of the treasury above the Gold Reserve this category may spend each month."
 cm__fa_priority_list__budget_postfix: "%"
 cm__fa_priority_list__enabled_name: "Enabled"
 cm__fa_priority_list__enabled_desc: "Let this category build."
 cm__full_automation__fa_industry_name: "Industry"
 cm__full_automation__fa_industry_desc: "Settings for the Industry category above."
 cm__fa_industry_algorithm_name: "Build Strategy"
 cm__fa_industry_algorithm_desc: "How industry picks what to construct."
 cm__fa_industry_algorithm_option_1_name: "Greedy"
 cm__fa_industry_algorithm_option_1_desc: "Build the fastest-payback options first, and only those close to the best place found to make the same goods."
 cm__fa_industry_max_rel_roi_name: "Max Relative ROI"
 cm__fa_industry_max_rel_roi_desc: "How much slower than the best place found to make the same goods a building or upgrade may repay its cost and still be built. At 30%, if the best repays in 10 years, only those repaying within 13 years are built; anything slower waits. At 0%, only the best producer of each goods is built each month. At 100%+ there is no limit and only Max Payback Years applies. Every building making the same goods is measured together, whatever kind it is. RGO expansions are always built in payback order."
 cm__fa_industry_max_rel_roi_format: "[CMMV('cm__fa_industry_max_rel_roi')]%[Select_CString(GreaterThanOrEqualTo_CFixedPoint(CMMV('cm__fa_industry_max_rel_roi'), CMMMapValue('cmm_max', 'cm__fa_industry_max_rel_roi')), '+', '')]"
 cm__fa_industry_min_roi_name: "Max Payback Years"
 cm__fa_industry_min_roi_desc: "Only constructions whose tax income repays the build cost within this many years are considered. Set to 0 to disable the check."
 cm__fa_industry_min_roi_format: "[CMMV('cm__fa_industry_min_roi')]y @efficiency!"
 cm__full_automation__fa_collapsar_name: "Price Collapsar"
 cm__full_automation__fa_collapsar_desc: "Settings for the Price Collapsar category above. Materials are worked from the top of the list down, with RGOs expanded before producer buildings."
 cm__fa_collapsar_target_name: "Price Target"
 cm__fa_collapsar_target_desc: "The price at which construction for a material stops, relative to its base price. At -33%, producers are built until the material trades 33% below base price. At 0%, until it reaches base price. At +33%, only while it costs more than 33% above base."
 cm__fa_collapsar_target_format: "[CMMV('cm__fa_collapsar_target')]%"
 cm__fa_collapsar_item_column_name: "Material"
 cm__fa_collapsar_i1_name: "@masonry! [ShowGoodsName('masonry')]"
 cm__fa_collapsar_i2_name: "@lumber! [ShowGoodsName('lumber')]"
 cm__fa_collapsar_i3_name: "@sand! [ShowGoodsName('sand')]"
 cm__fa_collapsar_i4_name: "@glass! [ShowGoodsName('glass')]"
 cm__fa_collapsar__enabled_name: "Enabled"
 cm__fa_collapsar__enabled_desc: "Work to lower this material's price."
 cm__full_automation__fa_food_name: "Food"
 cm__full_automation__fa_food_desc: "Settings for the Food category above."
 cm__fa_food_target_name: "Surplus Target"
 cm__fa_food_target_desc: "A market gets more food locations until its supply reaches this share of its demand. At 125%, food is expanded in any market whose median month of the year did not reach a 25% surplus. Raise it to keep more of a buffer, lower it to only help markets closer to a shortage."
 cm__fa_food_target_format: "[CMMV('cm__fa_food_target')]%"
 cm__fa_food_min_potential_name: "Minimum Food Potential"
 cm__fa_food_min_potential_desc: "Auto-food is only enabled on locations whose food potential per RGO level reaches this score, the same score the $mapmode_cm_location_food_potential_name$ map mode shows. Raise it to hold out for better farmland, lower it to accept weaker land."
 cm__fa_food_min_potential_format: "[CMMV('cm__fa_food_min_potential')]"
 cm__full_automation__fa_urban_rights_name: "Urban Rights"
 cm__full_automation__fa_urban_rights_desc: "Settings for the Urban Rights category above."
 cm__fa_urban_rights_window_name: "Fit Threshold"
 cm__fa_urban_rights_window_desc: "How well a specialization right must suit a location, next to the best-suited right there, to be in the running. At 50%, any right that suits it at least half as well can be drawn, and the better-suited ones are drawn more often. At 100%, only the best-suited right is granted."
 cm__fa_urban_rights_window_format: "[CMMV('cm__fa_urban_rights_window')]%"
 cm__fa_urban_rights_reserve_name: "Government Power Reserve"
 cm__fa_urban_rights_reserve_desc: "No urban right is granted when paying for it would drop your government power (legitimacy, republican tradition, devotion, or horde unity, depending on government type) below this value."
 cm__fa_urban_rights_expand_name: "Expand the Boosted Industries"
 cm__fa_urban_rights_expand_desc: "When a specialization right is granted, also turn on auto-expand in that location for the industries the right boosts, and for its raw goods where the location produces them. The same as right-clicking a grant button on the Recommended Urban Rights map."
 cm__full_automation__fa_cleanup_name: "Building Cleanup"
 cm__full_automation__fa_cleanup_desc: "Settings for the Building Cleanup category above."
 cm__fa_cleanup_min_profit_name: "Minimum Profit"
 cm__fa_cleanup_min_profit_desc: "A building making less than this each month counts as not worth running, and is closed or destroyed unless it is subsidized. At most half of a building type's open buildings in a market go at once."
 cm__fa_cleanup_min_profit_format: "[Divide_CFixedPoint(CMMV('cm__fa_cleanup_min_profit'), '(CFixedPoint)100')|2]@gold!"
 cm__fa_cleanup_core_goods_name: "Prioritize Construction Materials"
 cm__fa_cleanup_core_goods_desc: "Hold buildings that mostly consume @masonry![ShowGoodsNameWithNoTooltip('masonry')], @lumber![ShowGoodsNameWithNoTooltip('lumber')], @sand![ShowGoodsNameWithNoTooltip('sand')] or @glass![ShowGoodsNameWithNoTooltip('glass')] to twice the Minimum Profit, or 0.1@gold!, whichever is higher. Buildings that produce one of the four are judged on the normal Minimum Profit."
 cm__fa_cleanup_auto_food_name: "Clear Auto-Food Locations"
 cm__fa_cleanup_auto_food_desc: "Where auto-food is running and any kind of worker is already in short supply, destroy the production buildings that are not making food. A @market_village! [ShowBuildingTypeNameWithNoTooltip('market_village')] is cut back to one level rather than destroyed."
 cm__full_automation__fa_roads_name: "Roads"
 cm__full_automation__fa_roads_desc: "Settings for the Roads category above."
 cm__fa_roads_proximity_name: "Proximity"
 cm__fa_roads_proximity_desc: "Lay the road stretches that raise Proximity the most for the gold, counting every location further down the route behind them."
 cm__fa_roads_market_access_name: "Market Access"
 cm__fa_roads_market_access_desc: "Lay the road stretches that raise Market Access the most for the gold. Only spends in a month the Proximity stretches have none left to lay."
 cm__fa_roads_capital_name: "Capital Connection"
 cm__fa_roads_capital_desc: "Lay road stretches to connect your locations to your capital, working outwards from the ones already connected. Only spends in a month the Proximity and Market Access stretches have none left to lay."
 cm__full_automation__fa_governors_name: "Governors"
 cm__full_automation__fa_governors_desc: "Settings for the Governors category above."
 cm__fa_gov_move_seats_name: "Allow Moving Governors"
 cm__fa_gov_move_seats_desc: "When every governor slot is full, take a governor down and put one up at a better location instead. The better location has to be a City already, or score more than 10% higher than the one it replaces. With this off, governors only go into slots that are empty."
 cm__fa_gov_prepare_sites_name: "Allow Preparing New Locations"
 cm__fa_gov_prepare_sites_desc: "Consider locations that cannot take a governor yet and get them ready first, founding a Town or City there and building a road to your capital. With this off, only locations that are already a City with a road to your capital are considered."
 cm__map_modes_name: "Mapmodes"
 cm__map_modes__placement_finder_name: "Recommended Capital & Governor Location"
 cm__map_modes__placement_finder_desc: "Settings for the Recommended Governor and Recommended Capital placement mapmodes."
 cm__placement_finder_method_name: "Placement Finder Scoring"
 cm__placement_finder_method_desc: "How the Recommended Governor and Recommended Capital mapmodes rank your locations."
 cm__placement_finder_method_option_1_name: "Tax Base"
 cm__placement_finder_method_option_1_desc: "Rank by how much a governor or capital placed there would raise your total tax base. Wealthier locations count for more."
 cm__placement_finder_method_option_2_name: "Proximity"
 cm__placement_finder_method_option_2_desc: "Rank by how much proximity a governor or capital placed there would add."
 cm__placement_finder_roads_name: "Land Infrastructure"
 cm__placement_finder_roads_desc: "Whether the Recommended Governor and Recommended Capital mapmodes assume ideal land infrastructure or use what you have actually built."
 cm__placement_finder_roads_option_1_name: "Current"
 cm__placement_finder_roads_option_1_desc: "Use the roads you have actually built."
 cm__placement_finder_roads_option_2_name: "Max Roads"
 cm__placement_finder_roads_option_2_desc: "Assume the best road you have unlocked is built on every connection."
 cm__placement_finder_roads_option_3_name: "Best Possible"
 cm__placement_finder_roads_option_3_desc: "Assume the best road you have unlocked is built on every connection, and every unlocked building that improves land proximity is built wherever eligible."
 cm__placement_finder_naval_name: "Naval Infrastructure"
 cm__placement_finder_naval_desc: "Whether the Recommended Governor and Recommended Capital mapmodes assume ideal naval infrastructure or use your current harbor capacity and naval presence."
 cm__placement_finder_naval_option_1_name: "Current"
 cm__placement_finder_naval_option_1_desc: "Use your current harbor capacity and naval presence."
 cm__placement_finder_naval_option_2_name: "Max Presence"
 cm__placement_finder_naval_option_2_desc: "Assume full naval presence everywhere, with your current harbor capacity."
 cm__placement_finder_naval_option_3_name: "Best Possible"
 cm__placement_finder_naval_option_3_desc: "Assume full naval presence and the best harbor buildings you have unlocked, built in every coastal location."
 cm__placement_finder_accuracy_name: "Search Accuracy"
 cm__placement_finder_accuracy_desc: "How thoroughly the Recommended Governor and Recommended Capital mapmodes search for the best locations. Skipped locations show as black."
 cm__placement_finder_accuracy_option_1_name: "Exhaustive"
 cm__placement_finder_accuracy_option_1_desc: "Evaluate every location. The most accurate and the slowest."
 cm__placement_finder_accuracy_option_2_name: "Thorough"
 cm__placement_finder_accuracy_option_2_desc: "Skip locations that cannot rank among your top three. The top three and their scores are identical to Exhaustive, just faster."
 cm__placement_finder_accuracy_option_3_name: "Balanced"
 cm__placement_finder_accuracy_option_3_desc: "Skip locations that cannot be the single best. The best location is still guaranteed exact; the 2nd and 3rd markers can occasionally differ."
 cm__placement_finder_accuracy_option_4_name: "Quick"
 cm__placement_finder_accuracy_option_4_desc: "Also skip locations very unlikely to be the best. The best location found is within 20% of the true best and usually still exact."
 cm__placement_finder_accuracy_option_5_name: "Fastest"
 cm__placement_finder_accuracy_option_5_desc: "Evaluate the most promising location of each province, then refine around the leaders. Much faster for large countries; can miss the best location."
 cm__debug_name: "Debug"
 cm__debug__logging_name: "Action Log"
 cm__debug__logging_desc: "Which of this mod's actions are written to the mod action log."
 cm__log_cycle_name: "Construction Cycle"
 cm__log_cycle_desc: "Lines for a monthly cycle that was skipped because the previous one was still draining, and for the reset that follows two skips in a row."
 cm__log_industry_name: "Industry"
 cm__log_industry_desc: "Lines for every building the Industry category queues and every raw goods expansion it considers, with the payback and income behind each."
 cm__log_collapsar_name: "Price Collapsar"
 cm__log_collapsar_desc: "Lines following one location through a Price Collapsar cycle: the market's shortfall and the levels it asked for, then what that location was given, scored and built. Mark the location first with the console command effect location:<key> = { cm_fa_col_watch_on = yes }."
 cm__log_food_name: "Auto-Food"
 cm__log_food_desc: "Lines for the Food category: each market's monthly food supply, demand and ratio, the yearly median that ratio is judged on against the target, the count of locations already growing food there, and every location it enables or disables."
 cm__log_roads_name: "Roads"
 cm__log_roads_desc: "One line for every road the Roads category orders, naming the location, which of the three things the road was bought for, and what it cost."
 cm__log_cleanup_name: "Building Cleanup"
 cm__log_cleanup_desc: "Lines for the yearly Building Cleanup pass and for every building it closes, trims, destroys or reopens, with the profit behind each and the floor it was judged against."
 cm__log_governors_name: "Governors"
 cm__log_governors_desc: "Lines for the governor plan: sites picked and dropped, town and city upgrades, placements, relocations and refusals, plus a lucky nation's capital move."
 cm__log_military_name: "Lucky Nation Military"
 cm__log_military_desc: "Lines for a lucky nation destroying forts and building manpower buildings."
 cm__log_government_name: "Lucky Nation Government"
 cm__log_government_desc: "Lines for a lucky nation removing a bureaucracy or taking an estate action."
 cm__debug__diagnostics_name: "Diagnostics"
 cm__placement_finder_debug_path_name: "Enable Debug Diagnostics"
 cm__placement_finder_debug_path_desc: "Adds a diagnostic block to the Recommended Governor and Recommended Capital mapmode tooltips: the predicted route from your capital to each location with the cost of each jump, and the predicted proximity compared against your actual proximity."
 cm__debug__probes_name: "Probes"
 cm__debug__probes_desc: "One-off diagnostics written to the mod action log."
 cm__probe_budget_name: "Full Automation Budget"
 cm__probe_budget_desc: "Each Full Automation category's balance, positive where it is holding gold back for a pick it cannot yet afford and negative where it owes from overspending, with the Industry payback limit and the best candidate waiting in a market this cycle passed over."
 cm__probe_budget_text: "Run"
 cm__probe_governors_name: "Governor Plan"
 cm__probe_governors_desc: "Where the governor plan has got to: its phase, how many sites it holds and has still to place, whether it is holding the treasury, the governors paid for, and the slots and seats it is working against."
 cm__probe_governors_text: "Run"
 cm__probe_military_name: "Lucky Nation Military"
 cm__probe_military_desc: "The manpower building tier the country is on, whether it can build it, the state of the capital pair, the Military budget, and how many locations can take the tier against how many already have it."
 cm__probe_military_text: "Run"
 cm__probe_industry_anchors_name: "Industry Anchors"
 cm__probe_industry_anchors_desc: "One line per good with the best payback Industry has recorded for it and the payback limit that sets, naming the building and location behind each."
 cm__probe_industry_anchors_text: "Run"
 cm__probe_industry_rgo_name: "Industry Raw Goods"
 cm__probe_industry_rgo_desc: "One line for every reason Industry passed over a location's raw goods, or a single line when it passed over none. Reads the capital unless you mark a location with the console command effect location:<key> = { cm_fa_col_watch_on = yes }."
 cm__probe_industry_rgo_text: "Run"
 cm__probe_collapsar_name: "Price Collapsar"
 cm__probe_collapsar_desc: "Every number Price Collapsar reads at a location, each beside the game's own reading of it, then what that location's market could absorb in a cycle. Reads the capital unless you mark a location with the console command effect location:<key> = { cm_fa_col_watch_on = yes }; the capital is never a Price Collapsar candidate, so mark a location to read one it would build in."
 cm__probe_collapsar_text: "Run"
 cm__probe_roads_name: "Roads"
 cm__probe_roads_desc: "How many corridors the Roads plan is holding for each of proximity, market access and capital connection, how many of the capital ones can be started yet, how many roads are already being built, and what is left in the category's pool."
 cm__probe_roads_text: "Run"
 cm__probe_log_gate_name: "Action Log Gate"
 cm__probe_log_gate_desc: "The Price Collapsar log category twice, as the log gate reads it and as the menu stores it, so a category that is on in one and off in the other shows up."
 cm__probe_log_gate_text: "Run"
