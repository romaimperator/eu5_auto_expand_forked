 cm__expand_metric_name: "자동 확장 지표"
 cm__expand_metric_desc: "자동 확장이 건물 또는 RGO 단계 추가 여부를 결정할 때 사용할 기준을 선택하십시오."
 cm__expand_metric_option_1_name: "@income! 조세 수입"
 cm__expand_metric_option_1_desc: "월간 조세 수입이 설정된 최소 조세 수입 이상일 때만 새로운 단계를 추가합니다."
 cm__expand_metric_option_2_name: "@wealth! 수익"
 cm__expand_metric_option_2_desc: "총 월간 수익이 설정된 최소 수익 이상일 때만 새로운 단계를 추가합니다."
 cm__expand_metric_option_3_name: "@efficiency! 투자 수익률 (조세)"
 cm__expand_metric_option_3_desc: "설정한 최대 투자 회수 기간 내에 조세 수입이 건설 비용을 회수할 수 있을 때만 새로운 단계를 추가합니다."
 cm__expand_metric_option_4_name: "@efficiency! ROI (수익)"
 cm__expand_metric_option_4_desc: "설정된 최대 ROI 기간 내에 수익이 건설 비용을 회수할 수 있는 경우에만 새로운 단계를 추가합니다."
