l_korean:
 # Mod
 cm_name: "건설 관리자"
 cm_desc: "A massive quality of life mod that adds new automation, filters, and map modes, to greatly improve the EU5 construction experience."

 # Settings (settings) Tab
 cm__settings_name: "설정"
 ## Global Control (settings) Group
 cm__pause_auto_expand_name: "자동화 일시정지"
 cm__pause_auto_expand_desc: "모든 자동화 기능을 일시 정지합니다: 건물 자동 확장, RGO 자동 확장, 모든 건물 업그레이드, 자동 건설, 자동 식량 관리, 자동 도시화."
 cm__minimum_gold_name: "금 보유고"
 cm__minimum_gold_desc: "유지할 최소 보유 금입니다. 국고가 이 금액 미만으로 떨어질 경우 건설이 대기열에 추가되지 않습니다. 자동 도시화 업그레이드(자체 금 설정 사용)를 제외한 모든 자동화 기능에 적용됩니다."
 cm__minimum_gold_format: "[CMMV('cm__minimum_gold')]@gold!"
 cm__allowed_building_overbuild_levels_name: "초과 건설 제한"
 cm__allowed_building_overbuild_levels_desc: "해당 지역의 자동 확장이 새로운 건설 대기열 등록을 중단하기 전까지, 지원 건물 단계 상한을 초과하여 건설할 수 있는 총 건물 단계 수입니다. 0으로 설정하면 초과 건설을 허용하지 않습니다."

 ## Priority List Group
 cm__settings__priority_list_name: "건설 자동화"
 cm__settings__priority_list_desc: "드래그하여 기능 우선순위를 변경하십시오. 매달 활성화된 기능이 위에서 아래로 실행됩니다. 자동 확장의 경우, 각 기능 옆의 수치는 '자동 확장 척도'에서 선택한 지표에 따라 확장을 건설하기 위해 필요한 최소 효율을 의미합니다. 조세 수입 및 이윤은 레벨당 최소 월간 골드 수익을, 투자 수익률(ROI)은 건설 비용을 회수하는 데 걸리는 최대 연수입니다 (0 = 비활성화). '최소 할인'은 허용되는 최대 건설 자재 가격 인상폭을 설정합니다 (-33% = 저렴할 때만, 0 = 기본 가격일 때, +33% = 가격이 올랐을 때도)."
 cm__priority_list_item_column_name: "기능"
 cm__priority_list_i1_name: "건물 자동 확장"
 cm__priority_list_i1_desc: "수익성이 있고 팝이 가용하며 금 보유량이 금 비축액보다 높게 유지될 때 다단계 생산 및 비생산 건물을 자동으로 확장합니다. 자동 확장이 활성화된 지역에만 적용됩니다."
 cm__priority_list_i2_name: "RGO 자동 확장"
 cm__priority_list_i2_desc: "RGO 자동 확장이 활성화된 거점에서 노동력이 가용하고 자원이 허용될 때 RGO 단계를 자동으로 확장합니다."
 cm__priority_list_i3_name: "모든 건물 자동 업그레이드"
 cm__priority_list_i3_desc: "자동 확장 활성화 여부와 관계없이, 구식이 된 모든 건물을 자동으로 업그레이드합니다."
 cm__priority_list_i4_name: "자동 건설"
 cm__priority_list_i4_desc: "자동 건설 탭에서 설정한 순서와 설정에 따라 지역당 하나씩만 건설 가능한 건물(의회, 도서관 등)을 자동으로 건설합니다."
 cm__priority_list_i5_name: "자동 식량"
 cm__priority_list_i5_desc: "농촌 지역에서 식량을 생산하는 RGO와 건물을 자동으로 건설하며, 한계 식량 생산량이 가장 높은 옵션을 선택합니다. '자동 식량' 탭에서 설정할 수 있습니다."
 cm__priority_list_i6_name: "자동 도시화"
 cm__priority_list_i6_desc: "매달 거점 등급을 승급시킵니다: 농촌 정착지를 마을로, 마을을 도시로 승급시킵니다. 농촌에서 마을로 승급하려면 인구 30,000명(즉시 도시 승급 가능)에 도달하거나, 인구 상한까지 1,000명 이내여야 합니다(그렇지 않으면 농촌 상한에서 성장이 정체됩니다). 통합되지 않은 거점은 제외됩니다. 자동 도시화(Auto-Urbanize) 탭에서 설정할 수 있습니다."
 cm__priority_list_i7_name: "수도 건물 자동 건설"
 cm__priority_list_i7_desc: "조건이 충족되면 수도 소재지에 수도 전용 건물(왕실 법정, 최고 법원, 육군 대학 등)을 자동으로 건설합니다."
 cm__priority_list__enabled_name: "활성화됨"
 cm__priority_list__enabled_desc: "이 기능을 활성화하거나 비활성화합니다. 비활성화된 기능은 매달 건너뜁니다."
 cm__priority_list__min_profit_name: "최소 조세 수입"
 cm__priority_list__min_profit_desc: "건설 대기열에 추가되기 위해 레벨당 필요한 최소 월간 금입니다. 이 확인 과정을 비활성화하려면 0으로 설정하십시오."
 cm__priority_list__min_profit_postfix: "@gold!"
 cm__priority_list__min_discount_name: "최소 할인"
 cm__priority_list__min_discount_desc: "허용되는 최대 건설 자재 가격 할증률입니다. -33%일 경우 자재 가격이 기본 가격보다 33% 낮을 때만 건설합니다. 0%일 경우 기본 가격 이하일 때만 건설합니다. +33%일 경우 가격이 기본 가격보다 33% 높더라도 건설합니다."
 cm__priority_list__min_discount_postfix: "%"
 cm__priority_list__min_discount_prefix_high: "#R "
 cm__priority_list__min_discount_postfix_high: "%#!"
 cm__priority_list__min_discount_prefix_low: "#G "
 cm__priority_list__min_discount_postfix_low: "%#!"

