 cm__ab_roads_proximity_name: "$cm_txt_proximity$" # NO-TRANSLATE
 cm__ab_roads_proximity_desc: "비용 대비 인접도를 가장 많이 높이는 도로 구간을 건설하며, 해당 구간 뒤로 이어지는 경로상의 모든 지역을 계산에 포함합니다."
 cm__ab_roads_market_access_name: "시장 접근성"
 cm__ab_roads_market_access_desc: "비용 대비 시장 접근성을 가장 많이 높이는 도로 구간을 건설합니다. 이번 달에 근접성 건설이 이루어지지 않았으며, 아직 비용을 감당할 수 없는 구간을 위해 자금을 비축하고 있지 않은 경우에만 지출합니다."
 cm__ab_roads_capital_name: "수도 연결"
 cm__ab_roads_capital_desc: "이미 연결된 지역부터 바깥쪽으로 도로 구간을 건설하여 수도와 연결합니다. 인접도와 시장 접근성 모두 아무것도 건설하지 않았으며, 아직 감당할 수 없는 구간을 위해 저축 중인 상태가 아닌 달에만 비용을 지출합니다."
 cm__ab_roads_min_discount_name: "$cm_txt_min_discount$" # NO-TRANSLATE
 cm__ab_roads_min_discount_desc: "허용되는 최대 건설 자재 가격 할증입니다. -33%일 경우, 필요한 목재, 석재, 모래의 가격이 기본 가격보다 33% 낮을 때만 건설을 진행합니다. 0%일 경우, 기본 가격 이하일 때만 진행합니다. +33%일 경우에는 가격이 기본 가격보다 33% 높을 때도 건설을 진행합니다."
 cm__ab_roads_min_discount_format: "[CMMV('cm__ab_roads_min_discount')]%" # NO-TRANSLATE
 cm__ab_roads_run_now_name: "도로 재계획 강제"
 cm__ab_roads_run_now_desc: "계획 주기가 돌아올 때까지 기다리는 대신, 지금 즉시 새로 부설할 도로 구간을 산출합니다. 멀티플레이어에서는 이 기능만이 유일하게 도로 구간을 산출합니다. 이 기능 자체는 도로를 직접 건설하지 않으며, 산출된 구간은 도로 예산이 허용하는 범위 내에서 건설됩니다."
 cm__ab_roads_run_now_text: "$cm_txt_run_now$" # NO-TRANSLATE
 cm__ab_roads__debug_name: "$cm_txt_debug$" # NO-TRANSLATE
 cm__dbg_run_roads_name: "도로 건설 실행"
 cm__dbg_run_roads_desc: "월이 바뀌기를 기다리지 않고 현재 계획에 따라 도로 구간을 즉시 건설합니다. 할당된 예산의 잔액을 사용하므로, 이번 달 예산을 이미 모두 소모한 범주는 건설을 진행하지 않습니다. 자동화 일시정지 상태여도 이 명령은 중단되지 않습니다."
 cm__dbg_run_roads_text: "$cm_txt_run_now$" # NO-TRANSLATE
 cm__ab_governors__ab_governors_name: "$cm__ab_governors_name$" # NO-TRANSLATE
 cm__ab_gov_move_seats_name: "총독 이동 허용"
 cm__ab_gov_move_seats_desc: "모든 총독 슬롯이 가득 찼을 때, 기존 총독을 해임하고 대신 더 나은 위치에 배치합니다. 더 나은 위치는 이미 도시(City)이거나 교체 대상보다 점수가 10% 이상 높아야 합니다. 이 설정을 끄면 총독은 비어 있는 슬롯에만 배치됩니다."
 cm__ab_gov_prepare_sites_name: "신규 지역 준비 허용"
 cm__ab_gov_prepare_sites_desc: "아직 총독을 임명할 수 없는 지역을 우선적으로 고려하여 그곳에 읍이나 도시를 건설하고 수도까지 도로를 연결합니다. 이 설정을 비활성화하면 이미 도시이면서 수도까지 도로가 연결된 지역만 고려 대상이 됩니다."
 cm__ab_governors__debug_name: "$cm_txt_debug$" # NO-TRANSLATE
 cm__dbg_run_governors_name: "주지사 계획 시작"
 cm__dbg_run_governors_desc: "통상적인 25년 주기가 아닌 지금 즉시 새로운 계획을 시작합니다. 계획은 평소처럼 이후 몇 달 동안 각 단계를 거쳐 진행됩니다. 여전히 평화 상태와 수도가 필요하며, 이미 실행 중인 다른 탐색이 없어야 합니다."
 cm__dbg_run_governors_text: "시작"
 cm__urbanization_name: "도시화"
 cm__auto_urbanize_enabled_name: "$cm_txt_enabled$" # NO-TRANSLATE
 cm__auto_urbanize_enabled_desc: "자동 도시화를 활성화하거나 비활성화합니다."
 cm__auto_urbanize_min_discount_name: "$cm_txt_min_discount$" # NO-TRANSLATE
 cm__auto_urbanize_min_discount_desc: "허용되는 최대 건설 자재 가격 할증폭입니다. -33%에서는 자재 가격이 기본 가격보다 33% 낮을 때만 마을과 도시를 건설합니다. 0%에서는 기본 가격 이하일 때만 건설합니다. +33%에서는 가격이 기본 가격보다 33% 높더라도 건설합니다."
 cm__auto_urbanize_min_discount_format: "[CMMV('cm__auto_urbanize_min_discount')]%" # NO-TRANSLATE
 cm__auto_urbanize__debug_name: "$cm_txt_debug$" # NO-TRANSLATE
 cm__dbg_run_auto_urbanize_name: "자동 도시화 실행"
 cm__dbg_run_auto_urbanize_desc: "이제 월이 바뀌기를 기다리는 대신 등급 업그레이드를 즉시 실행합니다. 이 작업이 시작되는 주기에는 다른 항목이 건설되지 않으며, '자동화 일시정지'의 영향을 받지 않습니다."
 cm__dbg_run_auto_urbanize_text: "$cm_txt_run_now$" # NO-TRANSLATE
 cm__auto_town_rights__auto_town_rights_specialization_name: "스마트 특성화 권리 부여기"
 cm__auto_town_rights__auto_town_rights_specialization_desc: "사용자 지정 권한 부여기가 자신의 차례를 마친 후 부여됩니다."
 cm__auto_grant_specialization_name: "전문화 도시 권리 자동 부여"
 cm__auto_grant_specialization_desc: "지역마다 주변 생산 상품에 적합한 전문화 권리를 하나씩 부여하며, 그중 금 가치가 가장 높은 것을 선택합니다."
 cm__specialization_window_name: "적합도 임계값"
 cm__specialization_window_desc: "특성화 권리가 후보에 오르기 위해 해당 지역에서 가장 적합한 권리와 비교하여 얼마나 적합해야 하는지를 결정합니다. 50%일 경우, 가장 적합한 권리의 최소 절반만큼 적합한 모든 권리가 후보에 오르며, 그중 금 가치가 가장 높은 것이 부여됩니다. 100%일 경우, 가장 적합한 권리만이 부여됩니다."
 cm__specialization_window_format: "[CMMV('cm__specialization_window')]%" # NO-TRANSLATE
 cm__specialization_expand_name: "부스트된 산업 확장"
 cm__specialization_expand_desc: "특성화 특권이 부여될 때, 해당 특권이 강화하는 산업과 해당 지역에서 생산되는 원자재의 자동 확장도 함께 활성화합니다. '추천 도시 특권' 지도에서 부여 버튼을 우클릭하는 것과 동일합니다."
 cm__auto_town_rights__debug_name: "$cm_txt_debug$" # NO-TRANSLATE
 cm__dbg_run_town_rights_name: "자동 도시 권리 부여 실행"
 cm__dbg_run_town_rights_desc: "월이 바뀌기를 기다리는 대신 즉시 실행하며, 활성화된 목록을 먼저 처리한 후 특성화 권한을 처리합니다. 자동화 일시정지의 영향을 받지 않습니다."
 cm__dbg_run_town_rights_text: "$cm_txt_run_now$" # NO-TRANSLATE
 cm__miscellaneous_name: "기타"
 cm__cleanup_name: "건물 정리"
 cm__cleanup__cleanup_name: "$cm__cleanup_name$" # NO-TRANSLATE
 cm__cleanup_close_open_name: "건물 폐쇄 및 개방"
 cm__cleanup_close_open_desc: "일 년에 한 번, 수익이 발생하지 않고 보조금을 받지 않는 생산 건물을 폐쇄합니다. 폐쇄된 건물은 해당 시장에서 동일한 유형의 건물이 다시 수익을 내기 시작하면 재개장합니다. @farming_village! [ShowBuildingTypeNameWithNoTooltip('farming_village')] 및 @market_village! [ShowBuildingTypeNameWithNoTooltip('market_village')]은 절대로 폐쇄되지 않습니다."
 cm__cleanup_destroy_name: "건물 파괴"
 cm__cleanup_destroy_desc: "1년에 한 번, 수익이 나지 않는 생산 건물 중 해당 지역이 지원하는 건물 레벨의 10레벨 이내인 것과, 이미 폐쇄되었으나 지역의 공간이 부족해진 건물을 파괴합니다. @market_village! [ShowBuildingTypeNameWithNoTooltip('market_village')]은(는) 대신 1레벨로 축소됩니다. @fruit_orchard! [ShowBuildingTypeNameWithNoTooltip('fruit_orchard')]은(는) 수익에 관계없이 파괴된 후 다시 건설되지 않으며, @farming_village! [ShowBuildingTypeNameWithNoTooltip('farming_village')]은(는) 결코 파괴되지 않습니다."
 cm__cleanup_min_profit_name: "단계당 최소 수익"
 cm__cleanup_min_profit_desc: "월별 단계당 수익이 이 수치 미만인 건물은 가동 가치가 없는 것으로 간주되어, 보조금을 지급하지 않는 한 폐쇄되거나 파괴됩니다."
 cm__cleanup_min_profit_format: "[Divide_CFixedPoint(CMMV('cm__cleanup_min_profit'), '(CFixedPoint)100')|2]@gold!" # NO-TRANSLATE
 cm__cleanup_max_changed_name: "패스당 최대 변경 수"
 cm__cleanup_max_changed_desc: "시장에서 연간 주기마다 변경될 수 있는 특정 건물 유형의 비율입니다. 50%일 때, 운영 중인 건물의 절반이 폐쇄 또는 파괴될 수 있고 폐쇄된 건물의 절반이 재개장될 수 있습니다. 최소치는 1이므로 해당 유형의 마지막 남은 건물도 폐쇄될 수 있습니다."
 cm__cleanup_max_changed_format: "[CMMV('cm__cleanup_max_changed')]%" # NO-TRANSLATE
 cm__cleanup_core_goods_name: "건설 자재 우선순위 설정"
 cm__cleanup_core_goods_desc: "주로 @masonry![ShowGoodsNameWithNoTooltip('masonry')], @lumber![ShowGoodsNameWithNoTooltip('lumber')], @sand![ShowGoodsNameWithNoTooltip('sand')] 또는 @glass![ShowGoodsNameWithNoTooltip('glass')]을(를) 소비하는 건물을 단계당 최소 이익의 2배 또는 단계당 0.1@gold! 중 더 높은 값으로 유지합니다. 이 기능이 활성화된 동안 네 가지 중 하나를 생산하는 건물은 절대 폐쇄되거나 파괴되지 않습니다."
 cm__cleanup_auto_food_name: "자동 식량 지역 초기화"
 cm__cleanup_auto_food_desc: "자동 식량이 실행 중이고 노동자가 이미 부족한 경우, 식량을 생산하지 않는 생산 건물을 파괴합니다. @market_village! [ShowBuildingTypeNameWithNoTooltip('market_village')]은(는) 파괴하는 대신 1단계로 축소합니다."
 cm__cleanup_run_now_name: "건물 정리 실행"
 cm__cleanup_run_now_desc: "연간 처리를 기다리는 대신 지금 정리를 실행합니다."
 cm__cleanup_run_now_text: "$cm_txt_run_now$" # NO-TRANSLATE
 cm__placement_finder_method_option_3_name: "인구"
 cm__placement_finder_method_option_3_desc: "해당 위치에 배치된 총독이나 수도가 추가할 근접도에 따라 순위를 매기며, 각 지역의 거주 인구수를 기준으로 계산합니다. 인구가 많은 지역에서의 적은 이득은 인구가 적은 지역에서의 큰 이득보다 가치가 낮습니다."
 cm__log_production_name: "$cm__ab_production_name$" # NO-TRANSLATE
 cm__log_production_desc: "생산 카테고리가 대기열에 추가한 모든 건물과 검토 중인 모든 원자재 확장에 대한 항목이며, 각각의 회수 기간과 수입이 표시됩니다."
 cm__log_core_name: "$cm__ab_core_name$" # NO-TRANSLATE
 cm__log_core_desc: "핵심 상품 주기를 통해 특정 지역을 추적하는 로그입니다. 시장의 부족분과 요청 수치, 그리고 해당 지역에 할당된 자원, 계산된 점수 및 건설 내역을 보여줍니다. 먼저 콘솔 명령 효과 location:<key> = { cm_ab_core_watch_on = yes }를 사용하여 해당 지역을 표시하십시오."
 cm__debug__rotation_name: "시장 순환"
 cm__debug__rotation_desc: "대규모 국가는 시장을 한 번에 몇 개씩 순차적으로 처리하며, 모든 자동화 기능은 현재 활성화된 세트 내에서 건설을 수행합니다."
 cm__dbg_rotate_slice_name: "시장 순환"
 cm__dbg_rotate_slice_desc: "다음 시장 세트로 넘어갑니다. '지금 실행' 버튼 중 하나로 시작된 프로세스는 해당 세트에 머물러 있으므로, 게임이 일시 정지된 동안 이를 다음 단계로 진행시키는 역할을 합니다."
 cm__dbg_rotate_slice_text: "회전"
 cm__probe_production_anchors_name: "생산 앵커"
 cm__probe_production_anchors_desc: "상품별로 기록된 최적의 투자 회수율 및 설정된 회수 한도를 해당 건물 및 위치와 함께 한 줄씩 표시합니다."
 cm__probe_production_anchors_text: "$cm_txt_run$" # NO-TRANSLATE
 cm__probe_production_rgo_name: "생산 원자재"
 cm__probe_production_rgo_desc: "생산 과정에서 지역의 천연 자원을 건너뛴 이유를 항목별로 한 줄씩 표시하거나, 건너뛴 항목이 없으면 한 줄로 표시합니다. 콘솔 명령 effect location:<key> = { cm_ab_core_watch_on = yes }로 특정 지역을 지정하지 않는 한 수도의 정보를 읽습니다."
 cm__probe_production_rgo_text: "$cm_txt_run$" # NO-TRANSLATE
 cm__probe_core_name: "$cm__ab_core_name$" # NO-TRANSLATE
 cm__probe_core_desc: "지역의 핵심 상품 관련 모든 수치를 게임 자체 수치와 병기하여 표시하고, 해당 지역의 시장이 한 주기 동안 흡수할 수 있는 양을 보여줍니다. 콘솔 명령 effect location:<key> = { cm_ab_core_watch_on = yes }로 특정 지역을 지정하지 않는 한 수도를 표시합니다. 수도는 핵심 상품 건설 후보가 될 수 없으므로, 실제 건설이 이루어질 지역의 정보를 확인하려면 해당 지역을 지정하십시오."
 cm__probe_core_text: "$cm_txt_run$" # NO-TRANSLATE
 cm__probe_setup_name: "$cm_txt_setup_data$" # NO-TRANSLATE
 cm__probe_setup_desc: "세이브가 보유 중인 지도 데이터와 각 데이터가 산출된 버전, 그리고 현재 기기에서 이를 산출하도록 허용되었는지 여부입니다. 버전 0은 아직 데이터가 산출되지 않았음을 의미하며 다음 로드 시에 산출될 것입니다."
 cm__probe_setup_text: "$cm_txt_run$" # NO-TRANSLATE
 cm__debug__setup_name: "$cm_txt_setup_data$" # NO-TRANSLATE
 cm__debug__setup_desc: "모드가 한 번 계산한 후 게임 내내 읽어 들이는 지도 데이터입니다."
 cm__dbg_rebuild_setup_name: "설정 데이터 재구축"
 cm__dbg_rebuild_setup_desc: "지도 데이터를 다시 산출합니다: R.G.O. 보너스 필터의 원자재, 추천 도시 권리의 산업 범위, $mapmode_cm_location_food_potential_name$의 점수, 배치 탐색기가 경로를 찾는 강 도하 지점, 그리고 어떤 건물이 어떤 건물로 업그레이드되는지를 다시 계산합니다. 몇 초가 소요되며, 그동안 게임은 계속 실행됩니다."
 cm__dbg_rebuild_setup_text: "재건"
