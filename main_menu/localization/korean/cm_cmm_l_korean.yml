 cm__expand_metric: "cm__expand_metric"
 cm__town_rights_free_grants_name: "도시 권리 비용 제거"
 cm__town_rights_free_grants_desc: "활성화 시 도시권 부여에 정부 역량이 소모되지 않으며, 이를 박탈할 때 안정도가 소모되지 않습니다."
 cm__town_rights_min_gov_power_name: "최소 정부 역량"
 cm__town_rights_min_gov_power_desc: "다음 부여 시 정부 수치(정부 형태에 따라 정통성, 공화정 전통, 신앙심, 또는 부족 결속도)가 이 값 미만으로 떨어지게 되면 도시권 자동 부여를 중단합니다."
 cm__allowed_building_overbuild_levels_format: "[CMMV('cm__allowed_building_overbuild_levels')][Select_CString(GreaterThanOrEqualTo_CFixedPoint(CMMV('cm__allowed_building_overbuild_levels'), CMMMapValue('cmm_max', 'cm__allowed_building_overbuild_levels')), '+', '')]"
 cm__auto_build_capital_name: "수도 건물"
 cm__auto_build_capital_desc: "조건이 충족되면 수도 지역에 수도 전용 건물(왕실 법정, 대법원, 육군 사관학교 등)을 자동으로 건설합니다. 이 건물들은 아래 목록에 있는 건물들보다 먼저 건설됩니다."
 cm__urbanize_city_to_megalopolis_name: "도시에서 거대 도시로"
 cm__urbanize_city_to_megalopolis_desc: "시장 중심지 도시이자 인구가 최소 400,000명 이상이 되면 수도를 메갈로폴리스로 업그레이드하십시오."
 cm__megalopolis_ignore_capital_name: "메갈로폴리스: 수도 요구 사항 무시"
 cm__megalopolis_ignore_capital_desc: "수도가 아닌 도시에서도 메갈로폴리스 건설을 할 수 있게 해줍니다."
 cm__megalopolis_ignore_market_center_name: "메갈로폴리스: 시장 중심지 요구 사항 무시"
 cm__megalopolis_ignore_market_center_desc: "시장 중심지가 아닌 도시에서도 메갈로폴리스 건설을 할 수 있게 해줍니다."
 cm__deurbanize_name: "탈도시화"
 cm__deurbanize_desc: "매달 아래의 '도시화 금지' 목록에 RGO 상품이 체크된 소유 지역을 농촌 정착지로 되돌립니다. 수도, 정복한 지역, 그리고 총독부와 같이 인접도를 제공하는 지역은 제외됩니다."
 cm__auto_urbanize_ignore_list_i20_name: "@wool! [ShowGoodsName('wool')] ([GetGlobalVariable('cm_goods_wool').GetGoods.GetDefaultMarketPrice]@gold!)"
 cm__full_automation_name: "완전 자동화"
 cm__full_automation__full_automation_name: "완전 자동화"
 cm__full_automation__full_automation_desc: "자동 건설 기능입니다. 매달 아래의 카테고리들이 금 보유고를 초과하는 국고를 사용하여 가능한 최선의 건설을 진행합니다. 다른 자동화 기능의 설정을 변경하지 않고 병행하여 작동합니다."
 cm__fa_enabled_name: "완전 자동화 활성화"
 cm__fa_enabled_desc: "전체 자동화를 켜거나 끕니다."
 cm__fa_reserve_name: "금 보유고"
 cm__fa_reserve_desc: "전체 자동화 시 국고가 이 금액 미만으로 떨어지지 않도록 유지합니다. 설정 탭의 금 비축량(Gold Reserve)과는 별개입니다."
 cm__fa_reserve_format: "[CMMV('cm__fa_reserve')]@gold!"
 cm__fa_save_unaffordable_name: "비용 부족 건물을 위해 저축"
 cm__fa_save_unaffordable_desc: "카테고리가 해당 월의 할당량을 초과하더라도 탐색된 최적의 건물을 건설하며, 이후 차액이 보전될 때까지 건설을 중단합니다. 비활성화 시, 각 카테고리는 가능한 예산만 지출하고 남은 금액은 하위 카테고리로 넘깁니다."
 cm__full_automation__fa_priority_list_name: "우선순위"
 cm__full_automation__fa_priority_list_desc: "드래그하여 순서를 변경하십시오. 카테고리는 매달 위에서 아래로 순차적으로 처리됩니다. 두 카테고리가 동일한 건물을 원할 경우, 순위가 더 높은 카테고리가 건설합니다."
 cm__fa_priority_list_item_column_name: "범주"
 cm__fa_priority_list_i1_name: "식량"
 cm__fa_priority_list_i1_desc: "귀하가 시장 중심지를 보유한 시장의 연간 식량 공급을 감시하며, 중앙값 달의 공급이 부족한 경우 식량 잠재력이 가장 높은 지역의 자동 식량 생산을 활성화합니다. 선택된 지역은 플레이어가 직접 활성화한 곳처럼 빛나지만 토글 제어권은 귀하에게 유지됩니다. 해당 지역이 더 이상 귀하 소유의 농촌 정착지가 아니거나 시장 중심지의 소유권을 상실하지 않는 한, 이 기능은 절대 꺼지지 않습니다."
 cm__fa_priority_list_i2_name: "산업"
 cm__fa_priority_list_i2_desc: "조세 수입으로 비용을 가장 빨리 회수하는 생산 건물 및 RGO를 건설, 확장 및 업그레이드합니다. 자동 식량 생산 중인 지역에 노동력이 이미 부족한 경우 해당 지역은 건드리지 않습니다."
 cm__fa_priority_list_i3_name: "가격 콜랩서"
 cm__fa_priority_list_i3_desc: "건설 자재의 가격을 낮추기 위해 생산을 확장합니다. 귀하가 시장 중심지를 소유한 시장에서 작동합니다. 생산성이 가장 높은 지역부터 우선적으로 한 번에 여러 단계씩 건설하며, 노동자가 아직 도착하지 않은 지역에서도 생산 시설 건설을 시작합니다. 수도, 식량 생산 지역, 보조금 없이는 손실이 발생하는 생산 시설은 모두 제외됩니다."
 cm__fa_priority_list_i4_name: "도로"
 cm__fa_priority_list_i4_desc: "비용 대비 효율이 가장 높은 도로망을 건설합니다. 도로는 근접성, 시장 접근성, 수도 연결이라는 세 가지 가치를 제공합니다. 매년 한 번씩 각 요소에 대해 소유한 모든 지역으로 향하는 최적의 경로를 산출하며, 매달 해당 경로상의 모든 배후 지역을 포함하여 조세 기반을 가장 많이 높일 수 있는 구간부터 건설을 시작합니다. 저렴하고 평탄한 경로가 우선적으로 부설되며, 상위 순위에서 더 이상 건설할 구간이 없을 때만 하위 두 요소에 자금이 투입됩니다."
 cm__fa_priority_list_i5_name: "공공시설"
 cm__fa_priority_list_i5_desc: "적합한 모든 곳에 지원 인프라를 건설합니다: 수도 건물, 자동 건설 목록, 수은 파티오, 시장 중심지 건물, 집행관 및 장악력을 높이는 국가 고유 건물, 시장, 질병 저항 건물, 마지막으로 곡물창고 순입니다. 장악력 건물은 가장 부유한 지역에 우선적으로 건설되며, 시장은 시장 접근성이 가장 낮은 지역에 우선적으로 건설됩니다."
 cm__fa_priority_list_i6_name: "건물 정리"
 cm__fa_priority_list_i6_desc: "매년 수익이 발생하지 않고 보조금을 받지 못하는 생산 건물을 폐쇄하며, 해당 지역이 지원하는 건물 단계의 10단계 이내인 경우에는 대신 파괴합니다. 폐쇄된 건물은 해당 시장에서 해당 유형의 건물이 다시 수익을 내면 재가동되며, 지역 공간이 부족해지면 나중에 파괴됩니다. @farming_village! [ShowBuildingTypeNameWithNoTooltip('farming_village')]은(는) 절대로 폐쇄되거나 파괴되지 않습니다."
 cm__fa_priority_list_i7_name: "총독"
 cm__fa_priority_list_i7_desc: "주지사가 배치될 위치를 계획하고 가장 좋은 장소부터 우선적으로 배치합니다. 주지사 슬롯이 빌 때마다, 그리고 그 외에는 25년마다 다시 계획을 수립합니다. 싱글 플레이어 전용입니다."
 cm__fa_priority_list_i8_name: "도시권"
 cm__fa_priority_list_i8_desc: "당신의 마을과 도시에 도시 권리를 부여합니다. [ShowTownRightsNameWithNoTooltip('granary_town')]가 가장 먼저 부여되며, 그다음 해당 지역 인근에서 생산되는 상품에 적합한 것들 중에서 무작위로 선택된 하나의 전문화 권리가 부여됩니다."
 cm__fa_priority_list__budget_name: "예산 비중"
 cm__fa_priority_list__budget_desc: "금 비축분(Gold Reserve)을 초과하는 국고 중 이 범주가 매달 지출할 수 있는 비율입니다."
 cm__fa_priority_list__budget_postfix: "%"
 cm__fa_priority_list__enabled_name: "활성화됨"
 cm__fa_priority_list__enabled_desc: "이 카테고리의 건설을 허용합니다."
 cm__full_automation__fa_industry_name: "산업"
 cm__full_automation__fa_industry_desc: "상단 산업 카테고리에 대한 설정입니다."
 cm__fa_industry_algorithm_name: "건설 전략"
 cm__fa_industry_algorithm_desc: "산업이 무엇을 건설할지 선택하는 방법."
 cm__fa_industry_algorithm_option_1_name: "탐욕적"
 cm__fa_industry_algorithm_option_1_desc: "투자 회수가 가장 빠른 옵션을 우선 건설하며, 동일한 상품을 생산하기에 가장 좋은 장소 근처의 옵션들만 건설합니다."
 cm__fa_industry_max_rel_roi_name: "최대 상대적 투자 수익률"
 cm__fa_industry_max_rel_roi_desc: "동일한 상품을 생산하는 가장 효율적인 장소와 비교하여, 건물이나 업그레이드의 비용 회수 속도가 얼마나 더 느려도 건설을 허용할지 설정합니다. 30%일 때 가장 효율적인 곳의 회수 기간이 10년이라면, 13년 이내에 회수 가능한 곳까지만 건설되며 그보다 느린 곳은 대기합니다. 0%일 때는 매달 각 상품별로 가장 효율적인 생산지에만 건설됩니다. 100% 이상인 경우 제한이 없으며 '최대 비용 회수 기간'만 적용됩니다. 종류와 관계없이 동일한 상품을 생산하는 모든 건물은 함께 비교됩니다. RGO 확장은 항상 비용 회수 순서에 따라 건설됩니다."
 cm__fa_industry_max_rel_roi_format: "[CMMV('cm__fa_industry_max_rel_roi')]%[Select_CString(GreaterThanOrEqualTo_CFixedPoint(CMMV('cm__fa_industry_max_rel_roi'), CMMMapValue('cmm_max', 'cm__fa_industry_max_rel_roi')), '+', '')]"
 cm__fa_industry_min_roi_name: "최대 투자 회수 연수"
 cm__fa_industry_min_roi_desc: "조세 수입이 해당 연수 내에 건설 비용을 회수하는 건설만 고려됩니다. 0으로 설정하면 이 확인 과정을 비활성화합니다."
 cm__fa_industry_min_roi_format: "[CMMV('cm__fa_industry_min_roi')]년 @efficiency!"
 cm__full_automation__fa_collapsar_name: "가격 콜랩서"
 cm__full_automation__fa_collapsar_desc: "위 Price Collapsar 범주에 대한 설정입니다. 원자재는 목록 상단에서 하단 순으로 처리되며, 생산 건물보다 RGO가 먼저 확장됩니다."
 cm__fa_collapsar_target_name: "목표 가격"
 cm__fa_collapsar_target_desc: "자재 건설이 중단되는 기본 가격 대비 가격입니다. -33%일 때, 해당 자재가 기본 가격보다 33% 낮은 가격에 거래될 때까지 생산 시설을 건설합니다. 0%일 때는 기본 가격에 도달할 때까지 건설합니다. +33%일 때는 기본 가격보다 33% 높은 가격일 때만 건설합니다."
 cm__fa_collapsar_target_format: "[CMMV('cm__fa_collapsar_target')]%"
 cm__fa_collapsar_item_column_name: "재료"
 cm__fa_collapsar_i1_name: "@masonry! [ShowGoodsName('masonry')]"
 cm__fa_collapsar_i2_name: "@lumber! [ShowGoodsName('lumber')]"
 cm__fa_collapsar_i3_name: "@sand! [ShowGoodsName('sand')]"
 cm__fa_collapsar_i4_name: "@glass! [ShowGoodsName('glass')]"
 cm__fa_collapsar__enabled_name: "활성화됨"
 cm__fa_collapsar__enabled_desc: "이 물자의 가격을 낮추기 위해 노력합니다."
 cm__full_automation__fa_food_name: "식량"
 cm__full_automation__fa_food_desc: "상단 식량 카테고리 설정."
 cm__fa_food_target_name: "잉여 목표"
 cm__fa_food_target_desc: "시장은 공급이 수요의 이 비율에 도달할 때까지 식량 생산지를 추가로 확보합니다. 125%로 설정하면, 연중 중앙값에 해당하는 달의 수치가 25% 잉여에 도달하지 못한 모든 시장에서 식량이 확장됩니다. 더 많은 여유분을 유지하려면 값을 높이고, 부족에 가까운 시장만 지원하려면 값을 낮추십시오."
 cm__fa_food_target_format: "[CMMV('cm__fa_food_target')]%"
 cm__fa_food_min_potential_name: "최소 식량 잠재력"
 cm__fa_food_min_potential_desc: "자동 식량 확장은 RGO 레벨당 식량 잠재력이 이 점수에 도달한 지역에서만 활성화되며, 이는 $mapmode_cm_location_food_potential_name$ 지도 모드에서 표시되는 점수와 동일합니다. 더 좋은 농경지를 확보하기 위해 기다리려면 수치를 높이고, 생산성이 낮은 땅도 허용하려면 수치를 낮추십시오."
 cm__fa_food_min_potential_format: "[CMMV('cm__fa_food_min_potential')]"
 cm__full_automation__fa_urban_rights_name: "도시 특권"
 cm__full_automation__fa_urban_rights_desc: "상단 도시 권리 카테고리에 대한 설정입니다."
 cm__fa_urban_rights_window_name: "적합도 임계값"
 cm__fa_urban_rights_window_desc: "특성화 권리가 해당 지역의 가장 적합한 권리에 비해 어느 정도로 적합해야 후보군에 포함될지를 결정합니다. 50%일 때, 가장 적합한 권리의 절반만큼만 적합해도 후보로 선정될 수 있으며, 더 적합한 권리일수록 더 자주 선택됩니다. 100%일 때는 가장 적합한 권리만 부여됩니다."
 cm__fa_urban_rights_window_format: "[CMMV('cm__fa_urban_rights_window')]%"
 cm__fa_urban_rights_reserve_name: "정부 권력 비축량"
 cm__fa_urban_rights_reserve_desc: "비용 지불 시 정부 역량(정부 형태에 따라 정통성, 공화정 전통, 헌신도 또는 부족 통합도)이 이 수치 미만으로 떨어지는 경우 도시 특권을 부여하지 않습니다."
 cm__fa_urban_rights_expand_name: "부스트된 산업 확장"
 cm__fa_urban_rights_expand_desc: "전문화 특권이 부여될 때, 해당 특권이 강화하는 산업과 해당 지역에서 생산되는 원자재에 대해서도 해당 지역의 자동 확장을 활성화합니다. 추천 도시 특권 지도에서 부여 버튼을 우클릭하는 것과 동일하게 작동합니다."
 cm__full_automation__fa_cleanup_name: "건물 정리"
 cm__full_automation__fa_cleanup_desc: "상단 건물 정리 범주에 대한 설정입니다."
 cm__fa_cleanup_min_profit_name: "최소 수익"
 cm__fa_cleanup_min_profit_desc: "월 수익이 이보다 적은 건물은 운영 가치가 없는 것으로 간주되어, 보조금을 받지 않는 한 폐쇄되거나 철거됩니다. 한 번에 시장 내 동일 유형의 운영 중인 건물 중 최대 절반까지만 처리됩니다."
 cm__fa_cleanup_min_profit_format: "[Divide_CFixedPoint(CMMV('cm__fa_cleanup_min_profit'), '(CFixedPoint)100')|2]@gold!"
 cm__fa_cleanup_core_goods_name: "건설 자재 우선순위 지정"
 cm__fa_cleanup_core_goods_desc: "@masonry![ShowGoodsNameWithNoTooltip('masonry')], @lumber![ShowGoodsNameWithNoTooltip('lumber')], @sand![ShowGoodsNameWithNoTooltip('sand')] 또는 @glass![ShowGoodsNameWithNoTooltip('glass')]을 주로 소비하는 건물을 최소 이익의 두 배 또는 0.1@gold! 중 더 높은 수치로 유지합니다. 이 넷 중 하나를 생산하는 건물은 일반 최소 이익을 기준으로 판정됩니다."
 cm__fa_cleanup_auto_food_name: "자동 식량 지역 초기화"
 cm__fa_cleanup_auto_food_desc: "식량 자동화가 작동 중이며 어떤 종류의 노동자든 이미 부족한 경우, 식량을 생산하지 않는 생산 건물을 철거합니다. @market_village! [ShowBuildingTypeNameWithNoTooltip('market_village')]은(는) 철거하는 대신 1단계로 축소됩니다."
 cm__full_automation__fa_roads_name: "도로"
 cm__full_automation__fa_roads_desc: "상단 도로 카테고리 설정."
 cm__fa_roads_proximity_name: "근접성"
 cm__fa_roads_proximity_desc: "비용 대비 근접도를 가장 많이 높이는 도로 구간을 건설하며, 해당 구간 뒤의 경로에 있는 모든 지역을 합산하여 계산합니다."
 cm__fa_roads_market_access_name: "시장 접근성"
 cm__fa_roads_market_access_desc: "비용 대비 시장 접근성을 가장 많이 높이는 도로 구간을 건설합니다. 건설할 인접성 도로 구간이 더 이상 남지 않은 달에만 지출합니다."
 cm__fa_roads_capital_name: "수도 연결"
 cm__fa_roads_capital_desc: "이미 연결된 지역부터 바깥쪽으로 확장하며 지역들을 수도와 연결하는 도로 구간을 부설합니다. 인접도 및 시장 접근성 도로 구간 중 더 이상 부설할 것이 없는 달에만 비용을 지출합니다."
 cm__full_automation__fa_governors_name: "총독"
 cm__full_automation__fa_governors_desc: "위의 총독 카테고리에 대한 설정입니다."
 cm__fa_gov_move_seats_name: "총독 이동 허용"
 cm__fa_gov_move_seats_desc: "모든 총독 슬롯이 가득 찬 경우, 기존 총독을 해임하고 대신 더 나은 위치에 배치합니다. 더 나은 위치는 이미 도시이거나 교체되는 대상보다 점수가 10% 이상 높아야 합니다. 이 설정을 끄면 총독은 비어 있는 슬롯에만 배치됩니다."
 cm__fa_gov_prepare_sites_name: "새로운 지역 준비 허용"
 cm__fa_gov_prepare_sites_desc: "아직 총독을 배치할 수 없는 지역을 우선적으로 고려하여, 그곳에 마을이나 도시를 건설하고 수도까지 도로를 연결해 준비시킵니다. 이 설정을 끄면 이미 도시이면서 수도까지 도로가 연결된 지역만 고려 대상이 됩니다."
 cm__map_modes_name: "지도 모드"
 cm__map_modes__placement_finder_name: "권장 수도 및 총독 위치"
 cm__map_modes__placement_finder_desc: "추천 총독 및 추천 수도 배치 지도 모드 설정."
 cm__placement_finder_method_name: "배치 탐색 점수"
 cm__placement_finder_method_desc: "추천 총독 및 추천 수도 지도 모드가 지역의 순위를 산정하는 방식입니다."
 cm__placement_finder_method_option_1_name: "조세 기반"
 cm__placement_finder_method_option_1_desc: "그곳에 총독이나 수도를 배치했을 때 전체 조세 기반이 얼마나 증가하는지에 따라 순위를 매깁니다. 부유한 지역일수록 더 큰 비중을 차지합니다."
 cm__placement_finder_method_option_2_name: "근접성"
 cm__placement_finder_method_option_2_desc: "해당 위치에 총독이나 수도를 배치할 경우 추가되는 근접도 순으로 정렬합니다."
 cm__placement_finder_roads_name: "육상 기반 시설"
 cm__placement_finder_roads_desc: "추천 총독 및 추천 수도 지도 모드에서 이상적인 육상 기반 시설을 가정할지, 아니면 실제로 건설된 시설을 사용할지 여부입니다."
 cm__placement_finder_roads_option_1_name: "현재"
 cm__placement_finder_roads_option_1_desc: "실제로 건설한 도로 사용"
 cm__placement_finder_roads_option_2_name: "최대 도로"
 cm__placement_finder_roads_option_2_desc: "해금된 최상급 도로가 모든 연결로에 건설되어 있다고 가정합니다."
 cm__placement_finder_roads_option_3_name: "가능한 최선"
 cm__placement_finder_roads_option_3_desc: "해금된 가장 좋은 도로가 모든 연결로에 건설되어 있고, 육로 근접성을 개선하는 해금된 모든 건물이 건설 가능한 모든 위치에 건설되어 있다고 가정합니다."
 cm__placement_finder_naval_name: "해군 기반 시설"
 cm__placement_finder_naval_desc: "추천 총독 및 추천 수도 지도 모드에서 이상적인 해군 기반 시설을 가정할지, 아니면 현재 항구 용량과 해군 주둔 상황을 사용할지 여부입니다."
 cm__placement_finder_naval_option_1_name: "현재"
 cm__placement_finder_naval_option_1_desc: "현재 항구 수용량과 해군 주둔을 사용합니다."
 cm__placement_finder_naval_option_2_name: "최대 점유"
 cm__placement_finder_naval_option_2_desc: "현재 항구 수용량을 기준으로 모든 지역에 완전한 해군 주둔이 이루어지는 것으로 가정합니다."
 cm__placement_finder_naval_option_3_name: "가능한 최선의"
 cm__placement_finder_naval_option_3_desc: "모든 해안 지역에 해금된 최고의 항구 건물이 건설되었으며, 완전한 해군력이 주둔하고 있다고 가정합니다."
 cm__placement_finder_accuracy_name: "검색 정확도"
 cm__placement_finder_accuracy_desc: "추천 총독 및 추천 수도 지도 모드에서 최적의 위치를 얼마나 철저하게 검색할지 설정합니다. 검색에서 제외된 위치는 검은색으로 표시됩니다."
 cm__placement_finder_accuracy_option_1_name: "철저함"
 cm__placement_finder_accuracy_option_1_desc: "모든 지역을 평가합니다. 가장 정확하지만 가장 느립니다."
 cm__placement_finder_accuracy_option_2_name: "철저함"
 cm__placement_finder_accuracy_option_2_desc: "상위 3위 안에 들 수 없는 위치는 건너뜁니다. 상위 3곳과 그 점수는 '철저함(Exhaustive)' 방식과 동일하지만 더 빠릅니다."
 cm__placement_finder_accuracy_option_3_name: "균형"
 cm__placement_finder_accuracy_option_3_desc: "가장 좋은 단일 후보가 될 수 없는 지역은 건너뜁니다. 가장 좋은 위치는 여전히 정확하게 보장되지만, 2순위와 3순위 표시는 가끔 다를 수 있습니다."
 cm__placement_finder_accuracy_option_4_name: "빠름"
 cm__placement_finder_accuracy_option_4_desc: "또한 최적일 가능성이 매우 낮은 지역을 건너뜁니다. 검색된 최적의 지역은 실제 최적값의 20% 이내이며 보통 정확하게 일치합니다."
 cm__placement_finder_accuracy_option_5_name: "가장 빠름"
 cm__placement_finder_accuracy_option_5_desc: "각 프로빈스의 가장 유망한 입지를 평가한 후 상위 후보를 중심으로 정밀화합니다. 영토가 넓은 국가일수록 처리 속도가 훨씬 빠르지만, 최적의 입지를 놓칠 수 있습니다."
 cm__debug_name: "디버그"
 cm__debug__logging_name: "활동 기록"
 cm__debug__logging_desc: "이 모드의 행동 중 어떤 것들이 모드 행동 로그에 기록될지 설정합니다."
 cm__log_cycle_name: "건설 주기"
 cm__log_cycle_desc: "이전 주기가 여전히 소모(draining) 중이라 건너뛴 월간 주기와 2회 연속 건너뛴 후의 초기화에 관한 문구입니다."
 cm__log_industry_name: "산업"
 cm__log_industry_desc: "산업 범주에서 대기열에 추가하는 모든 건물과 고려 중인 모든 원자재 확장에 대한 내역이며, 각각의 투자 회수 기간과 수입이 표시됩니다."
 cm__log_collapsar_name: "가격 콜랩서"
 cm__log_collapsar_desc: "가격 붕괴(Price Collapsar) 주기를 거치는 한 지역의 추적 기록입니다. 시장의 부족분과 요청한 수치, 그리고 해당 지역에 할당된 내역, 점수 및 건설된 건물을 보여줍니다. 먼저 콘솔 명령 effect location:<key> = { cm_fa_col_watch_on = yes }를 사용하여 해당 지역을 표시하십시오."
 cm__log_food_name: "자동 식량"
 cm__log_food_desc: "식량 카테고리 항목: 각 시장의 월간 식량 공급, 수요 및 비율, 목표 대비 판단 기준이 되는 연간 중앙값, 이미 식량을 생산 중인 지역의 수, 그리고 활성화 또는 비활성화되는 모든 지역입니다."
 cm__log_roads_name: "도로"
 cm__log_roads_desc: "도로 카테고리에서 주문한 각 도로에 대해 위치, 도로 구매 목적(세 가지 중 하나), 그리고 소모된 비용을 한 줄씩 표시합니다."
 cm__log_cleanup_name: "건물 정리"
 cm__log_cleanup_desc: "연례 건물 정리 과정 및 이 과정에서 폐쇄, 축소, 파괴 또는 재개장된 모든 건물에 대한 기록이며, 각 건물의 수익과 판단 기준이 된 하한선이 포함됩니다."
 cm__log_governors_name: "총독"
 cm__log_governors_desc: "주지사 계획 항목: 부지 선정 및 취소, 마을 및 도시 업그레이드, 배치, 재배치 및 거부, 그리고 행운의 국가 수도 이전."
 cm__log_military_name: "행운의 국가 군사"
 cm__log_military_desc: "요새를 철거하고 인력 건물을 건설하는 행운의 국가를 위한 문구"
 cm__log_government_name: "운 좋은 국가 정부"
 cm__log_government_desc: "행운의 국가가 관료제를 제거하거나 계층 상호작용을 수행하기 위한 대기열입니다."
 cm__debug__diagnostics_name: "진단"
 cm__placement_finder_debug_path_name: "디버그 진단 활성화"
 cm__placement_finder_debug_path_desc: "추천 총독 및 추천 수도 지도 모드 툴팁에 진단 정보를 추가합니다: 수도에서 각 지역까지의 예측 경로와 각 단계별 비용, 그리고 실제 근접도와 비교한 예측 근접도를 표시합니다."
 cm__debug__probes_name: "조사"
 cm__debug__probes_desc: "모드 작업 로그에 기록된 일회성 진단 정보입니다."
 cm__probe_budget_name: "전체 자동화 예산"
 cm__probe_budget_desc: "각 완전 자동화 범주의 잔액입니다. 아직 비용을 지불할 수 없는 항목을 위해 골드를 비축 중이면 양수, 초과 지출로 인한 부채가 있으면 음수로 표시됩니다. 산업 투자 회수 한도 및 이번 주기에서 건너뛴 시장의 최적 대기 후보 정보가 포함됩니다."
 cm__probe_budget_text: "실행"
 cm__probe_governors_name: "총독 계획"
 cm__probe_governors_desc: "주지사 계획의 진행 상황: 진행 단계, 보유 및 배치 예정 부지 수, 국고 점유 여부, 비용이 지불된 주지사, 그리고 현재 사용 중인 슬롯 및 좌석 정보입니다."
 cm__probe_governors_text: "실행"
 cm__probe_military_name: "강운국 군사"
 cm__probe_military_desc: "국가의 인력 건물 단계, 건설 가능 여부, 수도 쌍 상태, 군사 예산, 그리고 해당 단계를 건설할 수 있는 지역 수 대비 이미 보유한 지역 수입니다."
 cm__probe_military_text: "실행"
 cm__probe_industry_anchors_name: "산업 거점"
 cm__probe_industry_anchors_desc: "상품별로 기록된 산업의 최고 투자 회수와 설정된 투자 회수 한도를 건물명 및 위치와 함께 한 줄씩 표시합니다."
 cm__probe_industry_anchors_text: "실행"
 cm__probe_industry_rgo_name: "산업 원자재"
 cm__probe_industry_rgo_desc: "산업이 지역 원자재를 건너뛴 이유별로 한 줄씩 표시하거나, 건너뛴 이유가 없는 경우 한 줄로 표시합니다. 콘솔 명령 effect location:<key> = { cm_fa_col_watch_on = yes }로 특정 지역을 표시하지 않는 한 수도의 정보를 읽습니다."
 cm__probe_industry_rgo_text: "실행"
 cm__probe_collapsar_name: "가격 붕괴기"
 cm__probe_collapsar_desc: "프라이스 콜랩서가 지역에서 읽는 모든 수치를 게임 자체의 수치와 함께 표시하고, 해당 지역 시장이 한 주기 동안 흡수할 수 있는 양을 나타냅니다. 콘솔 명령 effect location:<key> = { cm_fa_col_watch_on = yes }를 사용하여 특정 지역을 표시하지 않는 한 수도를 읽습니다. 수도는 결코 프라이스 콜랩서 후보가 되지 않으므로, 건설이 이루어질 위치의 정보를 읽으려면 해당 지역을 표시하십시오."
 cm__probe_collapsar_text: "실행"
 cm__probe_roads_name: "도로"
 cm__probe_roads_desc: "도로 계획이 근접도, 시장 접근성, 수도 연결을 위해 보유 중인 각 경로의 수, 그중 착수 가능한 수도 연결 경로 수, 현재 건설 중인 도로 수 및 해당 카테고리 풀의 잔여량입니다."
 cm__probe_roads_text: "실행"
 cm__probe_log_gate_name: "액션 로그 게이트"
 cm__probe_log_gate_desc: "로그 게이트가 읽는 방식과 메뉴가 저장하는 방식에 따라 가격 붕괴기 로그 카테고리를 두 번 표시하여, 한쪽은 켜져 있고 다른 쪽은 꺼져 있는 카테고리가 나타나게 합니다."
 cm__probe_log_gate_text: "실행"
