 # Auto-Urbanize (auto_urbanize) Tab
 cm__auto_urbanize_name: "자동 도시화"
 ## Auto-Urbanize Settings (auto_urbanize) Group
 cm__auto_urbanize__auto_urbanize_name: "자동 도시화 설정"
 cm__auto_urbanize__auto_urbanize_desc: "매달 실행될 지역 등급 승급을 선택하십시오."
 cm__urbanize_town_to_city_name: "마을에서 도시로"
 cm__urbanize_town_to_city_desc: "매달 요건을 충족하는 마을을 도시로 승격합니다."
 cm__urbanize_rural_to_town_name: "농촌에서 도시로"
 cm__urbanize_rural_to_town_desc: "매달 조건에 부합하는 농촌 정착지를 마을로 승격시킵니다. 인구 30,000명(즉시 도시 승격 가능) 이상이거나 인구 한도까지 1,000명 이내인 경우(그렇지 않으면 농촌 한도에서 성장이 정체됨)에 수행됩니다. 아래 제외 목록에서 RGO가 체크된 지역은 건너뜁니다. 대량 자동 식량(Mass Auto-Food)이 적용되는 지역 또한 건너뛰어, 농촌 상태를 유지하고 식량을 계속 생산하게 합니다."
