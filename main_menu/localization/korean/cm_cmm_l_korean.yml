 cm__ab_governors_name: "총독"
 cm__ab_master__ab_master_name: "$cm__ab_master_name$" # NO-TRANSLATE
 cm__ab_master__ab_master_desc: "자율 건설입니다. 매월 아래의 범주들이 금 보유고를 초과하는 국고를 가용한 최선의 건설에 지출합니다. 다른 자동화 기능의 설정을 건드리지 않고 함께 작동합니다."
 cm__ab_enabled_name: "자동 건설 활성화"
 cm__ab_enabled_desc: "자동 건설을 켜거나 끕니다."
 cm__ab_save_unaffordable_name: "비용이 부족한 건물을 위해 저축"
 cm__ab_save_unaffordable_desc: "분류가 해당 월의 할당량을 초과하더라도 찾은 최선의 건물을 구매하며, 이후 차액이 충당될 때까지 구매를 중단합니다. 비활성화 시, 분류는 즉시 전액을 지불할 수 없는 건물은 구매하지 않습니다."
 cm__ab_min_proximity_name: "최소 근접성"
 cm__ab_min_proximity_desc: "이 근접도 미만의 거점은 건설 위치를 선정할 때 제외됩니다. 통제 건물과 @settlement_building! [ShowBuildingTypeNameWithNoTooltip('settlement_building')]은 근접도가 낮은 영토를 보유할 가치가 있게 해주므로 이와 관계없이 건설됩니다. 0으로 설정하면 아무것도 제외되지 않습니다."
 cm__ab_min_proximity_format: "[CMMV('cm__ab_min_proximity')]%" # NO-TRANSLATE
 cm__ab_master__ab_priority_list_name: "자동 건설 카테고리"
 cm__ab_master__ab_priority_list_desc: "드래그하여 순서를 변경하세요. 카테고리는 매달 위에서 아래로 순차적으로 처리됩니다. 두 카테고리가 동일한 건물을 원할 경우 상위 카테고리가 건설하며, 모든 카테고리에 할당된 후 남은 자금은 상위 카테고리가 우선적으로 가져갑니다."
 cm__ab_priority_list_item_column_name: "분류"
 cm__ab_priority_list_i1_name: "$cm__ab_custom_name$" # NO-TRANSLATE
 cm__ab_priority_list_i1_desc: "가능한 모든 곳에 지원 기반 시설을 건설합니다. 수도 건물이 최우선으로 건설되며, 이어서 통제 건물, 시장 중심지 건물, 그리고 직접 선택한 건물 순으로 건설됩니다. 집행관은 원자재 판매가가 가장 높은 지역에, 그 외의 통제 건물은 가장 부유한 지역에, 시장은 시장 접근성이 가장 낮은 지역에 우선적으로 건설됩니다."
 cm__ab_priority_list_i2_name: "$cm__ab_core_name$" # NO-TRANSLATE
 cm__ab_priority_list_i2_desc: "건설 자재의 생산을 확장하여 가격을 낮춥니다. 귀하가 시장 중심지를 소유한 시장에서 작동합니다. 생산성이 가장 높은 지역부터 우선하며 각 지역은 한 번에 여러 단계가 건설됩니다. 또한 아직 노동자가 도착하지 않은 곳에서도 생산이 시작됩니다. 수도, 식량 생산 지역, 보조금 없이는 손실이 발생하는 생산 시설은 모두 제외됩니다."
 cm__ab_priority_list_i3_name: "$cm__ab_food_name$" # NO-TRANSLATE
 cm__ab_priority_list_i3_desc: "플레이어가 시장 중심지를 소유한 시장의 연간 식량 공급을 추적하여, 중앙값 달의 공급이 부족할 경우 식량 잠재력이 가장 높은 지역에 식량 자동 확장을 활성화합니다. 선택된 지역은 플레이어가 직접 활성화한 지역처럼 강조 표시되지만 토글 제어권은 플레이어에게 유지됩니다. 해당 지역이 더 이상 플레이어 소유의 농촌 정착지가 아니거나, 시장 중심지 소유권을 잃거나, 동일 시장 내의 더 나은 지역이 그 자리를 대신하지 않는 한 자동으로 비활성화되지 않습니다."
 cm__ab_priority_list_i4_name: "$cm__ab_production_name$" # NO-TRANSLATE
 cm__ab_priority_list_i4_desc: "조세 수입을 통해 건설 비용을 가장 빠르게 회수하는 생산 건물 및 RGO를 건설, 확장 및 업그레이드합니다. 노동력이 이미 부족한 상태에서 자동 식량 생산이 가동 중인 지역은 제외됩니다."
 cm__ab_priority_list_i5_name: "$cm__ab_roads_name$" # NO-TRANSLATE
 cm__ab_priority_list_i5_desc: "비용 대비 효율이 가장 높은 도로망을 건설하며, 근접도, 시장 접근성, 수도 연결성이라는 세 가지 요소를 고려합니다. 4년마다, 그리고 수도를 이전할 때마다 소유한 모든 지역에 대한 최적 경로를 산출하며, 해당 경로 뒤로 이어지는 모든 구간을 포함해 향상될 조세 기반을 기준으로 정렬합니다. 멀티플레이어에서는 '도로 재계획 강제 실행(Force Re-Plan Roads)' 버튼을 누를 때만 이 작업이 수행됩니다. 매달 정렬된 목록에 따라 건설을 진행하며, 건설을 시작할 수 없는 구간이 나타나면 이를 건너뛰지 않고 해당 지점에서 중단합니다. 저렴하고 평탄한 통로가 우선적으로 건설되며, 하위 구간은 상위 구간에서 건설이 이루어지지 않고 비용이 부족하여 저축 중인 상태도 아닐 때만 예산을 배정받습니다."
 cm__ab_priority_list_i6_name: "$cm__ab_governors_name$" # NO-TRANSLATE
 cm__ab_priority_list_i6_desc: "주지사가 배치될 위치를 계획하고 최적의 장소부터 우선적으로 배치합니다. 주지사 슬롯이 비었을 때마다 다시 계획하며, 그 외에는 25년마다 계획을 갱신합니다. 싱글 플레이 전용입니다."
 cm__ab_priority_list__budget_name: "예산 비중"
 cm__ab_priority_list__budget_desc: "매달 이 범주에 할당되는 금 비축분 초과 국고의 비율입니다. 이는 상한선이 아닌 하한선입니다. 어느 범주에서도 소모하지 않은 금은 목록의 처음부터 다시 할당되므로, 하위 범주가 건설할 것이 없는 달에는 특정 범주가 할당량을 훨씬 초과하여 건설할 수도 있습니다."
 cm__ab_priority_list__budget_postfix: "%" # NO-TRANSLATE
 cm__ab_priority_list__enabled_name: "$cm_txt_enabled$" # NO-TRANSLATE
 cm__ab_priority_list__enabled_desc: "이 범주가 건설되도록 합니다."
 cm__ab_priority_list__settings_name: "설정"
 cm__ab_priority_list__settings_desc: "이 카테고리의 자체 설정으로 이동합니다."
 cm__ab_priority_list__settings_text: "열기"
 cm__ab_master__debug_name: "$cm_txt_debug$" # NO-TRANSLATE
 cm__dbg_run_auto_build_name: "자동 건설 실행"
 cm__dbg_run_auto_build_desc: "이제 월이 바뀌기를 기다리는 대신 활성화된 모든 카테고리를 순서대로 처리합니다. 각 카테고리는 할당된 지분 중 남은 금액을 사용하므로, 이번 달 할당량을 이미 소모한 카테고리는 아무것도 건설하지 않습니다. 자동화 일시정지는 이 과정을 막지 않습니다."
 cm__dbg_run_auto_build_text: "$cm_txt_run_now$" # NO-TRANSLATE
 cm__ab_custom__ab_custom_name: "$cm__ab_custom_name$" # NO-TRANSLATE
 cm__ab_custom__ab_custom_desc: "세트는 매달 위에서부터 아래로 처리되므로, 상단에 가까운 항목이 금을 먼저 사용합니다."
 cm__ab_custom_item_column_name: "건물"
 cm__ab_custom_i1_name: "수도 건물"
 cm__ab_custom_i1_desc: "수도 전용 건물인 왕실 궁정, 최고 재판소, 육군 사관학교 등을 수도에 건설합니다. 이 건물들은 해당 카테고리의 다른 건물들보다 우선적으로 건설됩니다."
 cm__ab_custom_i2_name: "통제력 건물"
 cm__ab_custom_i2_desc: "원자재 가격이 가장 높은 곳에 집행관을 건설하고, 가장 부유한 지역에는 장악력을 높여주는 국가 고유 건물을 건설합니다. 각 지역은 건설 가능한 모든 고유 건물을 먼저 채운 뒤 다음 지역으로 넘어갑니다."
 cm__ab_custom_i3_name: "시장 중심지 건물"
 cm__ab_custom_i3_desc: "소유한 모든 시장 중심지에 수익성이 있는 건물을 건설합니다."
 cm__ab_custom_i4_name: "건물 선택"
 cm__ab_custom_i4_desc: "아래에 나열된 건물들을 건설합니다."
 cm__ab_custom__enabled_name: "$cm_txt_enabled$" # NO-TRANSLATE
 cm__ab_custom__enabled_desc: "이 세트 건설"
 cm__ab_custom__auto_build_list_name: "$cm__ab_custom_i4_name$" # NO-TRANSLATE
 cm__ab_custom__auto_build_list_desc: "드래그하여 순서를 변경하세요. 건물은 매달 위에서 아래 순서로 처리되므로, 상단에 가까운 건물이 금을 우선적으로 사용합니다."
 cm__auto_build_list_i22_name: "@lazaretto! [ShowBuildingTypeName('lazaretto')]" # NO-TRANSLATE
 cm__auto_build_list_i23_name: "@hospital! [ShowBuildingTypeName('hospital')]" # NO-TRANSLATE
 cm__auto_build_list_i24_name: "@granary! [ShowBuildingTypeName('granary')]" # NO-TRANSLATE
 cm__ab_custom__debug_name: "$cm_txt_debug$" # NO-TRANSLATE
 cm__dbg_run_custom_name: "사용자 정의 실행"
 cm__dbg_run_custom_desc: "$cm_txt_dbg_run_category_desc$" # NO-TRANSLATE
 cm__dbg_run_custom_text: "$cm_txt_run_now$" # NO-TRANSLATE
 cm__ab_core__ab_core_name: "$cm__ab_core_name$" # NO-TRANSLATE
 cm__ab_core__ab_core_desc: "핵심 상품 설정입니다. 자재는 목록의 위에서 아래로 처리되며, RGO가 생산 건물보다 먼저 확장됩니다."
 cm__ab_core_target_name: "목표 가격"
 cm__ab_core_target_desc: "특정 물자의 건설이 중단되는 가격으로, 기본 가격 대비 비율입니다. -33%일 때, 해당 물자가 기본 가격보다 33% 낮은 가격에 거래될 때까지 생산 시설을 건설합니다. 0%일 때는 기본 가격에 도달할 때까지 건설합니다. +33%일 때는 기본 가격보다 33% 이상 높을 때만 건설합니다."
 cm__ab_core_target_format: "[CMMV('cm__ab_core_target')]%" # NO-TRANSLATE
 cm__ab_core_item_column_name: "재료"
 cm__ab_core_i1_name: "@masonry! [ShowGoodsName('masonry')]" # NO-TRANSLATE
 cm__ab_core_i2_name: "@lumber! [ShowGoodsName('lumber')]" # NO-TRANSLATE
 cm__ab_core_i3_name: "@sand! [ShowGoodsName('sand')]" # NO-TRANSLATE
 cm__ab_core_i4_name: "@glass! [ShowGoodsName('glass')]" # NO-TRANSLATE
 cm__ab_core__enabled_name: "$cm_txt_enabled$" # NO-TRANSLATE
 cm__ab_core__enabled_desc: "이 물자의 가격을 낮추기 위해 노력합니다."
 cm__ab_core__debug_name: "$cm_txt_debug$" # NO-TRANSLATE
 cm__dbg_run_core_name: "핵심 상품 실행"
 cm__dbg_run_core_desc: "$cm_txt_dbg_run_category_desc$" # NO-TRANSLATE
 cm__dbg_run_core_text: "$cm_txt_run_now$" # NO-TRANSLATE
 cm__ab_food__ab_food_name: "$cm__ab_food_name$" # NO-TRANSLATE
 cm__ab_food_target_name: "잉여 목표"
 cm__ab_food_target_desc: "시장은 공급이 수요 대비 이 비율에 도달할 때까지 더 많은 식량 생산지를 확보합니다. 125%로 설정하면, 연중 중앙값에 해당하는 달에 25%의 잉여분에 도달하지 못한 모든 시장에서 식량이 확장됩니다. 수치를 높여 더 많은 여유분을 유지하거나, 수치를 낮춰 부족에 가까운 시장들만 지원하도록 하십시오."
 cm__ab_food_target_format: "[CMMV('cm__ab_food_target')]%" # NO-TRANSLATE
 cm__ab_food_min_potential_name: "최소 식량 잠재력"
 cm__ab_food_min_potential_desc: "자동 식량 확장은 RGO 단계당 식량 잠재력이 이 점수에 도달하는 거점에서만 활성화되며, 이는 $mapmode_cm_location_food_potential_name$ 지도 모드에 표시되는 점수와 동일합니다. 더 좋은 농경지를 선별하려면 이 값을 높이고, 생산성이 낮은 땅도 수용하려면 낮추십시오."
 cm__ab_food_min_potential_format: "[CMMV('cm__ab_food_min_potential')]" # NO-TRANSLATE
 cm__ab_food_subsidize_name: "식량 건물 보조금 지급"
 cm__ab_food_subsidize_desc: "자동 식량 기능이 건설한 식량 생산 건물에 보조금을 지급합니다. 수익이 나지 않는 건물은 인력을 고용하지 않고 식량도 생산하지 않으므로, 척박한 토지의 농촌 마을은 가동을 멈추게 됩니다. 보조금을 지급하면 인력을 유지하고 수확을 계속할 수 있습니다. 보조금은 자동으로 비활성화되지 않습니다."
 cm__ab_food_run_now_name: "식량 재계획 강제"
 cm__ab_food_run_now_desc: "연간 확인을 기다리는 대신, 이미 표본으로 추출된 달들과 이번 달의 식량 수지를 바탕으로 식량 생산지를 지금 다시 선정합니다."
 cm__ab_food_run_now_text: "$cm_txt_run_now$" # NO-TRANSLATE
 cm__ab_food__debug_name: "$cm_txt_debug$" # NO-TRANSLATE
 cm__dbg_run_food_name: "식량 관리 실행"
 cm__dbg_run_food_desc: "$cm_txt_dbg_run_category_desc$" # NO-TRANSLATE
 cm__dbg_run_food_text: "$cm_txt_run_now$" # NO-TRANSLATE
 cm__ab_production__ab_production_name: "$cm__ab_production_name$" # NO-TRANSLATE
 cm__ab_production_algorithm_name: "건설 전략"
 cm__ab_production_algorithm_desc: "생산에서 무엇을 건설할지 선택하는 방식."
 cm__ab_production_algorithm_option_1_name: "탐욕스러운"
 cm__ab_production_algorithm_option_1_desc: "투자 회수 속도가 가장 빠른 항목을 먼저 건설하며, 동일한 상품을 생산하기에 가장 적합한 장소와 가까운 곳들만 건설합니다."
 cm__ab_production_max_rel_roi_name: "최대 상대적 투자 수익률"
 cm__ab_production_max_rel_roi_desc: "동일한 상품을 생산하는 최적의 장소와 비교하여, 건물이나 업그레이드가 비용을 얼마나 더 느리게 회수하더라도 건설을 허용할지 결정합니다. 30%로 설정하면 최적지의 회수 기간이 10년일 때 13년 이내에 회수 가능한 곳까지만 건설하며, 그보다 느린 곳은 대기합니다. 0%일 때는 매달 각 상품별로 가장 효율적인 생산지에만 건설합니다. 100% 이상일 경우 제한이 없으며 '최대 비용 회수 기간'만 적용됩니다. 건물 종류와 관계없이 동일한 상품을 생산하는 모든 건물을 함께 비교합니다. RGO 확장은 항상 비용 회수 기간이 짧은 순서대로 건설됩니다."
 cm__ab_production_max_rel_roi_format: "[CMMV('cm__ab_production_max_rel_roi')]%[Select_CString(GreaterThanOrEqualTo_CFixedPoint(CMMV('cm__ab_production_max_rel_roi'), CMMMapValue('cmm_max', 'cm__ab_production_max_rel_roi')), '+', '')]" # NO-TRANSLATE
 cm__ab_production_min_roi_name: "최대 투자 회수 기간"
 cm__ab_production_min_roi_desc: "조세 수입이 설정된 연수 내에 건설 비용을 회수할 수 있는 건설 항목만 고려됩니다. 0으로 설정하면 이 검사를 비활성화합니다."
 cm__ab_production_min_roi_format: "[CMMV('cm__ab_production_min_roi')]y @efficiency!" # NO-TRANSLATE
 cm__ab_production_min_discount_name: "$cm_txt_min_discount$" # NO-TRANSLATE
 cm__ab_production_min_discount_desc: "$cm_txt_min_discount_desc$" # NO-TRANSLATE
 cm__ab_production_min_discount_format: "[CMMV('cm__ab_production_min_discount')]%" # NO-TRANSLATE
 cm__ab_production__debug_name: "$cm_txt_debug$" # NO-TRANSLATE
