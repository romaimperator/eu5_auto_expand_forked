 # Auto-Urbanize (auto_urbanize) Tab
 cm__auto_urbanize_name: "자동 도시화"
 ## Auto-Urbanize Settings (auto_urbanize) Group
 cm__auto_urbanize__auto_urbanize_name: "자동 도시화 설정"
 cm__auto_urbanize__auto_urbanize_desc: "매달 실행될 지역 등급 변경 사항을 선택하십시오."
 cm__urbanize_town_to_city_name: "마을에서 도시로"
 cm__urbanize_town_to_city_desc: "매달 자격을 갖춘 읍을 도시로 승격합니다."
 cm__urbanize_rural_to_town_name: "농촌에서 도시로"
 cm__urbanize_rural_to_town_desc: "매달 조건에 맞는 농촌 정착지를 마을로 업그레이드합니다. 인구가 30,000명 이상이거나 인구 상한까지 1,000명 이내여야 합니다. 아래의 '도시화 금지' 목록에서 RGO가 체크된 지역은 제외됩니다. 매스 자동 식량(Mass Auto-Food)이 적용된 지역도 제외됩니다."
