l_korean:
 # Mod
 cm_name: "건설 관리자"
 cm_desc: "새로운 자동화, 필터 및 지도 모드를 추가하여 EU5의 건설 경험을 대폭 개선하는 대규모 편의성 모드입니다."

 # Settings (settings) Tab
 cm__settings_name: "설정"
 ## Global Control (settings) Group
 cm__pause_auto_expand_name: "자동화 일시정지"
 cm__pause_auto_expand_desc: "모든 자동화 기능을 일시 정지합니다: 건물 자동 확장, RGO 자동 확장, 모든 건물 업그레이드, 자동 건설, 수도 건물 자동 건설, 식량 자동 관리, 자동 도시화, 도시 특권 자동 부여 및 전체 자동화."
 cm__minimum_gold_name: "금 보유고"
 cm__minimum_gold_desc: "유지할 최소 금 비축량입니다. 완전 자동화를 제외한 모든 자동화 기능에 적용됩니다."
 cm__minimum_gold_format: "[CMMV('cm__minimum_gold')]@gold!"
 cm__allowed_building_overbuild_levels_name: "초과 건설 제한"
 cm__allowed_building_overbuild_levels_desc: "자동 확장이 해당 지역에서 새로운 건설 예약을 중단하기 전까지, 지역이 '지원되는 건물 단계' 한도를 초과할 수 있는 총 건물 단계 수입니다. 0일 경우 초과 건설을 허용하지 않으며, 200 이상이면 제한이 없습니다."

 ## Priority List Group
 cm__settings__priority_list_name: "건설 자동화"
 cm__settings__priority_list_desc: "드래그하여 기능 우선순위를 변경하십시오. 매달 활성화된 기능은 위에서 아래 순서로 실행되나, 자동 도시화(Auto-Urbanize)는 항상 다른 모든 기능 및 전체 자동화(Full Automation)가 완료된 후 가장 마지막에 실행됩니다."
 cm__priority_list_item_column_name: "기능"
 cm__priority_list_i1_name: "건물 자동 확장"
 cm__priority_list_i1_desc: "수익성이 있고 인구가 가용하며 금 보유량이 금 비축량보다 높게 유지될 때 다단계 생산 및 비생산 건물을 자동으로 확장합니다. 지역 또는 건물 유형 전체에 대해 자동 확장이 활성화된 곳에 적용되며, 타국 지역의 외국 건물도 포함됩니다."
 cm__priority_list_i2_name: "RGO 자동 확장"
 cm__priority_list_i2_desc: "RGO 자동 확장이 활성화된 거점에서 노동력이 가용하고 자원이 허용될 때 RGO 단계를 자동으로 확장합니다."
 cm__priority_list_i3_name: "자동 건설"
 cm__priority_list_i3_desc: "자동 건설 탭에서 구성된 순서와 설정에 따라 수도 건물 및 지역당 하나만 건설 가능한 건물(의회, 도서관 등)을 자동으로 건설합니다."
 cm__priority_list_i4_name: "식량 자동화"
 cm__priority_list_i4_desc: "농촌 지역에서 가장 식량 효율이 높은 옵션을 선택하여 식량 생산 RGO 및 건물을 자동으로 건설합니다. '자동 식량' 탭에서 설정할 수 있습니다."
 cm__priority_list_i5_name: "자동 도시화"
 cm__priority_list_i5_desc: "매달 지역 등급을 업그레이드합니다: 농촌 정착지를 마을로, 마을을 도시로, 도시를 거대도시로 승격시킵니다. 정복된 지역은 건너뜁니다. 자동 도시화 탭에서 설정할 수 있습니다."
 cm__priority_list_i6_name: "모든 건물 자동 업그레이드"
 cm__priority_list_i6_desc: "해당 건물의 자동 확장 활성화 여부와 관계없이, 구식이 된 모든 건물을 자동으로 업그레이드합니다."
 cm__priority_list__enabled_name: "활성화됨"
 cm__priority_list__enabled_desc: "이 기능을 활성화하거나 비활성화합니다."
 cm__priority_list__min_profit_name: "최소 조세 수입"
 cm__priority_list__min_profit_desc: "건설 대기열에 추가되기 위해 레벨당 필요한 최소 월간 금입니다. 이 확인 과정을 비활성화하려면 0으로 설정하십시오."
 cm__priority_list__min_profit_postfix: "@gold!"
 cm__priority_list__min_discount_name: "최소 할인"
 cm__priority_list__min_discount_desc: "허용되는 최대 건설 자재 가격 할증률입니다. -33%일 경우 자재 가격이 기본 가격보다 33% 낮을 때만 건설합니다. 0%일 경우 기본 가격 이하일 때만 건설합니다. +33%일 경우 가격이 기본 가격보다 33% 높더라도 건설합니다."
 cm__priority_list__min_discount_postfix: "%"
 cm__priority_list__min_discount_prefix_high: "#R "
 cm__priority_list__min_discount_postfix_high: "%#!"
 cm__priority_list__min_discount_prefix_low: "#G "
 cm__priority_list__min_discount_postfix_low: "%#!"

