 # Auto Town Rights (auto_town_rights) Tab
 cm__auto_town_rights_name: "Urban Rights"
 ## Auto-Grant Town Rights (auto_town_rights) Group
 cm__auto_town_rights__auto_town_rights_name: "Auto-Grant Urban Rights"
 cm__auto_town_rights__auto_town_rights_desc: "매달 아래에 설정된 순서대로 요건을 충족하는 도시 및 메갈로폴리스에 활성화된 도시 권리를 부여합니다. 부여할 때마다 국정 역량이 소모됩니다."
 cm__auto_grant_town_rights_name: "활성화됨"
 cm__auto_grant_town_rights_desc: "자동 부여 패스를 활성화 또는 비활성화합니다. 비활성화 시 아래의 권리 목록은 무시됩니다."
 ## Town Rights Priority (auto_town_rights_list) Group
 cm__auto_town_rights__auto_town_rights_list_name: "Urban Rights Priority"
