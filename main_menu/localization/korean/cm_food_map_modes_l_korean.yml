l_korean:
 mapmode_cm_breadbasket_name: "곡창 지대"
 MAPMODE_CM_BREADBASKET: "#T $mapmode_cm_breadbasket_name$#!\n현재 자동 식량이 작동하도록 설정된 [locations|e]를 강조합니다."
 MAPMODE_CM_BREADBASKET_TT_ENABLED: "[ROOT.GetLocation.GetName]에 자동 식량이 설정되었습니다."
 MAPMODE_CM_BREADBASKET_TT_OWNED: "[ROOT.GetLocation.GetName]은(는) 귀하의 소유이지만 자동 식량 기능이 활성화되어 있지 않습니다."
 MAPMODE_CM_BREADBASKET_TT_FOREIGN: "[ROOT.GetLocation.GetName]은(는) 귀하의 것이 아닙니다."
 MAPMODE_CM_BREADBASKET_TT_UNCOLONIZED: "[ROOT.GetLocation.GetName]은(는) 개척되지 않았습니다."
 MAPMODE_CM_BREADBASKET_TT_WATER: "[ROOT.GetLocation.GetName]은(는) 해역입니다."

 cm_breadbasket_enabled_legend_key: "자동 식량 활성화됨"
 cm_breadbasket_owned_legend_key: "귀하의 다른 지역"
 cm_breadbasket_foreign_legend_key: "타국 지역"
 cm_breadbasket_uncolonized_legend_key: "미개척"

 mapmode_cm_location_food_potential_name: "RGO 레벨당 식량 잠재력"
 MAPMODE_CM_LOCATION_FOOD_POTENTIAL: "#T $mapmode_cm_location_food_potential_name$#!\n이것은 [rgo|e] 단계당 [locations|e]의 자연 식량 잠재력에 따라 색상을 표시합니다. 이 점수는 [rgo|e] [food|e] 값, 누적된 [food_productivity|e](지형, 식생, 기후, 스카네 청어 시장이나 비옥한 나일 삼각주와 같이 이름이 지정된 정적 수정치, [rgo|e] 전용 산출 수정치 등), 용수 접근성, 그리고 [rgo|e]이 허용하는 경우의 [ShowBuildingTypeName('windmill')], [ShowBuildingTypeName('farming_village')], [ShowBuildingTypeName('irrigation_systems')] 최대 예상 보너스를 합산한 것입니다.\n\n[development|e]은 제외되므로, 점수는 현재 산출량이 아닌 지형 잠재력을 보여줍니다."
 mapmode_cm_location_food_potential_hidden_name: "$mapmode_cm_location_food_potential_name$"
 MAPMODE_CM_LOCATION_FOOD_POTENTIAL_HIDDEN: "$MAPMODE_CM_LOCATION_FOOD_POTENTIAL$"
 MAPMODE_CM_LOCATION_FOOD_POTENTIAL_TT_LAND: "[ROOT.GetLocation.GetName]의 [rgo|e] 레벨당 식량 잠재력은 [ROOT.GetLocation.MakeScope.ScriptValue('cm_location_food_potential')|1Y]입니다."
 MAPMODE_CM_LOCATION_FOOD_POTENTIAL_TT_WATER: "[ROOT.GetLocation.GetName]은(는) 육지가 아니므로 식량 잠재력이 없습니다."

 cm_location_food_potential_auto_food_legend_key: "자동 식량 활성화 (빗금)"
 cm_location_food_potential_bright_green_legend_key: "45 (최대 가능)"
 cm_location_food_potential_green_legend_key: "27.5 (우수함)"
 cm_location_food_potential_yellow_legend_key: "20 (상품)"
 cm_location_food_potential_orange_legend_key: "12.5 (준수함)"
 cm_location_food_potential_red_legend_key: "3.75 (낮음)"
 cm_location_food_potential_black_legend_key: "0 (없음)"
