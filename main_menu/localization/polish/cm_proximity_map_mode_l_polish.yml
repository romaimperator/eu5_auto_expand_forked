l_polish:
 mapmode_cm_location_proximity_modifier_name: "Wpływ bliskości na efektywność"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER: "#T $mapmode_cm_location_proximity_modifier_name$#!\nKoloruje [locations|e] według ich $mapmode_cm_location_proximity_modifier_name$: łączną karę, jaką ich [topography|e] oraz [vegetation|e] nakładają na [proximity|e] (góry, wzgórza, płaskowyże, mokradła, lasy, dżungle itp.). Zielony oznacza, że teren nie utrudnia bliskości; czerwony oznacza, że utrudnia ją znacznie. Kary topograficzne są skalowane przez premie właściciela do wpływu bliskości, takie jak te z terenu stolicy lub postępów; nieposiadane lokacje pokazują bazowe wartości terenu. [road|e] lub [river|e] w lokacji znosi jej karę za [vegetation|e]; kara za [topography|e] zawsze obowiązuje.\n\nWoda pokazuje zamiast tego [maritime_presence|e], jaką wybrany [country|e] tam posiada, od zielonego przy najniższej wartości, przez jasnozielony, aż po jasnoniebieski przy pełnej. Wysoka obecność zmniejsza [proximity|e] traconą podczas przekraczania [seazone|e]."
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_LAND: "$mapmode_cm_location_proximity_modifier_name$: [ROOT.GetLocation.MakeScope.ScriptValue('cm_location_proximity_modifier')|+=%]"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_LAND_HARBOR: "$MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_LAND$\nPrzydatność naturalnego portu: [ROOT.GetLocation.GetModifierValueFixed('natural_harbor_suitability')|0%]"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER: "[ROOT.GetLocation.GetName] nie jest lądem, więc nie posiada $mapmode_cm_location_proximity_modifier_name$, a wybrany [country|e] nie posiada tutaj [maritime_presence|e]."

 cm_location_proximity_modifier_none_legend_key: "0% (brak kary)"
 cm_location_proximity_modifier_light_legend_key: "-25% (lekki)"
 cm_location_proximity_modifier_noticeable_legend_key: "-35% (zauważalny)"
 cm_location_proximity_modifier_moderate_legend_key: "-50% (umiarkowany)"
 cm_location_proximity_modifier_heavy_legend_key: "-65% (duży)"
 cm_location_proximity_modifier_severe_legend_key: "-75% (dotkliwy)"
 cm_location_proximity_modifier_worst_legend_key: "-100% (najgorszy)"
 cm_location_proximity_modifier_harbor_legend_key: "Przydatność naturalnego portu (paski)"
 cm_location_proximity_modifier_maritime_none_legend_key: "Brak obecności morskiej (otwarte wody)"
 cm_location_proximity_modifier_maritime_low_legend_key: "Niska obecność morska"
 cm_location_proximity_modifier_maritime_half_legend_key: "50% obecności morskiej"
 cm_location_proximity_modifier_maritime_full_legend_key: "100% obecności morskiej"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER_M0: "[maritime_presence|E]: 0-10%"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER_M10: "[maritime_presence|E]: 10-20%"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER_M20: "[maritime_presence|E]: 20-30%"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER_M30: "[maritime_presence|E]: 30-40%"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER_M40: "[maritime_presence|E]: 40-50%"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER_M50: "[maritime_presence|E]: 50-60%"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER_M60: "[maritime_presence|E]: 60-70%"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER_M70: "[maritime_presence|E]: 70-80%"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER_M80: "[maritime_presence|E]: 80-90%"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER_M90: "[maritime_presence|E]: 90-100%"
