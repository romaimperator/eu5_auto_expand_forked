l_polish:
 mapmode_cm_location_proximity_modifier_name: "Wpływ bliskości na efektywność"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER: "#T $mapmode_cm_location_proximity_modifier_name$#!\nKoloruje [locations|e] według ich wpływu na efektywność bliskości: łączna kara, jaką ich [topography|e] i [vegetation|e] nakładają na [proximity|e] (góry, wzgórza, płaskowyże, mokradła, lasy, dżungle itp.). Zielony oznacza, że teren nie utrudnia bliskości; czerwony oznacza, że utrudnia ją znacznie. Kary topograficzne są skalowane przez premie właściciela do wpływu na bliskość, takie jak te z terenu stolicy lub postępów; nieposiadane lokacje pokazują bazowe wartości terenu. [road|e] lub [river|e] w lokacji anuluje jej karę za [vegetation|e]; kara za [topography|e] obowiązuje zawsze."
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_LAND: "Wpływ bliskości na efektywność: [ROOT.GetLocation.MakeScope.ScriptValue('cm_location_proximity_modifier')|+=%]"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_LAND_HARBOR: "Wpływ wydajności bliskości: [ROOT.GetLocation.MakeScope.ScriptValue('cm_location_proximity_modifier')|+=%]\nZdatność naturalnego portu: [ROOT.GetLocation.GetModifierValueFixed('natural_harbor_suitability')|0%]"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER: "[ROOT.GetLocation.GetName] nie jest lądem, więc nie posiada wpływu na wydajność bliskości."

 cm_location_proximity_modifier_none_legend_key: "0% (brak kary)"
 cm_location_proximity_modifier_light_legend_key: "-25% (lekki)"
 cm_location_proximity_modifier_noticeable_legend_key: "-35% (zauważalny)"
 cm_location_proximity_modifier_moderate_legend_key: "-50% (umiarkowany)"
 cm_location_proximity_modifier_heavy_legend_key: "-65% (duży)"
 cm_location_proximity_modifier_severe_legend_key: "-75% (dotkliwy)"
 cm_location_proximity_modifier_worst_legend_key: "-100% (najgorszy)"
 cm_location_proximity_modifier_harbor_legend_key: "Przydatność naturalnego portu (paski)"
