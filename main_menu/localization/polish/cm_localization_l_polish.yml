 cm_txt_min_discount_desc: "Maksymalny dopuszczalny narzut na cenę materiałów budowlanych. Przy -33% buduje tylko wtedy, gdy materiały kosztują o 33% mniej niż cena bazowa. Przy 0% tylko po cenie bazowej lub niższej. Przy +33% buduje nawet wtedy, gdy ceny są o 33% wyższe od ceny bazowej."
 cm_txt_dbg_run_feature_desc: "Uruchamia tę funkcję natychmiast, zamiast czekać na zmianę miesiąca. Nic innego nie zostanie wybudowane w rozpoczętym przez to cyklu, a Wstrzymanie automatyzacji nie blokuje tej akcji."
 cm_txt_dbg_run_category_desc: "Przetwarza tę kategorię teraz, samodzielnie, zamiast czekać na zmianę miesiąca. Wydaje to, co pozostało z jej udziału, więc kategoria, która dokonała już wydatków w tym miesiącu, nic nie wybuduje. Wstrzymanie automatyzacji nie powstrzymuje tej akcji."
