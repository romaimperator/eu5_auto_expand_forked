l_polish:
 mapmode_cm_breadbasket_name: "Spichlerze"
 MAPMODE_CM_BREADBASKET: "#T $mapmode_cm_breadbasket_name$#!\nPodświetla twoje [locations|e], w których obecnie skonfigurowano automatyczne zarządzanie żywnością."
 MAPMODE_CM_BREADBASKET_TT_ENABLED: "[ROOT.GetLocation.GetName] ma skonfigurowaną automatyzację żywności."
 MAPMODE_CM_BREADBASKET_TT_OWNED: "[ROOT.GetLocation.GetName] należy do ciebie, ale nie ma włączonej automatyzacji żywności."
 MAPMODE_CM_BREADBASKET_TT_FOREIGN: "[ROOT.GetLocation.GetName] nie należy do ciebie."
 MAPMODE_CM_BREADBASKET_TT_UNCOLONIZED: "[ROOT.GetLocation.GetName] jest nieskolonizowane."
 MAPMODE_CM_BREADBASKET_TT_WATER: "[ROOT.GetLocation.GetName] to strefa morska."

 cm_breadbasket_enabled_legend_key: "Auto-żywność włączona"
 cm_breadbasket_owned_legend_key: "Twoje pozostałe lokacje"
 cm_breadbasket_foreign_legend_key: "Zagraniczne lokacje"
 cm_breadbasket_uncolonized_legend_key: "Nieskolonizowane"

 mapmode_cm_location_food_potential_name: "Potencjał żywnościowy na poziom RGO"
 MAPMODE_CM_LOCATION_FOOD_POTENTIAL: "#T $mapmode_cm_location_food_potential_name$#!\nTo koloruje [locations|e] według ich naturalnego potencjału żywnościowego na poziom [rgo|e]. Wynik łączy wartość [rgo|e] [food|e], kumulatywne [food_productivity|e] (teren, roślinność, klimat, nazwane modyfikatory statyczne, takie jak Jarmark Śledziowy w Skanii czy Żyzna Delta Nilu, modyfikatory produkcji specyficzne dla [rgo|e] itp.), dostęp do wody oraz zakładane maksymalne bonusy z [ShowBuildingTypeName('windmill')], [ShowBuildingTypeName('farming_village')] i [ShowBuildingTypeName('irrigation_systems')] tam, gdzie pozwala na to [rgo|e].\n\nWkład [development|e] jest wykluczony, aby wynik odzwierciedlał czysty potencjał terenu, a nie migawkę obecnych inwestycji."
 mapmode_cm_location_food_potential_hidden_name: "$mapmode_cm_location_food_potential_name$"
 MAPMODE_CM_LOCATION_FOOD_POTENTIAL_HIDDEN: "$MAPMODE_CM_LOCATION_FOOD_POTENTIAL$"
 MAPMODE_CM_LOCATION_FOOD_POTENTIAL_TT_LAND: "[ROOT.GetLocation.GetName] ma potencjał żywnościowy na poziom [rgo|e] wynoszący [ROOT.GetLocation.MakeScope.ScriptValue('cm_location_food_potential')|1Y]."
 MAPMODE_CM_LOCATION_FOOD_POTENTIAL_TT_WATER: "[ROOT.GetLocation.GetName] nie jest lądem, więc nie posiada potencjału żywnościowego."

 cm_location_food_potential_auto_food_legend_key: "Auto-żywność włączona (w paski)"
 cm_location_food_potential_bright_green_legend_key: "45 (maksymalnie)"
 cm_location_food_potential_green_legend_key: "27.5 (znakomity)"
 cm_location_food_potential_yellow_legend_key: "20 (towar)"
 cm_location_food_potential_orange_legend_key: "12.5 (przyzwoity)"
 cm_location_food_potential_red_legend_key: "3.75 (niski)"
 cm_location_food_potential_black_legend_key: "0 (brak)"
