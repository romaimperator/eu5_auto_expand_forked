 cm__ab_core__ab_core_name: "$cm__ab_core_name$" # NO-TRANSLATE
 cm__ab_core__ab_core_desc: "Ustawienia dóbr podstawowych. Materiały są przetwarzane od góry listy w dół, przy czym RGO są rozbudowywane przed budynkami produkcyjnymi."
 cm__ab_core_target_name: "Cena docelowa"
 cm__ab_core_target_desc: "Cena, przy której budowa dla danego materiału zostaje wstrzymana, w stosunku do jego ceny bazowej. Przy -33% producenci są budowani do momentu, gdy materiał jest sprzedawany o 33% poniżej ceny bazowej. Przy 0% do czasu osiągnięcia ceny bazowej. Przy +33% tylko wtedy, gdy kosztuje on o ponad 33% powyżej ceny bazowej."
 cm__ab_core_target_format: "[CMMV('cm__ab_core_target')]%" # NO-TRANSLATE
 cm__ab_core_item_column_name: "Materiał"
 cm__ab_core_i1_name: "@masonry! [ShowGoodsName('masonry')]" # NO-TRANSLATE
 cm__ab_core_i2_name: "@lumber! [ShowGoodsName('lumber')]" # NO-TRANSLATE
 cm__ab_core_i3_name: "@sand! [ShowGoodsName('sand')]" # NO-TRANSLATE
 cm__ab_core_i4_name: "@glass! [ShowGoodsName('glass')]" # NO-TRANSLATE
 cm__ab_core__enabled_name: "$cm_txt_enabled$" # NO-TRANSLATE
 cm__ab_core__enabled_desc: "Pracuj nad obniżeniem ceny tego materiału."
 cm__ab_core__debug_name: "$cm_txt_debug$" # NO-TRANSLATE
 cm__dbg_run_core_name: "Uruchom towary podstawowe"
 cm__dbg_run_core_desc: "$cm_txt_dbg_run_category_desc$" # NO-TRANSLATE
 cm__dbg_run_core_text: "$cm_txt_run_now$" # NO-TRANSLATE
 cm__ab_food__ab_food_name: "$cm__ab_food_name$" # NO-TRANSLATE
 cm__ab_food_target_name: "Docelowa nadwyżka"
 cm__ab_food_target_desc: "Rynek otrzymuje więcej lokacji produkcji żywności, dopóki podaż nie osiągnie tej części popytu. Przy wartości 125% produkcja żywności jest rozbudowywana na każdym rynku, którego mediana miesięczna w roku nie osiągnęła 25% nadwyżki. Zwiększ tę wartość, aby zachować większy bufor, lub zmniejsz ją, aby pomagać tylko rynkom bliższym niedoboru."
 cm__ab_food_target_format: "[CMMV('cm__ab_food_target')]%" # NO-TRANSLATE
 cm__ab_food_min_potential_name: "Minimalny potencjał żywnościowy"
 cm__ab_food_min_potential_desc: "Automatyczna produkcja żywności jest włączona tylko w lokacjach, których potencjał żywnościowy na poziom RGO osiąga tę wartość – tę samą, którą pokazuje tryb mapy $mapmode_cm_location_food_potential_name$. Zwiększ ją, aby celować w lepsze ziemie uprawne, lub zmniejsz, aby zaakceptować słabsze tereny."
 cm__ab_food_min_potential_format: "[CMMV('cm__ab_food_min_potential')]" # NO-TRANSLATE
 cm__ab_food_subsidize_name: "Subsydiuj budynki żywnościowe"
 cm__ab_food_subsidize_desc: "Subsydiuj budynki produkujące żywność wznoszone przez funkcję auto-food. Budynek, który nie przynosi zysków, nikogo nie zatrudnia i nie wytwarza żywności, przez co wioska rolnicza na słabej ziemi stoi bezczynnie; subsydiowanie jej pozwala utrzymać obsadę pracowników i zapewnić zbiory. Subsydia nigdy nie są wyłączane."
 cm__ab_food_run_now_name: "Wymuś ponowne planowanie żywności"
 cm__ab_food_run_now_desc: "Wybierz ponownie lokacje żywności teraz, oceniając na podstawie bilansu żywności z tego miesiąca wraz z miesiącami już sprawdzonymi, zamiast czekać na coroczną weryfikację."
 cm__ab_food_run_now_text: "$cm_txt_run_now$" # NO-TRANSLATE
 cm__ab_food__debug_name: "$cm_txt_debug$" # NO-TRANSLATE
 cm__dbg_run_food_name: "Uruchom żywność"
 cm__dbg_run_food_desc: "$cm_txt_dbg_run_category_desc$" # NO-TRANSLATE
 cm__dbg_run_food_text: "$cm_txt_run_now$" # NO-TRANSLATE
 cm__ab_production__ab_production_name: "$cm__ab_production_name$" # NO-TRANSLATE
 cm__ab_production_algorithm_name: "Strategia budowy"
 cm__ab_production_algorithm_desc: "Jak produkcja wybiera, co budować."
 cm__ab_production_algorithm_option_1_name: "Chciwy"
 cm__ab_production_algorithm_option_1_desc: "Buduj najpierw opcje o najszybszym zwrocie i tylko te zbliżone do najlepszego znalezionego miejsca produkcji tych samych dóbr."
 cm__ab_production_max_rel_roi_name: "Maksymalny względny ROI"
 cm__ab_production_max_rel_roi_desc: "Określa, o ile wolniej od najlepszego znalezionego miejsca wytwarzającego te same towary budynek lub ulepszenie może spłacać swój koszt, aby nadal zostać zbudowanym. Przy 30%, jeśli najlepszy spłaca się w 10 lat, budowane są tylko te spłacające się w ciągu 13 lat; wszystko wolniejsze czeka. Przy 0% każdego miesiąca budowany jest tylko najlepszy producent każdego towaru. Przy 100%+ nie ma limitu i obowiązuje tylko Maks. liczba lat spłaty. Wszystkie budynki wytwarzające te same towary są oceniane wspólnie, niezależnie od ich rodzaju. Rozbudowy RGO są zawsze budowane w kolejności czasu spłaty."
 cm__ab_production_max_rel_roi_format: "[CMMV('cm__ab_production_max_rel_roi')]%[Select_CString(GreaterThanOrEqualTo_CFixedPoint(CMMV('cm__ab_production_max_rel_roi'), CMMMapValue('cmm_max', 'cm__ab_production_max_rel_roi')), '+', '')]" # NO-TRANSLATE
 cm__ab_production_min_roi_name: "Maksymalna liczba lat zwrotu"
 cm__ab_production_min_roi_desc: "Pod uwagę brane są tylko budowy, których dochód z podatków zwróci koszt budowy w ciągu tylu lat. Ustaw na 0, aby wyłączyć to sprawdzenie."
 cm__ab_production_min_roi_format: "[CMMV('cm__ab_production_min_roi')]y @efficiency!" # NO-TRANSLATE
 cm__ab_production_min_discount_name: "$cm_txt_min_discount$" # NO-TRANSLATE
 cm__ab_production_min_discount_desc: "$cm_txt_min_discount_desc$" # NO-TRANSLATE
 cm__ab_production_min_discount_format: "[CMMV('cm__ab_production_min_discount')]%" # NO-TRANSLATE
 cm__ab_production__debug_name: "$cm_txt_debug$" # NO-TRANSLATE
 cm__dbg_run_production_name: "Uruchom produkcję"
 cm__dbg_run_production_desc: "$cm_txt_dbg_run_category_desc$" # NO-TRANSLATE
 cm__dbg_run_production_text: "$cm_txt_run_now$" # NO-TRANSLATE
 cm__ab_roads__ab_roads_name: "$cm__ab_roads_name$" # NO-TRANSLATE
 cm__ab_roads_proximity_name: "$cm_txt_proximity$" # NO-TRANSLATE
 cm__ab_roads_proximity_desc: "Buduj odcinki dróg, które najbardziej zwiększają Bliskość w stosunku do wydanego złota, wliczając każdą lokację znajdującą się dalej na trasie za nimi."
 cm__ab_roads_market_access_name: "Dostęp do rynku"
 cm__ab_roads_market_access_desc: "Buduj odcinki dróg, które najbardziej zwiększają Dostęp do Rynku w stosunku do kosztu w złocie. Wydaje środki tylko w miesiącu, w którym Bliskość nic nie wybudowała i nie oszczędza na odcinek, na który jeszcze go nie stać."
 cm__ab_roads_capital_name: "Połączenie ze stolicą"
 cm__ab_roads_capital_desc: "Buduj odcinki dróg, aby połączyć swoje lokacje ze stolicą, posuwając się na zewnątrz od tych już połączonych. Wydaje środki tylko w miesiącu, w którym Bliskość i Dostęp do rynku nic nie zbudowały oraz żadne z nich nie oszczędza na odcinek, na który jeszcze go nie stać."
 cm__ab_roads_min_discount_name: "$cm_txt_min_discount$" # NO-TRANSLATE
 cm__ab_roads_min_discount_desc: "Maksymalna dozwolona marża cen materiałów budowlanych. Przy -33% budowa rozpocznie się tylko wtedy, gdy wymagane drewno, materiały murarskie i piasek kosztują 33% poniżej ceny bazowej. Przy 0% tylko po cenie bazowej lub niższej. Przy +33% rozpocznie ją nawet wtedy, gdy ceny są o 33% wyższe od ceny bazowej."
 cm__ab_roads_min_discount_format: "[CMMV('cm__ab_roads_min_discount')]%" # NO-TRANSLATE
 cm__ab_roads_run_now_name: "Wymuś ponowne planowanie dróg"
 cm__ab_roads_run_now_desc: "Wyznacz teraz ponownie odcinki dróg do położenia, zamiast czekać na kolejny cykl planowania. W trybie wieloosobowym jest to jedyny sposób na ich wyznaczenie. Funkcja ta nie buduje dróg samodzielnie; znalezione odcinki są budowane w miarę dostępności środków w budżecie na drogi."
 cm__ab_roads_run_now_text: "$cm_txt_run_now$" # NO-TRANSLATE
 cm__ab_roads__debug_name: "$cm_txt_debug$" # NO-TRANSLATE
 cm__dbg_run_roads_name: "Buduj drogi"
 cm__dbg_run_roads_desc: "Zamawia odcinki dróg z bieżącego planu natychmiast, samodzielnie, zamiast czekać na zmianę miesiąca. Wydaje to, co pozostało z jego przydziału, więc kategoria, która wykorzystała już środki w tym miesiącu, niczego nie wybuduje. Wstrzymanie automatyzacji nie blokuje tej akcji."
 cm__dbg_run_roads_text: "$cm_txt_run_now$" # NO-TRANSLATE
 cm__ab_governors__ab_governors_name: "$cm__ab_governors_name$" # NO-TRANSLATE
 cm__ab_gov_move_seats_name: "Zezwól na przenoszenie gubernatorów"
 cm__ab_gov_move_seats_desc: "Gdy wszystkie miejsca na rządców są pełne, odwołaj rządcę i mianuj go w lepszej lokalizacji. Lepsza lokalizacja musi być już miastem lub mieć wynik o ponad 10% wyższy niż ta, którą zastępuje. Przy wyłączonej opcji rządcy trafiają tylko do pustych miejsc."
 cm__ab_gov_prepare_sites_name: "Zezwól na przygotowywanie nowych lokacji"
 cm__ab_gov_prepare_sites_desc: "Rozważaj lokacje, które nie mogą jeszcze przyjąć zarządcy, i przygotuj je w pierwszej kolejności, zakładając w nich miasteczko lub miasto oraz budując drogę do stolicy. Przy wyłączonej opcji pod uwagę brane są tylko lokacje będące już miastami z drogą do stolicy."
 cm__ab_governors__debug_name: "$cm_txt_debug$" # NO-TRANSLATE
 cm__dbg_run_governors_name: "Rozpocznij plan gubernatora"
 cm__dbg_run_governors_desc: "Rozpoczyna nowy plan teraz, zamiast w zwyczajowym cyklu dwudziestopięcioletnim. Plan będzie następnie przechodzić przez swoje etapy w nadchodzących miesiącach, tak jak zawsze. Nadal wymaga pokoju, posiadania stolicy oraz braku innego aktywnego wyszukiwania."
 cm__dbg_run_governors_text: "Start"
 cm__urbanization_name: "Urbanizacja"
 cm__auto_urbanize_enabled_name: "$cm_txt_enabled$" # NO-TRANSLATE
 cm__auto_urbanize_enabled_desc: "Włącz lub wyłącz automatyczną urbanizację."
 cm__auto_urbanize_min_discount_name: "$cm_txt_min_discount$" # NO-TRANSLATE
 cm__auto_urbanize_min_discount_desc: "Maksymalny dozwolony narzut na cenę materiałów budowlanych. Przy -33% zakłada miasteczka i miasta tylko wtedy, gdy materiały kosztują o 33% poniżej ceny bazowej. Przy 0% tylko po cenie bazowej lub niższej. Przy +33% zakłada je nawet wtedy, gdy ceny są o 33% powyżej ceny bazowej."
 cm__auto_urbanize_min_discount_format: "[CMMV('cm__auto_urbanize_min_discount')]%" # NO-TRANSLATE
 cm__auto_urbanize__debug_name: "$cm_txt_debug$" # NO-TRANSLATE
 cm__dbg_run_auto_urbanize_name: "Uruchom auto-urbanizację"
 cm__dbg_run_auto_urbanize_desc: "Uruchamia teraz ulepszenia rang niezależnie, zamiast czekać na zmianę miesiąca. Nic innego nie buduje się w cyklu, który ta funkcja uruchamia, a Pauza Automatyzacji jej nie wstrzymuje."
 cm__dbg_run_auto_urbanize_text: "$cm_txt_run_now$" # NO-TRANSLATE
 cm__auto_town_rights__auto_town_rights_specialization_name: "Nadawca praw inteligentnej specjalizacji"
 cm__auto_town_rights__auto_town_rights_specialization_desc: "Przyznawane po zakończeniu tury przez Własnego Nadawcę Praw."
 cm__auto_grant_specialization_name: "Auto-nadawanie miejskich praw specjalizacji"
 cm__auto_grant_specialization_desc: "Przyznaj jedno prawo do specjalizacji na lokację, wybierając to o najwyższej wartości w złocie spośród tych, które pasują do towarów wytwarzanych w okolicy."
 cm__specialization_window_name: "Próg dopasowania"
 cm__specialization_window_desc: "Jak bardzo prawo specjalizacji musi pasować do danej lokalizacji w porównaniu do najlepiej dopasowanego tam prawa, aby było brane pod uwagę. Przy 50% każde prawo pasujące przynajmniej w połowie tak dobrze jest brane pod uwagę, a przyznawane jest to warte najwięcej złota. Przy 100% przyznawane jest wyłącznie najlepiej dopasowane prawo."
 cm__specialization_window_format: "[CMMV('cm__specialization_window')]%" # NO-TRANSLATE
 cm__specialization_expand_name: "Rozbuduj wzmocnione przemysły"
 cm__specialization_expand_desc: "Po nadaniu przywileju specjalizacji włączona zostanie również automatyczna rozbudowa w danej lokacji dla przemysłów wspieranych przez ten przywilej oraz dla produkowanych w niej surowców. Działa to tak samo, jak kliknięcie prawym przyciskiem myszy na przycisk nadania na mapie Zalecanych Przywilejów Miejskich."
 cm__auto_town_rights__debug_name: "$cm_txt_debug$" # NO-TRANSLATE
 cm__dbg_run_town_rights_name: "Uruchom automatyczne nadawanie praw miejskich"
 cm__dbg_run_town_rights_desc: "Przyznaje teraz zamiast czekać na zmianę miesiąca, przetwarzając najpierw listę aktywnych, a następnie prawa specjalizacji. Wstrzymanie automatyzacji nie blokuje tego działania."
 cm__dbg_run_town_rights_text: "$cm_txt_run_now$" # NO-TRANSLATE
 cm__miscellaneous_name: "Różne"
 cm__cleanup_name: "Czyszczenie budynków"
 cm__cleanup__cleanup_name: "$cm__cleanup_name$" # NO-TRANSLATE
 cm__cleanup_close_open_name: "Zamykanie i otwieranie budynków"
 cm__cleanup_close_open_desc: "Raz w roku zamyka budynki produkcyjne, które przestały przynosić zyski i nie są dotowane. Zamknięte budynki są otwierane ponownie, gdy dany typ zacznie ponownie zarabiać na tym rynku. @farming_village! [ShowBuildingTypeNameWithNoTooltip('farming_village')] oraz @market_village! [ShowBuildingTypeNameWithNoTooltip('market_village')] nigdy nie są zamykane."
 cm__cleanup_destroy_name: "Wyburz budynki"
 cm__cleanup_destroy_desc: "Raz w roku niszcz budynki produkcyjne, które przestały przynosić zyski w lokalizacjach, w których brakuje mniej niż dziesięciu poziomów do limitu obsługiwanych poziomów budynków, wraz z tymi już zamkniętymi w miejscach, w których od tego czasu skończyło się miejsce. @market_village! [ShowBuildingTypeNameWithNoTooltip('market_village')] zostaje zamiast tego zredukowany do jednego poziomu. @fruit_orchard! [ShowBuildingTypeNameWithNoTooltip('fruit_orchard')] zostanie zniszczony i nigdy nie odbudowany bez względu na dochody, a @farming_village! [ShowBuildingTypeNameWithNoTooltip('farming_village')] nigdy nie zostanie zniszczony."
 cm__cleanup_min_profit_name: "Minimalny zysk na poziom"
 cm__cleanup_min_profit_desc: "Budynek zarabiający miesięcznie na poziom mniej niż ta kwota jest uznawany za nierentowny i zostanie zamknięty lub zburzony, chyba że jest dotowany."
 cm__cleanup_min_profit_format: "[Divide_CFixedPoint(CMMV('cm__cleanup_min_profit'), '(CFixedPoint)100')|2]@gold!" # NO-TRANSLATE
 cm__cleanup_max_changed_name: "Maksymalnie zmienionych na cykl"
 cm__cleanup_max_changed_desc: "Udział budynków danego typu na rynku, który może ulec zmianie w jednym rocznym cyklu. Przy 50% połowa otwartych budynków może zostać zamknięta lub zniszczona, a połowa zamkniętych ponownie otwarta. Nigdy nie mniej niż jeden, więc ostatni budynek danego typu wciąż może zostać zamknięty."
 cm__cleanup_max_changed_format: "[CMMV('cm__cleanup_max_changed')]%" # NO-TRANSLATE
 cm__cleanup_core_goods_name: "Priorytetyzuj materiały budowlane"
 cm__cleanup_core_goods_desc: "Utrzymuj budynki, które konsumują głównie @masonry![ShowGoodsNameWithNoTooltip('masonry')], @lumber![ShowGoodsNameWithNoTooltip('lumber')], @sand![ShowGoodsNameWithNoTooltip('sand')] lub @glass![ShowGoodsNameWithNoTooltip('glass')], na poziomie dwukrotności Minimalnego zysku na poziom lub 0.1@gold! na poziom, zależnie od tego, która wartość jest wyższa. Budynki produkujące jeden z tych czterech towarów nie są nigdy zamykane ani niszczone, gdy ta opcja jest włączona."
 cm__cleanup_auto_food_name: "Wyczyść lokacje automatycznej żywności"
 cm__cleanup_auto_food_desc: "Tam, gdzie działa automatyzacja żywności i występuje niedobór jakiegokolwiek rodzaju pracowników, niszcz budynki produkcyjne, które nie wytwarzają żywności. @market_village! [ShowBuildingTypeNameWithNoTooltip('market_village')] zostanie zredukowany do jednego poziomu zamiast zostać zniszczonym."
 cm__cleanup_run_now_name: "Uruchom oczyszczanie budynków"
 cm__cleanup_run_now_desc: "Uruchom oczyszczanie teraz, zamiast czekać na coroczny przebieg."
 cm__cleanup_run_now_text: "$cm_txt_run_now$" # NO-TRANSLATE
 cm__placement_finder_method_option_3_name: "Populacja"
 cm__placement_finder_method_option_3_desc: "Sortuj według przyrostu bliskości, jaki zapewniłoby umieszczenie tam gubernatora lub stolicy, ważąc każdą lokację przez jej populację. Niewielki zysk przy dużej populacji jest wart mniej niż duży zysk przy małej."
 cm__log_production_name: "$cm__ab_production_name$" # NO-TRANSLATE
 cm__log_production_desc: "Wiersze dla każdego budynku kolejkowanego przez kategorię Produkcja oraz każdej rozważanej rozbudowy surowców, wraz z czasem zwrotu i dochodem dla każdej z nich."
 cm__log_core_name: "$cm__ab_core_name$" # NO-TRANSLATE
 cm__log_core_desc: "Linie śledzące jedną lokację przez cykl Dóbr Podstawowych: niedobór rynkowy i pożądane poziomy, a następnie to, co danej lokacji przydzielono, jak ją oceniono i co wybudowano. Najpierw oznacz lokację komendą konsoli effect location:<key> = { cm_ab_core_watch_on = yes }."
 cm__debug__rotation_name: "Rotacja rynków"
 cm__debug__rotation_desc: "Duże państwo obsługuje swoje rynki partiami, a każda automatyzacja buduje w obrębie zestawu, nad którym aktualnie pracuje."
 cm__dbg_rotate_slice_name: "Rotuj rynki"
 cm__dbg_rotate_slice_desc: "Przechodzi do następnego zestawu rynków. Proces rozpoczęty jednym z przycisków „Uruchom teraz” zatrzymuje się na znalezionym zestawie, więc to pozwala na jego kontynuację, gdy gra jest wstrzymana."
 cm__dbg_rotate_slice_text: "Obróć"
 cm__probe_production_anchors_name: "Kotwice produkcji"
 cm__probe_production_anchors_desc: "Po jednym wierszu na towar z najlepszym okresem zwrotu odnotowanym przez Produkcję i wyznaczonym przez niego limitem zwrotu, z podaniem nazwy budynku i lokalizacji dla każdego z nich."
 cm__probe_production_anchors_text: "$cm_txt_run$" # NO-TRANSLATE
 cm__probe_production_rgo_name: "Produkcja surowców"
 cm__probe_production_rgo_desc: "Jedna linia dla każdego powodu, dla którego Produkcja pominęła surowce danej lokacji, lub pojedyncza linia, gdy nie pominęła żadnego. Odczytuje dane stolicy, chyba że oznaczysz lokację poleceniem konsoli effect location:<key> = { cm_ab_core_watch_on = yes }."
 cm__probe_production_rgo_text: "$cm_txt_run$" # NO-TRANSLATE
 cm__probe_core_name: "$cm__ab_core_name$" # NO-TRANSLATE
 cm__probe_core_desc: "Każda liczba odczytywana przez Core Goods w lokacji, obok własnego odczytu gry, a następnie to, co rynek danej lokacji mógłby wchłonąć w cyklu. Odczytuje stolicę, chyba że oznaczysz lokację efektem komendy konsoli location:<key> = { cm_ab_core_watch_on = yes }; stolica nigdy nie jest kandydatem dla Core Goods, więc oznacz lokację, aby odczytać dane dla tej, w której system by budował."
 cm__probe_core_text: "$cm_txt_run$" # NO-TRANSLATE
 cm__probe_setup_name: "$cm_txt_setup_data$" # NO-TRANSLATE
 cm__probe_setup_desc: "Które dane mapy zawiera zapis oraz wersja, w której każda z nich została opracowana, a także informacja, czy ta maszyna ma uprawnienie do ich opracowywania. Wersja 0 oznacza, że dane nie zostały jeszcze opracowane i nastąpi to przy następnym wczytywaniu."
 cm__probe_setup_text: "$cm_txt_run$" # NO-TRANSLATE
 cm__debug__setup_name: "$cm_txt_setup_data$" # NO-TRANSLATE
 cm__debug__setup_desc: "Dane mapy, które mod oblicza raz, a następnie odczytuje przez resztę gry."
 cm__dbg_rebuild_setup_name: "Przebuduj dane konfiguracji"
 cm__dbg_rebuild_setup_desc: "Ponownie przetwarza dane mapy: surowce kryjące się za filtrami bonusów RGO, pokrycie przemysłem dla Zalecanych Praw Miejskich, wyniki stojące za $mapmode_cm_location_food_potential_name$, przeprawy rzeczne, przez które przechodzą ścieżki wyszukiwarek lokalizacji, oraz to, które budynki ulepszają się w inne. Zajmuje to kilka sekund, a gra działa dalej w trakcie tego procesu."
 cm__dbg_rebuild_setup_text: "Odbuduj"
