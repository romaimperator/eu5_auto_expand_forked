l_polish:
 # Mod
 cm_name: "Zarządca Budowy"
 cm_desc: "Potężny mod poprawiający komfort rozgrywki, który wprowadza nową automatyzację, filtry oraz tryby mapy, aby znacząco usprawnić system budowania w EU5."

 # Settings (settings) Tab
 cm__settings_name: "Ustawienia"
 ## Global Control (settings) Group
 cm__pause_auto_expand_name: "Wstrzymaj Automatyzację"
 cm__pause_auto_expand_desc: "Wstrzymuje wszystkie funkcje automatyzacji: auto-rozbudowę budynków, auto-rozbudowę RGO, ulepszanie wszystkich budynków, auto-budowanie, auto-żywność oraz auto-urbanizację."
 cm__minimum_gold_name: "Rezerwy złota"
 cm__minimum_gold_desc: "Minimalna rezerwa złota do zachowania. Budowa nie zostanie zlecona, jeśli miałoby to obniżyć stan skarbca poniżej tej kwoty. Dotyczy wszystkich funkcji automatyzacji z wyjątkiem ulepszeń automatycznej urbanizacji (które posiadają własne ustawienie złota)."
 cm__minimum_gold_format: "[CMMV('cm__minimum_gold')]@gold!"
 cm__allowed_building_overbuild_levels_name: "Limit nadmiernej rozbudowy"
 cm__allowed_building_overbuild_levels_desc: "Liczba łącznych poziomów budynków, o jaką lokacja może przekroczyć swój limit wspieranych poziomów budynków (Supported Building Levels), zanim automatyczna rozbudowa przestanie kolejkować tam nowe budowy. Przy wartości zero nadmierna rozbudowa będzie niedozwolona."

 ## Priority List Group
 cm__settings__priority_list_name: "Automatyzacja budowy"
 cm__settings__priority_list_desc: "Przeciągnij, aby zmienić priorytet funkcji. W każdym miesiącu włączone funkcje są uruchamiane od góry do dołu. W przypadku automatycznej rozbudowy wartość obok każdej funkcji określa, jak opłacalna musi być rozbudowa przed jej rozpoczęciem, oceniana według miernika wybranego w Mierniku automatycznej rozbudowy: minimalna ilość złota miesięcznie na poziom dla Przychodu z podatków i Zysku, lub maksymalna liczba lat na zwrot kosztów budowy dla ROI (0 = wyłączone). Minimalna zniżka określa najwyższy dopuszczalny narzut cen materiałów budowlanych (-33% = tylko gdy są tanie, 0 = po cenie bazowej, +33% = nawet przy zawyżonych cenach)."
 cm__priority_list_item_column_name: "Funkcja"
 cm__priority_list_i1_name: "Automatyczna rozbudowa budynków"
 cm__priority_list_i1_desc: "Automatycznie rozbudowuje wielopoziomowe budynki produkcyjne i nieprodukcyjne, gdy jest to opłacalne, dostępni są mieszkańcy, a złoto pozostaje powyżej poziomu twojej Rezerwy Złota. Dotyczy tylko lokacji, w których włączono automatyczną rozbudowę."
 cm__priority_list_i2_name: "Automatyczna rozbudowa RGO"
 cm__priority_list_i2_desc: "Automatycznie rozbudowuje poziomy RGO w lokacjach, w których włączono automatyczną rozbudowę RGO, gdy dostępni są robotnicy, a zasoby na to pozwalają."
 cm__priority_list_i3_name: "Automatyczne ulepszanie wszystkich budynków"
 cm__priority_list_i3_desc: "Automatycznie ulepsza każdy przestarzały budynek, niezależnie od tego, czy włączono dla niego automatyczną rozbudowę."
 cm__priority_list_i4_name: "Automatyczna budowa"
 cm__priority_list_i4_desc: "Automatycznie wznosi budynki typu jeden na lokację (rady, biblioteki itp.) w kolejności i z ustawieniami skonfigurowanymi w zakładce Automatycznej budowy."
 cm__priority_list_i5_name: "Auto-żywność"
 cm__priority_list_i5_desc: "Automatycznie buduje RGO oraz budynki produkujące żywność w lokacjach wiejskich, wybierając opcję o najwyższej krańcowej produkcji żywności. Konfigurowalne w zakładce Auto-Żywność."
 cm__priority_list_i6_name: "Auto-urbanizacja"
 cm__priority_list_i6_desc: "Co miesiąc podnosi rangę lokacji: osady wiejskie do poziomu miasteczek, a miasteczka do poziomu miast. Zmiana z osady na miasteczko wymaga 30 000 populacji (co natychmiast kwalifikuje do rangi miasta) lub znalezienia się w granicach 1 000 od limitu populacji (w przeciwnym razie wzrost zostałby zatrzymany przez limit dla osad). Pomija niezintegrone lokacje. Konfigurowalne w zakładce Auto-urbanizacji."
 cm__priority_list_i7_name: "Auto-budowa budynków stołecznych"
 cm__priority_list_i7_desc: "Automatycznie buduje budynki dostępne wyłącznie w stolicy (dwór królewski, sąd najwyższy, akademię wojskową itd.) w twojej lokalizacji stołecznej, gdy pozwalają na to warunki."
 cm__priority_list__enabled_name: "Włączone"
 cm__priority_list__enabled_desc: "Włącz lub wyłącz tę funkcję. Wyłączone funkcje są pomijane co miesiąc."
 cm__priority_list__min_profit_name: "Minimalny przychód z podatków"
 cm__priority_list__min_profit_desc: "Minimalna miesięczna ilość złota na poziom wymagana przed zakolejkowaniem budowy. Ustaw na 0, aby wyłączyć to sprawdzenie."
 cm__priority_list__min_profit_postfix: "@gold!"
 cm__priority_list__min_discount_name: "Min. zniżka"
 cm__priority_list__min_discount_desc: "Maksymalny dopuszczalny narzut ceny materiałów budowlanych. Przy -33% buduje tylko wtedy, gdy materiały kosztują o 33% poniżej ceny bazowej. Przy 0% buduje tylko po cenie bazowej lub niższej. Przy +33% buduje nawet wtedy, gdy ceny są o 33% powyżej ceny bazowej."
 cm__priority_list__min_discount_postfix: "%"
 cm__priority_list__min_discount_prefix_high: "#R "
 cm__priority_list__min_discount_postfix_high: "%#!"
 cm__priority_list__min_discount_prefix_low: "#G "
 cm__priority_list__min_discount_postfix_low: "%#!"

