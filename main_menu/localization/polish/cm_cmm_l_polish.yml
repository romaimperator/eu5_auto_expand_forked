 cm__megalopolis_ignore_market_center_desc: "Pozwala na budowę Założenia Megalopolis w mieście, które nie jest centrum handlowym."
 cm__deurbanize_name: "Deurbanizuj"
 cm__deurbanize_desc: "Co miesiąc przywracaj posiadane lokacje do statusu osad wiejskich, jeśli ich towar RGO jest zaznaczony na poniższej liście Nie urbanizuj. Twoja stolica, centra handlowe, podbite lokacje oraz lokacje zapewniające Bliskość, takie jak siedziby gubernatorów, pozostaną nienaruszone."
 cm__auto_urbanize_ignore_list_i20_name: "@wool! [ShowGoodsName('wool')] ([GetGlobalVariable('cm_goods_wool').GetGoods.GetDefaultMarketPrice]@gold!)"
 cm__map_modes_name: "Tryby mapy"
 cm__map_modes__placement_finder_name: "Zalecana stolica i siedziba gubernatora"
 cm__map_modes__placement_finder_desc: "Ustawienia dla trybów mapy rekomendowanego zarządcy i rekomendowanego umiejscowienia stolicy."
 cm__placement_finder_method_name: "Punktacja wyszukiwarki lokalizacji"
 cm__placement_finder_method_desc: "Jak tryby mapy Polecany gubernator i Polecana stolica oceniają twoje lokacje."
 cm__placement_finder_method_option_1_name: "$cm_txt_tax_base$"
 cm__placement_finder_method_option_1_desc: "Sortuj według tego, o ile umieszczenie tam gubernatora lub stolicy zwiększyłoby całkowitą bazę podatkową. Zamożniejsze lokacje liczą się bardziej."
 cm__placement_finder_method_option_2_name: "$cm_txt_proximity$"
 cm__placement_finder_method_option_2_desc: "Sortuj według bliskości, jaką dodałby tam umieszczony zarządca lub stolica."
 cm__placement_finder_roads_name: "Infrastruktura lądowa"
 cm__placement_finder_roads_desc: "Określa, czy tryby mapy Zalecany gubernator i Zalecana stolica zakładają idealną infrastrukturę lądową, czy korzystają z tego, co faktycznie zbudowano."
 cm__placement_finder_roads_option_1_name: "$cm_txt_current$"
 cm__placement_finder_roads_option_1_desc: "Używaj dróg, które faktycznie zbudowałeś."
 cm__placement_finder_roads_option_2_name: "Maksymalna liczba dróg"
 cm__placement_finder_roads_option_2_desc: "Zakładaj, że na każdym połączeniu wybudowano najlepszą odblokowaną drogę."
 cm__placement_finder_roads_option_3_name: "$cm_txt_best_possible$"
 cm__placement_finder_roads_option_3_desc: "Przyjmij, że najlepsza odblokowana droga jest zbudowana na każdym połączeniu, a każdy odblokowany budynek poprawiający bliskość lądową jest zbudowany wszędzie tam, gdzie jest to możliwe."
 cm__placement_finder_naval_name: "Infrastruktura morska"
 cm__placement_finder_naval_desc: "Określa, czy tryby mapy Rekomendowany gubernator i Rekomendowana stolica zakładają idealną infrastrukturę morską, czy też korzystają z obecnej przepustowości portów i obecności floty."
 cm__placement_finder_naval_option_1_name: "$cm_txt_current$"
 cm__placement_finder_naval_option_1_desc: "Wykorzystaj swoją obecną przepustowość portów i obecność morską."
 cm__placement_finder_naval_option_2_name: "Maksymalna obecność"
 cm__placement_finder_naval_option_2_desc: "Przyjmij pełną obecność morską wszędzie przy obecnej przepustowości portów."
 cm__placement_finder_naval_option_3_name: "$cm_txt_best_possible$"
 cm__placement_finder_naval_option_3_desc: "Zakładaj pełną obecność morską i najlepsze odblokowane budynki portowe, wybudowane w każdej nadmorskiej lokacji."
 cm__placement_finder_accuracy_name: "Dokładność wyszukiwania"
 cm__placement_finder_accuracy_desc: "Jak dokładnie tryby mapy Rekomendowany zarządca i Rekomendowana stolica wyszukują najlepsze lokalizacje. Pominięte lokalizacje są wyświetlane na czarno."
 cm__placement_finder_accuracy_option_1_name: "Wyczerpujący"
 cm__placement_finder_accuracy_option_1_desc: "Oceń każdą lokację. Najdokładniejsza i najwolniejsza."
 cm__placement_finder_accuracy_option_2_name: "Gruntowny"
 cm__placement_finder_accuracy_option_2_desc: "Pomijaj lokacje, które nie mogą znaleźć się w pierwszej trójce. Pierwsza trójka i ich wyniki są identyczne jak w trybie Wyczerpującym, tylko szybciej."
 cm__placement_finder_accuracy_option_3_name: "Zrównoważony"
 cm__placement_finder_accuracy_option_3_desc: "Pomiń lokacje, które nie mogą być tą jedyną najlepszą. Najlepsza lokacja jest nadal gwarantowana jako dokładna; znaczniki drugiego i trzeciego miejsca mogą się sporadycznie różnić."
 cm__placement_finder_accuracy_option_4_name: "Szybki"
 cm__placement_finder_accuracy_option_4_desc: "Pomijaj także lokacje o bardzo niskim prawdopodobieństwie bycia najlepszymi. Znaleziona najlepsza lokacja mieści się w granicach 20% od faktycznie najlepszej i zazwyczaj wciąż jest identyczna."
 cm__placement_finder_accuracy_option_5_name: "Najszybszy"
 cm__placement_finder_accuracy_option_5_desc: "Ocenia najbardziej obiecującą lokalizację w każdej prowincji, a następnie doprecyzowuje wybór wokół liderów. Znacznie szybsze dla dużych państw; może pominąć najlepszą lokalizację."
 cm__debug_name: "$cm_txt_debug$"
 cm__debug__logging_name: "Dziennik działań"
 cm__debug__logging_desc: "Które z działań tej modyfikacji są zapisywane w dzienniku działań modyfikacji."
 cm__log_cycle_name: "Cykl budowy"
 cm__log_cycle_desc: "Wpisy dla cyklu miesięcznego, który został pominięty, ponieważ poprzedni wciąż trwał, oraz dla resetu następującego po dwóch pominięciach z rzędu."
 cm__log_food_name: "$cm__ab_food_name$"
 cm__log_food_desc: "Linie dla kategorii Żywność: miesięczna podaż, popyt i stosunek żywności każdego rynku, roczna mediana, według której stosunek ten jest oceniany względem celu, liczba lokacji już produkujących tam żywność oraz każda lokacja, którą włącza lub wyłącza."
 cm__log_roads_name: "$cm__ab_roads_name$"
 cm__log_roads_desc: "Jeden wiersz dla każdej drogi zamówionej przez kategorię Dróg, określający lokalizację, powód zakupu (jeden z trzech) oraz jej koszt."
 cm__log_cleanup_name: "$cm__cleanup_name$"
 cm__log_cleanup_desc: "Wpisy dotyczące rocznego przeglądu budynków oraz każdego budynku, który został zamknięty, zredukowany, zniszczony lub ponownie otwarty, wraz z zyskiem każdego z nich i progiem, względem którego zostały ocenione."
 cm__log_governors_name: "$cm__ab_governors_name$"
 cm__log_governors_desc: "Wpisy dotyczące planu gubernatora: wybrane i odrzucone lokalizacje, ulepszenia miasteczek i miast, rozmieszczenia, relokacje i odmowy, a także przeniesienie stolicy szczęśliwego narodu."
 cm__log_military_name: "$cm_txt_lucky_nation_military$"
 cm__log_military_desc: "Linie dla szczęśliwego państwa niszczącego forty i wznoszącego budynki rezerw ludzkich."
 cm__log_government_name: "Ustrój szczęśliwego narodu"
 cm__log_government_desc: "Wiersze dla szczęśliwego narodu usuwającego biurokrację lub podejmującego akcję stanu."
 cm__debug__diagnostics_name: "Diagnostyka"
 cm__placement_finder_debug_path_name: "Włącz diagnostykę debugowania"
 cm__placement_finder_debug_path_desc: "Dodaje blok diagnostyczny do podpowiedzi trybów mapy Rekomendowany Zarządca i Rekomendowana Stolica: przewidywaną trasę ze stolicy do każdej lokalizacji wraz z kosztem każdego przeskoku oraz przewidywaną bliskość zestawioną z faktyczną bliskością."
 cm__debug__probes_name: "Sondy"
 cm__debug__probes_desc: "Jednorazowa diagnostyka zapisana w dzienniku działań moda."
 cm__probe_budget_name: "Budżet automatycznej budowy"
 cm__probe_budget_desc: "Bilans każdej kategorii automatycznej rozbudowy: dodatni, gdy odkłada złoto na inwestycję, na którą jeszcze jej nie stać, i ujemny, gdy posiada zadłużenie z powodu nadmiernych wydatków; następnie ilość złota, której żadna kategoria nie wydała w zeszłym miesiącu, limit zwrotu z produkcji oraz najlepszy kandydat oczekujący na rynku, który został pominięty w tym cyklu."
 cm__probe_budget_text: "$cm_txt_run$"
 cm__probe_governors_name: "Plan Gubernatora"
 cm__probe_governors_desc: "Stan realizacji planu gubernatora: jego faza, liczba zajętych i pozostałych do wyznaczenia miejsc, czy korzysta on ze skarbca, opłaceni gubernatorzy oraz sloty i miejsca, w ramach których działa."
 cm__probe_governors_text: "$cm_txt_run$"
 cm__probe_military_name: "$cm_txt_lucky_nation_military$"
 cm__probe_military_desc: "Poziom budynku zasobów ludzkich, na którym znajduje się kraj, informacja o tym, czy może go budować, stan pary stołecznej, budżet wojskowy oraz ile lokacji może przyjąć ten poziom w stosunku do tego, ile już go posiada."
 cm__probe_military_text: "$cm_txt_run$"
 cm__probe_roads_name: "$cm__ab_roads_name$"
 cm__probe_roads_desc: "Ile korytarzy plan dróg utrzymuje dla każdego z czynników: bliskość, dostęp do rynku i połączenie ze stolicą; ile z połączeń ze stolicą można już rozpocząć, ile dróg jest już w budowie, ile jest zablokowanych przez rynki z niedoborem towarów budowlanych oraz co pozostało w puli tej kategorii."
 cm__probe_roads_text: "$cm_txt_run$"
 cm__probe_log_gate_name: "Bramka dziennika działań"
 cm__probe_log_gate_desc: "Kategoria dziennika dóbr podstawowych występuje dwukrotnie: tak jak odczytuje ją bramka dziennika oraz tak jak przechowuje ją menu, przez co wyświetlana jest kategoria, która w jednym miejscu jest włączona, a w drugim wyłączona."
 cm__probe_log_gate_text: "$cm_txt_run$"
