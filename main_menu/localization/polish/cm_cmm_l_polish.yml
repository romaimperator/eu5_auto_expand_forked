 cm__ab_master_name: "Panel sterowania"
 cm__ab_custom_name: "Własne"
 cm__ab_core_name: "Podstawowe dobra"
 cm__ab_food_name: "Żywność"
 cm__ab_production_name: "Produkcja"
 cm__ab_roads_name: "Drogi"
 cm__ab_governors_name: "Gubernatorzy"
 cm__ab_master__ab_master_name: "$cm__ab_master_name$" # NO-TRANSLATE
 cm__ab_master__ab_master_desc: "Bezobsługowa budowa. Każdego miesiąca poniższe kategorie wydają środki ze skarbca powyżej Rezerwy Złota na najlepsze dostępne konstrukcje. Działa równolegle z innymi funkcjami automatyzacji, nie zmieniając ich ustawień."
 cm__ab_enabled_name: "Włącz automatyczną budowę"
 cm__ab_enabled_desc: "Włącz lub wyłącz automatyczną budowę."
 cm__ab_save_unaffordable_name: "Oszczędzaj na nieprzystępne budynki"
 cm__ab_save_unaffordable_desc: "Kategoria kupuje najlepszy znaleziony budynek, nawet jeśli kosztuje on więcej niż wynosi jej miesięczny przydział, a następnie wstrzymuje się z zakupami do czasu, aż fundusze z kolejnych miesięcy wyrównają tę różnicę. Gdy opcja ta jest wyłączona, kategoria nie kupuje niczego, czego kosztu nie może pokryć w całości."
 cm__ab_min_proximity_name: "Minimalna bliskość"
 cm__ab_min_proximity_desc: "Lokacje poniżej tej Bliskości są pomijane podczas wybierania miejsca pod budowę. Budynki kontroli oraz @settlement_building! [ShowBuildingTypeNameWithNoTooltip('settlement_building')] są budowane bez względu na to, gdyż to one sprawiają, że tereny o niskiej Bliskości są warte utrzymania. Przy wartości 0 nic nie jest pomijane."
 cm__ab_min_proximity_format: "[CMMV('cm__ab_min_proximity')]%" # NO-TRANSLATE
 cm__ab_master__ab_priority_list_name: "Kategorie automatycznej rozbudowy"
 cm__ab_master__ab_priority_list_desc: "Przeciągnij, aby zmienić kolejność. Kategorie są przetwarzane co miesiąc od góry do dołu. Jeśli dwie kategorie chcą tego samego budynku, buduje go ta położona wyżej, a jeśli po przydzieleniu środków każdej kategorii pozostanie złoto, otrzymuje je ta znajdująca się wyżej."
 cm__ab_priority_list_item_column_name: "Kategoria"
 cm__ab_priority_list_i1_name: "$cm__ab_custom_name$" # NO-TRANSLATE
 cm__ab_priority_list_i1_desc: "Buduje infrastrukturę wspierającą wszędzie tam, gdzie jest na nią miejsce. Najpierw powstają budynki stolicy, następnie budynki kontroli, potem budynki centrów handlowych, a na końcu budynki wybrane samodzielnie. Poborcy są wysyłani do lokacji, w których surowce osiągają najwyższe ceny, inne budynki kontroli do najbogatszych lokacji, a targowiska do miejsc z najniższym dostępem do rynku."
 cm__ab_priority_list_i2_name: "$cm__ab_core_name$" # NO-TRANSLATE
 cm__ab_priority_list_i2_desc: "Rozszerza produkcję materiałów budowlanych, aby obniżyć ich ceny. Działa na rynkach, których centrum rynku posiadasz. Lokacje o najlepszej produkcji mają pierwszeństwo i każda otrzymuje kilka poziomów naraz, a produkcja rozpoczyna się nawet tam, gdzie pracownicy jeszcze nie dotarli. Twoja stolica, lokacje produkujące żywność oraz producenci, którzy przynosiliby straty bez dotacji, są pomijani."
 cm__ab_priority_list_i3_name: "$cm__ab_food_name$" # NO-TRANSLATE
 cm__ab_priority_list_i3_desc: "Monitoruje zapasy żywności w ciągu roku na rynkach, których centrum handlowe posiadasz, a tam, gdzie mediana miesięczna wykazała niedobory, aktywuje auto-żywność w lokacjach o najwyższym potencjale żywnościowym. Wybrane lokacje świecą się tak samo jak te włączone przez gracza, lecz przełącznik pozostaje pod Twoją kontrolą; nie zostaną one nigdy wyłączone, chyba że lokacja przestanie być Twoją osadą wiejską, przestaniesz posiadać jej centrum handlowe lub lepsza lokacja na tym samym rynku zajmie jej miejsce."
 cm__ab_priority_list_i4_name: "$cm__ab_production_name$" # NO-TRANSLATE
 cm__ab_priority_list_i4_desc: "Buduje, rozbudowuje i ulepsza budynki produkcyjne oraz RGO, które najszybciej zwracają swój koszt w dochodach z podatków. Lokacje z aktywną automatyzacją żywności są pomijane, jeśli brakuje w nich jakiegokolwiek rodzaju pracowników."
 cm__ab_priority_list_i5_name: "$cm__ab_roads_name$" # NO-TRANSLATE
 cm__ab_priority_list_i5_desc: "Buduje sieć dróg o najlepszym stosunku wartości do ceny, biorąc pod uwagę trzy korzyści płynące z drogi: Bliskość, Dostęp do rynku oraz połączenie lokalizacji ze stolicą. Co cztery lata, a także przy każdej zmianie stolicy, wyznacza najlepszą trasę do każdej posiadanej lokalizacji dla każdego z tych czynników i szereguje odcinki według Bazy Podatkowej, którą by zwiększyły, wliczając w to wszystko, co znajduje się dalej na trasie za nimi; w trybie wieloosobowym dzieje się to tylko po naciśnięciu przycisku „Wymuś ponowne zaplanowanie dróg”. Każdego miesiąca system sprawdza tę listę i zatrzymuje się na pierwszym odcinku, którego nie może rozpocząć, zamiast go pomijać. Tanie, płaskie korytarze są budowane w pierwszej kolejności, a odcinek o niższym priorytecie otrzymuje złoto tylko w miesiącu, w którym ten powyżej niczego nie wybudował i nie odkłada funduszy na odcinek, na który go jeszcze nie stać."
 cm__ab_priority_list_i6_name: "$cm__ab_governors_name$" # NO-TRANSLATE
 cm__ab_priority_list_i6_desc: "Planuje, gdzie powinni rezydować twoi gubernatorzy i umieszcza ich tam, wybierając najpierw najlepsze lokalizacje. Ponawia planowanie za każdym razem, gdy zwolni się miejsce dla gubernatora, a poza tym co dwadzieścia pięć lat. Tylko dla jednego gracza."
 cm__ab_priority_list__budget_name: "Udział w budżecie"
 cm__ab_priority_list__budget_desc: "Udział w skarbcu powyżej Rezerwy Złota przyznawany tej kategorii każdego miesiąca. Jest to próg dolny, a nie limit: złoto, którego żadna kategoria nie wyda, jest ponownie oferowane od góry listy, więc dana kategoria może budować znacznie powyżej swojego udziału w miesiącu, w którym te znajdujące się poniżej nie mają na co wydawać."
 cm__ab_priority_list__budget_postfix: "%" # NO-TRANSLATE
 cm__ab_priority_list__enabled_name: "$cm_txt_enabled$" # NO-TRANSLATE
 cm__ab_priority_list__enabled_desc: "Zezwalaj na budowę w tej kategorii."
 cm__ab_priority_list__settings_name: "Ustawienia"
 cm__ab_priority_list__settings_desc: "Przejdź do ustawień własnych tej kategorii."
 cm__ab_priority_list__settings_text: "Otwórz"
 cm__ab_master__debug_name: "$cm_txt_debug$" # NO-TRANSLATE
 cm__dbg_run_auto_build_name: "Uruchom automatyczną rozbudowę"
 cm__dbg_run_auto_build_desc: "Przetwarza teraz każdą włączoną kategorię po kolei z listy, zamiast czekać na zmianę miesiąca. Każda wydaje to, co pozostało z jej udziału, więc kategoria, która wydała już środki w tym miesiącu, niczego nie buduje. Wstrzymanie automatyzacji tego nie powstrzymuje."
 cm__dbg_run_auto_build_text: "$cm_txt_run_now$" # NO-TRANSLATE
 cm__ab_custom__ab_custom_name: "$cm__ab_custom_name$" # NO-TRANSLATE
 cm__ab_custom__ab_custom_desc: "Zestawy są przetwarzane co miesiąc od góry do dołu, więc te znajdujące się bliżej góry jako pierwsze pobierają złoto."
 cm__ab_custom_item_column_name: "Budynki"
 cm__ab_custom_i1_name: "Budynki stołeczne"
 cm__ab_custom_i1_desc: "Buduj w stolicy budynki dostępne wyłącznie dla stolicy: dwór królewski, sąd najwyższy, akademię wojskową i pozostałe. Są one wznoszone przed wszystkimi innymi budynkami z tej kategorii."
 cm__ab_custom_i2_name: "Budynki kontroli"
 cm__ab_custom_i2_desc: "Buduj komorników tam, gdzie surowce sprzedają się najdrożej, oraz wszelkie unikalne budynki twojego kraju zwiększające kontrolę w najbogatszych lokacjach. Lokacja otrzymuje wszystkie unikalne budynki, jakie może pomieścić, zanim obsłużona zostanie kolejna lokacja."
 cm__ab_custom_i3_name: "Budynki centrum handlowego"
 cm__ab_custom_i3_desc: "Buduj budynki, które się opłacają w centrum handlowym, w każdym posiadanym centrum handlowym."
 cm__ab_custom_i4_name: "Wybierz budynki"
 cm__ab_custom_i4_desc: "Zbuduj budynki wymienione poniżej."
 cm__ab_custom__enabled_name: "$cm_txt_enabled$" # NO-TRANSLATE
 cm__ab_custom__enabled_desc: "Zbuduj ten zestaw."
 cm__ab_custom__auto_build_list_name: "$cm__ab_custom_i4_name$" # NO-TRANSLATE
 cm__ab_custom__auto_build_list_desc: "Przeciągnij, aby zmienić kolejność. Budynki są przetwarzane co miesiąc od góry do dołu, więc te bliżej góry pobierają złoto jako pierwsze."
 cm__auto_build_list_i22_name: "@lazaretto! [ShowBuildingTypeName('lazaretto')]" # NO-TRANSLATE
 cm__auto_build_list_i23_name: "@hospital! [ShowBuildingTypeName('hospital')]" # NO-TRANSLATE
