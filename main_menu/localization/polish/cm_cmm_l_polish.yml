 cm__expand_metric: "cm__expand_metric"
 cm__town_rights_free_grants_name: "Usuń koszty praw miejskich"
 cm__town_rights_free_grants_desc: "Gdy włączone, nadawanie praw miejskich nie kosztuje władzy państwowej, a ich odbieranie nie kosztuje stabilności."
 cm__town_rights_min_gov_power_name: "Minimalna władza państwowa"
 cm__town_rights_min_gov_power_desc: "Automatyczne nadawanie przestaje przyznawać prawa miejskie, gdy kolejne nadanie obniżyłoby twoją władzę państwową (legitymizację, tradycję republikańską, oddanie lub jedność hordy, zależnie od typu rządu) poniżej tej wartości."
 cm__allowed_building_overbuild_levels_format: "[CMMV('cm__allowed_building_overbuild_levels')][Select_CString(GreaterThanOrEqualTo_CFixedPoint(CMMV('cm__allowed_building_overbuild_levels'), CMMMapValue('cmm_max', 'cm__allowed_building_overbuild_levels')), '+', '')]"
 cm__auto_build_capital_name: "Budynki stołeczne"
 cm__auto_build_capital_desc: "Automatycznie wznosi budynki dostępne tylko w stolicy (dwór królewski, sąd najwyższy, akademia wojskowa itd.) w twojej lokalizacji stołecznej, gdy pozwalają na to warunki. Są one budowane przed poniższą listą."
 cm__urbanize_city_to_megalopolis_name: "Miasto do Megalopolis"
 cm__urbanize_city_to_megalopolis_desc: "Ulepsz swoją stolicę do megalopolis, gdy stanie się ona miastem będącym centrum handlowym z populacją co najmniej 400 000."
 cm__megalopolis_ignore_capital_name: "Megalopolis: Ignoruj wymóg stolicy"
 cm__megalopolis_ignore_capital_desc: "Pozwala na budowę Założenia Megalopolis w mieście, które nie jest twoją stolicą."
 cm__megalopolis_ignore_market_center_name: "Megalopolis: Ignoruj wymaganie Centrum Handlu"
 cm__megalopolis_ignore_market_center_desc: "Pozwala na budowę Założenia Megalopolis w mieście, które nie jest centrum handlowym."
 cm__deurbanize_name: "Deurbanizuj"
 cm__deurbanize_desc: "Co miesiąc przywracaj posiadane lokacje do stanu osad wiejskich, gdy ich towar RGO jest zaznaczony na poniższej liście „Nie urbanizuj”. Twoja stolica, podbite lokacje oraz lokacje zapewniające Bliskość, takie jak siedziby gubernatorów, pozostają nienaruszone."
 cm__auto_urbanize_ignore_list_i20_name: "@wool! [ShowGoodsName('wool')] ([GetGlobalVariable('cm_goods_wool').GetGoods.GetDefaultMarketPrice]@gold!)"
 cm__full_automation_name: "Pełna automatyzacja"
 cm__full_automation__full_automation_name: "Pełna automatyzacja"
 cm__full_automation__full_automation_desc: "Automatyczna budowa. Co miesiąc poniższe kategorie wydają środki ze skarbca powyżej rezerwy złota na najlepsze dostępne budowy. Działa równolegle z innymi funkcjami automatyzacji, nie zmieniając ich ustawień."
 cm__fa_enabled_name: "Włącz pełną automatyzację"
 cm__fa_enabled_desc: "Włącz lub wyłącz pełną automatyzację."
 cm__fa_reserve_name: "Rezerwa złota"
 cm__fa_reserve_desc: "Pełna automatyzacja nigdy nie wydaje środków ze skarbca poniżej tej kwoty. Wartość niezależna od Rezerwy Złota w zakładce Ustawienia."
 cm__fa_reserve_format: "[CMMV('cm__fa_reserve')]@gold!"
 cm__fa_save_unaffordable_name: "Oszczędzaj na zbyt drogie budynki"
 cm__fa_save_unaffordable_desc: "Kategoria kupuje najlepszy znaleziony budynek, nawet jeśli kosztuje on więcej niż jej miesięczny przydział, a następnie wstrzymuje się z zakupami, dopóki w kolejnych miesiącach różnica nie zostanie wyrównana. Gdy opcja ta jest wyłączona, każda kategoria wydaje tyle, ile może, a resztę przekazuje dalej."
 cm__full_automation__fa_priority_list_name: "Priorytety"
 cm__full_automation__fa_priority_list_desc: "Przeciągnij, aby zmienić kolejność. Kategorie są przetwarzane co miesiąc od góry do dołu. Jeśli dwie kategorie chcą tego samego budynku, buduje go ta znajdująca się wyżej."
 cm__fa_priority_list_item_column_name: "Kategoria"
 cm__fa_priority_list_i1_name: "Żywność"
 cm__fa_priority_list_i1_desc: "Monitoruje podaż żywności w ciągu roku na rynkach, których centrum handlowe posiadasz, a tam, gdzie mediana miesięczna była niewystarczająca, włącza automatyczną produkcję żywności w lokacjach o najwyższym potencjale żywnościowym. Wybrane przez niego lokacje podświetlają się tak samo jak te włączone przez gracza, ale przełącznik pozostaje w twojej gestii; nie zostaną one nigdy wyłączone, chyba że lokacja przestanie być twoją osadą wiejską lub przestaniesz posiadać jej centrum handlowe."
 cm__fa_priority_list_i2_name: "Przemysł"
 cm__fa_priority_list_i2_desc: "Buduje, rozbudowuje i ulepsza budynki produkcyjne oraz RGO, które najszybciej zwracają swój koszt w przychodach z podatków. Lokacje z automatycznym zarządzaniem żywnością są pomijane, dopóki występuje tam niedobór jakiegokolwiek rodzaju pracowników."
 cm__fa_priority_list_i3_name: "Kolapsar cen"
 cm__fa_priority_list_i3_desc: "Rozszerza produkcję materiałów budowlanych, aby obniżyć ich ceny. Działa na rynkach, których centrum rynku posiadasz. Najbardziej wydajne lokacje są wybierane w pierwszej kolejności i każda otrzymuje po kilka poziomów naraz, a produkcja rusza nawet tam, gdzie pracownicy jeszcze nie dotarli. Twoja stolica, lokacje produkujące żywność oraz producenci, którzy bez subsydiów przynosiliby straty, są pomijani."
 cm__fa_priority_list_i4_name: "Drogi"
 cm__fa_priority_list_i4_desc: "Buduje sieć dróg o najlepszym stosunku wartości do ceny, biorąc pod uwagę trzy korzyści płynące z dróg: Bliskość, Dostęp do Rynku oraz połączenie lokacji ze stolicą. Raz w roku wyznacza najlepszą trasę do każdej posiadanej lokacji dla każdej z tych kategorii, a następnie co miesiąc rozpoczyna budowę odcinków, które najbardziej zwiększyłyby Bazę Podatkową, wliczając w to wszystko, co znajduje się dalej na trasie za nimi. Tanie, płaskie korytarze są budowane w pierwszej kolejności, a dwa niższe priorytety otrzymują złoto tylko w miesiącach, w których wyższy priorytet nie ma już nic do zbudowania."
 cm__fa_priority_list_i5_name: "Usługi"
 cm__fa_priority_list_i5_desc: "Buduje infrastrukturę wspierającą wszędzie tam, gdzie to możliwe: budynki stolicy, listę automatycznej budowy, patia rtęciowe, budynki centrów handlowych, rządców oraz wszelkie unikalne budynki Twojego kraju zwiększające kontrolę, targowiska, budynki chroniące przed chorobami, a na końcu spichlerze. Budynki kontroli trafiają najpierw do najbogatszych lokacji, a targowiska do lokacji o najniższym dostępie do rynku."
 cm__fa_priority_list_i6_name: "Porządkowanie budynków"
 cm__fa_priority_list_i6_desc: "Raz w roku zamyka budynki produkcyjne, które przestały przynosić zyski i nie są dotowane, a niszczy je zamiast tego, jeśli lokacja mieści się w granicach dziesięciu poziomów od obsługiwanych poziomów budynków. Zamknięte budynki są otwierane ponownie, gdy dany typ zacznie ponownie przynosić zyski na tym rynku, i zostają zniszczone później, jeśli w lokacji zabraknie miejsca. @farming_village! [ShowBuildingTypeNameWithNoTooltip('farming_village')] nigdy nie jest zamykany ani niszczony."
 cm__fa_priority_list_i7_name: "Gubernatorzy"
 cm__fa_priority_list_i7_desc: "Planuje, gdzie powinni zasiadać twoi gubernatorzy i ich tam umieszcza, wybierając najpierw najlepsze lokalizacje. Planuje ponownie za każdym razem, gdy zwolni się miejsce dla gubernatora, a w przeciwnym razie co dwadzieścia pięć lat. Tylko dla trybu jednoosobowego."
 cm__fa_priority_list_i8_name: "Prawa miejskie"
 cm__fa_priority_list_i8_desc: "Przyznaje prawa miejskie w twoich miasteczkach i miastach. Najpierw [ShowTownRightsNameWithNoTooltip('granary_town')], a następnie jeden przywilej specjalizacji, losowany spośród tych, które pasują do towarów wytwarzanych w okolicy lokacji."
 cm__fa_priority_list__budget_name: "Udział w budżecie"
 cm__fa_priority_list__budget_desc: "Udział skarbca powyżej Rezerwy Złota, który ta kategoria może wydawać każdego miesiąca."
 cm__fa_priority_list__budget_postfix: "%"
 cm__fa_priority_list__enabled_name: "Włączone"
 cm__fa_priority_list__enabled_desc: "Zezwalaj na budowę w tej kategorii."
 cm__full_automation__fa_industry_name: "Przemysł"
 cm__full_automation__fa_industry_desc: "Ustawienia dla powyższej kategorii Przemysł."
 cm__fa_industry_algorithm_name: "Strategia budowy"
 cm__fa_industry_algorithm_desc: "Jak przemysł wybiera, co budować."
 cm__fa_industry_algorithm_option_1_name: "Chciwy"
 cm__fa_industry_algorithm_option_1_desc: "Buduj najpierw opcje o najszybszym zwrocie i tylko te zbliżone do najlepszego znalezionego miejsca wytwarzania tych samych dóbr."
 cm__fa_industry_max_rel_roi_name: "Maksymalny względny ROI"
 cm__fa_industry_max_rel_roi_desc: "Określa, o ile wolniej od najlepszego miejsca produkującego te same dobra budynek lub ulepszenie może zwracać swój koszt, aby wciąż zostać zbudowanym. Przy 30%, jeśli najlepszy zwraca się w 10 lat, budowane są tylko te zwracające się w ciągu 13 lat; wolniejsze inwestycje czekają. Przy 0% każdego miesiąca budowany jest tylko najlepszy producent każdego dobra. Przy 100%+ limit nie obowiązuje i brana jest pod uwagę tylko Maksymalna liczba lat zwrotu. Wszystkie budynki wytwarzające te same dobra są oceniane wspólnie, niezależnie od ich rodzaju. Rozbudowy RGO są zawsze budowane w kolejności czasu zwrotu."
 cm__fa_industry_max_rel_roi_format: "[CMMV('cm__fa_industry_max_rel_roi')]%[Select_CString(GreaterThanOrEqualTo_CFixedPoint(CMMV('cm__fa_industry_max_rel_roi'), CMMMapValue('cmm_max', 'cm__fa_industry_max_rel_roi')), '+', '')]"
 cm__fa_industry_min_roi_name: "Maksymalna liczba lat zwrotu"
 cm__fa_industry_min_roi_desc: "Uwzględniane są tylko budowle, których przychody z podatków spłacą koszt budowy w ciągu tylu lat. Ustaw 0, aby wyłączyć to sprawdzenie."
 cm__fa_industry_min_roi_format: "[CMMV('cm__fa_industry_min_roi')] r. @efficiency!"
 cm__full_automation__fa_collapsar_name: "Zapaść cenowa"
 cm__full_automation__fa_collapsar_desc: "Ustawienia dla powyższej kategorii Price Collapsar. Materiały są przetwarzane od góry listy w dół, przy czym RGO są rozbudowywane przed budynkami produkcyjnymi."
 cm__fa_collapsar_target_name: "Cena docelowa"
 cm__fa_collapsar_target_desc: "Cena, przy której budowa dla danego materiału zostaje wstrzymana, względem jego ceny bazowej. Przy -33% producenci są budowani, dopóki cena materiału nie spadnie o 33% poniżej ceny bazowej. Przy 0% – do momentu osiągnięcia ceny bazowej. Przy +33% – tylko dopóki kosztuje on o ponad 33% powyżej ceny bazowej."
 cm__fa_collapsar_target_format: "[CMMV('cm__fa_collapsar_target')]%"
 cm__fa_collapsar_item_column_name: "Materiał"
 cm__fa_collapsar_i1_name: "@masonry! [ShowGoodsName('masonry')]"
 cm__fa_collapsar_i2_name: "@lumber! [ShowGoodsName('lumber')]"
 cm__fa_collapsar_i3_name: "@sand! [ShowGoodsName('sand')]"
 cm__fa_collapsar_i4_name: "@glass! [ShowGoodsName('glass')]"
 cm__fa_collapsar__enabled_name: "Włączone"
 cm__fa_collapsar__enabled_desc: "Pracuj nad obniżeniem ceny tego materiału."
 cm__full_automation__fa_food_name: "Żywność"
 cm__full_automation__fa_food_desc: "Ustawienia dla powyższej kategorii Żywność."
 cm__fa_food_target_name: "Docelowa nadwyżka"
 cm__fa_food_target_desc: "Rynek otrzymuje więcej lokacji żywności, dopóki jego podaż nie osiągnie tej części popytu. Przy 125% żywność jest rozbudowywana na każdym rynku, w którym mediana miesięcy w roku nie osiągnęła 25% nadwyżki. Zwiększ tę wartość, aby utrzymać większy bufor, lub zmniejsz ją, aby pomagać tylko rynkom bliższym niedoboru."
 cm__fa_food_target_format: "[CMMV('cm__fa_food_target')]%"
 cm__fa_food_min_potential_name: "Minimalny potencjał żywności"
 cm__fa_food_min_potential_desc: "Automatyczna żywność jest włączona tylko w lokacjach, których potencjał żywności na poziom RGO osiąga ten wynik – ten sam, który pokazuje tryb mapy $mapmode_cm_location_food_potential_name$. Zwiększ go, aby poczekać na lepsze ziemie uprawne, lub obniż, aby zaakceptować słabsze tereny."
 cm__fa_food_min_potential_format: "[CMMV('cm__fa_food_min_potential')]"
 cm__full_automation__fa_urban_rights_name: "Prawa miejskie"
 cm__full_automation__fa_urban_rights_desc: "Ustawienia dla powyższej kategorii Praw Miejskich."
 cm__fa_urban_rights_window_name: "Próg dopasowania"
 cm__fa_urban_rights_window_desc: "Określa, jak dobrze prawo specjalizacji musi pasować do lokacji w stosunku do najlepiej dopasowanego tam prawa, aby mogło zostać uwzględnione. Przy 50% każde prawo, które pasuje przynajmniej w połowie tak dobrze, może zostać wylosowane, przy czym te lepiej dopasowane są wybierane częściej. Przy 100% nadawane jest wyłącznie najlepiej dopasowane prawo."
 cm__fa_urban_rights_window_format: "[CMMV('cm__fa_urban_rights_window')]%"
 cm__fa_urban_rights_reserve_name: "Rezerwa władzy państwowej"
 cm__fa_urban_rights_reserve_desc: "Żadne prawo miejskie nie zostanie przyznane, jeśli opłacenie go obniżyłoby twoją władzę państwową (legitymizację, tradycję republikańską, oddanie lub jedność ordy, w zależności od typu rządu) poniżej tej wartości."
 cm__fa_urban_rights_expand_name: "Rozbuduj wzmocnione przemysły"
 cm__fa_urban_rights_expand_desc: "Gdy przyznane zostanie prawo specjalizacji, włączona zostanie także automatyczna rozbudowa w danej lokacji dla przemysłów premiowanych przez to prawo oraz dla produkowanych tam surowców. Działa to tak samo, jak kliknięcie prawym przyciskiem myszy na przycisk nadania na mapie zalecanych praw miejskich."
 cm__full_automation__fa_cleanup_name: "Czyszczenie budynków"
 cm__full_automation__fa_cleanup_desc: "Ustawienia dla kategorii Oczyszczania Budynków powyżej."
 cm__fa_cleanup_min_profit_name: "Minimalny zysk"
 cm__fa_cleanup_min_profit_desc: "Budynek zarabiający miesięcznie mniej niż ta kwota uznawany jest za nierentowny i zostaje zamknięty lub zburzony, chyba że jest dotowany. Jednorazowo procesowi temu podlega najwyżej połowa otwartych budynków danego typu na rynku."
 cm__fa_cleanup_min_profit_format: "[Divide_CFixedPoint(CMMV('cm__fa_cleanup_min_profit'), '(CFixedPoint)100')|2]@gold!"
 cm__fa_cleanup_core_goods_name: "Priorytetyzuj materiały budowlane"
 cm__fa_cleanup_core_goods_desc: "Utrzymuj budynki konsumujące głównie @masonry![ShowGoodsNameWithNoTooltip('masonry')], @lumber![ShowGoodsNameWithNoTooltip('lumber')], @sand![ShowGoodsNameWithNoTooltip('sand')] lub @glass![ShowGoodsNameWithNoTooltip('glass')] na poziomie dwukrotności Minimalnego Zysku lub 0,1@gold!, zależnie od tego, która z tych wartości jest wyższa. Budynki produkujące jeden z tych czterech towarów są oceniane według normalnego Minimalnego Zysku."
 cm__fa_cleanup_auto_food_name: "Wyczyść lokacje z automatyczną żywnością"
 cm__fa_cleanup_auto_food_desc: "Gdy działa automatyczne zarządzanie żywnością i występuje niedobór jakiegokolwiek rodzaju pracowników, niszcz budynki produkcyjne, które nie wytwarzają żywności. @market_village! [ShowBuildingTypeNameWithNoTooltip('market_village')] zostaje zredukowany do jednego poziomu zamiast zostać zniszczonym."
 cm__full_automation__fa_roads_name: "Drogi"
 cm__full_automation__fa_roads_desc: "Ustawienia dla powyższej kategorii Dróg."
 cm__fa_roads_proximity_name: "Bliskość"
 cm__fa_roads_proximity_desc: "Buduj odcinki dróg, które najbardziej zwiększają Bliskość w stosunku do kosztu, wliczając w to każdą lokalizację znajdującą się dalej na trasie za nimi."
 cm__fa_roads_market_access_name: "Dostęp do rynku"
 cm__fa_roads_market_access_desc: "Buduj odcinki dróg, które najbardziej zwiększają Dostęp do rynku w przeliczeniu na złoto. Wydaje środki tylko w miesiącach, w których nie pozostały już do wybudowania żadne odcinki Bliskości."
 cm__fa_roads_capital_name: "Połączenie ze stolicą"
 cm__fa_roads_capital_desc: "Buduj odcinki dróg, aby połączyć swoje lokacje ze stolicą, rozszerzając sieć od tych już połączonych. Wydaje środki tylko w miesiącach, w których nie pozostały do wybudowania żadne odcinki dla Bliskości i Dostępu do rynku."
 cm__full_automation__fa_governors_name: "Gubernatorzy"
 cm__full_automation__fa_governors_desc: "Ustawienia dla kategorii Gubernatorów powyżej."
 cm__fa_gov_move_seats_name: "Zezwól na przenoszenie gubernatorów"
 cm__fa_gov_move_seats_desc: "Gdy wszystkie miejsca dla zarządców są zajęte, usuń zarządcę i przydziel go do lepszej lokalizacji. Lepsza lokalizacja musi być już Miastem lub posiadać wynik o ponad 10% wyższy niż lokalizacja zastępowana. Gdy opcja ta jest wyłączona, zarządcy są przydzielani tylko do wolnych miejsc."
 cm__fa_gov_prepare_sites_name: "Zezwalaj na przygotowywanie nowych lokacji"
 cm__fa_gov_prepare_sites_desc: "Rozważaj lokacje, które nie mogą jeszcze przyjąć gubernatora i przygotuj je w pierwszej kolejności, zakładając w nich miasteczko lub miasto oraz budując drogę do stolicy. Przy wyłączonej opcji pod uwagę brane są tylko te lokacje, które są już miastem i posiadają połączenie drogowe ze stolicą."
 cm__map_modes_name: "Tryby mapy"
 cm__map_modes__placement_finder_name: "Zalecana stolica i siedziba gubernatora"
 cm__map_modes__placement_finder_desc: "Ustawienia dla trybów mapy Zalecany gubernator i Zalecana lokalizacja stolicy."
 cm__placement_finder_method_name: "Punktacja wyszukiwarki lokalizacji"
 cm__placement_finder_method_desc: "Jak tryby mapy Zalecany zarządca i Zalecana stolica oceniają twoje lokacje."
 cm__placement_finder_method_option_1_name: "Baza podatkowa"
 cm__placement_finder_method_option_1_desc: "Sortuj według tego, o ile umieszczenie tam gubernatora lub stolicy zwiększyłoby całkowitą bazę podatkową. Zamożniejsze lokacje liczą się bardziej."
 cm__placement_finder_method_option_2_name: "Bliskość"
 cm__placement_finder_method_option_2_desc: "Sortuj według bliskości, jaką dodałby tam umieszczony zarządca lub stolica."
 cm__placement_finder_roads_name: "Infrastruktura lądowa"
 cm__placement_finder_roads_desc: "Czy tryby mapy Zalecany zarządca i Zalecana stolica zakładają idealną infrastrukturę lądową, czy korzystają z tej faktycznie wybudowanej."
 cm__placement_finder_roads_option_1_name: "Aktualny"
 cm__placement_finder_roads_option_1_desc: "Używaj dróg, które faktycznie zbudowałeś."
 cm__placement_finder_roads_option_2_name: "Maksymalna liczba dróg"
 cm__placement_finder_roads_option_2_desc: "Zakładaj, że na każdym połączeniu wybudowano najlepszą odblokowaną drogę."
 cm__placement_finder_roads_option_3_name: "Najlepszy możliwy"
 cm__placement_finder_roads_option_3_desc: "Przyjmij, że najlepsza odblokowana droga jest zbudowana na każdym połączeniu, a każdy odblokowany budynek poprawiający bliskość lądową jest zbudowany wszędzie tam, gdzie jest to możliwe."
 cm__placement_finder_naval_name: "Infrastruktura morska"
 cm__placement_finder_naval_desc: "Czy tryby mapy Rekomendowany gubernator i Rekomendowana stolica zakładają idealną infrastrukturę morską, czy korzystają z twojej obecnej przepustowości portów i obecności morskiej."
 cm__placement_finder_naval_option_1_name: "Aktualny"
 cm__placement_finder_naval_option_1_desc: "Wykorzystaj swoją obecną przepustowość portów i obecność morską."
 cm__placement_finder_naval_option_2_name: "Maksymalna obecność"
 cm__placement_finder_naval_option_2_desc: "Przyjmij pełną obecność morską wszędzie przy obecnej przepustowości portów."
 cm__placement_finder_naval_option_3_name: "Najlepszy możliwy"
 cm__placement_finder_naval_option_3_desc: "Zakładaj pełną obecność morską i najlepsze odblokowane budynki portowe, wybudowane w każdej nadmorskiej lokacji."
 cm__placement_finder_accuracy_name: "Dokładność wyszukiwania"
 cm__placement_finder_accuracy_desc: "Jak dokładnie tryby mapy Rekomendowany gubernator i Rekomendowana stolica wyszukują najlepsze lokalizacje. Pominięte lokalizacje wyświetlają się na czarno."
 cm__placement_finder_accuracy_option_1_name: "Wyczerpujący"
 cm__placement_finder_accuracy_option_1_desc: "Oceń każdą lokację. Najdokładniejsza i najwolniejsza."
 cm__placement_finder_accuracy_option_2_name: "Gruntowny"
 cm__placement_finder_accuracy_option_2_desc: "Pomijaj lokacje, które nie mogą znaleźć się w pierwszej trójce. Pierwsza trójka i ich wyniki są identyczne jak w trybie Wyczerpującym, tylko szybciej."
 cm__placement_finder_accuracy_option_3_name: "Zrównoważony"
 cm__placement_finder_accuracy_option_3_desc: "Pomiń lokacje, które nie mogą być tą jedyną najlepszą. Najlepsza lokacja jest nadal gwarantowana jako dokładna; znaczniki drugiego i trzeciego miejsca mogą się sporadycznie różnić."
 cm__placement_finder_accuracy_option_4_name: "Szybki"
 cm__placement_finder_accuracy_option_4_desc: "Pomijaj także lokacje o bardzo niskim prawdopodobieństwie bycia najlepszymi. Znaleziona najlepsza lokacja mieści się w granicach 20% od faktycznie najlepszej i zazwyczaj wciąż jest identyczna."
 cm__placement_finder_accuracy_option_5_name: "Najszybszy"
 cm__placement_finder_accuracy_option_5_desc: "Ocenia najbardziej obiecującą lokalizację w każdej prowincji, a następnie doprecyzowuje wybór wokół liderów. Znacznie szybsze dla dużych państw; może pominąć najlepszą lokalizację."
 cm__debug_name: "Debug"
 cm__debug__logging_name: "Dziennik działań"
 cm__debug__logging_desc: "Które z działań tej modyfikacji są zapisywane w dzienniku działań modyfikacji."
 cm__log_cycle_name: "Cykl budowy"
 cm__log_cycle_desc: "Wpisy dla cyklu miesięcznego, który został pominięty, ponieważ poprzedni wciąż trwał, oraz dla resetu następującego po dwóch pominięciach z rzędu."
 cm__log_industry_name: "Przemysł"
 cm__log_industry_desc: "Wiersze dla każdego budynku kolejkowanego przez kategorię Przemysł oraz każdej rozważanej rozbudowy pozyskiwania surowców, wraz z czasem zwrotu i dochodem dla każdej z nich."
 cm__log_collapsar_name: "Zapaść cenowa"
 cm__log_collapsar_desc: "Linie śledzące jedną lokację przez cykl Price Collapsar: niedobór rynkowy i poziomy, o które wnioskowała, a następnie co dana lokacja otrzymała, jej ocenę oraz co wybudowano. Najpierw oznacz lokację za pomocą komendy konsoli effect location:<key> = { cm_fa_col_watch_on = yes }."
 cm__log_food_name: "Auto-żywność"
 cm__log_food_desc: "Linie dla kategorii Żywność: miesięczna podaż, popyt i stosunek żywności każdego rynku, roczna mediana, według której stosunek ten jest oceniany względem celu, liczba lokacji już produkujących tam żywność oraz każda lokacja, którą włącza lub wyłącza."
 cm__log_roads_name: "Drogi"
 cm__log_roads_desc: "Jeden wiersz dla każdej drogi zamówionej przez kategorię Dróg, określający lokalizację, powód zakupu (jeden z trzech) oraz jej koszt."
 cm__log_cleanup_name: "Oczyszczanie budynków"
 cm__log_cleanup_desc: "Wpisy dotyczące rocznego przeglądu budynków oraz każdego budynku, który został zamknięty, zredukowany, zniszczony lub ponownie otwarty, wraz z zyskiem każdego z nich i progiem, względem którego zostały ocenione."
 cm__log_governors_name: "Gubernatorzy"
 cm__log_governors_desc: "Wpisy dotyczące planu gubernatora: wybrane i odrzucone lokalizacje, ulepszenia miasteczek i miast, rozmieszczenia, relokacje i odmowy, a także przeniesienie stolicy szczęśliwego narodu."
 cm__log_military_name: "Wojskowość szczęśliwego narodu"
 cm__log_military_desc: "Linie dla szczęśliwego państwa niszczącego forty i wznoszącego budynki rezerw ludzkich."
 cm__log_government_name: "Ustrój szczęśliwego narodu"
 cm__log_government_desc: "Wiersze dla szczęśliwego narodu usuwającego biurokrację lub podejmującego akcję stanu."
 cm__debug__diagnostics_name: "Diagnostyka"
 cm__placement_finder_debug_path_name: "Włącz diagnostykę debugowania"
 cm__placement_finder_debug_path_desc: "Dodaje blok diagnostyczny do podpowiedzi trybów mapy Rekomendowany zarządca i Rekomendowana stolica: przewidywaną trasę ze stolicy do każdej lokalizacji wraz z kosztem każdego etapu oraz porównanie przewidywanej bliskości z bliskością rzeczywistą."
 cm__debug__probes_name: "Sondy"
 cm__debug__probes_desc: "Jednorazowa diagnostyka zapisana w dzienniku działań moda."
 cm__probe_budget_name: "Budżet pełnej automatyzacji"
 cm__probe_budget_desc: "Bilans każdej kategorii pełnej automatyzacji: dodatni, gdy odkładane jest złoto na wybór, na który jeszcze jej nie stać, i ujemny w przypadku zadłużenia z powodu nadmiernych wydatków, wraz z limitem zwrotu przemysłu i najlepszym kandydatem oczekującym na rynku, który został pominięty w tym cyklu."
 cm__probe_budget_text: "Uruchom"
 cm__probe_governors_name: "Plan Gubernatora"
 cm__probe_governors_desc: "Stan realizacji planu gubernatora: jego faza, liczba zajętych i pozostałych do wyznaczenia miejsc, czy korzysta on ze skarbca, opłaceni gubernatorzy oraz sloty i miejsca, w ramach których działa."
 cm__probe_governors_text: "Uruchom"
 cm__probe_military_name: "Wojskowość szczęśliwego narodu"
 cm__probe_military_desc: "Poziom budynku zasobów ludzkich, na którym znajduje się kraj, informacja o tym, czy może go budować, stan pary stołecznej, budżet wojskowy oraz ile lokacji może przyjąć ten poziom w stosunku do tego, ile już go posiada."
 cm__probe_military_text: "Uruchom"
 cm__probe_industry_anchors_name: "Kotwice przemysłowe"
 cm__probe_industry_anchors_desc: "Jeden wiersz na towar z najlepszym czasem zwrotu odnotowanym dla niego przez przemysł oraz limitem zwrotu, który on wyznacza, z podaniem nazwy budynku i lokalizacji każdego z nich."
 cm__probe_industry_anchors_text: "Uruchom"
 cm__probe_industry_rgo_name: "Surowce przemysłowe"
 cm__probe_industry_rgo_desc: "Jeden wiersz dla każdego powodu, dla którego przemysł pominął surowce w danej lokalizacji, lub pojedynczy wiersz, gdy nie pominął żadnego. Odczytuje stolicę, chyba że oznaczysz lokalizację poleceniem konsoli effect location:<key> = { cm_fa_col_watch_on = yes }."
 cm__probe_industry_rgo_text: "Uruchom"
 cm__probe_collapsar_name: "Kolapsar cen"
 cm__probe_collapsar_desc: "Każda liczba odczytywana przez Price Collapsar w danej lokacji, wyświetlana obok własnych odczytów gry, a następnie informacja o tym, ile rynek tej lokacji mógłby wchłonąć w jednym cyklu. Odczytuje stolicę, chyba że oznaczysz lokację komendą konsoli effect location:<key> = { cm_fa_col_watch_on = yes }; stolica nigdy nie jest kandydatem Price Collapsar, więc oznacz lokację, aby podejrzeć taką, w której system by budował."
 cm__probe_collapsar_text: "Uruchom"
 cm__probe_roads_name: "Drogi"
 cm__probe_roads_desc: "Ile korytarzy plan dróg zawiera dla bliskości, dostępu do rynku i połączenia ze stolicą, ile z połączeń ze stolicą można już rozpocząć, ile dróg jest już budowanych oraz co pozostało w puli kategorii."
 cm__probe_roads_text: "Uruchom"
 cm__probe_log_gate_name: "Bramka dziennika działań"
 cm__probe_log_gate_desc: "Kategoria logów Price Collapsar podwójnie, tak jak odczytuje ją bramka logów i jak przechowuje ją menu, przez co wyświetla się kategoria, która jest włączona w jednym miejscu, a wyłączona w drugim."
 cm__probe_log_gate_text: "Uruchom"
