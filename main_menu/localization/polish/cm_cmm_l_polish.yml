l_polish:
 # Mod
 cm_name: "Zarządca Budowy"
 cm_desc: "Potężna modyfikacja poprawiająca komfort gry, która dodaje nową automatyzację, filtry i tryby mapy, aby znacznie usprawnić proces budowy w EU5."

 # Settings (settings) Tab
 cm__settings_name: "Ustawienia"
 ## Global Control (settings) Group
 cm__pause_auto_expand_name: "Wstrzymaj Automatyzację"
 cm__pause_auto_expand_desc: "Wstrzymuje wszystkie funkcje automatyzacji: automatyczną rozbudowę budynków, automatyczną rozbudowę RGO, ulepszanie wszystkich budynków, automatyczną budowę, automatyczną budowę budynków stołecznych, automatyczne zarządzanie żywnością, automatyczną urbanizację, automatyczne nadawanie praw miejskich oraz Pełną Automatyzację."
 cm__minimum_gold_name: "Rezerwy złota"
 cm__minimum_gold_desc: "Minimalna rezerwa złota do zachowania. Dotyczy każdej funkcji automatyzacji z wyjątkiem Pełnej Automatyzacji."
 cm__minimum_gold_format: "[CMMV('cm__minimum_gold')]@gold!"
 cm__allowed_building_overbuild_levels_name: "Limit nadmiernej rozbudowy"
 cm__allowed_building_overbuild_levels_desc: "O ile łącznych poziomów budynków lokacja może przekroczyć swój limit obsługiwanych poziomów budynków, zanim automatyczna rozbudowa przestanie kolejkować tam nowe konstrukcje. Przy wartości zero nadbudowywanie nie jest dozwolone. Przy 200+ nie ma limitu."

 ## Priority List Group
 cm__settings__priority_list_name: "Automatyzacja budowy"
 cm__settings__priority_list_desc: "Przeciągnij, aby zmienić priorytet funkcji. W każdym miesiącu aktywne funkcje są uruchamiane od góry do dołu, z wyjątkiem Automatycznej urbanizacji, która zawsze uruchamia się na końcu, po wszystkich innych funkcjach oraz po Pełnej automatyzacji."
 cm__priority_list_item_column_name: "Funkcja"
 cm__priority_list_i1_name: "Automatyczna rozbudowa budynków"
 cm__priority_list_i1_desc: "Automatycznie rozbudowuje wielopoziomowe budynki produkcyjne i nieprodukcyjne, gdy jest to dochodowe, dostępna jest populacja, a zasoby złota pozostają powyżej Twojej Rezerwy Złota. Ma zastosowanie tam, gdzie automatyczna rozbudowa jest włączona dla danej lokacji lub całego typu budynku, w tym dla zagranicznych budynków w lokacjach innych państw."
 cm__priority_list_i2_name: "Automatyczna rozbudowa RGO"
 cm__priority_list_i2_desc: "Automatycznie rozbudowuje poziomy RGO w lokacjach, w których włączono automatyczną rozbudowę RGO, gdy dostępni są robotnicy, a zasoby na to pozwalają."
 cm__priority_list_i3_name: "Automatyczna budowa"
 cm__priority_list_i3_desc: "Automatycznie wznosi budynki stołeczne oraz budynki ograniczone do jednego na lokację (rady, biblioteki itp.) w kolejności i zgodnie z ustawieniami skonfigurowanymi w zakładce Auto-budowy."
 cm__priority_list_i4_name: "Auto-żywność"
 cm__priority_list_i4_desc: "Automatycznie buduje RGO i budynki produkujące żywność w lokacjach wiejskich, wybierając najbardziej wydajną pod względem żywności opcję. Konfigurowane w zakładce Auto-żywność."
 cm__priority_list_i5_name: "Auto-urbanizacja"
 cm__priority_list_i5_desc: "Co miesiąc ulepsza rangi lokacji: osady wiejskie do miasteczek, miasteczka do miast, a miasta do megalopolii. Pomija podbite lokacje. Konfigurowalne w zakładce Auto-Urbanize."
 cm__priority_list_i6_name: "Automatycznie ulepszaj wszystkie budynki"
 cm__priority_list_i6_desc: "Automatycznie ulepsza każdy budynek, który stał się przestarzały, niezależnie od tego, czy automatyczna rozbudowa jest dla niego włączona."
 cm__priority_list__enabled_name: "Włączone"
 cm__priority_list__enabled_desc: "Włącz lub wyłącz tę funkcję."
 cm__priority_list__min_profit_name: "Minimalny przychód z podatków"
 cm__priority_list__min_profit_desc: "Minimalna miesięczna ilość złota na poziom wymagana przed zakolejkowaniem budowy. Ustaw na 0, aby wyłączyć to sprawdzenie."
 cm__priority_list__min_profit_postfix: "@gold!"
 cm__priority_list__min_discount_name: "Min. zniżka"
 cm__priority_list__min_discount_desc: "Maksymalny dopuszczalny narzut ceny materiałów budowlanych. Przy -33% buduje tylko wtedy, gdy materiały kosztują o 33% poniżej ceny bazowej. Przy 0% buduje tylko po cenie bazowej lub niższej. Przy +33% buduje nawet wtedy, gdy ceny są o 33% powyżej ceny bazowej."
 cm__priority_list__min_discount_postfix: "%"
 cm__priority_list__min_discount_prefix_high: "#R "
 cm__priority_list__min_discount_postfix_high: "%#!"
 cm__priority_list__min_discount_prefix_low: "#G "
 cm__priority_list__min_discount_postfix_low: "%#!"

