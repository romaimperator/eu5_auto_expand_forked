 cm__auto_town_rights_list_i38_name: "@enlightened_leadership_reform_town_right! [ShowTownRightsName('enlightened_leadership_reform_town_right')]"
 cm__expand_metric: "cm__expand_metric"
 cm__town_rights_free_grants_name: "Usuń koszty praw miejskich"
 cm__town_rights_free_grants_desc: "Gdy włączone, nadawanie praw miejskich nie kosztuje władzy państwowej, a ich odbieranie nie kosztuje stabilności."
 cm__town_rights_min_gov_power_name: "Minimalna władza państwowa"
 cm__town_rights_min_gov_power_desc: "Automatyczne nadawanie przestaje przyznawać prawa miejskie, gdy kolejne nadanie obniżyłoby twoją władzę państwową (legitymizację, tradycję republikańską, oddanie lub jedność hordy, zależnie od typu rządu) poniżej tej wartości."
 cm__allowed_building_overbuild_levels_format: "[CMMV('cm__allowed_building_overbuild_levels')][Select_CString(GreaterThanOrEqualTo_CFixedPoint(CMMV('cm__allowed_building_overbuild_levels'), CMMMapValue('cmm_max', 'cm__allowed_building_overbuild_levels')), '+', '')]"
 cm__auto_build_capital_name: "Budynki stołeczne"
 cm__auto_build_capital_desc: "Automatycznie wznosi budynki dostępne wyłącznie w stolicy (dwór królewski, sąd najwyższy, akademię wojskową itp.) w lokacji stolicy, gdy pozwalają na to warunki. Są one budowane przed listą poniżej."
 cm__urbanize_city_to_megalopolis_name: "Miasto do Megalopolis"
 cm__urbanize_city_to_megalopolis_desc: "Ulepsz swoją stolicę do poziomu megalopolii, gdy stanie się miastem będącym centrum handlowym z co najmniej 400 000 mieszkańców."
 cm__megalopolis_ignore_capital_name: "Megalopolis: Ignoruj wymóg stolicy"
 cm__megalopolis_ignore_capital_desc: "Pozwala zbudować Załóż Megalopolię w mieście, które nie jest twoją stolicą."
 cm__megalopolis_ignore_market_center_name: "Megalopolis: Ignoruj wymóg centrum handlowego"
 cm__megalopolis_ignore_market_center_desc: "Pozwala zbudować Założenie Megalopolis w mieście, które nie jest ośrodkiem handlowym."
 cm__deurbanize_name: "Deurbanizuj"
 cm__deurbanize_desc: "Co miesiąc przywracaj posiadane lokacje do poziomu osad wiejskich, gdy ich towar RGO jest zaznaczony na poniższej liście „Nie urbanizuj”. Twoja stolica, podbite lokacje oraz lokacje zapewniające Bliskość, takie jak siedziby gubernatorów, zostaną pominięte."
 cm__auto_urbanize_ignore_list_i20_name: "@wool! [ShowGoodsName('wool')] ([GetGlobalVariable('cm_goods_wool').GetGoods.GetDefaultMarketPrice]@gold!)"
 cm__full_automation_name: "Pełna automatyzacja"
 cm__full_automation__full_automation_name: "Pełna automatyzacja"
 cm__full_automation__full_automation_desc: "Bezobsługowa budowa. Każdego miesiąca poniższe kategorie wydają środki ze skarbca powyżej Rezerwy Złota na najlepsze dostępne konstrukcje. Działa równolegle z innymi funkcjami automatyzacji, nie zmieniając ich ustawień."
 cm__fa_enabled_name: "Włącz pełną automatyzację"
 cm__fa_enabled_desc: "Włącz lub wyłącz pełną automatyzację."
 cm__fa_reserve_name: "Rezerwa złota"
 cm__fa_reserve_desc: "Pełna automatyzacja nigdy nie wydaje środków ze skarbca poniżej tej kwoty. Ustawienie oddzielne od Rezerwy Złota w zakładce Ustawienia."
 cm__fa_reserve_format: "[CMMV('cm__fa_reserve')]@gold!"
 cm__fa_save_unaffordable_name: "Oszczędzaj na zbyt drogie budynki"
 cm__fa_save_unaffordable_desc: "Kategoria kupuje najlepszy znaleziony budynek, nawet jeśli kosztuje on więcej niż jej miesięczny przydział, a następnie wstrzymuje wydatki, dopóki przyszłe miesiące nie wyrównają różnicy. Gdy opcja jest wyłączona, każda kategoria wydaje tyle, ile może, a resztę przekazuje dalej."
 cm__full_automation__fa_priority_list_name: "Priorytety"
 cm__full_automation__fa_priority_list_desc: "Przeciągnij, aby zmienić kolejność. Kategorie są przetwarzane co miesiąc, od góry do dołu. Jeśli dwie kategorie wymagają tego samego budynku, buduje go ta znajdująca się wyżej."
 cm__fa_priority_list_item_column_name: "Kategoria"
 cm__fa_priority_list_i1_name: "Żywność"
 cm__fa_priority_list_i1_desc: "Monitoruje podaż żywności w ciągu roku na rynkach, których centrum rynkowe posiadasz, a tam, gdzie mediana miesięczna wykazała niedobór, włącza auto-żywność w lokacjach o najwyższym potencjale żywnościowym. Wybrane lokacje świecą się tak jak te włączone przez gracza, ale przełącznik pozostaje w Twojej gestii; nie zostaną one nigdy wyłączone, chyba że lokacja przestanie być należącą do Ciebie osadą wiejską lub przestaniesz posiadać jej centrum rynkowe."
 cm__fa_priority_list_i2_name: "Przemysł"
 cm__fa_priority_list_i2_desc: "Buduje, rozbudowuje i ulepsza budynki produkcyjne oraz RGO, które najszybciej zwracają swój koszt w przychodach podatkowych. Lokacje z automatyzacją żywności są pomijane, gdy brakuje w nich jakiegokolwiek rodzaju pracowników."
 cm__fa_priority_list_i3_name: "Kolapsar cen"
 cm__fa_priority_list_i3_desc: "Rozszerza produkcję materiałów budowlanych, aby obniżyć ich ceny. Działa na rynkach, których centrum rynku posiadasz. Najbardziej wydajne lokacje są traktowane priorytetowo i każda otrzymuje po kilka poziomów naraz, a produkcja rusza nawet tam, gdzie pracownicy jeszcze nie dotarli. Twoja stolica, lokacje produkujące żywność oraz producenci, którzy przynosiliby straty bez dotacji, są pomijani."
 cm__fa_priority_list_i4_name: "Drogi"
 cm__fa_priority_list_i4_desc: "Buduje sieć dróg o najwyższej wartości względem wydanego złota, biorąc pod uwagę trzy korzyści: Bliskość, Dostęp do rynku oraz połączenie lokacji ze stolicą. Raz w roku wyznacza najlepszą trasę do każdej posiadanej lokacji dla każdego z tych celów, a następnie co miesiąc rozpoczyna budowę odcinków, które najbardziej zwiększyłyby Bazę podatkową, wliczając w to wszystkie lokacje znajdujące się dalej na trasie. Tanie korytarze na terenach płaskich są budowane jako pierwsze, a dwie niższe kategorie otrzymują fundusze tylko w miesiącach, w których kategoria powyżej nie ma już nic do wybudowania."
 cm__fa_priority_list_i5_name: "Narzędzia"
 cm__fa_priority_list_i5_desc: "Buduje infrastrukturę wspomagającą wszędzie tam, gdzie jest to możliwe: budynki stolicy, listę automatycznej rozbudowy, patia rtęciowe, budynki centrów handlowych, zarządców oraz wszelkie unikalne budynki twojego kraju zwiększające kontrolę, targowiska, budynki odporności na choroby, a na samym końcu spichlerze. Budynki kontroli wznoszone są najpierw w najbogatszych lokacjach, a targowiska w lokacjach o najniższym dostępie do rynku."
 cm__fa_priority_list_i6_name: "Porządkowanie budynków"
 cm__fa_priority_list_i6_desc: "Raz w roku zamyka budynki produkcyjne, które przestały przynosić zyski i nie są dotowane, a zamiast tego niszczy je, gdy lokacja znajduje się w obrębie dziesięciu poziomów od poziomów budynków, które wspiera. Zamknięte budynki są otwierane ponownie, gdy dany typ zacznie ponownie zarabiać na tym rynku, a zostają zniszczone później, jeśli w ich lokacji zabraknie miejsca. @farming_village! [ShowBuildingTypeNameWithNoTooltip('farming_village')] nigdy nie jest zamykany ani niszczony."
 cm__fa_priority_list_i7_name: "Gubernatorzy"
 cm__fa_priority_list_i7_desc: "Planuje, gdzie powinni zasiadać twoi gubernatorzy i umieszcza ich tam, wybierając najpierw najlepszą lokalizację. Planuje ponownie za każdym razem, gdy zwolni się miejsce dla gubernatora, a w przeciwnym razie co dwadzieścia pięć lat. Tylko dla jednego gracza."
 cm__fa_priority_list_i8_name: "Prawa miejskie"
 cm__fa_priority_list_i8_desc: "Nadaje prawa miejskie w twoich miasteczkach i miastach. Najpierw przyznawane jest [ShowTownRightsNameWithNoTooltip('granary_town')], a następnie jedno losowe prawo specjalizacji spośród tych, które pasują do dóbr wytwarzanych w okolicy lokacji."
 cm__fa_priority_list__budget_name: "Udział w budżecie"
 cm__fa_priority_list__budget_desc: "Udział skarbca powyżej Rezerwy Złota, który ta kategoria może wydawać każdego miesiąca."
 cm__fa_priority_list__budget_postfix: "%"
 cm__fa_priority_list__enabled_name: "Włączone"
 cm__fa_priority_list__enabled_desc: "Zezwalaj na budowę w tej kategorii."
 cm__full_automation__fa_industry_name: "Przemysł"
 cm__full_automation__fa_industry_desc: "Ustawienia dla powyższej kategorii Przemysł."
 cm__fa_industry_algorithm_name: "Strategia budowy"
 cm__fa_industry_algorithm_desc: "Jak przemysł wybiera, co budować."
 cm__fa_industry_algorithm_option_1_name: "Chciwy"
 cm__fa_industry_algorithm_option_1_desc: "Najpierw buduj opcje o najszybszym zwrocie i tylko te blisko najlepszego miejsca do produkcji tych samych towarów."
 cm__fa_industry_max_rel_roi_name: "Maksymalny względny ROI"
 cm__fa_industry_max_rel_roi_desc: "O ile wolniej od najlepszego znalezionego miejsca wytwarzającego te same towary budynek lub ulepszenie może zwracać swój koszt, aby nadal zostać zbudowanym. Przy 30%, jeśli najlepszy zwraca się w 10 lat, budowane są tylko te zwracające się w ciągu 13 lat; wolniejsze inwestycje czekają. Przy 0% każdego miesiąca budowany jest tylko najlepszy producent każdego towaru. Przy 100%+ nie ma limitu i obowiązują tylko Maksymalne lata spłaty. Wszystkie budynki wytwarzające te same towary są oceniane wspólnie, niezależnie od ich rodzaju. Rozbudowy RGO są zawsze budowane w kolejności zwrotu kosztów."
 cm__fa_industry_max_rel_roi_format: "[CMMV('cm__fa_industry_max_rel_roi')]%[Select_CString(GreaterThanOrEqualTo_CFixedPoint(CMMV('cm__fa_industry_max_rel_roi'), CMMMapValue('cmm_max', 'cm__fa_industry_max_rel_roi')), '+', '')]"
 cm__fa_industry_min_roi_name: "Maksymalna liczba lat zwrotu"
 cm__fa_industry_min_roi_desc: "Uwzględniane są tylko konstrukcje, których dochód z podatków zwróci koszt budowy w ciągu tylu lat. Ustaw 0, aby wyłączyć to sprawdzenie."
 cm__fa_industry_min_roi_format: "[CMMV('cm__fa_industry_min_roi')] r. @efficiency!"
 cm__full_automation__fa_collapsar_name: "Kollapsar cenowy"
 cm__full_automation__fa_collapsar_desc: "Ustawienia dla powyższej kategorii Price Collapsar. Materiały są przetwarzane od góry listy do dołu, przy czym RGO są rozbudowywane przed budynkami produkcyjnymi."
 cm__fa_collapsar_target_name: "Cena docelowa"
 cm__fa_collapsar_target_desc: "Cena, przy której budowa dla danego materiału zostaje wstrzymana, względem jego ceny bazowej. Przy -33% producenci są budowani, dopóki materiał nie będzie sprzedawany 33% poniżej ceny bazowej. Przy 0%, aż do osiągnięcia ceny bazowej. Przy +33%, tylko wtedy, gdy kosztuje on ponad 33% powyżej ceny bazowej."
 cm__fa_collapsar_target_format: "[CMMV('cm__fa_collapsar_target')]%"
 cm__fa_collapsar_item_column_name: "Materiał"
 cm__fa_collapsar_i1_name: "@masonry! [ShowGoodsName('masonry')]"
 cm__fa_collapsar_i2_name: "@lumber! [ShowGoodsName('lumber')]"
 cm__fa_collapsar_i3_name: "@sand! [ShowGoodsName('sand')]"
 cm__fa_collapsar_i4_name: "@glass! [ShowGoodsName('glass')]"
 cm__fa_collapsar__enabled_name: "Włączone"
 cm__fa_collapsar__enabled_desc: "Dąż do obniżenia ceny tego materiału."
 cm__full_automation__fa_food_name: "Żywność"
 cm__full_automation__fa_food_desc: "Ustawienia dla powyższej kategorii Żywność."
 cm__fa_food_target_name: "Docelowa nadwyżka"
 cm__fa_food_target_desc: "Rynek otrzymuje więcej lokacji żywnościowych, dopóki jego podaż nie osiągnie tego udziału w popycie. Przy 125%, żywność jest rozbudowywana na każdym rynku, którego mediana miesięcy w roku nie osiągnęła 25% nadwyżki. Zwiększ tę wartość, aby zachować większy bufor, lub zmniejsz ją, aby pomagać tylko rynkom bliższym niedoboru."
 cm__fa_food_target_format: "[CMMV('cm__fa_food_target')]%"
 cm__fa_food_min_potential_name: "Minimalny potencjał żywnościowy"
 cm__fa_food_min_potential_desc: "Automatyzacja żywności jest włączona tylko w lokacjach, których potencjał żywności na poziom RGO osiąga tę wartość — tę samą, którą wyświetla tryb mapy $mapmode_cm_location_food_potential_name$. Zwiększ ją, aby czekać na lepsze grunty rolne, lub zmniejsz, aby zaakceptować słabszą ziemię."
 cm__fa_food_min_potential_format: "[CMMV('cm__fa_food_min_potential')]"
 cm__full_automation__fa_urban_rights_name: "Prawa miejskie"
 cm__full_automation__fa_urban_rights_desc: "Ustawienia dla kategorii Prawa miejskie powyżej."
 cm__fa_urban_rights_window_name: "Próg dopasowania"
 cm__fa_urban_rights_window_desc: "Jak dobrze prawo do specjalizacji musi pasować do lokacji względem najlepiej dopasowanego tam prawa, aby było brane pod uwagę. Przy 50% każde prawo, które pasuje przynajmniej w połowie tak dobrze, może zostać wylosowane, a te lepiej dopasowane są losowane częściej. Przy 100% przyznawane jest tylko najlepiej dopasowane prawo."
 cm__fa_urban_rights_window_format: "[CMMV('cm__fa_urban_rights_window')]%"
 cm__fa_urban_rights_reserve_name: "Rezerwa władzy państwowej"
 cm__fa_urban_rights_reserve_desc: "Żadne prawo miejskie nie zostanie przyznane, jeśli opłacenie go spowodowałoby spadek siły rządu (legitymacji, tradycji republikańskiej, oddania lub jedności ordy, zależnie od typu rządu) poniżej tej wartości."
 cm__fa_urban_rights_expand_name: "Rozbuduj wzmocnione gałęzie przemysłu"
 cm__fa_urban_rights_expand_desc: "Po nadaniu prawa specjalizacji włączona zostanie również automatyczna rozbudowa w danej lokacji dla przemysłów premiowanych przez to prawo oraz dla produkowanych tam surowców. Działa to tak samo, jak kliknięcie prawym przyciskiem myszy na przycisku nadania na mapie rekomendowanych praw miejskich."
 cm__full_automation__fa_cleanup_name: "Czyszczenie budynków"
 cm__full_automation__fa_cleanup_desc: "Ustawienia dla powyższej kategorii Oczyszczania Budynków."
 cm__fa_cleanup_min_profit_name: "Minimalny zysk"
 cm__fa_cleanup_min_profit_desc: "Budynek zarabiający miesięcznie mniej niż ta kwota uznawany jest za nieopłacalny i zostaje zamknięty lub zniszczony, chyba że jest dotowany. Jednorazowo likwidowana jest co najwyżej połowa otwartych budynków danego typu na rynku."
 cm__fa_cleanup_min_profit_format: "[Divide_CFixedPoint(CMMV('cm__fa_cleanup_min_profit'), '(CFixedPoint)100')|2]@gold!"
 cm__fa_cleanup_core_goods_name: "Priorytetyzuj materiały budowlane"
 cm__fa_cleanup_core_goods_desc: "Utrzymuj budynki, które zużywają głównie @masonry![ShowGoodsNameWithNoTooltip('masonry')], @lumber![ShowGoodsNameWithNoTooltip('lumber')], @sand![ShowGoodsNameWithNoTooltip('sand')] lub @glass![ShowGoodsNameWithNoTooltip('glass')], na poziomie dwukrotności Minimalnego Zysku lub 0,1@gold!, zależnie od tego, która wartość jest wyższa. Budynki produkujące jeden z tych czterech towarów są oceniane według normalnego Minimalnego Zysku."
 cm__fa_cleanup_auto_food_name: "Wyczyść lokacje z automatyczną żywnością"
 cm__fa_cleanup_auto_food_desc: "W miejscach, gdzie aktywna jest automatyczna produkcja żywności i brakuje jakiegokolwiek rodzaju pracowników, niszczone są budynki produkcyjne niewytwarzające żywności. @market_village! [ShowBuildingTypeNameWithNoTooltip('market_village')] zostaje zredukowany do jednego poziomu zamiast zostać zniszczonym."
 cm__full_automation__fa_roads_name: "Drogi"
 cm__full_automation__fa_roads_desc: "Ustawienia dla powyższej kategorii Dróg."
 cm__fa_roads_proximity_name: "Bliskość"
 cm__fa_roads_proximity_desc: "Wybuduj odcinki dróg, które najbardziej zwiększają Bliskość w stosunku do wydanego złota, wliczając każdą lokację znajdującą się dalej na trasie za nimi."
 cm__fa_roads_market_access_name: "Dostęp do rynku"
 cm__fa_roads_market_access_desc: "Buduj odcinki dróg, które najbardziej zwiększają Dostęp do Rynku w stosunku do kosztów. Wydaje środki w danym miesiącu tylko wtedy, gdy nie pozostały już żadne odcinki Bliskości do wybudowania."
 cm__fa_roads_capital_name: "Połączenie ze stolicą"
 cm__fa_roads_capital_desc: "Buduj odcinki dróg, aby połączyć swoje lokacje ze stolicą, postępując od tych już połączonych. Wydaje środki w danym miesiącu tylko wtedy, gdy nie pozostały już żadne odcinki Bliskości i Dostępu do Rynku do wybudowania."
 cm__full_automation__fa_governors_name: "Gubernatorzy"
 cm__full_automation__fa_governors_desc: "Ustawienia dla powyższej kategorii Zarządców."
 cm__fa_gov_move_seats_name: "Zezwalaj na przenoszenie gubernatorów"
 cm__fa_gov_move_seats_desc: "Gdy wszystkie miejsca na rządców są zajęte, odwołaj rządcę i umieść go w lepszej lokalizacji. Lepsza lokalizacja musi być już miastem lub posiadać wynik o ponad 10% wyższy niż ta, którą zastępuje. Przy wyłączonej opcji rządcy są przydzielani wyłącznie do wolnych miejsc."
 cm__fa_gov_prepare_sites_name: "Zezwól na przygotowywanie nowych lokacji"
 cm__fa_gov_prepare_sites_desc: "Uwzględniaj lokacje, które nie mogą jeszcze przyjąć gubernatora, i przygotuj je najpierw, zakładając w nich Miasteczko lub Miasto oraz budując drogę do stolicy. Przy wyłączonej opcji pod uwagę brane są tylko lokacje będące już Miastami z połączeniem drogowym ze stolicą."
 cm__map_modes_name: "Tryby mapy"
 cm__map_modes__placement_finder_name: "Zalecana lokalizacja stolicy i gubernatora"
 cm__map_modes__placement_finder_desc: "Ustawienia dla trybów mapy zalecanego rozmieszczenia gubernatora i stolicy."
 cm__placement_finder_method_name: "Punktacja wyszukiwarki lokalizacji"
 cm__placement_finder_method_desc: "Jak tryby mapy Polecany gubernator i Polecana stolica szeregują twoje lokacje."
 cm__placement_finder_method_option_1_name: "Baza podatkowa"
 cm__placement_finder_method_option_1_desc: "Sortuj według tego, o ile umieszczenie tam gubernatora lub stolicy zwiększyłoby całkowitą bazę podatkową. Bogatsze lokacje liczą się bardziej."
 cm__placement_finder_method_option_2_name: "Bliskość"
 cm__placement_finder_method_option_2_desc: "Sortuj według bliskości, jaką dodałby tam gubernator lub stolica."
 cm__placement_finder_roads_name: "Infrastruktura lądowa"
 cm__placement_finder_roads_desc: "Czy tryby mapy Zalecany zarządca i Zalecana stolica zakładają idealną infrastrukturę lądową, czy korzystają z tej faktycznie zbudowanej."
 cm__placement_finder_roads_option_1_name: "Aktualny"
 cm__placement_finder_roads_option_1_desc: "Używaj dróg, które faktycznie wybudowałeś."
 cm__placement_finder_roads_option_2_name: "Maks. liczba dróg"
 cm__placement_finder_roads_option_2_desc: "Przyjmij, że najlepsza odblokowana droga jest zbudowana na każdym połączeniu."
 cm__placement_finder_roads_option_3_name: "Najlepszy możliwy"
 cm__placement_finder_roads_option_3_desc: "Przyjmij, że najlepsza odblokowana droga jest zbudowana na każdym połączeniu, a każdy odblokowany budynek poprawiający bliskość lądową jest zbudowany wszędzie tam, gdzie to możliwe."
 cm__placement_finder_naval_name: "Infrastruktura morska"
 cm__placement_finder_naval_desc: "Określa, czy tryby mapy Polecany gubernator i Polecana stolica zakładają idealną infrastrukturę morską, czy korzystają z Twojej obecnej przepustowości portów i obecności morskiej."
 cm__placement_finder_naval_option_1_name: "Aktualny"
 cm__placement_finder_naval_option_1_desc: "Wykorzystaj swoją aktualną przepustowość portów i obecność morską."
 cm__placement_finder_naval_option_2_name: "Maksymalna obecność"
 cm__placement_finder_naval_option_2_desc: "Załóż pełną obecność morską wszędzie, przy obecnej przepustowości portów."
 cm__placement_finder_naval_option_3_name: "Najlepszy możliwy"
 cm__placement_finder_naval_option_3_desc: "Zakłada pełną obecność floty oraz najlepsze odblokowane budynki portowe, wybudowane w każdej lokacji nadmorskiej."
 cm__placement_finder_accuracy_name: "Dokładność wyszukiwania"
 cm__placement_finder_accuracy_desc: "Jak dokładnie tryby mapy Rekomendowany gubernator i Rekomendowana stolica wyszukują najlepsze lokalizacje. Pominięte miejsca są wyświetlane na czarno."
 cm__placement_finder_accuracy_option_1_name: "Wyczerpujący"
 cm__placement_finder_accuracy_option_1_desc: "Oceń każdą lokację. Najdokładniejsza i najwolniejsza."
 cm__placement_finder_accuracy_option_2_name: "Dokładny"
 cm__placement_finder_accuracy_option_2_desc: "Pomija lokacje, które nie mogą znaleźć się w pierwszej trójce. Pierwsza trójka i ich wyniki są identyczne jak w trybie Wyczerpującym, tylko szybciej."
 cm__placement_finder_accuracy_option_3_name: "Zrównoważony"
 cm__placement_finder_accuracy_option_3_desc: "Pomijaj lokacje, które nie mogą być tą jedyną najlepszą. Najlepsza lokacja jest nadal gwarantowana jako dokładna; znaczniki drugiego i trzeciego miejsca mogą się sporadycznie różnić."
 cm__placement_finder_accuracy_option_4_name: "Szybkie"
 cm__placement_finder_accuracy_option_4_desc: "Pomija również lokacje, które z małym prawdopodobieństwem są najlepsze. Najlepsza znaleziona lokacja mieści się w granicach 20% od faktycznie najlepszej i zazwyczaj nadal jest identyczna."
 cm__placement_finder_accuracy_option_5_name: "Najszybsza"
 cm__placement_finder_accuracy_option_5_desc: "Analizuje najbardziej obiecującą lokalizację w każdej prowincji, a następnie doprecyzowuje wybór wokół liderów. Znacznie szybsze dla dużych krajów; może pominąć najlepszą lokalizację."
 cm__debug_name: "Debug"
 cm__debug__logging_name: "Rejestr działań"
 cm__debug__logging_desc: "Które z akcji tego moda są zapisywane w dzienniku akcji moda."
 cm__log_cycle_name: "Cykl budowy"
 cm__log_cycle_desc: "Wiersze dla cyklu miesięcznego, który został pominięty, ponieważ poprzedni wciąż trwał, oraz dla resetu następującego po dwóch pominięciach z rzędu."
 cm__log_industry_name: "Przemysł"
 cm__log_industry_desc: "Wiersze dla każdego budynku kolejkowanego przez kategorię Przemysł oraz każdej rozważanej rozbudowy wydobycia surowców, wraz z czasem zwrotu i dochodem dla każdego z nich."
 cm__log_collapsar_name: "Załamanie cen"
 cm__log_collapsar_desc: "Linie śledzące jedną lokację przez cykl Price Collapsar: niedobór rynkowy i poziomy, o które wnioskowała, a następnie co dana lokacja otrzymała, jak została oceniona i co wybudowano. Najpierw oznacz lokację komendą konsoli effect location:<key> = { cm_fa_col_watch_on = yes }."
 cm__log_food_name: "Auto-żywność"
 cm__log_food_desc: "Linie dla kategorii żywności: miesięczna podaż, popyt i stosunek żywności na każdym rynku, roczna mediana, według której stosunek ten jest oceniany względem celu, liczba lokacji już produkujących tam żywność oraz każda lokacja, którą to aktywuje lub dezaktywuje."
 cm__log_roads_name: "Drogi"
 cm__log_roads_desc: "Jeden wiersz dla każdej drogi zamówionej w kategorii Drogi, wymieniający lokację, powód zakupu (jeden z trzech) oraz poniesiony koszt."
 cm__log_cleanup_name: "Porządkowanie budynków"
 cm__log_cleanup_desc: "Linie dotyczące corocznego czyszczenia budynków oraz każdego budynku, który zostanie zamknięty, ograniczony, zniszczony lub ponownie otwarty, wraz z zyskiem każdego z nich i progiem, względem którego został oceniony."
 cm__log_governors_name: "Gubernatorzy"
 cm__log_governors_desc: "Linie dla planu gubernatora: wybrane i porzucone lokalizacje, ulepszenia miasteczek i miast, rozmieszczenia, relokacje i odmowy, oraz przeniesienie stolicy szczęśliwego narodu."
 cm__log_military_name: "Wojskowość szczęśliwego państwa"
 cm__log_military_desc: "Linie dla szczęśliwego państwa niszczącego forty i budującego budynki zasobów ludzkich."
 cm__log_government_name: "Rząd szczęśliwego narodu"
 cm__log_government_desc: "Linie dla szczęśliwego państwa usuwającego biurokrację lub podejmującego akcję stanu."
 cm__debug__diagnostics_name: "Diagnostyka"
 cm__placement_finder_debug_path_name: "Włącz diagnostykę debugowania"
 cm__placement_finder_debug_path_desc: "Dodaje blok diagnostyczny do podpowiedzi trybów mapy Zalecany gubernator i Zalecana stolica: przewidywaną trasę z twojej stolicy do każdej lokacji wraz z kosztem każdego skoku oraz przewidywaną bliskość w porównaniu z faktyczną bliskością."
 cm__debug__probes_name: "Sondy"
 cm__debug__probes_desc: "Jednorazowa diagnostyka zapisana w dzienniku działań moda."
 cm__probe_budget_name: "Pełny budżet automatyzacji"
 cm__probe_budget_desc: "Saldo każdej kategorii pełnej automatyzacji; dodatnie, gdy odkłada złoto na wybór, na który jeszcze jej nie stać, a ujemne, gdy posiada zadłużenie z powodu nadmiernych wydatków, wraz z limitem zwrotu dla przemysłu i najlepszym kandydatem oczekującym na rynku pominiętym w tym cyklu."
 cm__probe_budget_text: "Uruchom"
 cm__probe_governors_name: "Plan gubernatora"
 cm__probe_governors_desc: "Stan realizacji planu gubernatora: jego faza, liczba zajętych i pozostałych do wyznaczenia miejsc, czy blokuje skarbiec, opłaceni gubernatorzy oraz sloty i miejsca, w ramach których działa."
 cm__probe_governors_text: "Uruchom"
 cm__probe_military_name: "Wojskowość szczęśliwego państwa"
 cm__probe_military_desc: "Poziom budynków zasobów ludzkich kraju, informacja o możliwości ich budowy, stan pary stolic, budżet wojskowy oraz liczba lokacji mogących przyjąć dany poziom w stosunku do tych, które już go posiadają."
 cm__probe_military_text: "Uruchom"
 cm__probe_industry_anchors_name: "Kotwice przemysłowe"
 cm__probe_industry_anchors_desc: "Jeden wiersz na towar z najlepszym odnotowanym przez przemysł zwrotem oraz ustalonym limitem zwrotu, z podaniem nazwy budynku i lokalizacji dla każdego z nich."
 cm__probe_industry_anchors_text: "Uruchom"
 cm__probe_industry_rgo_name: "Surowce przemysłowe"
 cm__probe_industry_rgo_desc: "Jeden wiersz dla każdego powodu, dla którego Przemysł pominął surowce danej lokacji, lub pojedynczy wiersz, gdy nie pominął żadnego. Odczytuje stolicę, chyba że zaznaczysz lokację komendą konsoli effect location:<key> = { cm_fa_col_watch_on = yes }."
 cm__probe_industry_rgo_text: "Uruchom"
 cm__probe_collapsar_name: "Kolapsar cen"
 cm__probe_collapsar_desc: "Każda liczba odczytywana przez Price Collapsar w danej lokalizacji, obok własnego odczytu gry, a następnie to, co rynek tej lokalizacji mógłby wchłonąć w cyklu. Odczytuje stolicę, chyba że oznaczysz lokalizację poleceniem konsoli location:<key> = { cm_fa_col_watch_on = yes }; stolica nigdy nie jest kandydatem Price Collapsar, więc oznacz lokalizację, aby zobaczyć odczyt dla miejsca, w którym system by budował."
 cm__probe_collapsar_text: "Uruchom"
 cm__probe_roads_name: "Drogi"
 cm__probe_roads_desc: "Ile korytarzy plan dróg przechowuje dla bliskości, dostępu do rynku i połączenia ze stolicą, ile z połączeń stołecznych można już rozpocząć, ile dróg jest już budowanych oraz co pozostało w puli tej kategorii."
 cm__probe_roads_text: "Uruchom"
 cm__probe_log_gate_name: "Bramka rejestru działań"
 cm__probe_log_gate_desc: "Kategoria logów Price Collapsar podwójnie, tak jak odczytuje ją bramka logów i jak przechowuje ją menu, więc wyświetla się kategoria, która jest włączona w jednym miejscu, a wyłączona w drugim."
 cm__probe_log_gate_text: "Uruchom"
