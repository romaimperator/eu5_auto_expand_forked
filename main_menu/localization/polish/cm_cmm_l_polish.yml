 cm__dbg_run_auto_food_name: "Uruchom auto-rozbudowę żywności we włączonych lokacjach"
 cm__dbg_run_auto_food_desc: "$cm_txt_dbg_run_feature_desc$" # NO-TRANSLATE
 cm__dbg_run_auto_food_text: "$cm_txt_run_now$" # NO-TRANSLATE
 cm__dbg_run_upgrade_all_name: "Uruchom automatyczne ulepszanie wszystkich budynków"
