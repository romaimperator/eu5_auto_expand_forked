 # Auto-Urbanize (auto_urbanize) Tab
 cm__auto_urbanize_name: "Auto-urbanizacja"
 ## Auto-Urbanize Settings (auto_urbanize) Group
 cm__auto_urbanize__auto_urbanize_name: "Ustawienia auto-urbanizacji"
 cm__auto_urbanize__auto_urbanize_desc: "Wybierz, które awanse rangi lokacji są przeprowadzane każdego miesiąca."
 cm__urbanize_town_to_city_name: "Z miasteczka w miasto"
 cm__urbanize_town_to_city_desc: "Co miesiąc awansuj kwalifikujące się miasteczka na miasta."
 cm__urbanize_rural_to_town_name: "Z wiejskich do miast"
 cm__urbanize_rural_to_town_desc: "Promuj kwalifikujące się osady wiejskie do rangi miast w każdym miesiącu. Wymaga 30 000 mieszkańców (natychmiastowa kwalifikacja do poziomu miasta) lub znalezienia się w granicach 1000 osób od limitu populacji (w przeciwnym razie wzrost zatrzymałby się na limicie wiejskim). Lokacje, których RGO jest zaznaczone na poniższej liście ignorowanych, są pomijane. Lokacje objęte funkcją Masowego Auto-Jedzenia również są pomijane, aby pozostały one wiejskie i kontynuowały produkcję żywności."
