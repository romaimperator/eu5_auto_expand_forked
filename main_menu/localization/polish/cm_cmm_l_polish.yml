 cm__auto_expand__priority_list_name: "Automatyzacja budowy"
 cm__auto_expand__priority_list_desc: "Przeciągnij, aby zmienić priorytet funkcji. Każdego miesiąca aktywne funkcje są uruchamiane od góry do dołu."
