 cm__auto_town_rights__auto_town_rights_desc: "Co miesiąc przyznawaj aktywowane prawa miejskie kwalifikującym się miastom i megalopolis w kolejności skonfigurowanej poniżej. Każde nadanie kosztuje siłę rządu."
