 cm__expand_metric_name: "Miernik automatycznej rozbudowy"
 cm__expand_metric_desc: "Wybierz, czego automatyczna rozbudowa używa, aby zdecydować, czy dodać poziom budynku lub RGO."
 cm__expand_metric_option_1_name: "@income! Przychód z podatków"
 cm__expand_metric_option_1_desc: "Dodaj nowy poziom tylko wtedy, gdy jego miesięczny przychód z podatków wynosi co najmniej ustawiony Minimalny Przychód z Podatków."
 cm__expand_metric_option_2_name: "@wealth! Zysk"
 cm__expand_metric_option_2_desc: "Dodaj nowy poziom tylko wtedy, gdy jego całkowity miesięczny zysk wynosi co najmniej ustalony Minimalny Zysk."
 cm__expand_metric_option_3_name: "@efficiency! ROI (Podatki)"
 cm__expand_metric_option_3_desc: "Dodaj nowy poziom tylko wtedy, gdy przychód z podatków zwróci koszt budowy w ciągu ustawionej Maks. liczby lat ROI."
 cm__expand_metric_option_4_name: "@efficiency! ROI (Zysk)"
 cm__expand_metric_option_4_desc: "Dodaj nowy poziom tylko wtedy, gdy zysk zwróci koszt budowy w ciągu Twoich ustalonych Maksymalnych Lat ROI."
