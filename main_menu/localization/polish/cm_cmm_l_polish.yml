 cm__urbanize_rural_to_town_desc: "Co miesiąc ulepszaj kwalifikujące się osady wiejskie do rangi miast. Wymaga 30 000 mieszkańców lub populacji w granicach 1 000 od limitu. Lokacje, których RGO widnieje na poniższej liście „Zakaz urbanizacji”, są pomijane. Lokacje objęte funkcją Masowe auto-jedzenie również są pomijane."
