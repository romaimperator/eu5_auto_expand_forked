l_polish:
 # Mod
 cm_name: "Zarządca Budowy"
 cm_desc: "Ogromna modyfikacja typu quality of life, która dodaje nową automatyzację, filtry i tryby mapy, aby znacznie usprawnić proces budowy w EU5."

 # Settings (settings) Tab
 ## Global Control (settings) Group
 cm__pause_auto_expand_name: "Wstrzymaj Automatyzację"
 cm__pause_auto_expand_desc: "Wstrzymuje wszystkie funkcje automatyzacji dodane przez ten mod."
 cm__minimum_gold_name: "Rezerwy złota"
 cm__minimum_gold_desc: "Żadna automatyzacja nie wyda środków ze skarbca poniżej tej kwoty."
 cm__minimum_gold_format: "[CMMV('cm__minimum_gold')]@gold!"
 cm__allowed_building_overbuild_levels_name: "Limit nadmiernej rozbudowy"
 cm__allowed_building_overbuild_levels_desc: "O ile łącznych poziomów budynków lokacja może przekroczyć swój limit obsługiwanych poziomów budynków, zanim nowe budowy przestaną być tam kolejkowane. Żywność, gubernatorzy oraz budynki w lokacjach innych państw są z tego wyłączone. Przy wartości zero nadmiarowa budowa nie jest dozwolona. Przy 200+ nie ma limitu."

 ## Priority List Group
 cm__priority_list_item_column_name: "Funkcja"
 cm__priority_list_i1_name: "Budynki z włączoną automatyczną rozbudową"
 cm__priority_list_i1_desc: "Automatycznie rozbudowuje wielopoziomowe budynki produkcyjne i nieprodukcyjne, gdy jest to dochodowe, dostępna jest populacja, a zasoby złota pozostają powyżej Twojej Rezerwy Złota. Ma zastosowanie tam, gdzie automatyczna rozbudowa jest włączona dla danej lokacji lub całego typu budynku, w tym dla zagranicznych budynków w lokacjach innych państw."
 cm__priority_list_i2_name: "RGO z włączoną automatyczną rozbudową"
 cm__priority_list_i2_desc: "Automatycznie rozbudowuje poziomy RGO w lokacjach, w których włączono automatyczną rozbudowę RGO, gdy dostępni są robotnicy, a zasoby na to pozwalają."
 cm__priority_list_i3_name: "Automatyczna rozbudowa żywności w aktywnych lokacjach"
 cm__priority_list_i3_desc: "Automatycznie buduje RGO i budynki produkujące żywność w lokacjach wiejskich, w których włączono funkcję auto-żywności, wybierając najbardziej efektywną pod względem żywności opcję."
 cm__priority_list_i4_name: "Automatycznie ulepszaj wszystkie budynki"
 cm__priority_list_i4_desc: "Automatycznie ulepsza każdy budynek, który stał się przestarzały, niezależnie od tego, czy automatyczna rozbudowa jest dla niego włączona."
 cm__priority_list__enabled_name: "$cm_txt_enabled$"
 cm__priority_list__enabled_desc: "Włącz lub wyłącz tę funkcję."
 cm__priority_list__min_profit_name: "Minimalny przychód z podatków"
 cm__priority_list__min_profit_desc: "Minimalna miesięczna ilość złota na poziom wymagana przed zakolejkowaniem budowy. Ustaw na 0, aby wyłączyć to sprawdzenie."
 cm__priority_list__min_profit_postfix: "@gold!"
 cm__priority_list__min_discount_name: "$cm_txt_min_discount$"
 cm__priority_list__min_discount_desc: "$cm_txt_min_discount_desc$"
 cm__priority_list__min_discount_postfix: "%"
 cm__priority_list__min_discount_prefix_high: "#R "
 cm__priority_list__min_discount_postfix_high: "%#!"
 cm__priority_list__min_discount_prefix_low: "#G "
