 # Action bar refresh button
 cm_pf_refresh: "cm_pf_refresh"
 cm_pf_refresh_color: "ciemnoturkusowy"
 cm_pf_refresh_icon: "@cm_pf_refresh!"
 cm_pf_refresh_name: "Przelicz ponownie oceny rozmieszczenia"
 cm_pf_refresh_tooltip: "Wymuś ponowne przeliczenie ocen rozmieszczenia gubernatorów i stolicy dla obecnych granic. W przeciwnym razie oceny są wykorzystywane ponownie przez okres do 4 lat."
