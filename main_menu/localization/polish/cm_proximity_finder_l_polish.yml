 mapmode_cm_capital_finder_name: "Zalecana lokalizacja stolicy"
 MAPMODE_CM_CAPITAL_FINDER: "#T $mapmode_cm_capital_finder_name$#!\nKoloruje twoje [locations|e] według tego, jak dobrze [capital|e] w tym miejscu rozprzestrzeniałby [proximity|e]. Istniejący zarządcy są ignorowani. Paskowane lokacje posiadają już źródło bliskości, takie jak obecna stolica lub zarządca.\nTo jest szacunek: ustawienie Punktacji Wyszukiwarki Miejsc określa, czy lokacje są oceniane według bazy podatkowej, czy surowego [proximity|e], a ustawienia Infrastruktury Lądowej i Infrastruktury Morskiej określają drogi, budynki oraz [maritime_presence|e], które są brane pod uwagę. Przelicza się przy otwarciu tego trybu mapy, nie częściej niż raz na 4 lata; użyj przycisku odświeżania na pasku akcji, aby wymusić ponowne przeliczenie. Kolory odświeżą się po zakończeniu."
 MAPMODE_CM_CAPITAL_FINDER_TT_SCORED: "Przewidywana maksymalna średnia [proximity|e] ze stolicą: [ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_cf_avg_value')|1]%\nMaksymalna przewidywana baza podatkowa z [proximity|e]: +[ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_cf_taxgain_value')|1]\nWynik: [ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_cf_pct_value')|0]% twojej najlepszej lokacji[ROOT.GetLocation.Custom('cm_pf_cf_status')]"
 MAPMODE_CM_CAPITAL_FINDER_TT_BEST: "Przewidywana maksymalna średnia [proximity|e] ze stolicą: [ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_cf_avg_value')|1]%\nMaksymalna przewidywana baza podatkowa z [proximity|e]: +[ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_cf_taxgain_value')|1]\nTwoja najlepsza lokacja"
 MAPMODE_CM_CAPITAL_FINDER_TT_SCORED_DEBUG: "$MAPMODE_CM_CAPITAL_FINDER_TT_SCORED$$CM_PF_DEBUG_BLOCK$"
 MAPMODE_CM_CAPITAL_FINDER_TT_BEST_DEBUG: "$MAPMODE_CM_CAPITAL_FINDER_TT_BEST$$CM_PF_DEBUG_BLOCK$"
 MAPMODE_CM_CAPITAL_FINDER_TT_SOURCE: "$MAPMODE_CM_CAPITAL_FINDER_TT_SCORED$\nIstniejące źródło bliskości: [ROOT.GetLocation.GetModifierValueFixed('local_proximity_source')|0]"
 MAPMODE_CM_CAPITAL_FINDER_TT_SOURCE_DEBUG: "$MAPMODE_CM_CAPITAL_FINDER_TT_SOURCE$$CM_PF_DEBUG_BLOCK$"
 MAPMODE_CM_CAPITAL_FINDER_TT_NO_DATA: "Nie oceniono jeszcze. Użyj przycisku odświeżania na pasku akcji, aby obliczyć wyniki dla obecnych granic."
 MAPMODE_CM_CAPITAL_FINDER_TT_SKIPPED: "Nie oceniono: ustawienie Dokładności wyszukiwania pominęło tę lokację. Ustaw je na Wyczerpujące i odśwież, aby ocenić każdą lokację."
 MAPMODE_CM_CAPITAL_FINDER_TT_SKIPPED_DEBUG: "$MAPMODE_CM_CAPITAL_FINDER_TT_SKIPPED$$CM_PF_DEBUG_BLOCK$"
 MAPMODE_CM_CAPITAL_FINDER_TT_FOREIGN: "Nie jest częścią twojego kraju."
 MAPMODE_CM_CAPITAL_FINDER_TT_WATER: "To jest lokacja wodna; punkty stolicy mają zastosowanie do twoich własnych ziem."

 mapmode_cm_capital_finder_hidden_name: "$mapmode_cm_capital_finder_name$"
 MAPMODE_CM_CAPITAL_FINDER_HIDDEN: "$MAPMODE_CM_CAPITAL_FINDER$"

