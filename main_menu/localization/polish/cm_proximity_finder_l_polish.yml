l_polish:
 mapmode_cm_governor_finder_name: "Zalecane rozmieszczenie gubernatorów"
 MAPMODE_CM_GOVERNOR_FINDER: "#T $mapmode_cm_governor_finder_name$#!\nKoloruje twoje [locations|e] według tego, ile [proximity|e] dodałby zbudowany tam nowy Lokalny Zarządca lub Zarządca Marynarki, biorąc pod uwagę bliskość, którą twoje [capital|e] i istniejące źródła już zapewniają. Im bardziej zielony, tym lepiej. Twoja stolica i istniejące źródła bliskości są paskowane.\nTo jest szacunek: ustawienie Punktacji Wyszukiwarki Lokalizacji określa, czy lokacje są rankingowane według bazy podatkowej, czy surowego [proximity|e], a ustawienia Infrastruktury Lądowej i Infrastruktury Morskiej wybierają drogi, budynki i [maritime_presence|e], które są brane pod uwagę. Przelicza się przy otwarciu tego trybu mapy, maksymalnie raz na 4 lata; użyj przycisku odświeżania na pasku akcji, aby wymusić nowe obliczenia. Kolory odświeżą się po zakończeniu."
 MAPMODE_CM_GOVERNOR_FINDER_TT_SCORED: "Przewidywany maksymalny średni zysk [proximity|e]: +[ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_gf_avg_value')|1]%\nMaksymalna przewidywana baza podatkowa uzyskana z [proximity|e]: +[ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_gf_taxgain_value')|1]\nWynik: [ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_gf_pct_value')|0]% twojej najlepszej lokacji[ROOT.GetLocation.Custom('cm_pf_gf_status')]"
 MAPMODE_CM_GOVERNOR_FINDER_TT_BEST: "Przewidywany maks. średni przyrost [proximity|e]: +[ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_gf_avg_value')|1]%\nMaksymalna przewidywana baza podatkowa z [proximity|e]: +[ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_gf_taxgain_value')|1]\nTwoja najlepsza lokacja"
 MAPMODE_CM_GOVERNOR_FINDER_TT_SCORED_DEBUG: "$MAPMODE_CM_GOVERNOR_FINDER_TT_SCORED$$CM_PF_DEBUG_BLOCK$"
 MAPMODE_CM_GOVERNOR_FINDER_TT_BEST_DEBUG: "$MAPMODE_CM_GOVERNOR_FINDER_TT_BEST$$CM_PF_DEBUG_BLOCK$"
 MAPMODE_CM_GOVERNOR_FINDER_TT_CAPITAL: "Twój [capital|e] już stąd rozprzestrzenia [proximity|e]."
 MAPMODE_CM_GOVERNOR_FINDER_TT_CAPITAL_DEBUG: "$MAPMODE_CM_GOVERNOR_FINDER_TT_CAPITAL$$CM_PF_DEBUG_BLOCK$"
 MAPMODE_CM_GOVERNOR_FINDER_TT_SOURCE: "Istniejące źródło [proximity|e]: [ROOT.GetLocation.GetModifierValueFixed('local_proximity_source')|0]\n$MAPMODE_CM_GOVERNOR_FINDER_TT_SCORED$"
 MAPMODE_CM_GOVERNOR_FINDER_TT_SOURCE_DEBUG: "$MAPMODE_CM_GOVERNOR_FINDER_TT_SOURCE$$CM_PF_DEBUG_BLOCK$"
 MAPMODE_CM_GOVERNOR_FINDER_TT_SOURCE_NOGAIN: "Istniejące źródło [proximity|e]: [ROOT.GetLocation.GetModifierValueFixed('local_proximity_source')|0]\n$MAPMODE_CM_GOVERNOR_FINDER_TT_NOGAIN$"
 MAPMODE_CM_GOVERNOR_FINDER_TT_SOURCE_NOGAIN_DEBUG: "$MAPMODE_CM_GOVERNOR_FINDER_TT_SOURCE_NOGAIN$$CM_PF_DEBUG_BLOCK$"
 MAPMODE_CM_GOVERNOR_FINDER_TT_NOGAIN: "Gubernator zapewnia maksymalnie 80 [proximity|e], a ta lokacja [ROOT.GetLocation.Custom('cm_pf_nogain_basis')], więc gubernator zbudowany tutaj nic by nie dodał."
 MAPMODE_CM_GOVERNOR_FINDER_TT_NOGAIN_DEBUG: "$MAPMODE_CM_GOVERNOR_FINDER_TT_NOGAIN$$CM_PF_DEBUG_BLOCK$"
 cm_pf_nogain_basis_current: "już ma co najmniej tyle"
 cm_pf_nogain_basis_assumed: "miałoby już co najmniej tyle przy założonej infrastrukturze"
