 cm__ab_production__ab_production_name: "$cm__ab_production_name$" # NO-TRANSLATE
 cm__ab_production_algorithm_name: "Estratégia de Construção"
 cm__ab_production_algorithm_desc: "Como a produção escolhe o que construir."
 cm__ab_production_algorithm_option_1_name: "Ganancioso"
 cm__ab_production_algorithm_option_1_desc: "Construir primeiro as opções com o retorno mais rápido, e apenas aquelas próximas ao melhor local encontrado para produzir os mesmos bens."
 cm__ab_production_max_rel_roi_name: "ROI Relativo Máximo"
 cm__ab_production_max_rel_roi_desc: "O quanto mais lento que o melhor local encontrado para produzir as mesmas mercadorias uma construção ou melhoria pode pagar o seu custo e ainda assim ser construída. A 30%, se o melhor pagar em 10 anos, apenas os que pagam em até 13 anos são construídos; qualquer um mais lento espera. A 0%, apenas o melhor produtor de cada mercadoria é construído a cada mês. A 100%+, não há limite e apenas os Anos Máximos de Retorno se aplicam. Todas as construções que produzem as mesmas mercadorias são medidas em conjunto, independentemente do tipo. Expansões de RGO são sempre construídas em ordem de retorno."
 cm__ab_production_max_rel_roi_format: "[CMMV('cm__ab_production_max_rel_roi')]%[Select_CString(GreaterThanOrEqualTo_CFixedPoint(CMMV('cm__ab_production_max_rel_roi'), CMMMapValue('cmm_max', 'cm__ab_production_max_rel_roi')), '+', '')]" # NO-TRANSLATE
 cm__ab_production_min_roi_name: "Anos Máximos de Retorno"
 cm__ab_production_min_roi_desc: "Apenas construções cuja renda tributária pague o custo de construção em até este número de anos são consideradas. Defina como 0 para desativar a verificação."
 cm__ab_production_min_roi_format: "[CMMV('cm__ab_production_min_roi')]y @efficiency!" # NO-TRANSLATE
 cm__ab_production_min_discount_name: "$cm_txt_min_discount$" # NO-TRANSLATE
 cm__ab_production_min_discount_desc: "$cm_txt_min_discount_desc$" # NO-TRANSLATE
 cm__ab_production_min_discount_format: "[CMMV('cm__ab_production_min_discount')]%" # NO-TRANSLATE
 cm__ab_production__debug_name: "$cm_txt_debug$" # NO-TRANSLATE
 cm__dbg_run_production_name: "Executar Produção"
 cm__dbg_run_production_desc: "$cm_txt_dbg_run_category_desc$" # NO-TRANSLATE
 cm__dbg_run_production_text: "$cm_txt_run_now$" # NO-TRANSLATE
 cm__ab_roads__ab_roads_name: "$cm__ab_roads_name$" # NO-TRANSLATE
 cm__ab_roads_proximity_name: "$cm_txt_proximity$" # NO-TRANSLATE
 cm__ab_roads_proximity_desc: "Construa os trechos de estrada que mais aumentam a Proximidade pelo ouro, contando cada localidade mais adiante na rota atrás deles."
 cm__ab_roads_market_access_name: "Acesso ao Mercado"
 cm__ab_roads_market_access_desc: "Constrói os trechos de estrada que mais aumentam o Acesso ao Mercado pelo ouro gasto. Só gasta em meses em que a Proximidade não construiu nada e não está economizando para um trecho que ainda não pode pagar."
 cm__ab_roads_capital_name: "Conexão com a Capital"
 cm__ab_roads_capital_desc: "Assente trechos de estrada para conectar suas localizações à sua capital, expandindo a partir daquelas já conectadas. Só gasta em meses nos quais Proximidade e Acesso ao Mercado não construíram nada e nenhum deles está economizando para um trecho que ainda não podem pagar."
 cm__ab_roads_min_discount_name: "$cm_txt_min_discount$" # NO-TRANSLATE
 cm__ab_roads_min_discount_desc: "Margem de preço máxima permitida para materiais de construção. Em -33%, só inicia a obra quando a madeira, alvenaria e areia necessárias custarem 33% abaixo do preço base. Em 0%, apenas no preço base ou abaixo. Em +33%, inicia a obra mesmo quando os preços estiverem 33% acima da base."
 cm__ab_roads_min_discount_format: "[CMMV('cm__ab_roads_min_discount')]%" # NO-TRANSLATE
 cm__ab_roads_run_now_name: "Forçar Replanejamento de Estradas"
 cm__ab_roads_run_now_desc: "Determine quais trechos de estrada assentar novamente agora, em vez de esperar que o ciclo do plano ocorra. No multijogador, esta é a única forma de processá-los. Não constrói estradas por si só; os trechos encontrados são construídos conforme o orçamento de Estradas os cobrir."
 cm__ab_roads_run_now_text: "$cm_txt_run_now$" # NO-TRANSLATE
 cm__ab_roads__debug_name: "$cm_txt_debug$" # NO-TRANSLATE
 cm__dbg_run_roads_name: "Executar Estradas"
 cm__dbg_run_roads_desc: "Ordena trechos de estrada do plano atual agora, por conta própria, em vez de esperar pela virada do mês. Ele gasta o que resta de sua cota, portanto uma categoria que já gastou no mês não constrói nada. Pausar Automação não o impede."
 cm__dbg_run_roads_text: "$cm_txt_run_now$" # NO-TRANSLATE
 cm__ab_governors__ab_governors_name: "$cm__ab_governors_name$" # NO-TRANSLATE
 cm__ab_gov_move_seats_name: "Permitir Movimentação de Governadores"
 cm__ab_gov_move_seats_desc: "Quando todos os espaços de governador estiverem cheios, remova um governador e coloque um em uma localização melhor. A localização melhor deve já ser uma Cidade ou ter uma pontuação 10% superior à do que será substituído. Com isso desativado, os governadores apenas ocuparão espaços que estejam vazios."
 cm__ab_gov_prepare_sites_name: "Permitir Preparar Novas Localizações"
 cm__ab_gov_prepare_sites_desc: "Considere locais que ainda não podem receber um governador e prepare-os primeiro, fundando uma Vila ou Cidade neles e construindo uma estrada até a sua capital. Com isso desativado, apenas locais que já são uma Cidade com uma estrada para a sua capital são considerados."
 cm__ab_governors__debug_name: "$cm_txt_debug$" # NO-TRANSLATE
 cm__dbg_run_governors_name: "Iniciar Plano do Governador"
 cm__dbg_run_governors_desc: "Inicia um novo plano agora, em vez de em seu turno habitual de vinte e cinco anos. O plano então passa por suas etapas ao longo dos meses seguintes, como sempre faz. Ainda requer paz, uma capital e que nenhuma outra busca já esteja em execução."
 cm__dbg_run_governors_text: "Iniciar"
 cm__urbanization_name: "Urbanização"
 cm__auto_urbanize_enabled_name: "$cm_txt_enabled$" # NO-TRANSLATE
 cm__auto_urbanize_enabled_desc: "Ativar ou desativar a urbanização automática."
 cm__auto_urbanize_min_discount_name: "$cm_txt_min_discount$" # NO-TRANSLATE
 cm__auto_urbanize_min_discount_desc: "Margem de preço máxima permitida para materiais de construção. Em -33%, apenas funda vilas e cidades quando os materiais custam 33% abaixo do preço base. Em 0%, apenas ao preço base ou abaixo. Em +33%, as funda mesmo quando os preços estão 33% acima do base."
 cm__auto_urbanize_min_discount_format: "[CMMV('cm__auto_urbanize_min_discount')]%" # NO-TRANSLATE
 cm__auto_urbanize__debug_name: "$cm_txt_debug$" # NO-TRANSLATE
 cm__dbg_run_auto_urbanize_name: "Executar Auto-Urbanização"
 cm__dbg_run_auto_urbanize_desc: "Executa as melhorias de nível agora, de forma independente, em vez de esperar pela virada do mês. Nada mais é construído no ciclo que ele inicia, e Pausar Automação não o impede."
 cm__dbg_run_auto_urbanize_text: "$cm_txt_run_now$" # NO-TRANSLATE
 cm__auto_town_rights__auto_town_rights_specialization_name: "Concedente do Direito de Especialização Inteligente"
 cm__auto_town_rights__auto_town_rights_specialization_desc: "Concedido após o Concedente de Direitos Personalizados ter tido sua vez."
 cm__auto_grant_specialization_name: "Auto-conceder Direitos Urbanos de Especialização"
 cm__auto_grant_specialization_desc: "Conceder um direito de especialização por localidade, escolhendo o de maior valor em ouro entre os que se adequam às mercadorias produzidas ao redor."
 cm__specialization_window_name: "Limiar de Adequação"
 cm__specialization_window_desc: "Quão bem um direito de especialização deve se adequar a um local, em comparação ao direito mais adequado lá, para estar na disputa. A 50%, qualquer direito que se adeque a ele pelo menos metade tão bem está na disputa, e aquele que vale mais ouro é concedido. A 100%, apenas o direito mais adequado é concedido."
 cm__specialization_window_format: "[CMMV('cm__specialization_window')]%" # NO-TRANSLATE
 cm__specialization_expand_name: "Expandir as Indústrias Impulsionadas"
 cm__specialization_expand_desc: "Quando um direito de especialização for concedido, também ativa a autoexpansão naquela localidade para as indústrias que o direito impulsiona e para suas matérias-primas onde a localidade as produz. O mesmo que clicar com o botão direito em um botão de concessão no mapa de Direitos Urbanos Recomendados."
 cm__auto_town_rights__debug_name: "$cm_txt_debug$" # NO-TRANSLATE
 cm__dbg_run_town_rights_name: "Executar Concessão Automática de Direitos Urbanos"
 cm__dbg_run_town_rights_desc: "Concede agora em vez de esperar a virada do mês, processando a lista habilitada primeiro e depois os direitos de especialização. Pausar Automação não o impede."
 cm__dbg_run_town_rights_text: "$cm_txt_run_now$" # NO-TRANSLATE
 cm__miscellaneous_name: "Diversos"
 cm__cleanup_name: "Limpeza de Construções"
 cm__cleanup__cleanup_name: "$cm__cleanup_name$" # NO-TRANSLATE
 cm__cleanup_close_open_name: "Fechar e Abrir Edifícios"
 cm__cleanup_close_open_desc: "Uma vez por ano, fecha edifícios de produção que pararam de gerar lucro e não são subsidiados. Edifícios fechados reabrem assim que o tipo voltar a lucrar naquele mercado. @farming_village! [ShowBuildingTypeNameWithNoTooltip('farming_village')] e @market_village! [ShowBuildingTypeNameWithNoTooltip('market_village')] nunca são fechados."
 cm__cleanup_destroy_name: "Destruir Edifícios"
 cm__cleanup_destroy_desc: "Uma vez por ano, destrói edifícios de produção que deixaram de dar lucro onde o local está dentro de dez níveis dos níveis de edifício que suporta, junto com os que já estão fechados e cujo local, desde então, ficou sem espaço. Um @market_village! [ShowBuildingTypeNameWithNoTooltip('market_village')] é reduzido a apenas um nível. @fruit_orchard! [ShowBuildingTypeNameWithNoTooltip('fruit_orchard')] é destruído e nunca mais reconstruído, não importa o quanto lucre, e @farming_village! [ShowBuildingTypeNameWithNoTooltip('farming_village')] nunca é destruído."
 cm__cleanup_min_profit_name: "Lucro Mínimo por Nível"
 cm__cleanup_min_profit_desc: "Um edifício que renda menos do que isto por nível a cada mês é considerado como não valendo a pena operar e será fechado ou destruído, a menos que seja subsidiado."
 cm__cleanup_min_profit_format: "[Divide_CFixedPoint(CMMV('cm__cleanup_min_profit'), '(CFixedPoint)100')|2]@gold!" # NO-TRANSLATE
 cm__cleanup_max_changed_name: "Máximo Alterado por Passagem"
 cm__cleanup_max_changed_desc: "A proporção de edifícios de um tipo de edifício em um mercado que pode mudar em uma passagem anual. Em 50%, metade de seus edifícios abertos pode ser fechada ou destruída, e metade dos fechados reaberta. Nunca menos de um, para que o último edifício de um tipo ainda possa ser fechado."
 cm__cleanup_max_changed_format: "[CMMV('cm__cleanup_max_changed')]%" # NO-TRANSLATE
 cm__cleanup_core_goods_name: "Priorizar Materiais de Construção"
 cm__cleanup_core_goods_desc: "Manter as edificações que consomem principalmente @masonry![ShowGoodsNameWithNoTooltip('masonry')], @lumber![ShowGoodsNameWithNoTooltip('lumber')], @sand![ShowGoodsNameWithNoTooltip('sand')] ou @glass![ShowGoodsNameWithNoTooltip('glass')] no dobro do Lucro Mínimo por Nível, ou 0,1@gold! por nível, o que for maior. Edificações que produzem um dos quatro nunca são fechadas ou destruídas enquanto isto estiver ativado."
 cm__cleanup_auto_food_name: "Limpar Locais de Alimento Automático"
 cm__cleanup_auto_food_desc: "Onde o auto-alimento estiver ativo e qualquer tipo de trabalhador já estiver em falta, destrua os edifícios de produção que não produzem alimentos. Um @market_village! [ShowBuildingTypeNameWithNoTooltip('market_village')] é reduzido a um nível em vez de ser destruído."
 cm__cleanup_run_now_name: "Executar Limpeza de Edifícios"
 cm__cleanup_run_now_desc: "Executar a limpeza agora em vez de esperar pela verificação anual."
 cm__cleanup_run_now_text: "$cm_txt_run_now$" # NO-TRANSLATE
 cm__placement_finder_method_option_3_name: "População"
 cm__placement_finder_method_option_3_desc: "Classificar por quanta proximidade um governador ou capital posicionado ali adicionaria, contando cada localidade pelas pessoas que vivem nela. Um ganho pequeno em uma população grande vale menos do que um ganho grande em uma pequena."
 cm__log_production_name: "$cm__ab_production_name$" # NO-TRANSLATE
 cm__log_production_desc: "Linhas para cada edifício que a categoria de Produção enfileira e cada expansão de matérias-primas que ela considera, com o retorno e a renda por trás de cada um."
 cm__log_core_name: "$cm__ab_core_name$" # NO-TRANSLATE
 cm__log_core_desc: "Linhas acompanhando um local através de um ciclo de Bens Essenciais: a escassez do mercado e os níveis solicitados, depois o que foi dado a esse local, pontuado e construído. Marque o local primeiro com o comando de console effect location:<key> = { cm_ab_core_watch_on = yes }."
 cm__debug__rotation_name: "Rotação de Mercado"
 cm__debug__rotation_desc: "Um país grande processa seus mercados alguns por vez, e cada automação constrói no conjunto em que se encontra."
 cm__dbg_rotate_slice_name: "Alternar Mercados"
 cm__dbg_rotate_slice_desc: "Avança para o próximo conjunto de mercados. Uma execução iniciada a partir de um dos botões Executar Agora permanece no conjunto que encontrar, portanto, é isso que a faz avançar enquanto o jogo está pausado."
 cm__dbg_rotate_slice_text: "Girar"
 cm__probe_production_anchors_name: "Âncoras de Produção"
 cm__probe_production_anchors_desc: "Uma linha por mercadoria com o melhor retorno que a Produção registrou para ela e o limite de retorno definido, nomeando o edifício e o local de cada um."
 cm__probe_production_anchors_text: "$cm_txt_run$" # NO-TRANSLATE
 cm__probe_production_rgo_name: "Produção de Matérias-primas"
 cm__probe_production_rgo_desc: "Uma linha para cada motivo pelo qual a Produção ignorou as matérias-primas de um local, ou uma única linha se não ignorou nenhuma. Lê a capital, a menos que você marque um local com o comando de console effect location:<key> = { cm_ab_core_watch_on = yes }."
 cm__probe_production_rgo_text: "$cm_txt_run$" # NO-TRANSLATE
 cm__probe_core_name: "$cm__ab_core_name$" # NO-TRANSLATE
 cm__probe_core_desc: "Cada número que o Core Goods lê em um local, cada um ao lado da própria leitura do jogo, seguido pelo que o mercado desse local poderia absorver em um ciclo. Lê a capital, a menos que você marque um local com o comando de console effect location:<key> = { cm_ab_core_watch_on = yes }; a capital nunca é uma candidata a Core Goods, então marque um local para ler um em que ela construiria."
 cm__probe_core_text: "$cm_txt_run$" # NO-TRANSLATE
 cm__probe_setup_name: "$cm_txt_setup_data$" # NO-TRANSLATE
 cm__probe_setup_desc: "Quais dados de mapa o save contém e a versão em que cada um foi processado, e se esta máquina tem permissão para processar qualquer um deles. Uma versão 0 significa que tal dado ainda não foi processado e o será no próximo carregamento."
 cm__probe_setup_text: "$cm_txt_run$" # NO-TRANSLATE
 cm__debug__setup_name: "$cm_txt_setup_data$" # NO-TRANSLATE
 cm__debug__setup_desc: "Os dados do mapa que o mod processa uma vez e depois lê pelo resto do jogo."
 cm__dbg_rebuild_setup_name: "Reconstruir Dados de Configuração"
 cm__dbg_rebuild_setup_desc: "Processa os dados do mapa novamente: as matérias-primas por trás dos filtros de Bônus de R.G.O., a cobertura da indústria por trás dos Direitos Urbanos Recomendados, as pontuações por trás de $mapmode_cm_location_food_potential_name$, as travessias de rio pelas quais os localizadores de posicionamento passam e quais edifícios evoluem para quais. Leva alguns segundos e o jogo continua rodando enquanto isso."
 cm__dbg_rebuild_setup_text: "Reconstruir"
