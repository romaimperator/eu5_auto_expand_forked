 cm__expand_metric_option_3_name: "@efficiency! ROI (Imposto)"
 cm__expand_metric_option_3_desc: "Adiciona um novo nível apenas quando a receita tributária recuperar o custo de construção dentro do limite de Anos Máximos de ROI definido."
 cm__expand_metric_option_4_name: "@efficiency! ROI (Lucro)"
 cm__expand_metric_option_4_desc: "Adicionar um novo nível apenas quando o lucro recuperar o custo de construção dentro do limite definido de Anos de ROI Máximo."
 cm__auto_town_rights_list_i32_name: "@market_charter! [ShowTownRightsName('market_charter')]"
 cm__auto_town_rights_list_i33_name: "@free_town_charter! [ShowTownRightsName('free_town_charter')]"
 cm__auto_town_rights_list_i34_name: "@fortress_town! [ShowTownRightsName('fortress_town')]"
 cm__auto_town_rights_list_i35_name: "@mining_charter! [ShowTownRightsName('mining_charter')]"
 cm__auto_town_rights_list_i36_name: "@studium_privileges! [ShowTownRightsName('studium_privileges')]"
 cm__auto_town_rights_list_i37_name: "@agrarian_community_town_right! [ShowTownRightsName('agrarian_community_town_right')]"
 cm__auto_town_rights_list_i38_name: "@enlightened_leadership_reform_town_right! [ShowTownRightsName('enlightened_leadership_reform_town_right')]"
 cm__expand_metric: "cm__expand_metric"
 cm__auto_build_list__min_control_postfix: "%"
 cm__auto_build_list__min_discount_postfix: "%"
 cm__town_rights_free_grants_name: "Remover Custos de Direitos Urbanos"
 cm__town_rights_free_grants_desc: "Quando ativado, conceder direitos urbanos não custa poder de governo e revogá-los não custa estabilidade."
 cm__town_rights_min_gov_power_name: "Poder de Governo Mínimo"
 cm__town_rights_min_gov_power_desc: "A concessão automática para de conceder direitos urbanos quando a próxima concessão reduziria seu poder de governo (legitimidade, tradição republicana, devoção ou unidade de horda, dependendo do tipo de governo) abaixo deste valor."
 cm__allowed_building_overbuild_levels_format: "[CMMV('cm__allowed_building_overbuild_levels')][Select_CString(GreaterThanOrEqualTo_CFixedPoint(CMMV('cm__allowed_building_overbuild_levels'), CMMMapValue('cmm_max', 'cm__allowed_building_overbuild_levels')), '+', '')]"
 cm__auto_build_capital_name: "Edifícios da Capital"
 cm__auto_build_capital_desc: "Constrói automaticamente edifícios exclusivos da capital (corte real, suprema corte, academia de guerra, etc.) na localização da sua capital quando as condições permitirem. Estes são construídos antes da lista abaixo."
 cm__urbanize_city_to_megalopolis_name: "Cidade para Megalópole"
 cm__urbanize_city_to_megalopolis_desc: "Melhore sua capital para uma megalópole assim que ela for uma cidade centro de mercado com pelo menos 400.000 de população."
 cm__megalopolis_ignore_capital_name: "Megalópole: Ignorar Requisito de Capital"
 cm__megalopolis_ignore_capital_desc: "Permite construir a Fundar Megalópole em uma cidade que não seja sua capital."
 cm__megalopolis_ignore_market_center_name: "Megalópole: Ignorar Requisito de Centro de Mercado"
 cm__megalopolis_ignore_market_center_desc: "Permite que você construa Fundar Megalópole em uma cidade que não seja um centro de mercado."
 cm__deurbanize_name: "Desurbanizar"
 cm__deurbanize_desc: "A cada mês, reverte as localizações sob seu controle para assentamentos rurais quando a mercadoria de RGO estiver marcada na lista \"Não Urbanizar\" abaixo. Sua capital, localizações conquistadas e localizações que fornecem Proximidade, como sedes de governador, não são afetadas."
 cm__auto_urbanize_ignore_list_i20_name: "@wool! [ShowGoodsName('wool')] ([GetGlobalVariable('cm_goods_wool').GetGoods.GetDefaultMarketPrice]@gold!)"
 cm__full_automation_name: "Automação Completa"
 cm__full_automation__full_automation_name: "Automação Total"
 cm__full_automation__full_automation_desc: "Construção automática. Todos os meses, as categorias abaixo gastam o tesouro acima da Reserva de Ouro nas melhores construções disponíveis. Funciona em conjunto com os outros recursos de automação sem alterar suas configurações."
 cm__fa_enabled_name: "Ativar Automação Total"
 cm__fa_enabled_desc: "Ativar ou desativar a automação total."
 cm__fa_reserve_name: "Reserva de Ouro"
 cm__fa_reserve_desc: "A automação total nunca gasta seu tesouro abaixo desta quantia. Separado da Reserva de Ouro na aba de Configurações."
 cm__fa_reserve_format: "[CMMV('cm__fa_reserve')]@gold!"
 cm__fa_save_unaffordable_name: "Economizar para Edificações Inacessíveis"
 cm__fa_save_unaffordable_desc: "Uma categoria compra a melhor construção que encontrar, mesmo quando custa mais do que a sua cota para o mês, e depois fica sem fundos até que os meses seguintes compensem a diferença. Quando desativado, cada categoria gasta o que pode e passa o restante adiante."
 cm__full_automation__fa_priority_list_name: "Prioridades"
 cm__full_automation__fa_priority_list_desc: "Arraste para reordenar. As categorias são processadas de cima para baixo a cada mês. Se duas categorias desejarem o mesmo edifício, a que estiver acima o constrói."
 cm__fa_priority_list_item_column_name: "Categoria"
 cm__fa_priority_list_i1_name: "Alimento"
 cm__fa_priority_list_i1_desc: "Monitora o suprimento de comida ao longo do ano em mercados cujo centro de mercado você possui e, nos casos em que o mês mediano foi insuficiente, habilita o auto-alimento nos locais com o maior potencial de comida. Os locais escolhidos brilham como aqueles habilitados pelo jogador, mas o controle continua sendo seu; eles nunca são desligados, a menos que o local deixe de ser um assentamento rural de sua propriedade ou você não possua mais o seu centro de mercado."
 cm__fa_priority_list_i2_name: "Indústria"
 cm__fa_priority_list_i2_desc: "Constrói, expande e aprimora os edifícios de produção e RGOs que recuperam seu custo mais rapidamente em receita tributária. Locais que operam auto-food são ignorados enquanto qualquer tipo de trabalhador já estiver em falta."
 cm__fa_priority_list_i3_name: "Colapsador de Preços"
 cm__fa_priority_list_i3_desc: "Expande a produção de materiais de construção para reduzir seus preços. Funciona em mercados nos quais você possui o centro de mercado. As localizações com melhor produção vêm primeiro e cada uma recebe vários níveis de uma só vez, e os produtores começam mesmo onde os trabalhadores ainda não chegaram. Sua capital, localizações que produzem alimentos e produtores que operariam com prejuízo sem um subsídio são todos ignorados."
 cm__fa_priority_list_i4_name: "Estradas"
 cm__fa_priority_list_i4_desc: "Constrói a rede de estradas com o melhor custo-benefício em ouro, através de três benefícios que uma estrada proporciona: Proximidade, Acesso ao Mercado e a conexão de um local à sua capital. Uma vez por ano, calcula a melhor rota para cada local de sua propriedade para cada um deles; então, a cada mês, inicia os trechos que mais aumentariam a Base de Impostos, contabilizando tudo o que estiver adiante na rota atrás deles. Corredores planos e baratos são priorizados, e os dois critérios inferiores só recebem ouro em meses nos quais o critério superior não tiver mais nada para construir."
 cm__fa_priority_list_i5_name: "Utilidades"
 cm__fa_priority_list_i5_desc: "Constrói infraestrutura de apoio em todos os lugares onde couber: edifícios da capital, a lista de construção automática, pátios de mercúrio, edifícios de centro de mercado, meirinhos e quaisquer edifícios únicos que seu país possua que aumentem o controle, mercados, edifícios de resistência a doenças e, por fim, celeiros. Edifícios de controle vão para os locais mais ricos primeiro, e mercados para os locais com o menor acesso ao mercado primeiro."
 cm__fa_priority_list_i6_name: "Limpeza de Edifícios"
 cm__fa_priority_list_i6_desc: "Uma vez por ano, fecha edifícios de produção que deixaram de ser lucrativos e não são subsidiados, destruindo-os em vez disso caso o local esteja dentro de dez níveis dos níveis de edifício que suporta. Edifícios fechados reabrem assim que o tipo voltar a lucrar naquele mercado e são destruídos posteriormente se o local ficar sem espaço. @farming_village! [ShowBuildingTypeNameWithNoTooltip('farming_village')] nunca é fechado ou destruído."
 cm__fa_priority_list_i7_name: "Governadores"
 cm__fa_priority_list_i7_desc: "Planeja onde seus governadores devem ficar e os coloca lá, priorizando a melhor localização primeiro. Planeja novamente sempre que uma vaga de governador for aberta e, de outra forma, a cada vinte e cinco anos. Apenas single-player."
 cm__fa_priority_list_i8_name: "Direitos Urbanos"
 cm__fa_priority_list_i8_desc: "Concede direitos urbanos em suas vilas e cidades. [ShowTownRightsNameWithNoTooltip('granary_town')] vem primeiro, depois um direito de especialização, sorteado aleatoriamente entre aqueles que se adequam aos bens produzidos nos arredores do local."
 cm__fa_priority_list__budget_name: "Parcela do Orçamento"
 cm__fa_priority_list__budget_desc: "A parcela do tesouro acima da Reserva de Ouro que esta categoria pode gastar mensalmente."
 cm__fa_priority_list__budget_postfix: "%"
 cm__fa_priority_list__enabled_name: "Ativado"
 cm__fa_priority_list__enabled_desc: "Permitir a construção desta categoria."
 cm__full_automation__fa_industry_name: "Indústria"
 cm__full_automation__fa_industry_desc: "Configurações para a categoria de Indústria acima."
 cm__fa_industry_algorithm_name: "Estratégia de Construção"
 cm__fa_industry_algorithm_desc: "Como a indústria escolhe o que construir."
 cm__fa_industry_algorithm_option_1_name: "Ganancioso"
 cm__fa_industry_algorithm_option_1_desc: "Construa primeiro as opções com o retorno mais rápido e apenas aquelas próximas ao melhor local encontrado para produzir os mesmos bens."
 cm__fa_industry_max_rel_roi_name: "ROI Relativo Máximo"
 cm__fa_industry_max_rel_roi_desc: "O quanto mais lento do que o melhor local encontrado para produzir os mesmos bens um edifício ou melhoria pode pagar seu custo e ainda assim ser construído. A 30%, se o melhor se paga em 10 anos, apenas aqueles que se pagam em até 13 anos são construídos; qualquer um mais lento aguarda. A 0%, apenas o melhor produtor de cada mercadoria é construído a cada mês. A 100%+, não há limite e apenas os Anos Máximos de Retorno se aplicam. Todos os edifícios que produzem as mesmas mercadorias são avaliados juntos, não importa o tipo. Expansões de RGO são sempre construídas em ordem de retorno."
 cm__fa_industry_max_rel_roi_format: "[CMMV('cm__fa_industry_max_rel_roi')]%[Select_CString(GreaterThanOrEqualTo_CFixedPoint(CMMV('cm__fa_industry_max_rel_roi'), CMMMapValue('cmm_max', 'cm__fa_industry_max_rel_roi')), '+', '')]"
 cm__fa_industry_min_roi_name: "Anos Máximos de Retorno"
 cm__fa_industry_min_roi_desc: "Apenas construções cuja renda tributária recupere o custo de construção dentro deste número de anos são consideradas. Defina como 0 para desativar a verificação."
 cm__fa_industry_min_roi_format: "[CMMV('cm__fa_industry_min_roi')] e @efficiency!"
 cm__full_automation__fa_collapsar_name: "Colapsar de Preços"
 cm__full_automation__fa_collapsar_desc: "Configurações para a categoria Price Collapsar acima. Os materiais são processados do topo da lista para baixo, com as RGOs expandidas antes dos edifícios de produção."
 cm__fa_collapsar_target_name: "Preço Alvo"
 cm__fa_collapsar_target_desc: "O preço no qual a construção de um material para, em relação ao seu preço base. A -33%, os produtores são construídos até que o material seja comercializado 33% abaixo do preço base. A 0%, até atingir o preço base. A +33%, apenas enquanto custar mais de 33% acima do preço base."
 cm__fa_collapsar_target_format: "[CMMV('cm__fa_collapsar_target')]%"
 cm__fa_collapsar_item_column_name: "Material"
 cm__fa_collapsar_i1_name: "@masonry! [ShowGoodsName('masonry')]"
 cm__fa_collapsar_i2_name: "@lumber! [ShowGoodsName('lumber')]"
 cm__fa_collapsar_i3_name: "@sand! [ShowGoodsName('sand')]"
 cm__fa_collapsar_i4_name: "@glass! [ShowGoodsName('glass')]"
 cm__fa_collapsar__enabled_name: "Ativado"
 cm__fa_collapsar__enabled_desc: "Trabalhe para reduzir o preço deste material."
 cm__full_automation__fa_food_name: "Alimento"
 cm__full_automation__fa_food_desc: "Configurações para a categoria de Alimentos acima."
 cm__fa_food_target_name: "Meta de Excedente"
 cm__fa_food_target_desc: "Um mercado recebe mais locais de produção de alimentos até que sua oferta atinja esta proporção de sua demanda. A 125%, a produção de alimentos é expandida em qualquer mercado cujo mês mediano do ano não atingiu um excedente de 25%. Aumente para manter uma margem de segurança maior, diminua para ajudar apenas mercados mais próximos de uma escassez."
 cm__fa_food_target_format: "[CMMV('cm__fa_food_target')]%"
 cm__fa_food_min_potential_name: "Potencial Mínimo de Comida"
 cm__fa_food_min_potential_desc: "O auto-alimento só é habilitado em localidades cujo potencial de alimento por nível de RGO atinja esta pontuação, a mesma pontuação que o modo de mapa $mapmode_cm_location_food_potential_name$ exibe. Aumente para priorizar terras agrícolas melhores, diminua para aceitar terras mais fracas."
 cm__fa_food_min_potential_format: "[CMMV('cm__fa_food_min_potential')]"
 cm__full_automation__fa_urban_rights_name: "Direitos Urbanos"
 cm__full_automation__fa_urban_rights_desc: "Configurações para a categoria de Direitos Urbanos acima."
 cm__fa_urban_rights_window_name: "Limiar de Adequação"
 cm__fa_urban_rights_window_desc: "O quão bem um direito de especialização deve se adequar a uma localidade, em relação ao direito mais adequado nela, para estar na disputa. A 50%, qualquer direito que se adeque ao menos metade disso pode ser selecionado, e os mais adequados são selecionados com mais frequência. A 100%, apenas o direito mais adequado é concedido."
 cm__fa_urban_rights_window_format: "[CMMV('cm__fa_urban_rights_window')]%"
 cm__fa_urban_rights_reserve_name: "Reserva de Poder do Governo"
 cm__fa_urban_rights_reserve_desc: "Nenhum direito urbano é concedido quando pagá-lo faria seu poder governamental (legitimidade, tradição republicana, devoção ou unidade da horda, dependendo do tipo de governo) cair abaixo deste valor."
 cm__fa_urban_rights_expand_name: "Expandir as Indústrias Impulsionadas"
 cm__fa_urban_rights_expand_desc: "Quando um direito de especialização for concedido, também ativa a expansão automática nessa localidade para as indústrias que o direito impulsiona e para as suas matérias-primas onde a localidade as produz. O mesmo que clicar com o botão direito em um botão de concessão no mapa de Direitos Urbanos Recomendados."
 cm__full_automation__fa_cleanup_name: "Limpeza de Construções"
 cm__full_automation__fa_cleanup_desc: "Configurações para a categoria de Limpeza de Construções acima."
 cm__fa_cleanup_min_profit_name: "Lucro Mínimo"
 cm__fa_cleanup_min_profit_desc: "Uma construção que renda menos que este valor por mês é considerada não rentável e será fechada ou destruída, a menos que seja subsidiada. No máximo, metade das construções abertas de um mesmo tipo em um mercado são afetadas de uma só vez."
 cm__fa_cleanup_min_profit_format: "[Divide_CFixedPoint(CMMV('cm__fa_cleanup_min_profit'), '(CFixedPoint)100')|2]@gold!"
 cm__fa_cleanup_core_goods_name: "Priorizar Materiais de Construção"
 cm__fa_cleanup_core_goods_desc: "Manter as construções que consomem majoritariamente @masonry![ShowGoodsNameWithNoTooltip('masonry')], @lumber![ShowGoodsNameWithNoTooltip('lumber')], @sand![ShowGoodsNameWithNoTooltip('sand')] ou @glass![ShowGoodsNameWithNoTooltip('glass')] no dobro do Lucro Mínimo, ou 0.1@gold!, o que for maior. Construções que produzem um dos quatro são avaliadas pelo Lucro Mínimo normal."
 cm__fa_cleanup_auto_food_name: "Limpar Locais de Auto-Alimentação"
 cm__fa_cleanup_auto_food_desc: "Onde a auto-alimentação está ativa e qualquer tipo de trabalhador já está em falta, destrua os edifícios de produção que não produzem comida. Um @market_village! [ShowBuildingTypeNameWithNoTooltip('market_village')] é reduzido a um nível em vez de ser destruído."
 cm__full_automation__fa_roads_name: "Estradas"
 cm__full_automation__fa_roads_desc: "Configurações para a categoria de Estradas acima."
 cm__fa_roads_proximity_name: "Proximidade"
 cm__fa_roads_proximity_desc: "Construa os trechos de estrada que mais aumentam a Proximidade pelo ouro, contando cada localidade mais adiante na rota atrás deles."
 cm__fa_roads_market_access_name: "Acesso ao Mercado"
 cm__fa_roads_market_access_desc: "Constrói os trechos de estrada que mais aumentam o Acesso ao Mercado pelo ouro. Só gasta em meses nos quais não houver mais trechos de Proximidade para construir."
 cm__fa_roads_capital_name: "Conexão com a Capital"
 cm__fa_roads_capital_desc: "Constrói trechos de estrada para conectar suas localidades à sua capital, expandindo a partir das que já estão conectadas. Só gasta em um mês se não restarem trechos de Proximidade e Acesso ao Mercado para construir."
 cm__full_automation__fa_governors_name: "Governadores"
 cm__full_automation__fa_governors_desc: "Configurações para a categoria Governadores acima."
 cm__fa_gov_move_seats_name: "Permitir Mover Governadores"
 cm__fa_gov_move_seats_desc: "Quando todos os espaços de governador estiverem ocupados, remova um governador e coloque um em um local melhor. O local melhor deve já ser uma Cidade ou ter uma pontuação 10% superior ao que ele substitui. Com isso desativado, os governadores só ocuparão espaços vazios."
 cm__fa_gov_prepare_sites_name: "Permitir a Preparação de Novas Localizações"
 cm__fa_gov_prepare_sites_desc: "Considere locais que ainda não podem receber um governador e prepare-os primeiro, fundando uma Vila ou Cidade neles e construindo uma estrada até a sua capital. Com isso desativado, apenas locais que já são uma Cidade com uma estrada até a sua capital são considerados."
 cm__map_modes_name: "Modos de Mapa"
 cm__map_modes__placement_finder_name: "Capital e Localização do Governador Recomendadas"
 cm__map_modes__placement_finder_desc: "Configurações para os modos de mapa de Governador Recomendado e de Posicionamento de Capital Recomendado."
 cm__placement_finder_method_name: "Pontuação do Localizador de Posicionamento"
 cm__placement_finder_method_desc: "Como os modos de mapa Governador Recomendado e Capital Recomendada classificam suas localizações."
 cm__placement_finder_method_option_1_name: "Base Tributária"
 cm__placement_finder_method_option_1_desc: "Classificar por quanto um governador ou capital posicionado lá aumentaria sua base tributária total. Locais mais ricos contam mais."
 cm__placement_finder_method_option_2_name: "Proximidade"
 cm__placement_finder_method_option_2_desc: "Classificar por quanta proximidade um governador ou capital colocado ali adicionaria."
 cm__placement_finder_roads_name: "Infraestrutura Terrestre"
 cm__placement_finder_roads_desc: "Se os modos de mapa de Governador Recomendado e Capital Recomendada presumem uma infraestrutura terrestre ideal ou usam o que você realmente construiu."
 cm__placement_finder_roads_option_1_name: "Atual"
 cm__placement_finder_roads_option_1_desc: "Use as estradas que você realmente construiu."
 cm__placement_finder_roads_option_2_name: "Máximo de Estradas"
 cm__placement_finder_roads_option_2_desc: "Considere que a melhor estrada que você desbloqueou está construída em todas as conexões."
 cm__placement_finder_roads_option_3_name: "Melhor Possível"
 cm__placement_finder_roads_option_3_desc: "Assuma que a melhor estrada que você desbloqueou está construída em todas as conexões, e que todos os edifícios desbloqueados que melhoram a proximidade terrestre estão construídos onde forem elegíveis."
 cm__placement_finder_naval_name: "Infraestrutura Naval"
 cm__placement_finder_naval_desc: "Se os modos de mapa de Governador Recomendado e Capital Recomendada pressupõem uma infraestrutura naval ideal ou usam sua capacidade portuária e presença naval atuais."
 cm__placement_finder_naval_option_1_name: "Atual"
 cm__placement_finder_naval_option_1_desc: "Usa a sua capacidade portuária e presença naval atuais."
 cm__placement_finder_naval_option_2_name: "Presença Máxima"
 cm__placement_finder_naval_option_2_desc: "Assumir presença naval total em todos os lugares, com sua capacidade portuária atual."
 cm__placement_finder_naval_option_3_name: "Melhor Possível"
 cm__placement_finder_naval_option_3_desc: "Presuma presença naval total e os melhores edifícios portuários que você desbloqueou, construídos em todas as localizações costeiras."
 cm__placement_finder_accuracy_name: "Precisão da Busca"
 cm__placement_finder_accuracy_desc: "O quão minuciosamente os modos de mapa Governador Recomendado e Capital Recomendada buscam pelos melhores locais. Locais ignorados aparecem em preto."
 cm__placement_finder_accuracy_option_1_name: "Exaustivo"
 cm__placement_finder_accuracy_option_1_desc: "Avaliar todos os locais. O mais preciso e o mais lento."
 cm__placement_finder_accuracy_option_2_name: "Minucioso"
 cm__placement_finder_accuracy_option_2_desc: "Pule locais que não podem se classificar entre os seus três melhores. Os três melhores e suas pontuações são idênticos ao modo Exaustivo, apenas mais rápido."
 cm__placement_finder_accuracy_option_3_name: "Equilibrado"
 cm__placement_finder_accuracy_option_3_desc: "Pular locais que não podem ser o melhor absoluto. O melhor local ainda é garantido como exato; os marcadores de 2º e 3º lugar podem ocasionalmente diferir."
 cm__placement_finder_accuracy_option_4_name: "Rápido"
 cm__placement_finder_accuracy_option_4_desc: "Também ignora locais com pouca probabilidade de serem os melhores. O melhor local encontrado fica dentro de 20% do melhor real e geralmente ainda é exato."
 cm__placement_finder_accuracy_option_5_name: "Mais Rápido"
 cm__placement_finder_accuracy_option_5_desc: "Avalia o local mais promissor de cada província e, em seguida, refina em torno dos líderes. Muito mais rápido para países grandes; pode perder a melhor localização."
 cm__debug_name: "Debug"
 cm__debug__logging_name: "Registro de Ações"
 cm__debug__logging_desc: "Quais das ações deste mod são registradas no log de ações do mod."
 cm__log_cycle_name: "Ciclo de Construção"
 cm__log_cycle_desc: "Linhas para um ciclo mensal que foi ignorado porque o anterior ainda estava em processamento, e para a redefinição que segue dois saltos consecutivos."
 cm__log_industry_name: "Indústria"
 cm__log_industry_desc: "Linhas para cada edifício que a categoria de Indústria enfileira e cada expansão de matérias-primas que ela considera, com o retorno e a renda por trás de cada um."
 cm__log_collapsar_name: "Colapsador de Preços"
 cm__log_collapsar_desc: "Linhas acompanhando uma localização através de um ciclo de Colapso de Preços: o déficit do mercado e os níveis solicitados, seguido pelo que foi dado a essa localização, pontuado e construído. Marque a localização primeiro com o comando de console effect location:<key> = { cm_fa_col_watch_on = yes }."
 cm__log_food_name: "Auto-Alimento"
 cm__log_food_desc: "Linhas para a categoria de Alimentos: a oferta, demanda e proporção mensal de alimentos de cada mercado, a mediana anual pela qual essa proporção é julgada em relação à meta, a contagem de localizações que já produzem alimentos lá e cada localização que ela ativa ou desativa."
 cm__log_roads_name: "Estradas"
 cm__log_roads_desc: "Uma linha para cada estrada que a categoria Estradas ordena, nomeando a localização, por qual dos três motivos a estrada foi comprada e quanto custou."
 cm__log_cleanup_name: "Limpeza de Edifícios"
 cm__log_cleanup_desc: "Linhas para a etapa anual de Limpeza de Edifícios e para cada edifício que ela fecha, reduz, destrói ou reabre, com o lucro de cada um e o limite mínimo contra o qual foi julgado."
 cm__log_governors_name: "Governadores"
 cm__log_governors_desc: "Linhas para o plano do governador: locais selecionados e descartados, melhorias de vilas e cidades, posicionamentos, relocações e recusas, além da mudança de capital de uma nação sortuda."
 cm__log_military_name: "Militar da Nação Sortuda"
 cm__log_military_desc: "Linhas para uma nação sortuda destruindo fortes e construindo edifícios de reserva militar."
 cm__log_government_name: "Governo de Nação Sortuda"
 cm__log_government_desc: "Linhas para uma nação sortuda removendo uma burocracia ou realizando uma ação de estamento."
 cm__debug__diagnostics_name: "Diagnósticos"
 cm__placement_finder_debug_path_name: "Ativar Diagnósticos de Depuração"
 cm__placement_finder_debug_path_desc: "Adiciona um bloco de diagnóstico às dicas de interface dos modos de mapa de Governador Recomendado e Capital Recomendada: a rota prevista da sua capital para cada localidade com o custo de cada salto, e a proximidade prevista comparada à sua proximidade atual."
 cm__debug__probes_name: "Sondas"
 cm__debug__probes_desc: "Diagnósticos pontuais gravados no log de ações do mod."
 cm__probe_budget_name: "Orçamento de Automação Total"
 cm__probe_budget_desc: "O saldo de cada categoria de Automação Total, positivo quando retém ouro para uma escolha que ainda não pode pagar e negativo quando deve por gastos excessivos, com o limite de retorno da Indústria e o melhor candidato à espera em um mercado ignorado neste ciclo."
 cm__probe_budget_text: "Executar"
 cm__probe_governors_name: "Plano do Governador"
 cm__probe_governors_desc: "O estágio atual do plano do governador: sua fase, quantos locais ele possui e ainda restam para posicionar, se ele está retendo o tesouro, os governadores pagos, e os espaços e assentos contra os quais está trabalhando."
 cm__probe_governors_text: "Executar"
 cm__probe_military_name: "Militar de Nação Sortuda"
 cm__probe_military_desc: "O nível de construção de reserva militar em que o país se encontra, se ele pode construí-lo, o estado do par da capital, o orçamento militar e quantas localidades podem receber o nível em relação a quantas já o possuem."
 cm__probe_military_text: "Executar"
 cm__probe_industry_anchors_name: "Âncoras Industriais"
 cm__probe_industry_anchors_desc: "Uma linha por mercadoria com o melhor retorno registrado pela Indústria e o limite de retorno definido, nomeando o edifício e o local de cada uma."
 cm__probe_industry_anchors_text: "Executar"
 cm__probe_industry_rgo_name: "Matérias-primas Industriais"
 cm__probe_industry_rgo_desc: "Uma linha para cada motivo pelo qual a Indústria ignorou as matérias-primas de uma localidade, ou uma única linha se nenhuma foi ignorada. Lê a capital, a menos que você marque uma localidade com o comando de console effect location:<key> = { cm_fa_col_watch_on = yes }."
 cm__probe_industry_rgo_text: "Executar"
 cm__probe_collapsar_name: "Colapsador de Preços"
 cm__probe_collapsar_desc: "Cada número que o Price Collapsar lê em um local, cada um ao lado da leitura do próprio jogo, seguido pelo que o mercado desse local poderia absorver em um ciclo. Lê a capital, a menos que você marque um local com o comando de console effect location:<key> = { cm_fa_col_watch_on = yes }; a capital nunca é uma candidata ao Price Collapsar, então marque um local para ler um no qual ele construiria."
 cm__probe_collapsar_text: "Executar"
 cm__probe_roads_name: "Estradas"
 cm__probe_roads_desc: "Quantos corredores o plano de Estradas contém para cada um de proximidade, acesso ao mercado e conexão com a capital, quantos dos da capital já podem ser iniciados, quantas estradas já estão sendo construídas e o que resta na reserva da categoria."
 cm__probe_roads_text: "Executar"
 cm__probe_log_gate_name: "Filtro do Registro de Ações"
 cm__probe_log_gate_desc: "A categoria de log do Price Collapsar duas vezes, conforme o filtro de log a lê e conforme o menu a armazena, para que uma categoria que esteja ativada em um e desativada no outro apareça."
 cm__probe_log_gate_text: "Executar"
