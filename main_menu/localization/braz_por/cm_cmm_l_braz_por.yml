 cm__ab_core__ab_core_desc: "Configurações para Bens Essenciais. Materiais são processados do topo da lista para baixo, com RGOs expandidas antes dos edifícios de produção."
 cm__ab_core_target_name: "Meta de Preço"
 cm__ab_core_target_desc: "O preço no qual a construção de um material para, em relação ao seu preço base. A -33%, produtores são construídos até que o material seja negociado 33% abaixo do preço base. A 0%, até atingir o preço base. A +33%, apenas enquanto custar mais de 33% acima da base."
