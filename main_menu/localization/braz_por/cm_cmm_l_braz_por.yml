l_braz_por:
 # Mod
 cm_name: "Gerenciador de Construção"
 cm_desc: "Um mod massivo de qualidade de vida que adiciona novas automações, filtros e modos de mapa para melhorar drasticamente a experiência de construção no EU5."

 # Settings (settings) Tab
 cm__settings_name: "Configurações"
 ## Global Control (settings) Group
 cm__pause_auto_expand_name: "Pausar Automação"
 cm__pause_auto_expand_desc: "Pausa todos os recursos de automação: autoexpansão de construções, autoexpansão de RGOs, aprimoramento de todas as construções, autoconstrução, auto-comida e autourbanização."
 cm__minimum_gold_name: "Reserva de Ouro"
 cm__minimum_gold_desc: "A reserva mínima de ouro a ser mantida. A construção não será enfileirada se isso deixar o tesouro abaixo deste valor. Aplica-se a todos os recursos de automação, exceto melhorias de auto-urbanização (que possuem sua própria configuração de ouro)."
 cm__minimum_gold_format: "[CMMV('cm__minimum_gold')]@gold!"
 cm__allowed_building_overbuild_levels_name: "Limite de Sobreconstrução"
 cm__allowed_building_overbuild_levels_desc: "Quantos níveis totais de construção uma localidade pode exceder o seu limite de Níveis de Construção Suportados antes que a expansão automática pare de enfileirar novas construções no local. Em zero, não permitirá nenhuma sobreconstrução."

 ## Priority List Group
 cm__settings__priority_list_name: "Automação de Construção"
 cm__settings__priority_list_desc: "Arraste para reordenar a prioridade dos recursos. A cada mês, os recursos ativados são executados de cima para baixo. Para a autoexpansão, o valor ao lado de cada recurso indica quão boa uma expansão deve ser antes de ser construída, julgado pela métrica selecionada em Métrica de Autoexpansão: um ouro mensal mínimo por nível para Renda de Impostos e Lucro, ou um número máximo de anos para recuperar o custo de construção para ROI (0 = desativado). Desconto Mínimo define o acréscimo máximo permitido no preço dos materiais de construção (-33% = apenas quando barato, 0 = ao preço base, +33% = mesmo quando inflacionado)."
 cm__priority_list_item_column_name: "Funcionalidade"
 cm__priority_list_i1_name: "Auto-expandir Edifícios"
 cm__priority_list_i1_desc: "Expande automaticamente edifícios de produção e de não-produção de vários níveis quando lucrativos, se houver pops disponíveis e o ouro permanecer acima da sua Reserva de Ouro. Aplica-se apenas em locais onde a expansão automática estiver ativada."
 cm__priority_list_i2_name: "Auto-expandir RGOs"
 cm__priority_list_i2_desc: "Expande automaticamente os níveis de RGO em localidades onde a autoexpansão de RGO está ativada, quando houver trabalhadores disponíveis e os recursos permitirem."
 cm__priority_list_i3_name: "Aprimorar Automaticamente Todos os Edifícios"
 cm__priority_list_i3_desc: "Atualiza automaticamente todas as construções que se tornaram obsoletas, independentemente de a autoexpansão estar ativada para aquela construção."
 cm__priority_list_i4_name: "Construção Automática"
 cm__priority_list_i4_desc: "Constrói automaticamente edifícios limitados a um por localidade (conselhos, bibliotecas, etc.) na ordem e com as configurações definidas na aba de Auto-Construção."
 cm__priority_list_i5_name: "Auto-Alimento"
 cm__priority_list_i5_desc: "Constrói automaticamente RGOs e edifícios de produção de alimento em localizações rurais, escolhendo a opção com a maior produção marginal de alimento. Configurado na aba Auto-Alimento."
 cm__priority_list_i6_name: "Auto-Urbanizar"
 cm__priority_list_i6_desc: "Promove a classificação das localidades mensalmente: de assentamentos rurais para vilas, e de vilas para cidades. A transição de rural para vila requer 30.000 pops (elegível imediatamente para cidade) ou estar a 1.000 do limite de população (caso contrário, o crescimento estagnaria no limite rural). Ignora localidades não integradas. Configurado na aba Auto-Urbanizar."
 cm__priority_list_i7_name: "Construção Automática de Edifícios da Capital"
 cm__priority_list_i7_desc: "Constrói automaticamente construções exclusivas da capital (corte real, supremo tribunal, academia militar, etc.) na localização da sua capital quando as condições permitirem."
 cm__priority_list__enabled_name: "Ativado"
 cm__priority_list__enabled_desc: "Ativar ou desativar esta funcionalidade. Funcionalidades desativadas são ignoradas a cada mês."
 cm__priority_list__min_profit_name: "Mín. Renda de Impostos"
 cm__priority_list__min_profit_desc: "Ouro mensal mínimo por nível exigido antes que a construção seja enfileirada. Defina como 0 para desativar a verificação."
 cm__priority_list__min_profit_postfix: "@gold!"
 cm__priority_list__min_discount_name: "Desconto Mínimo"
 cm__priority_list__min_discount_desc: "Acréscimo máximo de preço permitido para materiais de construção. Em -33%, constrói apenas quando os materiais custam 33% abaixo do preço base. Em 0%, apenas no preço base ou abaixo. Em +33%, constrói mesmo quando os preços estão 33% acima da base."
 cm__priority_list__min_discount_postfix: "%"
 cm__priority_list__min_discount_prefix_high: "#R "
 cm__priority_list__min_discount_postfix_high: "%#!"
 cm__priority_list__min_discount_prefix_low: "#G "
 cm__priority_list__min_discount_postfix_low: "%#!"

