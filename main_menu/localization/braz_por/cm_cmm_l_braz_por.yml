 cm__ab_master__ab_master_name: "$cm__ab_master_name$" # NO-TRANSLATE
 cm__ab_master__ab_master_desc: "Construção automática. A cada mês, as categorias abaixo gastam o tesouro acima da Reserva de Ouro nas melhores construções disponíveis. Funciona em conjunto com os outros recursos de automação sem alterar suas configurações."
 cm__ab_enabled_name: "Ativar Autoconstrução"
 cm__ab_enabled_desc: "Ativar ou desativar a Construção Automática."
 cm__ab_save_unaffordable_name: "Poupar para Construções Inacessíveis"
 cm__ab_save_unaffordable_desc: "Uma categoria compra o melhor edifício que encontrar, mesmo que custe mais do que sua cota para o mês, e então fica sem comprar nada até que os meses seguintes compensem a diferença. Quando desativado, uma categoria não compra nada que não possa cobrir integralmente."
 cm__ab_min_proximity_name: "Proximidade Mínima"
 cm__ab_min_proximity_desc: "Localizações abaixo desta Proximidade são ignoradas ao escolher onde construir. Edifícios de Controle e @settlement_building! [ShowBuildingTypeNameWithNoTooltip('settlement_building')] são construídos independentemente, pois são eles que fazem valer a pena manter terras com baixa Proximidade. Em 0, nada é ignorado."
 cm__ab_min_proximity_format: "[CMMV('cm__ab_min_proximity')]%" # NO-TRANSLATE
 cm__ab_master__ab_priority_list_name: "Categorias de Construção Automática"
 cm__ab_master__ab_priority_list_desc: "Arraste para reordenar. As categorias são processadas de cima para baixo todos os meses. Se duas desejarem o mesmo edifício, a que estiver acima o constrói, e se sobrar ouro após cada categoria ter recebido sua parte, a que estiver acima o recebe."
 cm__ab_priority_list_item_column_name: "Categoria"
 cm__ab_priority_list_i1_name: "$cm__ab_custom_name$" # NO-TRANSLATE
 cm__ab_priority_list_i1_desc: "Constrói infraestrutura de apoio em todos os locais onde couber. Edifícios da capital vêm primeiro, seguidos pelos edifícios de controle, depois pelos edifícios de centro de mercado e, por fim, pelos edifícios que você mesmo selecionar. Oficiais de Justiça vão para os locais cujas matérias-primas são vendidas pelo maior valor, outros edifícios de Controle para os locais mais ricos e mercados para os locais com o menor Acesso ao Mercado."
 cm__ab_priority_list_i2_name: "$cm__ab_core_name$" # NO-TRANSLATE
 cm__ab_priority_list_i2_desc: "Expande a produção de materiais de construção para reduzir seus preços. Funciona em mercados cujo centro de mercado você possui. As localizações com melhor produção vêm primeiro e cada uma recebe vários níveis de uma vez, e os produtores começam mesmo onde os trabalhadores ainda não chegaram. Sua capital, localizações que produzem alimentos e produtores que operariam com prejuízo sem subsídio são todos ignorados."
 cm__ab_priority_list_i3_name: "$cm__ab_food_name$" # NO-TRANSLATE
 cm__ab_priority_list_i3_desc: "Monitora o suprimento de alimentos ao longo do ano em mercados cujos centros de mercado você possui e, onde a mediana mensal foi insuficiente, ativa o auto-alimento nas localidades com o maior potencial de alimentos. As localidades selecionadas brilham como as ativadas pelo jogador, mas o controle permanece seu; elas nunca são desativadas, a menos que a localidade deixe de ser um assentamento rural de sua propriedade, você não possua mais seu centro de mercado ou uma localidade melhor no mesmo mercado tome seu lugar."
 cm__ab_priority_list_i4_name: "$cm__ab_production_name$" # NO-TRANSLATE
 cm__ab_priority_list_i4_desc: "Constrói, amplia e melhora os edifícios de produção e OGRs que pagam seu custo mais rapidamente em receita tributária. Locais operando comida automática são ignorados enquanto houver escassez de qualquer tipo de trabalhador."
 cm__ab_priority_list_i5_name: "$cm__ab_roads_name$" # NO-TRANSLATE
 cm__ab_priority_list_i5_desc: "Constrói a rede rodoviária com o melhor custo-benefício em ouro, considerando três fatores: Proximidade, Acesso ao Mercado e conexão de um local à sua capital. A cada quatro anos, e sempre que sua capital mudar, o sistema calcula a melhor rota para cada local de sua propriedade para cada um desses fatores e organiza os trechos pela Base Tributária que eles elevariam, contabilizando tudo o que estiver mais adiante na rota depois deles; no multijogador, isso só ocorre ao pressionar Forçar Replanejamento de Estradas. A cada mês, o sistema percorre essa fila e para no primeiro trecho que não puder iniciar, em vez de ignorá-lo. Corredores planos e baratos são construídos primeiro, e um trecho inferior só recebe ouro em meses nos quais o trecho acima não construiu nada e não está economizando para um trecho que ainda não pode pagar."
 cm__ab_priority_list_i6_name: "$cm__ab_governors_name$" # NO-TRANSLATE
 cm__ab_priority_list_i6_desc: "Planeja onde seus governadores devem ser alocados e os posiciona, priorizando a melhor localização primeiro. O planejamento é refeito sempre que uma vaga de governador surge e a cada vinte e cinco anos nos demais casos. Apenas para um jogador."
 cm__ab_priority_list__budget_name: "Parcela do Orçamento"
 cm__ab_priority_list__budget_desc: "A parcela do tesouro acima da Reserva de Ouro concedida a esta categoria a cada mês. Trata-se de um piso, em vez de um limite: o ouro que nenhuma categoria gasta é oferecido novamente a partir do topo da lista, de modo que uma categoria pode construir muito além de sua parcela em um mês no qual as categorias abaixo dela não tenham nada para comprar."
 cm__ab_priority_list__budget_postfix: "%" # NO-TRANSLATE
