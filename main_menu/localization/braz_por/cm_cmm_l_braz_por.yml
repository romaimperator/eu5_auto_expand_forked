l_braz_por:
 # Mod
 cm_name: "Gerenciador de Construção"
 cm_desc: "Um mod massivo de qualidade de vida que adiciona novas automações, filtros e modos de mapa para melhorar consideravelmente a experiência de construção do EU5."

 # Settings (settings) Tab
 cm__settings_name: "Configurações"
 ## Global Control (settings) Group
 cm__pause_auto_expand_name: "Pausar Automação"
 cm__pause_auto_expand_desc: "Pausa todos os recursos de automação: expansão automática de edifícios, expansão automática de RGOs, melhoria de todos os edifícios, construção automática, construção automática de edifícios da capital, alimentação automática, urbanização automática, concessão automática de direitos urbanos e Automação Total."
 cm__minimum_gold_name: "Reserva de Ouro"
 cm__minimum_gold_desc: "A reserva mínima de ouro a manter. Aplica-se a todos os recursos de automação, exceto à Automação Total."
 cm__minimum_gold_format: "[CMMV('cm__minimum_gold')]@gold!"
 cm__allowed_building_overbuild_levels_name: "Limite de Sobreconstrução"
 cm__allowed_building_overbuild_levels_desc: "Quantos níveis totais de construção um local pode exceder o seu limite de Níveis de Construção Suportados antes que a auto-expansão pare de enfileirar novas construções. Em zero, não permitirá nenhuma sobreconstrução. Em 200+, não há limite."

 ## Priority List Group
 cm__settings__priority_list_name: "Automação de Construção"
 cm__settings__priority_list_desc: "Arraste para reordenar a prioridade das funcionalidades. A cada mês, as funcionalidades ativadas são executadas de cima para baixo, exceto pela Auto-Urbanização, que sempre é executada por último, após todas as outras funcionalidades e após a Automação Total."
 cm__priority_list_item_column_name: "Funcionalidade"
 cm__priority_list_i1_name: "Auto-expandir Edifícios"
 cm__priority_list_i1_desc: "Expande automaticamente edifícios de produção e não-produção de vários níveis quando for lucrativo, houver população disponível e o ouro permanecer acima da sua Reserva de Ouro. Aplica-se onde a expansão automática estiver ativada para uma localização ou para um tipo inteiro de edifício, incluindo edifícios estrangeiros em localizações de outros países."
 cm__priority_list_i2_name: "Auto-expandir RGOs"
 cm__priority_list_i2_desc: "Expande automaticamente os níveis de RGO em localidades onde a autoexpansão de RGO está ativada, quando houver trabalhadores disponíveis e os recursos permitirem."
 cm__priority_list_i3_name: "Construção Automática"
 cm__priority_list_i3_desc: "Constrói automaticamente edifícios de capital e edifícios de um por local (conselhos, bibliotecas, etc.) na ordem e com as configurações definidas na aba de Auto-Construção."
 cm__priority_list_i4_name: "Auto-Alimento"
 cm__priority_list_i4_desc: "Constrói automaticamente RGOs e edifícios produtores de alimentos em locais rurais, escolhendo a opção mais eficiente em produção de alimentos. Configurado na aba Auto-Alimentos."
 cm__priority_list_i5_name: "Auto-urbanizar"
 cm__priority_list_i5_desc: "Aprimora os níveis de localização a cada mês: assentamentos rurais para vilas, vilas para cidades e cidades para megalópoles. Ignora localizações conquistadas. Configurado na aba Auto-Urbanizar."
 cm__priority_list_i6_name: "Melhorar Automaticamente Todos os Edifícios"
 cm__priority_list_i6_desc: "Melhora automaticamente todos os edifícios que se tornaram obsoletos, independentemente de a autoexpansão estar ativada para esse edifício."
 cm__priority_list__enabled_name: "Ativado"
 cm__priority_list__enabled_desc: "Ativar ou desativar este recurso."
 cm__priority_list__min_profit_name: "Mín. Renda de Impostos"
 cm__priority_list__min_profit_desc: "Ouro mensal mínimo por nível exigido antes que a construção seja enfileirada. Defina como 0 para desativar a verificação."
 cm__priority_list__min_profit_postfix: "@gold!"
 cm__priority_list__min_discount_name: "Desconto Mínimo"
 cm__priority_list__min_discount_desc: "Acréscimo máximo de preço permitido para materiais de construção. Em -33%, constrói apenas quando os materiais custam 33% abaixo do preço base. Em 0%, apenas no preço base ou abaixo. Em +33%, constrói mesmo quando os preços estão 33% acima da base."
 cm__priority_list__min_discount_postfix: "%"
 cm__priority_list__min_discount_prefix_high: "#R "
 cm__priority_list__min_discount_postfix_high: "%#!"
 cm__priority_list__min_discount_prefix_low: "#G "
 cm__priority_list__min_discount_postfix_low: "%#!"

