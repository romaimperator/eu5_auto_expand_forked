 cm__expand_metric_option_3_name: "@efficiency! ROI (Imposto)"
 cm__expand_metric_option_3_desc: "Adiciona um novo nível apenas quando a receita tributária recuperar o custo de construção dentro do limite de Anos Máximos de ROI definido."
 cm__expand_metric_option_4_name: "@efficiency! ROI (Lucro)"
 cm__expand_metric_option_4_desc: "Adicionar um novo nível apenas quando o lucro recuperar o custo de construção dentro do limite definido de Anos de ROI Máximo."
 cm__auto_town_rights_list_i32_name: "@market_charter! [ShowTownRightsName('market_charter')]"
 cm__auto_town_rights_list_i33_name: "@free_town_charter! [ShowTownRightsName('free_town_charter')]"
 cm__auto_town_rights_list_i34_name: "@fortress_town! [ShowTownRightsName('fortress_town')]"
 cm__auto_town_rights_list_i35_name: "@mining_charter! [ShowTownRightsName('mining_charter')]"
 cm__auto_town_rights_list_i36_name: "@studium_privileges! [ShowTownRightsName('studium_privileges')]"
 cm__auto_town_rights_list_i37_name: "@agrarian_community_town_right! [ShowTownRightsName('agrarian_community_town_right')]"
 cm__auto_town_rights_list_i38_name: "@enlightened_leadership_reform_town_right! [ShowTownRightsName('enlightened_leadership_reform_town_right')]"
 cm__expand_metric: "cm__expand_metric"
 cm__auto_build_list__min_control_postfix: "%"
 cm__auto_build_list__min_discount_postfix: "%"
 cm__town_rights_free_grants_name: "Remover Custos de Direitos Urbanos"
 cm__town_rights_free_grants_desc: "Quando ativado, conceder direitos urbanos não custa poder de governo e revogá-los não custa estabilidade."
 cm__town_rights_min_gov_power_name: "Poder de Governo Mínimo"
 cm__town_rights_min_gov_power_desc: "A concessão automática para de conceder direitos urbanos quando a próxima concessão reduziria seu poder de governo (legitimidade, tradição republicana, devoção ou unidade de horda, dependendo do tipo de governo) abaixo deste valor."
 cm__allowed_building_overbuild_levels_format: "[CMMV('cm__allowed_building_overbuild_levels')][Select_CString(GreaterThanOrEqualTo_CFixedPoint(CMMV('cm__allowed_building_overbuild_levels'), CMMMapValue('cmm_max', 'cm__allowed_building_overbuild_levels')), '+', '')]"
 cm__auto_build_capital_name: "Edifícios da Capital"
 cm__auto_build_capital_desc: "Constrói automaticamente edifícios exclusivos da capital (corte real, suprema corte, colégio de guerra, etc.) na localização da sua capital quando as condições permitirem. Estes são construídos antes da lista abaixo."
 cm__urbanize_city_to_megalopolis_name: "De Cidade a Megalópole"
 cm__urbanize_city_to_megalopolis_desc: "Melhore sua capital para uma megalópole assim que ela for uma cidade centro de mercado com pelo menos 400.000 de população."
 cm__megalopolis_ignore_capital_name: "Megalópole: Ignorar Requisito de Capital"
 cm__megalopolis_ignore_capital_desc: "Permite que você construa Fundar Megalópole em uma cidade que não seja sua capital."
 cm__megalopolis_ignore_market_center_name: "Megalópole: Ignorar Requisito de Centro de Mercado"
 cm__megalopolis_ignore_market_center_desc: "Permite construir Fundar Megalópole em uma cidade que não seja um centro de mercado."
 cm__deurbanize_name: "Desurbanizar"
 cm__deurbanize_desc: "A cada mês, rebaixa as localizações possuídas de volta para assentamentos rurais quando o seu bem de RGO estiver marcado na lista Não Urbanizar abaixo. Sua capital, localizações conquistadas e localizações que fornecem Proximidade, como sedes de governadores, são ignoradas."
 cm__auto_urbanize_ignore_list_i20_name: "@wool! [ShowGoodsName('wool')] ([GetGlobalVariable('cm_goods_wool').GetGoods.GetDefaultMarketPrice]@gold!)"
 cm__full_automation_name: "Automação Total"
 cm__full_automation__full_automation_name: "Automação Total"
 cm__full_automation__full_automation_desc: "Construção automática. Todo mês, as categorias abaixo gastam o tesouro acima da Reserva de Ouro nas melhores construções disponíveis. Funciona em conjunto com os outros recursos de automação sem alterar suas configurações."
 cm__fa_enabled_name: "Ativar Automação Total"
 cm__fa_enabled_desc: "Ativar ou desativar a automação total."
 cm__fa_reserve_name: "Reserva de Ouro"
 cm__fa_reserve_desc: "A automação total nunca gasta seu tesouro abaixo deste valor. Separado da Reserva de Ouro na aba Configurações."
 cm__fa_reserve_format: "[CMMV('cm__fa_reserve')]@gold!"
 cm__fa_save_unaffordable_name: "Economizar para Construções Inacessíveis"
 cm__fa_save_unaffordable_desc: "Uma categoria compra o melhor edifício que encontrar mesmo quando custa mais do que sua cota para o mês, e então fica sem comprar até que os meses seguintes compensem a diferença. Quando desativada, cada categoria gasta o que pode e repassa o restante."
 cm__full_automation__fa_priority_list_name: "Prioridades"
 cm__full_automation__fa_priority_list_desc: "Arraste para reordenar. As categorias são processadas de cima para baixo a cada mês. Se duas categorias desejarem a mesma construção, a que estiver acima a constrói."
 cm__fa_priority_list_item_column_name: "Categoria"
 cm__fa_priority_list_i1_name: "Alimento"
 cm__fa_priority_list_i1_desc: "Monitora o suprimento de comida ao longo do ano em mercados cujo centro de mercado você possui e, onde o mês mediano ficou abaixo do necessário, habilita a auto-comida nos locais com o maior potencial de comida. Os locais escolhidos brilham como os habilitados pelo jogador, mas o controle permanece seu; eles nunca são desativados, a menos que o local deixe de ser um assentamento rural de sua propriedade, ou você não possua mais seu centro de mercado."
 cm__fa_priority_list_i2_name: "Indústria"
 cm__fa_priority_list_i2_desc: "Constrói, amplia e aprimora os edifícios de produção e RGOs que se pagam mais rapidamente através da receita de impostos. Locais operando a produção automática de alimentos são ignorados enquanto qualquer tipo de trabalhador local já estiver em falta."
 cm__fa_priority_list_i3_name: "Colapso de Preços"
 cm__fa_priority_list_i3_desc: "Expande a produção de materiais de construção para reduzir seus preços. Funciona em mercados cujo centro de mercado você possui. Os locais mais produtivos vêm primeiro e cada um recebe vários níveis de uma só vez; os produtores começam mesmo onde os trabalhadores ainda não chegaram. Sua capital, locais que produzem alimentos e produtores que operariam com prejuízo sem subsídio são todos ignorados."
 cm__fa_priority_list_i4_name: "Estradas"
 cm__fa_priority_list_i4_desc: "Constrói a rede viária com o melhor custo-benefício em ouro, considerando três benefícios de uma estrada: Proximidade, Acesso ao Mercado e conexão de um local à sua capital. Uma vez por ano, calcula a melhor rota para cada local que você possui para cada um desses critérios e, a cada mês, inicia os trechos que mais aumentariam a Base Tributária, contabilizando tudo o que estiver adiante na rota após eles. Corredores planos e baratos são construídos primeiro, e os dois critérios inferiores só recebem investimento nos meses em que o critério acima não tiver mais nada a construir."
 cm__fa_priority_list_i5_name: "Utilidades"
 cm__fa_priority_list_i5_desc: "Constrói infraestrutura de apoio em todos os locais onde couber: edifícios da capital, a lista de autoconstrução, pátios de mercúrio, edifícios de centro de mercado, meirinhos e quaisquer edifícios únicos do seu país que aumentem o controle, mercados, edifícios de resistência a doenças e, por fim, celeiros. Edifícios de controle vão para os locais mais ricos primeiro, e mercados para os locais com o menor acesso ao mercado primeiro."
 cm__fa_priority_list_i6_name: "Limpeza de Construções"
 cm__fa_priority_list_i6_desc: "Uma vez por ano, fecha as construções de produção que pararam de lucrar e não são subsidiadas, destruindo-as quando o local estiver dentro de dez níveis dos níveis de construção que suporta. Construções fechadas reabrem assim que o tipo voltar a lucrar naquele mercado e são destruídas mais tarde se o local ficar sem espaço. @farming_village! [ShowBuildingTypeNameWithNoTooltip('farming_village')] nunca é fechado ou destruído."
 cm__fa_priority_list_i7_name: "Governadores"
 cm__fa_priority_list_i7_desc: "Planeja onde seus governadores devem ficar e os coloca lá, escolhendo o melhor local primeiro. Planeja novamente sempre que uma vaga de governador abrir e, de outra forma, a cada vinte e cinco anos. Apenas single-player."
 cm__fa_priority_list_i8_name: "Direitos Urbanos"
 cm__fa_priority_list_i8_desc: "Concede direitos urbanos em suas vilas e cidades. [ShowTownRightsNameWithNoTooltip('granary_town')] vem primeiro, seguido de um direito de especialização, escolhido aleatoriamente entre aqueles que se adequam às mercadorias produzidas nos arredores do local."
 cm__fa_priority_list__budget_name: "Parcela do Orçamento"
 cm__fa_priority_list__budget_desc: "A parcela do tesouro acima da Reserva de Ouro que esta categoria pode gastar a cada mês."
 cm__fa_priority_list__budget_postfix: "%"
 cm__fa_priority_list__enabled_name: "Ativado"
 cm__fa_priority_list__enabled_desc: "Permitir que esta categoria construa."
 cm__full_automation__fa_industry_name: "Indústria"
 cm__full_automation__fa_industry_desc: "Configurações para a categoria de Indústria acima."
 cm__fa_industry_algorithm_name: "Estratégia de Construção"
 cm__fa_industry_algorithm_desc: "Como a indústria escolhe o que construir."
 cm__fa_industry_algorithm_option_1_name: "Ganancioso"
 cm__fa_industry_algorithm_option_1_desc: "Construir primeiro as opções de retorno mais rápido e apenas aquelas próximas ao melhor local encontrado para produzir os mesmos bens."
 cm__fa_industry_max_rel_roi_name: "ROI Relativo Máximo"
 cm__fa_industry_max_rel_roi_desc: "O quanto mais lento em relação ao melhor local encontrado para produzir os mesmos bens um edifício ou melhoria pode pagar seu custo e ainda assim ser construído. A 30%, se o melhor se paga em 10 anos, apenas aqueles que se pagam em até 13 anos são construídos; qualquer um mais lento aguarda. A 0%, apenas o melhor produtor de cada bem é construído a cada mês. A 100%+, não há limite e apenas os Anos Máximos de Retorno se aplicam. Todos os edifícios que produzem os mesmos bens são avaliados em conjunto, independentemente do tipo. Expansões de RGO são sempre construídas na ordem de retorno."
 cm__fa_industry_max_rel_roi_format: "[CMMV('cm__fa_industry_max_rel_roi')]%[Select_CString(GreaterThanOrEqualTo_CFixedPoint(CMMV('cm__fa_industry_max_rel_roi'), CMMMapValue('cmm_max', 'cm__fa_industry_max_rel_roi')), '+', '')]"
 cm__fa_industry_min_roi_name: "Anos Máximos de Retorno"
 cm__fa_industry_min_roi_desc: "Somente construções cuja receita de impostos pague o custo de construção dentro deste número de anos são consideradas. Defina como 0 para desativar a verificação."
 cm__fa_industry_min_roi_format: "[CMMV('cm__fa_industry_min_roi')]a @efficiency!"
 cm__full_automation__fa_collapsar_name: "Colapsar de Preços"
 cm__full_automation__fa_collapsar_desc: "Configurações para a categoria Price Collapsar acima. Os materiais são processados do topo da lista para baixo, com as RGOs sendo expandidas antes dos edifícios de produção."
 cm__fa_collapsar_target_name: "Preço Alvo"
 cm__fa_collapsar_target_desc: "O preço no qual a construção de um material é interrompida, em relação ao seu preço base. Em -33%, produtores são construídos até que o material seja negociado 33% abaixo do preço base. Em 0%, até que atinja o preço base. Em +33%, apenas enquanto custar mais de 33% acima do preço base."
 cm__fa_collapsar_target_format: "[CMMV('cm__fa_collapsar_target')]%"
 cm__fa_collapsar_item_column_name: "Material"
 cm__fa_collapsar_i1_name: "@masonry! [ShowGoodsName('masonry')]"
 cm__fa_collapsar_i2_name: "@lumber! [ShowGoodsName('lumber')]"
 cm__fa_collapsar_i3_name: "@sand! [ShowGoodsName('sand')]"
 cm__fa_collapsar_i4_name: "@glass! [ShowGoodsName('glass')]"
 cm__fa_collapsar__enabled_name: "Ativado"
 cm__fa_collapsar__enabled_desc: "Trabalhar para reduzir o preço deste material."
 cm__full_automation__fa_food_name: "Alimento"
 cm__full_automation__fa_food_desc: "Configurações para a categoria de Alimentos acima."
 cm__fa_food_target_name: "Meta de Excedente"
 cm__fa_food_target_desc: "Um mercado recebe mais locais de alimentos até que sua oferta atinja esta proporção de sua demanda. Em 125%, a produção de alimentos é expandida em qualquer mercado cujo mês mediano do ano não tenha atingido um excedente de 25%. Aumente para manter uma margem de segurança maior, diminua para ajudar apenas mercados mais próximos de uma escassez."
 cm__fa_food_target_format: "[CMMV('cm__fa_food_target')]%"
 cm__fa_food_min_potential_name: "Potencial Mínimo de Alimento"
 cm__fa_food_min_potential_desc: "O autoalimento é habilitado apenas em locais cujo potencial de alimento por nível de RGO atinja esta pontuação, a mesma pontuação que o modo de mapa $mapmode_cm_location_food_potential_name$ exibe. Aumente-a para esperar por terras aráveis melhores, diminua-a para aceitar terras mais fracas."
 cm__fa_food_min_potential_format: "[CMMV('cm__fa_food_min_potential')]"
 cm__full_automation__fa_urban_rights_name: "Direitos Urbanos"
 cm__full_automation__fa_urban_rights_desc: "Configurações para a categoria de Direitos Urbanos acima."
 cm__fa_urban_rights_window_name: "Limiar de Adequação"
 cm__fa_urban_rights_window_desc: "O quão bem um direito de especialização deve se adequar a um local, em comparação ao direito mais adequado para ele, para ser considerado. A 50%, qualquer direito que se adeque pelo menos metade disso pode ser sorteado, e os mais adequados são sorteados com mais frequência. A 100%, apenas o direito mais adequado é concedido."
 cm__fa_urban_rights_window_format: "[CMMV('cm__fa_urban_rights_window')]%"
 cm__fa_urban_rights_reserve_name: "Reserva de Poder Governamental"
 cm__fa_urban_rights_reserve_desc: "Nenhum direito urbano é concedido quando o pagamento por ele faria seu poder de governo (legitimidade, tradição republicana, devoção ou unidade da horda, dependendo do tipo de governo) cair abaixo deste valor."
 cm__fa_urban_rights_expand_name: "Expandir as Indústrias Impulsionadas"
 cm__fa_urban_rights_expand_desc: "Quando um direito de especialização é concedido, também ativa a expansão automática nessa localidade para as indústrias que o direito impulsiona e para suas matérias-primas onde a localidade as produz. O mesmo que clicar com o botão direito em um botão de concessão no mapa de Direitos Urbanos Recomendados."
 cm__full_automation__fa_cleanup_name: "Limpeza de Construções"
 cm__full_automation__fa_cleanup_desc: "Configurações para a categoria de Limpeza de Edifícios acima."
 cm__fa_cleanup_min_profit_name: "Lucro Mínimo"
 cm__fa_cleanup_min_profit_desc: "Um edifício que lucra menos do que isso por mês é considerado não rentável e será fechado ou destruído, a menos que seja subsidiado. No máximo, metade dos edifícios abertos de um determinado tipo em um mercado são fechados de uma só vez."
 cm__fa_cleanup_min_profit_format: "[Divide_CFixedPoint(CMMV('cm__fa_cleanup_min_profit'), '(CFixedPoint)100')|2]@gold!"
 cm__fa_cleanup_core_goods_name: "Priorizar Materiais de Construção"
 cm__fa_cleanup_core_goods_desc: "Manter edifícios que consomem majoritariamente @masonry![ShowGoodsNameWithNoTooltip('masonry')], @lumber![ShowGoodsNameWithNoTooltip('lumber')], @sand![ShowGoodsNameWithNoTooltip('sand')] ou @glass![ShowGoodsNameWithNoTooltip('glass')] com o dobro do Lucro Mínimo, ou 0,1@gold!, o que for maior. Edifícios que produzem um dos quatro são avaliados pelo Lucro Mínimo normal."
 cm__fa_cleanup_auto_food_name: "Limpar Locais de Comida Automática"
 cm__fa_cleanup_auto_food_desc: "Onde a produção automática de comida está ativa e qualquer tipo de trabalhador já está em falta, destrua os edifícios de produção que não estão produzindo comida. Um @market_village! [ShowBuildingTypeNameWithNoTooltip('market_village')] é reduzido a um nível em vez de ser destruído."
 cm__full_automation__fa_roads_name: "Estradas"
 cm__full_automation__fa_roads_desc: "Configurações para a categoria de Estradas acima."
 cm__fa_roads_proximity_name: "Proximidade"
 cm__fa_roads_proximity_desc: "Construa os trechos de estrada que mais aumentam a Proximidade pelo ouro, contando cada localidade mais adiante na rota atrás deles."
 cm__fa_roads_market_access_name: "Acesso ao Mercado"
 cm__fa_roads_market_access_desc: "Assenta os trechos de estrada que mais aumentam o Acesso ao Mercado pelo ouro gasto. Só gasta em meses nos quais não restam mais trechos de Proximidade para assentar."
 cm__fa_roads_capital_name: "Conexão com a Capital"
 cm__fa_roads_capital_desc: "Assente trechos de estradas para conectar suas localizações à sua capital, expandindo a partir das que já estão conectadas. Só gasta em um mês se não houver mais trechos de Proximidade e de Acesso ao Mercado para assentar."
 cm__full_automation__fa_governors_name: "Governadores"
 cm__full_automation__fa_governors_desc: "Configurações para a categoria de Governadores acima."
 cm__fa_gov_move_seats_name: "Permitir Mover Governadores"
 cm__fa_gov_move_seats_desc: "Quando todos os espaços de governador estiverem cheios, retire um governador e coloque-o em um local melhor. O local melhor deve ser uma Cidade ou ter uma pontuação 10% superior à do que ele substitui. Com isso desativado, os governadores apenas ocuparão espaços que estiverem vazios."
 cm__fa_gov_prepare_sites_name: "Permitir Preparar Novas Localidades"
 cm__fa_gov_prepare_sites_desc: "Considere locais que ainda não podem receber um governador e prepare-os primeiro, fundando uma Vila ou Cidade lá e construindo uma estrada para a sua capital. Com isso desativado, apenas locais que já são uma Cidade com uma estrada para a sua capital são considerados."
 cm__map_modes_name: "Modos de mapa"
 cm__map_modes__placement_finder_name: "Localização Recomendada da Capital e do Governador"
 cm__map_modes__placement_finder_desc: "Configurações para os modos de mapa de Governador Recomendado e Posicionamento de Capital Recomendado."
 cm__placement_finder_method_name: "Pontuação do Localizador de Posicionamento"
 cm__placement_finder_method_desc: "Como os modos de mapa Governador Recomendado e Capital Recomendada classificam suas localidades."
 cm__placement_finder_method_option_1_name: "Base de Impostos"
 cm__placement_finder_method_option_1_desc: "Classificar por quanto um governador ou capital lá colocado aumentaria sua base tributária total. Localizações mais ricas contam mais."
 cm__placement_finder_method_option_2_name: "Proximidade"
 cm__placement_finder_method_option_2_desc: "Classificar por quanta proximidade um governador ou capital posicionado lá adicionaria."
 cm__placement_finder_roads_name: "Infraestrutura Terrestre"
 cm__placement_finder_roads_desc: "Se os modos de mapa de Governador Recomendado e Capital Recomendada assumem uma infraestrutura terrestre ideal ou usam o que você efetivamente construiu."
 cm__placement_finder_roads_option_1_name: "Atual"
 cm__placement_finder_roads_option_1_desc: "Use as estradas que você realmente construiu."
 cm__placement_finder_roads_option_2_name: "Máximo de Estradas"
 cm__placement_finder_roads_option_2_desc: "Assuma que a melhor estrada que você desbloqueou está construída em todas as conexões."
 cm__placement_finder_roads_option_3_name: "Melhor Possível"
 cm__placement_finder_roads_option_3_desc: "Assuma que a melhor estrada que você desbloqueou está construída em todas as conexões e que todos os edifícios desbloqueados que melhoram a proximidade terrestre estão construídos onde forem elegíveis."
 cm__placement_finder_naval_name: "Infraestrutura Naval"
 cm__placement_finder_naval_desc: "Se os modos de mapa de Governador Recomendado e Capital Recomendada consideram uma infraestrutura naval ideal ou utilizam sua capacidade portuária e presença naval atuais."
 cm__placement_finder_naval_option_1_name: "Atual"
 cm__placement_finder_naval_option_1_desc: "Usa sua capacidade portuária e presença naval atual."
 cm__placement_finder_naval_option_2_name: "Presença Máxima"
 cm__placement_finder_naval_option_2_desc: "Considere presença naval total em todos os lugares, com sua capacidade portuária atual."
 cm__placement_finder_naval_option_3_name: "Melhor Possível"
 cm__placement_finder_naval_option_3_desc: "Presuma presença naval total e os melhores edifícios portuários que você desbloqueou, construídos em todas as localidades costeiras."
 cm__placement_finder_accuracy_name: "Precisão da Busca"
 cm__placement_finder_accuracy_desc: "O quão minuciosamente os modos de mapa de Governador Recomendado e Capital Recomendada buscam pelos melhores locais. Locais ignorados aparecem em preto."
 cm__placement_finder_accuracy_option_1_name: "Exaustivo"
 cm__placement_finder_accuracy_option_1_desc: "Avaliar cada localidade. O mais preciso e o mais lento."
 cm__placement_finder_accuracy_option_2_name: "Minucioso"
 cm__placement_finder_accuracy_option_2_desc: "Pule locais que não podem se classificar entre os três melhores. Os três melhores e suas pontuações são idênticos ao modo Exaustivo, apenas mais rápido."
 cm__placement_finder_accuracy_option_3_name: "Equilibrado"
 cm__placement_finder_accuracy_option_3_desc: "Pular locais que não podem ser o melhor absoluto. O melhor local ainda é garantido como exato; os marcadores de 2º e 3º lugares podem ocasionalmente diferir."
 cm__placement_finder_accuracy_option_4_name: "Rápido"
 cm__placement_finder_accuracy_option_4_desc: "Também ignora locais com pouca probabilidade de serem os melhores. O melhor local encontrado fica dentro de uma margem de 20% do melhor real e geralmente ainda é o exato."
 cm__placement_finder_accuracy_option_5_name: "Mais Rápido"
 cm__placement_finder_accuracy_option_5_desc: "Avalia a localização mais promissora de cada província e, em seguida, refina em torno das líderes. Muito mais rápido para países grandes; pode deixar passar a melhor localização."
 cm__debug_name: "Debug"
 cm__debug__logging_name: "Registro de Ações"
 cm__debug__logging_desc: "Quais das ações deste mod são registradas no log de ações do mod."
 cm__log_cycle_name: "Ciclo de Construção"
 cm__log_cycle_desc: "Linhas para um ciclo mensal que foi ignorado porque o anterior ainda estava processando, e para a redefinição que segue dois saltos seguidos."
 cm__log_industry_name: "Indústria"
 cm__log_industry_desc: "Linhas para cada edifício que a categoria de Indústria coloca na fila e cada expansão de matérias-primas que ela considera, com o retorno e a renda de cada um."
 cm__log_collapsar_name: "Colapsador de Preços"
 cm__log_collapsar_desc: "Linhas acompanhando um local através de um ciclo de Colapsar de Preços: a escassez do mercado e os níveis solicitados, seguidos pelo que foi dado ao local, pontuado e construído. Marque o local primeiro com o comando de console effect location:<key> = { cm_fa_col_watch_on = yes }."
 cm__log_food_name: "Auto-Alimentos"
 cm__log_food_desc: "Linhas para a categoria de Alimentos: oferta, demanda e proporção mensal de alimentos de cada mercado, a mediana anual pela qual essa proporção é julgada em relação à meta, a contagem de locais que já cultivam alimentos ali e cada local que ele ativa ou desativa."
 cm__log_roads_name: "Estradas"
 cm__log_roads_desc: "Uma linha para cada estrada que a categoria Estradas ordena, nomeando o local, para qual das três finalidades a estrada foi comprada e o seu custo."
 cm__log_cleanup_name: "Limpeza de Edifícios"
 cm__log_cleanup_desc: "Linhas para o processamento anual de Limpeza de Edifícios e para cada edifício que ele fecha, reduz, destrói ou reabre, com o lucro de cada um e o piso em relação ao qual foi avaliado."
 cm__log_governors_name: "Governadores"
 cm__log_governors_desc: "Linhas para o plano do governador: locais selecionados e descartados, melhorias de vilas e cidades, posicionamentos, relocações e recusas, além da mudança de capital de uma nação sortuda."
 cm__log_military_name: "Militar da Nação Sortuda"
 cm__log_military_desc: "Linhas para uma nação de sorte destruindo fortes e construindo edifícios de efetivo."
 cm__log_government_name: "Governo de Nação Sortuda"
 cm__log_government_desc: "Linhas para uma nação sortuda removendo uma burocracia ou realizando uma ação de estamento."
 cm__debug__diagnostics_name: "Diagnósticos"
 cm__placement_finder_debug_path_name: "Ativar Diagnósticos de Depuração"
 cm__placement_finder_debug_path_desc: "Adiciona um bloco de diagnóstico às dicas de interface dos modos de mapa de Governador Recomendado e Capital Recomendada: a rota prevista da sua capital para cada localidade com o custo de cada salto, e a proximidade prevista comparada à sua proximidade real."
 cm__debug__probes_name: "Sondas"
 cm__debug__probes_desc: "Diagnósticos pontuais registrados no log de ações do mod."
 cm__probe_budget_name: "Orçamento de Automação Total"
 cm__probe_budget_desc: "O saldo de cada categoria de Automação Total, sendo positivo quando retém ouro para uma escolha que ainda não pode pagar e negativo quando deve por gastos excessivos, com o limite de retorno da Indústria e o melhor candidato aguardando em um mercado ignorado por este ciclo."
 cm__probe_budget_text: "Executar"
 cm__probe_governors_name: "Plano do Governador"
 cm__probe_governors_desc: "Onde o plano do governador chegou: sua fase, quantos locais ele possui e ainda tem para posicionar, se ele está retendo o tesouro, os governadores pagos e os espaços e assentos com os quais está trabalhando."
 cm__probe_governors_text: "Executar"
 cm__probe_military_name: "Militar de Nação Sortuda"
 cm__probe_military_desc: "O nível de construção de reserva militar do país, se pode construí-lo, o estado do par da capital, o orçamento militar e quantas localidades podem comportar o nível em relação a quantas já o possuem."
 cm__probe_military_text: "Executar"
 cm__probe_industry_anchors_name: "Âncoras Industriais"
 cm__probe_industry_anchors_desc: "Uma linha por mercadoria com o melhor retorno registrado pela Indústria para ela e o limite de retorno definido, nomeando o edifício e o local por trás de cada."
 cm__probe_industry_anchors_text: "Executar"
 cm__probe_industry_rgo_name: "Matérias-primas Industriais"
 cm__probe_industry_rgo_desc: "Uma linha para cada motivo pelo qual a Indústria ignorou as matérias-primas de um local, ou uma única linha quando nenhuma foi ignorada. Lê a capital, a menos que você marque um local com o comando de console effect location:<key> = { cm_fa_col_watch_on = yes }."
 cm__probe_industry_rgo_text: "Executar"
 cm__probe_collapsar_name: "Colapsador de Preços"
 cm__probe_collapsar_desc: "Todos os números que o Colapsor de Preços lê em um local, cada um ao lado da própria leitura do jogo, seguidos pelo que o mercado daquele local poderia absorver em um ciclo. Lê a capital, a menos que você marque um local com o comando de console effect location:<key> = { cm_fa_col_watch_on = yes }; a capital nunca é uma candidata ao Colapsor de Preços, então marque um local para ler um onde ele construiria."
 cm__probe_collapsar_text: "Executar"
 cm__probe_roads_name: "Estradas"
 cm__probe_roads_desc: "Quantos corredores o plano de Estradas contém para cada um de proximidade, acesso ao mercado e conexão com a capital, quantos dos de capital já podem ser iniciados, quantas estradas já estão sendo construídas e o que resta na reserva da categoria."
 cm__probe_roads_text: "Executar"
 cm__probe_log_gate_name: "Filtro do Registro de Ações"
 cm__probe_log_gate_desc: "A categoria de registro Price Collapsar aparece duas vezes, conforme o filtro de registro a lê e o menu a armazena, para que uma categoria ativada em um e desativada no outro seja exibida."
 cm__probe_log_gate_text: "Executar"
