l_braz_por:
 # Mod
 cm_name: "Gerenciador de Construção"
 cm_desc: "Um mod de qualidade de vida massivo que adiciona novas automações, filtros e modos de mapa para melhorar significativamente a experiência de construção do EU5."

 # Settings (settings) Tab
 cm__settings_name: "Configurações"
 ## Global Control (settings) Group
 cm__pause_auto_expand_name: "Pausar Automação"
 cm__pause_auto_expand_desc: "Pausa todos os recursos de automação: expansão automática de construções, expansão automática de RGOs, aprimorar todas as construções, autoconstrução, autoconstrução de edifícios da capital, suprimento automático de comida, urbanização automática, concessão automática de direitos urbanos e Automação Total."
 cm__minimum_gold_name: "Reserva de Ouro"
 cm__minimum_gold_desc: "A reserva de ouro mínima a manter. Aplica-se a todas as funcionalidades de automação, exceto à Automação Total."
 cm__minimum_gold_format: "[CMMV('cm__minimum_gold')]@gold!"
 cm__allowed_building_overbuild_levels_name: "Limite de Sobreconstrução"
 cm__allowed_building_overbuild_levels_desc: "Quantos níveis totais de edifícios uma localização pode exceder o seu limite de Níveis de Edifícios Suportados antes que a auto-expansão pare de enfileirar novas construções nela. Em zero, não permitirá nenhuma construção acima do limite. Em 200+, não há limite."

 ## Priority List Group
 cm__settings__priority_list_name: "Automação de Construção"
 cm__settings__priority_list_desc: "Arraste para reordenar a prioridade das funcionalidades. A cada mês, as funcionalidades ativadas são executadas de cima para baixo, exceto a Auto-Urbanização, que sempre é executada por último, após todas as outras funcionalidades e após a Automação Total."
 cm__priority_list_item_column_name: "Funcionalidade"
 cm__priority_list_i1_name: "Auto-expandir Edifícios"
 cm__priority_list_i1_desc: "Expande automaticamente edifícios de produção e não produção de vários níveis quando lucrativos, pops estão disponíveis e o ouro permanece acima da sua Reserva de Ouro. Aplica-se onde a autoexpansão estiver ativada para um local ou para um tipo de edifício inteiro, incluindo edifícios estrangeiros em locais de outros países."
 cm__priority_list_i2_name: "Auto-expandir RGOs"
 cm__priority_list_i2_desc: "Expande automaticamente os níveis de RGO em localidades onde a autoexpansão de RGO está ativada, quando houver trabalhadores disponíveis e os recursos permitirem."
 cm__priority_list_i3_name: "Construção Automática"
 cm__priority_list_i3_desc: "Constrói automaticamente edifícios da capital e edifícios limitados a um por localidade (conselhos, bibliotecas, etc.) na ordem e com as configurações definidas na aba de Construção Automática."
 cm__priority_list_i4_name: "Auto-Alimentos"
 cm__priority_list_i4_desc: "Constrói automaticamente RGOs e edifícios de produção de alimentos em locais rurais, escolhendo a opção mais eficiente em termos de alimentos. Configurado na aba Auto-Alimento."
 cm__priority_list_i5_name: "Urbanização Automática"
 cm__priority_list_i5_desc: "Melhora as classificações das localidades mensalmente: assentamentos rurais para vilas, vilas para cidades e cidades para megalópoles. Ignora localidades conquistadas. Configurado na aba Auto-Urbanizar."
 cm__priority_list_i6_name: "Melhorar Automaticamente Todos os Edifícios"
 cm__priority_list_i6_desc: "Melhora automaticamente todos os edifícios que se tornaram obsoletos, independentemente de a expansão automática estar ativada para esse edifício."
 cm__priority_list__enabled_name: "Ativado"
 cm__priority_list__enabled_desc: "Ativar ou desativar este recurso."
 cm__priority_list__min_profit_name: "Mín. Renda de Impostos"
 cm__priority_list__min_profit_desc: "Ouro mensal mínimo por nível exigido antes que a construção seja enfileirada. Defina como 0 para desativar a verificação."
 cm__priority_list__min_profit_postfix: "@gold!"
 cm__priority_list__min_discount_name: "Desconto Mínimo"
 cm__priority_list__min_discount_desc: "Acréscimo máximo de preço permitido para materiais de construção. Em -33%, constrói apenas quando os materiais custam 33% abaixo do preço base. Em 0%, apenas no preço base ou abaixo. Em +33%, constrói mesmo quando os preços estão 33% acima da base."
 cm__priority_list__min_discount_postfix: "%"
 cm__priority_list__min_discount_prefix_high: "#R "
 cm__priority_list__min_discount_postfix_high: "%#!"
 cm__priority_list__min_discount_prefix_low: "#G "
 cm__priority_list__min_discount_postfix_low: "%#!"

