 cm__ab_custom__ab_custom_name: "$cm__ab_custom_name$" # NO-TRANSLATE
 cm__ab_custom__ab_custom_desc: "Os conjuntos são processados de cima para baixo a cada mês, portanto os que estão mais próximos do topo consomem o ouro primeiro."
 cm__ab_custom_item_column_name: "Edifícios"
 cm__ab_custom_i1_name: "Construções da Capital"
 cm__ab_custom_i1_desc: "Construa as edificações exclusivas da capital em sua capital: a corte real, a suprema corte, a escola de guerra e as demais. Elas são construídas antes de qualquer outra coisa que esta categoria construa."
 cm__ab_custom_i2_name: "Controlar Edificações"
 cm__ab_custom_i2_desc: "Constrói meirinhos onde as matérias-primas são vendidas pelos preços mais altos e quaisquer edifícios únicos que seu país possua que aumentem o Controle nos locais mais ricos. Um local recebe todos os edifícios únicos que puder comportar antes que o próximo local seja atendido."
 cm__ab_custom_i3_name: "Construções de Centro de Mercado"
 cm__ab_custom_i3_desc: "Construa os edifícios que valem a pena em um centro de mercado, em cada centro de mercado que você possui."
 cm__ab_custom_i4_name: "Selecionar Edificações"
 cm__ab_custom_i4_desc: "Construa os edifícios listados abaixo."
