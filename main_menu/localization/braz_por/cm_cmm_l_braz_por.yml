l_braz_por:
 # Mod
 cm_name: "Gerenciador de Construção"
 cm_desc: "Um mod massivo de qualidade de vida que adiciona novas automações, filtros e modos de mapa para melhorar significativamente a experiência de construção no EU5."

 # Settings (settings) Tab
 ## Global Control (settings) Group
 cm__pause_auto_expand_name: "Pausar Automação"
 cm__pause_auto_expand_desc: "Pausa todos os recursos de automação que este mod adiciona."
 cm__minimum_gold_name: "Reserva de Ouro"
 cm__minimum_gold_desc: "Nenhuma automação gastará seu tesouro abaixo deste valor."
 cm__minimum_gold_format: "[CMMV('cm__minimum_gold')]@gold!"
 cm__allowed_building_overbuild_levels_name: "Limite de Sobreconstrução"
 cm__allowed_building_overbuild_levels_desc: "Quantos níveis totais de construção um local pode exceder o seu limite de Níveis de Construção Suportados antes que novas construções parem de ser enfileiradas. Alimentos, Governadores e edifícios em locais de outros países estão isentos. Em zero, não permitirá nenhuma sobreconstrução. Em 200+, não há limite."

 ## Priority List Group
 cm__priority_list_item_column_name: "Funcionalidade"
 cm__priority_list_i1_name: "Construções com Autoexpansão Ativada"
 cm__priority_list_i1_desc: "Expande automaticamente edifícios de produção e não produção de vários níveis quando lucrativos, pops estão disponíveis e o ouro permanece acima da sua Reserva de Ouro. Aplica-se onde a autoexpansão estiver ativada para um local ou para um tipo de edifício inteiro, incluindo edifícios estrangeiros em locais de outros países."
 cm__priority_list_i2_name: "RGOs com Autoexpansão Ativada"
 cm__priority_list_i2_desc: "Expande automaticamente os níveis de RGO em localidades onde a autoexpansão de RGO está ativada, quando houver trabalhadores disponíveis e os recursos permitirem."
 cm__priority_list_i3_name: "Expandir Alimentos Automaticamente em Locais Ativados"
 cm__priority_list_i3_desc: "Constrói automaticamente RGOs e edifícios de produção de alimentos nos locais rurais onde você ativar o auto-alimento, escolhendo a opção mais eficiente em termos de alimentos."
 cm__priority_list_i4_name: "Aprimorar Automaticamente Todos os Edifícios"
 cm__priority_list_i4_desc: "Melhora automaticamente todos os edifícios que se tornaram obsoletos, independentemente de a expansão automática estar ativada para aquele edifício."
 cm__priority_list__enabled_name: "$cm_txt_enabled$"
 cm__priority_list__enabled_desc: "Ativar ou desativar este recurso."
 cm__priority_list__min_profit_name: "Mín. Renda de Impostos"
 cm__priority_list__min_profit_desc: "Ouro mensal mínimo por nível exigido antes que a construção seja enfileirada. Defina como 0 para desativar a verificação."
 cm__priority_list__min_profit_postfix: "@gold!"
 cm__priority_list__min_discount_name: "$cm_txt_min_discount$"
 cm__priority_list__min_discount_desc: "$cm_txt_min_discount_desc$"
 cm__priority_list__min_discount_postfix: "%"
 cm__priority_list__min_discount_prefix_high: "#R "
 cm__priority_list__min_discount_postfix_high: "%#!"
 cm__priority_list__min_discount_prefix_low: "#G "
 cm__priority_list__min_discount_postfix_low: "%#!"

