 cm__placement_finder_roads_option_2_desc: "Assuma que a melhor estrada que você desbloqueou está construída em todas as conexões."
 cm__placement_finder_roads_option_3_name: "$cm_txt_best_possible$"
 cm__placement_finder_roads_option_3_desc: "Assuma que a melhor estrada que você desbloqueou está construída em todas as conexões e que todos os edifícios desbloqueados que melhoram a proximidade terrestre estão construídos onde forem elegíveis."
 cm__placement_finder_naval_name: "Infraestrutura Naval"
 cm__placement_finder_naval_desc: "Se os modos de mapa de Governador Recomendado e Capital Recomendada assumem uma infraestrutura naval ideal ou usam sua capacidade portuária e presença naval atuais."
 cm__placement_finder_naval_option_1_name: "$cm_txt_current$"
 cm__placement_finder_naval_option_1_desc: "Usa sua capacidade portuária e presença naval atual."
 cm__placement_finder_naval_option_2_name: "Presença Máxima"
 cm__placement_finder_naval_option_2_desc: "Considere presença naval total em todos os lugares, com sua capacidade portuária atual."
 cm__placement_finder_naval_option_3_name: "$cm_txt_best_possible$"
 cm__placement_finder_naval_option_3_desc: "Presuma presença naval total e os melhores edifícios portuários que você desbloqueou, construídos em todas as localidades costeiras."
 cm__placement_finder_accuracy_name: "Precisão da Busca"
 cm__placement_finder_accuracy_desc: "O quão minuciosamente os modos de mapa de Governador Recomendado e Capital Recomendada buscam pelos melhores locais. Locais ignorados aparecem em preto."
 cm__placement_finder_accuracy_option_1_name: "Exaustivo"
 cm__placement_finder_accuracy_option_1_desc: "Avaliar cada localidade. O mais preciso e o mais lento."
 cm__placement_finder_accuracy_option_2_name: "Minucioso"
 cm__placement_finder_accuracy_option_2_desc: "Pule locais que não podem se classificar entre os três melhores. Os três melhores e suas pontuações são idênticos ao modo Exaustivo, apenas mais rápido."
 cm__placement_finder_accuracy_option_3_name: "Equilibrado"
 cm__placement_finder_accuracy_option_3_desc: "Pular locais que não podem ser o melhor absoluto. O melhor local ainda é garantido como exato; os marcadores de 2º e 3º lugares podem ocasionalmente diferir."
 cm__placement_finder_accuracy_option_4_name: "Rápido"
 cm__placement_finder_accuracy_option_4_desc: "Também ignora locais com pouca probabilidade de serem os melhores. O melhor local encontrado fica dentro de uma margem de 20% do melhor real e geralmente ainda é o exato."
 cm__placement_finder_accuracy_option_5_name: "Mais Rápido"
 cm__placement_finder_accuracy_option_5_desc: "Avalia a localização mais promissora de cada província e, em seguida, refina em torno das líderes. Muito mais rápido para países grandes; pode deixar passar a melhor localização."
 cm__debug_name: "$cm_txt_debug$"
 cm__debug__logging_name: "Registro de Ações"
 cm__debug__logging_desc: "Quais das ações deste mod são registradas no log de ações do mod."
 cm__log_cycle_name: "Ciclo de Construção"
 cm__log_cycle_desc: "Linhas para um ciclo mensal que foi ignorado porque o anterior ainda estava processando, e para a redefinição que segue dois saltos seguidos."
 cm__log_food_name: "$cm__ab_food_name$"
 cm__log_food_desc: "Linhas para a categoria de Alimentos: oferta, demanda e proporção mensal de alimentos de cada mercado, a mediana anual pela qual essa proporção é julgada em relação à meta, a contagem de locais que já cultivam alimentos ali e cada local que ele ativa ou desativa."
 cm__log_roads_name: "$cm__ab_roads_name$"
 cm__log_roads_desc: "Uma linha para cada estrada que a categoria Estradas ordena, nomeando o local, para qual das três finalidades a estrada foi comprada e o seu custo."
 cm__log_cleanup_name: "$cm__cleanup_name$"
 cm__log_cleanup_desc: "Linhas para o processamento anual de Limpeza de Edifícios e para cada edifício que ele fecha, reduz, destrói ou reabre, com o lucro de cada um e o piso em relação ao qual foi avaliado."
 cm__log_governors_name: "$cm__ab_governors_name$"
 cm__log_governors_desc: "Linhas para o plano do governador: locais selecionados e descartados, melhorias de vilas e cidades, posicionamentos, relocações e recusas, além da mudança de capital de uma nação sortuda."
 cm__log_military_name: "$cm_txt_lucky_nation_military$"
 cm__log_military_desc: "Linhas para uma nação de sorte destruindo fortes e construindo edifícios de efetivo."
 cm__log_government_name: "Governo de Nação Sortuda"
 cm__log_government_desc: "Linhas para uma nação sortuda removendo uma burocracia ou realizando uma ação de estamento."
 cm__debug__diagnostics_name: "Diagnósticos"
 cm__placement_finder_debug_path_name: "Ativar Diagnósticos de Depuração"
 cm__placement_finder_debug_path_desc: "Adiciona um bloco de diagnóstico às dicas de interface dos modos de mapa Governador Recomendado e Capital Recomendada: a rota prevista da sua capital para cada localidade com o custo de cada salto, e a proximidade prevista comparada à sua proximidade real."
 cm__debug__probes_name: "Sondas"
 cm__debug__probes_desc: "Diagnósticos pontuais registrados no log de ações do mod."
 cm__probe_budget_name: "Orçamento de Construção Automática"
 cm__probe_budget_desc: "O saldo de cada categoria de Construção Automática, positivo onde retém ouro para uma escolha que ainda não pode custear e negativo onde deve por gastos excessivos, seguido pelo ouro que nenhuma categoria gastaria no mês passado, o limite de retorno de Produção e o melhor candidato aguardando em um mercado que este ciclo ignorou."
 cm__probe_budget_text: "$cm_txt_run$"
 cm__probe_governors_name: "Plano do Governador"
 cm__probe_governors_desc: "Onde o plano do governador chegou: sua fase, quantos locais ele possui e ainda tem para posicionar, se ele está retendo o tesouro, os governadores pagos e os espaços e assentos com os quais está trabalhando."
 cm__probe_governors_text: "$cm_txt_run$"
 cm__probe_military_name: "$cm_txt_lucky_nation_military$"
 cm__probe_military_desc: "O nível de construção de reserva militar do país, se pode construí-lo, o estado do par da capital, o orçamento militar e quantas localidades podem comportar o nível em relação a quantas já o possuem."
 cm__probe_military_text: "$cm_txt_run$"
 cm__probe_roads_name: "$cm__ab_roads_name$"
 cm__probe_roads_desc: "Quantos corredores o plano de Estradas contém para cada proximidade, acesso ao mercado e conexão com a capital, quantos dos da capital já podem ser iniciados, quantas estradas já estão sendo construídas, quantas estão bloqueadas por falta de bens de construção no mercado e o que resta na reserva da categoria."
 cm__probe_roads_text: "$cm_txt_run$"
 cm__probe_log_gate_name: "Filtro do Registro de Ações"
 cm__probe_log_gate_desc: "A categoria de registro de Bens Centrais aparece duas vezes, conforme o filtro de registro a lê e conforme o menu a armazena, de modo que uma categoria que esteja ativada em um e desativada no outro seja exibida."
