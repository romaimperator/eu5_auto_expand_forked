 cm__dbg_run_auto_build_name: "Executar Construção Automática"
 cm__dbg_run_auto_build_desc: "Processa agora todas as categorias ativadas na lista, em vez de esperar pela virada do mês. Cada uma gasta o que restou de sua cota, portanto uma categoria que já gastou no mês não constrói nada. Pausar Automação não a impede."
