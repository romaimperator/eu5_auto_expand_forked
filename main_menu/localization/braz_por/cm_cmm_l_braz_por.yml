 cm__ab_food__ab_food_name: "$cm__ab_food_name$" # NO-TRANSLATE
 cm__ab_food_target_name: "Meta de Excedente"
 cm__ab_food_target_desc: "Um mercado recebe mais locais de alimentos até que sua oferta atinja esta proporção de sua demanda. Em 125%, a produção de alimentos é expandida em qualquer mercado cujo mês mediano do ano não tenha atingido um excedente de 25%. Aumente para manter uma margem maior, diminua para ajudar apenas mercados próximos de uma escassez."
 cm__ab_food_target_format: "[CMMV('cm__ab_food_target')]%" # NO-TRANSLATE
 cm__ab_food_min_potential_name: "Potencial Mínimo de Alimento"
 cm__ab_food_min_potential_desc: "A auto-alimentação só é habilitada em locais cujo potencial de comida por nível de RGO atinja esta pontuação, a mesma pontuação que o modo de mapa $mapmode_cm_location_food_potential_name$ mostra. Aumente-a para esperar por terras agrícolas melhores, diminua-a para aceitar terras mais fracas."
 cm__ab_food_min_potential_format: "[CMMV('cm__ab_food_min_potential')]" # NO-TRANSLATE
 cm__ab_food_subsidize_name: "Subsidiar Edifícios de Alimentos"
 cm__ab_food_subsidize_desc: "Subsidie os edifícios produtores de alimento construídos pelo autoalimento. Um edifício que não gera lucro não contrata ninguém e não produz alimento, de modo que uma vila agrícola em terras pobres permanece ociosa; subsidiá-la mantém o seu quadro de funcionários e garante a sua colheita. Os subsídios nunca são desativados."
 cm__ab_food_run_now_name: "Forçar Replanejamento de Alimentos"
 cm__ab_food_run_now_desc: "Selecione novamente os locais de alimentos agora, julgando pelo saldo de alimentos deste mês juntamente com os meses já amostrados, em vez de esperar pela verificação anual."
 cm__ab_food_run_now_text: "$cm_txt_run_now$" # NO-TRANSLATE
