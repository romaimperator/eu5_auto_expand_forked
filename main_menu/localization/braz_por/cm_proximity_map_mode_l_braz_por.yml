l_braz_por:
 mapmode_cm_location_proximity_modifier_name: "Impacto da Eficiência de Proximidade"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER: "#T $mapmode_cm_location_proximity_modifier_name$#!\nColore [locations|e] pelo seu Impacto na Eficiência de Proximidade: a penalidade combinada que seu [topography|e] e [vegetation|e] impõem a [proximity|e] (montanhas, colinas, planaltos, pântanos, florestas, selvas, etc.). Verde significa que o terreno não prejudica a proximidade; vermelho significa que prejudica pesadamente. As penalidades de topografia são escalonadas pelos bônus de impacto de proximidade do proprietário, como terreno da capital ou avanços; locais sem proprietário mostram valores de terreno base. Um [road|e] ou [river|e] em um local cancela sua penalidade de [vegetation|e]; a penalidade de [topography|e] sempre se aplica."
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_LAND: "Impacto da Eficiência de Proximidade: [ROOT.GetLocation.MakeScope.ScriptValue('cm_location_proximity_modifier')|+=%]"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_LAND_HARBOR: "Impacto da Eficiência de Proximidade: [ROOT.GetLocation.MakeScope.ScriptValue('cm_location_proximity_modifier')|+=%]\nAdequação de Porto Natural: [ROOT.GetLocation.GetModifierValueFixed('natural_harbor_suitability')|0%]"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER: "[ROOT.GetLocation.GetName] não é terra, portanto não tem Impacto de Eficiência de Proximidade."

 cm_location_proximity_modifier_none_legend_key: "0% (sem penalidade)"
 cm_location_proximity_modifier_light_legend_key: "-25% (leve)"
 cm_location_proximity_modifier_noticeable_legend_key: "-35% (notável)"
 cm_location_proximity_modifier_moderate_legend_key: "-50% (moderado)"
 cm_location_proximity_modifier_heavy_legend_key: "-65% (pesado)"
 cm_location_proximity_modifier_severe_legend_key: "-75% (grave)"
 cm_location_proximity_modifier_worst_legend_key: "-100% (pior)"
 cm_location_proximity_modifier_harbor_legend_key: "Adequação de Porto Natural (listrado)"
