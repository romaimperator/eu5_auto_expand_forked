l_braz_por:
 mapmode_cm_location_proximity_modifier_name: "Impacto da Eficiência de Proximidade"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER: "#T $mapmode_cm_location_proximity_modifier_name$#!\nColore [locations|e] por seu $mapmode_cm_location_proximity_modifier_name$: a penalidade combinada que seu [topography|e] e [vegetation|e] impõem à [proximity|e] (montanhas, colinas, planaltos, pântanos, florestas, selvas, etc.). Verde significa que o terreno não prejudica a proximidade; vermelho significa que prejudica muito. As penalidades de topografia são escalonadas pelos bônus de impacto de proximidade do proprietário, como terreno da capital ou avanços; locais sem proprietário mostram valores de terreno base. Um [road|e] ou [river|e] em um local cancela sua penalidade de [vegetation|e]; a penalidade de [topography|e] sempre se aplica.\n\nA água mostra a [maritime_presence|e] que o [country|e] selecionado possui lá, do verde no nível mais baixo, passando pelo verde-claro, até o azul-claro no máximo. Uma alta presença reduz a [proximity|e] perdida ao cruzar um [seazone|e]."
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_LAND: "$mapmode_cm_location_proximity_modifier_name$: [ROOT.GetLocation.MakeScope.ScriptValue('cm_location_proximity_modifier')|+=%]"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_LAND_HARBOR: "$MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_LAND$\nAdequação de Porto Natural: [ROOT.GetLocation.GetModifierValueFixed('natural_harbor_suitability')|0%]"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER: "[ROOT.GetLocation.GetName] não é terra, então não possui $mapmode_cm_location_proximity_modifier_name$, e o [country|e] selecionado não possui [maritime_presence|e] aqui."

 cm_location_proximity_modifier_none_legend_key: "0% (sem penalidade)"
 cm_location_proximity_modifier_light_legend_key: "-25% (leve)"
 cm_location_proximity_modifier_noticeable_legend_key: "-35% (notável)"
 cm_location_proximity_modifier_moderate_legend_key: "-50% (moderado)"
 cm_location_proximity_modifier_heavy_legend_key: "-65% (pesado)"
 cm_location_proximity_modifier_severe_legend_key: "-75% (grave)"
 cm_location_proximity_modifier_worst_legend_key: "-100% (pior)"
 cm_location_proximity_modifier_harbor_legend_key: "Adequação de Porto Natural (listrado)"
 cm_location_proximity_modifier_maritime_none_legend_key: "Sem Presença Marítima (mar aberto)"
 cm_location_proximity_modifier_maritime_low_legend_key: "Baixa Presença Marítima"
 cm_location_proximity_modifier_maritime_half_legend_key: "50% de Presença Marítima"
 cm_location_proximity_modifier_maritime_full_legend_key: "100% Presença Marítima"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER_M0: "[maritime_presence|E]: 0-10%"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER_M10: "[maritime_presence|E]: 10-20%"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER_M20: "[maritime_presence|E]: 20-30%"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER_M30: "[maritime_presence|E]: 30-40%"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER_M40: "[maritime_presence|E]: 40-50%"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER_M50: "[maritime_presence|E]: 50-60%"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER_M60: "[maritime_presence|E]: 60-70%"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER_M70: "[maritime_presence|E]: 70-80%"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER_M80: "[maritime_presence|E]: 80-90%"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER_M90: "[maritime_presence|E]: 90-100%"
