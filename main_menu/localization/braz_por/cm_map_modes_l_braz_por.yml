l_braz_por:
 mapmode_cm_breadbasket_name: "Celeiros"
 MAPMODE_CM_BREADBASKET: "#T $mapmode_cm_breadbasket_name$#!\nDestaca suas [locations|e] onde o auto-alimento está atualmente configurado para funcionar."
 MAPMODE_CM_BREADBASKET_TT_ENABLED: "[ROOT.GetLocation.GetName] está configurado para auto-comida."
 MAPMODE_CM_BREADBASKET_TT_OWNED: "[ROOT.GetLocation.GetName] é seu, mas não possui a auto-comida ativada."
 MAPMODE_CM_BREADBASKET_TT_FOREIGN: "[ROOT.GetLocation.GetName] não lhe pertence."
 MAPMODE_CM_BREADBASKET_TT_UNCOLONIZED: "[ROOT.GetLocation.GetName] não está colonizado."
 MAPMODE_CM_BREADBASKET_TT_WATER: "[ROOT.GetLocation.GetName] é uma zona marítima."

 cm_breadbasket_enabled_legend_key: "Auto-comida ativado"
 cm_breadbasket_owned_legend_key: "Suas outras localizações"
 cm_breadbasket_foreign_legend_key: "Localizações estrangeiras"
 cm_breadbasket_uncolonized_legend_key: "Não colonizada"

 mapmode_cm_location_food_potential_name: "Potencial de Alimentos por Nível de RGO"
 MAPMODE_CM_LOCATION_FOOD_POTENTIAL: "#T $mapmode_cm_location_food_potential_name$#!\nIsso colore [locations|e] pelo seu potencial de alimento natural por nível de [rgo|e]. A pontuação combina o valor de [rgo|e] [food|e], o [food_productivity|e] cumulativo (terreno, vegetação, clima, modificadores estáticos nomeados como o Mercado de Arenque de Skane ou Delta do Nilo Fértil, modificadores de produção específicos de [rgo|e], etc.), acesso a água e os bônus máximos presumidos de [ShowBuildingTypeName('windmill')], [ShowBuildingTypeName('farming_village')] e [ShowBuildingTypeName('irrigation_systems')] onde o [rgo|e] permitir.\n\nA contribuição de [development|e] é excluída para que a pontuação reflita o puro potencial do terreno, em vez de um registro do investimento atual."
 mapmode_cm_location_food_potential_hidden_name: "$mapmode_cm_location_food_potential_name$"
 MAPMODE_CM_LOCATION_FOOD_POTENTIAL_HIDDEN: "$MAPMODE_CM_LOCATION_FOOD_POTENTIAL$"
 MAPMODE_CM_LOCATION_FOOD_POTENTIAL_TT_LAND: "[ROOT.GetLocation.GetName] tem um potencial de comida por nível de [rgo|e] de [ROOT.GetLocation.MakeScope.ScriptValue('cm_location_food_potential')|1Y]."
 MAPMODE_CM_LOCATION_FOOD_POTENTIAL_TT_WATER: "[ROOT.GetLocation.GetName] não é terra, portanto não possui potencial de alimento."

 cm_location_food_potential_auto_food_legend_key: "Autoalimento ativado (listrado)"
 cm_location_food_potential_bright_green_legend_key: "45 (máximo possível)"
 cm_location_food_potential_green_legend_key: "27.5 (excelente)"
 cm_location_food_potential_yellow_legend_key: "20 (bom)"
 cm_location_food_potential_orange_legend_key: "12.5 (decente)"
 cm_location_food_potential_red_legend_key: "3.75 (baixo)"
 cm_location_food_potential_black_legend_key: "0 (nenhum)"
