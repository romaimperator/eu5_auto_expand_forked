l_braz_por:
 mapmode_cm_breadbasket_name: "Celeiros"
 MAPMODE_CM_BREADBASKET: "#T $mapmode_cm_breadbasket_name$#!\nDestaca seus [locations|e] onde a comida automática está atualmente configurada para funcionar."
 MAPMODE_CM_BREADBASKET_TT_ENABLED: "[ROOT.GetLocation.GetName] está configurado para autocomida."
 MAPMODE_CM_BREADBASKET_TT_OWNED: "[ROOT.GetLocation.GetName] é seu, mas não possui a alimentação automática habilitada."
 MAPMODE_CM_BREADBASKET_TT_FOREIGN: "[ROOT.GetLocation.GetName] não é seu."
 MAPMODE_CM_BREADBASKET_TT_UNCOLONIZED: "[ROOT.GetLocation.GetName] não está colonizado."
 MAPMODE_CM_BREADBASKET_TT_WATER: "$cm_txt_tt_sea_zone$"

 cm_breadbasket_enabled_legend_key: "Alimentação automática ativada"
 cm_breadbasket_owned_legend_key: "Suas outras localizações"
 cm_breadbasket_foreign_legend_key: "Localizações estrangeiras"
 cm_breadbasket_uncolonized_legend_key: "Não colonizado"

 mapmode_cm_location_food_potential_name: "Potencial de Alimento por Nível de RGO"
 MAPMODE_CM_LOCATION_FOOD_POTENTIAL: "#T $mapmode_cm_location_food_potential_name$#!\nIsso colore [locations|e] pelo seu potencial natural de alimentos por nível de [rgo|e]. A pontuação combina o valor de [rgo|e] [food|e], o [food_productivity|e] cumulativo (terreno, vegetação, clima, modificadores estáticos nomeados como o Mercado de Arenque de Skane ou o Delta Fértil do Nilo, modificadores de produção específicos de [rgo|e], etc.), acesso à água e os bônus máximos presumidos de [ShowBuildingTypeName('windmill')], [ShowBuildingTypeName('farming_village')] e [ShowBuildingTypeName('irrigation_systems')] onde o [rgo|e] permite.\n\n[development|e] é excluído e cada [location|e] é pontuado como se fosse um assentamento rural, de modo que a pontuação mostra o potencial do terreno em vez da produção atual."
 mapmode_cm_location_food_potential_hidden_name: "$mapmode_cm_location_food_potential_name$"
 MAPMODE_CM_LOCATION_FOOD_POTENTIAL_HIDDEN: "$MAPMODE_CM_LOCATION_FOOD_POTENTIAL$"
 MAPMODE_CM_LOCATION_FOOD_POTENTIAL_TT_LAND: "[ROOT.GetLocation.GetName] tem um potencial de alimento por nível de [rgo|e] de [ROOT.GetLocation.MakeScope.ScriptValue('cm_location_food_potential')|1Y]."
 MAPMODE_CM_LOCATION_FOOD_POTENTIAL_TT_WATER: "[ROOT.GetLocation.GetName] não é terra, portanto não possui potencial de alimento."

 cm_location_food_potential_auto_food_legend_key: "Auto-alimento ativado (listrado)"
 cm_location_food_potential_bright_green_legend_key: "45 (máximo possível)"
 cm_location_food_potential_green_legend_key: "27.5 (excelente)"
 cm_location_food_potential_yellow_legend_key: "20 (bom)"
 cm_location_food_potential_orange_legend_key: "12.5 (decente)"
 cm_location_food_potential_red_legend_key: "3.75 (baixo)"
 cm_location_food_potential_black_legend_key: "0 (nenhum)"
