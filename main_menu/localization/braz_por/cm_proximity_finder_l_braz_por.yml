 # Action bar refresh button
 cm_pf_refresh: "cm_pf_refresh"
 cm_pf_refresh_color: "turquesa escuro"
 cm_pf_refresh_icon: "@cm_pf_refresh!"
 cm_pf_refresh_name: "Recalcular Pontuações de Posicionamento"
 cm_pf_refresh_tooltip: "Força um novo cálculo das pontuações de posicionamento do governador e da capital para as fronteiras atuais. Caso contrário, as pontuações são reutilizadas por até 4 anos."
 cm_pf_estimate_note: "Esta é uma estimativa: a configuração de Pontuação do Localizador de Posicionamento define se os locais são classificados pela base tributária ou por [proximity|e] bruto, e as configurações de Infraestrutura Terrestre e Infraestrutura Naval definem as estradas, edifícios e [maritime_presence|e] que ele assume. Ele recalcula quando você abre este modo de mapa, no máximo uma vez a cada 4 anos; use o botão de atualizar da barra de ações para forçar um novo cálculo. As cores são atualizadas quando ele termina."
 cm_pf_tt_no_data: "Ainda não pontuado. Use o botão de atualizar da barra de ações para calcular as pontuações das fronteiras atuais."
 cm_pf_tt_skipped: "Não avaliado: a configuração de Precisão de Busca ignorou esta localização. Defina-a como Exaustiva e atualize para avaliar cada localização."
 cm_pf_tt_foreign: "Não faz parte do seu país."
 cm_pf_source_legend: "Fonte de proximidade existente (listrado)"
 cm_pf_of_best: "do Melhor"
 cm_pf_gov_tt_head: "Ganho médio máximo previsto de [proximity|e]: +[ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_gf_avg_value')|1]%\nBase tributária máxima prevista obtida de [proximity|e]: +[ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_gf_taxgain_value')|1]"
 cm_pf_gov_source_line: "Fonte de [proximity|e] existente: [ROOT.GetLocation.GetModifierValueFixed('local_proximity_source')|0]"
 cm_pf_cap_tt_head: "Média máxima prevista de [proximity|e] com capital: [ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_cf_avg_value')|1]%\nBase tributária máxima prevista de [proximity|e]: +[ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_cf_taxgain_value')|1]"
