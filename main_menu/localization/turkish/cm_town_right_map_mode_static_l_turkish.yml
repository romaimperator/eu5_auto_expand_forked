 MAPMODE_CM_BEST_TOWN_RIGHT: "#T $mapmode_cm_best_town_right_name$#!\nHer [location|e]'yi, güçlendirilen binaları girdi [goods|e]'larının en büyük payını [province|e]'nin [rgo|e]'lerinden tedarik edebilen [town_rights|e] uzmanlaşmasına göre renklendirir. Her uzmanlaşma seçeneğinin sıralamasını görmek için bir [location|e] üzerine gelin.\nEn iyi üretim yönteminin girdilerinin dökümünü görmek için ipucundaki bir sanayi yüzdesinin üzerine gelin.\nEn iyi sonuçlardaki eşitlikler çizgili ikinci bir renk olarak gösterilir: eşitlenen uzmanlaşmanın rengi veya 3+ eşitlik olduğunda özel bir renk."
 MAPMODE_CM_BEST_TOWN_RIGHT_TT_NONE: "[ROOT.GetLocation.GetProvince.GetName] uzmanlaşmış endüstriler tarafından kullanılan [raw_material|e] kaynağına sahip değil.[ROOT.GetLocation.Custom('cm_trmm_stripe_reason')]"
