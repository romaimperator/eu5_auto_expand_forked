 mapmode_cm_location_food_potential_name: "RGO Seviyesi Başına Gıda Potansiyeli"
 MAPMODE_CM_LOCATION_FOOD_POTENTIAL: "#T $mapmode_cm_location_food_potential_name$#!\nBu, [locations|e] öğelerini [rgo|e] seviyesi başına doğal gıda potansiyellerine göre renklendirir. Puan; [rgo|e] [food|e] değerini, kümülatif [food_productivity|e] (arazi, bitki örtüsü, iklim, Skåne Ringa Balığı Pazarı veya Verimli Nil Deltası gibi adlandırılmış statik değiştiriciler, [rgo|e] özel çıktı değiştiricileri vb.), suya erişimi ve [rgo|e] elverdiği ölçüde [ShowBuildingTypeName('windmill')], [ShowBuildingTypeName('farming_village')] ve [ShowBuildingTypeName('irrigation_systems')] kaynaklı varsayılan maksimum bonusları birleştirir.\n\n[development|e] katkısı hariç tutulmuştur, böylece puan mevcut yatırımın anlık görüntüsünü değil, saf arazi potansiyelini yansıtır."
 mapmode_cm_location_food_potential_hidden_name: "$mapmode_cm_location_food_potential_name$"
 MAPMODE_CM_LOCATION_FOOD_POTENTIAL_HIDDEN: "$MAPMODE_CM_LOCATION_FOOD_POTENTIAL$"
 MAPMODE_CM_LOCATION_FOOD_POTENTIAL_TT_LAND: "[ROOT.GetLocation.GetName], her [rgo|e] seviyesi başına [ROOT.GetLocation.MakeScope.ScriptValue('cm_location_food_potential')|1Y] yiyecek potansiyeline sahiptir."
 MAPMODE_CM_LOCATION_FOOD_POTENTIAL_TT_WATER: "[ROOT.GetLocation.GetName] kara olmadığı için gıda potansiyeline sahip değildir."

