 mapmode_cm_location_food_potential_name: "RGO Seviyesi Başına Gıda Potansiyeli"
 MAPMODE_CM_LOCATION_FOOD_POTENTIAL: "#T $mapmode_cm_location_food_potential_name$#!\nBu, [locations|e] ögelerini [rgo|e] seviyesi başına doğal gıda potansiyellerine göre renklendirir. Puan; [rgo|e] [food|e] değerini, birikimli [food_productivity|e] değerini (arazi, bitki örtüsü, iklim, Skåne Ringa Pazarı veya Verimli Nil Deltası gibi isimlendirilmiş statik düzenleyiciler, [rgo|e]-özel üretim düzenleyicileri vb.), su erişimini ve [rgo|e] izin verdiği yerlerde [ShowBuildingTypeName('windmill')], [ShowBuildingTypeName('farming_village')] ve [ShowBuildingTypeName('irrigation_systems')] kaynaklı varsayılan maksimum bonusları birleştirir.\n\n[development|e] hariç tutulmuştur, bu nedenle puan mevcut üretimden ziyade arazi potansiyelini gösterir."
 mapmode_cm_location_food_potential_hidden_name: "$mapmode_cm_location_food_potential_name$"
 MAPMODE_CM_LOCATION_FOOD_POTENTIAL_HIDDEN: "$MAPMODE_CM_LOCATION_FOOD_POTENTIAL$"
 MAPMODE_CM_LOCATION_FOOD_POTENTIAL_TT_LAND: "[ROOT.GetLocation.GetName], [rgo|e] seviyesi başına [ROOT.GetLocation.MakeScope.ScriptValue('cm_location_food_potential')|1Y] gıda potansiyeline sahiptir."
 MAPMODE_CM_LOCATION_FOOD_POTENTIAL_TT_WATER: "[ROOT.GetLocation.GetName] kara değildir, bu yüzden gıda potansiyeline sahip değildir."

