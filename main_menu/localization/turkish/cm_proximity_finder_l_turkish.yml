 # Action bar refresh button
 cm_pf_refresh: "cm_pf_refresh"
 cm_pf_refresh_color: "koyu turkuaz"
 cm_pf_refresh_icon: "@cm_pf_refresh!"
 cm_pf_refresh_name: "Yerleştirme Puanlarını Yeniden Hesapla"
 cm_pf_refresh_tooltip: "Mevcut sınırlar için vali ve başkent yerleşimi puanlarının yeniden hesaplanmasını zorla. Aksi takdirde puanlar 4 yıla kadar yeniden kullanılır."
 cm_pf_estimate_note: "Bu bir tahmindir: Yerleşim Bulucu Puanlama ayarı, konumların vergi matrahına, nüfusa veya ham [proximity|e] değerine göre mi sıralanacağını seçer; Kara Altyapısı ve Deniz Altyapısı ayarları ise varsayılan yolları, binaları ve [maritime_presence|e] ögelerini seçer. Bu harita modunu açtığınızda, en fazla 4 yılda bir kez yeniden hesaplanır; yeni bir hesaplamayı zorlamak için aksiyon çubuğundaki yenile düğmesini kullanın. İşlem bittiğinde renkler yenilenir."
 cm_pf_tt_no_data: "Henüz puanlanmadı. Mevcut sınırlar için puanları hesaplamak üzere eylem çubuğundaki yenile düğmesini kullanın."
 cm_pf_tt_skipped: "Değerlendirilmedi: Arama Doğruluğu ayarı bu konumu atladı. Her konumu değerlendirmek için ayarı Kapsamlı olarak belirleyin ve yenileyin."
 cm_pf_tt_foreign: "Ülkenizin bir parçası değil."
 cm_pf_source_legend: "Mevcut yakınlık kaynağı (çizgili)"
 cm_pf_of_best: "En İyinin"
 cm_pf_gov_tt_head: "Öngörülen maksimum ortalama [proximity|e] kazancı: +%[ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_gf_avg_value')|1]\n[proximity|e] kaynağından elde edilen maksimum öngörülen vergi matrahı: +[ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_gf_taxgain_value')|1]\nKazanılan [proximity|e] ile ağırlıklandırılmış, ulaşılan maksimum öngörülen nüfus: +[ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_gf_popgain_value')|1]k"
 cm_pf_gov_source_line: "Mevcut [proximity|e] kaynağı: [ROOT.GetLocation.GetModifierValueFixed('local_proximity_source')|0]"
 cm_pf_cap_tt_head: "Başkent ile tahmini maksimum ortalama [proximity|e]: %[ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_cf_avg_value')|1]\n[proximity|e] üzerinden tahmini maksimum vergi matrahı: +[ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_cf_taxgain_value')|1]\n[proximity|e] ile ağırlıklandırılmış, ulaşılan tahmini maksimum nüfus: +[ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_cf_popgain_value')|1]k"
