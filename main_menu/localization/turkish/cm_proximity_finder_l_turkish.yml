l_turkish:
 mapmode_cm_governor_finder_name: "Önerilen Vali Yerleşimi"
 MAPMODE_CM_GOVERNOR_FINDER: "#T $mapmode_cm_governor_finder_name$#!\n[locations|e] alanlarınızı, [capital|e] ve mevcut kaynaklarınızın sağladığı yakınlık göz önüne alındığında, yeni bir Yerel Vali veya Deniz Valisi inşa etmenin ne kadar [proximity|e] ekleyeceğine göre renklendirir. Daha yeşil daha iyidir. Başkentiniz ve mevcut yakınlık kaynakları çizgilidir.\nBu bir tahmindir: Yerleşim Bulucu Puanlama ayarı, konumların vergi matrahına mı yoksa ham [proximity|e] değerine göre mi sıralanacağını belirler; Kara Altyapısı ve Deniz Altyapısı ayarları ise varsayılan yolları, binaları ve [maritime_presence|e] unsurlarını seçer. Bu harita modu açıldığında, en fazla 4 yılda bir olacak şekilde yeniden hesaplanır; yeni bir hesaplama için eylem çubuğu yenile düğmesini kullanın. İşlem bittiğinde renkler güncellenir."
 MAPMODE_CM_GOVERNOR_FINDER_TT_SCORED: "Öngörülen maks. ortalama [proximity|e] kazancı: +%[ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_gf_avg_value')|1]\n[proximity|e] üzerinden elde edilen öngörülen maks. vergi matrahı: +[ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_gf_taxgain_value')|1]\nPuan: En iyi konumunuzun %[ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_gf_pct_value')|0]'sı[ROOT.GetLocation.Custom('cm_pf_gf_status')]"
 MAPMODE_CM_GOVERNOR_FINDER_TT_BEST: "Öngörülen maksimum ortalama [proximity|e] kazancı: +%[ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_gf_avg_value')|1]\n[proximity|e] üzerinden kazanılan maksimum öngörülen vergi matrahı: +[ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_gf_taxgain_value')|1]\nEn iyi konumunuz"
 MAPMODE_CM_GOVERNOR_FINDER_TT_SCORED_DEBUG: "$MAPMODE_CM_GOVERNOR_FINDER_TT_SCORED$$CM_PF_DEBUG_BLOCK$"
 MAPMODE_CM_GOVERNOR_FINDER_TT_BEST_DEBUG: "$MAPMODE_CM_GOVERNOR_FINDER_TT_BEST$$CM_PF_DEBUG_BLOCK$"
 MAPMODE_CM_GOVERNOR_FINDER_TT_CAPITAL: "[capital|e] zaten buradan [proximity|e] yayıyor."
 MAPMODE_CM_GOVERNOR_FINDER_TT_CAPITAL_DEBUG: "$MAPMODE_CM_GOVERNOR_FINDER_TT_CAPITAL$$CM_PF_DEBUG_BLOCK$"
 MAPMODE_CM_GOVERNOR_FINDER_TT_SOURCE: "Mevcut [proximity|e] kaynağı: [ROOT.GetLocation.GetModifierValueFixed('local_proximity_source')|0]\n$MAPMODE_CM_GOVERNOR_FINDER_TT_SCORED$"
 MAPMODE_CM_GOVERNOR_FINDER_TT_SOURCE_DEBUG: "$MAPMODE_CM_GOVERNOR_FINDER_TT_SOURCE$$CM_PF_DEBUG_BLOCK$"
 MAPMODE_CM_GOVERNOR_FINDER_TT_SOURCE_NOGAIN: "Mevcut [proximity|e] kaynağı: [ROOT.GetLocation.GetModifierValueFixed('local_proximity_source')|0]\n$MAPMODE_CM_GOVERNOR_FINDER_TT_NOGAIN$"
 MAPMODE_CM_GOVERNOR_FINDER_TT_SOURCE_NOGAIN_DEBUG: "$MAPMODE_CM_GOVERNOR_FINDER_TT_SOURCE_NOGAIN$$CM_PF_DEBUG_BLOCK$"
 MAPMODE_CM_GOVERNOR_FINDER_TT_NOGAIN: "Bir vali en fazla 80 [proximity|e] sağlar ve bu konum [ROOT.GetLocation.Custom('cm_pf_nogain_basis')], bu nedenle buraya inşa edilen bir vali hiçbir şey eklemez."
 MAPMODE_CM_GOVERNOR_FINDER_TT_NOGAIN_DEBUG: "$MAPMODE_CM_GOVERNOR_FINDER_TT_NOGAIN$$CM_PF_DEBUG_BLOCK$"
 cm_pf_nogain_basis_current: "zaten en az o kadarına sahip"
 cm_pf_nogain_basis_assumed: "varsayılan altyapı dahilinde zaten en az o kadarına sahip olurdu"
