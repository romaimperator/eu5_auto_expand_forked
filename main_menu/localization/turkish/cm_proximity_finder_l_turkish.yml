 mapmode_cm_capital_finder_name: "Önerilen Başkent Konumu"
 MAPMODE_CM_CAPITAL_FINDER: "#T $mapmode_cm_capital_finder_name$#!\n[locations|e] alanınızı, oradaki bir [capital|e] yapısının [proximity|e] değerini ne kadar iyi yayacağına göre renklendirir. Mevcut valiler yok sayılır. Çizgili konumlar; mevcut başkent veya bir vali gibi halihazırda bir yakınlık kaynağına sahiptir.\nBu bir tahmindir: Yerleşim Bulucu Puanlaması ayarı, konumların vergi matrahına mı yoksa ham [proximity|e] değerine göre mi sıralanacağını belirler; Kara Altyapısı ve Deniz Altyapısı ayarları ise varsayılan yolları, binaları ve [maritime_presence|e] öğesini seçer. Bu harita modunu açtığınızda, en fazla 4 yılda bir yeniden hesaplanır; taze bir hesaplama için eylem çubuğu yenileme düğmesini kullanın. İşlem bittiğinde renkler yenilenir."
 MAPMODE_CM_CAPITAL_FINDER_TT_SCORED: "Başkent ile tahmin edilen maks. ortalama [proximity|e]: %[ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_cf_avg_value')|1]\n[proximity|e] kaynağından tahmin edilen maks. vergi matrahı: +[ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_cf_taxgain_value')|1]\nPuan: En iyi konumunuzun %[ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_cf_pct_value')|0]'sı[ROOT.GetLocation.Custom('cm_pf_cf_status')]"
 MAPMODE_CM_CAPITAL_FINDER_TT_BEST: "Başkent ile tahmin edilen maksimum ortalama [proximity|e]: %[ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_cf_avg_value')|1]\n[proximity|e] üzerinden tahmin edilen maksimum vergi matrahı: +[ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_cf_taxgain_value')|1]\nEn iyi konumunuz"
 MAPMODE_CM_CAPITAL_FINDER_TT_SCORED_DEBUG: "$MAPMODE_CM_CAPITAL_FINDER_TT_SCORED$$CM_PF_DEBUG_BLOCK$"
 MAPMODE_CM_CAPITAL_FINDER_TT_BEST_DEBUG: "$MAPMODE_CM_CAPITAL_FINDER_TT_BEST$$CM_PF_DEBUG_BLOCK$"
