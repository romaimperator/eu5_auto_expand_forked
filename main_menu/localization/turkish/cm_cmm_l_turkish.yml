l_turkish:
 # Mod
 cm_name: "İnşaat Yöneticisi"
 cm_desc: "EU5 inşaat deneyimini büyük ölçüde iyileştirmek için yeni otomasyonlar, filtreler ve harita modları ekleyen kapsamlı bir yaşam kalitesi modu."

 # Settings (settings) Tab
 cm__settings_name: "Ayarlar"
 ## Global Control (settings) Group
 cm__pause_auto_expand_name: "Otomasyonu Duraklat"
 cm__pause_auto_expand_desc: "Tüm otomasyon özelliklerini duraklatır: binaları otomatik genişletme, RGO'ları otomatik genişletme, tüm binaları yükseltme, otomatik inşa, başkent binalarını otomatik inşa, otomatik gıda, otomatik şehirleşme, kentsel hakları otomatik tanıma ve Tam Otomasyon."
 cm__minimum_gold_name: "Altın Rezervi"
 cm__minimum_gold_desc: "Tutulacak minimum altın rezervi. Tam Otomasyon hariç tüm otomasyon özellikleri için geçerlidir."
 cm__minimum_gold_format: "[CMMV('cm__minimum_gold')]@gold!"
 cm__allowed_building_overbuild_levels_name: "Aşırı İnşa Limiti"
 cm__allowed_building_overbuild_levels_desc: "Otomatik genişletmenin yeni inşaatları sıraya almayı durdurmasından önce bir konumun Desteklenen Bina Seviyeleri sınırını toplamda kaç bina seviyesi aşabileceği. Sıfırda, herhangi bir limit aşımına izin verilmez. 200+ değerinde sınır yoktur."

 ## Priority List Group
 cm__settings__priority_list_name: "İnşaat Otomasyonu"
 cm__settings__priority_list_desc: "Özellik önceliğini yeniden düzenlemek için sürükleyin. Her ay, etkinleştirilen özellikler yukarıdan aşağıya doğru çalışır; ancak Otomatik Kentleşme, her zaman diğer tüm özelliklerden ve Tam Otomasyon'dan sonra en son çalışır."
 cm__priority_list_item_column_name: "Özellik"
 cm__priority_list_i1_name: "Binaları Otomatik Genişlet"
 cm__priority_list_i1_desc: "Kârlı olduğunda, nüfus mevcut olduğunda ve altın miktarı Altın Rezervinizin üzerinde kaldığında çok seviyeli üretim ve üretim dışı binaları otomatik olarak genişletir. Diğer ülkelerin konumlarındaki yabancı binalar da dahil olmak üzere, bir konum veya tüm bir bina türü için otomatik genişletmenin açık olduğu yerlerde uygulanır."
 cm__priority_list_i2_name: "RGO'ları Otomatik Genişlet"
 cm__priority_list_i2_desc: "İşçiler mevcut olduğunda ve kaynaklar elverdiğinde, otomatik RGO genişletmenin etkin olduğu konumlarda RGO seviyelerini otomatik olarak genişletir."
 cm__priority_list_i3_name: "Otomatik İnşa"
 cm__priority_list_i3_desc: "Otomatik İnşa sekmesinde yapılandırılan sıraya ve ayarlara göre; başkent binalarını ve konum başına bir adet inşa edilebilen binaları (konseyler, kütüphaneler vb.) otomatik olarak inşa eder."
 cm__priority_list_i4_name: "Otomatik Gıda"
 cm__priority_list_i4_desc: "Kırsal konumlarda, gıda açısından en verimli seçeneği tercih ederek gıda üreten RGO'ları ve binaları otomatik olarak inşa eder. Otomatik Gıda sekmesinden yapılandırılır."
 cm__priority_list_i5_name: "Otomatik Şehirleşme"
 cm__priority_list_i5_desc: "Her ay bölge kademelerini yükseltir: kırsal yerleşimleri kasabalara, kasabaları şehirlere ve şehirleri megalopolislere. Fethedilen bölgeleri atlar. Otomatik Şehirleşme sekmesinden yapılandırılır."
 cm__priority_list_i6_name: "Tüm Binaları Otomatik Yükselt"
 cm__priority_list_i6_desc: "O bina için otomatik genişletmenin etkin olup olmadığına bakılmaksızın, güncelliğini yitirmiş her binayı otomatik olarak yükseltir."
 cm__priority_list__enabled_name: "Etkin"
 cm__priority_list__enabled_desc: "Bu özelliği etkinleştir veya devre dışı bırak."
 cm__priority_list__min_profit_name: "Min. Vergi Geliri"
 cm__priority_list__min_profit_desc: "İnşaat sıraya alınmadan önce seviye başına gereken minimum aylık altın miktarı. Kontrolü devre dışı bırakmak için 0'a ayarlayın."
 cm__priority_list__min_profit_postfix: "@gold!"
 cm__priority_list__min_discount_name: "Min İndirim"
 cm__priority_list__min_discount_desc: "İzin verilen maksimum inşaat malzemesi fiyat farkı. -%33'te, yalnızca malzemeler taban fiyatın %33 altındayken inşa eder. %0'da, yalnızca taban fiyatta veya altında inşa eder. +%33'te, fiyatlar taban fiyatın %33 üzerindeyken bile inşa eder."
 cm__priority_list__min_discount_postfix: "%"
 cm__priority_list__min_discount_prefix_high: "#R "
 cm__priority_list__min_discount_postfix_high: "%#!"
 cm__priority_list__min_discount_prefix_low: "#G "
 cm__priority_list__min_discount_postfix_low: "%#!"

