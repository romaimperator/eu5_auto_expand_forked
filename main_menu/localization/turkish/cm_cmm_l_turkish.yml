 # Auto-Urbanize (auto_urbanize) Tab
 cm__auto_urbanize_name: "Otomatik Şehirleşme"
 ## Auto-Urbanize Settings (auto_urbanize) Group
 cm__auto_urbanize__auto_urbanize_name: "Otomatik Kentleşme Ayarları"
 cm__auto_urbanize__auto_urbanize_desc: "Her ay hangi yerleşim kademesi yükseltmelerinin çalışacağını seçin."
 cm__urbanize_town_to_city_name: "Kasabadan Şehre"
 cm__urbanize_town_to_city_desc: "Her ay kriterleri karşılayan kasabaları şehre yükseltir."
 cm__urbanize_rural_to_town_name: "Kırsaldan Kasabaya"
 cm__urbanize_rural_to_town_desc: "Uygun kırsal yerleşimleri her ay kasabaya yükseltir. 30.000 nüfus (doğrudan şehir olmaya uygun) veya nüfus sınırına 1.000'den az mesafe kalmasını (aksi takdirde büyüme kırsal sınırda durur) gerektirir. Aşağıdaki yoksayma listesinde RGO'su işaretlenmiş olan konumlar atlanır. Toplu Otomatik Gıda (Mass Auto-Food) kapsamındaki konumlar da atlanır; böylece kırsal kalarak gıda üretmeye devam ederler."
