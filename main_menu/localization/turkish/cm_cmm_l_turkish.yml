 cm__dbg_run_auto_urbanize_name: "Otomatik Kentleşmeyi Çalıştır"
 cm__dbg_run_auto_urbanize_desc: "Rütbe yükseltmelerini artık ayın dönmesini beklemek yerine kendi başına çalıştırır. Başlattığı döngüde başka hiçbir şey inşa edilmez ve Pause Automation bunu engellemez."
