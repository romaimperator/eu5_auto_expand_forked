l_turkish:
 # Mod
 cm_name: "İnşaat Yöneticisi"
 cm_desc: "EU5 inşa deneyimini büyük ölçüde iyileştirmek için yeni otomasyonlar, filtreler ve harita modları ekleyen devasa bir yaşam kalitesi modu."

 # Settings (settings) Tab
 cm__settings_name: "Ayarlar"
 ## Global Control (settings) Group
 cm__pause_auto_expand_name: "Otomasyonu Duraklat"
 cm__pause_auto_expand_desc: "Tüm otomasyon özelliklerini duraklatır: binaları otomatik genişletme, RGO'ları otomatik genişletme, tüm binaları yükseltme, otomatik inşa etme, başkent binalarını otomatik inşa etme, otomatik gıda, otomatik kentleşme, kentsel hakları otomatik tanıma ve Tam Otomasyon."
 cm__minimum_gold_name: "Altın Rezervi"
 cm__minimum_gold_desc: "Tutulacak minimum altın rezervi. Tam Otomasyon dışındaki tüm otomasyon özellikleri için geçerlidir."
 cm__minimum_gold_format: "[CMMV('cm__minimum_gold')]@gold!"
 cm__allowed_building_overbuild_levels_name: "Aşırı İnşa Limiti"
 cm__allowed_building_overbuild_levels_desc: "Bir konumun, otomatik genişletme yeni inşaatları kuyruğa almayı durdurmadan önce Desteklenen Bina Seviyesi sınırını toplamda kaç bina seviyesi aşabileceğini belirler. Sıfırda hiçbir aşırı inşaya izin verilmez. 200+ değerinde sınır yoktur."

 ## Priority List Group
 cm__settings__priority_list_name: "İnşaat Otomasyonu"
 cm__settings__priority_list_desc: "Özellik önceliğini yeniden sıralamak için sürükleyin. Her ay, etkin özellikler yukarıdan aşağıya doğru çalışır; ancak Auto-Urbanize, diğer tüm özelliklerden ve Full Automation'dan sonra her zaman en son çalışır."
 cm__priority_list_item_column_name: "Özellik"
 cm__priority_list_i1_name: "Binaları Otomatik Genişlet"
 cm__priority_list_i1_desc: "Kârlı olduğunda, nüfus mevcut olduğunda ve altın miktarı Altın Rezervinizin üzerinde kaldığında çok seviyeli üretim ve üretim dışı binaları otomatik olarak genişletir. Bir konum veya tüm bir bina türü için otomatik genişletmenin açık olduğu yerlerde, diğer ülkelerin konumlarındaki yabancı binalar da dahil olmak üzere uygulanır."
 cm__priority_list_i2_name: "RGO'ları Otomatik Genişlet"
 cm__priority_list_i2_desc: "İşçiler mevcut olduğunda ve kaynaklar elverdiğinde, otomatik RGO genişletmenin etkin olduğu konumlarda RGO seviyelerini otomatik olarak genişletir."
 cm__priority_list_i3_name: "Otomatik İnşa"
 cm__priority_list_i3_desc: "Başkent binalarını ve konum başına bir adetle sınırlı binaları (meclisler, kütüphaneler vb.), Otomatik İnşa sekmesinde yapılandırılan sıraya ve ayarlara göre otomatik olarak inşa eder."
 cm__priority_list_i4_name: "Otomatik Gıda"
 cm__priority_list_i4_desc: "Kırsal yerlerde, en verimli gıda seçeneğini seçerek gıda üreten RGO'ları ve binaları otomatik olarak inşa eder. Otomatik Gıda sekmesinden yapılandırılır."
 cm__priority_list_i5_name: "Otomatik Kentleşme"
 cm__priority_list_i5_desc: "Her ay konum kademelerini yükseltir: kırsal yerleşimleri kasabalara, kasabaları şehirlere ve şehirleri megalopolislere. Fethedilmiş konumları atlar. Otomatik Şehirleşme sekmesinden yapılandırılır."
 cm__priority_list_i6_name: "Tüm Binaları Otomatik Yükselt"
 cm__priority_list_i6_desc: "Otomatik genişletmenin o bina için etkin olup olmadığına bakılmaksızın, geçerliliğini yitirmiş her binayı otomatik olarak yükseltir."
 cm__priority_list__enabled_name: "Etkin"
 cm__priority_list__enabled_desc: "Bu özelliği etkinleştirin veya devre dışı bırakın."
 cm__priority_list__min_profit_name: "Min. Vergi Geliri"
 cm__priority_list__min_profit_desc: "İnşaat sıraya alınmadan önce seviye başına gereken minimum aylık altın miktarı. Kontrolü devre dışı bırakmak için 0'a ayarlayın."
 cm__priority_list__min_profit_postfix: "@gold!"
 cm__priority_list__min_discount_name: "Min İndirim"
 cm__priority_list__min_discount_desc: "İzin verilen maksimum inşaat malzemesi fiyat farkı. -%33'te, yalnızca malzemeler taban fiyatın %33 altındayken inşa eder. %0'da, yalnızca taban fiyatta veya altında inşa eder. +%33'te, fiyatlar taban fiyatın %33 üzerindeyken bile inşa eder."
 cm__priority_list__min_discount_postfix: "%"
 cm__priority_list__min_discount_prefix_high: "#R "
 cm__priority_list__min_discount_postfix_high: "%#!"
 cm__priority_list__min_discount_prefix_low: "#G "
 cm__priority_list__min_discount_postfix_low: "%#!"

