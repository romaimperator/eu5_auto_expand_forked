 cm__dbg_run_auto_build_name: "Otomatik İnşayı Çalıştır"
 cm__dbg_run_auto_build_desc: "Artık ayın dönmesini beklemek yerine listedeki etkinleştirilmiş her kategoriyi sırayla işler. Her biri kendi payından geriye kalanı harcar, bu nedenle o ayki payını halihazırda harcamış olan bir kategori hiçbir şey inşa etmez. Otomasyonu Durdur seçeneği bunu engellemez."
