 cm__auto_urbanize_enabled_desc: "Otomatik şehirleşmeyi etkinleştir veya devre dışı bırak."
 cm__auto_urbanize_min_discount_name: "$cm_txt_min_discount$" # NO-TRANSLATE
 cm__auto_urbanize_min_discount_desc: "İzin verilen maksimum inşaat malzemesi fiyat artışı. %-33'te, kasaba ve şehirleri yalnızca malzeme maliyetleri taban fiyatın %33 altındayken kurar. %0'da, yalnızca taban fiyatta veya altında kurar. %+33'te, fiyatlar taban fiyatın %33 üzerindeyken bile onları kurar."
