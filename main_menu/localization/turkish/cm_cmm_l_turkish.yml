l_turkish:
 # Mod
 cm_name: "İnşaat Yöneticisi"
 cm_desc: "EU5 inşaat deneyimini büyük ölçüde iyileştirmek için yeni otomasyonlar, filtreler ve harita modları ekleyen devasa bir yaşam kalitesi modu."

 # Settings (settings) Tab
 cm__settings_name: "Ayarlar"
 ## Global Control (settings) Group
 cm__settings__settings_name: "Küresel Kontrol"
 cm__pause_auto_expand_name: "Otomasyonu Duraklat"
 cm__pause_auto_expand_desc: "Tüm otomasyon özelliklerini duraklatır: binaları otomatik genişletme, RGO'ları otomatik genişletme, tüm binaları yükseltme, otomatik inşa, otomatik gıda ve otomatik şehirleşme."
 cm__minimum_gold_name: "Altın Rezervi"
 cm__minimum_gold_desc: "Korunacak minimum altın rezervi. Hazine bu miktarın altına düşecekse inşaatlar sıraya alınmaz. Kendi altın ayarı olan otomatik şehirleşme yükseltmeleri dışındaki tüm otomasyon özellikleri için geçerlidir."
 cm__minimum_gold_format: "[CMMV('cm__minimum_gold')]@gold!"
 cm__allowed_building_overbuild_levels_name: "Aşırı İnşa Limiti"
 cm__allowed_building_overbuild_levels_desc: "Bir lokasyonun, otomatik genişletmenin yeni inşaatları sıraya almayı durdurmadan önce Desteklenen Bina Seviyeleri sınırını toplamda kaç bina seviyesi aşabileceğini belirler. Sıfır değerinde, herhangi bir sınır üstü inşaya izin verilmez."

 ## Priority List Group
 cm__settings__priority_list_name: "İnşaat Otomasyonu"
 cm__settings__priority_list_desc: "Özellik önceliğini yeniden düzenlemek için sürükleyin. Her ay, etkinleştirilen özellikler yukarıdan aşağıya doğru çalışır. Min. Vergilendirilebilir Kar, inşaatı sıraya koymak için gereken seviye başına minimum vergilendirilebilir karı belirler (0 = devre dışı). Min. İndirim, izin verilen maksimum inşaat malzemesi fiyat artışını belirler (-33% = sadece ucuzken, 0 = taban fiyatta, +33% = şişirilmiş olsa bile)."
 cm__priority_list_item_column_name: "Özellik"
 cm__priority_list_i1_name: "Binaları Otomatik Genişlet"
 cm__priority_list_i1_desc: "Kârlı olduğunda, nüfus mevcut olduğunda ve altın miktarı rezerv eşiğinin üzerinde olduğunda çok seviyeli üretim ve üretim dışı binaları otomatik olarak genişletir. Sadece otomatik genişletmenin açık olduğu konumlarda geçerlidir."
 cm__priority_list_i2_name: "RGO'ları Otomatik Genişlet"
 cm__priority_list_i2_desc: "İşçiler mevcut olduğunda ve kaynaklar elverdiğinde, otomatik RGO genişletmenin etkin olduğu konumlarda RGO seviyelerini otomatik olarak genişletir."
 cm__priority_list_i3_name: "Tüm Binaları Otomatik Yükselt"
 cm__priority_list_i3_desc: "O bina için otomatik genişletmenin etkin olup olmadığına bakılmaksızın, güncelliğini yitirmiş her binayı otomatik olarak yükseltir."
 cm__priority_list_i4_name: "Otomatik İnşa"
 cm__priority_list_i4_desc: "Otomatik İnşa sekmesinde yapılandırılan sıraya ve ayarlara göre, konum başına bir adet inşa edilebilen binaları (tapınaklar, kütüphaneler vb.) otomatik olarak inşa eder."
 cm__priority_list_i5_name: "Otomatik Gıda"
 cm__priority_list_i5_desc: "Kırsal lokasyonlarda, en yüksek marjinal gıda çıktısına sahip seçeneği seçerek gıda üreten RGO'ları ve binaları otomatik olarak inşa eder. Otomatik Gıda sekmesinden yapılandırılır."
 cm__priority_list_i6_name: "Otomatik Kentleşme"
 cm__priority_list_i6_desc: "Her ay yerleşim rütbelerini yükseltir: kırsal yerleşimleri kasabalara, kasabaları ise şehirlere dönüştürür. Kırsaldan kasabaya geçiş için 30.000 nüfus (doğrudan şehir olmaya uygun) veya nüfus sınırına 1.000'den az mesafe kalmış olması gerekir (aksi takdirde büyüme kırsal sınırda duracaktır). Entegre edilmemiş yerleşimleri atlar. Otomatik Şehirleşme sekmesinden yapılandırılır."
 cm__priority_list_i7_name: "Başkent Binalarını Otomatik İnşa Et"
 cm__priority_list_i7_desc: "Koşullar uygun olduğunda başkent konumunuzda otomatik olarak başkente özel binaları (kraliyet sarayı, yüksek mahkeme, harp akademisi vb.) inşa eder."
 cm__priority_list__enabled_name: "Etkin"
 cm__priority_list__enabled_desc: "Bu özelliği etkinleştirin veya devre dışı bırakın. Devre dışı bırakılan özellikler her ay atlanır."
 cm__priority_list__min_profit_name: "Minimum Vergilendirilebilir Kâr"
 cm__priority_list__min_profit_desc: "İnşaat sıraya alınmadan önce gereken seviye başına minimum vergilendirilebilir kâr: Kontrol hesaba katıldıktan sonraki bina veya RGO kârı. Denetimi devre dışı bırakmak için 0'a ayarlayın."
 cm__priority_list__min_profit_postfix: "@gold!"
 cm__priority_list__min_discount_name: "Min İndirim"
 cm__priority_list__min_discount_desc: "İzin verilen maksimum inşaat malzemesi fiyat farkı. -%33'te, yalnızca malzemeler taban fiyatın %33 altındayken inşa eder. %0'da, yalnızca taban fiyatta veya altında inşa eder. +%33'te, fiyatlar taban fiyatın %33 üzerindeyken bile inşa eder."
 cm__priority_list__min_discount_postfix: "Bu; binaların, RGO'ların (Kaynak Toplama Operasyonları), gıdanın ve daha fazlasının otomatik olarak genişletilmesini sağlayan İnşaat Yöneticisi modudur."
 cm__priority_list__min_discount_prefix_high: "#R "
 cm__priority_list__min_discount_postfix_high: "%#!"
 cm__priority_list__min_discount_prefix_low: "#G "
 cm__priority_list__min_discount_postfix_low: "%#!"

