 cm__ab_roads_proximity_name: "$cm_txt_proximity$" # NO-TRANSLATE
 cm__ab_roads_proximity_desc: "Altın başına Yakınlığı en çok artıran yol kısımlarını, güzergâh üzerinde kendilerinden sonra gelen her konumu hesaba katarak döşe."
 cm__ab_roads_market_access_name: "Pazar Erişimi"
 cm__ab_roads_market_access_desc: "Altın başına Pazar Erişimini en çok artıran yol bölümlerini döşe. Yalnızca Yakınlık'ın (Proximity) bir şey inşa etmediği ve henüz karşılayamadığı bir bölüm için para biriktirmediği aylarda harcama yapar."
 cm__ab_roads_capital_name: "Başkent Bağlantısı"
 cm__ab_roads_capital_desc: "Yerleşkelerinizi başkentinize bağlamak için, halihazırda bağlı olanlardan dışarıya doğru yol bölümleri döşer. Sadece hem Yakınlık hem de Pazar Erişimi'nin hiçbir şey inşa etmediği ve her ikisinin de henüz karşılayamadıkları bir bölüm için birikim yapmadığı aylarda harcama yapar."
 cm__ab_roads_min_discount_name: "$cm_txt_min_discount$" # NO-TRANSLATE
 cm__ab_roads_min_discount_desc: "İzin verilen maksimum inşaat malzemesi fiyat artışı. -%33'te, sadece gereken kereste, taş işçiliği ve kum maliyeti taban fiyatın %33 altında olduğunda bir inşaat dilimi döşer. %0'da, sadece taban fiyatta veya altında. +%33'te ise fiyatlar taban fiyatın %33 üzerinde olsa bile döşer."
 cm__ab_roads_min_discount_format: "[CMMV('cm__ab_roads_min_discount')]%" # NO-TRANSLATE
 cm__ab_roads_run_now_name: "Yolları Yeniden Planlamaya Zorla"
 cm__ab_roads_run_now_desc: "Planın sırasının gelmesini beklemek yerine hangi yol kesimlerinin şimdi yeniden döşeneceğini belirle. Çok oyunculu modda bunları belirleyen tek şey budur. Kendiliğinden yol döşemez; tespit ettiği kesimler Yol bütçesi karşıladıkça inşa edilir."
 cm__ab_roads_run_now_text: "$cm_txt_run_now$" # NO-TRANSLATE
 cm__ab_roads__debug_name: "$cm_txt_debug$" # NO-TRANSLATE
 cm__dbg_run_roads_name: "Yolları Çalıştır"
 cm__dbg_run_roads_desc: "Mevcut plandaki yol bölümlerini ayın dönmesini beklemek yerine şimdi kendiliğinden sipariş eder. Kendi payından geriye kalanı harcar, bu yüzden bütçesini halihazırda tüketmiş olan bir kategori hiçbir şey döşemez. Otomasyonu Duraklat bunu engellemez."
 cm__dbg_run_roads_text: "$cm_txt_run_now$" # NO-TRANSLATE
 cm__ab_governors__ab_governors_name: "$cm__ab_governors_name$" # NO-TRANSLATE
 cm__ab_gov_move_seats_name: "Valilerin Taşınmasına İzin Ver"
 cm__ab_gov_move_seats_desc: "Tüm vali yuvaları dolduğunda, bir valiyi geri çekip yerine daha iyi bir konuma yenisini atar. Daha iyi konumun halihazırda bir Şehir olması veya yerini aldığı konumdan %10 daha yüksek puan alması gerekir. Bu kapalıyken, valiler sadece boş olan yuvalara yerleşir."
 cm__ab_gov_prepare_sites_name: "Yeni Konumların Hazırlanmasına İzin Ver"
 cm__ab_gov_prepare_sites_desc: "Henüz bir vali atanamayan lokasyonları değerlendir ve buralarda bir Kasaba veya Şehir kurup başkentine bir yol inşa ederek onları önce hazır hale getir. Bu kapalıyken, yalnızca halihazırda Şehir olan ve başkentine yolu bulunan lokasyonlar dikkate alınır."
 cm__ab_governors__debug_name: "$cm_txt_debug$" # NO-TRANSLATE
 cm__dbg_run_governors_name: "Vali Planını Başlat"
 cm__dbg_run_governors_desc: "Olağan yirmi beş yıllık sırası yerine şimdi yeni bir plan başlatır. Plan, her zamanki gibi sonraki aylar boyunca aşamalarını gerçekleştirir. Hala barışa, bir başkente ve halihazırda yürütülen başka bir arama olmamasına ihtiyaç duyar."
 cm__dbg_run_governors_text: "Başlat"
