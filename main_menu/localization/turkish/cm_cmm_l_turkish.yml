 cm__auto_town_rights__auto_town_rights_specialization_name: "Akıllı Uzmanlaşma Hakkı Veren"
 cm__auto_town_rights__auto_town_rights_specialization_desc: "Custom Right Granter sırasını tamamladıktan sonra verilir."
 cm__auto_grant_specialization_name: "Uzmanlaşma Kentsel Haklarını Otomatik Ver"
 cm__auto_grant_specialization_desc: "Her lokasyona, etrafında üretilen mallara uygun olanlar arasından altın değeri en yüksek olanı seçerek bir uzmanlaşma hakkı tanı."
 cm__specialization_window_name: "Uygunluk Eşiği"
 cm__specialization_window_desc: "Bir uzmanlık hakkının, oradaki en uygun hakka kıyasla değerlendirmeye alınabilmesi için bir konuma ne kadar iyi uyması gerektiğini belirler. %50'de, en az onun yarısı kadar uygun olan her hak değerlendirmeye alınır ve en yüksek altın değerine sahip olan verilir. %100'de ise sadece en uygun hak verilir."
 cm__specialization_window_format: "[CMMV('cm__specialization_window')]%" # NO-TRANSLATE
 cm__specialization_expand_name: "Güçlendirilmiş Sanayileri Genişlet"
 cm__specialization_expand_desc: "Bir uzmanlaşma hakkı verildiğinde, bu hakkın desteklediği sanayiler ve lokasyonun ürettiği ham maddeler için o lokasyonda otomatik genişletmeyi de aç. Önerilen Şehir Hakları haritasındaki bir verme düğmesine sağ tıklamakla aynıdır."
 cm__auto_town_rights__debug_name: "$cm_txt_debug$" # NO-TRANSLATE
 cm__dbg_run_town_rights_name: "Otomatik Şehir Haklarını Tanı"
 cm__dbg_run_town_rights_desc: "Ayın dönmesini beklemek yerine şimdi hibe eder; önce etkin listeyi, ardından uzmanlaşma haklarını işler. Otomasyonu Durdur bunu engellemez."
 cm__dbg_run_town_rights_text: "$cm_txt_run_now$" # NO-TRANSLATE
 cm__miscellaneous_name: "Çeşitli"
 cm__cleanup_name: "Bina Temizliği"
 cm__cleanup__cleanup_name: "$cm__cleanup_name$" # NO-TRANSLATE
 cm__cleanup_close_open_name: "Binaları Kapat ve Aç"
 cm__cleanup_close_open_desc: "Yılda bir kez, kâr etmeyi bırakan ve sübvanse edilmeyen üretim binalarını kapatır. Kapatılan binalar, o bina türü o pazarda tekrar kâr etmeye başladığında yeniden açılır. @farming_village! [ShowBuildingTypeNameWithNoTooltip('farming_village')] ve @market_village! [ShowBuildingTypeNameWithNoTooltip('market_village')] asla kapatılmaz."
 cm__cleanup_destroy_name: "Binaları Yık"
 cm__cleanup_destroy_desc: "Yılda bir kez, konumun desteklediği bina seviyelerinin on seviye dahilinde olduğu ve artık para kazandırmayan üretim binalarını, halihazırda kapatılmış olan ve konumu yer kalmamış olanlarla birlikte yok et. Bunun yerine bir @market_village! [ShowBuildingTypeNameWithNoTooltip('market_village')] bir seviyeye indirilir. @fruit_orchard! [ShowBuildingTypeNameWithNoTooltip('fruit_orchard')] ne kazandığına bakılmaksızın yok edilir ve asla yeniden inşa edilmez, @farming_village! [ShowBuildingTypeNameWithNoTooltip('farming_village')] ise asla yok edilmez."
 cm__cleanup_min_profit_name: "Seviye Başına Minimum Kâr"
 cm__cleanup_min_profit_desc: "Aylık seviye başına bu miktardan daha az kazanan bir bina, işletilmeye değmez sayılır ve sübvanse edilmediği sürece kapatılır veya yıkılır."
 cm__cleanup_min_profit_format: "[Divide_CFixedPoint(CMMV('cm__cleanup_min_profit'), '(CFixedPoint)100')|2]@gold!" # NO-TRANSLATE
 cm__cleanup_max_changed_name: "Geçiş Başına Maksimum Değiştirilen"
 cm__cleanup_max_changed_desc: "Bir pazardaki bir bina türüne ait binaların tek bir yıllık döngüde değişebilecek oranı. %50 olduğunda, açık binaların yarısı kapatılabilir veya yıkılabilir ve kapalı olanların yarısı yeniden açılabilir. Asla birden az olamaz, böylece bir türün son binası hâlâ kapatılabilir."
 cm__cleanup_max_changed_format: "[CMMV('cm__cleanup_max_changed')]%" # NO-TRANSLATE
 cm__cleanup_core_goods_name: "İnşaat Malzemelerine Öncelik Ver"
 cm__cleanup_core_goods_desc: "Çoğunlukla @masonry![ShowGoodsNameWithNoTooltip('masonry')], @lumber![ShowGoodsNameWithNoTooltip('lumber')], @sand![ShowGoodsNameWithNoTooltip('sand')] veya @glass![ShowGoodsNameWithNoTooltip('glass')] tüketen binaları Seviye başına Minimum Kârın iki katında veya hangisi daha yüksekse seviye başına 0.1@gold! değerinde tut. Bu seçenek etkinken bu dördünden birini üreten binalar asla kapatılmaz veya yıkılmaz."
 cm__cleanup_auto_food_name: "Otomatik Gıda Konumlarını Temizle"
 cm__cleanup_auto_food_desc: "Otomatik gıda yönetiminin devrede olduğu ve herhangi bir işçi türünün halihazırda yetersiz olduğu yerlerde, gıda üretmeyen üretim binalarını yık. Bir @market_village! [ShowBuildingTypeNameWithNoTooltip('market_village')] tamamen yıkılmak yerine bir seviyeye düşürülür."
 cm__cleanup_run_now_name: "Bina Temizliğini Çalıştır"
 cm__cleanup_run_now_desc: "Yıllık geçişi beklemek yerine temizliği şimdi çalıştır."
 cm__cleanup_run_now_text: "$cm_txt_run_now$" # NO-TRANSLATE
 cm__placement_finder_method_option_3_name: "Nüfus"
 cm__placement_finder_method_option_3_desc: "Oraya yerleştirilecek bir valinin veya başkentin ne kadar yakınlık sağlayacağına göre, her konumu barındırdığı nüfusa göre hesaba katarak sırala. Kalabalık bir nüfus üzerindeki küçük bir kazanç, az bir nüfus üzerindeki büyük bir kazançtan daha az değerlidir."
 cm__log_production_name: "$cm__ab_production_name$" # NO-TRANSLATE
 cm__log_production_desc: "Üretim kategorisinin kuyruğa aldığı her bina ve değerlendirdiği her hammadde işletmesi genişletmesi için, her birinin geri ödeme ve gelir bilgileriyle birlikte satırlar."
 cm__log_core_name: "$cm__ab_core_name$" # NO-TRANSLATE
 cm__log_core_desc: "Bir konumu bir Temel Mal döngüsü boyunca izleyen satırlar: piyasanın açığı ve talep ettiği seviyeler, ardından o konuma ne verildiği, puanlandığı ve inşa edildiği. Konumu önce şu konsol komutuyla işaretleyin: effect location:<key> = { cm_ab_core_watch_on = yes }."
 cm__debug__rotation_name: "Pazar Rotasyonu"
 cm__debug__rotation_desc: "Büyük bir ülke pazarlarını her seferinde birkaç tane olacak şekilde işler ve her otomasyon dahil olduğu set üzerinde inşaat yapar."
 cm__dbg_rotate_slice_name: "Pazarları Döndür"
 cm__dbg_rotate_slice_desc: "Bir sonraki pazar grubuna geçer. \"Hemen Çalıştır\" düğmelerinden başlatılan bir işlem bulduğu grupta kalır; bu seçenek, oyun duraklatılmışken işlemin ilerlemesini sağlar."
 cm__dbg_rotate_slice_text: "Döndür"
 cm__probe_production_anchors_name: "Üretim Dayanakları"
 cm__probe_production_anchors_desc: "Her bir mal için, Üretimin kaydettiği en iyi geri ödeme ve bunun belirlediği geri ödeme sınırı ile her birinin arkasındaki bina ve konumu belirten birer satır."
 cm__probe_production_anchors_text: "$cm_txt_run$" # NO-TRANSLATE
 cm__probe_production_rgo_name: "Ham Madde Üretimi"
 cm__probe_production_rgo_desc: "Üretimin bir konumun hammaddelerini atladığı her sebep için bir satır veya hiçbirini atlamadığında tek bir satır gösterir. location:<key> = { cm_ab_core_watch_on = yes } konsol komutu efektiyle bir konumu işaretlemediğiniz sürece başkenti okur."
 cm__probe_production_rgo_text: "$cm_txt_run$" # NO-TRANSLATE
 cm__probe_core_name: "$cm__ab_core_name$" # NO-TRANSLATE
 cm__probe_core_desc: "Core Goods'un bir konumda okuduğu her sayı, oyunun kendi okumasının yanında ve ardından o konumun pazarının bir döngüde ne kadar emebileceği şeklinde gösterilir. `effect location:<key> = { cm_ab_core_watch_on = yes }` konsol komutuyla bir konumu işaretlemediğiniz sürece başkenti okur; başkent asla bir Core Goods adayı değildir, bu yüzden inşa edilecek olanı okumak için bir konumu işaretleyin."
 cm__probe_core_text: "$cm_txt_run$" # NO-TRANSLATE
 cm__probe_setup_name: "$cm_txt_setup_data$" # NO-TRANSLATE
 cm__probe_setup_desc: "Kaydın hangi harita verilerini taşıdığı ve her birinin hangi sürümde işlendiği, ardından bu makinenin bunlardan herhangi birini işlemesine izin verilip verilmediği. 0 sürümü, ilgili verinin henüz işlenmediği ve bir sonraki yüklemede işleneceği anlamına gelir."
