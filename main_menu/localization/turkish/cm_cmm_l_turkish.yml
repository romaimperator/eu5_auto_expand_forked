 cm__ab_food_target_name: "Fazla Hedefi"
 cm__ab_food_target_desc: "Bir pazar, arzı talebinin bu oranına ulaşana kadar daha fazla gıda sahası alır. %125 değerinde, yılın medyan ayında %25 fazlaya ulaşamayan her pazarda gıda üretimi genişletilir. Daha fazla ihtiyat payı bırakmak için bu değeri artırın, sadece kıtlığa daha yakın olan pazarlara yardımcı olmak için düşürün."
 cm__ab_food_target_format: "[CMMV('cm__ab_food_target')]%" # NO-TRANSLATE
 cm__ab_food_min_potential_name: "Minimum Gıda Potansiyeli"
 cm__ab_food_min_potential_desc: "Otomatik gıda yalnızca, RGO seviyesi başına gıda potansiyeli bu puana ulaşan konumlarda etkinleştirilir; bu puan $mapmode_cm_location_food_potential_name$ harita modunun gösterdiği değerle aynıdır. Daha iyi tarım arazilerini beklemek için bu değeri yükseltin, daha zayıf arazileri kabul etmek için düşürün."
 cm__ab_food_min_potential_format: "[CMMV('cm__ab_food_min_potential')]" # NO-TRANSLATE
 cm__ab_food_subsidize_name: "Gıda Binalarını Sübvanse Et"
 cm__ab_food_subsidize_desc: "Otomatik gıda sisteminin inşa ettiği gıda üreten binaları sübvanse edin. Kâr etmeyen bir bina kimseyi işe almaz ve gıda yetiştirmez, bu yüzden verimsiz arazideki bir tarım köyü atıl kalır; sübvanse etmek binanın kadrosunu dolu tutar ve hasadın devam etmesini sağlar. Sübvansiyonlar asla geri kapatılmaz."
 cm__ab_food_run_now_name: "Gıdayı Yeniden Planlamaya Zorla"
 cm__ab_food_run_now_desc: "Yıllık kontrolü beklemek yerine, halihazırda örneklenen ayların yanı sıra bu ayın gıda dengesine dayanarak gıda konumlarını şimdi tekrar seç."
