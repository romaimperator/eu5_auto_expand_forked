 cm__ab_production__ab_production_name: "$cm__ab_production_name$" # NO-TRANSLATE
 cm__ab_production_algorithm_name: "İnşa Stratejisi"
 cm__ab_production_algorithm_desc: "Üretimin ne inşa edileceğini nasıl belirlediği."
 cm__ab_production_algorithm_option_1_name: "Açgözlü"
 cm__ab_production_algorithm_option_1_desc: "Önce en hızlı geri dönüş sağlayan seçenekleri inşa et ve sadece aynı malları üretmek için bulunan en iyi konuma yakın olanları yap."
 cm__ab_production_max_rel_roi_name: "Maksimum Göreli Yatırım Getirisi"
 cm__ab_production_max_rel_roi_desc: "Bir binanın veya yükseltmenin, aynı malları üreten en iyi konuma kıyasla maliyetini ne kadar daha yavaş geri ödeyebileceğini ve buna rağmen inşa edilip edilmeyeceğini belirler. %30'da, en iyi yer 10 yılda geri ödeme yapıyorsa, sadece 13 yıl içinde geri ödeyenler inşa edilir; daha yavaş olanlar bekletilir. %0'da, her ay her mal için sadece en iyi üretici inşa edilir. %100 ve üzerinde herhangi bir sınır yoktur ve sadece Maksimum Geri Ödeme Yılı uygulanır. Türü ne olursa olsun, aynı malı üreten her bina birlikte değerlendirilir. RGO genişletmeleri her zaman geri ödeme sırasına göre inşa edilir."
 cm__ab_production_max_rel_roi_format: "[CMMV('cm__ab_production_max_rel_roi')]%[Select_CString(GreaterThanOrEqualTo_CFixedPoint(CMMV('cm__ab_production_max_rel_roi'), CMMMapValue('cmm_max', 'cm__ab_production_max_rel_roi')), '+', '')]" # NO-TRANSLATE
 cm__ab_production_min_roi_name: "Maksimum Geri Ödeme Yılı"
 cm__ab_production_min_roi_desc: "Sadece vergi geliri inşaat maliyetini bu kadar yıl içinde geri ödeyen inşaatlar dikkate alınır. Kontrolü devre dışı bırakmak için 0'a ayarlayın."
