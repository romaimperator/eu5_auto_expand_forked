 cm__town_rights_free_grants_name: "Kentsel Hak Maliyetlerini Kaldır"
 cm__town_rights_free_grants_desc: "Etkinken, şehir hakları tanımak hükümet gücü harcamaz ve bunları geri çekmek istikrar maliyeti gerektirmez."
 cm__town_rights_min_gov_power_name: "Minimum Hükümet Gücü"
 cm__town_rights_min_gov_power_desc: "Otomatik verme, bir sonraki verme işlemi hükümet gücünüzü (hükümet türüne bağlı olarak meşruiyet, cumhuriyet geleneği, bağlılık veya sürü birliği) bu değerin altına düşürecekse şehir hakları tanımayı durdurur."
 cm__allowed_building_overbuild_levels_format: "[CMMV('cm__allowed_building_overbuild_levels')][Select_CString(GreaterThanOrEqualTo_CFixedPoint(CMMV('cm__allowed_building_overbuild_levels'), CMMMapValue('cmm_max', 'cm__allowed_building_overbuild_levels')), '+', '')]"
 cm__auto_build_capital_name: "Başkent Binaları"
 cm__auto_build_capital_desc: "Koşullar elverdiğinde başkent konumunuzda sadece başkente özel binaları (kraliyet sarayı, yüksek mahkeme, harp akademisi vb.) otomatik olarak inşa eder. Bunlar aşağıdaki listeden önce inşa edilir."
 cm__urbanize_city_to_megalopolis_name: "Şehirden Megapole"
 cm__urbanize_city_to_megalopolis_desc: "Başkentinizi, en az 400.000 nüfusa sahip bir pazar merkezi şehri olduğunda bir megalopole yükseltin."
 cm__megalopolis_ignore_capital_name: "Megalopolis: Başkent Gereksinimini Yoksay"
 cm__megalopolis_ignore_capital_desc: "Başkentiniz olmayan bir şehirde Megalopolis Kurmanıza olanak tanır."
 cm__megalopolis_ignore_market_center_name: "Megalopolis: Pazar Merkezi Gereksinimini Yok Say"
 cm__megalopolis_ignore_market_center_desc: "Pazar merkezi olmayan bir şehirde Megalopolis Kurmanıza olanak sağlar."
 cm__deurbanize_name: "Kentleşmeyi Geri Al"
 cm__deurbanize_desc: "Her ay, RGO malları aşağıdaki Şehirleşme Yapma listesinde işaretlendiğinde sahip olunan bölgeleri tekrar kırsal yerleşime döndürür. Başkentiniz, fethedilen bölgeler ve vali koltukları gibi Yakınlık sağlayan bölgeler ise olduğu gibi bırakılır."
 cm__auto_urbanize_ignore_list_i20_name: "@wool! [ShowGoodsName('wool')] ([GetGlobalVariable('cm_goods_wool').GetGoods.GetDefaultMarketPrice]@gold!)"
 cm__full_automation_name: "Tam Otomasyon"
 cm__full_automation__full_automation_name: "Tam Otomasyon"
 cm__full_automation__full_automation_desc: "Müdahalesiz inşaat. Aşağıdaki kategoriler her ay, Altın Rezervi üzerindeki hazineyi mevcut en iyi inşaatlar için harcar. Diğer otomasyon özelliklerinin ayarlarını değiştirmeden onlarla birlikte çalışır."
 cm__fa_enabled_name: "Tam Otomasyonu Etkinleştir"
 cm__fa_enabled_desc: "Tam otomasyonu aç veya kapat."
 cm__fa_reserve_name: "Altın Rezervi"
 cm__fa_reserve_desc: "Tam otomasyon hazinenizi asla bu miktarın altına düşürecek şekilde harcamaz. Ayarlar sekmesindeki Altın Rezervi'nden ayrıdır."
 cm__fa_reserve_format: "[CMMV('cm__fa_reserve')]@gold!"
 cm__fa_save_unaffordable_name: "Karşılanamayan Binalar İçin Biriktir"
 cm__fa_save_unaffordable_desc: "Bir kategori, aylık payından daha fazlasına mal olsa bile bulduğu en iyi binayı satın alır ve sonraki aylar aradaki farkı kapatana kadar başka harcama yapmaz. Kapalıyken, her kategori harcayabildiğini harcar ve geri kalanını alt kademeye devreder."
 cm__full_automation__fa_priority_list_name: "Öncelikler"
 cm__full_automation__fa_priority_list_desc: "Yeniden sıralamak için sürükleyin. Kategoriler her ay yukarıdan aşağıya doğru işlenir. İki kategori aynı binayı istediğinde, üstte olan kategori inşa eder."
 cm__fa_priority_list_item_column_name: "Kategori"
 cm__fa_priority_list_i1_name: "Gıda"
 cm__fa_priority_list_i1_desc: "Sahip olduğunuz pazar merkezlerine bağlı pazarlarda yıl boyunca gıda arzını izler ve medyan ayın yetersiz kaldığı durumlarda, en yüksek gıda potansiyeline sahip konumlarda otomatik gıdayı etkinleştirir. Seçtiği konumlar oyuncu tarafından etkinleştirilenler gibi parlar ancak kontrol sizde kalır; konum artık size ait bir kırsal yerleşim olmadıkça veya pazar merkezine artık sahip olmadıkça asla kapatılmazlar."
 cm__fa_priority_list_i2_name: "Sanayi"
 cm__fa_priority_list_i2_desc: "Maliyetini vergi geliriyle en hızlı şekilde geri ödeyen üretim binalarını ve RGO'ları inşa eder, genişletir ve yükseltir. Herhangi bir işçi türünün halihazırda yetersiz olduğu durumlarda, otomatik gıda çalıştıran konumlara dokunulmaz."
 cm__fa_priority_list_i3_name: "Fiyat Çöküşü"
 cm__fa_priority_list_i3_desc: "Fiyatlarını aşağı çekmek için inşaat malzemesi üretimini artırır. Pazar merkezi size ait olan pazarlarda çalışır. En iyi üretim yapan yerleşkelere öncelik verilir ve her birine tek seferde birkaç seviye kazandırılır; üretim, işçilerin henüz varmadığı yerlerde bile başlar. Başkentiniz, gıda yetiştiren yerleşkeler ve sübvansiyon olmadan zarar edecek üreticiler atlanır."
 cm__fa_priority_list_i4_name: "Yollar"
 cm__fa_priority_list_i4_desc: "Altın maliyetine göre en değerli yol ağını, bir yolun sağladığı üç unsura göre inşa eder: Yakınlık, Pazar Erişimi ve bir konumu başkentinize bağlamak. Yılda bir kez bunlardan her biri için sahip olduğunuz her konuma giden en iyi rotayı hesaplar, ardından her ay, rotanın devamındaki her şeyi hesaba katarak Vergi Matrahını en çok artıracak kısımları inşa etmeye başlar. Önce ucuz düz koridorlar döşenir; alttaki iki seçenek, yalnızca üsttekinde döşenecek bir şey kalmadığında altın harcaması yapar."
 cm__fa_priority_list_i5_name: "Hizmetler"
 cm__fa_priority_list_i5_desc: "Uygun olan her yere destekleyici altyapı inşa eder: başkent binaları, otomatik inşa listesi, cıva avluları, pazar merkezi binaları, icra memurları ve ülkenizin sahip olduğu kontrolü artıran benzersiz binalar, pazar yerleri, hastalığa dirençli binalar ve en son tahıl ambarları. Kontrol binaları öncelikle en zengin konumlara, pazar yerleri ise öncelikle pazar erişimi en düşük olan konumlara inşa edilir."
 cm__fa_priority_list_i6_name: "Bina Temizliği"
 cm__fa_priority_list_i6_desc: "Yılda bir kez, para kazandırmayı bırakan ve sübvanse edilmeyen üretim binalarını kapatır; konumun desteklediği bina seviyelerinin on seviye dahilinde olduğu durumlarda ise bunun yerine onları yıkar. Kapatılan binalar, o tür o pazarda tekrar kâr etmeye başladığında yeniden açılır ve konumda yer kalmazsa daha sonra yıkılır. @farming_village! [ShowBuildingTypeNameWithNoTooltip('farming_village')] asla kapatılmaz veya yıkılmaz."
 cm__fa_priority_list_i7_name: "Valiler"
 cm__fa_priority_list_i7_desc: "Valilerinizin nerede görev yapması gerektiğini planlar ve en iyi konumu öncelikli olarak seçerek onları oraya yerleştirir. Her vali yuvası açıldığında ve aksi takdirde her yirmi beş yılda bir yeniden planlama yapar. Sadece tek oyunculu."
 cm__fa_priority_list_i8_name: "Kentsel Haklar"
 cm__fa_priority_list_i8_desc: "Kasaba ve şehirlerinizde kentsel haklar tanır. Önce [ShowTownRightsNameWithNoTooltip('granary_town')] gelir, ardından konumun çevresinde üretilen mallara uygun olanlar arasından rastgele bir uzmanlaşma hakkı seçilir."
 cm__fa_priority_list__budget_name: "Bütçe Payı"
 cm__fa_priority_list__budget_desc: "Bu kategorinin her ay harcayabileceği, Altın Rezervinin üzerindeki hazine payı."
 cm__fa_priority_list__budget_postfix: "%"
 cm__fa_priority_list__enabled_name: "Etkin"
 cm__fa_priority_list__enabled_desc: "Bu kategorinin inşa edilmesine izin ver."
 cm__full_automation__fa_industry_name: "Sanayi"
 cm__full_automation__fa_industry_desc: "Yukarıdaki Sanayi kategorisi için ayarlar."
 cm__fa_industry_algorithm_name: "İnşa Stratejisi"
 cm__fa_industry_algorithm_desc: "Endüstrinin ne inşa edeceğini nasıl seçtiği."
 cm__fa_industry_algorithm_option_1_name: "Açgözlü"
 cm__fa_industry_algorithm_option_1_desc: "Öncelikle en hızlı geri dönüş sağlayan seçenekleri ve sadece aynı malları üretmek için bulunan en iyi yere yakın olanları inşa et."
 cm__fa_industry_max_rel_roi_name: "Maksimum Göreli Yatırım Getirisi"
 cm__fa_industry_max_rel_roi_desc: "Aynı malları üreten bulunan en iyi yerle kıyaslandığında, bir binanın veya geliştirmenin maliyetini ne kadar daha yavaş geri ödeyip yine de inşa edilebileceğini belirler. %30'da, eğer en iyi yer 10 yılda geri ödüyorsa, yalnızca 13 yıl içinde geri ödeyenler inşa edilir; daha yavaş olanlar bekletilir. %0'da, her ay her mal için yalnızca en iyi üretici inşa edilir. %+100'de sınır yoktur ve yalnızca Maksimum Geri Ödeme Yılı kısıtlaması uygulanır. Türü ne olursa olsun, aynı malları üreten her bina birlikte değerlendirilir. RGO genişletmeleri her zaman geri ödeme sırasına göre inşa edilir."
 cm__fa_industry_max_rel_roi_format: "[CMMV('cm__fa_industry_max_rel_roi')]%[Select_CString(GreaterThanOrEqualTo_CFixedPoint(CMMV('cm__fa_industry_max_rel_roi'), CMMMapValue('cmm_max', 'cm__fa_industry_max_rel_roi')), '+', '')]"
 cm__fa_industry_min_roi_name: "Maksimum Geri Ödeme Yılı"
 cm__fa_industry_min_roi_desc: "Sadece vergi geliri inşa maliyetini bu kadar yıl içinde karşılayan inşaatlar dikkate alınır. Kontrolü devre dışı bırakmak için 0 olarak ayarlayın."
 cm__fa_industry_min_roi_format: "[CMMV('cm__fa_industry_min_roi')]y @efficiency!"
 cm__full_automation__fa_collapsar_name: "Fiyat Kollapsarı"
 cm__full_automation__fa_collapsar_desc: "Yukarıdaki Price Collapsar kategorisi ayarları. Malzemeler listenin yukarısından aşağıya doğru işlenir ve RGO'lar üretici binalardan önce genişletilir."
 cm__fa_collapsar_target_name: "Fiyat Hedefi"
 cm__fa_collapsar_target_desc: "Bir malzemenin inşasının duracağı fiyatın, taban fiyata göre oranı. -%33'te, malzeme taban fiyatın %33 altında işlem görene kadar üreticiler inşa edilir. %0'da, taban fiyata ulaşana kadar. +%33'te ise sadece fiyatı taban fiyatın %33 üzerindeyken inşa edilir."
 cm__fa_collapsar_target_format: "[CMMV('cm__fa_collapsar_target')]%"
 cm__fa_collapsar_item_column_name: "Malzeme"
 cm__fa_collapsar_i1_name: "@masonry! [ShowGoodsName('masonry')]"
 cm__fa_collapsar_i2_name: "@lumber! [ShowGoodsName('lumber')]"
 cm__fa_collapsar_i3_name: "@sand! [ShowGoodsName('sand')]"
 cm__fa_collapsar_i4_name: "@glass! [ShowGoodsName('glass')]"
 cm__fa_collapsar__enabled_name: "Etkin"
 cm__fa_collapsar__enabled_desc: "Bu malzemenin fiyatını düşürmek için çalışın."
 cm__full_automation__fa_food_name: "Gıda"
 cm__full_automation__fa_food_desc: "Yukarıdaki Gıda kategorisi için ayarlar."
 cm__fa_food_target_name: "Fazlalık Hedefi"
 cm__fa_food_target_desc: "Bir pazar, arzı talebinin bu oranına ulaşana kadar daha fazla gıda lokasyonu edinir. %125 seviyesinde, yılın medyan ayında %25 fazlaya ulaşamayan her pazarda gıda üretimi genişletilir. Daha fazla güvenlik payı bırakmak için bu değeri yükseltin, sadece kıtlığa yaklaşan pazarlara yardımcı olmak için düşürün."
 cm__fa_food_target_format: "[CMMV('cm__fa_food_target')]%"
 cm__fa_food_min_potential_name: "Minimum Gıda Potansiyeli"
 cm__fa_food_min_potential_desc: "Otomatik gıda, yalnızca RGO seviyesi başına gıda potansiyeli bu puana ulaşan lokasyonlarda etkinleştirilir; bu puan, $mapmode_cm_location_food_potential_name$ harita modunun gösterdiği puanla aynıdır. Daha iyi tarım arazilerini beklemek için bu değeri yükseltin, daha zayıf arazileri kabul etmek için düşürün."
 cm__fa_food_min_potential_format: "[CMMV('cm__fa_food_min_potential')]"
 cm__full_automation__fa_urban_rights_name: "Kentsel Haklar"
 cm__full_automation__fa_urban_rights_desc: "Yukarıdaki Kentsel Haklar kategorisi için ayarlar."
 cm__fa_urban_rights_window_name: "Uygunluk Eşiği"
 cm__fa_urban_rights_window_desc: "Bir uzmanlık hakkının değerlendirmeye alınabilmesi için, oradaki en uygun hakka kıyasla konuma ne kadar iyi uyması gerektiğini belirler. %50 değerinde, en az yarı yarıya uyumlu olan herhangi bir hak seçilebilir ve daha uyumlu olanlar daha sık seçilir. %100 değerinde ise sadece en uygun olan hak verilir."
 cm__fa_urban_rights_window_format: "[CMMV('cm__fa_urban_rights_window')]%"
 cm__fa_urban_rights_reserve_name: "Hükümet Gücü Rezervi"
 cm__fa_urban_rights_reserve_desc: "Bunun için ödeme yapmak hükümet gücünüzü (yönetim biçimine bağlı olarak meşruiyet, cumhuriyet geleneği, adanmışlık veya sürü birliği) bu değerin altına düşürecekse hiçbir şehir hakkı verilmez."
 cm__fa_urban_rights_expand_name: "Teşvik Edilen Endüstrileri Genişlet"
 cm__fa_urban_rights_expand_desc: "Bir uzmanlaşma hakkı tanındığında, o konumda hakkın desteklediği endüstriler ve konumun ürettiği ham maddeler için otomatik genişletmeyi de açar. Önerilen Kentsel Haklar haritasındaki bir verme düğmesine sağ tıklamakla aynı işlevi görür."
 cm__full_automation__fa_cleanup_name: "Bina Temizliği"
 cm__full_automation__fa_cleanup_desc: "Yukarıdaki Bina Temizliği kategorisi için ayarlar."
 cm__fa_cleanup_min_profit_name: "Minimum Kâr"
 cm__fa_cleanup_min_profit_desc: "Her ay bu miktardan az kazanan bir bina işletilmeye değmez sayılır ve sübvanse edilmediği sürece kapatılır veya yıkılır. Bir pazardaki bir bina türünün açık binalarının en fazla yarısı aynı anda elden çıkarılır."
 cm__fa_cleanup_min_profit_format: "[Divide_CFixedPoint(CMMV('cm__fa_cleanup_min_profit'), '(CFixedPoint)100')|2]@gold!"
 cm__fa_cleanup_core_goods_name: "İnşaat Malzemelerine Öncelik Ver"
 cm__fa_cleanup_core_goods_desc: "Çoğunlukla @masonry![ShowGoodsNameWithNoTooltip('masonry')], @lumber![ShowGoodsNameWithNoTooltip('lumber')], @sand![ShowGoodsNameWithNoTooltip('sand')] veya @glass![ShowGoodsNameWithNoTooltip('glass')] tüketen binaları, Minimum Kârın iki katı veya 0,1@gold! değerlerinden hangisi daha yüksekse o eşikte tut. Bu dördünden birini üreten binalar normal Minimum Kâr üzerinden değerlendirilir."
 cm__fa_cleanup_auto_food_name: "Otomatik Gıda Konumlarını Temizle"
 cm__fa_cleanup_auto_food_desc: "Otomatik gıdanın devrede olduğu ve herhangi bir işçi türünün halihazırda yetersiz olduğu yerlerde, gıda üretmeyen üretim binalarını yık. Bir @market_village! [ShowBuildingTypeNameWithNoTooltip('market_village')] yıkılmak yerine bir seviyeye düşürülür."
 cm__full_automation__fa_roads_name: "Yollar"
 cm__full_automation__fa_roads_desc: "Yukarıdaki Yollar kategorisi için ayarlar."
 cm__fa_roads_proximity_name: "Yakınlık"
 cm__fa_roads_proximity_desc: "Altın başına Yakınlığı en çok artıran yol bölümlerini, güzergahın ilerisindeki her konumu hesaba katarak inşa et."
 cm__fa_roads_market_access_name: "Pazar Erişimi"
 cm__fa_roads_market_access_desc: "Altın başına Pazar Erişimini en çok artıran yol bölümlerini döşe. Sadece döşenecek Yakınlık bölümleri kalmadığında aylık harcama yapar."
 cm__fa_roads_capital_name: "Başkent Bağlantısı"
 cm__fa_roads_capital_desc: "Yerleşkelerinizi başkentinize bağlamak için, halihazırda bağlı olanlardan dışarıya doğru yol bölümleri döşeyin. Yalnızca Yakınlık ve Pazar Erişimi bölümlerinden döşenecek bir şey kalmadığı aylarda harcama yapar."
 cm__full_automation__fa_governors_name: "Valiler"
 cm__full_automation__fa_governors_desc: "Yukarıdaki Valiler kategorisi için ayarlar."
 cm__fa_gov_move_seats_name: "Valilerin Taşınmasına İzin Ver"
 cm__fa_gov_move_seats_desc: "Tüm vali slotları dolduğunda, bir valiyi geri çekip yerine daha iyi bir konuma yenisini atar. Daha iyi konumun halihazırda bir Şehir olması veya yerine geçtiği yerden %10 daha yüksek puan alması gerekir. Bu kapalıyken, valiler sadece boş slotlara atanır."
 cm__fa_gov_prepare_sites_name: "Yeni Konumların Hazırlanmasına İzin Ver"
 cm__fa_gov_prepare_sites_desc: "Henüz vali atanamayan konumları değerlendirip oralarda bir Kasaba veya Şehir kurarak ve başkentinize bir yol inşa ederek önce onları hazırlar. Bu kapalıyken, yalnızca halihazırda Şehir olan ve başkentinize yolu bulunan konumlar dikkate alınır."
 cm__map_modes_name: "Harita Modları"
 cm__map_modes__placement_finder_name: "Önerilen Başkent ve Vali Konumu"
 cm__map_modes__placement_finder_desc: "Önerilen Vali ve Önerilen Başkent yerleşimi harita modları için ayarlar."
 cm__placement_finder_method_name: "Yerleştirme Bulucu Puanlaması"
 cm__placement_finder_method_desc: "Önerilen Vali ve Önerilen Başkent harita modlarının konumlarınızı nasıl sıraladığı."
 cm__placement_finder_method_option_1_name: "Vergi Tabanı"
 cm__placement_finder_method_option_1_desc: "Oraya yerleştirilen bir valinin veya başkentin toplam vergi matrahınızı ne kadar artıracağına göre sırala. Daha zengin konumlar daha fazla önem taşır."
 cm__placement_finder_method_option_2_name: "Yakınlık"
 cm__placement_finder_method_option_2_desc: "Oraya yerleştirilen bir valinin veya başkentin ekleyeceği yakınlık miktarına göre sırala."
 cm__placement_finder_roads_name: "Kara Altyapısı"
 cm__placement_finder_roads_desc: "Önerilen Vali ve Önerilen Başkent harita modlarının ideal kara altyapısını mı varsayacağını yoksa halihazırda inşa ettiklerinizi mi kullanacağını belirler."
 cm__placement_finder_roads_option_1_name: "Mevcut"
 cm__placement_finder_roads_option_1_desc: "Hâlihazırda inşa ettiğiniz yolları kullanın."
 cm__placement_finder_roads_option_2_name: "Maksimum Yollar"
 cm__placement_finder_roads_option_2_desc: "Kilidini açtığınız en iyi yolun her bağlantıda inşa edildiğini varsayın."
 cm__placement_finder_roads_option_3_name: "Mümkün Olan En İyi"
 cm__placement_finder_roads_option_3_desc: "Kilidini açtığınız en iyi yolun her bağlantıya inşa edildiğini ve kara yakınlığını artıran kilidi açılmış her binanın uygun olan her yere inşa edildiğini varsayın."
 cm__placement_finder_naval_name: "Denizcilik Altyapısı"
 cm__placement_finder_naval_desc: "Önerilen Vali ve Önerilen Başkent harita modlarının ideal deniz altyapısını mı varsayacağı yoksa mevcut liman kapasitenizi ve donanma varlığınızı mı kullanacağı."
 cm__placement_finder_naval_option_1_name: "Mevcut"
 cm__placement_finder_naval_option_1_desc: "Mevcut liman kapasitenizi ve donanma varlığınızı kullanın."
 cm__placement_finder_naval_option_2_name: "Maksimum Varlık"
 cm__placement_finder_naval_option_2_desc: "Mevcut liman kapasitenizle her yerde tam deniz mevcudiyeti olduğunu varsayın."
 cm__placement_finder_naval_option_3_name: "Mümkün Olan En İyi"
 cm__placement_finder_naval_option_3_desc: "Tam donanma varlığını ve kilidini açtığınız en iyi liman binalarının her kıyı konumunda inşa edildiğini varsayın."
 cm__placement_finder_accuracy_name: "Arama Doğruluğu"
 cm__placement_finder_accuracy_desc: "Önerilen Vali ve Önerilen Başkent harita modlarının en iyi konumları ne kadar kapsamlı arayacağı. Atlanan konumlar siyah olarak görünür."
 cm__placement_finder_accuracy_option_1_name: "Kapsamlı"
 cm__placement_finder_accuracy_option_1_desc: "Her lokasyonu değerlendir. En isabetli ve en yavaş olanı."
 cm__placement_finder_accuracy_option_2_name: "Kapsamlı"
 cm__placement_finder_accuracy_option_2_desc: "İlk üçünüze giremeyecek konumları atla. İlk üç ve puanları Exhaustive ile aynıdır, sadece daha hızlıdır."
 cm__placement_finder_accuracy_option_3_name: "Dengeli"
 cm__placement_finder_accuracy_option_3_desc: "En iyi tek seçenek olamayacak konumları atla. En iyi konumun doğruluğu hâlâ garanti edilir; 2. ve 3. işaretleyiciler zaman zaman farklılık gösterebilir."
 cm__placement_finder_accuracy_option_4_name: "Hızlı"
 cm__placement_finder_accuracy_option_4_desc: "Ayrıca en iyi olma ihtimali çok düşük olan konumları atlar. Bulunan en iyi konum, gerçek en iyinin %20'si içerisindedir ve genellikle hâlâ kesin sonuçtur."
 cm__placement_finder_accuracy_option_5_name: "En Hızlı"
 cm__placement_finder_accuracy_option_5_desc: "Her bir vilayetin en umut verici konumunu değerlendirir, ardından liderler çevresinde iyileştirme yapar. Büyük ülkeler için çok daha hızlıdır; en iyi konumu gözden kaçırabilir."
 cm__debug_name: "Hata Ayıklama"
 cm__debug__logging_name: "Eylem Günlüğü"
 cm__debug__logging_desc: "Bu modun eylemlerinden hangilerinin mod eylem günlüğüne yazılacağı."
 cm__log_cycle_name: "İnşa Döngüsü"
 cm__log_cycle_desc: "Önceki döngü hâlâ kaynak tükettiği için atlanan aylık döngü ve art arda iki atlama sonrası gerçekleşen sıfırlama satırları."
 cm__log_industry_name: "Sanayi"
 cm__log_industry_desc: "Sanayi kategorisinin sıraya aldığı her bina ve değerlendirdiği her ham madde genişletmesi için, her birinin geri ödemesi ve geliriyle birlikte satırlar."
 cm__log_collapsar_name: "Fiyat Çöküşü"
 cm__log_collapsar_desc: "Bir konumun Price Collapsar döngüsü boyunca izlediği satırlar: piyasa açığı ve talep edilen seviyeler, ardından o konuma ne verildiği, nasıl puanlandığı ve ne inşa edildiği. Konumu önce şu konsol komutuyla işaretleyin: effect location:<key> = { cm_fa_col_watch_on = yes }."
 cm__log_food_name: "Otomatik Gıda"
 cm__log_food_desc: "Gıda kategorisi satırları: her pazarın aylık gıda arzı, talebi ve oranı; bu oranın hedefe göre değerlendirildiği yıllık medyan; orada halihazırda gıda yetiştiren konumların sayısı ve etkinleştirdiği veya devre dışı bıraktığı her konum."
 cm__log_roads_name: "Yollar"
 cm__log_roads_desc: "Yol kategorisinin sipariş ettiği her yol için konumu, yolun hangi üç nedenden dolayı satın alındığını ve maliyetini belirten bir satır."
 cm__log_cleanup_name: "Bina Temizliği"
 cm__log_cleanup_desc: "Yıllık Bina Temizliği aşaması ve kapattığı, küçülttüğü, yıktığı veya yeniden açtığı her bina için; her birinin kârı ve kıyaslandığı alt sınırla birlikte gösterilen satırlar."
 cm__log_governors_name: "Valiler"
 cm__log_governors_desc: "Vali planı için satırlar: seçilen ve bırakılan sahalar, kasaba ve şehir geliştirmeleri, yerleştirmeler, yer değiştirmeler ve reddetmeler ile şanslı bir ulusun başkent taşıması."
 cm__log_military_name: "Şanslı Ülke Askeriyesi"
 cm__log_military_desc: "Kaleleri yıkan ve insangücü binaları inşa eden şanslı bir ulus için satırlar."
 cm__log_government_name: "Şanslı Ulus Hükümeti"
 cm__log_government_desc: "Şanslı bir ulusun bürokrasiyi kaldırması veya bir zümre eylemi gerçekleştirmesi için satırlar."
 cm__debug__diagnostics_name: "Tanılama"
 cm__placement_finder_debug_path_name: "Hata Ayıklama Tanılamasını Etkinleştir"
 cm__placement_finder_debug_path_desc: "Önerilen Vali ve Önerilen Başkent harita modu araç ipuçlarına bir tanılama bloğu ekler: başkentinizden her bir konuma her atlamanın maliyetini içeren tahmini rotayı ve gerçek yakınlığınızla karşılaştırılan tahmini yakınlığı."
 cm__debug__probes_name: "Sondalar"
 cm__debug__probes_desc: "Mod eylem günlüğüne yazılan tek seferlik tanılamalar."
 cm__probe_budget_name: "Tam Otomasyon Bütçesi"
 cm__probe_budget_desc: "Her bir Tam Otomasyon kategorisinin bakiyesi (henüz karşılayamadığı bir seçim için altın ayırdığında pozitif, fazla harcamadan dolayı borçlu olduğunda negatif), Sanayi geri ödeme limiti ve bu döngüde es geçilen bir pazarda bekleyen en iyi aday ile birlikte."
 cm__probe_budget_text: "Çalıştır"
 cm__probe_governors_name: "Vali Planı"
 cm__probe_governors_desc: "Vali planının ulaştığı nokta: aşaması, kaç sahaya sahip olduğu ve daha kaç tane yerleştirmesi gerektiği, hazineyi tutup tutmadığı, ödenen valiler ve üzerinde çalıştığı yuvalar ile koltuklar."
 cm__probe_governors_text: "Çalıştır"
 cm__probe_military_name: "Şanslı Ülke Askeri"
 cm__probe_military_desc: "Ülkenin bulunduğu insan gücü binası kademesi, bunu inşa edip edemeyeceği, başkent çiftinin durumu, Askeri bütçe ve kaç konumun bu kademeyi alabildiği ile halihazırda kaçının buna sahip olduğu."
 cm__probe_military_text: "Çalıştır"
 cm__probe_industry_anchors_name: "Sanayi Çapaları"
 cm__probe_industry_anchors_desc: "Her mal için; Sanayi tarafından kaydedilen en iyi geri ödeme süresi, bunun belirlediği geri ödeme sınırı ve her birinin arkasındaki bina ile konumun adını içeren birer satır."
 cm__probe_industry_anchors_text: "Çalıştır"
 cm__probe_industry_rgo_name: "Sanayi Ham Maddeleri"
 cm__probe_industry_rgo_desc: "Sanayinin bir konumun hammaddelerini atladığı her neden için bir satır veya hiçbirini atlamadığında tek bir satır. location:<key> = { cm_fa_col_watch_on = yes } konsol komutu efekti ile bir konumu işaretlemediğiniz sürece başkenti okur."
 cm__probe_industry_rgo_text: "Çalıştır"
 cm__probe_collapsar_name: "Fiyat Çöküşü"
 cm__probe_collapsar_desc: "Price Collapsar'ın bir konumda okuduğu her sayı, oyunun kendi değerinin yanında ve ardından o konumdaki piyasanın bir döngüde ne kadarını absorbe edebileceğiyle birlikte gösterilir. Konsol komutu ile bir konumu işaretlemediğiniz sürece başkenti okur: location:<key> = { cm_fa_col_watch_on = yes }; başkent asla bir Price Collapsar adayı değildir, bu nedenle inşa edeceği yerlerden birini okumak için bir konumu işaretleyin."
 cm__probe_collapsar_text: "Çalıştır"
 cm__probe_roads_name: "Yollar"
 cm__probe_roads_desc: "Yol planının yakınlık, pazar erişimi ve başkent bağlantısı için kaç koridor tuttuğu, başkent bağlantılarından kaçının henüz başlatılabileceği, halihazırda kaç yolun inşa edildiği ve kategorinin havuzunda ne kaldığı."
 cm__probe_roads_text: "Çalıştır"
 cm__probe_log_gate_name: "Eylem Günlüğü Geçidi"
 cm__probe_log_gate_desc: "Price Collapsar günlük kategorisi, hem günlük geçidinin okuduğu hem de menünün sakladığı haliyle iki kez görünür; böylece birinde açık diğerinde kapalı olan bir kategori ortaya çıkar."
 cm__probe_log_gate_text: "Çalıştır"
