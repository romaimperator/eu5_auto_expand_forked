 cm__ab_master__ab_master_name: "$cm__ab_master_name$" # NO-TRANSLATE
 cm__ab_master__ab_master_desc: "Müdahalesiz inşaat. Her ay aşağıdaki kategoriler, Altın Rezervi'nin üzerindeki hazineyi mevcut en iyi inşaatlar için harcar. Diğer otomasyon özelliklerinin ayarlarına dokunmadan onlarla birlikte çalışır."
 cm__ab_enabled_name: "Otomatik İnşayı Etkinleştir"
 cm__ab_enabled_desc: "Otomatik İnşayı aç veya kapat."
 cm__ab_save_unaffordable_name: "Karşılanamayan Binalar için Biriktir"
 cm__ab_save_unaffordable_desc: "Bir kategori, aylık payını aşsa bile bulduğu en iyi binayı satın alır ve sonraki aylar aradaki farkı kapatana kadar yeni bir şey almaz. Kapalıyken ise, bir kategori doğrudan karşılayamayacağı hiçbir şeyi satın almaz."
 cm__ab_min_proximity_name: "Minimum Yakınlık"
 cm__ab_min_proximity_desc: "Bu Yakınlık değerinin altındaki konumlar, inşa edilecek yer seçilirken atlanır. Kontrol Binaları ve @settlement_building! [ShowBuildingTypeNameWithNoTooltip('settlement_building')], düşük Yakınlığa sahip toprakları elde tutmaya değer kılan unsurlar oldukları için her halükarda inşa edilirler. 0 değerinde hiçbir şey atlanmaz."
 cm__ab_min_proximity_format: "[CMMV('cm__ab_min_proximity')]%" # NO-TRANSLATE
 cm__ab_master__ab_priority_list_name: "Otomatik İnşa Kategorileri"
 cm__ab_master__ab_priority_list_desc: "Yeniden sıralamak için sürükleyin. Kategoriler her ay yukarıdan aşağıya doğru işlenir. İki kategori aynı binayı istediğinde, üstteki kategori onu inşa eder ve her kategori payını aldıktan sonra altın kalırsa, üstteki kategori bu altını alır."
 cm__ab_priority_list_item_column_name: "Kategori"
 cm__ab_priority_list_i1_name: "$cm__ab_custom_name$" # NO-TRANSLATE
 cm__ab_priority_list_i1_desc: "Uygun olan her yere destekleyici altyapı inşa eder. Önce başkent binaları, ardından kontrol binaları, sonra pazar merkezi binaları ve en son kendi seçtiğiniz binalar yükselir. İcra memurları ham maddeleri en yüksek fiyata satılan konumlara, diğer kontrol binaları en zengin konumlara ve pazar yerleri ise Piyasa Erişimi en düşük olan konumlara gider."
 cm__ab_priority_list_i2_name: "$cm__ab_core_name$" # NO-TRANSLATE
 cm__ab_priority_list_i2_desc: "Fiyatlarını düşürmek amacıyla inşaat malzemelerinin üretimini artırır. Pazar merkezine sahip olduğunuz pazarlarda çalışır. En iyi üretim yapan konumlara öncelik verilir ve her birine tek seferde birkaç seviye eklenir; üreticiler, işçiler henüz gelmemiş olsa bile faaliyete başlar. Başkentiniz, gıda yetiştiren konumlar ve sübvansiyon olmadan zarar edecek üreticiler atlanır."
 cm__ab_priority_list_i3_name: "$cm__ab_food_name$" # NO-TRANSLATE
 cm__ab_priority_list_i3_desc: "Pazar merkezi size ait olan pazarlardaki gıda arzını yıl boyunca izler ve medyan ayın yetersiz kaldığı durumlarda, en yüksek gıda potansiyeline sahip konumlarda otomatik gıdayı etkinleştirir. Seçtiği konumlar oyuncu tarafından etkinleştirilenler gibi parlar ancak kontrol sizde kalır; konum artık size ait bir kırsal yerleşim değilse, pazar merkezinin sahibi değilseniz veya aynı pazardaki daha iyi bir konum onun yerini almadıkça bu özellik asla kapatılmaz."
 cm__ab_priority_list_i4_name: "$cm__ab_production_name$" # NO-TRANSLATE
 cm__ab_priority_list_i4_desc: "Maliyetini vergi geliriyle en hızlı geri ödeyen üretim binalarını ve RGO'ları inşa eder, genişletir ve geliştirir. Herhangi bir işçi türünün halihazırda yetersiz olduğu, otomatik gıda çalıştıran konumlara dokunulmaz."
 cm__ab_priority_list_i5_name: "$cm__ab_roads_name$" # NO-TRANSLATE
 cm__ab_priority_list_i5_desc: "Altın başına en fazla değer sağlayan yol ağını, bir yolun kazandırdığı üç unsura göre inşa eder: Yakınlık, Pazar Erişimi ve bir konumun başkentinize bağlanması. Her dört yılda bir ve başkentiniz her değiştiğinde, sahip olduğunuz her konum için bu unsurların her biri adına en iyi rotayı hesaplar ve rotanın devamındaki her şeyi hesaba katarak, bölümleri artıracakları Vergi Matrahına göre sıralar; çok oyunculu modda bunu yalnızca Yolları Yeniden Planlamaya Zorla düğmesine bastığınızda yapar. Her ay bu sıra boyunca ilerler ve atlayıp geçmek yerine başlatamadığı ilk bölümde durur. Önce ucuz düz koridorlar döşenir ve alt sıradaki bir bölüm, ancak üstteki bölümün hiçbir şey inşa etmediği ve henüz maliyetini karşılayamadığı bir bölüm için birikim yapmadığı aylarda altın alabilir."
 cm__ab_priority_list_i6_name: "$cm__ab_governors_name$" # NO-TRANSLATE
 cm__ab_priority_list_i6_desc: "Valilerinizin nerede bulunması gerektiğini planlar ve en iyi konumu önceliklendirerek onları oraya yerleştirir. Her vali yuvası açıldığında ve bunun dışında her yirmi beş yılda bir tekrar planlama yapar. Sadece tek oyunculu."
 cm__ab_priority_list__budget_name: "Bütçe Payı"
 cm__ab_priority_list__budget_desc: "Hazine'nin Altın Rezervi üzerindeki kısmından bu kategoriye her ay ayrılan pay. Bu bir üst sınırdan ziyade bir tabandır: Hiçbir kategorinin harcamadığı altın listenin başından itibaren tekrar sunulur; böylece altındaki kategorilerin satın alacak bir şeyi olmadığı aylarda bir kategori kendi payının çok ötesinde inşaat yapabilir."
 cm__ab_priority_list__budget_postfix: "%" # NO-TRANSLATE
