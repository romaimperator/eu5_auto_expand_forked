l_turkish:
 # Mod
 cm_name: "İnşaat Yöneticisi"
 cm_desc: "EU5 inşaat deneyimini büyük ölçüde iyileştirmek için yeni otomasyon, filtreler ve harita modları ekleyen devasa bir yaşam kalitesi modu."

 # Settings (settings) Tab
 ## Global Control (settings) Group
 cm__pause_auto_expand_name: "Otomasyonu Duraklat"
 cm__pause_auto_expand_desc: "Bu modun eklediği her otomasyon özelliğini duraklatır."
 cm__minimum_gold_name: "Altın Rezervi"
 cm__minimum_gold_desc: "Hiçbir otomasyon hazinenizi bu miktarın altına düşürecek harcama yapmaz."
 cm__minimum_gold_format: "[CMMV('cm__minimum_gold')]@gold!"
 cm__allowed_building_overbuild_levels_name: "Aşırı İnşa Limiti"
 cm__allowed_building_overbuild_levels_desc: "Bir mevkide yeni inşaatların kuyruğa alınması durdurulmadan önce, o mevkinin Desteklenen Bina Seviyesi sınırının toplamda ne kadar aşılabileceğini belirler. Gıda, Valiler ve diğer ülkelerin mevkilerindeki binalar muaftır. Sıfır değerinde, sınırın aşılmasına izin verilmez. 200 ve üzeri değerlerde ise herhangi bir sınırlama yoktur."

 ## Priority List Group
 cm__priority_list_item_column_name: "Özellik"
 cm__priority_list_i1_name: "Otomatik Genişletme Etkin Binalar"
 cm__priority_list_i1_desc: "Kârlı olduğunda, nüfus mevcut olduğunda ve altın miktarı Altın Rezervinizin üzerinde kaldığında çok seviyeli üretim ve üretim dışı binaları otomatik olarak genişletir. Bir konum veya tüm bir bina türü için otomatik genişletmenin açık olduğu yerlerde, diğer ülkelerin konumlarındaki yabancı binalar da dahil olmak üzere uygulanır."
 cm__priority_list_i2_name: "Otomatik Genişletme Etkin RGO'lar"
 cm__priority_list_i2_desc: "İşçiler mevcut olduğunda ve kaynaklar elverdiğinde, otomatik RGO genişletmenin etkin olduğu konumlarda RGO seviyelerini otomatik olarak genişletir."
 cm__priority_list_i3_name: "Etkinleştirilmiş Konumlarda Gıdayı Otomatik Genişlet"
 cm__priority_list_i3_desc: "Otomatik gıdayı etkinleştirdiğiniz kırsal konumlarda, en gıda verimli seçeneği tercih ederek gıda üreten RGO'ları ve binaları otomatik olarak inşa eder."
 cm__priority_list_i4_name: "Tüm Binaları Otomatik Yükselt"
 cm__priority_list_i4_desc: "O bina için otomatik genişletmenin etkin olup olmadığına bakılmaksızın, eskimiş her binayı otomatik olarak yükseltir."
 cm__priority_list__enabled_name: "$cm_txt_enabled$"
 cm__priority_list__enabled_desc: "Bu özelliği etkinleştirin veya devre dışı bırakın."
 cm__priority_list__min_profit_name: "Min. Vergi Geliri"
 cm__priority_list__min_profit_desc: "İnşaat sıraya alınmadan önce seviye başına gereken minimum aylık altın miktarı. Kontrolü devre dışı bırakmak için 0'a ayarlayın."
 cm__priority_list__min_profit_postfix: "@gold!"
 cm__priority_list__min_discount_name: "$cm_txt_min_discount$"
 cm__priority_list__min_discount_desc: "$cm_txt_min_discount_desc$"
 cm__priority_list__min_discount_postfix: "%"
 cm__priority_list__min_discount_prefix_high: "#R "
 cm__priority_list__min_discount_postfix_high: "%#!"
 cm__priority_list__min_discount_prefix_low: "#G "
 cm__priority_list__min_discount_postfix_low: "%#!"

