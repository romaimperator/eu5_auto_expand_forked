 cm__ab_custom__ab_custom_name: "$cm__ab_custom_name$" # NO-TRANSLATE
 cm__ab_custom__ab_custom_desc: "Setler her ay yukarıdan aşağıya doğru işlenir, bu nedenle yukarıya daha yakın olanlar altını önce alır."
 cm__ab_custom_item_column_name: "Binalar"
 cm__ab_custom_i1_name: "Başkent Binaları"
 cm__ab_custom_i1_desc: "Başkentinizde sadece başkente özel olan binaları inşa edin: kraliyet sarayı, yüksek mahkeme, harp akademisi ve diğerleri. Bu kategorideki diğer her şeyden önce bunlar inşa edilir."
 cm__ab_custom_i2_name: "Kontrol Binaları"
 cm__ab_custom_i2_desc: "Ham maddelerin en yüksek fiyata satıldığı yerlere tahsildarlar, en zengin lokasyonlara ise ülkenizin sahip olduğu ve Kontrolü artıran eşsiz binaları inşa edin. Bir lokasyon, bir sonraki lokasyona geçilmeden önce barındırabileceği her eşsiz binayı alır."
 cm__ab_custom_i3_name: "Pazar Merkezi Binaları"
 cm__ab_custom_i3_desc: "Sahip olduğun her ticaret merkezinde kâr getiren binaları inşa et."
 cm__ab_custom_i4_name: "Binaları Seç"
 cm__ab_custom_i4_desc: "Aşağıda listelenen binaları inşa et."
 cm__ab_custom__enabled_name: "$cm_txt_enabled$" # NO-TRANSLATE
