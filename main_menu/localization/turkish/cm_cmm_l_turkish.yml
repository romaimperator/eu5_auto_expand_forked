 cm__town_rights_free_grants_name: "Kentsel Hak Maliyetlerini Kaldır"
 cm__town_rights_free_grants_desc: "Etkinken, şehir hakları tanımak hükümet gücü harcamaz ve bunları geri çekmek istikrar maliyeti gerektirmez."
 cm__town_rights_min_gov_power_name: "Minimum Hükümet Gücü"
 cm__town_rights_min_gov_power_desc: "Otomatik verme, bir sonraki verme işlemi hükümet gücünüzü (hükümet türüne bağlı olarak meşruiyet, cumhuriyet geleneği, bağlılık veya sürü birliği) bu değerin altına düşürecekse şehir hakları tanımayı durdurur."
 cm__allowed_building_overbuild_levels_format: "[CMMV('cm__allowed_building_overbuild_levels')][Select_CString(GreaterThanOrEqualTo_CFixedPoint(CMMV('cm__allowed_building_overbuild_levels'), CMMMapValue('cmm_max', 'cm__allowed_building_overbuild_levels')), '+', '')]"
 cm__auto_build_capital_name: "Başkent Binaları"
 cm__auto_build_capital_desc: "Koşullar elverdiğinde başkent konumunuzda sadece başkente özel binaları (kraliyet sarayı, yüksek mahkeme, harp akademisi vb.) otomatik olarak inşa eder. Bunlar aşağıdaki listeden önce inşa edilir."
 cm__urbanize_city_to_megalopolis_name: "Şehirden Megalopole"
 cm__urbanize_city_to_megalopolis_desc: "Başkentinizi, en az 400.000 nüfuslu bir pazar merkezi şehri olduğunda bir megalopolise yükseltin."
 cm__megalopolis_ignore_capital_name: "Megalopolis: Başkent Gereksinimini Yoksay"
 cm__megalopolis_ignore_capital_desc: "Başkentiniz olmayan bir şehirde Megalopolis Kurmanıza olanak tanır."
 cm__megalopolis_ignore_market_center_name: "Megalopolis: Pazar Merkezi Gereksinimini Yoksay"
 cm__megalopolis_ignore_market_center_desc: "Pazar merkezi olmayan bir şehirde Megalopolis Kurmanıza olanak tanır."
 cm__deurbanize_name: "Kentleşmeden Arındır"
 cm__deurbanize_desc: "Her ay, RGO malları aşağıdaki Şehirleşmesin listesinde işaretlendiğinde, sahip olunan lokasyonları kırsal yerleşkeye geri döndürür. Başkentiniz, fethedilen lokasyonlar ve vali makamları gibi Yakınlık sağlayan lokasyonlara dokunulmaz."
 cm__auto_urbanize_ignore_list_i20_name: "@wool! [ShowGoodsName('wool')] ([GetGlobalVariable('cm_goods_wool').GetGoods.GetDefaultMarketPrice]@gold!)"
 cm__full_automation_name: "Tam Otomasyon"
 cm__full_automation__full_automation_name: "Tam Otomasyon"
 cm__full_automation__full_automation_desc: "Müdahalesiz inşaat. Her ay, aşağıdaki kategoriler Altın Rezervi üzerindeki hazineyi mevcut en iyi inşaatlar için harcar. Diğer otomasyon özelliklerinin ayarlarına dokunmadan onlarla birlikte çalışır."
 cm__fa_enabled_name: "Tam Otomasyonu Etkinleştir"
 cm__fa_enabled_desc: "Tam otomasyonu aç veya kapat."
 cm__fa_reserve_name: "Altın Rezervi"
 cm__fa_reserve_desc: "Tam otomasyon hazinenizi asla bu miktarın altına düşürmez. Ayarlar sekmesindeki Altın Rezervi'nden ayrıdır."
 cm__fa_reserve_format: "[CMMV('cm__fa_reserve')]@gold!"
 cm__fa_save_unaffordable_name: "Ödenemeyen Binalar için Biriktir"
 cm__fa_save_unaffordable_desc: "Bir kategori, aylık payından daha fazla maliyetli olsa bile bulduğu en iyi binayı satın alır ve sonraki aylar farkı kapatana kadar harcama yapmadan bekler. Kapalıyken, her kategori harcayabildiğini harcar ve geri kalanını alt kademelere devreder."
 cm__full_automation__fa_priority_list_name: "Öncelikler"
 cm__full_automation__fa_priority_list_desc: "Yeniden sıralamak için sürükleyin. Kategoriler her ay yukarıdan aşağıya doğru işlenir. İki kategori aynı binayı istediğinde, üstteki kategori onu inşa eder."
 cm__fa_priority_list_item_column_name: "Kategori"
 cm__fa_priority_list_i1_name: "Gıda"
 cm__fa_priority_list_i1_desc: "Pazar merkezine sahip olduğunuz pazarlardaki yıl boyu gıda arzını izler ve medyan ayın yetersiz kaldığı durumlarda, en yüksek gıda potansiyeline sahip konumlarda otomatik gıdayı etkinleştirir. Seçtiği konumlar oyuncu tarafından etkinleştirilenler gibi parlar, ancak kontrol sizde kalır; konum artık size ait bir kırsal yerleşim değilse veya pazar merkezine artık sahip değilseniz asla kapatılmazlar."
 cm__fa_priority_list_i2_name: "Sanayi"
 cm__fa_priority_list_i2_desc: "Vergi geliriyle maliyetini en hızlı şekilde geri ödeyen üretim binalarını ve RGO'ları inşa eder, genişletir ve yükseltir. Herhangi bir işçi türünün zaten yetersiz olduğu ve otomatik gıda üretimi yapan konumlara dokunulmaz."
 cm__fa_priority_list_i3_name: "Fiyat Çökerticisi"
 cm__fa_priority_list_i3_desc: "İnşaat malzemelerinin üretimini artırarak fiyatlarını düşürür. Sahibi olduğunuz pazar merkezlerinin bulunduğu pazarlarda çalışır. En iyi üretim yapan konumlar önceliklidir ve her birine tek seferde birkaç seviye verilir; üreticiler, işçiler henüz gelmemiş olsa bile çalışmaya başlar. Başkentiniz, gıda üreten konumlar ve sübvansiyon olmadan zarar edecek üreticiler atlanır."
 cm__fa_priority_list_i4_name: "Yollar"
 cm__fa_priority_list_i4_desc: "Bir yolun sağladığı üç unsur (Yakınlık, Pazar Erişimi ve bir lokasyonu başkentinize bağlamak) üzerinden, altın başına en yüksek değeri sağlayan yol ağını inşa eder. Yılda bir kez, bunların her biri için sahip olduğunuz her lokasyona giden en iyi rotayı hesaplar; ardından her ay, rotanın devamındaki her şeyi hesaba katarak Vergi Matrahını en çok artıracak kesimleri başlatır. Öncelikle ucuz ve düz koridorlar döşenir; alttaki iki seçenek ise ancak üstteki seçeneğin döşeyecek bir şeyi kalmadığı aylarda altın alır."
 cm__fa_priority_list_i5_name: "Hizmetler"
 cm__fa_priority_list_i5_desc: "Uygun olan her yere destekleyici altyapı inşa eder: başkent binaları, otomatik inşa listesi, cıva avluları, pazar merkezi binaları, mübaşirler ve ülkenizin sahip olduğu kontrolü artıran tüm eşsiz binalar, pazar yerleri, hastalık önleyici binalar ve en son olarak tahıl ambarları. Kontrol binaları önce en zengin konumlara, pazar yerleri ise önce pazar erişimi en az olan konumlara inşa edilir."
 cm__fa_priority_list_i6_name: "Bina Temizliği"
 cm__fa_priority_list_i6_desc: "Yılda bir kez, artık kâr etmeyen ve sübvanse edilmeyen üretim binalarını kapatır; konumun desteklediği bina seviyelerinin on seviye dahilinde olduğu durumlarda ise bunun yerine onları yıkar. Kapattığı binalar, o tür o pazarda tekrar kazanç sağlamaya başladığında yeniden açılır ve konumda yer kalmazsa daha sonra yıkılır. @farming_village! [ShowBuildingTypeNameWithNoTooltip('farming_village')] asla kapatılmaz veya yıkılmaz."
 cm__fa_priority_list_i7_name: "Valiler"
 cm__fa_priority_list_i7_desc: "Valilerinizin nerede görev yapacağını planlar ve en iyi konumu önceliklendirerek onları yerleştirir. Bir vali yuvası her açıldığında ve aksi takdirde her yirmi beş yılda bir yeniden planlama yapar. Sadece tek oyunculu."
 cm__fa_priority_list_i8_name: "Kentsel Haklar"
 cm__fa_priority_list_i8_desc: "Kasaba ve şehirleriniz genelinde kentsel haklar verir. Önce [ShowTownRightsNameWithNoTooltip('granary_town')] gelir, ardından konum çevresinde üretilen mallara uygun olanlar arasından rastgele bir uzmanlaşma hakkı seçilir."
 cm__fa_priority_list__budget_name: "Bütçe Payı"
 cm__fa_priority_list__budget_desc: "Bu kategorinin her ay Altın Rezervi üzerindeki hazineden harcayabileceği pay."
 cm__fa_priority_list__budget_postfix: "%"
 cm__fa_priority_list__enabled_name: "Etkin"
 cm__fa_priority_list__enabled_desc: "Bu kategorinin inşa edilmesine izin ver."
 cm__full_automation__fa_industry_name: "Sanayi"
 cm__full_automation__fa_industry_desc: "Yukarıdaki Sanayi kategorisi için ayarlar."
 cm__fa_industry_algorithm_name: "İnşa Stratejisi"
 cm__fa_industry_algorithm_desc: "Sanayinin ne inşa edeceğini nasıl belirlediği."
 cm__fa_industry_algorithm_option_1_name: "Açgözlü"
 cm__fa_industry_algorithm_option_1_desc: "Önce en hızlı geri dönüş sağlayan seçenekleri ve sadece aynı malları üretmek için bulunan en iyi yere yakın olanları inşa et."
 cm__fa_industry_max_rel_roi_name: "Maksimum Göreceli Yatırım Getirisi"
 cm__fa_industry_max_rel_roi_desc: "Aynı malları üreten bir bina veya yükseltmenin, maliyetini geri ödeme süresi bakımından en iyi konumdan ne kadar daha yavaş olabileceğini ve buna rağmen inşa edilip edilmeyeceğini belirler. %30'da, en iyi konum 10 yılda geri ödeme yapıyorsa, yalnızca 13 yıl içinde geri ödeyenler inşa edilir; daha yavaş olanlar bekletilir. %0'da, her ay her mal türü için yalnızca en iyi üretici inşa edilir. %100+ değerinde herhangi bir limit yoktur ve yalnızca Maksimum Geri Ödeme Yılı geçerlidir. Hangi türde olursa olsun, aynı malları üreten her bina birlikte değerlendirilir. RGO genişletmeleri her zaman geri ödeme sırasına göre inşa edilir."
 cm__fa_industry_max_rel_roi_format: "[CMMV('cm__fa_industry_max_rel_roi')]%[Select_CString(GreaterThanOrEqualTo_CFixedPoint(CMMV('cm__fa_industry_max_rel_roi'), CMMMapValue('cmm_max', 'cm__fa_industry_max_rel_roi')), '+', '')]"
 cm__fa_industry_min_roi_name: "Maksimum Geri Ödeme Yılı"
 cm__fa_industry_min_roi_desc: "Sadece vergi geliri inşaat maliyetini bu kadar yıl içinde karşılayan inşaatlar dikkate alınır. Kontrolü devre dışı bırakmak için 0'a ayarlayın."
 cm__fa_industry_min_roi_format: "[CMMV('cm__fa_industry_min_roi')]y @efficiency!"
 cm__full_automation__fa_collapsar_name: "Fiyat Çöküşü"
 cm__full_automation__fa_collapsar_desc: "Yukarıdaki Price Collapsar kategorisi ayarları. Malzemeler listenin en üstünden aşağıya doğru işlenir ve RGO'lar üretici binalardan önce genişletilir."
 cm__fa_collapsar_target_name: "Hedef Fiyat"
 cm__fa_collapsar_target_desc: "Bir malzemenin inşasının taban fiyatına oranla duracağı fiyat. %-33'te, malzeme taban fiyatın %33 altında işlem görene kadar üreticiler inşa edilir. %0'da, taban fiyata ulaşana kadar inşa edilir. %+33'te ise sadece taban fiyatın %33 üzerindeyken inşa edilir."
 cm__fa_collapsar_target_format: "[CMMV('cm__fa_collapsar_target')]%"
 cm__fa_collapsar_item_column_name: "Malzeme"
 cm__fa_collapsar_i1_name: "@masonry! [ShowGoodsName('masonry')]"
 cm__fa_collapsar_i2_name: "@lumber! [ShowGoodsName('lumber')]"
 cm__fa_collapsar_i3_name: "@sand! [ShowGoodsName('sand')]"
 cm__fa_collapsar_i4_name: "@glass! [ShowGoodsName('glass')]"
 cm__fa_collapsar__enabled_name: "Etkin"
 cm__fa_collapsar__enabled_desc: "Bu malzemenin fiyatını düşürmek için çalış."
 cm__full_automation__fa_food_name: "Gıda"
 cm__full_automation__fa_food_desc: "Yukarıdaki Gıda kategorisi için ayarlar."
 cm__fa_food_target_name: "Fazlalık Hedefi"
 cm__fa_food_target_desc: "Bir pazar, arzı talebinin bu oranına ulaşana kadar daha fazla gıda yerleşkesi alır. %125 değerinde, yılın medyan ayında %25 fazlaya ulaşamayan her pazarda gıda genişletilir. Daha fazla emniyet payı tutmak için bu değeri yükseltin, yalnızca kıtlığa daha yakın olan pazarlara yardımcı olmak için ise düşürün."
 cm__fa_food_target_format: "[CMMV('cm__fa_food_target')]%"
 cm__fa_food_min_potential_name: "Minimum Gıda Potansiyeli"
 cm__fa_food_min_potential_desc: "Otomatik gıda, yalnızca DHY seviyesi başına gıda potansiyeli bu puana ulaşan mahallerde etkinleşir; bu, $mapmode_cm_location_food_potential_name$ harita modunda gösterilen puanın aynısıdır. Daha iyi tarım arazilerini beklemek için bu puanı yükseltin, daha zayıf arazileri kabul etmek için düşürün."
 cm__fa_food_min_potential_format: "[CMMV('cm__fa_food_min_potential')]"
 cm__full_automation__fa_urban_rights_name: "Kentsel Haklar"
 cm__full_automation__fa_urban_rights_desc: "Yukarıdaki Kentsel Haklar kategorisi için ayarlar."
 cm__fa_urban_rights_window_name: "Uygunluk Eşiği"
 cm__fa_urban_rights_window_desc: "Bir uzmanlaşma hakkının, aday olabilmesi için o lokasyondaki en uygun hakka kıyasla ne kadar uygun olması gerektiği. %50'de, en az yarı yarıya uygun olan her hak seçilebilir ve daha uygun olanlar daha sık seçilir. %100'de ise sadece en uygun hak verilir."
 cm__fa_urban_rights_window_format: "[CMMV('cm__fa_urban_rights_window')]%"
 cm__fa_urban_rights_reserve_name: "Hükümet Gücü Rezervi"
 cm__fa_urban_rights_reserve_desc: "Ödeme yapılması hükümet gücünüzü (yönetim biçimine bağlı olarak meşruiyet, cumhuriyet geleneği, adanmışlık veya sürü birliği) bu değerin altına düşürecekse hiçbir kentsel hak verilmez."
 cm__fa_urban_rights_expand_name: "Güçlendirilmiş Endüstrileri Genişlet"
 cm__fa_urban_rights_expand_desc: "Bir uzmanlık hakkı verildiğinde, hakkın desteklediği endüstriler ve konumun ürettiği ham maddeler için o konumda otomatik genişletmeyi de açar. Önerilen Kentsel Haklar haritasındaki bir verme düğmesine sağ tıklamakla aynıdır."
 cm__full_automation__fa_cleanup_name: "Bina Temizliği"
 cm__full_automation__fa_cleanup_desc: "Yukarıdaki Bina Temizleme kategorisi için ayarlar."
 cm__fa_cleanup_min_profit_name: "Minimum Kâr"
 cm__fa_cleanup_min_profit_desc: "Her ay bu miktardan daha az kazanan bir bina, işletilmeye değmez kabul edilir ve sübvanse edilmediği sürece kapatılır veya yıkılır. Bir pazardaki bir bina türünün açık durumdaki binalarının en fazla yarısı tek seferde bu işleme tabi tutulur."
 cm__fa_cleanup_min_profit_format: "[Divide_CFixedPoint(CMMV('cm__fa_cleanup_min_profit'), '(CFixedPoint)100')|2]@gold!"
 cm__fa_cleanup_core_goods_name: "İnşaat Malzemelerine Öncelik Ver"
 cm__fa_cleanup_core_goods_desc: "Çoğunlukla @masonry![ShowGoodsNameWithNoTooltip('masonry')], @lumber![ShowGoodsNameWithNoTooltip('lumber')], @sand![ShowGoodsNameWithNoTooltip('sand')] veya @glass![ShowGoodsNameWithNoTooltip('glass')] tüketen binaları Minimum Kârın iki katı veya hangisi daha yüksekse 0,1@gold! eşiğinde tut. Bu dördünden birini üreten binalar normal Minimum Kâr üzerinden değerlendirilir."
 cm__fa_cleanup_auto_food_name: "Otomatik Gıda Konumlarını Temizle"
 cm__fa_cleanup_auto_food_desc: "Otomatik gıdanın devrede olduğu ve her türden işçinin halihazırda yetersiz olduğu yerlerde, gıda üretmeyen üretim binalarını yık. Bir @market_village! [ShowBuildingTypeNameWithNoTooltip('market_village')] tamamen yıkılmak yerine bir seviyeye düşürülür."
 cm__full_automation__fa_roads_name: "Yollar"
 cm__full_automation__fa_roads_desc: "Yukarıdaki Yollar kategorisi için ayarlar."
 cm__fa_roads_proximity_name: "Yakınlık"
 cm__fa_roads_proximity_desc: "Altın başına Yakınlığı en çok artıran yol kesimlerini, güzergahın devamındaki her konumu hesaba katarak döşe."
 cm__fa_roads_market_access_name: "Pazar Erişimi"
 cm__fa_roads_market_access_desc: "Altın başına Pazar Erişimini en çok artıran yol kesimlerini döşe. Sadece döşenecek Yakınlık kesimi kalmadığında aylık harcama yapar."
 cm__fa_roads_capital_name: "Başkent Bağlantısı"
 cm__fa_roads_capital_desc: "Yerleşimlerinizi başkentinize bağlamak için halihazırda bağlı olanlardan dışarıya doğru yol bölümleri döşeyin. Sadece Yakınlık ve Pazar Erişimi bölümlerinden döşenecek bir şey kalmadığında o ay harcama yapar."
 cm__full_automation__fa_governors_name: "Valiler"
 cm__full_automation__fa_governors_desc: "Yukarıdaki Valiler kategorisi için ayarlar."
 cm__fa_gov_move_seats_name: "Valilerin Taşınmasına İzin Ver"
 cm__fa_gov_move_seats_desc: "Tüm vali yuvaları dolduğunda, bir valiyi görevden al ve onun yerine daha iyi bir konuma yerleştir. Daha iyi konumun halihazırda bir Şehir olması veya yerini aldığı konumdan %10'dan daha yüksek bir puan alması gerekir. Bu seçenek kapalıyken, valiler yalnızca boş olan yuvalara yerleşir."
 cm__fa_gov_prepare_sites_name: "Yeni Konumların Hazırlanmasına İzin Ver"
 cm__fa_gov_prepare_sites_desc: "Henüz vali atanamayan konumları dikkate alıp orada bir Kasaba veya Şehir kurarak ve başkentinize yol inşa ederek önce onları hazır hale getirir. Bu kapalıyken, yalnızca halihazırda Şehir olan ve başkentinize yol bağlantısı bulunan konumlar değerlendirilir."
 cm__map_modes_name: "Harita Modları"
 cm__map_modes__placement_finder_name: "Önerilen Başkent ve Vali Konumu"
 cm__map_modes__placement_finder_desc: "Önerilen Vali ve Önerilen Başkent yerleşimi harita modları için ayarlar."
 cm__placement_finder_method_name: "Yerleştirme Bulucu Puanlaması"
 cm__placement_finder_method_desc: "Önerilen Vali ve Önerilen Başkent harita modlarının konumlarınızı nasıl sıraladığı."
 cm__placement_finder_method_option_1_name: "Vergi Tabanı"
 cm__placement_finder_method_option_1_desc: "Bir valinin veya oraya yerleştirilen bir başkentin toplam vergi matrahınızı ne kadar artıracağına göre sıralayın. Daha zengin konumlar daha fazla sayılır."
 cm__placement_finder_method_option_2_name: "Yakınlık"
 cm__placement_finder_method_option_2_desc: "Oraya yerleştirilen bir valinin veya başkentin ne kadar yakınlık ekleyeceğine göre sırala."
 cm__placement_finder_roads_name: "Kara Altyapısı"
 cm__placement_finder_roads_desc: "Önerilen Vali ve Önerilen Başkent harita modlarının ideal kara altyapısını mı varsayacağını yoksa halihazırda inşa ettiklerinizi mi kullanacağını belirler."
 cm__placement_finder_roads_option_1_name: "Mevcut"
 cm__placement_finder_roads_option_1_desc: "Halihazırda inşa ettiğiniz yolları kullanın."
 cm__placement_finder_roads_option_2_name: "Maksimum Yol"
 cm__placement_finder_roads_option_2_desc: "Kilidini açtığınız en iyi yolun her bağlantıda inşa edildiğini varsayın."
 cm__placement_finder_roads_option_3_name: "Mümkün Olan En İyi"
 cm__placement_finder_roads_option_3_desc: "Kilidini açtığınız en iyi yolun her bağlantıda inşa edildiğini ve kara yakınlığını artıran kilidi açılmış her binanın uygun olan her yere inşa edildiğini varsayın."
 cm__placement_finder_naval_name: "Deniz Altyapısı"
 cm__placement_finder_naval_desc: "Tavsiye Edilen Vali ve Tavsiye Edilen Başkent harita modlarının ideal deniz altyapısını mı varsaydığı yoksa mevcut liman kapasitenizi ve deniz varlığınızı mı kullandığı."
 cm__placement_finder_naval_option_1_name: "Mevcut"
 cm__placement_finder_naval_option_1_desc: "Mevcut liman kapasitenizi ve donanma varlığınızı kullanır."
 cm__placement_finder_naval_option_2_name: "Maksimum Varlık"
 cm__placement_finder_naval_option_2_desc: "Mevcut liman kapasitenizle her yerde tam deniz mevcudiyeti varsayın."
 cm__placement_finder_naval_option_3_name: "Mümkün Olan En İyi"
 cm__placement_finder_naval_option_3_desc: "Tam deniz mevcudiyetini ve her kıyı konumunda inşa edilmiş, kilidini açtığınız en iyi liman binalarını varsay."
 cm__placement_finder_accuracy_name: "Arama Doğruluğu"
 cm__placement_finder_accuracy_desc: "Önerilen Vali ve Önerilen Başkent harita modlarının en iyi konumları ne kadar kapsamlı arayacağı. Atlanan konumlar siyah olarak görünür."
 cm__placement_finder_accuracy_option_1_name: "Kapsamlı"
 cm__placement_finder_accuracy_option_1_desc: "Her lokasyonu değerlendir. En isabetli ve en yavaş olanıdır."
 cm__placement_finder_accuracy_option_2_name: "Kapsamlı"
 cm__placement_finder_accuracy_option_2_desc: "İlk üçünüz arasına giremeyecek lokasyonları atlayın. İlk üç ve puanları Kapsamlı ile aynıdır, sadece daha hızlıdır."
 cm__placement_finder_accuracy_option_3_name: "Dengeli"
 cm__placement_finder_accuracy_option_3_desc: "Tek başına en iyisi olamayacak konumları atla. En iyi konum hâlâ kesin olarak garanti edilir; 2. ve 3. işaretleyiciler bazen farklılık gösterebilir."
 cm__placement_finder_accuracy_option_4_name: "Hızlı"
 cm__placement_finder_accuracy_option_4_desc: "Ayrıca en iyisi olma ihtimali çok düşük olan konumları da atla. Bulunan en iyi konum, gerçek en iyinin %20'si dahilindedir ve genellikle hâlâ tam sonuçtur."
 cm__placement_finder_accuracy_option_5_name: "En Hızlı"
 cm__placement_finder_accuracy_option_5_desc: "Her vilayetin en gelecek vadeden konumunu değerlendirir, ardından liderler etrafında detaylandırır. Büyük ülkeler için çok daha hızlıdır; en iyi konumu gözden kaçırabilir."
 cm__debug_name: "Hata Ayıklama"
 cm__debug__logging_name: "Eylem Günlüğü"
 cm__debug__logging_desc: "Bu modun hangi eylemlerinin mod eylem günlüğüne yazılacağı."
 cm__log_cycle_name: "İnşa Döngüsü"
 cm__log_cycle_desc: "Önceki döngü hâlâ boşaltıldığı için atlanan aylık döngü ve art arda iki atlamayı takip eden sıfırlama satırları."
 cm__log_industry_name: "Sanayi"
 cm__log_industry_desc: "Sanayi kategorisinin sıraya aldığı her bina ve değerlendirdiği her hammadde genişletmesi için, her birinin arkasındaki amorti süresi ve gelirini içeren satırlar."
 cm__log_collapsar_name: "Fiyat Çöküşü"
 cm__log_collapsar_desc: "Bir konumun Price Collapsar döngüsü boyunca izlediği satırlar: piyasanın açığı ve talep ettiği seviyeler, ardından o konuma ne verildiği, puanı ve ne inşa edildiği. Önce konumu şu konsol komutuyla işaretleyin: location:<key> = { cm_fa_col_watch_on = yes }."
 cm__log_food_name: "Otomatik Gıda"
 cm__log_food_desc: "Gıda kategorisi satırları: her pazarın aylık gıda arzı, talebi ve oranı; bu oranın hedefe göre değerlendirildiği yıllık medyan; halihazırda gıda yetiştiren konumların sayısı ve etkinleştirdiği veya devre dışı bıraktığı her konum."
 cm__log_roads_name: "Yollar"
 cm__log_roads_desc: "Yol kategorisinin sipariş ettiği her yol için; konumu, yolun hangi üç nedenden dolayı alındığını ve maliyetini belirten birer satır."
 cm__log_cleanup_name: "Bina Temizliği"
 cm__log_cleanup_desc: "Yıllık Bina Temizliği aşaması ve kapattığı, daralttığı, yıktığı veya yeniden açtığı her bina için satırlar; her birinin kârı ve kıyaslandığı alt sınır ile birlikte."
 cm__log_governors_name: "Valiler"
 cm__log_governors_desc: "Vali planı satırları: seçilen ve bırakılan sahalar, kasaba ve şehir yükseltmeleri, yerleştirmeler, yer değiştirmeler ve redler, ayrıca şanslı bir ulusun başkent taşıması."
 cm__log_military_name: "Şanslı Ülke Askeri"
 cm__log_military_desc: "Şanslı bir ulusun kaleleri yıkıp insan gücü binaları inşa etmesine dair satırlar."
 cm__log_government_name: "Şanslı Ulus Hükümeti"
 cm__log_government_desc: "Bürokrasiyi kaldıran veya bir zümre eylemi gerçekleştiren şanslı bir ulus için satırlar."
 cm__debug__diagnostics_name: "Tanılama"
 cm__placement_finder_debug_path_name: "Hata Ayıklama Tanılamasını Etkinleştir"
 cm__placement_finder_debug_path_desc: "Önerilen Vali ve Önerilen Başkent harita modu araç ipuçlarına bir tanı bloğu ekler: başkentinizden her konuma giden öngörülen rota ile her atlamanın maliyeti ve gerçek yakınlığınızla karşılaştırılan öngörülen yakınlık."
 cm__debug__probes_name: "Sondalar"
 cm__debug__probes_desc: "Mod eylem günlüğüne yazılan tek seferlik tanılamalar."
 cm__probe_budget_name: "Tam Otomasyon Bütçesi"
 cm__probe_budget_desc: "Her Tam Otomasyon kategorisinin bakiyesi; henüz karşılayamadığı bir seçim için altın ayırdığında pozitif, aşırı harcama nedeniyle borçlandığında negatiftir; Sanayi geri ödeme limiti ve bu döngüde atlanan bir piyasada bekleyen en iyi aday ile birlikte."
 cm__probe_budget_text: "Çalıştır"
 cm__probe_governors_name: "Vali Planı"
 cm__probe_governors_desc: "Vali planının ulaştığı nokta: aşaması, kaç sahaya sahip olduğu ve henüz kaç tane yerleştirmesi gerektiği, hazineyi tutup tutmadığı, ödemesi yapılmış valiler ve üzerinde çalıştığı yuvalar ile koltuklar."
 cm__probe_governors_text: "Çalıştır"
 cm__probe_military_name: "Şanslı Devlet Askeriyesi"
 cm__probe_military_desc: "Ülkenin bulunduğu insan gücü binası kademesi, bunu inşa edip edemeyeceği, başkent ikilisinin durumu, Askeri bütçe ve kaç konumun bu kademeyi alabildiği ile kaçının halihazırda buna sahip olduğu."
 cm__probe_military_text: "Çalıştır"
 cm__probe_industry_anchors_name: "Sanayi Çapaları"
 cm__probe_industry_anchors_desc: "Sanayinin her mal için kaydettiği en iyi geri ödeme değerini ve bunun belirlediği geri ödeme sınırını, ilgili bina ve konumu belirterek mal başına bir satırda listeler."
 cm__probe_industry_anchors_text: "Çalıştır"
 cm__probe_industry_rgo_name: "Sanayi Ham Maddeleri"
 cm__probe_industry_rgo_desc: "Sanayinin bir konumun ham maddelerini es geçme nedenlerinin her biri için bir satır veya hiçbirini es geçmediğinde tek bir satır. Bir konumu location:<key> = { cm_fa_col_watch_on = yes } konsol komutu efekti ile işaretlemediğiniz sürece başkenti okur."
 cm__probe_industry_rgo_text: "Çalıştır"
 cm__probe_collapsar_name: "Fiyat Çöküşü"
 cm__probe_collapsar_desc: "Price Collapsar'ın bir konumda okuduğu her sayı, her biri oyunun kendi okumasının yanında ve ardından o konumun pazarının bir döngüde absorbe edebileceği miktar. location:<key> = { cm_fa_col_watch_on = yes } konsol komutu ile bir konumu işaretlemediğiniz sürece başkenti okur; başkent asla bir Price Collapsar adayı değildir, bu yüzden inşaat yapacağı bir yeri okumak için bir konumu işaretleyin."
 cm__probe_collapsar_text: "Çalıştır"
 cm__probe_roads_name: "Yollar"
 cm__probe_roads_desc: "Yol planının yakınlık, pazara erişim ve başkent bağlantısı için kaç koridor tuttuğu, başkent bağlantılı olanlardan kaçının henüz başlatılabileceği, halihazırda kaç yolun inşa edildiği ve kategorinin havuzunda ne kaldığı."
 cm__probe_roads_text: "Çalıştır"
 cm__probe_log_gate_name: "Eylem Günlüğü Eşiği"
 cm__probe_log_gate_desc: "Price Collapsar günlük kategorisini, hem günlük kapısının okuduğu hem de menünün kaydettiği haliyle iki kez gösterir; böylece birinde açık, diğerinde kapalı olan kategoriler görünür."
 cm__probe_log_gate_text: "Çalıştır"
