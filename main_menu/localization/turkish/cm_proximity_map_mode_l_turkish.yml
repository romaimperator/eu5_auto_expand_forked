l_turkish:
 mapmode_cm_location_proximity_modifier_name: "Yakınlık Verimliliği Etkisi"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER: "#T $mapmode_cm_location_proximity_modifier_name$#!\n[locations|e] öğesini $mapmode_cm_location_proximity_modifier_name$ değerine göre renklendirir: [topography|e] ve [vegetation|e]'nin [proximity|e] üzerine uyguladığı birleşik ceza (dağlar, tepeler, platolar, sulak alanlar, ormanlar, cangıllar vb.). Yeşil, arazinin yakınlığı engellemediği; kırmızı ise ağır şekilde engellediği anlamına gelir. Topoğrafya cezaları, sahibinin başkent arazisi veya ilerlemeler gibi yakınlık etkisi bonuslarına göre ölçeklendirilir; sahipsiz konumlar temel arazi değerlerini gösterir. Bir konumdaki [road|e] veya [river|e], [vegetation|e] cezasını iptal eder; [topography|e] cezası her zaman geçerlidir."
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_LAND: "$mapmode_cm_location_proximity_modifier_name$: [ROOT.GetLocation.MakeScope.ScriptValue('cm_location_proximity_modifier')|+=%]"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_LAND_HARBOR: "$MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_LAND$\nDoğal Liman Uygunluğu: [ROOT.GetLocation.GetModifierValueFixed('natural_harbor_suitability')|0%]"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER: "[ROOT.GetLocation.GetName] kara değildir, bu yüzden $mapmode_cm_location_proximity_modifier_name$ yoktur."

 cm_location_proximity_modifier_none_legend_key: "%0 (ceza yok)"
 cm_location_proximity_modifier_light_legend_key: "-25% (hafif)"
 cm_location_proximity_modifier_noticeable_legend_key: "-35% (belirgin)"
 cm_location_proximity_modifier_moderate_legend_key: "-50% (orta)"
 cm_location_proximity_modifier_heavy_legend_key: "-65% (ağır)"
 cm_location_proximity_modifier_severe_legend_key: "-75% (ağır)"
 cm_location_proximity_modifier_worst_legend_key: "-100% (en kötü)"
 cm_location_proximity_modifier_harbor_legend_key: "Doğal Liman Uygunluğu (çizgili)"
