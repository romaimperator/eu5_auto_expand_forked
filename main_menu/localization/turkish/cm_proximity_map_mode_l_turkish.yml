l_turkish:
 mapmode_cm_location_proximity_modifier_name: "Yakınlık Verimliliği Etkisi"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER: "#T $mapmode_cm_location_proximity_modifier_name$#!\n[locations|e] ögelerini $mapmode_cm_location_proximity_modifier_name$ değerlerine göre renklendirir: [topography|e] ve [vegetation|e] ögelerinin [proximity|e] (dağlar, tepeler, platolar, sulak alanlar, ormanlar, balta girmemiş ormanlar vb.) üzerinde uyguladığı birleşik ceza. Yeşil, arazinin yakınlığı engellemediği; kırmızı ise ağır şekilde engellediği anlamına gelir. Topografya cezaları, sahibinin başkent arazisi veya ilerlemeler gibi yakınlık etkisi bonuslarına göre ölçeklendirilir; sahipsiz konumlar temel arazi değerlerini gösterir. Bir konumdaki [road|e] veya [river|e], [vegetation|e] cezasını iptal eder; [topography|e] cezası her zaman uygulanır.\n\nSu bunun yerine seçilen [country|e] tarafının oradaki [maritime_presence|e] değerini, en düşükte yeşilden başlayarak açık yeşil ve tam değerde açık maviye kadar gösterir. Yüksek varlık, bir [seazone|e] üzerinden geçerken kaybedilen [proximity|e] miktarını azaltır."
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_LAND: "$mapmode_cm_location_proximity_modifier_name$: [ROOT.GetLocation.MakeScope.ScriptValue('cm_location_proximity_modifier')|+=%]"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_LAND_HARBOR: "$MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_LAND$\nDoğal Liman Uygunluğu: [ROOT.GetLocation.GetModifierValueFixed('natural_harbor_suitability')|0%]"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER: "[ROOT.GetLocation.GetName] kara değildir, bu yüzden $mapmode_cm_location_proximity_modifier_name$ yoktur ve seçilen [country|e] burada [maritime_presence|e] sahibi değildir."

