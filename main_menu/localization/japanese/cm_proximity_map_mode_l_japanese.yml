l_japanese:
 mapmode_cm_location_proximity_modifier_name: "近接効率の影響"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER: "#T $mapmode_cm_location_proximity_modifier_name$#!\n近接効率への影響によって[locations|e]を色分けします：これは[topography|e]と[vegetation|e]が[proximity|e]（山岳、丘陵、高原、湿地、森林、ジャングルなど）に課す複合的なペナルティです。緑色は地形が近接を妨げないことを示し、赤色は大幅に妨げることを示します。地形ペナルティは、首都の地形や進歩（Advances）といった所有者の近接影響ボーナスによって調整されます。未所有のロケーションには基本の地形値が表示されます。ロケーションにある[road|e]または[river|e]はその[vegetation|e]ペナルティを打ち消しますが、[topography|e]ペナルティは常に適用されます。"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_LAND: "近接効率の影響: [ROOT.GetLocation.MakeScope.ScriptValue('cm_location_proximity_modifier')|+=%]"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_LAND_HARBOR: "近接効率の影響: [ROOT.GetLocation.MakeScope.ScriptValue('cm_location_proximity_modifier')|+=%]\n天然の港の適性: [ROOT.GetLocation.GetModifierValueFixed('natural_harbor_suitability')|0%]"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER: "[ROOT.GetLocation.GetName]は陸地ではないため、近接効率への影響はありません。"

 cm_location_proximity_modifier_none_legend_key: "0% (ペナルティなし)"
 cm_location_proximity_modifier_light_legend_key: "-25% (軽度)"
 cm_location_proximity_modifier_noticeable_legend_key: "-35% (顕著)"
 cm_location_proximity_modifier_moderate_legend_key: "-50% (中程度)"
 cm_location_proximity_modifier_heavy_legend_key: "-65% (重い)"
 cm_location_proximity_modifier_severe_legend_key: "-75% (深刻)"
 cm_location_proximity_modifier_worst_legend_key: "-100% (最悪)"
 cm_location_proximity_modifier_harbor_legend_key: "天然港の適性（縞模様）"
