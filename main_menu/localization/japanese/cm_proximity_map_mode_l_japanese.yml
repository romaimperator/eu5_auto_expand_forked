l_japanese:
 mapmode_cm_location_proximity_modifier_name: "近接効率の影響"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER: "#T $mapmode_cm_location_proximity_modifier_name$#!\n[locations|e]をその$mapmode_cm_location_proximity_modifier_name$に基づいて色分けします：その[topography|e]と[vegetation|e]が[proximity|e]（山岳、丘陵、高原、湿地、森林、ジャングルなど）に与える合計ペナルティです。緑は地形が近接度を妨げないことを、赤は大きく妨げることを意味します。地形ペナルティは、首都の地形や進歩などによる所有者の近接度影響ボーナスによって調整されます。所有者のいない立地は基礎地形値を示します。立地に[road|e]または[river|e]がある場合、その[vegetation|e]ペナルティは打ち消されますが、[topography|e]ペナルティは常に適用されます。\n\n水域には、代わりに選択した[country|e]がそこに持つ[maritime_presence|e]が表示され、最小の緑から薄緑を経て、最大（フル）の状態の薄青へと変化します。高いプレゼンスは、[seazone|e]を横断する際に失われる[proximity|e]を軽減します。"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_LAND: "$mapmode_cm_location_proximity_modifier_name$: [ROOT.GetLocation.MakeScope.ScriptValue('cm_location_proximity_modifier')|+=%]"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_LAND_HARBOR: "$MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_LAND$\n天然の良港の適性: [ROOT.GetLocation.GetModifierValueFixed('natural_harbor_suitability')|0%]"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER: "[ROOT.GetLocation.GetName]は陸地ではないため$mapmode_cm_location_proximity_modifier_name$がなく、選択された[country|e]はここで[maritime_presence|e]を持ちません。"

 cm_location_proximity_modifier_none_legend_key: "0% (ペナルティなし)"
 cm_location_proximity_modifier_light_legend_key: "-25% (軽度)"
 cm_location_proximity_modifier_noticeable_legend_key: "-35% (顕著)"
 cm_location_proximity_modifier_moderate_legend_key: "-50% (中程度)"
 cm_location_proximity_modifier_heavy_legend_key: "-65% (重い)"
 cm_location_proximity_modifier_severe_legend_key: "-75% (深刻)"
 cm_location_proximity_modifier_worst_legend_key: "-100% (最悪)"
 cm_location_proximity_modifier_harbor_legend_key: "天然港の適性（縞模様）"
 cm_location_proximity_modifier_maritime_none_legend_key: "海上プレゼンスなし (外洋)"
 cm_location_proximity_modifier_maritime_low_legend_key: "低い海事の存在感"
 cm_location_proximity_modifier_maritime_half_legend_key: "50% 海洋プレゼンス"
 cm_location_proximity_modifier_maritime_full_legend_key: "100% 海上プレゼンス"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER_M0: "[maritime_presence|E]: 0-10%"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER_M10: "[maritime_presence|E]: 10-20%"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER_M20: "[maritime_presence|E]: 20-30%"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER_M30: "[maritime_presence|E]: 30-40%"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER_M40: "[maritime_presence|E]: 40-50%"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER_M50: "[maritime_presence|E]: 50-60%"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER_M60: "[maritime_presence|E]: 60-70%"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER_M70: "[maritime_presence|E]: 70-80%"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER_M80: "[maritime_presence|E]: 80-90%"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER_M90: "[maritime_presence|E]: 90-100%"
