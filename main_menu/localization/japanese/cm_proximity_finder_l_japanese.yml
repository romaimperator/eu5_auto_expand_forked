 # Action bar refresh button
 cm_pf_refresh: "cm_pf_refresh"
 cm_pf_refresh_color: "ダークターコイズ"
 cm_pf_refresh_icon: "@cm_pf_refresh!"
 cm_pf_refresh_name: "配置スコアの再計算"
 cm_pf_refresh_tooltip: "現在の国境に基づいて知事と首都の配置スコアを強制的に再計算します。そうでない場合、スコアは最大4年間再利用されます。"
 cm_pf_estimate_note: "これは見積もりです。「設置場所検索スコアリング」設定は場所を税収基盤または生の[proximity|e]のどちらでランク付けするかを選択し、「陸上インフラ」および「海上インフラ」設定は想定される道路、建物、[maritime_presence|e]を選択します。このマップモードを開いた際に再計算されますが、その頻度は最大で4年に1回です。強制的に再計算を行うには、アクションバーの更新ボタンを使用してください。完了すると色が更新されます。"
 cm_pf_tt_no_data: "まだ算出されていません。アクションバーの更新ボタンを使用して、現在の国境のスコアを計算してください。"
 cm_pf_tt_skipped: "未評価：検索精度設定により、この場所はスキップされました。設定を「徹底的」にして更新し、すべての場所を評価してください。"
 cm_pf_tt_foreign: "自国領ではありません。"
 cm_pf_source_legend: "既存の近接供給源 (縞模様)"
 cm_pf_of_best: "最良の"
 cm_pf_gov_tt_head: "予測される最大平均[proximity|e]増加量: +[ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_gf_avg_value')|1]%\n[proximity|e]から得られる最大予測税収基盤: +[ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_gf_taxgain_value')|1]"
 cm_pf_gov_source_line: "既存の[proximity|e]の供給元: [ROOT.GetLocation.GetModifierValueFixed('local_proximity_source')|0]"
 cm_pf_cap_tt_head: "資本投入時の[proximity|e]の予測最大平均: [ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_cf_avg_value')|1]%\n[proximity|e]による最大予測税収基盤: +[ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_cf_taxgain_value')|1]"
