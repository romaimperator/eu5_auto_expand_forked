l_japanese:
 mapmode_cm_governor_finder_name: "総督の推奨配置"
 MAPMODE_CM_GOVERNOR_FINDER: "#T $mapmode_cm_governor_finder_name$#!\n[capital|e]や既存の供給源がすでに提供している近接性を考慮した上で、新しく地方総督または海軍総督を建設した場合にどれほどの[proximity|e]が追加されるかに基づいて[locations|e]を色分けします。緑色に近いほど効果が高くなります。あなたの首都および既存の近接性供給源は縞模様で表示されます。\nこれは推定値です。「配置検索スコアリング」設定で場所を課税ベースまたは生の[proximity|e]のどちらでランク付けするかを選択し、「陸上インフラ」および「海上インフラ」設定で想定される道路、建物、および[maritime_presence|e]を選択します。このマップモードを開いた際に再計算されますが、その頻度は最大で4年に1回です。強制的に再計算するには、アクションバーの更新ボタンを使用してください。計算が完了すると色が更新されます。"
 MAPMODE_CM_GOVERNOR_FINDER_TT_SCORED: "予測される[proximity|e]の最大平均増加量: +[ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_gf_avg_value')|1]%\n[proximity|e]から得られる最大予測税収基盤: +[ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_gf_taxgain_value')|1]\nスコア: 最良の立地の[ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_gf_pct_value')|0]%[ROOT.GetLocation.Custom('cm_pf_gf_status')]"
 MAPMODE_CM_GOVERNOR_FINDER_TT_BEST: "予測される最大平均[proximity|e]増加量: +[ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_gf_avg_value')|1]%\n[proximity|e]から得られる予測最大税収基盤: +[ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_gf_taxgain_value')|1]\nあなたの最良のロケーション"
 MAPMODE_CM_GOVERNOR_FINDER_TT_SCORED_DEBUG: "$MAPMODE_CM_GOVERNOR_FINDER_TT_SCORED$$CM_PF_DEBUG_BLOCK$"
 MAPMODE_CM_GOVERNOR_FINDER_TT_BEST_DEBUG: "$MAPMODE_CM_GOVERNOR_FINDER_TT_BEST$$CM_PF_DEBUG_BLOCK$"
 MAPMODE_CM_GOVERNOR_FINDER_TT_CAPITAL: "あなたの[capital|e]はすでにここから[proximity|e]を広めています。"
 MAPMODE_CM_GOVERNOR_FINDER_TT_CAPITAL_DEBUG: "$MAPMODE_CM_GOVERNOR_FINDER_TT_CAPITAL$$CM_PF_DEBUG_BLOCK$"
 MAPMODE_CM_GOVERNOR_FINDER_TT_SOURCE: "既存の[proximity|e]供給源: [ROOT.GetLocation.GetModifierValueFixed('local_proximity_source')|0]\n$MAPMODE_CM_GOVERNOR_FINDER_TT_SCORED$"
 MAPMODE_CM_GOVERNOR_FINDER_TT_SOURCE_DEBUG: "$MAPMODE_CM_GOVERNOR_FINDER_TT_SOURCE$$CM_PF_DEBUG_BLOCK$"
 MAPMODE_CM_GOVERNOR_FINDER_TT_SOURCE_NOGAIN: "既存の[proximity|e]供給源: [ROOT.GetLocation.GetModifierValueFixed('local_proximity_source')|0]\n$MAPMODE_CM_GOVERNOR_FINDER_TT_NOGAIN$"
 MAPMODE_CM_GOVERNOR_FINDER_TT_SOURCE_NOGAIN_DEBUG: "$MAPMODE_CM_GOVERNOR_FINDER_TT_SOURCE_NOGAIN$$CM_PF_DEBUG_BLOCK$"
 MAPMODE_CM_GOVERNOR_FINDER_TT_NOGAIN: "知事は最大で80の[proximity|e]を提供し、この場所は[ROOT.GetLocation.Custom('cm_pf_nogain_basis')]であるため、ここに知事を建設しても何も追加されません。"
 MAPMODE_CM_GOVERNOR_FINDER_TT_NOGAIN_DEBUG: "$MAPMODE_CM_GOVERNOR_FINDER_TT_NOGAIN$$CM_PF_DEBUG_BLOCK$"
 cm_pf_nogain_basis_current: "既にそれ以上の量があります"
 cm_pf_nogain_basis_assumed: "想定されるインフラの下で、既に少なくともそれだけの量を有していることになります"
 CM_PF_DEBUG_BLOCK: "[ROOT.GetLocation.Custom('cm_pf_debug_block')]"
 cm_pf_debug_block_text: "\n--デバッグ--\n[ROOT.GetLocation.Custom('cm_pf_pred_label')]: [ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_pred_value')|0]%\n現在の[proximity|e]: [ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_current_proximity')|0]%[ROOT.GetLocation.Custom('cm_pf_path_block')]"
 cm_pf_pred_label_max: "首都からの予測最大[proximity|e]"
 cm_pf_pred_label_current: "首都からの現在の予測[proximity|e]"
 cm_pf_blank: ""
