 MAPMODE_CM_CAPITAL_FINDER_TT_FOREIGN: "自国の一部ではありません。"
 MAPMODE_CM_CAPITAL_FINDER_TT_WATER: "これは水域のロケーションです。首都スコアは自領の陸地に適用されます。"

