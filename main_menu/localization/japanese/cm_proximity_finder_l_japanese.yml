 mapmode_cm_capital_finder_name: "推奨される首都の所在地"
 MAPMODE_CM_CAPITAL_FINDER: "#T $mapmode_cm_capital_finder_name$#!\nそこに[capital|e]を配置した際にどれほど良好に[proximity|e]が広まるかに基づいて[locations|e]を色分けします。既存の総督は無視されます。縞模様のロケーションは、現在の首都や総督などの近接性の供給源を既に保持しています。\nこれは推定値です。「配置ファインダーのスコアリング」設定はロケーションを税収基盤または生の[proximity|e]のどちらでランク付けするかを選択し、「陸上インフラ」および「海上インフラ」設定は想定される道路、建物、[maritime_presence|e]を選択します。このマップモードを開いた時に再計算されますが、頻度は最大で4年に1回です。強制的に再計算するにはアクションバーの更新ボタンを使用してください。完了すると色が更新されます。"
 MAPMODE_CM_CAPITAL_FINDER_TT_SCORED: "首都を含む[proximity|e]の予測最大平均: [ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_cf_avg_value')|1]%\n[proximity|e]からの最大予測税収基盤: +[ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_cf_taxgain_value')|1]\nスコア: 最良のロケーションの[ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_cf_pct_value')|0]%[ROOT.GetLocation.Custom('cm_pf_cf_status')]"
 MAPMODE_CM_CAPITAL_FINDER_TT_BEST: "首都を含めた[proximity|e]の予測最大平均: [ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_cf_avg_value')|1]%\n[proximity|e]による予測最大税収基盤: +[ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_cf_taxgain_value')|1]\nあなたの最良のロケーション"
 MAPMODE_CM_CAPITAL_FINDER_TT_SCORED_DEBUG: "$MAPMODE_CM_CAPITAL_FINDER_TT_SCORED$$CM_PF_DEBUG_BLOCK$"
 MAPMODE_CM_CAPITAL_FINDER_TT_BEST_DEBUG: "$MAPMODE_CM_CAPITAL_FINDER_TT_BEST$$CM_PF_DEBUG_BLOCK$"
 MAPMODE_CM_CAPITAL_FINDER_TT_SOURCE: "$MAPMODE_CM_CAPITAL_FINDER_TT_SCORED$\n既存の近接性ソース: [ROOT.GetLocation.GetModifierValueFixed('local_proximity_source')|0]"
 MAPMODE_CM_CAPITAL_FINDER_TT_SOURCE_DEBUG: "$MAPMODE_CM_CAPITAL_FINDER_TT_SOURCE$$CM_PF_DEBUG_BLOCK$"
 MAPMODE_CM_CAPITAL_FINDER_TT_NO_DATA: "まだ算出されていません。現在の国境のスコアを計算するには、アクションバーの更新ボタンを使用してください。"
 MAPMODE_CM_CAPITAL_FINDER_TT_SKIPPED: "未評価：検索精度設定により、この場所はスキップされました。「網羅的」に設定して更新し、すべての場所を評価してください。"
