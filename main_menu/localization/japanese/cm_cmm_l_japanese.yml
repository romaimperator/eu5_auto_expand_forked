 cm__expand_metric_name: "自動拡張指標"
 cm__expand_metric_desc: "建物やRGOのレベルを追加するかどうかを、自動拡張が何に基づいて判断するかを選択します。「税収」と「利益」はレベルごとの最小月間収入を設定し、「ROI」オプションは建設コストを回収するまでの最大年数を設定します。"
 cm__expand_metric_option_1_name: "@income! 税収"
 cm__expand_metric_option_1_desc: "月間税収が設定した最小税収（Min Tax Income）以上である場合にのみ、新しいレベルを追加します。"
 cm__expand_metric_option_2_name: "@wealth! 利益"
 cm__expand_metric_option_2_desc: "月間総利益が設定した最小利益以上の場合にのみ、新しいレベルを追加します。"
 cm__expand_metric_option_3_name: "@efficiency! ROI (税収)"
 cm__expand_metric_option_3_desc: "設定された「最大投資回収年数」以内に税収で建設費用を回収できる場合にのみ、新しいレベルを追加します。"
 cm__expand_metric_option_4_name: "@efficiency! ROI (利益)"
 cm__expand_metric_option_4_desc: "設定した最大ROI年数以内に利益が建設費用を回収できる場合にのみ、新しいレベルを追加します。"
