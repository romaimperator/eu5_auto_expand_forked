 cm__ab_roads_name: "道路"
 cm__ab_governors_name: "総督"
 cm__ab_master__ab_master_name: "$cm__ab_master_name$" # NO-TRANSLATE
 cm__ab_master__ab_master_desc: "ハンズフリー建設。毎月、以下のカテゴリーは金準備を超える分の国庫を、利用可能な最適な建設に支出します。他の自動化機能の設定に影響を与えることなく、それらと並行して動作します。"
 cm__ab_enabled_name: "自動建設を有効化"
 cm__ab_enabled_desc: "自動建築のオン/オフを切り替えます。"
 cm__ab_save_unaffordable_name: "資金不足の建物用に貯蓄する"
 cm__ab_save_unaffordable_desc: "カテゴリはその月の割当額を超えていても見つかった最適な建物を建設し、その後の月で不足分が補填されるまで次の建設を控えます。無効な場合、カテゴリは予算内で即座に賄えないものは建設しません。"
 cm__ab_min_proximity_name: "最小近接度"
 cm__ab_min_proximity_desc: "この近接度を下回る拠点は、建設場所の選定時に除外されます。統制建造物および@settlement_building! [ShowBuildingTypeNameWithNoTooltip('settlement_building')]は、近接度の低い土地を維持する価値を生み出すものであるため、これらに関わらず建設されます。0の場合、除外は行われません。"
 cm__ab_min_proximity_format: "[CMMV('cm__ab_min_proximity')]%" # NO-TRANSLATE
 cm__ab_master__ab_priority_list_name: "自動建設カテゴリ"
 cm__ab_master__ab_priority_list_desc: "ドラッグで順序を入れ替えます。カテゴリは毎月上から順に処理されます。複数のカテゴリが同じ建物を要求した場合は上位のものが建設し、すべてのカテゴリに分配した後に資金が余った場合は、上位のものがそれを受け取ります。"
 cm__ab_priority_list_item_column_name: "カテゴリー"
 cm__ab_priority_list_i1_name: "$cm__ab_custom_name$" # NO-TRANSLATE
 cm__ab_priority_list_i1_desc: "適合するあらゆる場所に支援インフラを建設します。最初に首都の建物、次に支配建物、その次に市場中心地の建物、最後に自身で選択した建物の順に建設されます。代官は原材料が最も高値で売れる拠点に、その他の支配建物は最も裕福な拠点に、市場は市場アクセスが最も低い拠点に配置されます。"
 cm__ab_priority_list_i2_name: "$cm__ab_core_name$" # NO-TRANSLATE
 cm__ab_priority_list_i2_desc: "建設資材の生産を拡大し、その価格を抑制します。自身が市場中心地を所有している市場で機能します。生産性の高い拠点から優先され、一度に数レベルずつ拡張されます。また、労働者がまだ到着していない場所でも建設が開始されます。首都、食料生産拠点、および補助金なしでは赤字になる生産拠点はすべてスキップされます。"
 cm__ab_priority_list_i3_name: "$cm__ab_food_name$" # NO-TRANSLATE
 cm__ab_priority_list_i3_desc: "自身が所有する市場中心地がある市場の年間食料供給を監視し、供給の中央値が不足している場合に、食料生産のポテンシャルが最も高い所在地で食料の自動拡大を有効にします。選択された所在地はプレイヤーが有効にしたものと同様に光りますが、切り替え設定の権限は保持されます。所在地が自身の所有する農村集落でなくなるか、市場中心地の所有権を失うか、あるいは同じ市場内により適した所在地が現れない限り、これらが無効化されることはありません。"
 cm__ab_priority_list_i4_name: "$cm__ab_production_name$" # NO-TRANSLATE
 cm__ab_priority_list_i4_desc: "税収によるコスト回収が最も速い生産施設およびRGOの建設、拡張、アップグレードを行います。食料自動生産が実行されているロケーションで、いずれかの労働者がすでに不足している場合は、建設などは行われません。"
 cm__ab_priority_list_i5_name: "$cm__ab_roads_name$" # NO-TRANSLATE
 cm__ab_priority_list_i5_desc: "ゴールドに対して最も価値の高い道路網を、近接度、市場アクセス、首都への接続という3つの恩恵に基づいて建設します。4年ごと、および首都が移転するたびに、所有する全拠点への各要素の最適ルートを算出し、そのルートの下流にある全要素を含めた「税収基盤」の向上量に基づいて各区間を並べ替えます。マルチプレイヤーでは「道路の再計画を強制」を押した場合のみこの処理が行われます。毎月、そのリストを順に確認し、着工できない最初の区間で停止します（スキップは行われません）。安価な平地の回廊が優先的に敷設され、優先度の低い区間に資金が充てられるのは、上位の区間が何も建設せず、かつ高価な区間のために貯蓄もしていない月のみです。"
 cm__ab_priority_list_i6_name: "$cm__ab_governors_name$" # NO-TRANSLATE
 cm__ab_priority_list_i6_desc: "総督を配置すべき場所を計画して任命を行い、最適な場所から優先的に割り当てます。総督スロットに空きができた時、またはそれ以外では25年ごとに再計画が行われます。シングルプレイヤー専用。"
 cm__ab_priority_list__budget_name: "予算配分"
 cm__ab_priority_list__budget_desc: "金準備を超える国庫のうち、このカテゴリに毎月割り当てられる割合です。これは上限ではなく下限（フロア）として機能します。どのカテゴリでも消費されなかった資金はリストの最上位から再度割り当てられるため、下位のカテゴリに投資対象がない月には、割り当てを大幅に超えて建設を行うことができます。"
 cm__ab_priority_list__budget_postfix: "%" # NO-TRANSLATE
 cm__ab_priority_list__enabled_name: "$cm_txt_enabled$" # NO-TRANSLATE
 cm__ab_priority_list__enabled_desc: "このカテゴリの建設を許可する"
 cm__ab_priority_list__settings_name: "設定"
 cm__ab_priority_list__settings_desc: "このカテゴリーの個別設定へ移動します。"
 cm__ab_priority_list__settings_text: "開く"
 cm__ab_master__debug_name: "$cm_txt_debug$" # NO-TRANSLATE
 cm__dbg_run_auto_build_name: "自動建設を実行"
 cm__dbg_run_auto_build_desc: "月の替わりを待たずに、有効化された各カテゴリーをリストの順に処理するようになりました。各カテゴリーは自身の割り当ての残りを消費するため、その月分をすでに消費したカテゴリーは何も建設しません。「自動化の一時停止」はこの処理を妨げません。"
 cm__dbg_run_auto_build_text: "$cm_txt_run_now$" # NO-TRANSLATE
 cm__ab_custom__ab_custom_name: "$cm__ab_custom_name$" # NO-TRANSLATE
 cm__ab_custom__ab_custom_desc: "セットは毎月上から順に処理されるため、上の方にあるものが優先的に資金を使用します。"
 cm__ab_custom_item_column_name: "建造物"
 cm__ab_custom_i1_name: "首都の建物"
 cm__ab_custom_i1_desc: "首都に、王宮、最高裁判所、陸軍大学などの首都限定の建物を建設します。これらは、このカテゴリーの他のどの建物よりも優先して建設されます。"
 cm__ab_custom_i2_name: "統制建造物"
 cm__ab_custom_i2_desc: "原材料が最も高値で売れる場所に代官を建設し、掌握度を向上させる自国固有の建物を最も裕福な場所に建設します。各ロケーションでは、次のロケーションへ移る前に、建設可能なすべての固有建物を優先して建設します。"
 cm__ab_custom_i3_name: "市場中心地の建物"
 cm__ab_custom_i3_desc: "所有しているすべての市場中心地において、採算の取れる建物を建設します。"
 cm__ab_custom_i4_name: "建物を選択"
 cm__ab_custom_i4_desc: "下記の建物を建設します。"
 cm__ab_custom__enabled_name: "$cm_txt_enabled$" # NO-TRANSLATE
 cm__ab_custom__enabled_desc: "このセットを建設する。"
 cm__ab_custom__auto_build_list_name: "$cm__ab_custom_i4_name$" # NO-TRANSLATE
 cm__ab_custom__auto_build_list_desc: "ドラッグして順序を入れ替えます。建物は毎月上から順に処理されるため、上にあるものほど先に資金を消費します。"
