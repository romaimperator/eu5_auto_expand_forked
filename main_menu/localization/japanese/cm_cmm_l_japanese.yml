 cm__auto_town_rights_list_i38_name: "@enlightened_leadership_reform_town_right! [ShowTownRightsName('enlightened_leadership_reform_town_right')]"
 cm__expand_metric: "cm__expand_metric"
 cm__town_rights_free_grants_name: "都市権のコストを削除"
 cm__town_rights_free_grants_desc: "有効な場合、都市権の付与に統治力を消費せず、その剥奪に安定度を消費しなくなります。"
 cm__town_rights_min_gov_power_name: "最小政府力"
 cm__town_rights_min_gov_power_desc: "次の付与によって政府の力（政府の種類に応じて正統性、共和制の伝統、信仰心、または族長の結束）がこの値を下回る場合、自動付与は都市権の付与を停止します。"
 cm__allowed_building_overbuild_levels_format: "[CMMV('cm__allowed_building_overbuild_levels')][Select_CString(GreaterThanOrEqualTo_CFixedPoint(CMMV('cm__allowed_building_overbuild_levels'), CMMMapValue('cmm_max', 'cm__allowed_building_overbuild_levels')), '+', '')]"
 cm__auto_build_capital_name: "首都建造物"
 cm__auto_build_capital_desc: "条件が整った際に、首都の立地に首都限定の建物（王宮、最高裁判所、陸軍大学など）を自動的に建設します。これらは以下のリストよりも先に建設されます。"
 cm__urbanize_city_to_megalopolis_name: "都市から巨大都市へ"
 cm__urbanize_city_to_megalopolis_desc: "首都が人口400,000人以上の市場中心都市になったら、メガロポリスにアップグレードします。"
 cm__megalopolis_ignore_capital_name: "メガロポリス：首都要件を無視"
 cm__megalopolis_ignore_capital_desc: "首都ではない都市に「巨大都市の設立」を建設できるようにします。"
 cm__megalopolis_ignore_market_center_name: "メガロポリス：市場の中心の条件を無視"
 cm__megalopolis_ignore_market_center_desc: "市場の中心ではない都市に「メガロポリスの設立」を建設できるようにします。"
 cm__deurbanize_name: "脱都市化"
 cm__deurbanize_desc: "毎月、下の「都市化しない」リストでRGO産品がチェックされている所有立地を地方集落へと戻します。首都、征服した立地、および総督府などのProximityを提供する立地は対象外となります。"
 cm__auto_urbanize_ignore_list_i20_name: "@wool! [ShowGoodsName('wool')] ([GetGlobalVariable('cm_goods_wool').GetGoods.GetDefaultMarketPrice]@gold!)"
 cm__full_automation_name: "完全自動化"
 cm__full_automation__full_automation_name: "完全自動化"
 cm__full_automation__full_automation_desc: "ハンズフリー建設。毎月、以下のカテゴリーが、金準備（Gold Reserve）を超える分の国庫を、利用可能な最適な建設のために支出します。他の自動化機能の設定に干渉することなく、それらと並行して動作します。"
 cm__fa_enabled_name: "完全自動化を有効にする"
 cm__fa_enabled_desc: "完全自動化のオン/オフを切り替えます。"
 cm__fa_reserve_name: "金準備"
 cm__fa_reserve_desc: "完全自動化によって、国庫がこの金額を下回るまで支出されることはありません。設定タブにある「Gold Reserve」とは別の設定です。"
 cm__fa_reserve_format: "[CMMV('cm__fa_reserve')]@gold!"
 cm__fa_save_unaffordable_name: "建設不可能な建物のために資金を確保"
 cm__fa_save_unaffordable_desc: "各カテゴリは、たとえ1ヶ月の配分額を超えていても、見つかった中で最適な建物を建設し、その後の月で差額が補填されるまで建設を停止します。オフの場合、各カテゴリは可能な限り支出し、残りの資金を次のカテゴリに引き継ぎます。"
 cm__full_automation__fa_priority_list_name: "優先順位"
 cm__full_automation__fa_priority_list_desc: "ドラッグして順序を入れ替えます。カテゴリは毎月上から順に処理されます。複数のカテゴリが同じ建物を要求する場合、より上位にあるものが建設を行います。"
 cm__fa_priority_list_item_column_name: "カテゴリー"
 cm__fa_priority_list_i1_name: "食料"
 cm__fa_priority_list_i1_desc: "自身が市場中心地を所有する市場の年間食料供給を監視し、供給の中央値が不足している場合、食料ポテンシャルが最も高い立地で食料の自動拡張を有効にします。選択された立地はプレイヤーが手動で有効にした場合と同様に光りますが、操作権限はプレイヤーにあります。その立地が自身が所有する農村集落でなくなるか、市場中心地の所有権を失わない限り、自動的にオフになることはありません。"
 cm__fa_priority_list_i2_name: "工業"
 cm__fa_priority_list_i2_desc: "税収による投資回収が最も早い生産建造物およびRGOを建設、拡張、アップグレードします。いずれかの種類の労働者が既に不足している場合、自動食料供給が行われているロケーションは対象外となります。"
 cm__fa_priority_list_i3_name: "価格崩壊"
 cm__fa_priority_list_i3_desc: "建設資材の生産を拡大して価格を押し下げます。自身が市場中心地を所有している市場で機能します。生産効率の高い拠点から優先され、一度に複数のレベルが建設されます。労働者がまだ到着していない場所でも生産が開始されます。首都、食料生産拠点、および補助金なしでは赤字になる生産拠点はすべてスキップされます。"
 cm__fa_priority_list_i4_name: "道路"
 cm__fa_priority_list_i4_desc: "近接度、市場アクセス、および首都への接続という道路がもたらす3つの利点において、最も費用対効果の高い道路網を建設します。年に一度、各要素について所有する全ロケーションへの最適なルートを算出し、毎月、そのルートの先にあるすべての要素を合算して税収基盤を最も向上させる区間から着工します。安価で平坦な回廊が優先的に敷設され、下位2つの要素は、上位の項目で建設すべきものがなくなった月にのみ予算が割り当てられます。"
 cm__fa_priority_list_i5_name: "公共事業"
 cm__fa_priority_list_i5_desc: "適合するすべての場所に支援インフラを建設します：首都の建物、自動建設リスト、水銀パティオ、市場中心地の建物、執行官および支配度を上昇させる自国独自のあらゆる建物、市場、疫病耐性のある建物、そして最後に穀物庫。支配度向上建物は最も裕福な拠点から、市場は市場アクセスが最も低い拠点から優先的に建設されます。"
 cm__fa_priority_list_i6_name: "建物の整理"
 cm__fa_priority_list_i6_desc: "年1回、利益を上げなくなり補助金も受けていない生産施設を閉鎖します。その場所が支持する建物レベルの10レベル以内にある場合は、代わりにそれらを解体します。閉鎖された施設は、その市場で同種の施設が再び利益を上げれば再開されますが、その場所に空きがなくなった場合は後に解体されます。@farming_village! [ShowBuildingTypeNameWithNoTooltip('farming_village')]は決して閉鎖されたり解体されたりすることはありません。"
 cm__fa_priority_list_i7_name: "総督"
 cm__fa_priority_list_i7_desc: "知事の配置場所を計画して自動的に配置し、最適な場所を優先します。知事スロットが空くたびに、またはそれ以外の場合は25年ごとに再計画が行われます。シングルプレイヤー専用。"
 cm__fa_priority_list_i8_name: "都市権"
 cm__fa_priority_list_i8_desc: "町や都市に都市権を付与します。まず[ShowTownRightsNameWithNoTooltip('granary_town')]が、次にその場所で生産されている商品に適した専門化権がランダムに1つ選ばれて付与されます。"
 cm__fa_priority_list__budget_name: "予算配分"
 cm__fa_priority_list__budget_desc: "金準備を超過した国庫のうち、このカテゴリーが毎月支出可能な割合。"
 cm__fa_priority_list__budget_postfix: "%"
 cm__fa_priority_list__enabled_name: "有効"
 cm__fa_priority_list__enabled_desc: "このカテゴリの建設を許可します。"
 cm__full_automation__fa_industry_name: "工業"
 cm__full_automation__fa_industry_desc: "上記の工業カテゴリの設定。"
 cm__fa_industry_algorithm_name: "建設戦略"
 cm__fa_industry_algorithm_desc: "産業が建設対象を選択する方法。"
 cm__fa_industry_algorithm_option_1_name: "強欲"
 cm__fa_industry_algorithm_option_1_desc: "投資回収が最も早いものを優先的に建設し、同じ商品の生産において最適な場所に近い効率を持つ場所のみに限定します。"
 cm__fa_industry_max_rel_roi_name: "最大相対ROI"
 cm__fa_industry_max_rel_roi_desc: "同じ物資を生産する最も効率的な場所と比較して、建設やアップグレードのコスト回収がどれだけ遅くても建設を許可するかを決定します。30%に設定した場合、最良の場所が10年で回収できるなら、13年以内に回収できるもののみが建設され、それより遅いものは保留されます。0%の場合、毎月各物資の最良の生産拠点のみが建設されます。100%以上の場合は制限がなく、「最大回収年数」のみが適用されます。種類を問わず、同じ物資を生産するすべての建物が一括で評価されます。RGOの拡張は、常に回収期間の短い順に建設されます。"
 cm__fa_industry_max_rel_roi_format: "[CMMV('cm__fa_industry_max_rel_roi')]%[Select_CString(GreaterThanOrEqualTo_CFixedPoint(CMMV('cm__fa_industry_max_rel_roi'), CMMMapValue('cmm_max', 'cm__fa_industry_max_rel_roi')), '+', '')]"
 cm__fa_industry_min_roi_name: "最大回収年数"
 cm__fa_industry_min_roi_desc: "税収がこの年数以内に建設コストを回収できる建設のみが考慮されます。0に設定すると、このチェックは無効になります。"
 cm__fa_industry_min_roi_format: "[CMMV('cm__fa_industry_min_roi')]年 @efficiency!"
 cm__full_automation__fa_collapsar_name: "プライス・コラプサー"
 cm__full_automation__fa_collapsar_desc: "上記のPrice Collapsarカテゴリーの設定です。素材はリストの上から順に処理され、生産建物よりも先にRGOが拡張されます。"
 cm__fa_collapsar_target_name: "目標価格"
 cm__fa_collapsar_target_desc: "資材の建設を停止する価格を、基準価格に対する相対値で設定します。-33%に設定した場合、資材の取引価格が基準価格を33%下回るまで生産施設が建設されます。0%の場合は基準価格に達するまで、+33%の場合は基準価格を33%上回っている間のみ建設が行われます。"
 cm__fa_collapsar_target_format: "[CMMV('cm__fa_collapsar_target')]%"
 cm__fa_collapsar_item_column_name: "資材"
 cm__fa_collapsar_i1_name: "@masonry! [ShowGoodsName('masonry')]"
 cm__fa_collapsar_i2_name: "@lumber! [ShowGoodsName('lumber')]"
 cm__fa_collapsar_i3_name: "@sand! [ShowGoodsName('sand')]"
 cm__fa_collapsar_i4_name: "@glass! [ShowGoodsName('glass')]"
 cm__fa_collapsar__enabled_name: "有効"
 cm__fa_collapsar__enabled_desc: "この資源の価格を下げるように努めます。"
 cm__full_automation__fa_food_name: "食料"
 cm__full_automation__fa_food_desc: "上記の食料カテゴリの設定。"
 cm__fa_food_target_name: "余剰目標"
 cm__fa_food_target_desc: "市場の供給が需要に対するこの割合に達するまで、市場に食料生産拠点が追加されます。125%に設定した場合、年の中央値となる月において25%の余剰に達していないすべての市場で食料生産が拡張されます。値を上げるとより大きな余裕を維持し、下げると不足に近い市場のみを支援するようになります。"
 cm__fa_food_target_format: "[CMMV('cm__fa_food_target')]%"
 cm__fa_food_min_potential_name: "最小食料ポテンシャル"
 cm__fa_food_min_potential_desc: "食料の自動拡大は、RGOレベルあたりの食料ポテンシャルがこのスコアに達したロケーションでのみ有効になります。これは$mapmode_cm_location_food_potential_name$マップモードで表示されるスコアと同じです。値を上げるとより良い農地を待つようになり、下げるとより質の低い土地も受け入れるようになります。"
 cm__fa_food_min_potential_format: "[CMMV('cm__fa_food_min_potential')]"
 cm__full_automation__fa_urban_rights_name: "都市の権利"
 cm__full_automation__fa_urban_rights_desc: "上記の「都市権」カテゴリの設定。"
 cm__fa_urban_rights_window_name: "適合しきい値"
 cm__fa_urban_rights_window_desc: "特化権が候補として選ばれるために、その立地に最も適した権利と比較してどの程度適合している必要があるかを指定します。50%に設定すると、適合度が最高のものの半分以上である権利が抽選対象となり、より適合度の高いものがより頻繁に選ばれます。100%に設定すると、最も適合する権利のみが付与されます。"
 cm__fa_urban_rights_window_format: "[CMMV('cm__fa_urban_rights_window')]%"
 cm__fa_urban_rights_reserve_name: "統治力リザーブ"
 cm__fa_urban_rights_reserve_desc: "支払うことで政府の力（政府の種類に応じて正統性、共和制の伝統、信仰心、または遊牧民の団結度）がこの値を下回る場合、都市の権利は付与されません。"
 cm__fa_urban_rights_expand_name: "ブーストされた産業を拡張する"
 cm__fa_urban_rights_expand_desc: "特化権を授与する際、その権利によって強化される産業およびそのロケーションで生産される原材料の自動拡張も有効にします。「推奨都市権」マップ上で授与ボタンを右クリックした際と同じ動作です。"
 cm__full_automation__fa_cleanup_name: "建造物の整理"
 cm__full_automation__fa_cleanup_desc: "上記の建造物整理カテゴリの設定。"
 cm__fa_cleanup_min_profit_name: "最低利益"
 cm__fa_cleanup_min_profit_desc: "月間の収益がこれ未満の建物は、補助金が支給されていない限り、稼働させる価値がないと見なされて閉鎖または解体されます。一つの市場において、一度に閉鎖されるのは同一種類の建物のうち最大でも半分までです。"
 cm__fa_cleanup_min_profit_format: "[Divide_CFixedPoint(CMMV('cm__fa_cleanup_min_profit'), '(CFixedPoint)100')|2]@gold!"
 cm__fa_cleanup_core_goods_name: "建設資材を優先"
 cm__fa_cleanup_core_goods_desc: "主に@masonry![ShowGoodsNameWithNoTooltip('masonry')]、@lumber![ShowGoodsNameWithNoTooltip('lumber')]、@sand![ShowGoodsNameWithNoTooltip('sand')]、または@glass![ShowGoodsNameWithNoTooltip('glass')]を消費する建物は、最小利益の2倍または0.1@gold!のいずれか高い方を基準に維持されます。これら4つのいずれかを生産する建物は、通常の最小利益に基づいて判定されます。"
 cm__fa_cleanup_auto_food_name: "食料自動化ロケーションの解除"
 cm__fa_cleanup_auto_food_desc: "自動食料供給が実行中で、何らかの労働者が既に不足している場合、食料を生産していない生産建物を解体します。@market_village! [ShowBuildingTypeNameWithNoTooltip('market_village')]は解体されるのではなく、1レベルに削減されます。"
 cm__full_automation__fa_roads_name: "道路"
 cm__full_automation__fa_roads_desc: "上記の道路カテゴリーの設定。"
 cm__fa_roads_proximity_name: "近接度"
 cm__fa_roads_proximity_desc: "その先にあるすべての立地を考慮し、費用に対して近接性を最も向上させる道路区間を敷設します。"
 cm__fa_roads_market_access_name: "市場アクセス"
 cm__fa_roads_market_access_desc: "費用対効果が最も高い（市場アクセスを最も向上させる）道路を敷設します。近接度を向上させる道路の敷設候補がなくなった月にのみ、資金を消費します。"
 cm__fa_roads_capital_name: "首都接続"
 cm__fa_roads_capital_desc: "すでに接続されている場所から外側に向けて、各立地を首都へ繋ぐ道路を敷設します。プロキシミティおよび市場アクセスの敷設分がなくなった月にのみ、費用を消費します。"
 cm__full_automation__fa_governors_name: "総督"
 cm__full_automation__fa_governors_desc: "上記の総督カテゴリーの設定。"
 cm__fa_gov_move_seats_name: "総督の移動を許可"
 cm__fa_gov_move_seats_desc: "すべての総督スロットが埋まっている場合、総督を解任してより適切な場所に再配置します。再配置先の場所は、既に都市であるか、元の場所よりもスコアが10%以上高い必要があります。この設定がオフの場合、総督は空のスロットにのみ配置されます。"
 cm__fa_gov_prepare_sites_name: "新規ロケーションの準備を許可する"
 cm__fa_gov_prepare_sites_desc: "まだ代官を配置できないロケーションを考慮して優先的に準備を整え、そこに町や都市を建設して首都への道路を敷設します。これをオフにすると、すでに都市であり、かつ首都への道路が通っているロケーションのみが考慮されます。"
 cm__map_modes_name: "マップモード"
 cm__map_modes__placement_finder_name: "推奨される首都と総督の所在地"
 cm__map_modes__placement_finder_desc: "推奨総督および推奨首都の配置マップモードの設定。"
 cm__placement_finder_method_name: "配置検索スコアリング"
 cm__placement_finder_method_desc: "推奨総督および推奨首都マップモードが、ロケーションをどのようにランク付けするか。"
 cm__placement_finder_method_option_1_name: "税収基盤"
 cm__placement_finder_method_option_1_desc: "そこに総督や首都を配置した際の総税収基盤の増加量に基づいて順位付けします。豊かなロケーションほど高く評価されます。"
 cm__placement_finder_method_option_2_name: "近接性"
 cm__placement_finder_method_option_2_desc: "そこに配置された総督または首都が追加する近接性の量で並び替えます。"
 cm__placement_finder_roads_name: "陸上インフラ"
 cm__placement_finder_roads_desc: "推奨総督および推奨首都マップモードにおいて、理想的な陸上インフラを想定するか、実際に建設済みのものを使用するかを選択します。"
 cm__placement_finder_roads_option_1_name: "現在"
 cm__placement_finder_roads_option_1_desc: "実際に建設した道路を使用します。"
 cm__placement_finder_roads_option_2_name: "最大道路"
 cm__placement_finder_roads_option_2_desc: "解禁済みの最高の道路がすべての接続路に建設されているものとして扱います。"
 cm__placement_finder_roads_option_3_name: "最善"
 cm__placement_finder_roads_option_3_desc: "アンロック済みの最高レベルの道がすべての接続路に建設され、陸上近接度を向上させるアンロック済みのすべての建物が建設可能なすべての場所に建設されているものと仮定します。"
 cm__placement_finder_naval_name: "海軍インフラ"
 cm__placement_finder_naval_desc: "「推奨知事」および「推奨首都」マップモードが、理想的な海軍インフラを想定するか、現在の港湾容量と海軍プレゼンスを使用するか。"
 cm__placement_finder_naval_option_1_name: "現在"
 cm__placement_finder_naval_option_1_desc: "現在の港湾容量と海軍のプレゼンスを使用します。"
 cm__placement_finder_naval_option_2_name: "最大プレゼンス"
 cm__placement_finder_naval_option_2_desc: "現在の港湾容量に基づき、全域に完全な海軍のプレゼンスがあると仮定します。"
 cm__placement_finder_naval_option_3_name: "可能な限り最善"
 cm__placement_finder_naval_option_3_desc: "すべての沿岸ロケーションに、最大の海軍プレゼンスとアンロック済みの最高の港湾施設が建設されていると仮定します。"
 cm__placement_finder_accuracy_name: "検索精度"
 cm__placement_finder_accuracy_desc: "推奨総督および推奨首都マップモードが、どれほど徹底的に最適な場所を探索するか。スキップされた場所は黒く表示されます。"
 cm__placement_finder_accuracy_option_1_name: "徹底的"
 cm__placement_finder_accuracy_option_1_desc: "全てのロケーションを評価します。最も正確ですが、最も低速です。"
 cm__placement_finder_accuracy_option_2_name: "徹底的"
 cm__placement_finder_accuracy_option_2_desc: "上位3位に入る可能性がない場所をスキップします。上位3位とそのスコアは「網羅的（Exhaustive）」と同じですが、より高速に動作します。"
 cm__placement_finder_accuracy_option_3_name: "バランス"
 cm__placement_finder_accuracy_option_3_desc: "最良の候補になり得ない拠点をスキップします。最良の拠点は引き続き正確に特定されますが、2番目と3番目のマーカーは時折異なる場合があります。"
 cm__placement_finder_accuracy_option_4_name: "クイック"
 cm__placement_finder_accuracy_option_4_desc: "また、最適である可能性が極めて低い場所もスキップします。特定された最適な場所は真の最適値から20%以内に収まり、通常は正確なままです。"
 cm__placement_finder_accuracy_option_5_name: "最速"
 cm__placement_finder_accuracy_option_5_desc: "各州で最も有望な立地を評価し、上位候補の周辺を精査します。大国では大幅に高速ですが、最良の立地を見逃す可能性があります。"
 cm__debug_name: "デバッグ"
 cm__debug__logging_name: "アクションログ"
 cm__debug__logging_desc: "このModのどのアクションをModアクションログに記録するか。"
 cm__log_cycle_name: "建設サイクル"
 cm__log_cycle_desc: "前回の処理が継続中であったためスキップされた月次サイクル、および2回連続のスキップ後に行われるリセットの表示。"
 cm__log_industry_name: "工業"
 cm__log_industry_desc: "工業カテゴリがキューに追加する各建物と、検討対象となる各原料生産の拡張、およびそれぞれの投資回収期間と収入の行。"
 cm__log_collapsar_name: "価格崩壊"
 cm__log_collapsar_desc: "Price Collapsarサイクルにおける1つの拠点の推移：市場の不足分と要求レベル、その拠点に割り当てられた内容、スコア、および建設。まずコンソールコマンド effect location:<key> = { cm_fa_col_watch_on = yes } でその場所をマークしてください。"
 cm__log_food_name: "食料自動化"
 cm__log_food_desc: "食料カテゴリーの各項目：各市場の月間食料供給量、需要、比率、目標値と比較して判定される比率の年間中央値、既に食料を生産している拠点の数、および有効化または無効化される全拠点。"
 cm__log_roads_name: "道路"
 cm__log_roads_desc: "「道路」カテゴリーで発注された道路ごとに、場所、3つの建設目的のいずれか、およびその費用を1行で表示します。"
 cm__log_cleanup_name: "建物の整理"
 cm__log_cleanup_desc: "年次の建物クリーンアップと、閉鎖、削減、破壊、再開された各建物に関するログ。それぞれの利益と判定基準となった最低値が含まれます。"
 cm__log_governors_name: "知事"
 cm__log_governors_desc: "代官の計画：候補地の選定と除外、町や都市のアップグレード、配置、移転、拒絶、および幸運な国家の首都移転。"
 cm__log_military_name: "幸運な国家の軍事"
 cm__log_military_desc: "要塞を撤去し、人的資源施設を建設する幸運な国家の台詞"
 cm__log_government_name: "ラッキー国家政府"
 cm__log_government_desc: "幸運な国家が官僚制を削除、または階級アクションを実行する際のテキスト"
 cm__debug__diagnostics_name: "診断"
 cm__placement_finder_debug_path_name: "デバッグ診断を有効にする"
 cm__placement_finder_debug_path_desc: "「推奨総督」および「推奨首都」マップモードのツールチップに診断ブロックを追加します：首都から各ロケーションへの予測ルート（各ジャンプのコストを含む）、および実際の近接度と比較した予測近接度が表示されます。"
 cm__debug__probes_name: "プローブ"
 cm__debug__probes_desc: "MODのアクションログに書き込まれる単発の診断情報。"
 cm__probe_budget_name: "完全自動化予算"
 cm__probe_budget_desc: "各完全自動化カテゴリの残高（まだ購入できない候補のために資金を保留している場合は正、過剰支出により不足している場合は負）、工業の投資回収上限、およびこのサイクルで見送られた市場における最良の候補。"
 cm__probe_budget_text: "実行"
 cm__probe_governors_name: "総督の計画"
 cm__probe_governors_desc: "知事計画の現在の進行状況：現在のフェーズ、保持しているサイト数と未配置のサイト数、国庫資金を保持しているか、支払済みの知事、および対象となっているスロットと議席。"
 cm__probe_governors_text: "実行"
 cm__probe_military_name: "幸運な国家の軍事"
 cm__probe_military_desc: "国家の人的資源建物の段階、建設の可否、首都ペアの状態、軍事予算、および当該段階を建設可能な立地数に対する建設済みの立地数。"
 cm__probe_military_text: "実行"
 cm__probe_industry_anchors_name: "産業アンカー"
 cm__probe_industry_anchors_desc: "各財貨につき、産業が記録した最良の投資回収と、それに基づき設定される回収制限を、対象の建物名および場所名と共に1行ずつ表示します。"
 cm__probe_industry_anchors_text: "実行"
 cm__probe_industry_rgo_name: "工業原材料"
 cm__probe_industry_rgo_desc: "拠点の産出資源が工業化の対象から外された理由を1行ずつ、あるいは理由がない場合は1行のみ表示します。コンソールコマンド effect location:<key> = { cm_fa_col_watch_on = yes } で拠点をマークしない限り、首都の情報を表示します。"
 cm__probe_industry_rgo_text: "実行"
 cm__probe_collapsar_name: "価格崩壊"
 cm__probe_collapsar_desc: "Price Collapsarが拠点で読み取るすべての数値が、ゲーム自体の数値の隣に表示され、さらにその拠点の市場が1サイクルで吸収できる量が表示されます。コンソールコマンド `effect location:<key> = { cm_fa_col_watch_on = yes }` で拠点を指定しない限り、首都が読み取り対象となります。首都はPrice Collapsarの候補にならないため、建設が行われる拠点を確認するには、特定の拠点をマークしてください。"
 cm__probe_collapsar_text: "実行"
 cm__probe_roads_name: "道路"
 cm__probe_roads_desc: "道路計画が保持する近接度、市場アクセス、首都接続ごとの回廊の数、そのうち開始可能な首都接続の数、現在建設中の道路の数、およびカテゴリのプール内の残数。"
 cm__probe_roads_text: "実行"
 cm__probe_log_gate_name: "アクションログのゲート"
 cm__probe_log_gate_desc: "Price Collapsarログカテゴリーを、ログゲートの読み取り時とメニューの保存時の2つの形式で表示し、片方で有効かつもう片方で無効なカテゴリーが表示されるようにします。"
 cm__probe_log_gate_text: "実行"
