l_japanese:
 # Mod
 cm_name: "建築管理"
 cm_desc: "A massive quality of life mod that adds new automation, filters, and map modes, to greatly improve the EU5 construction experience."

 # Settings (settings) Tab
 cm__settings_name: "設定"
 ## Global Control (settings) Group
 cm__pause_auto_expand_name: "自動化の一時停止"
 cm__pause_auto_expand_desc: "すべての自動化機能を一時停止します：建物の自動拡張、RGOの自動拡張、すべての建物のアップグレード、自動建設、食料自動化、および自動都市化。"
 cm__minimum_gold_name: "金備蓄"
 cm__minimum_gold_desc: "維持する最小の備蓄資金量です。建設によって国庫がこの額を下回る場合、建設はキューに追加されません。独自の資金設定を持つ「都市化の自動アップグレード」を除き、すべての自動化機能に適用されます。"
 cm__minimum_gold_format: "[CMMV('cm__minimum_gold')]@gold!"
 cm__allowed_building_overbuild_levels_name: "超過建設制限"
 cm__allowed_building_overbuild_levels_desc: "あるロケーションにおいて、維持可能な建物レベルの上限を合計で何レベルまで上回るまで自動拡張が新しい建設を予約し続けるかを設定します。0の場合、上限を超えた建設は許可されません。"

 ## Priority List Group
 cm__settings__priority_list_name: "建設自動化"
 cm__settings__priority_list_desc: "ドラッグで機能の優先順位を並べ替えます。毎月、有効な機能が上から順に実行されます。自動拡張では、各機能の横の数値は「自動拡張指標」で選択した指標に基づく建設の判断基準です。税収と利益の場合はレベルあたりの最小月間ゴールド、ROI（投資収益率）の場合は建設費を回収するまでの最大年数（0 = 無効）を指定します。「最小割引」は、許容される建設資材の最大値上げ幅を設定します（-33% = 安価な時のみ、0 = 基本価格、+33% = 高騰時でも実行）。"
 cm__priority_list_item_column_name: "機能"
 cm__priority_list_i1_name: "建物の自動拡張"
 cm__priority_list_i1_desc: "利益が出ており、住民が利用可能で、かつ所持金が金準備を上回っている場合に、多段階の生産および非生産建物を自動的に拡張します。自動拡張が有効になっている立地にのみ適用されます。"
 cm__priority_list_i2_name: "RGOの自動拡張"
 cm__priority_list_i2_desc: "RGOの自動拡張が有効な立地において、労働者が利用可能で資源が十分にある場合に、RGOのレベルを自動的に拡張します。"
 cm__priority_list_i3_name: "全ての建物を自動アップグレード"
 cm__priority_list_i3_desc: "その建物の自動拡張設定が有効かどうかにかかわらず、旧式化したすべての建物を自動的にアップグレードします。"
 cm__priority_list_i4_name: "自動建設"
 cm__priority_list_i4_desc: "「自動建設」タブで構成された順序と設定に従い、各立地に1つのみ建設可能な建物（評議会、図書館など）を自動的に建設します。"
 cm__priority_list_i5_name: "自動食料"
 cm__priority_list_i5_desc: "地方のロケーションにおいて、食料を生産するRGOおよび建物を自動的に建設します。その際、限界食料産出量が最も高い選択肢が選択されます。「自動食料」タブで設定可能です。"
 cm__priority_list_i6_name: "自動都市化"
 cm__priority_list_i6_desc: "毎月、拠点のランクを昇格させます（農村から町へ、町から都市へ）。農村から町への昇格には、人口が30,000人（即座に都市への昇格資格を満たす）に達しているか、人口上限まで残り1,000人以内であること（さもなければ農村の人口上限で成長が停滞するため）が必要です。非統合の拠点はスキップされます。「自動都市化」タブで設定可能です。"
 cm__priority_list_i7_name: "首都建物の自動建設"
 cm__priority_list_i7_desc: "条件を満たした場合、首都限定の建物（王宮、最高裁判所、陸軍大学校など）を首都のロケーションに自動的に建設します。"
 cm__priority_list__enabled_name: "有効"
 cm__priority_list__enabled_desc: "この機能を有効または無効にします。無効化された機能は毎月スキップされます。"
 cm__priority_list__min_profit_name: "最低税収"
 cm__priority_list__min_profit_desc: "建設がキューに追加されるために必要な、レベルあたりの最低月間収支です。0に設定すると、このチェックは無効になります。"
 cm__priority_list__min_profit_postfix: "@gold!"
 cm__priority_list__min_discount_name: "最小割引"
 cm__priority_list__min_discount_desc: "建設資材の最大価格許容範囲。-33%に設定すると、資材価格が基本価格より33%低い場合のみ建設されます。0%の場合は基本価格以下の時のみ建設されます。+33%に設定すると、価格が基本価格より33%高くても建設されます。"
 cm__priority_list__min_discount_postfix: "%"
 cm__priority_list__min_discount_prefix_high: "#R "
 cm__priority_list__min_discount_postfix_high: "%#!"
 cm__priority_list__min_discount_prefix_low: "#G "
 cm__priority_list__min_discount_postfix_low: "%#!"

