 cm__ab_food_target_name: "余剰目標"
 cm__ab_food_target_desc: "市場の供給量が需要のこの割合に達するまで、その市場に食料生産拠点が追加されます。125%に設定した場合、年間の月次中央値で25%の余剰に達していない市場において食料生産が拡張されます。数値を上げるとより多くのバッファを維持し、下げると不足に近い市場のみを支援するようになります。"
 cm__ab_food_target_format: "[CMMV('cm__ab_food_target')]%" # NO-TRANSLATE
 cm__ab_food_min_potential_name: "最小食料ポテンシャル"
 cm__ab_food_min_potential_desc: "食料自動化は、RGOレベルごとの食料ポテンシャルがこのスコアに達した場所にのみ有効となります。これは$mapmode_cm_location_food_potential_name$マップモードで表示されるスコアと同じです。数値を上げるとより肥沃な農地を待つようになり、下げるとより質の低い土地も許容するようになります。"
 cm__ab_food_min_potential_format: "[CMMV('cm__ab_food_min_potential')]" # NO-TRANSLATE
 cm__ab_food_subsidize_name: "食料建物の助成"
 cm__ab_food_subsidize_desc: "自動食料建設機能によって建設された食料生産建物に補助金を出します。利益の出ない建物は労働者を雇用せず食料も生産しないため、痩せた土地にある農村は放置されたままになります。補助金を出すことで雇用を維持し、収穫を継続させることができます。この補助金が自動的にオフになることはありません。"
 cm__ab_food_run_now_name: "食料の再計画を強制"
 cm__ab_food_run_now_desc: "年次の判定を待たずに、サンプリング済みの月と今月の食料収支に基づき、食料生産地を今すぐ再選定します。"
 cm__ab_food_run_now_text: "$cm_txt_run_now$" # NO-TRANSLATE
 cm__ab_food__debug_name: "$cm_txt_debug$" # NO-TRANSLATE
