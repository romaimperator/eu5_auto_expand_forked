 cm__auto_town_rights_list_i38_name: "@enlightened_leadership_reform_town_right! [ShowTownRightsName('enlightened_leadership_reform_town_right')]"
 cm__expand_metric: "cm__expand_metric"
 cm__town_rights_free_grants_name: "都市権のコストを削除"
 cm__town_rights_free_grants_desc: "有効な場合、都市権の付与に統治力を消費せず、その剥奪に安定度を消費しなくなります。"
 cm__town_rights_min_gov_power_name: "最小政府力"
 cm__town_rights_min_gov_power_desc: "次の付与によって政府の力（政府の種類に応じて正統性、共和制の伝統、信仰心、または族長の結束）がこの値を下回る場合、自動付与は都市権の付与を停止します。"
 cm__allowed_building_overbuild_levels_format: "[CMMV('cm__allowed_building_overbuild_levels')][Select_CString(GreaterThanOrEqualTo_CFixedPoint(CMMV('cm__allowed_building_overbuild_levels'), CMMMapValue('cmm_max', 'cm__allowed_building_overbuild_levels')), '+', '')]"
 cm__auto_build_capital_name: "首都建造物"
 cm__auto_build_capital_desc: "条件を満たした際、首都の立地に首都限定の建物（王宮、最高裁判所、陸軍大学校など）を自動的に建設します。これらは以下のリストよりも先に建設されます。"
 cm__urbanize_city_to_megalopolis_name: "都市からメガロポリスへ"
 cm__urbanize_city_to_megalopolis_desc: "首都が人口400,000人以上の市場中心都市になったら、メガロポリスにアップグレードします。"
 cm__megalopolis_ignore_capital_name: "メガロポリス：首都要件を無視"
 cm__megalopolis_ignore_capital_desc: "首都ではない都市に「巨大都市の建設」を建設できるようになります。"
 cm__megalopolis_ignore_market_center_name: "メガロポリス：市場の中心の要件を無視"
 cm__megalopolis_ignore_market_center_desc: "市場の中心地ではない都市に「巨大都市の創設」を建設できるようにします。"
 cm__deurbanize_name: "都市化解除"
 cm__deurbanize_desc: "毎月、下の「都市化禁止」リストでRGO産品がチェックされている所有立地を農村集落に戻します。首都、征服した立地、および総督府などのProximity（近接度）を提供する立地は除外されます。"
 cm__auto_urbanize_ignore_list_i20_name: "@wool! [ShowGoodsName('wool')] ([GetGlobalVariable('cm_goods_wool').GetGoods.GetDefaultMarketPrice]@gold!)"
 cm__full_automation_name: "完全自動化"
 cm__full_automation__full_automation_name: "完全自動化"
 cm__full_automation__full_automation_desc: "ハンズフリー建設。毎月、以下のカテゴリーが金準備を超える分の国庫資金を費やして、利用可能な最適な建設を行います。他の自動化機能の設定を変更することなく、それらと並行して動作します。"
 cm__fa_enabled_name: "完全自動化を有効にする"
 cm__fa_enabled_desc: "完全自動化のオン/オフを切り替えます。"
 cm__fa_reserve_name: "金準備"
 cm__fa_reserve_desc: "完全自動化によって国庫がこの金額を下回ることはありません。設定タブの「金準備」とは別に設定されます。"
 cm__fa_reserve_format: "[CMMV('cm__fa_reserve')]@gold!"
 cm__fa_save_unaffordable_name: "資金不足の建物のために貯蓄する"
 cm__fa_save_unaffordable_desc: "あるカテゴリは、月ごとの割当額を超えていても見つかった最適な建物を建設し、その後の数ヶ月で差額が相殺されるまで建設を停止します。オフの場合、各カテゴリは可能な分だけを消費し、残額を次のカテゴリへと引き継ぎます。"
 cm__full_automation__fa_priority_list_name: "優先順位"
 cm__full_automation__fa_priority_list_desc: "ドラッグして並べ替えます。カテゴリは毎月上から順に処理されます。複数のカテゴリが同じ建物を要求する場合、上位のカテゴリが建設を行います。"
 cm__fa_priority_list_item_column_name: "カテゴリ"
 cm__fa_priority_list_i1_name: "食料"
 cm__fa_priority_list_i1_desc: "自身が市場中心地を所有する市場の年間食料供給を監視し、供給の中央値が不足している場合に、食料ポテンシャルが最も高い場所の自動食料設定を有効化します。選択された場所はプレイヤーが手動で有効にした場合と同様に光りますが、トグルの操作権はプレイヤーに維持されます。その場所が自身の所有する農村集落ではなくなるか、その市場中心地を所有しなくならない限り、設定が解除されることはありません。"
 cm__fa_priority_list_i2_name: "工業"
 cm__fa_priority_list_i2_desc: "税収による投資回収が最も速い生産施設およびRGOを建設、拡張、アップグレードします。何らかの労働力が既に不足している場合、食料の自動生産を行っているロケーションはそのままにされます。"
 cm__fa_priority_list_i3_name: "プライス・コラプサー"
 cm__fa_priority_list_i3_desc: "建設資材の価格を押し下げるために生産を拡大します。自身が市場中心地を所有している市場で機能します。生産性の高い拠点から優先され、一度に複数のレベルが建設されます。また、労働者がまだ到着していない場所でも建設が開始されます。首都、食料生産拠点、および補助金なしでは赤字になる生産施設はすべて除外されます。"
 cm__fa_priority_list_i4_name: "道路"
 cm__fa_priority_list_i4_desc: "近接性、市場アクセス、首都への接続という道路が提供する3つの要素において、費用対効果が最も高い道路網を建設します。年に一度、各要素について所有する全ロケーションへの最適なルートを算出し、毎月、その先にあるすべての拠点を考慮して税収基盤を最も向上させる区間から着工します。安価な平地の回廊が優先的に敷設され、上位の項目で建設すべきものがなくなった月にのみ、下位の2項目に資金が割り当てられます。"
 cm__fa_priority_list_i5_name: "ユーティリティ"
 cm__fa_priority_list_i5_desc: "設置可能なあらゆる場所に、首都の建物、自動建設リスト、水銀パティオ、市場中心地の建物、執行官、支配度を上昇させる自国固有の建物、市場、疾病耐性の建物、最後に穀物庫の順で支援インフラを建設します。支配度建物は最も裕福な拠点から、市場は市場アクセスが最も低い拠点から優先的に建設されます。"
 cm__fa_priority_list_i6_name: "建物の整理"
 cm__fa_priority_list_i6_desc: "1年に1回、利益が出なくなり補助金も受けていない生産建造物を閉鎖し、所在地が維持可能な建造物レベルの10レベル以内である場合は代わりに解体します。閉鎖された建造物は、その市場で同種の建造物が再び利益を出すようになると再開されますが、所在地の空き容量がなくなった場合は後に解体されます。@farming_village! [ShowBuildingTypeNameWithNoTooltip('farming_village')] が閉鎖されたり解体されたりすることはありません。"
 cm__fa_priority_list_i7_name: "総督"
 cm__fa_priority_list_i7_desc: "知事の最適な配置場所を計画して自動的に割り当てます。最も効果的な場所から優先的に配置されます。知事スロットに空きができた時、またはそれ以外の場合は25年ごとに再計画を行います。シングルプレイヤー専用。"
 cm__fa_priority_list_i8_name: "都市権"
 cm__fa_priority_list_i8_desc: "町や都市に都市特権を付与します。まず[ShowTownRightsNameWithNoTooltip('granary_town')]が適用され、次にその場所の周辺で生産されている財貨に適した専門化特権の中からランダムに1つが選ばれます。"
 cm__fa_priority_list__budget_name: "予算配分"
 cm__fa_priority_list__budget_desc: "金準備を超過した国庫のうち、このカテゴリが毎月支出できる割合。"
 cm__fa_priority_list__budget_postfix: "%"
 cm__fa_priority_list__enabled_name: "有効"
 cm__fa_priority_list__enabled_desc: "このカテゴリの建設を許可する"
 cm__full_automation__fa_industry_name: "工業"
 cm__full_automation__fa_industry_desc: "上記の産業カテゴリーに関する設定。"
 cm__fa_industry_algorithm_name: "建設戦略"
 cm__fa_industry_algorithm_desc: "産業が何を建設するかを選択する仕組み。"
 cm__fa_industry_algorithm_option_1_name: "貪欲"
 cm__fa_industry_algorithm_option_1_desc: "投資回収が最も早いものを優先的に建設し、同じ商品の最適な生産地に近い場所のみを建設します。"
 cm__fa_industry_max_rel_roi_name: "最大相対ROI"
 cm__fa_industry_max_rel_roi_desc: "同じ商品を生産する最も効率の良い場所と比較して、建造物やアップグレードの投資回収がどれだけ遅くても建設を許可するかを設定します。30%に設定した場合、最良の場所が10年で回収できるなら、13年以内に回収できる場所のみが建設され、それより遅いものは保留されます。0%では、各商品について毎月最も効率の良い生産者のみが建設されます。100%以上では制限がなくなり、「最大回収年数」のみが適用されます。同じ商品を生産する建造物は、種類を問わず一括で評価されます。RGOの拡張は常に回収期間の短い順に建設されます。"
 cm__fa_industry_max_rel_roi_format: "[CMMV('cm__fa_industry_max_rel_roi')]%[Select_CString(GreaterThanOrEqualTo_CFixedPoint(CMMV('cm__fa_industry_max_rel_roi'), CMMMapValue('cmm_max', 'cm__fa_industry_max_rel_roi')), '+', '')]"
 cm__fa_industry_min_roi_name: "最大投資回収年数"
 cm__fa_industry_min_roi_desc: "税収によって建設コストをこの年数以内に回収できる建設のみが考慮されます。0に設定すると、このチェックは無効になります。"
 cm__fa_industry_min_roi_format: "[CMMV('cm__fa_industry_min_roi')]年 @efficiency!"
 cm__full_automation__fa_collapsar_name: "価格コラプサー"
 cm__full_automation__fa_collapsar_desc: "上記のPrice Collapsarカテゴリーの設定です。素材はリストの上から順に処理され、生産施設よりも先にRGOが拡張されます。"
 cm__fa_collapsar_target_name: "目標価格"
 cm__fa_collapsar_target_desc: "素材の建設を停止する価格を、基本価格に対する相対値で指定します。-33%に設定すると、素材の取引価格が基本価格を33%下回るまで生産施設が建設されます。0%の場合は基本価格に達するまで、+33%の場合は基本価格を33%以上上回っている間のみ建設が行われます。"
 cm__fa_collapsar_target_format: "[CMMV('cm__fa_collapsar_target')]%"
 cm__fa_collapsar_item_column_name: "資材"
 cm__fa_collapsar_i1_name: "@masonry! [ShowGoodsName('masonry')]"
 cm__fa_collapsar_i2_name: "@lumber! [ShowGoodsName('lumber')]"
 cm__fa_collapsar_i3_name: "@sand! [ShowGoodsName('sand')]"
 cm__fa_collapsar_i4_name: "@glass! [ShowGoodsName('glass')]"
 cm__fa_collapsar__enabled_name: "有効"
 cm__fa_collapsar__enabled_desc: "この材料の価格を下げるよう努めます。"
 cm__full_automation__fa_food_name: "食料"
 cm__full_automation__fa_food_desc: "上記の食料カテゴリの設定。"
 cm__fa_food_target_name: "余剰目標"
 cm__fa_food_target_desc: "市場は、供給が需要のこの割合に達するまで食料生産地を増やします。125%に設定すると、年間の月の中央値において25%の余剰に達しなかった市場で食料生産が拡張されます。より多くのバッファを維持するにはこの値を上げ、不足に近い市場のみを支援するにはこの値を下げてください。"
 cm__fa_food_target_format: "[CMMV('cm__fa_food_target')]%"
 cm__fa_food_min_potential_name: "最小食料ポテンシャル"
 cm__fa_food_min_potential_desc: "食料の自動拡張は、RGOレベルあたりの食料ポテンシャルがこのスコア（$mapmode_cm_location_food_potential_name$マップモードで表示されるスコアと同じ）に達する場所にのみ有効になります。この値を上げるとより良質な農地を厳選し、下げるとより生産性の低い土地も許容するようになります。"
 cm__fa_food_min_potential_format: "[CMMV('cm__fa_food_min_potential')]"
 cm__full_automation__fa_urban_rights_name: "都市権"
 cm__full_automation__fa_urban_rights_desc: "上記の都市特権カテゴリの設定。"
 cm__fa_urban_rights_window_name: "適合しきい値"
 cm__fa_urban_rights_window_desc: "ある特化権が選出候補に残るために、その立地における「最も適した権利」と比べてどの程度適合している必要があるかを設定します。50%に設定すると、適合度が最高評価の半分以上である全ての権利が抽選対象となり、適合度が高いものほど頻繁に選ばれます。100%に設定すると、最も適した権利のみが割り当てられます。"
 cm__fa_urban_rights_window_format: "[CMMV('cm__fa_urban_rights_window')]%"
 cm__fa_urban_rights_reserve_name: "政府力の備蓄"
 cm__fa_urban_rights_reserve_desc: "支払うことで政府の権力（政府形態に応じた正統性、共和制の伝統、信仰心、または部族の団結度）がこの値を下回る場合、都市権は付与されません。"
 cm__fa_urban_rights_expand_name: "強化された産業の拡張"
 cm__fa_urban_rights_expand_desc: "専門化の特権が付与された際、その特権が強化する産業およびその場所で生産されている原材料の自動拡張も有効にします。これは「推奨都市特権」マップ上で付与ボタンを右クリックした際と同様の動作です。"
 cm__full_automation__fa_cleanup_name: "建物の整理"
 cm__full_automation__fa_cleanup_desc: "上記の建造物整理カテゴリの設定。"
 cm__fa_cleanup_min_profit_name: "最小利益"
 cm__fa_cleanup_min_profit_desc: "1か月の収益がこの値を下回る建物は稼働させる価値がないとみなされ、助成されていない限り閉鎖または解体されます。一度に閉鎖・解体されるのは、市場内にある同種の建物のうち最大で半分までです。"
 cm__fa_cleanup_min_profit_format: "[Divide_CFixedPoint(CMMV('cm__fa_cleanup_min_profit'), '(CFixedPoint)100')|2]@gold!"
 cm__fa_cleanup_core_goods_name: "建設資材を優先"
 cm__fa_cleanup_core_goods_desc: "主に@masonry![ShowGoodsNameWithNoTooltip('masonry')]、@lumber![ShowGoodsNameWithNoTooltip('lumber')]、@sand![ShowGoodsNameWithNoTooltip('sand')]、または@glass![ShowGoodsNameWithNoTooltip('glass')]を消費する建物を、最小利益の2倍または0.1@gold!のいずれか高い方の基準に維持します。これら4つのうちいずれかを生産する建物は、通常の最小利益に基づいて判定されます。"
 cm__fa_cleanup_auto_food_name: "自動食料ロケーションをクリア"
 cm__fa_cleanup_auto_food_desc: "食料自動化が実行中で、何らかの労働者が既に不足している場合、食料を生産していない生産建物を解体します。@market_village! [ShowBuildingTypeNameWithNoTooltip('market_village')] は解体されるのではなく、1レベルまで削減されます。"
 cm__full_automation__fa_roads_name: "街道"
 cm__full_automation__fa_roads_desc: "上記の道路カテゴリーの設定。"
 cm__fa_roads_proximity_name: "近接度"
 cm__fa_roads_proximity_desc: "費用に対して最も近接度を上昇させる区間に道路を敷設します。この際、その先のルート上にあるすべてのロケーションも合算して計算されます。"
 cm__fa_roads_market_access_name: "市場アクセス"
 cm__fa_roads_market_access_desc: "費用に対して市場アクセスを最も向上させる道路区間を敷設します。プロキシミティ向上のための道路区間が残っていない月にのみ支出されます。"
 cm__fa_roads_capital_name: "首都との接続"
 cm__fa_roads_capital_desc: "接続済みの拠点から外側に向かって、各拠点を首都に接続するための道路を敷設します。近接性および市場アクセスの道路敷設がすべて完了している月にのみ、費用を支出します。"
 cm__full_automation__fa_governors_name: "総督"
 cm__full_automation__fa_governors_desc: "上記の総督カテゴリの設定。"
 cm__fa_gov_move_seats_name: "総督の移動を許可"
 cm__fa_gov_move_seats_desc: "すべての総督スロットが埋まっている場合、既存の総督を解任し、代わりにより良い場所へ任命します。その場所は、すでに都市であるか、あるいは交代対象よりもスコアが10%以上高い必要があります。この設定がオフの場合、総督は空いているスロットにのみ任命されます。"
 cm__fa_gov_prepare_sites_name: "新規ロケーションの準備を許可"
 cm__fa_gov_prepare_sites_desc: "まだ知事を置くことができないロケーションを考慮して、そこに町や都市を設立し首都への道路を敷設することで、それらの準備を優先的に整えます。これを無効にすると、すでに都市であり、かつ首都への道路があるロケーションのみが考慮されます。"
 cm__map_modes_name: "マップモード"
 cm__map_modes__placement_finder_name: "推奨される首都および総督の所在地"
 cm__map_modes__placement_finder_desc: "推奨総督および推奨首都配置マップモードの設定。"
 cm__placement_finder_method_name: "配置場所検索のスコアリング"
 cm__placement_finder_method_desc: "推奨総督および推奨首都マップモードが、立地をどのようにランク付けするか。"
 cm__placement_finder_method_option_1_name: "課税ベース"
 cm__placement_finder_method_option_1_desc: "そこに総督や首都を配置した際に増加する合計税収基盤の量でランク付けします。裕福な場所ほど重視されます。"
 cm__placement_finder_method_option_2_name: "近接性"
 cm__placement_finder_method_option_2_desc: "そこに総督や首都を配置した場合に追加される近接性の量でランク付けします。"
 cm__placement_finder_roads_name: "陸上インフラ"
 cm__placement_finder_roads_desc: "推奨される総督および推奨される首都マップモードが、理想的な陸上インフラを前提とするか、実際に建設されたものを使用するか。"
 cm__placement_finder_roads_option_1_name: "現在"
 cm__placement_finder_roads_option_1_desc: "実際に建設した道路を使用します。"
 cm__placement_finder_roads_option_2_name: "道路の最大数"
 cm__placement_finder_roads_option_2_desc: "解放済みの最高レベルの道路がすべての接続に建設されているものと仮定します。"
 cm__placement_finder_roads_option_3_name: "可能な限り最善"
 cm__placement_finder_roads_option_3_desc: "解禁済みの最高の道路がすべての接続に建設され、陸上近接度を向上させる解禁済みのすべての建物が建設可能なすべての場所に建設されていると仮定します。"
 cm__placement_finder_naval_name: "海軍インフラ"
 cm__placement_finder_naval_desc: "推奨総督および推奨首都マップモードが、理想的な海軍インフラを想定するか、現在の港湾容量と海軍プレゼンスを使用するか。"
 cm__placement_finder_naval_option_1_name: "現在"
 cm__placement_finder_naval_option_1_desc: "現在の港湾容量と海軍の存在を使用します。"
 cm__placement_finder_naval_option_2_name: "最大プレゼンス"
 cm__placement_finder_naval_option_2_desc: "現在の港湾容量に基づき、すべての場所で完全な海軍のプレゼンスがあると仮定します。"
 cm__placement_finder_naval_option_3_name: "可能な限り最善"
 cm__placement_finder_naval_option_3_desc: "すべての沿岸地域に解放済みの最高の港湾施設が建設され、海軍プレゼンスが最大であると仮定します。"
 cm__placement_finder_accuracy_name: "検索精度"
 cm__placement_finder_accuracy_desc: "「推奨知事」および「推奨首都」マップモードが、最適な場所をどの程度詳細に探索するか。スキップされた場所は黒色で表示されます。"
 cm__placement_finder_accuracy_option_1_name: "徹底的"
 cm__placement_finder_accuracy_option_1_desc: "全ての立地を評価します。最も正確ですが、最も低速です。"
 cm__placement_finder_accuracy_option_2_name: "徹底的"
 cm__placement_finder_accuracy_option_2_desc: "上位3位に入る可能性のない場所をスキップします。上位3位とそのスコアは「徹底的 (Exhaustive)」と同じですが、より高速です。"
 cm__placement_finder_accuracy_option_3_name: "バランス"
 cm__placement_finder_accuracy_option_3_desc: "最善ではない候補地をスキップします。最適な場所は引き続き正確に特定されますが、2番目と3番目のマーカーは時折異なる場合があります。"
 cm__placement_finder_accuracy_option_4_name: "クイック"
 cm__placement_finder_accuracy_option_4_desc: "また、最適である可能性が非常に低い立地もスキップします。見つかった最適な立地は真の最適値の20％以内に収まり、通常は正確なものとなります。"
 cm__placement_finder_accuracy_option_5_name: "最速"
 cm__placement_finder_accuracy_option_5_desc: "各州の最も有望なロケーションを評価し、上位候補を中心に精査します。大国では大幅に高速化されますが、最適な場所を見逃す可能性があります。"
 cm__debug_name: "デバッグ"
 cm__debug__logging_name: "アクションログ"
 cm__debug__logging_desc: "このModのどのアクションをModアクションログに記録するか。"
 cm__log_cycle_name: "建設サイクル"
 cm__log_cycle_desc: "前回の処理が継続中であったためにスキップされた月次サイクル、および2回連続のスキップ後に行われるリセット。"
 cm__log_industry_name: "工業"
 cm__log_industry_desc: "工業カテゴリーがキューに追加するすべての建物および検討対象のすべての原材料生産拡大について、それぞれの投資回収と収入を示す行。"
 cm__log_collapsar_name: "価格コラプサー"
 cm__log_collapsar_desc: "1つの拠点のPrice Collapsarサイクルを追跡するログ：市場の不足分と要求レベル、その拠点に割り当てられたもの、スコア、および建設内容。まずコンソールコマンド effect location:<key> = { cm_fa_col_watch_on = yes } で拠点をマークしてください。"
 cm__log_food_name: "自動食料"
 cm__log_food_desc: "食料カテゴリーの行：各市場の月間食料供給量、需要、比率、目標値に対して判定基準となる年間比率の中央値、そこで既に食料を増産しているロケーションの数、およびそれが有効化または無効化するすべてのロケーション。"
 cm__log_roads_name: "道路"
 cm__log_roads_desc: "道路カテゴリーが注文した道路ごとに、場所、3つの建設目的のいずれか、およびその費用を1行ずつ表示します。"
 cm__log_cleanup_name: "建造物のクリーンアップ"
 cm__log_cleanup_desc: "年次建造物整理処理に関するログ。閉鎖、規模縮小、破壊、再開された各建造物と、その利益および判定基準となった下限値を表示します。"
 cm__log_governors_name: "総督"
 cm__log_governors_desc: "知事の計画の各行：用地の選定および除外、町や都市のアップグレード、配置、移転と拒否、および幸運な国家の首都移転。"
 cm__log_military_name: "幸運な国家の軍事"
 cm__log_military_desc: "幸運な国家が要塞を撤去し、人的資源の建物を建設する際のテキスト"
 cm__log_government_name: "幸運な国家の政府"
 cm__log_government_desc: "幸運な国家が官僚機構を撤廃、または階級アクションを実行した際のテキスト"
 cm__debug__diagnostics_name: "診断"
 cm__placement_finder_debug_path_name: "デバッグ診断を有効にする"
 cm__placement_finder_debug_path_desc: "「推奨知事」および「推奨首都」マップモードのツールチップに診断ブロックを追加します。首都から各ロケーションへの予測ルートと各区間のコスト、および実際の近接度と比較した予測近接度が表示されます。"
 cm__debug__probes_name: "調査"
 cm__debug__probes_desc: "MODアクションログに書き込まれる単発の診断情報。"
 cm__probe_budget_name: "完全自動化予算"
 cm__probe_budget_desc: "各「完全自動化」カテゴリの残高（まだ購入できない選択肢のために資金を保留している場合は正、過剰支出により不足している場合は負）、および工業の投資回収上限と、このサイクルで見送られた市場内の最良の候補。"
 cm__probe_budget_text: "実行"
 cm__probe_governors_name: "総督の計画"
 cm__probe_governors_desc: "知事の計画の進行状況：現在のフェーズ、確保済みおよび配置待ちの建設地数、国庫の保持状況、支払い済みの知事、および対象となっているスロットと議席。"
 cm__probe_governors_text: "実行"
 cm__probe_military_name: "幸運な国家の軍事"
 cm__probe_military_desc: "国家の人力建物ティア、建設可能かどうか、首都ペアの状態、軍事予算、および建設可能なロケーション数と既設のロケーション数の比較。"
 cm__probe_military_text: "実行"
 cm__probe_industry_anchors_name: "産業アンカー"
 cm__probe_industry_anchors_desc: "各財貨につき1行で、工業が記録した最高の投資回収率と設定された回収限度、および対象の建物名と所在地を表示します。"
 cm__probe_industry_anchors_text: "実行"
 cm__probe_industry_rgo_name: "工業用原材料"
 cm__probe_industry_rgo_desc: "産業がその場所の産品を見送った理由を理由ごとに1行ずつ、または見送られなかった場合は1行で表示します。コンソールコマンド `effect location:<key> = { cm_fa_col_watch_on = yes }` で場所を指定しない限り、首都の情報を読み取ります。"
 cm__probe_industry_rgo_text: "実行"
 cm__probe_collapsar_name: "価格崩壊"
 cm__probe_collapsar_desc: "Price Collapsarがロケーションで読み取る各数値は、ゲーム自体の数値の隣に表示され、その後にそのロケーションの市場が1サイクルで吸収可能な量が表示されます。コンソールコマンド `effect location:<key> = { cm_fa_col_watch_on = yes }` でロケーションをマークしない限り、首都の情報を読み取ります。首都はPrice Collapsarの候補にならないため、実際に建設が行われるロケーションの情報を読み取るには、対象をマークしてください。"
 cm__probe_collapsar_text: "実行"
 cm__probe_roads_name: "道路"
 cm__probe_roads_desc: "道路計画が近接性、市場アクセス、首都接続のそれぞれについて保持している経路数、そのうち開始可能な首都接続の数、現在建設中の道路数、およびカテゴリーのプールに残っている数です。"
 cm__probe_roads_text: "実行"
 cm__probe_log_gate_name: "アクションログ・ゲート"
 cm__probe_log_gate_desc: "Price Collapsarのログカテゴリを、ログゲートの読み込み時とメニューの保存時の2回表示し、片方が有効で他方が無効になっているカテゴリが表示されるようにします。"
 cm__probe_log_gate_text: "実行"
