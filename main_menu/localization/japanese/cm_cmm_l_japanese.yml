 cm__urbanize_town_to_city_desc: "条件を満たした町を毎月都市に昇格させます。"
 cm__urbanize_rural_to_town_name: "農村から都市へ"
 cm__urbanize_rural_to_town_desc: "条件を満たす地方集落を毎月「町」へとアップグレードします。30,000以上の人口、または人口上限まで残り1,000以内であることが必要です。下記の「都市化しない」リストでRGOがチェックされている場所はスキップされます。「食料自動拡大」の対象となっている場所もスキップされます。"
