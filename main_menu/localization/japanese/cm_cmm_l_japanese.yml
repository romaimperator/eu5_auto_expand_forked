 # Auto-Urbanize (auto_urbanize) Tab
 cm__auto_urbanize_name: "自動都市化"
 ## Auto-Urbanize Settings (auto_urbanize) Group
 cm__auto_urbanize__auto_urbanize_name: "自動都市化設定"
 cm__auto_urbanize__auto_urbanize_desc: "毎月実行するロケーションランクの昇格を選択します。"
 cm__urbanize_town_to_city_name: "町から都市へ"
 cm__urbanize_town_to_city_desc: "条件を満たした町を毎月都市に昇格させます。"
 cm__urbanize_rural_to_town_name: "農村から都市へ"
 cm__urbanize_rural_to_town_desc: "条件を満たす農村入植地を毎月「町」へと昇格させます。人口が30,000人（即座に都市昇格可能）に達しているか、人口上限まで残り1,000人以内（そうでない場合、農村人口上限で成長が停滞するため）である必要があります。下の除外リストでRGOがチェックされているロケーションはスキップされます。「一括自動食料供給」の対象となっているロケーションも、農村のまま維持して食料生産を継続させるためにスキップされます。"
