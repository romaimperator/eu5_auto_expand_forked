 cm__dbg_run_production_name: "生産を実行"
 cm__dbg_run_production_desc: "$cm_txt_dbg_run_category_desc$" # NO-TRANSLATE
 cm__dbg_run_production_text: "$cm_txt_run_now$" # NO-TRANSLATE
 cm__ab_roads__ab_roads_name: "$cm__ab_roads_name$" # NO-TRANSLATE
 cm__ab_roads_proximity_name: "$cm_txt_proximity$" # NO-TRANSLATE
 cm__ab_roads_proximity_desc: "その先のルート上にあるすべての立地を考慮し、費用（ゴールド）あたりの近接度上昇が最大となる道路区間を敷設します。"
 cm__ab_roads_market_access_name: "市場アクセス"
 cm__ab_roads_market_access_desc: "費用対効果が最も高い道路区間を敷設し、市場アクセスを向上させます。Proximity（近接性）の敷設が行われず、かつ手が届かない区間のために貯蓄していない月にのみ支出します。"
 cm__ab_roads_capital_name: "首都接続"
 cm__ab_roads_capital_desc: "すでに接続されている拠点から外側へと道路を敷設し、各拠点を首都に接続します。近接度と市場アクセスの両方が何も敷設せず、かつ、どちらもまだ購入できない区間のために資金を貯めていない月にのみ支出が行われます。"
 cm__ab_roads_min_discount_name: "$cm_txt_min_discount$" # NO-TRANSLATE
 cm__ab_roads_min_discount_desc: "建設資材価格の最大許容マークアップ。-33%の場合、必要な木材、石材、砂の価格が基本価格を33%下回っているときにのみ着工します。0%の場合は基本価格以下、+33%の場合は価格が基本価格を33%上回っていても着工します。"
 cm__ab_roads_min_discount_format: "[CMMV('cm__ab_roads_min_discount')]%" # NO-TRANSLATE
 cm__ab_roads_run_now_name: "道路の再計画を強制"
 cm__ab_roads_run_now_desc: "次回の計画実行を待たずに、今すぐ敷設すべき道路区間を再特定します。マルチプレイではこれが唯一の算出手段となります。これ自体が直接道路を敷設するわけではなく、特定された区間は道路予算の範囲内で順次建設されます。"
 cm__ab_roads_run_now_text: "$cm_txt_run_now$" # NO-TRANSLATE
 cm__ab_roads__debug_name: "$cm_txt_debug$" # NO-TRANSLATE
 cm__dbg_run_roads_name: "道路の敷設を実行"
 cm__dbg_run_roads_desc: "現在の計画に基づき、月の更新を待たずに即座に道路の敷設を命じます。そのカテゴリの割り当ての残額を消費するため、既に今月の予算を使い果たしたカテゴリは何も敷設しません。「自動化の一時停止」はこの操作を制限しません。"
 cm__dbg_run_roads_text: "$cm_txt_run_now$" # NO-TRANSLATE
 cm__ab_governors__ab_governors_name: "$cm__ab_governors_name$" # NO-TRANSLATE
 cm__ab_gov_move_seats_name: "総督の移動を許可"
 cm__ab_gov_move_seats_desc: "すべての総督スロットが埋まっている場合、総督を解任し、代わりにより良い場所に配置します。その場所は、既に都市であるか、入れ替える対象よりもスコアが10%以上高い必要があります。オフの場合、総督は空のスロットにのみ配置されます。"
 cm__ab_gov_prepare_sites_name: "新規立地の準備を許可"
 cm__ab_gov_prepare_sites_desc: "まだ代官を配置できないロケーションを考慮して優先的に準備を整え、そこに町や都市を創設して首都への道路を建設します。これをオフにすると、既に都市であり、首都への道路が通っているロケーションのみが考慮されます。"
 cm__ab_governors__debug_name: "$cm_txt_debug$" # NO-TRANSLATE
 cm__dbg_run_governors_name: "総督の計画を開始"
 cm__dbg_run_governors_desc: "通常の25年周期を待たずに、今すぐ新しい計画を開始します。その後、計画は通常通り数ヶ月かけて各段階を進めていきます。実行には依然として平和、首都、そして他に実行中の探索がないことが必要です。"
 cm__dbg_run_governors_text: "開始"
 cm__urbanization_name: "都市化"
 cm__auto_urbanize_enabled_name: "$cm_txt_enabled$" # NO-TRANSLATE
 cm__auto_urbanize_enabled_desc: "自動都市化を有効または無効にします。"
 cm__auto_urbanize_min_discount_name: "$cm_txt_min_discount$" # NO-TRANSLATE
 cm__auto_urbanize_min_discount_desc: "許容される建設資材価格の最大上乗せ。-33%の場合、資材価格が基本価格より33%低い時のみ町や都市を建設します。0%の場合、基本価格以下の場合のみ建設します。+33%の場合、価格が基本価格を33%上回っていても建設します。"
 cm__auto_urbanize_min_discount_format: "[CMMV('cm__auto_urbanize_min_discount')]%" # NO-TRANSLATE
 cm__auto_urbanize__debug_name: "$cm_txt_debug$" # NO-TRANSLATE
 cm__dbg_run_auto_urbanize_name: "自動都市化を実行"
 cm__dbg_run_auto_urbanize_desc: "月替わりを待たずに、ランクのアップグレードを即座に実行します。このサイクルでは他のものは建設されず、「自動化の一時停止」によって制限されることもありません。"
 cm__dbg_run_auto_urbanize_text: "$cm_txt_run_now$" # NO-TRANSLATE
 cm__auto_town_rights__auto_town_rights_specialization_name: "スマート特化の特権付与者"
 cm__auto_town_rights__auto_town_rights_specialization_desc: "カスタム権利付与者の処理が終了した後に付与されます。"
 cm__auto_grant_specialization_name: "特化都市権の自動付与"
 cm__auto_grant_specialization_desc: "各ロケーションに、周辺で生産される産品に適したもののうち、最も金銭的価値の高い専門化権限を1つ付与します。"
 cm__specialization_window_name: "適合しきい値"
 cm__specialization_window_desc: "ある特化権が候補に残るために、そのロケーションで最も適合する権利と比較して、どの程度適合している必要があるかを設定します。50%の場合、最も適合する権利の半分以上の適合度を持つ権利が候補となり、その中で最も金銭的価値が高いものが付与されます。100%の場合、最も適合する権利のみが付与されます。"
 cm__specialization_window_format: "[CMMV('cm__specialization_window')]%" # NO-TRANSLATE
 cm__specialization_expand_name: "強化された産業を拡張する"
 cm__specialization_expand_desc: "特化の特権が付与された際、その特権が強化する産業、およびそのロケーションで生産されている原材料の自動拡張を有効にします。これは「推奨都市特権」マップで付与ボタンを右クリックした際と同じ動作です。"
 cm__auto_town_rights__debug_name: "$cm_txt_debug$" # NO-TRANSLATE
 cm__dbg_run_town_rights_name: "都市特権の自動付与を実行"
 cm__dbg_run_town_rights_desc: "月替わりを待たずに即座に付与し、まず有効化リスト、次に特化権限の順で処理を行います。「自動化の一時停止」によってこの動作が制限されることはありません。"
 cm__dbg_run_town_rights_text: "$cm_txt_run_now$" # NO-TRANSLATE
 cm__miscellaneous_name: "その他"
 cm__cleanup_name: "建物整理"
 cm__cleanup__cleanup_name: "$cm__cleanup_name$" # NO-TRANSLATE
 cm__cleanup_close_open_name: "建造物の閉鎖と開放"
 cm__cleanup_close_open_desc: "年に一度、利益が出ておらず助成金も受けていない生産施設を閉鎖します。閉鎖された施設は、その市場でその種類が再び利益を上げるようになると再開されます。@farming_village! [ShowBuildingTypeNameWithNoTooltip('farming_village')] および @market_village! [ShowBuildingTypeNameWithNoTooltip('market_village')] は決して閉鎖されません。"
 cm__cleanup_destroy_name: "建物の解体"
 cm__cleanup_destroy_desc: "年に一度、収容可能な建物レベルの上限まで残り10レベル以内の場所において、利益を上げなくなった生産施設を、空き容量がなくなったために既に閉鎖されている施設と共に解体します。@market_village! [ShowBuildingTypeNameWithNoTooltip('market_village')]は代わりに1レベルまで縮小されます。@fruit_orchard! [ShowBuildingTypeNameWithNoTooltip('fruit_orchard')]は収益に関わらず解体され、二度と再建されることはありません。また、@farming_village! [ShowBuildingTypeNameWithNoTooltip('farming_village')]は決して解体されません。"
 cm__cleanup_min_profit_name: "レベルあたりの最小利益"
 cm__cleanup_min_profit_desc: "1レベルあたりの月間収益がこの値を下回る建物は、稼働させる価値がないと判断され、助成されていない限り閉鎖または破壊されます。"
 cm__cleanup_min_profit_format: "[Divide_CFixedPoint(CMMV('cm__cleanup_min_profit'), '(CFixedPoint)100')|2]@gold!" # NO-TRANSLATE
 cm__cleanup_max_changed_name: "パスあたりの最大変更数"
 cm__cleanup_max_changed_desc: "1回の年次処理において、市場内のある建造物タイプが変更可能な割合です。50%に設定した場合、稼働中の建物の半分が閉鎖または破壊され、閉鎖中の建物の半分が再稼働される可能性があります。変更される数は1を下回ることはないため、あるタイプの最後の建物であっても閉鎖可能です。"
 cm__cleanup_max_changed_format: "[CMMV('cm__cleanup_max_changed')]%" # NO-TRANSLATE
 cm__cleanup_core_goods_name: "建設資材を優先"
 cm__cleanup_core_goods_desc: "@masonry![ShowGoodsNameWithNoTooltip('masonry')]、@lumber![ShowGoodsNameWithNoTooltip('lumber')]、@sand![ShowGoodsNameWithNoTooltip('sand')]、または@glass![ShowGoodsNameWithNoTooltip('glass')]を主に消費する建造物について、レベルあたりの最小利益の2倍、またはレベルあたり0.1@gold!のいずれか高い方を維持基準とします。これら4つのうちいずれかを生産する建造物は、これが有効な間、閉鎖または破壊されることはありません。"
 cm__cleanup_auto_food_name: "自動食料ロケーションのクリア"
 cm__cleanup_auto_food_desc: "自動食料供給が実行中で、いずれかの労働者が既に不足している場合、食料を生産していない生産施設を解体します。@market_village! [ShowBuildingTypeNameWithNoTooltip('market_village')]は解体されず、1レベルまで縮小されます。"
 cm__cleanup_run_now_name: "建造物クリーンアップの実行"
 cm__cleanup_run_now_desc: "年次判定を待たずに、今すぐクリーンアップを実行します。"
 cm__cleanup_run_now_text: "$cm_txt_run_now$" # NO-TRANSLATE
 cm__placement_finder_method_option_3_name: "人口"
 cm__placement_finder_method_option_3_desc: "そこに総督や首都を配置した際の近接度の増加量に基づいてランク付けし、各拠点を居住人口でカウントします。大人口に対するわずかな増加は、小人口に対する大幅な増加よりも価値が低くなります。"
 cm__log_production_name: "$cm__ab_production_name$" # NO-TRANSLATE
 cm__log_production_desc: "生産カテゴリーがキューに追加する全建物および検討された全原材料拡張の行。それぞれに投資回収期間と収入が表示されます。"
 cm__log_core_name: "$cm__ab_core_name$" # NO-TRANSLATE
 cm__log_core_desc: "あるロケーションのコア商品サイクルを追跡するログ：市場の不足分と要求されたレベル、そしてそのロケーションに割り当てられたリソース、スコア、建設内容を表示します。まず、コンソールコマンド effect location:<key> = { cm_ab_core_watch_on = yes } を使用して対象のロケーションをマークしてください。"
 cm__debug__rotation_name: "市場のローテーション"
 cm__debug__rotation_desc: "大国は市場を一度に数個ずつ処理し、各自動化機能は現在対象となっているセット内で建設を行います。"
 cm__dbg_rotate_slice_name: "市場をローテーション"
 cm__dbg_rotate_slice_desc: "次の市場セットへ移動します。「今すぐ実行」ボタンから開始された処理は、検出されたセットに留まるため、ゲームの一時停止中に処理を進めるにはこれを使用します。"
 cm__dbg_rotate_slice_text: "回転"
 cm__probe_production_anchors_name: "生産アンカー"
 cm__probe_production_anchors_desc: "財貨ごとに、記録された最高の投資回収と、それが設定する投資回収制限を、該当する建物名と場所と共に1行ずつ表示します。"
 cm__probe_production_anchors_text: "$cm_txt_run$" # NO-TRANSLATE
 cm__probe_production_rgo_name: "原材料生産"
 cm__probe_production_rgo_desc: "生産が拠点の原材料をスキップした理由ごとに1行、またはスキップされなかった場合は1行のみ表示されます。コンソールコマンド effect location:<key> = { cm_ab_core_watch_on = yes } で拠点をマークしない限り、首都の情報が読み取られます。"
 cm__probe_production_rgo_text: "$cm_txt_run$" # NO-TRANSLATE
 cm__probe_core_name: "$cm__ab_core_name$" # NO-TRANSLATE
 cm__probe_core_desc: "ロケーションにおいて「主要物資」が読み取る各数値が、ゲーム本来の数値の隣に表示され、続いてそのロケーションの市場が1サイクルで吸収可能な量が表示されます。コンソールコマンド `effect location:<key> = { cm_ab_core_watch_on = yes }` でロケーションをマークしない限り、首都の情報が表示されます。首都は主要物資の建設候補にはならないため、実際に建設が行われるロケーションの数値を読み取るには、対象をマークしてください。"
 cm__probe_core_text: "$cm_txt_run$" # NO-TRANSLATE
 cm__probe_setup_name: "$cm_txt_setup_data$" # NO-TRANSLATE
 cm__probe_setup_desc: "セーブデータが保持しているマップデータと各データの算出バージョン、およびこのマシンがそれらの算出を許可されているかを示します。バージョン0は未算出であることを意味し、次回のロード時に算出されます。"
 cm__probe_setup_text: "$cm_txt_run$" # NO-TRANSLATE
 cm__debug__setup_name: "$cm_txt_setup_data$" # NO-TRANSLATE
