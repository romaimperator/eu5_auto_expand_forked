 cm__urbanize_town_to_city_name: "町から都市へ"
 cm__urbanize_town_to_city_desc: "毎月、条件を満たした町を都市に昇格させます。"
 cm__urbanize_rural_to_town_name: "農村から都市へ"
 cm__urbanize_rural_to_town_desc: "条件を満たす農村を毎月町にアップグレードします。人口が30,000人以上、または人口上限まで1,000人以内であることが必要です。下の「都市化禁止リスト」でRGOがチェックされている場所はスキップされます。"
