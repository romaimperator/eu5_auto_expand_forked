 cm__urbanize_rural_to_town_name: "農村から都市へ"
 cm__urbanize_rural_to_town_desc: "条件を満たす農村集落を毎月町へアップグレードします。人口が30,000人以上、または人口上限まで残り1,000人以内である必要があります。下記の「都市化しない」リストでRGOがチェックされている場所はスキップされます。「一括自動食料供給」の対象となっている場所もスキップされます。"
