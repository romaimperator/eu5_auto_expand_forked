 cm__auto_build_list__in_subjects_desc: "従属国のロケーションにも、自身の費用でこの建物タイプを建設します。"
 cm__auto_build_list__min_control_name: "最低支配度"
 cm__auto_build_list__min_control_desc: "この建物が建設されるために必要な、ロケーションの最低支配度。"
 cm__auto_build_list__min_control_postfix: "%"
 cm__auto_build_list__min_discount_name: "$cm_txt_min_discount$"
 cm__auto_build_list__min_discount_desc: "建設資材価格の最大許容上乗せ率。負の値は割引を必要とし、正の値は割増を許容します。"
 cm__auto_build_list__min_discount_postfix: "%"
