 cm__ab_core_target_name: "目標価格"
 cm__ab_core_target_desc: "素材の建設を停止する、基本価格に対する相対価格です。-33%では、素材の取引価格が基本価格を33%下回るまで生産施設が建設されます。0%では基本価格に達するまで、+33%では価格が基本価格を33%上回っている間のみ建設されます。"
