l_japanese:
 # Mod
 cm_name: "建築管理"
 cm_desc: "新たな自動化機能、フィルター、マップモードを追加し、EU5の建設体験を大幅に向上させる大規模なQoL向上モッドです。"

 # Settings (settings) Tab
 cm__settings_name: "設定"
 ## Global Control (settings) Group
 cm__pause_auto_expand_name: "自動化の一時停止"
 cm__pause_auto_expand_desc: "すべての自動化機能を一時停止します：建物の自動拡張、RGOの自動拡張、全建物のアップグレード、自動建設、首都建物の自動建設、食料の自動管理、自動都市化、都市権の自動付与、および完全自動化。"
 cm__minimum_gold_name: "金備蓄"
 cm__minimum_gold_desc: "保持する最小の金準備。完全自動化を除くすべての自動化機能に適用されます。"
 cm__minimum_gold_format: "[CMMV('cm__minimum_gold')]@gold!"
 cm__allowed_building_overbuild_levels_name: "超過建設制限"
 cm__allowed_building_overbuild_levels_desc: "自動拡張による新規建設の追加を停止するまでに、立地が「維持可能な建造物レベル」の上限を合計で何レベルまで超過できるかを設定します。0の場合は超過建築を許可せず、200以上の場合は制限がなくなります。"

 ## Priority List Group
 cm__settings__priority_list_name: "建設自動化"
 cm__settings__priority_list_desc: "ドラッグで機能の優先順位を並べ替えます。有効化された機能は毎月上から下の順に実行されますが、Auto-Urbanizeは例外として、他のすべての機能およびFull Automationの後に、常に最後に実行されます。"
 cm__priority_list_item_column_name: "機能"
 cm__priority_list_i1_name: "建物の自動拡張"
 cm__priority_list_i1_desc: "利益が出ており、POPが利用可能で、かつ所持金が金準備金（Gold Reserve）を上回っている場合に、多段階の生産および非生産建物を自動的に拡張します。特定の場所、または建物タイプ全体で自動拡張がオンになっている場合に適用され、他国の場所にある外国の建物も含まれます。"
 cm__priority_list_i2_name: "RGOの自動拡張"
 cm__priority_list_i2_desc: "RGOの自動拡張が有効な立地において、労働者が利用可能で資源が十分にある場合に、RGOのレベルを自動的に拡張します。"
 cm__priority_list_i3_name: "自動建設"
 cm__priority_list_i3_desc: "「自動建設」タブで設定された順序と設定に従い、首都の建物およびロケーションごとに1つのみ建設可能な建物（評議会、図書館など）を自動的に建設します。"
 cm__priority_list_i4_name: "自動食料"
 cm__priority_list_i4_desc: "最も食料効率の高い選択肢を選び、地方のロケーションに食料生産RGOや建物を自動的に建設します。「自動食料」タブで設定可能です。"
 cm__priority_list_i5_name: "自動都市化"
 cm__priority_list_i5_desc: "毎月、拠点のランクをアップグレードします：農村集落を町に、町を都市に、都市を巨大都市に。征服された拠点はスキップされます。「自動都市化」タブで設定可能です。"
 cm__priority_list_i6_name: "すべての建物を自動アップグレード"
 cm__priority_list_i6_desc: "自動拡張が有効であるかに関わらず、陳腐化したすべての建物を自動的にアップグレードします。"
 cm__priority_list__enabled_name: "有効"
 cm__priority_list__enabled_desc: "この機能を有効または無効にします。"
 cm__priority_list__min_profit_name: "最低税収"
 cm__priority_list__min_profit_desc: "建設がキューに追加されるために必要な、レベルあたりの最低月間収支です。0に設定すると、このチェックは無効になります。"
 cm__priority_list__min_profit_postfix: "@gold!"
 cm__priority_list__min_discount_name: "最小割引"
 cm__priority_list__min_discount_desc: "建設資材の最大価格許容範囲。-33%に設定すると、資材価格が基本価格より33%低い場合のみ建設されます。0%の場合は基本価格以下の時のみ建設されます。+33%に設定すると、価格が基本価格より33%高くても建設されます。"
 cm__priority_list__min_discount_postfix: "%"
 cm__priority_list__min_discount_prefix_high: "#R "
 cm__priority_list__min_discount_postfix_high: "%#!"
 cm__priority_list__min_discount_prefix_low: "#G "
 cm__priority_list__min_discount_postfix_low: "%#!"

