l_japanese:
 mapmode_cm_breadbasket_name: "穀倉地帯"
 MAPMODE_CM_BREADBASKET: "#T $mapmode_cm_breadbasket_name$#!\n現在自動食料供給が設定されている[locations|e]を強調表示します。"
 MAPMODE_CM_BREADBASKET_TT_ENABLED: "[ROOT.GetLocation.GetName]は食料の自動管理に設定されています。"
 MAPMODE_CM_BREADBASKET_TT_OWNED: "[ROOT.GetLocation.GetName]はあなたの領土ですが、食料の自動管理が有効になっていません。"
 MAPMODE_CM_BREADBASKET_TT_FOREIGN: "[ROOT.GetLocation.GetName]はあなたのものではありません。"
 MAPMODE_CM_BREADBASKET_TT_UNCOLONIZED: "[ROOT.GetLocation.GetName]は未入植です。"
 MAPMODE_CM_BREADBASKET_TT_WATER: "[ROOT.GetLocation.GetName]は海域です。"

 cm_breadbasket_enabled_legend_key: "食料自動化を有効にしました"
 cm_breadbasket_owned_legend_key: "あなたの他のロケーション"
 cm_breadbasket_foreign_legend_key: "他国のロケーション"
 cm_breadbasket_uncolonized_legend_key: "未入植"

 mapmode_cm_location_food_potential_name: "RGOレベルあたりの食料ポテンシャル"
 MAPMODE_CM_LOCATION_FOOD_POTENTIAL: "#T $mapmode_cm_location_food_potential_name$#!\nこれにより、[rgo|e]レベルあたりの自然な食料ポテンシャルに基づいて[locations|e]が色分けされます。このスコアは、[rgo|e]の[food|e]値、累積的な[food_productivity|e]（地形、植生、気候、スコーネのニシン市場や肥沃なナイル・デルタといった名称付き固定修正、[rgo|e]固有の産出修正など）、水へのアクセス、および[rgo|e]が許可する場所における[ShowBuildingTypeName('windmill')]、[ShowBuildingTypeName('farming_village')]、[ShowBuildingTypeName('irrigation_systems')]からの想定最大ボーナスを合算したものです。\n\n[development|e]は除外されているため、スコアは現在の産出量ではなく地形のポテンシャルを示しています。"
 mapmode_cm_location_food_potential_hidden_name: "$mapmode_cm_location_food_potential_name$"
 MAPMODE_CM_LOCATION_FOOD_POTENTIAL_HIDDEN: "$MAPMODE_CM_LOCATION_FOOD_POTENTIAL$"
 MAPMODE_CM_LOCATION_FOOD_POTENTIAL_TT_LAND: "[ROOT.GetLocation.GetName]の[rgo|e]レベルあたりの食料ポテンシャルは[ROOT.GetLocation.MakeScope.ScriptValue('cm_location_food_potential')|1Y]です。"
 MAPMODE_CM_LOCATION_FOOD_POTENTIAL_TT_WATER: "[ROOT.GetLocation.GetName]は陸地ではないため、食料の潜在能力はありません。"

 cm_location_food_potential_auto_food_legend_key: "自動食料有効 (斜線)"
 cm_location_food_potential_bright_green_legend_key: "45 (最大可能)"
 cm_location_food_potential_green_legend_key: "27.5 (優秀)"
 cm_location_food_potential_yellow_legend_key: "20 (良好)"
 cm_location_food_potential_orange_legend_key: "12.5 (まずまず)"
 cm_location_food_potential_red_legend_key: "3.75 (低)"
 cm_location_food_potential_black_legend_key: "0 (なし)"
