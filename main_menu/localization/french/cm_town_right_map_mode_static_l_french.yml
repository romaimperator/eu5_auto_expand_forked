l_french:
 mapmode_cm_best_town_right_name: "Droits urbains recommandés"
 MAPMODE_CM_BEST_TOWN_RIGHT: "#T $mapmode_cm_best_town_right_name$#!\nColore chaque [location|e] selon la spécialisation [town_rights|e] dont les bâtiments boostés peuvent puiser la plus grande part de leurs intrants [goods|e] dans les [rgo|e] du [province|e]. Survolez un [location|e] pour voir chaque option de spécialisation classée.\nSurvolez le pourcentage d'une industrie dans l'infobulle pour voir le détail des intrants de sa meilleure méthode de production.\nLes égalités pour la première place s'affichent avec une seconde couleur hachurée : la couleur de la spécialisation concernée, ou une couleur dédiée si 3 spécialisations ou plus sont à égalité."
 MAPMODE_CM_BEST_TOWN_RIGHT_TT_NONE: "[ROOT.GetLocation.GetProvince.GetName] n'a pas de [raw_material|e] utilisé par les industries spécialisées.[ROOT.GetLocation.Custom('cm_trmm_stripe_reason')]"
 MAPMODE_CM_BEST_TOWN_RIGHT_TT_WATER: "$cm_txt_tt_sea_zone$"

