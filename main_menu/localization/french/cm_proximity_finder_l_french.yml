l_french:
 mapmode_cm_governor_finder_name: "Placement recommandé des gouverneurs"
 MAPMODE_CM_GOVERNOR_FINDER: "#T $mapmode_cm_governor_finder_name$#!\nColore votre [locations|e] selon la quantité de [proximity|e] qu'un nouveau gouverneur local ou naval construit à cet endroit ajouterait, compte tenu de la proximité déjà fournie par votre [capital|e] et les sources existantes. Plus c'est vert, mieux c'est. Votre capitale et les sources de proximité existantes sont hachurées.\nCeci est une estimation : le paramètre d'évaluation du chercheur de placement détermine si les lieux sont classés par assiette fiscale ou par [proximity|e] brut, et les paramètres d'infrastructure terrestre et navale déterminent les routes, les bâtiments et les [maritime_presence|e] pris en compte. Le calcul est effectué à l'ouverture de ce mode de carte, au plus une fois tous les 4 ans ; utilisez le bouton d'actualisation de la barre d'action pour forcer un nouveau calcul. Les couleurs s'actualisent à la fin du processus."
 MAPMODE_CM_GOVERNOR_FINDER_TT_SCORED: "Gain moyen max. de [proximity|e] prédit : +[ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_gf_avg_value')|1]%\nAssiette fiscale max. prédite gagnée via [proximity|e] : +[ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_gf_taxgain_value')|1]\nScore : [ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_gf_pct_value')|0]% de votre meilleure localisation[ROOT.GetLocation.Custom('cm_pf_gf_status')]"
 MAPMODE_CM_GOVERNOR_FINDER_TT_BEST: "Gain moyen max. prédit de [proximity|e] : +[ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_gf_avg_value')|1]%\nAssiette fiscale max. prédite gagnée via [proximity|e] : +[ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_gf_taxgain_value')|1]\nVotre meilleure localisation"
 MAPMODE_CM_GOVERNOR_FINDER_TT_SCORED_DEBUG: "$MAPMODE_CM_GOVERNOR_FINDER_TT_SCORED$$CM_PF_DEBUG_BLOCK$"
 MAPMODE_CM_GOVERNOR_FINDER_TT_BEST_DEBUG: "$MAPMODE_CM_GOVERNOR_FINDER_TT_BEST$$CM_PF_DEBUG_BLOCK$"
 MAPMODE_CM_GOVERNOR_FINDER_TT_CAPITAL: "Votre [capital|e] propage déjà [proximity|e] depuis ici."
 MAPMODE_CM_GOVERNOR_FINDER_TT_CAPITAL_DEBUG: "$MAPMODE_CM_GOVERNOR_FINDER_TT_CAPITAL$$CM_PF_DEBUG_BLOCK$"
 MAPMODE_CM_GOVERNOR_FINDER_TT_SOURCE: "Source de [proximity|e] existante : [ROOT.GetLocation.GetModifierValueFixed('local_proximity_source')|0]\n$MAPMODE_CM_GOVERNOR_FINDER_TT_SCORED$"
 MAPMODE_CM_GOVERNOR_FINDER_TT_SOURCE_DEBUG: "$MAPMODE_CM_GOVERNOR_FINDER_TT_SOURCE$$CM_PF_DEBUG_BLOCK$"
 MAPMODE_CM_GOVERNOR_FINDER_TT_SOURCE_NOGAIN: "Source de [proximity|e] existante : [ROOT.GetLocation.GetModifierValueFixed('local_proximity_source')|0]\n$MAPMODE_CM_GOVERNOR_FINDER_TT_NOGAIN$"
 MAPMODE_CM_GOVERNOR_FINDER_TT_SOURCE_NOGAIN_DEBUG: "$MAPMODE_CM_GOVERNOR_FINDER_TT_SOURCE_NOGAIN$$CM_PF_DEBUG_BLOCK$"
 MAPMODE_CM_GOVERNOR_FINDER_TT_NOGAIN: "Un gouverneur fournit au maximum 80 [proximity|e], et cette localisation [ROOT.GetLocation.Custom('cm_pf_nogain_basis')], donc un gouverneur construit ici n'ajouterait rien."
 MAPMODE_CM_GOVERNOR_FINDER_TT_NOGAIN_DEBUG: "$MAPMODE_CM_GOVERNOR_FINDER_TT_NOGAIN$$CM_PF_DEBUG_BLOCK$"
 cm_pf_nogain_basis_current: "en possède déjà au moins autant"
 cm_pf_nogain_basis_assumed: "en aurait déjà au moins autant avec l'infrastructure supposée"
 CM_PF_DEBUG_BLOCK: "[ROOT.GetLocation.Custom('cm_pf_debug_block')]"
 cm_pf_debug_block_text: "\n--debug--\n[ROOT.GetLocation.Custom('cm_pf_pred_label')]: [ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_pred_value')|0]%\n[proximity|e] actuel: [ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_current_proximity')|0]%[ROOT.GetLocation.Custom('cm_pf_path_block')]"
 cm_pf_pred_label_max: "[proximity|e] maximum prévu depuis la capitale"
 cm_pf_pred_label_current: "[proximity|e] actuel prédit depuis la capitale"
 cm_pf_blank: ""
 cm_pf_path_body: "\nTrajet prévu depuis la capitale :[ROOT.GetLocation.Custom('cm_pf_path_overflow')][ROOT.GetLocation.Custom('cm_pf_path_slot_12')][ROOT.GetLocation.Custom('cm_pf_path_slot_11')][ROOT.GetLocation.Custom('cm_pf_path_slot_10')][ROOT.GetLocation.Custom('cm_pf_path_slot_9')][ROOT.GetLocation.Custom('cm_pf_path_slot_8')][ROOT.GetLocation.Custom('cm_pf_path_slot_7')][ROOT.GetLocation.Custom('cm_pf_path_slot_6')][ROOT.GetLocation.Custom('cm_pf_path_slot_5')][ROOT.GetLocation.Custom('cm_pf_path_slot_4')][ROOT.GetLocation.Custom('cm_pf_path_slot_3')][ROOT.GetLocation.Custom('cm_pf_path_slot_2')][ROOT.GetLocation.Custom('cm_pf_path_slot_1')]"
