 cm_pf_path_line_8: "\n  [ROOT.GetLocation.MakeScope.GetVariable('cm_pf_prev').GetLocation.MakeScope.GetVariable('cm_pf_prev').GetLocation.MakeScope.GetVariable('cm_pf_prev').GetLocation.MakeScope.GetVariable('cm_pf_prev').GetLocation.MakeScope.GetVariable('cm_pf_prev').GetLocation.MakeScope.GetVariable('cm_pf_prev').GetLocation.MakeScope.GetVariable('cm_pf_prev').GetLocation.GetNameWithNoTooltip]: +[ROOT.GetLocation.MakeScope.GetVariable('cm_pf_prev').GetLocation.MakeScope.GetVariable('cm_pf_prev').GetLocation.MakeScope.GetVariable('cm_pf_prev').GetLocation.MakeScope.GetVariable('cm_pf_prev').GetLocation.MakeScope.GetVariable('cm_pf_prev').GetLocation.MakeScope.GetVariable('cm_pf_prev').GetLocation.MakeScope.GetVariable('cm_pf_prev').GetLocation.MakeScope.ScriptValue('cm_pf_hop_value')|1]"
