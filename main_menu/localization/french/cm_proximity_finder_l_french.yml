 MAPMODE_CM_GOVERNOR_FINDER_TT_ZERO: "Vous avez déjà un [proximity|e] élevé partout où un gouverneur ici pourrait intervenir, cela n'ajouterait donc que peu."
 MAPMODE_CM_GOVERNOR_FINDER_TT_NO_DATA: "$cm_pf_tt_no_data$"
 MAPMODE_CM_GOVERNOR_FINDER_TT_SKIPPED: "$cm_pf_tt_skipped$"
 MAPMODE_CM_GOVERNOR_FINDER_TT_SKIPPED_DEBUG: "$MAPMODE_CM_GOVERNOR_FINDER_TT_SKIPPED$$CM_PF_DEBUG_BLOCK$"
 MAPMODE_CM_GOVERNOR_FINDER_TT_INELIGIBLE: "Non évalué : aucun gouverneur ne peut être placé ici ([ROOT.GetLocation.Custom('cm_pf_inelig_reason')])."
 cm_pf_inelig_reason_route: "pas de connexion terrestre vers votre capitale et n'est pas côtier"
 cm_pf_inelig_reason_blocked: "[ShowBuildingTypeNameWithNoTooltip('seljuk_mint')] bloque [ShowBuildingTypeNameWithNoTooltip('local_governor')], et [ShowBuildingTypeNameWithNoTooltip('naval_governor')] nécessite un emplacement sans connexion terrestre avec votre capitale"
 MAPMODE_CM_GOVERNOR_FINDER_TT_INELIGIBLE_DEBUG: "$MAPMODE_CM_GOVERNOR_FINDER_TT_INELIGIBLE$$CM_PF_DEBUG_BLOCK$"
 MAPMODE_CM_GOVERNOR_FINDER_TT_FOREIGN: "$cm_pf_tt_foreign$"
 MAPMODE_CM_GOVERNOR_FINDER_TT_WATER: "Ceci est une localisation maritime ; les scores de placement s'appliquent à vos propres terres."

 # Shared status line appended to the scored tooltip: rank 2/3 or a displayed local maximum.
 cm_pf_status_second: "\nVotre 2e meilleur lieu"
 cm_pf_status_third: "\nVotre 3e meilleur lieu"
 cm_pf_status_localmax: "\nMaximum local : Meilleur que toutes les localisations environnantes"

 mapmode_cm_governor_finder_hidden_name: "$mapmode_cm_governor_finder_name$"
 MAPMODE_CM_GOVERNOR_FINDER_HIDDEN: "$MAPMODE_CM_GOVERNOR_FINDER$"

 cm_pf_first_legend_key: "1er"
 cm_pf_second_legend_key: "2e"
 cm_pf_third_legend_key: "3e"
 cm_pf_good_legend_key: "100% $cm_pf_of_best$"
 cm_pf_moderate_legend_key: "75% $cm_pf_of_best$"
 cm_pf_fair_legend_key: "50% $cm_pf_of_best$"
 cm_pf_poor_legend_key: "25% $cm_pf_of_best$"
 cm_pf_bad_legend_key: "0% $cm_pf_of_best$"
 cm_pf_localmax_legend_key: "Maximum local (hachuré)"
 cm_pf_gov_capital_legend_key: "Capitale (hachurée)"
 cm_pf_gov_source_legend_key: "$cm_pf_source_legend$"
 cm_pf_not_scored_legend_key: "Pas encore évalué"
 cm_pf_skipped_legend_key: "Non évalué (ignoré)"

 mapmode_cm_capital_finder_name: "Emplacement recommandé pour la capitale"
 MAPMODE_CM_CAPITAL_FINDER: "#T $mapmode_cm_capital_finder_name$#!\nColore votre [locations|e] selon l'efficacité avec laquelle un [capital|e] y propagerait [proximity|e]. Les gouverneurs existants sont ignorés. Les lieux hachurés possèdent déjà une source de proximité, telle que la capitale actuelle ou un gouverneur.\n$cm_pf_estimate_note$"
 MAPMODE_CM_CAPITAL_FINDER_TT_SCORED: "$cm_pf_cap_tt_head$\nScore : [ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_cf_pct_value')|0] % de votre meilleur lieu[ROOT.GetLocation.Custom('cm_pf_cf_status')]"
 MAPMODE_CM_CAPITAL_FINDER_TT_BEST: "$cm_pf_cap_tt_head$\nVotre meilleur emplacement"
 MAPMODE_CM_CAPITAL_FINDER_TT_SCORED_DEBUG: "$MAPMODE_CM_CAPITAL_FINDER_TT_SCORED$$CM_PF_DEBUG_BLOCK$"
 MAPMODE_CM_CAPITAL_FINDER_TT_BEST_DEBUG: "$MAPMODE_CM_CAPITAL_FINDER_TT_BEST$$CM_PF_DEBUG_BLOCK$"
 MAPMODE_CM_CAPITAL_FINDER_TT_SOURCE: "$MAPMODE_CM_CAPITAL_FINDER_TT_SCORED$\nSource de proximité existante : [ROOT.GetLocation.GetModifierValueFixed('local_proximity_source')|0]"
 MAPMODE_CM_CAPITAL_FINDER_TT_SOURCE_DEBUG: "$MAPMODE_CM_CAPITAL_FINDER_TT_SOURCE$$CM_PF_DEBUG_BLOCK$"
 MAPMODE_CM_CAPITAL_FINDER_TT_NO_DATA: "$cm_pf_tt_no_data$"
 MAPMODE_CM_CAPITAL_FINDER_TT_SKIPPED: "$cm_pf_tt_skipped$"
 MAPMODE_CM_CAPITAL_FINDER_TT_SKIPPED_DEBUG: "$MAPMODE_CM_CAPITAL_FINDER_TT_SKIPPED$$CM_PF_DEBUG_BLOCK$"
 MAPMODE_CM_CAPITAL_FINDER_TT_FOREIGN: "$cm_pf_tt_foreign$"
 MAPMODE_CM_CAPITAL_FINDER_TT_WATER: "Il s'agit d'un lieu maritime ; les scores de capitale s'appliquent à vos propres terres."

 mapmode_cm_capital_finder_hidden_name: "$mapmode_cm_capital_finder_name$"
 MAPMODE_CM_CAPITAL_FINDER_HIDDEN: "$MAPMODE_CM_CAPITAL_FINDER$"

 cm_pf_cap_source_legend_key: "$cm_pf_source_legend$"

 # Action bar refresh button
 cm_pf_refresh: "cm_pf_refresh"
 cm_pf_refresh_color: "turquoise foncé"
 cm_pf_refresh_icon: "@cm_pf_refresh!"
 cm_pf_refresh_name: "Recalculer les scores de placement"
 cm_pf_refresh_tooltip: "Forcer un nouveau calcul des scores de placement du gouverneur et de la capitale pour les frontières actuelles. Sinon, les scores sont réutilisés pendant une durée maximale de 4 ans."
 cm_pf_estimate_note: "Ceci est une estimation : le paramètre Scoring du Chercheur d'Emplacement détermine si les lieux sont classés par base fiscale, par population ou par [proximity|e] brut, et les paramètres d'Infrastructure Terrestre et d'Infrastructure Navale déterminent les routes, les bâtiments et [maritime_presence|e] qu'il prend en compte. Le calcul s'effectue à l'ouverture de ce mode de carte, au plus une fois tous les 4 ans ; utilisez le bouton de rafraîchissement de la barre d'action pour forcer un nouveau calcul. Les couleurs s'actualisent une fois celui-ci terminé."
 cm_pf_tt_no_data: "Pas encore évalué. Utilisez le bouton d'actualisation de la barre d'actions pour calculer les scores pour les frontières actuelles."
 cm_pf_tt_skipped: "Non évalué : le paramètre de Précision de la recherche a ignoré ce lieu. Réglez-le sur Exhaustif et actualisez pour évaluer chaque lieu."
 cm_pf_tt_foreign: "Ne fait pas partie de votre pays."
 cm_pf_source_legend: "Source de proximité existante (hachurée)"
 cm_pf_of_best: "du meilleur"
 cm_pf_gov_tt_head: "Gain moyen max. prévu de [proximity|e] : +[ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_gf_avg_value')|1]%\nBase d'imposition max. prévue via [proximity|e] : +[ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_gf_taxgain_value')|1]\nPopulation max. prévue atteinte, pondérée par le gain de [proximity|e] : +[ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_gf_popgain_value')|1]k"
 cm_pf_gov_source_line: "Source de [proximity|e] existante : [ROOT.GetLocation.GetModifierValueFixed('local_proximity_source')|0]"
 cm_pf_cap_tt_head: "Moyenne maximale prédite de [proximity|e] avec la capitale : [ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_cf_avg_value')|1]%\nAssiette fiscale maximale prédite de [proximity|e] : +[ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_cf_taxgain_value')|1]\nPopulation maximale prédite atteinte, pondérée par [proximity|e] : +[ROOT.GetLocation.MakeScope.ScriptValue('cm_pf_cf_popgain_value')|1]k"
