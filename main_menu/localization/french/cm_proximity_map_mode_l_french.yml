l_french:
 mapmode_cm_location_proximity_modifier_name: "Impact de l'efficacité de proximité"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER: "#T $mapmode_cm_location_proximity_modifier_name$#!\nColore [locations|e] selon leur $mapmode_cm_location_proximity_modifier_name$ : la pénalité combinée que leur [topography|e] et [vegetation|e] imposent à la [proximity|e] (montagnes, collines, plateau, zones humides, forêt, jungle, etc.). Le vert signifie que le terrain n'entrave pas la proximité ; le rouge signifie qu'il l'entrave fortement. Les pénalités de topographie sont ajustées par les bonus d'impact de proximité du propriétaire, tels que ceux du terrain de la capitale ou des avancées ; les lieux sans propriétaire affichent les valeurs de terrain de base. Un [road|e] ou [river|e] sur un lieu annule sa pénalité de [vegetation|e] ; la pénalité de [topography|e] s'applique toujours.\n\nL'eau affiche à la place la [maritime_presence|e] que le [country|e] sélectionné y possède, du vert au plus bas au bleu clair au maximum, en passant par le vert clair. Une présence élevée réduit la [proximity|e] perdue lors de la traversée d'un [seazone|e]."
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_LAND: "$mapmode_cm_location_proximity_modifier_name$: [ROOT.GetLocation.MakeScope.ScriptValue('cm_location_proximity_modifier')|+=%]"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_LAND_HARBOR: "$MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_LAND$\nAdéquation du port naturel : [ROOT.GetLocation.GetModifierValueFixed('natural_harbor_suitability')|0%]"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER: "[ROOT.GetLocation.GetName] n'est pas terrestre et n'a donc pas de $mapmode_cm_location_proximity_modifier_name$, et le [country|e] sélectionné n'a pas de [maritime_presence|e] ici."

 cm_location_proximity_modifier_none_legend_key: "0 % (aucune pénalité)"
 cm_location_proximity_modifier_light_legend_key: "-25% (léger)"
 cm_location_proximity_modifier_noticeable_legend_key: "-35% (notable)"
 cm_location_proximity_modifier_moderate_legend_key: "-50% (modéré)"
 cm_location_proximity_modifier_heavy_legend_key: "-65 % (lourd)"
 cm_location_proximity_modifier_severe_legend_key: "-75% (sévère)"
 cm_location_proximity_modifier_worst_legend_key: "-100% (le pire)"
 cm_location_proximity_modifier_harbor_legend_key: "Aptitude au port naturel (hachuré)"
 cm_location_proximity_modifier_maritime_none_legend_key: "Aucune présence maritime (pleine mer)"
 cm_location_proximity_modifier_maritime_low_legend_key: "Faible présence maritime"
 cm_location_proximity_modifier_maritime_half_legend_key: "50 % de présence maritime"
 cm_location_proximity_modifier_maritime_full_legend_key: "100 % de présence maritime"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER_M0: "[maritime_presence|E]: 0-10%"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER_M10: "[maritime_presence|E]: 10-20%"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER_M20: "[maritime_presence|E]: 20-30%"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER_M30: "[maritime_presence|E]: 30-40%"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER_M40: "[maritime_presence|E]: 40-50%"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER_M50: "[maritime_presence|E]: 50-60%"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER_M60: "[maritime_presence|E]: 60-70%"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER_M70: "[maritime_presence|E]: 70-80%"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER_M80: "[maritime_presence|E]: 80-90%"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER_M90: "[maritime_presence|E]: 90-100%"
