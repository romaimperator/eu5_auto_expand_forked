l_french:
 mapmode_cm_location_proximity_modifier_name: "Impact de l'efficacité de proximité"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER: "#T $mapmode_cm_location_proximity_modifier_name$#!\nColore [locations|e] selon leur impact sur l'efficacité de proximité : la pénalité combinée que leur [topography|e] et leur [vegetation|e] imposent à la [proximity|e] (montagnes, collines, plateaux, zones humides, forêts, jungles, etc.). Le vert signifie que le terrain n'entrave pas la proximité ; le rouge signifie qu'il l'entrave fortement. Les pénalités de topographie sont pondérées par les bonus d'impact de proximité du propriétaire, comme ceux du terrain de la capitale ou des avancées ; les lieux non possédés affichent les valeurs de base du terrain. Un [road|e] ou un [river|e] sur un lieu annule sa pénalité de [vegetation|e] ; la pénalité de [topography|e] s'applique toujours."
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_LAND: "Impact de l'efficacité de proximité : [ROOT.GetLocation.MakeScope.ScriptValue('cm_location_proximity_modifier')|+=%]"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_LAND_HARBOR: "Impact de l'efficacité de proximité : [ROOT.GetLocation.MakeScope.ScriptValue('cm_location_proximity_modifier')|+=%]\nPotentiel de port naturel : [ROOT.GetLocation.GetModifierValueFixed('natural_harbor_suitability')|0%]"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER: "[ROOT.GetLocation.GetName] n'est pas terrestre et n'a donc aucun impact d'efficacité de proximité."

 cm_location_proximity_modifier_none_legend_key: "0 % (aucune pénalité)"
 cm_location_proximity_modifier_light_legend_key: "-25% (léger)"
 cm_location_proximity_modifier_noticeable_legend_key: "-35% (notable)"
 cm_location_proximity_modifier_moderate_legend_key: "-50% (modéré)"
 cm_location_proximity_modifier_heavy_legend_key: "-65 % (lourd)"
 cm_location_proximity_modifier_severe_legend_key: "-75% (sévère)"
 cm_location_proximity_modifier_worst_legend_key: "-100% (le pire)"
 cm_location_proximity_modifier_harbor_legend_key: "Aptitude au port naturel (hachuré)"
