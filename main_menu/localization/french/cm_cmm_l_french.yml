 cm__expand_metric_option_1_desc: "Ajouter un nouveau niveau uniquement lorsque son revenu fiscal mensuel est au moins égal au Revenu fiscal min. défini."
 cm__expand_metric_option_2_name: "@wealth! Profit"
 cm__expand_metric_option_2_desc: "N'ajoute un nouveau niveau que si son profit mensuel total est au moins égal au profit minimum défini."
 cm__expand_metric_option_3_name: "@efficiency! RSI (Impôts)"
 cm__expand_metric_option_3_desc: "Ajouter un nouveau niveau uniquement lorsque son revenu fiscal amortit le coût de construction dans la limite de vos Années max. de ROI."
 cm__expand_metric_option_4_name: "@efficiency! ROI (Profit)"
 cm__expand_metric_option_4_desc: "Ajouter un nouveau niveau uniquement lorsque son profit permet d'amortir le coût de construction dans la limite des années de ROI max définies."
 cm__auto_town_rights_list_i32_name: "@market_charter! [ShowTownRightsName('market_charter')]"
 cm__auto_town_rights_list_i33_name: "@free_town_charter! [ShowTownRightsName('free_town_charter')]"
 cm__auto_town_rights_list_i34_name: "@fortress_town! [ShowTownRightsName('fortress_town')]"
 cm__auto_town_rights_list_i35_name: "@mining_charter! [ShowTownRightsName('mining_charter')]"
 cm__auto_town_rights_list_i36_name: "@studium_privileges! [ShowTownRightsName('studium_privileges')]"
 cm__auto_town_rights_list_i37_name: "@agrarian_community_town_right! [ShowTownRightsName('agrarian_community_town_right')]"
 cm__auto_town_rights_list_i38_name: "@enlightened_leadership_reform_town_right! [ShowTownRightsName('enlightened_leadership_reform_town_right')]"
 cm__expand_metric: "cm__expand_metric"
 cm__town_rights_free_grants_name: "Supprimer les coûts des droits urbains"
 cm__town_rights_free_grants_desc: "Lorsqu'activé, accorder des droits urbains ne coûte aucune puissance gouvernementale et les révoquer ne coûte aucune stabilité."
 cm__town_rights_min_gov_power_name: "Puissance gouvernementale minimale"
 cm__town_rights_min_gov_power_desc: "L'octroi automatique cesse d'accorder des droits urbains lorsque le prochain octroi ferait descendre votre puissance gouvernementale (légitimité, tradition républicaine, dévotion ou unité de la horde, selon le type de gouvernement) en dessous de cette valeur."
 cm__allowed_building_overbuild_levels_format: "[CMMV('cm__allowed_building_overbuild_levels')][Select_CString(GreaterThanOrEqualTo_CFixedPoint(CMMV('cm__allowed_building_overbuild_levels'), CMMMapValue('cmm_max', 'cm__allowed_building_overbuild_levels')), '+', '')]"
 cm__auto_build_capital_name: "Bâtiments de la capitale"
 cm__auto_build_capital_desc: "Construit automatiquement les bâtiments exclusifs à la capitale (cour royale, cour suprême, académie de guerre, etc.) dans le lieu de votre capitale lorsque les conditions le permettent. Ceux-ci sont construits avant la liste ci-dessous."
 cm__urbanize_city_to_megalopolis_name: "Ville vers Mégalopole"
 cm__urbanize_city_to_megalopolis_desc: "Améliorez votre capitale en mégalopole une fois qu'elle est une ville centre de marché avec au moins 400 000 habitants."
 cm__megalopolis_ignore_capital_name: "Mégalopole : ignorer la condition de capitale"
 cm__megalopolis_ignore_capital_desc: "Permet de construire la Mégalopole dans une ville qui n'est pas votre capitale."
 cm__megalopolis_ignore_market_center_name: "Mégalopole : ignorer le prérequis de centre de marché"
 cm__megalopolis_ignore_market_center_desc: "Permet de construire Fonder une mégalopole dans une ville qui n'est pas un centre de marché."
 cm__deurbanize_name: "Désurbaniser"
 cm__deurbanize_desc: "Chaque mois, ramène les localisations possédées au statut de peuplement rural lorsque leur bien d'OEP est coché dans la liste « Ne pas urbaniser » ci-dessous. Votre capitale, les localisations conquises et les localisations fournissant de la Proximité, comme les sièges de gouverneur, sont ignorées."
 cm__auto_urbanize_ignore_list_i20_name: "@wool! [ShowGoodsName('wool')] ([GetGlobalVariable('cm_goods_wool').GetGoods.GetDefaultMarketPrice]@gold!)"
 cm__full_automation_name: "Automatisation complète"
 cm__full_automation__full_automation_name: "Automatisation complète"
 cm__full_automation__full_automation_desc: "Construction automatisée. Chaque mois, les catégories ci-dessous dépensent le trésor dépassant la Réserve d'or pour les meilleures constructions disponibles. Fonctionne parallèlement aux autres fonctionnalités d'automatisation sans modifier leurs paramètres."
 cm__fa_enabled_name: "Activer l'automatisation complète"
 cm__fa_enabled_desc: "Activer ou désactiver l'automatisation complète."
 cm__fa_reserve_name: "Réserve d'or"
 cm__fa_reserve_desc: "L'automatisation complète ne dépensera jamais votre trésor en dessous de ce montant. Indépendant de la Réserve d'or dans l'onglet Paramètres."
 cm__fa_reserve_format: "[CMMV('cm__fa_reserve')]@gold!"
 cm__fa_save_unaffordable_name: "Économiser pour les bâtiments inabordables"
 cm__fa_save_unaffordable_desc: "Une catégorie achète le meilleur bâtiment trouvé même s'il coûte plus que sa part mensuelle, puis cesse d'investir jusqu'à ce que les mois suivants aient compensé la différence. Lorsqu'elle est désactivée, chaque catégorie dépense ce qu'elle peut et transmet le reste aux suivantes."
 cm__full_automation__fa_priority_list_name: "Priorités"
 cm__full_automation__fa_priority_list_desc: "Faites glisser pour réorganiser. Les catégories sont traitées de haut en bas chaque mois. Si deux catégories demandent le même bâtiment, la plus haute le construit."
 cm__fa_priority_list_item_column_name: "Catégorie"
 cm__fa_priority_list_i1_name: "Nourriture"
 cm__fa_priority_list_i1_desc: "Surveille l'approvisionnement alimentaire annuel dans les marchés dont vous possédez le centre et, là où le mois médian est déficitaire, active l'auto-alimentation dans les localisations ayant le plus fort potentiel alimentaire. Les localisations choisies brillent comme celles activées par le joueur, mais vous gardez la main sur l'activation ; elles ne sont jamais désactivées à moins que la localisation ne soit plus un établissement rural vous appartenant ou que vous n'en possédiez plus le centre de marché."
 cm__fa_priority_list_i2_name: "Industrie"
 cm__fa_priority_list_i2_desc: "Construit, étend et améliore les bâtiments de production et les RGO qui remboursent leur coût le plus rapidement en revenus fiscaux. Les localisations utilisant l'auto-alimentation sont ignorées tant qu'un type de travailleur y est déjà en pénurie."
 cm__fa_priority_list_i3_name: "Effondrement des prix"
 cm__fa_priority_list_i3_desc: "Étend la production de matériaux de construction pour faire baisser leurs prix. Fonctionne dans les marchés dont vous possédez le centre de marché. Les localisations les plus productives sont prioritaires et reçoivent plusieurs niveaux à la fois, et les producteurs commencent même là où les travailleurs ne sont pas encore arrivés. Votre capitale, les localisations produisant de la nourriture et les producteurs qui seraient déficitaires sans subvention sont tous ignorés."
 cm__fa_priority_list_i4_name: "Routes"
 cm__fa_priority_list_i4_desc: "Construit le réseau routier le plus rentable selon trois critères : la Proximité, l'Accès au marché et la connexion d'un lieu à votre capitale. Une fois par an, il calcule le meilleur itinéraire vers chaque lieu possédé pour chacun d'eux, puis lance chaque mois les tronçons qui augmenteraient le plus l'Assiette fiscale, en incluant tout ce qui se trouve plus loin sur le tracé. Les corridors plats et peu coûteux sont posés en priorité, et les deux critères inférieurs ne reçoivent de l'or que lors des mois où celui du dessus n'a plus rien à construire."
 cm__fa_priority_list_i5_name: "Services publics"
 cm__fa_priority_list_i5_desc: "Construit l'infrastructure de soutien partout où cela est possible : les bâtiments de capitale, la liste de construction automatique, les patios de mercure, les bâtiments de centre de marché, les baillis et tous les bâtiments uniques de votre pays augmentant le contrôle, les marchés, les bâtiments de résistance aux maladies, et enfin les greniers. Les bâtiments de contrôle sont placés en priorité dans les localisations les plus riches, et les marchés dans les localisations ayant le moins d'accès au marché."
 cm__fa_priority_list_i6_name: "Nettoyage des bâtiments"
 cm__fa_priority_list_i6_desc: "Une fois par an, ferme les bâtiments de production qui ne sont plus rentables et ne sont pas subventionnés, et les détruit à la place lorsque la localisation se trouve à moins de dix niveaux des niveaux de bâtiment qu'elle soutient. Les bâtiments fermés rouvrent dès que ce type est à nouveau rentable sur ce marché, et sont détruits plus tard si leur localisation manque de place. @farming_village! [ShowBuildingTypeNameWithNoTooltip('farming_village')] n'est jamais fermé ni détruit."
 cm__fa_priority_list_i7_name: "Gouverneurs"
 cm__fa_priority_list_i7_desc: "Détermine l'emplacement idéal de vos gouverneurs et les y installe, en privilégiant les meilleurs emplacements. La planification est relancée dès qu'un poste de gouverneur se libère, ou tous les vingt-cinq ans. Solo uniquement."
 cm__fa_priority_list_i8_name: "Droits urbains"
 cm__fa_priority_list_i8_desc: "Accorde des droits urbains dans l'ensemble de vos bourgs et cités. [ShowTownRightsNameWithNoTooltip('granary_town')] vient en premier, puis un droit de spécialisation tiré au hasard parmi ceux qui correspondent aux biens produits aux alentours de la localisation."
 cm__fa_priority_list__budget_name: "Part du budget"
 cm__fa_priority_list__budget_desc: "La part du trésor dépassant la Réserve d'or que cette catégorie peut dépenser chaque mois."
 cm__fa_priority_list__budget_postfix: "%"
 cm__fa_priority_list__enabled_name: "Activé"
 cm__fa_priority_list__enabled_desc: "Autoriser la construction de cette catégorie."
 cm__full_automation__fa_industry_name: "Industrie"
 cm__full_automation__fa_industry_desc: "Paramètres pour la catégorie Industrie ci-dessus."
 cm__fa_industry_algorithm_name: "Stratégie de construction"
 cm__fa_industry_algorithm_desc: "Comment l'industrie choisit quoi construire."
 cm__fa_industry_algorithm_option_1_name: "Cupide"
 cm__fa_industry_algorithm_option_1_desc: "Construire en priorité les options au retour sur investissement le plus rapide, et seulement celles proches du meilleur lieu trouvé pour produire les mêmes biens."
 cm__fa_industry_max_rel_roi_name: "ROI relatif maximum"
 cm__fa_industry_max_rel_roi_desc: "Indique de combien un bâtiment ou une amélioration peut être plus lent à rentabiliser son coût par rapport au meilleur endroit trouvé pour produire les mêmes biens tout en restant éligible à la construction. À 30 %, si le meilleur se rentabilise en 10 ans, seuls ceux se rentabilisant sous 13 ans sont construits ; tout ce qui est plus lent attend. À 0 %, seul le meilleur producteur de chaque bien est construit chaque mois. À 100 %+, il n'y a plus de limite et seules les Années de rentabilité max. s'appliquent. Tous les bâtiments produisant les mêmes biens sont évalués ensemble, quel que soit leur type. Les expansions de RGO sont toujours construites par ordre de rentabilité."
 cm__fa_industry_max_rel_roi_format: "[CMMV('cm__fa_industry_max_rel_roi')]%[Select_CString(GreaterThanOrEqualTo_CFixedPoint(CMMV('cm__fa_industry_max_rel_roi'), CMMMapValue('cmm_max', 'cm__fa_industry_max_rel_roi')), '+', '')]"
 cm__fa_industry_min_roi_name: "Années d'amortissement max."
 cm__fa_industry_min_roi_desc: "Seules les constructions dont les revenus fiscaux remboursent le coût de construction en ce nombre d'années sont prises en compte. Réglez sur 0 pour désactiver cette vérification."
 cm__fa_industry_min_roi_format: "[CMMV('cm__fa_industry_min_roi')]a @efficiency!"
 cm__full_automation__fa_collapsar_name: "Collapsar de prix"
 cm__full_automation__fa_collapsar_desc: "Paramètres pour la catégorie Effondrement des prix ci-dessus. Les matériaux sont traités du haut de la liste vers le bas, les RGO étant étendus avant les bâtiments de production."
 cm__fa_collapsar_target_name: "Prix cible"
 cm__fa_collapsar_target_desc: "Le prix auquel la construction pour un matériau s'arrête, par rapport à son prix de base. À -33 %, les producteurs sont construits jusqu'à ce que le matériau se négocie 33 % en dessous du prix de base. À 0 %, jusqu'à ce qu'il atteigne le prix de base. À +33 %, seulement tant qu'il coûte plus de 33 % au-dessus du prix de base."
 cm__fa_collapsar_target_format: "[CMMV('cm__fa_collapsar_target')]%"
 cm__fa_collapsar_item_column_name: "Matériau"
 cm__fa_collapsar_i1_name: "@masonry! [ShowGoodsName('masonry')]"
 cm__fa_collapsar_i2_name: "@lumber! [ShowGoodsName('lumber')]"
 cm__fa_collapsar_i3_name: "@sand! [ShowGoodsName('sand')]"
 cm__fa_collapsar_i4_name: "@glass! [ShowGoodsName('glass')]"
 cm__fa_collapsar__enabled_name: "Activé"
 cm__fa_collapsar__enabled_desc: "S'efforcer de réduire le prix de ce matériau."
 cm__full_automation__fa_food_name: "Nourriture"
 cm__full_automation__fa_food_desc: "Paramètres pour la catégorie Nourriture ci-dessus."
 cm__fa_food_target_name: "Cible de surplus"
 cm__fa_food_target_desc: "Un marché obtient plus de lieux de production alimentaire jusqu'à ce que son offre atteigne cette part de sa demande. À 125 %, la nourriture est étendue dans tout marché dont le mois médian de l'année n'a pas atteint un surplus de 25 %. Augmentez cette valeur pour maintenir une plus grande marge de sécurité, diminuez-la pour n'aider que les marchés proches d'une pénurie."
 cm__fa_food_target_format: "[CMMV('cm__fa_food_target')]%"
 cm__fa_food_min_potential_name: "Potentiel alimentaire minimum"
 cm__fa_food_min_potential_desc: "L'auto-production de nourriture n'est activée que pour les localisations dont le potentiel alimentaire par niveau de RGO atteint ce score, le même score que celui affiché par le mode de carte $mapmode_cm_location_food_potential_name$. Augmentez-le pour privilégier les meilleures terres agricoles, ou diminuez-le pour accepter des terres moins fertiles."
 cm__fa_food_min_potential_format: "[CMMV('cm__fa_food_min_potential')]"
 cm__full_automation__fa_urban_rights_name: "Droits urbains"
 cm__full_automation__fa_urban_rights_desc: "Paramètres pour la catégorie Droits urbains ci-dessus."
 cm__fa_urban_rights_window_name: "Seuil d'adéquation"
 cm__fa_urban_rights_window_desc: "Détermine à quel point un droit de spécialisation doit être adapté à un lieu, par rapport au droit le mieux adapté, pour pouvoir être sélectionné. À 50 %, tout droit qui convient au moins à moitié peut être tiré au sort, et les mieux adaptés sont tirés plus souvent. À 100 %, seul le droit le mieux adapté est accordé."
 cm__fa_urban_rights_window_format: "[CMMV('cm__fa_urban_rights_window')]%"
 cm__fa_urban_rights_reserve_name: "Réserve de puissance gouvernementale"
 cm__fa_urban_rights_reserve_desc: "Aucun droit urbain n'est accordé si le paiement fait chuter votre puissance gouvernementale (légitimité, tradition républicaine, dévotion ou unité de la horde, selon le type de gouvernement) en dessous de cette valeur."
 cm__fa_urban_rights_expand_name: "Étendre les industries stimulées"
 cm__fa_urban_rights_expand_desc: "Lorsqu'un droit de spécialisation est accordé, active également l'extension automatique dans ce lieu pour les industries que le droit améliore, ainsi que pour ses matières premières là où le lieu en produit. Équivalent à un clic droit sur un bouton d'octroi sur la carte des Droits urbains recommandés."
 cm__full_automation__fa_cleanup_name: "Nettoyage des bâtiments"
 cm__full_automation__fa_cleanup_desc: "Paramètres pour la catégorie Nettoyage des bâtiments ci-dessus."
 cm__fa_cleanup_min_profit_name: "Profit minimum"
 cm__fa_cleanup_min_profit_desc: "Un bâtiment rapportant moins que ce montant chaque mois est considéré comme non rentable et sera fermé ou détruit, à moins d'être subventionné. Au plus, la moitié des bâtiments ouverts d'un type donné dans un marché sont fermés en même temps."
 cm__fa_cleanup_min_profit_format: "[Divide_CFixedPoint(CMMV('cm__fa_cleanup_min_profit'), '(CFixedPoint)100')|2]@gold!"
 cm__fa_cleanup_core_goods_name: "Prioriser les matériaux de construction"
 cm__fa_cleanup_core_goods_desc: "Maintenir les bâtiments qui consomment principalement @masonry![ShowGoodsNameWithNoTooltip('masonry')], @lumber![ShowGoodsNameWithNoTooltip('lumber')], @sand![ShowGoodsNameWithNoTooltip('sand')] ou @glass![ShowGoodsNameWithNoTooltip('glass')] au double du Profit Minimum, ou à 0,1@gold!, selon la valeur la plus élevée. Les bâtiments produisant l'un des quatre sont évalués sur la base du Profit Minimum normal."
 cm__fa_cleanup_auto_food_name: "Effacer les lieux de nourriture automatique"
 cm__fa_cleanup_auto_food_desc: "Lorsque la gestion automatique de la nourriture est active et qu'un type de travailleur est déjà en pénurie, détruisez les bâtiments de production qui ne produisent pas de nourriture. Un @market_village! [ShowBuildingTypeNameWithNoTooltip('market_village')] est réduit à un seul niveau plutôt que d'être détruit."
 cm__full_automation__fa_roads_name: "Routes"
 cm__full_automation__fa_roads_desc: "Paramètres pour la catégorie Routes ci-dessus."
 cm__fa_roads_proximity_name: "Proximité"
 cm__fa_roads_proximity_desc: "Posez les tronçons de route augmentant le plus la Proximité par rapport à l'or, en comptant chaque lieu situé plus loin sur l'itinéraire derrière eux."
 cm__fa_roads_market_access_name: "Accès au marché"
 cm__fa_roads_market_access_desc: "Pose les tronçons de route augmentant le plus l'Accès au marché pour l'or investi. Ne dépense que lors des mois où il n'y a plus de tronçons de Proximité à poser."
 cm__fa_roads_capital_name: "Connexion à la capitale"
 cm__fa_roads_capital_desc: "Construisez des tronçons de route pour relier vos localisations à votre capitale, en progressant vers l'extérieur à partir de celles déjà connectées. Ne dépense au cours d'un mois que lorsque les tronçons de Proximité et d'Accès au Marché n'en ont plus à poser."
 cm__full_automation__fa_governors_name: "Gouverneurs"
 cm__full_automation__fa_governors_desc: "Paramètres pour la catégorie Gouverneurs ci-dessus."
 cm__fa_gov_move_seats_name: "Autoriser le déplacement des gouverneurs"
 cm__fa_gov_move_seats_desc: "Lorsque tous les emplacements de gouverneur sont occupés, retire un gouverneur pour en placer un à un meilleur endroit. Ce nouvel emplacement doit déjà être une Cité ou avoir un score supérieur de plus de 10 % à celui qu'il remplace. Si cette option est désactivée, les gouverneurs ne sont placés que dans les emplacements vides."
 cm__fa_gov_prepare_sites_name: "Autoriser la préparation de nouvelles localisations"
 cm__fa_gov_prepare_sites_desc: "Prend en compte les localisations ne pouvant pas encore accueillir de gouverneur et les prépare en priorité, en y fondant un bourg ou une cité et en construisant une route vers votre capitale. Si désactivé, seules les localisations étant déjà une cité avec une route vers votre capitale sont prises en compte."
 cm__map_modes_name: "Modes de carte"
 cm__map_modes__placement_finder_name: "Emplacement recommandé pour la capitale et le gouverneur"
 cm__map_modes__placement_finder_desc: "Paramètres des modes de carte de placement du gouverneur recommandé et de la capitale recommandée."
 cm__placement_finder_method_name: "Score du chercheur d'emplacement"
 cm__placement_finder_method_desc: "Comment les modes de carte Gouverneur recommandé et Capitale recommandée classent vos localisations."
 cm__placement_finder_method_option_1_name: "Assiette fiscale"
 cm__placement_finder_method_option_1_desc: "Classer selon l'augmentation de l'assiette fiscale totale qu'un gouverneur ou une capitale y apporterait. Les localisations les plus riches comptent davantage."
 cm__placement_finder_method_option_2_name: "Proximité"
 cm__placement_finder_method_option_2_desc: "Classer par le gain de proximité qu'un gouverneur ou une capitale placé là ajouterait."
 cm__placement_finder_roads_name: "Infrastructures terrestres"
 cm__placement_finder_roads_desc: "Détermine si les modes de carte Gouverneur recommandé et Capitale recommandée supposent une infrastructure terrestre idéale ou utilisent ce que vous avez réellement construit."
 cm__placement_finder_roads_option_1_name: "Actuel"
 cm__placement_finder_roads_option_1_desc: "Utilisez les routes que vous avez effectivement construites."
 cm__placement_finder_roads_option_2_name: "Routes maximum"
 cm__placement_finder_roads_option_2_desc: "Considère que la meilleure route débloquée est construite sur chaque connexion."
 cm__placement_finder_roads_option_3_name: "Meilleur possible"
 cm__placement_finder_roads_option_3_desc: "Considère que la meilleure route que vous avez débloquée est construite sur chaque liaison et que chaque bâtiment débloqué améliorant la proximité terrestre est construit partout où il est éligible."
 cm__placement_finder_naval_name: "Infrastructure navale"
 cm__placement_finder_naval_desc: "Détermine si les modes de carte Gouverneur recommandé et Capitale recommandée supposent une infrastructure navale idéale ou utilisent votre capacité portuaire et votre présence navale actuelles."
 cm__placement_finder_naval_option_1_name: "Actuel"
 cm__placement_finder_naval_option_1_desc: "Utilise votre capacité portuaire actuelle et votre présence navale."
 cm__placement_finder_naval_option_2_name: "Présence maximale"
 cm__placement_finder_naval_option_2_desc: "Supposer une présence navale totale partout, avec votre capacité portuaire actuelle."
 cm__placement_finder_naval_option_3_name: "Meilleur possible"
 cm__placement_finder_naval_option_3_desc: "Suppose une présence navale totale et les meilleurs bâtiments portuaires débloqués, construits dans chaque lieu côtier."
 cm__placement_finder_accuracy_name: "Précision de recherche"
 cm__placement_finder_accuracy_desc: "Détermine la minutie avec laquelle les modes de carte Gouverneur recommandé et Capitale recommandée recherchent les meilleurs emplacements. Les emplacements ignorés s'affichent en noir."
 cm__placement_finder_accuracy_option_1_name: "Exhaustif"
 cm__placement_finder_accuracy_option_1_desc: "Évaluer chaque lieu. Le plus précis et le plus lent."
 cm__placement_finder_accuracy_option_2_name: "Exhaustif"
 cm__placement_finder_accuracy_option_2_desc: "Ignore les lieux qui ne peuvent pas se classer parmi votre top trois. Le top trois et leurs scores sont identiques à Exhaustif, mais en plus rapide."
 cm__placement_finder_accuracy_option_3_name: "Équilibré"
 cm__placement_finder_accuracy_option_3_desc: "Ignorer les localisations qui ne peuvent pas être le meilleur choix unique. Le meilleur emplacement reste garanti exact ; les 2e et 3e marqueurs peuvent occasionnellement différer."
 cm__placement_finder_accuracy_option_4_name: "Rapide"
 cm__placement_finder_accuracy_option_4_desc: "Ignore également les lieux très peu susceptibles d'être les meilleurs. Le meilleur lieu trouvé se situe à moins de 20 % du meilleur choix réel et reste généralement exact."
 cm__placement_finder_accuracy_option_5_name: "Le plus rapide"
 cm__placement_finder_accuracy_option_5_desc: "Évalue l'emplacement le plus prometteur de chaque province, puis affine autour des meilleurs. Bien plus rapide pour les grands pays ; peut manquer le meilleur emplacement."
 cm__debug_name: "Débogage"
 cm__debug__logging_name: "Journal d'actions"
 cm__debug__logging_desc: "Quelles actions de ce mod sont consignées dans le journal d'actions du mod."
 cm__log_cycle_name: "Cycle de construction"
 cm__log_cycle_desc: "Lignes pour un cycle mensuel ignoré car le précédent était encore en cours, et pour la réinitialisation suivant deux sauts consécutifs."
 cm__log_industry_name: "Industrie"
 cm__log_industry_desc: "Lignes pour chaque bâtiment mis en file d'attente par la catégorie Industrie et pour chaque expansion de matières premières qu'elle envisage, avec le retour sur investissement et le revenu de chacun."
 cm__log_collapsar_name: "Collapsar des prix"
 cm__log_collapsar_desc: "Lignes suivant une localisation à travers un cycle de Price Collapsar : la pénurie du marché et les niveaux demandés, puis ce qui a été donné à cette localisation, son score et ce qui a été construit. Marquez d'abord la localisation avec l'effet de commande de console location:<key> = { cm_fa_col_watch_on = yes }."
 cm__log_food_name: "Auto-Nourriture"
 cm__log_food_desc: "Lignes pour la catégorie Alimentation : l'offre, la demande et le ratio mensuels de nourriture de chaque marché, la médiane annuelle par rapport à laquelle ce ratio est évalué vis-à-vis de la cible, le nombre de lieux y produisant déjà de la nourriture, et chaque lieu qu'il active ou désactive."
 cm__log_roads_name: "Routes"
 cm__log_roads_desc: "Une ligne pour chaque route commandée par la catégorie Routes, indiquant le lieu, la raison de l'achat parmi les trois possibles, et son coût."
 cm__log_cleanup_name: "Nettoyage des bâtiments"
 cm__log_cleanup_desc: "Lignes pour le cycle annuel de nettoyage des bâtiments et pour chaque bâtiment qu'il ferme, réduit, détruit ou rouvre, avec le profit de chacun et le seuil par rapport auquel il a été jugé."
 cm__log_governors_name: "Gouverneurs"
 cm__log_governors_desc: "Lignes pour le plan du gouverneur : sites choisis et abandonnés, améliorations de bourgs et de villes, placements, relocalisations et refus, ainsi que le déplacement de la capitale d'une nation chanceuse."
 cm__log_military_name: "Militaire de nation chanceuse"
 cm__log_military_desc: "Lignes pour une nation chanceuse détruisant des forts et construisant des bâtiments de réserve militaire."
 cm__log_government_name: "Gouvernement de nation chanceuse"
 cm__log_government_desc: "Lignes pour une nation chanceuse supprimant une bureaucratie ou effectuant une action d'ordre."
 cm__debug__diagnostics_name: "Diagnostics"
 cm__placement_finder_debug_path_name: "Activer les diagnostics de débogage"
 cm__placement_finder_debug_path_desc: "Ajoute un bloc de diagnostic aux infobulles des modes de carte Gouverneur recommandé et Capitale recommandée : l'itinéraire prédit depuis votre capitale vers chaque lieu avec le coût de chaque saut, ainsi que la proximité prédite comparée à votre proximité réelle."
 cm__debug__probes_name: "Sondes"
 cm__debug__probes_desc: "Diagnostics ponctuels inscrits dans le journal d'actions du mod."
 cm__probe_budget_name: "Budget d'automatisation totale"
 cm__probe_budget_desc: "Le solde de chaque catégorie d'automatisation complète, positif lorsqu'il met de l'or de côté pour un choix qu'il ne peut pas encore s'offrir et négatif lorsqu'il est débiteur en raison de dépenses excessives, avec la limite de rentabilité de l'industrie et le meilleur candidat en attente dans un marché ignoré lors de ce cycle."
 cm__probe_budget_text: "Lancer"
 cm__probe_governors_name: "Plan du gouverneur"
 cm__probe_governors_desc: "L'état d'avancement du plan du gouverneur : sa phase, le nombre de sites qu'il gère et qu'il lui reste à placer, s'il retient le trésor, les gouverneurs payés, ainsi que les emplacements et les sièges pris en compte."
 cm__probe_governors_text: "Lancer"
 cm__probe_military_name: "Militaire de nation chanceuse"
 cm__probe_military_desc: "Le niveau de bâtiment d'effectifs du pays, s'il peut être construit, l'état de la paire avec la capitale, le budget militaire, et le nombre de lieux pouvant accueillir ce niveau par rapport à ceux le possédant déjà."
 cm__probe_military_text: "Lancer"
 cm__probe_industry_anchors_name: "Ancres industrielles"
 cm__probe_industry_anchors_desc: "Une ligne par bien avec le meilleur retour sur investissement enregistré par l'Industrie et la limite de retour fixée, indiquant le bâtiment et le lieu pour chacun."
 cm__probe_industry_anchors_text: "Lancer"
 cm__probe_industry_rgo_name: "Matières premières industrielles"
 cm__probe_industry_rgo_desc: "Une ligne pour chaque raison pour laquelle l'industrie a ignoré les matières premières d'un lieu, ou une seule ligne si aucune n'a été ignorée. Lit la capitale à moins de marquer un lieu avec l'effet de commande de console effect location:<key> = { cm_fa_col_watch_on = yes }."
 cm__probe_industry_rgo_text: "Exécuter"
 cm__probe_collapsar_name: "Effondrement des prix"
 cm__probe_collapsar_desc: "Chaque nombre que le Price Collapsar lit dans une localisation, affiché à côté de la lecture propre au jeu, suivi de ce que le marché de cette localisation pourrait absorber en un cycle. Lit la capitale, à moins que vous ne marquiez une localisation avec la commande de console effect location:<key> = { cm_fa_col_watch_on = yes } ; la capitale n'est jamais une candidate pour le Price Collapsar, marquez donc une localisation pour en lire une où il construirait."
 cm__probe_collapsar_text: "Lancer"
 cm__probe_roads_name: "Routes"
 cm__probe_roads_desc: "Nombre de corridors que contient le plan routier pour la proximité, l'accès au marché et la connexion à la capitale, combien parmi ceux de la capitale peuvent déjà être lancés, combien de routes sont déjà en cours de construction, et ce qu'il reste dans la réserve de la catégorie."
 cm__probe_roads_text: "Lancer"
 cm__probe_log_gate_name: "Filtre du journal d'actions"
 cm__probe_log_gate_desc: "La catégorie de journal Price Collapsar deux fois, telle que lue par le filtre de journal et telle que stockée par le menu, afin qu'une catégorie activée dans l'un et désactivée dans l'autre s'affiche."
 cm__probe_log_gate_text: "Lancer"
