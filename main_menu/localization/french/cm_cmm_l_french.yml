l_french:
 # Mod
 cm_name: "Gestionnaire de construction"
 cm_desc: "Un mod majeur d'amélioration du confort de jeu qui ajoute de nouveaux automatismes, des filtres et des modes de carte, afin d'améliorer considérablement l'expérience de construction dans EU5."

 # Settings (settings) Tab
 ## Global Control (settings) Group
 cm__pause_auto_expand_name: "Mettre l'automatisation en pause"
 cm__pause_auto_expand_desc: "Suspend toutes les fonctionnalités d'automatisation ajoutées par ce mod."
 cm__minimum_gold_name: "Réserve d'or"
 cm__minimum_gold_desc: "Aucune automatisation ne dépensera votre trésor en dessous de ce montant."
 cm__minimum_gold_format: "[CMMV('cm__minimum_gold')]@gold!"
 cm__allowed_building_overbuild_levels_name: "Limite de surconstruction"
 cm__allowed_building_overbuild_levels_desc: "Nombre total de niveaux de bâtiment dont une localisation peut dépasser son plafond de Niveaux de bâtiments soutenus avant que de nouvelles constructions ne cessent d'y être mises en file d'attente. La nourriture, les gouverneurs et les bâtiments dans les localisations d'autres pays sont exemptés. À zéro, aucun dépassement n'est autorisé. À 200+, il n'y a pas de limite."

 ## Priority List Group
 cm__priority_list_item_column_name: "Fonctionnalité"
 cm__priority_list_i1_name: "Bâtiments avec expansion automatique activée"
 cm__priority_list_i1_desc: "Étend automatiquement les bâtiments de production et de non-production à plusieurs niveaux lorsqu'ils sont rentables, que la population est disponible et que l'or reste au-dessus de votre réserve d'or. S'applique là où l'auto-agrandissement est activé pour un lieu ou pour un type de bâtiment entier, y compris pour les bâtiments étrangers dans les lieux d'autres pays."
 cm__priority_list_i2_name: "RGO avec expansion automatique activée"
 cm__priority_list_i2_desc: "Étend automatiquement les niveaux de RGO dans les lieux où l'auto-expansion des RGO est activée, lorsque la main-d'œuvre est disponible et que les ressources le permettent."
 cm__priority_list_i3_name: "Extension automatique de la nourriture dans les localisations activées"
 cm__priority_list_i3_desc: "Construit automatiquement les ORE et les bâtiments de production de nourriture dans les localisations rurales pour lesquelles vous activez l'auto-nourriture, en choisissant l'option la plus efficace en termes de production alimentaire."
 cm__priority_list_i4_name: "Améliorer automatiquement tous les bâtiments"
 cm__priority_list_i4_desc: "Améliore automatiquement chaque bâtiment devenu obsolète, que l'auto-expansion soit activée ou non pour ce bâtiment."
 cm__priority_list__enabled_name: "$cm_txt_enabled$"
 cm__priority_list__enabled_desc: "Activer ou désactiver cette fonctionnalité."
 cm__priority_list__min_profit_name: "Revenu fiscal minimum"
 cm__priority_list__min_profit_desc: "Or mensuel minimum par niveau requis avant la mise en file d'attente de la construction. Réglez sur 0 pour désactiver la vérification."
 cm__priority_list__min_profit_postfix: "@gold!"
 cm__priority_list__min_discount_name: "$cm_txt_min_discount$"
 cm__priority_list__min_discount_desc: "$cm_txt_min_discount_desc$"
 cm__priority_list__min_discount_postfix: "%"
 cm__priority_list__min_discount_prefix_high: "#R "
 cm__priority_list__min_discount_postfix_high: "%#!"
 cm__priority_list__min_discount_prefix_low: "#G "
 cm__priority_list__min_discount_postfix_low: "%#!"

