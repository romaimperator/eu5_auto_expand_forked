 cm__auto_expand__priority_list_name: "Automatisation de la construction"
 cm__auto_expand__priority_list_desc: "Faites glisser pour réorganiser la priorité des fonctionnalités. Chaque mois, les fonctionnalités activées s'exécutent de haut en bas."
