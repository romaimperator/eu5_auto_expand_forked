l_french:
 # Mod
 cm_name: "Gestionnaire de construction"
 cm_desc: "Un mod massif de confort de jeu qui ajoute de nouvelles automatisations, des filtres et des modes de carte afin d'améliorer considérablement l'expérience de construction d'EU5."

 # Settings (settings) Tab
 cm__settings_name: "Paramètres"
 ## Global Control (settings) Group
 cm__pause_auto_expand_name: "Mettre l'automatisation en pause"
 cm__pause_auto_expand_desc: "Met en pause toutes les fonctionnalités d'automatisation : l'auto-expansion des bâtiments, l'auto-expansion des RGO, l'amélioration de tous les bâtiments, l'auto-construction, l'auto-construction des bâtiments de la capitale, la gestion automatique de la nourriture, l'auto-urbanisation, l'octroi automatique des droits urbains et l'automatisation complète."
 cm__minimum_gold_name: "Réserve d'or"
 cm__minimum_gold_desc: "La réserve d'or minimale à conserver. S'applique à toutes les fonctionnalités d'automatisation, sauf l'Automatisation complète."
 cm__minimum_gold_format: "[CMMV('cm__minimum_gold')]@gold!"
 cm__allowed_building_overbuild_levels_name: "Limite de surconstruction"
 cm__allowed_building_overbuild_levels_desc: "Nombre total de niveaux de bâtiment dont une localisation peut dépasser son plafond de Niveaux de bâtiments supportés avant que l'auto-expansion ne cesse de mettre en file d'attente de nouvelles constructions. À zéro, aucun dépassement n'est autorisé. À 200+, il n'y a pas de limite."

 ## Priority List Group
 cm__settings__priority_list_name: "Automatisation de la construction"
 cm__settings__priority_list_desc: "Faites glisser pour réorganiser la priorité des fonctionnalités. Chaque mois, les fonctionnalités activées s'exécutent de haut en bas, sauf Auto-Urbanize, qui s'exécute toujours en dernier, après toutes les autres fonctionnalités et après l'Automatisation complète."
 cm__priority_list_item_column_name: "Fonctionnalité"
 cm__priority_list_i1_name: "Extension automatique des bâtiments"
 cm__priority_list_i1_desc: "Étend automatiquement les bâtiments de production et de non-production à plusieurs niveaux lorsqu'ils sont rentables, que la population est disponible et que l'or reste au-dessus de votre réserve d'or. S'applique là où l'auto-agrandissement est activé pour un lieu ou pour un type de bâtiment entier, y compris pour les bâtiments étrangers dans les lieux d'autres pays."
 cm__priority_list_i2_name: "Extension automatique des RGO"
 cm__priority_list_i2_desc: "Étend automatiquement les niveaux de RGO dans les lieux où l'auto-expansion des RGO est activée, lorsque la main-d'œuvre est disponible et que les ressources le permettent."
 cm__priority_list_i3_name: "Construction automatique"
 cm__priority_list_i3_desc: "Construit automatiquement les bâtiments de capitale et les bâtiments limités à un par localisation (conseils, bibliothèques, etc.) selon l'ordre et les paramètres configurés dans l'onglet Construction automatique."
 cm__priority_list_i4_name: "Auto-Nourriture"
 cm__priority_list_i4_desc: "Construit automatiquement des RGO et des bâtiments produisant de la nourriture dans les localisations rurales, en choisissant l'option la plus efficace en termes de nourriture. Configuré dans l'onglet Auto-Nourriture."
 cm__priority_list_i5_name: "Auto-urbaniser"
 cm__priority_list_i5_desc: "Améliore le rang des localisations chaque mois : des peuplements ruraux en bourgs, des bourgs en cités et des cités en mégalopoles. Ignore les localisations conquises. Configuré dans l'onglet Auto-urbanisation."
 cm__priority_list_i6_name: "Améliorer automatiquement tous les bâtiments"
 cm__priority_list_i6_desc: "Améliore automatiquement chaque bâtiment devenu obsolète, que l'extension automatique soit activée ou non pour ce bâtiment."
 cm__priority_list__enabled_name: "Activé"
 cm__priority_list__enabled_desc: "Activer ou désactiver cette fonctionnalité."
 cm__priority_list__min_profit_name: "Revenu fiscal minimum"
 cm__priority_list__min_profit_desc: "Or mensuel minimum par niveau requis avant la mise en file d'attente de la construction. Réglez sur 0 pour désactiver la vérification."
 cm__priority_list__min_profit_postfix: "@gold!"
 cm__priority_list__min_discount_name: "Réduction min."
 cm__priority_list__min_discount_desc: "Majoration maximale autorisée pour le prix des matériaux de construction. À -33 %, ne construit que lorsque les matériaux coûtent 33 % de moins que le prix de base. À 0 %, seulement au prix de base ou en dessous. À +33 %, construit même lorsque les prix sont 33 % au-dessus du prix de base."
 cm__priority_list__min_discount_postfix: "%"
 cm__priority_list__min_discount_prefix_high: "#R "
 cm__priority_list__min_discount_postfix_high: "%#!"
 cm__priority_list__min_discount_prefix_low: "#G "
 cm__priority_list__min_discount_postfix_low: "%#!"

