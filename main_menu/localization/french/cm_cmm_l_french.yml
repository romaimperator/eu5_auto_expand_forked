 cm__urbanize_town_to_city_desc: "Promouvoir les bourgs éligibles en cités chaque mois."
 cm__urbanize_rural_to_town_name: "Rural vers Ville"
 cm__urbanize_rural_to_town_desc: "Promouvoir chaque mois les établissements ruraux éligibles en villes. Nécessite 30 000 pops (éligibilité immédiate au statut de ville) ou d'être à moins de 1 000 du plafond de population (sinon la croissance stagnerait au plafond rural). Les lieux dont le RGO est coché dans la liste d'exclusion ci-dessous sont ignorés. Les lieux couverts par l'Auto-alimentation de masse sont également ignorés, afin qu'ils restent ruraux et continuent de produire de la nourriture."
