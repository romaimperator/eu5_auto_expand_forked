 cm__expand_metric_name: "Métrique d'auto-expansion"
 cm__expand_metric_desc: "Choisissez le critère utilisé par l'auto-expansion pour décider d'ajouter un niveau de bâtiment ou d'EGR. Les Revenus fiscaux et le Profit définissent un montant d'or mensuel minimum par niveau ; les options de RSI définissent un nombre maximum d'années pour amortir le coût de construction."
