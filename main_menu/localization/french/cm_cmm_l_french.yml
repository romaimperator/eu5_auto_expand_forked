 cm__dbg_run_auto_build_name: "Lancer la construction automatique"
 cm__dbg_run_auto_build_desc: "Parcourt désormais chaque catégorie activée de la liste au lieu d'attendre le passage au mois suivant. Chacune dépense ce qu'il reste de sa part, ainsi une catégorie ayant déjà dépensé son allocation pour le mois ne construit rien. L'option « Mettre l'automatisation en pause » ne l'en empêche pas."
 cm__dbg_run_auto_build_text: "$cm_txt_run_now$" # NO-TRANSLATE
 cm__ab_custom__ab_custom_name: "$cm__ab_custom_name$" # NO-TRANSLATE
 cm__ab_custom__ab_custom_desc: "Les ensembles sont traités de haut en bas chaque mois, de sorte que ceux situés le plus haut utilisent l'or en premier."
 cm__ab_custom_item_column_name: "Bâtiments"
 cm__ab_custom_i1_name: "Bâtiments de la capitale"
 cm__ab_custom_i1_desc: "Construisez les bâtiments exclusifs à la capitale dans votre capitale : la cour royale, la cour suprême, l'académie militaire et le reste. Ils sont construits avant tout autre élément de cette catégorie."
 cm__ab_custom_i2_name: "Bâtiments de contrôle"
 cm__ab_custom_i2_desc: "Construit des baillis là où les matières premières se vendent le mieux, ainsi que tous les bâtiments uniques de votre pays augmentant le Contrôle dans les lieux les plus riches. Un lieu reçoit tous les bâtiments uniques qu'il peut accueillir avant que le lieu suivant ne soit traité."
 cm__ab_custom_i3_name: "Bâtiments de centre de marché"
 cm__ab_custom_i3_desc: "Construit les bâtiments rentables dans un centre de marché, pour chaque centre de marché que vous possédez."
 cm__ab_custom_i4_name: "Sélectionner les bâtiments"
 cm__ab_custom_i4_desc: "Construire les bâtiments listés ci-dessous."
 cm__ab_custom__enabled_name: "$cm_txt_enabled$" # NO-TRANSLATE
 cm__ab_custom__enabled_desc: "Construire cet ensemble."
 cm__ab_custom__auto_build_list_name: "$cm__ab_custom_i4_name$" # NO-TRANSLATE
 cm__ab_custom__auto_build_list_desc: "Faire glisser pour réorganiser. Les bâtiments sont traités de haut en bas chaque mois, ceux situés le plus haut utilisent donc l'or en premier."
 cm__auto_build_list_i22_name: "@lazaretto! [ShowBuildingTypeName('lazaretto')]" # NO-TRANSLATE
 cm__auto_build_list_i23_name: "@hospital! [ShowBuildingTypeName('hospital')]" # NO-TRANSLATE
 cm__auto_build_list_i24_name: "@granary! [ShowBuildingTypeName('granary')]" # NO-TRANSLATE
 cm__ab_custom__debug_name: "$cm_txt_debug$" # NO-TRANSLATE
 cm__dbg_run_custom_name: "Lancer personnalisé"
 cm__dbg_run_custom_desc: "$cm_txt_dbg_run_category_desc$" # NO-TRANSLATE
 cm__dbg_run_custom_text: "$cm_txt_run_now$" # NO-TRANSLATE
 cm__ab_core__ab_core_name: "$cm__ab_core_name$" # NO-TRANSLATE
 cm__ab_core__ab_core_desc: "Paramètres pour les biens de base. Les matériaux sont traités de haut en bas de la liste, les RGO étant étendus avant les bâtiments de production."
 cm__ab_core_target_name: "Prix cible"
 cm__ab_core_target_desc: "Le prix auquel la construction d'un matériau s'arrête, par rapport à son prix de base. À -33 %, les producteurs sont construits jusqu'à ce que le matériau se négocie à 33 % sous son prix de base. À 0 %, jusqu'à ce qu'il atteigne son prix de base. À +33 %, seulement tant qu'il coûte plus de 33 % au-dessus de son prix de base."
 cm__ab_core_target_format: "[CMMV('cm__ab_core_target')]%" # NO-TRANSLATE
 cm__ab_core_item_column_name: "Matériau"
 cm__ab_core_i1_name: "@masonry! [ShowGoodsName('masonry')]" # NO-TRANSLATE
 cm__ab_core_i2_name: "@lumber! [ShowGoodsName('lumber')]" # NO-TRANSLATE
 cm__ab_core_i3_name: "@sand! [ShowGoodsName('sand')]" # NO-TRANSLATE
 cm__ab_core_i4_name: "@glass! [ShowGoodsName('glass')]" # NO-TRANSLATE
 cm__ab_core__enabled_name: "$cm_txt_enabled$" # NO-TRANSLATE
 cm__ab_core__enabled_desc: "Travailler à réduire le prix de ce matériau."
 cm__ab_core__debug_name: "$cm_txt_debug$" # NO-TRANSLATE
 cm__dbg_run_core_name: "Lancer les biens de base"
 cm__dbg_run_core_desc: "$cm_txt_dbg_run_category_desc$" # NO-TRANSLATE
 cm__dbg_run_core_text: "$cm_txt_run_now$" # NO-TRANSLATE
 cm__ab_food__ab_food_name: "$cm__ab_food_name$" # NO-TRANSLATE
 cm__ab_food_target_name: "Objectif de surplus"
 cm__ab_food_target_desc: "Un marché obtient davantage de sites de production alimentaire jusqu'à ce que son offre atteigne cette part de sa demande. À 125 %, la production alimentaire est étendue dans tout marché dont le mois médian de l'année n'a pas atteint un surplus de 25 %. Augmentez cette valeur pour maintenir une marge de sécurité plus importante, diminuez-la pour n'aider que les marchés proches d'une pénurie."
 cm__ab_food_target_format: "[CMMV('cm__ab_food_target')]%" # NO-TRANSLATE
 cm__ab_food_min_potential_name: "Potentiel alimentaire minimum"
 cm__ab_food_min_potential_desc: "L'auto-nourriture n'est activée que dans les lieux dont le potentiel de nourriture par niveau de RGO atteint ce score, le même score que celui affiché par le mode de carte $mapmode_cm_location_food_potential_name$. Augmentez-le pour privilégier les meilleures terres agricoles, baissez-le pour accepter des terres moins fertiles."
 cm__ab_food_min_potential_format: "[CMMV('cm__ab_food_min_potential')]" # NO-TRANSLATE
 cm__ab_food_subsidize_name: "Subventionner les bâtiments alimentaires"
 cm__ab_food_subsidize_desc: "Subventionne les bâtiments de production alimentaire construits par la gestion automatique de la nourriture. Un bâtiment qui n'est pas rentable n'embauche personne et ne produit aucune nourriture ; ainsi, un village agricole sur une terre pauvre reste inactif. Le subventionner permet de maintenir ses effectifs et d'assurer ses récoltes. Les subventions ne sont jamais désactivées."
 cm__ab_food_run_now_name: "Forcer la replanification de la nourriture"
 cm__ab_food_run_now_desc: "Relancer la sélection des sites de production alimentaire dès maintenant, en se basant sur le bilan alimentaire de ce mois ainsi que sur les mois déjà échantillonnés, au lieu d'attendre la vérification annuelle."
 cm__ab_food_run_now_text: "$cm_txt_run_now$" # NO-TRANSLATE
 cm__ab_food__debug_name: "$cm_txt_debug$" # NO-TRANSLATE
 cm__dbg_run_food_name: "Lancer la nourriture"
 cm__dbg_run_food_desc: "$cm_txt_dbg_run_category_desc$" # NO-TRANSLATE
 cm__dbg_run_food_text: "$cm_txt_run_now$" # NO-TRANSLATE
 cm__ab_production__ab_production_name: "$cm__ab_production_name$" # NO-TRANSLATE
 cm__ab_production_algorithm_name: "Stratégie de construction"
 cm__ab_production_algorithm_desc: "Comment la production choisit quoi construire."
 cm__ab_production_algorithm_option_1_name: "Cupide"
 cm__ab_production_algorithm_option_1_desc: "Construire en priorité les options au retour sur investissement le plus rapide, et uniquement celles proches du meilleur endroit trouvé pour produire les mêmes biens."
 cm__ab_production_max_rel_roi_name: "ROI relatif max"
 cm__ab_production_max_rel_roi_desc: "Définit à quel point un bâtiment ou une amélioration peut être plus lent à rentabiliser son coût par rapport au meilleur endroit trouvé pour produire les mêmes biens tout en restant éligible à la construction. À 30 %, si le meilleur se rentabilise en 10 ans, seuls ceux se rentabilisant sous 13 ans sont construits ; tout ce qui est plus lent attend. À 0 %, seul le meilleur producteur de chaque bien est construit chaque mois. À 100 %+ il n'y a aucune limite et seul le paramètre « Années de rentabilité max » s'applique. Tous les bâtiments produisant les mêmes biens sont évalués ensemble, quel que soit leur type. Les expansions de RGO sont toujours construites par ordre de rentabilité."
 cm__ab_production_max_rel_roi_format: "[CMMV('cm__ab_production_max_rel_roi')]%[Select_CString(GreaterThanOrEqualTo_CFixedPoint(CMMV('cm__ab_production_max_rel_roi'), CMMMapValue('cmm_max', 'cm__ab_production_max_rel_roi')), '+', '')]" # NO-TRANSLATE
 cm__ab_production_min_roi_name: "Nombre max. d'années de rentabilité"
 cm__ab_production_min_roi_desc: "Seules les constructions dont les revenus fiscaux remboursent le coût de construction en ce nombre d'années sont prises en compte. Réglez sur 0 pour désactiver la vérification."
 cm__ab_production_min_roi_format: "[CMMV('cm__ab_production_min_roi')]y @efficiency!" # NO-TRANSLATE
 cm__ab_production_min_discount_name: "$cm_txt_min_discount$" # NO-TRANSLATE
 cm__ab_production_min_discount_desc: "$cm_txt_min_discount_desc$" # NO-TRANSLATE
 cm__ab_production_min_discount_format: "[CMMV('cm__ab_production_min_discount')]%" # NO-TRANSLATE
 cm__ab_production__debug_name: "$cm_txt_debug$" # NO-TRANSLATE
 cm__dbg_run_production_name: "Lancer la production"
 cm__dbg_run_production_desc: "$cm_txt_dbg_run_category_desc$" # NO-TRANSLATE
 cm__dbg_run_production_text: "$cm_txt_run_now$" # NO-TRANSLATE
 cm__ab_roads__ab_roads_name: "$cm__ab_roads_name$" # NO-TRANSLATE
 cm__ab_roads_proximity_name: "$cm_txt_proximity$" # NO-TRANSLATE
 cm__ab_roads_proximity_desc: "Construisez les tronçons de route qui augmentent le plus la Proximité pour l'or investi, en comptant chaque lieu situé plus loin sur le trajet derrière eux."
 cm__ab_roads_market_access_name: "Accès au marché"
 cm__ab_roads_market_access_desc: "Construit les tronçons de route qui augmentent le plus l'Accès au marché pour l'or investi. Ne dépense que durant les mois où la Proximité n'a rien construit et n'économise pas pour un tronçon qu'il ne peut pas encore s'offrir."
 cm__ab_roads_capital_name: "Connexion à la capitale"
 cm__ab_roads_capital_desc: "Posez des tronçons de route pour relier vos lieux à votre capitale, en progressant vers l'extérieur à partir de ceux déjà reliés. Ne dépense que lors d'un mois où la Proximité et l'Accès au marché n'ont rien construit et qu'aucun des deux n'économise pour un tronçon qu'il ne peut pas encore se permettre."
 cm__ab_roads_min_discount_name: "$cm_txt_min_discount$" # NO-TRANSLATE
 cm__ab_roads_min_discount_desc: "Majoration maximale autorisée du prix des matériaux de construction. À -33 %, ne lance une phase de construction que lorsque le bois d'œuvre, la maçonnerie et le sable requis coûtent 33 % de moins que le prix de base. À 0 %, seulement au prix de base ou en dessous. À +33 %, la lance même si les prix sont 33 % au-dessus du prix de base."
 cm__ab_roads_min_discount_format: "[CMMV('cm__ab_roads_min_discount')]%" # NO-TRANSLATE
 cm__ab_roads_run_now_name: "Forcer la replanification des routes"
 cm__ab_roads_run_now_desc: "Déterminez quels tronçons de route poser à nouveau dès maintenant, au lieu d'attendre le prochain cycle du plan. En multijoueur, c'est le seul moyen de les calculer. Ne pose aucune route lui-même ; les tronçons identifiés sont construits au fur et à mesure que le budget des routes les couvre."
 cm__ab_roads_run_now_text: "$cm_txt_run_now$" # NO-TRANSLATE
 cm__ab_roads__debug_name: "$cm_txt_debug$" # NO-TRANSLATE
 cm__dbg_run_roads_name: "Lancer les routes"
 cm__dbg_run_roads_desc: "Ordonne immédiatement les tronçons de route du plan actuel, de manière autonome, au lieu d'attendre le changement de mois. Dépense le reste de sa part allouée, ainsi une catégorie ayant déjà tout dépensé pour le mois ne construit rien. Suspendre l'automatisation ne l'empêche pas de s'exécuter."
 cm__dbg_run_roads_text: "$cm_txt_run_now$" # NO-TRANSLATE
 cm__ab_governors__ab_governors_name: "$cm__ab_governors_name$" # NO-TRANSLATE
 cm__ab_gov_move_seats_name: "Autoriser le déplacement des gouverneurs"
 cm__ab_gov_move_seats_desc: "Lorsque tous les emplacements de gouverneur sont occupés, retire un gouverneur pour en placer un autre à un meilleur endroit. Ce meilleur endroit doit déjà être une Cité ou avoir un score supérieur de plus de 10 % à celui qu'il remplace. Si cette option est désactivée, les gouverneurs ne sont affectés qu'aux emplacements vides."
 cm__ab_gov_prepare_sites_name: "Autoriser la préparation de nouvelles localisations"
 cm__ab_gov_prepare_sites_desc: "Prend en compte les localisations ne pouvant pas encore accueillir de gouverneur et les prépare en priorité, en y fondant un bourg ou une cité et en construisant une route vers votre capitale. Si désactivé, seules les localisations étant déjà une cité avec une route vers votre capitale sont prises en compte."
 cm__ab_governors__debug_name: "$cm_txt_debug$" # NO-TRANSLATE
 cm__dbg_run_governors_name: "Lancer le plan du gouverneur"
 cm__dbg_run_governors_desc: "Lance un nouveau plan dès maintenant plutôt qu'à son cycle habituel de vingt-cinq ans. Le plan progresse ensuite par étapes au cours des mois suivants, comme à l'accoutumée. Il nécessite toujours d'être en paix, de posséder une capitale et qu'aucune autre recherche ne soit déjà en cours."
 cm__dbg_run_governors_text: "Démarrer"
 cm__urbanization_name: "Urbanisation"
 cm__auto_urbanize_enabled_name: "$cm_txt_enabled$" # NO-TRANSLATE
 cm__auto_urbanize_enabled_desc: "Activer ou désactiver l'urbanisation automatique."
 cm__auto_urbanize_min_discount_name: "$cm_txt_min_discount$" # NO-TRANSLATE
 cm__auto_urbanize_min_discount_desc: "Marge maximale autorisée sur le prix des matériaux de construction. À -33 %, ne fonde des bourgs et des villes que lorsque les matériaux coûtent 33 % de moins que le prix de base. À 0 %, seulement au prix de base ou en dessous. À +33 %, les fonde même lorsque les prix sont 33 % supérieurs au prix de base."
 cm__auto_urbanize_min_discount_format: "[CMMV('cm__auto_urbanize_min_discount')]%" # NO-TRANSLATE
 cm__auto_urbanize__debug_name: "$cm_txt_debug$" # NO-TRANSLATE
 cm__dbg_run_auto_urbanize_name: "Lancer l'auto-urbanisation"
 cm__dbg_run_auto_urbanize_desc: "Exécute les améliorations de rang immédiatement, au lieu d'attendre le changement de mois. Rien d'autre n'est construit durant le cycle ainsi lancé, et Suspendre l'automatisation ne l'empêche pas de s'exécuter."
 cm__dbg_run_auto_urbanize_text: "$cm_txt_run_now$" # NO-TRANSLATE
 cm__auto_town_rights__auto_town_rights_specialization_name: "Accordeur de droits de spécialisation intelligente"
 cm__auto_town_rights__auto_town_rights_specialization_desc: "Octroyé après que l'Octroyeur de droits personnalisés a fini son tour."
 cm__auto_grant_specialization_name: "Octroi automatique des droits urbains de spécialisation"
 cm__auto_grant_specialization_desc: "Accorder un droit de spécialisation par localisation, en choisissant celui qui vaut le plus d'or parmi ceux qui correspondent aux biens produits aux alentours."
 cm__specialization_window_name: "Seuil d'adéquation"
 cm__specialization_window_desc: "Définit à quel point un droit de spécialisation doit être adapté à une localisation, par rapport au droit le mieux adapté, pour être en lice. À 50 %, tout droit convenant au moins à moitié aussi bien est en lice, et celui rapportant le plus d'or est accordé. À 100 %, seul le droit le mieux adapté est accordé."
 cm__specialization_window_format: "[CMMV('cm__specialization_window')]%" # NO-TRANSLATE
 cm__specialization_expand_name: "Étendre les industries boostées"
 cm__specialization_expand_desc: "Lorsqu'un droit de spécialisation est accordé, active également l'expansion automatique dans cette localisation pour les industries favorisées par ce droit, ainsi que pour les matières premières qui y sont produites. Identique à un clic droit sur un bouton d'octroi sur la carte des Droits urbains recommandés."
 cm__auto_town_rights__debug_name: "$cm_txt_debug$" # NO-TRANSLATE
 cm__dbg_run_town_rights_name: "Lancer l'octroi automatique des droits urbains"
 cm__dbg_run_town_rights_desc: "S'exécute immédiatement au lieu d'attendre le changement de mois, en traitant d'abord la liste activée puis les droits de spécialisation. Suspendre l'automatisation ne l'empêche pas de s'exécuter."
 cm__dbg_run_town_rights_text: "$cm_txt_run_now$" # NO-TRANSLATE
 cm__miscellaneous_name: "Divers"
 cm__cleanup_name: "Nettoyage des bâtiments"
 cm__cleanup__cleanup_name: "$cm__cleanup_name$" # NO-TRANSLATE
 cm__cleanup_close_open_name: "Fermer et ouvrir les bâtiments"
 cm__cleanup_close_open_desc: "Une fois par an, ferme les bâtiments de production qui ne sont plus rentables et ne sont pas subventionnés. Les bâtiments ainsi fermés rouvrent dès que ce type de bâtiment est à nouveau rentable sur ce marché. @farming_village! [ShowBuildingTypeNameWithNoTooltip('farming_village')] et @market_village! [ShowBuildingTypeNameWithNoTooltip('market_village')] ne sont jamais fermés."
 cm__cleanup_destroy_name: "Détruire les bâtiments"
 cm__cleanup_destroy_desc: "Une fois par an, détruit les bâtiments de production ayant cessé d'être rentables là où le lieu se trouve à moins de dix niveaux de sa capacité de bâtiments, ainsi que ceux déjà fermés dont le lieu manque désormais de place. Un @market_village! [ShowBuildingTypeNameWithNoTooltip('market_village')] est ramené à un seul niveau à la place. @fruit_orchard! [ShowBuildingTypeNameWithNoTooltip('fruit_orchard')] est détruit et ne sera jamais reconstruit quels que soient ses revenus, et @farming_village! [ShowBuildingTypeNameWithNoTooltip('farming_village')] n'est jamais détruit."
 cm__cleanup_min_profit_name: "Profit minimum par niveau"
 cm__cleanup_min_profit_desc: "Un bâtiment rapportant moins que cela par niveau chaque mois est considéré comme non rentable et sera fermé ou détruit, à moins d'être subventionné."
 cm__cleanup_min_profit_format: "[Divide_CFixedPoint(CMMV('cm__cleanup_min_profit'), '(CFixedPoint)100')|2]@gold!" # NO-TRANSLATE
 cm__cleanup_max_changed_name: "Maximum de modifications par passage"
 cm__cleanup_max_changed_desc: "La part des bâtiments d'un type donné dans un marché pouvant changer lors d'un cycle annuel. À 50 %, la moitié de ses bâtiments ouverts peuvent être fermés ou détruits, et la moitié de ses bâtiments fermés peuvent être rouverts. Jamais moins d'un, de sorte que le dernier bâtiment d'un type puisse toujours être fermé."
 cm__cleanup_max_changed_format: "[CMMV('cm__cleanup_max_changed')]%" # NO-TRANSLATE
 cm__cleanup_core_goods_name: "Prioriser les matériaux de construction"
 cm__cleanup_core_goods_desc: "Maintenir les bâtiments consommant principalement @masonry![ShowGoodsNameWithNoTooltip('masonry')], @lumber![ShowGoodsNameWithNoTooltip('lumber')], @sand![ShowGoodsNameWithNoTooltip('sand')] ou @glass![ShowGoodsNameWithNoTooltip('glass')] à deux fois le profit minimal par niveau, ou 0,1@gold! par niveau, selon la valeur la plus élevée. Les bâtiments produisant l'une de ces quatre ressources ne sont jamais fermés ou détruits tant que cette option est activée."
 cm__cleanup_auto_food_name: "Effacer les localisations de nourriture automatique"
 cm__cleanup_auto_food_desc: "Là où la gestion automatique de la nourriture est active et que tout type de travailleur est déjà en pénurie, détruisez les bâtiments de production qui ne produisent pas de nourriture. Un @market_village! [ShowBuildingTypeNameWithNoTooltip('market_village')] est réduit à un seul niveau au lieu d'être détruit."
 cm__cleanup_run_now_name: "Lancer le nettoyage des bâtiments"
 cm__cleanup_run_now_desc: "Lancer le nettoyage maintenant au lieu d'attendre le passage annuel."
 cm__cleanup_run_now_text: "$cm_txt_run_now$" # NO-TRANSLATE
 cm__placement_finder_method_option_3_name: "Population"
 cm__placement_finder_method_option_3_desc: "Classer selon le gain de proximité qu'apporterait un gouverneur ou une capitale placé à cet endroit, en comptant chaque lieu selon la population qui y vit. Un faible gain sur une population nombreuse vaut moins qu'un gain important sur une petite population."
 cm__log_production_name: "$cm__ab_production_name$" # NO-TRANSLATE
 cm__log_production_desc: "Lignes pour chaque bâtiment mis en file d'attente par la catégorie Production et chaque expansion de matières premières envisagée, avec le retour sur investissement et les revenus pour chacun."
 cm__log_core_name: "$cm__ab_core_name$" # NO-TRANSLATE
 cm__log_core_desc: "Lignes suivant une localisation à travers un cycle de Biens de Base : la pénurie du marché et les niveaux demandés, puis ce qui a été attribué à cette localisation, son score et ce qui a été construit. Marquez d'abord la localisation avec la commande de console effect location:<key> = { cm_ab_core_watch_on = yes }."
 cm__debug__rotation_name: "Rotation des marchés"
 cm__debug__rotation_desc: "Un grand pays traite ses marchés par petits groupes, et chaque automatisation construit dans l'ensemble en cours de traitement."
 cm__dbg_rotate_slice_name: "Rotation des marchés"
 cm__dbg_rotate_slice_desc: "Passe à l'ensemble de marchés suivant. Une exécution lancée via l'un des boutons « Exécuter maintenant » reste sur l'ensemble trouvé ; c'est donc ce qui permet de la faire progresser pendant que le jeu est en pause."
 cm__dbg_rotate_slice_text: "Rotation"
 cm__probe_production_anchors_name: "Ancres de production"
 cm__probe_production_anchors_desc: "Une ligne par bien avec le meilleur retour sur investissement enregistré par la Production et la limite de retour qu'elle définit, en nommant le bâtiment et le lieu pour chacun."
 cm__probe_production_anchors_text: "$cm_txt_run$" # NO-TRANSLATE
 cm__probe_production_rgo_name: "Production de matières premières"
 cm__probe_production_rgo_desc: "Une ligne pour chaque raison pour laquelle la Production a ignoré les matières premières d'une localisation, ou une seule ligne si elle n'en a ignoré aucune. Lit la capitale, à moins de marquer une localisation avec la commande de console effect location:<key> = { cm_ab_core_watch_on = yes }."
 cm__probe_production_rgo_text: "$cm_txt_run$" # NO-TRANSLATE
 cm__probe_core_name: "$cm__ab_core_name$" # NO-TRANSLATE
 cm__probe_core_desc: "Chaque valeur lue par Biens de base pour un lieu, à côté de la propre valeur du jeu, puis ce que le marché de ce lieu pourrait absorber en un cycle. Affiche la capitale à moins de marquer un lieu avec la commande de console effect location:<key> = { cm_ab_core_watch_on = yes } ; la capitale n'étant jamais éligible aux Biens de base, marquez un lieu pour lire ce qu'il y construirait."
 cm__probe_core_text: "$cm_txt_run$" # NO-TRANSLATE
 cm__probe_setup_name: "$cm_txt_setup_data$" # NO-TRANSLATE
 cm__probe_setup_desc: "Quelles données de carte la sauvegarde contient et la version à laquelle chacune a été calculée, puis si cette machine est autorisée à les traiter. Une version 0 signifie que les données n'ont pas encore été calculées et le seront lors du prochain chargement."
 cm__probe_setup_text: "$cm_txt_run$" # NO-TRANSLATE
 cm__debug__setup_name: "$cm_txt_setup_data$" # NO-TRANSLATE
 cm__debug__setup_desc: "Les données de la carte que le mod calcule une seule fois, puis lit pour le reste de la partie."
 cm__dbg_rebuild_setup_name: "Reconstruire les données de configuration"
 cm__dbg_rebuild_setup_desc: "Recalcule les données de la carte : les matières premières derrière les filtres de bonus R.G.O., la couverture industrielle derrière les Droits urbains recommandés, les scores derrière $mapmode_cm_location_food_potential_name$, les traversées de rivières empruntées par les outils de placement, et quels bâtiments s'améliorent en quels autres. Cela prend quelques secondes, et le jeu continue de fonctionner pendant l'opération."
 cm__dbg_rebuild_setup_text: "Reconstruire"
