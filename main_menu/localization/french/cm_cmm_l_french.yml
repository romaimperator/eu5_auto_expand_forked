l_french:
 # Mod
 cm_name: "Gestionnaire de construction"
 cm_desc: "Un mod majeur d'amélioration de la qualité de vie qui ajoute de nouvelles automatisations, des filtres et des modes de carte, afin d'améliorer considérablement l'expérience de construction dans EU5."

 # Settings (settings) Tab
 cm__settings_name: "Paramètres"
 ## Global Control (settings) Group
 cm__pause_auto_expand_name: "Mettre l'automatisation en pause"
 cm__pause_auto_expand_desc: "Met en pause toutes les fonctionnalités d'automatisation : l'extension automatique des bâtiments, l'extension automatique des RGO, l'amélioration de tous les bâtiments, la construction automatique, la gestion automatique de la nourriture et l'urbanisation automatique."
 cm__minimum_gold_name: "Réserve d'or"
 cm__minimum_gold_desc: "La réserve d'or minimale à conserver. Les constructions ne seront pas mises en file d'attente si cela devait faire descendre le trésor sous ce montant. S'applique à toutes les fonctionnalités d'automatisation, excepté les améliorations d'urbanisation automatique (qui possèdent leur propre paramètre d'or)."
 cm__minimum_gold_format: "[CMMV('cm__minimum_gold')]@gold!"
 cm__allowed_building_overbuild_levels_name: "Limite de surconstruction"
 cm__allowed_building_overbuild_levels_desc: "Nombre total de niveaux de bâtiment dont un lieu peut dépasser sa limite de Niveaux de bâtiment supportés avant que l'auto-expansion ne cesse de mettre de nouvelles constructions en file d'attente. À zéro, aucun dépassement de la limite n'est autorisé."

 ## Priority List Group
 cm__settings__priority_list_name: "Automatisation de la construction"
 cm__settings__priority_list_desc: "Faites glisser pour réorganiser la priorité des fonctionnalités. Chaque mois, les fonctionnalités activées s'exécutent de haut en bas. Pour l'auto-expansion, la valeur à côté de chaque fonctionnalité indique le seuil de rentabilité qu'une expansion doit atteindre avant d'être construite, selon l'indicateur choisi dans Métrique d'auto-expansion : un montant d'or mensuel minimum par niveau pour les Revenus fiscaux et le Profit, ou un nombre maximum d'années pour rentabiliser le coût de construction pour le ROI (0 = désactivé). Remise min. définit la majoration maximale autorisée du prix des matériaux de construction (-33 % = seulement quand ils sont bon marché, 0 = au prix de base, +33 % = même en cas d'inflation)."
 cm__priority_list_item_column_name: "Fonctionnalité"
 cm__priority_list_i1_name: "Extension automatique des bâtiments"
 cm__priority_list_i1_desc: "Étend automatiquement les bâtiments de production et de non-production à plusieurs niveaux lorsqu'ils sont rentables, que des pops sont disponibles et que l'or reste au-dessus de votre Réserve d'or. S'applique uniquement dans les lieux où l'extension automatique est activée."
 cm__priority_list_i2_name: "Extension automatique des RGO"
 cm__priority_list_i2_desc: "Étend automatiquement les niveaux de RGO dans les lieux où l'auto-expansion des RGO est activée, lorsque la main-d'œuvre est disponible et que les ressources le permettent."
 cm__priority_list_i3_name: "Améliorer automatiquement tous les bâtiments"
 cm__priority_list_i3_desc: "Améliore automatiquement chaque bâtiment devenu obsolète, que l'extension automatique soit activée ou non pour ce bâtiment."
 cm__priority_list_i4_name: "Construction automatique"
 cm__priority_list_i4_desc: "Construit automatiquement les bâtiments uniques par localisation (conseils, bibliothèques, etc.) selon l'ordre et les paramètres configurés dans l'onglet de construction automatique."
 cm__priority_list_i5_name: "Auto-Nourriture"
 cm__priority_list_i5_desc: "Construit automatiquement les RGO et les bâtiments produisant de la nourriture dans les localisations rurales, en choisissant l'option avec la production marginale de nourriture la plus élevée. Configuré dans l'onglet Auto-Nourriture."
 cm__priority_list_i6_name: "Auto-urbanisation"
 cm__priority_list_i6_desc: "Améliore le rang des localisations chaque mois : les peuplements ruraux deviennent des bourgs, et les bourgs deviennent des cités. Le passage de rural à bourg nécessite 30 000 pops (rendant la localisation immédiatement éligible au statut de cité) ou d'être à moins de 1 000 de la limite de population (afin d'éviter que la croissance ne stagne à la limite rurale). Ignore les localisations non intégrées. Configurable dans l'onglet Auto-urbanisation."
 cm__priority_list_i7_name: "Construction automatique des bâtiments de capitale"
 cm__priority_list_i7_desc: "Construit automatiquement les bâtiments réservés à la capitale (cour royale, cour suprême, école de guerre, etc.) dans votre capitale lorsque les conditions le permettent."
 cm__priority_list__enabled_name: "Activé"
 cm__priority_list__enabled_desc: "Activer ou désactiver cette fonctionnalité. Les fonctionnalités désactivées sont ignorées chaque mois."
 cm__priority_list__min_profit_name: "Revenu fiscal minimum"
 cm__priority_list__min_profit_desc: "Or mensuel minimum par niveau requis avant la mise en file d'attente de la construction. Réglez sur 0 pour désactiver la vérification."
 cm__priority_list__min_profit_postfix: "@gold!"
 cm__priority_list__min_discount_name: "Réduction min."
 cm__priority_list__min_discount_desc: "Majoration maximale autorisée pour le prix des matériaux de construction. À -33 %, ne construit que lorsque les matériaux coûtent 33 % de moins que le prix de base. À 0 %, seulement au prix de base ou en dessous. À +33 %, construit même lorsque les prix sont 33 % au-dessus du prix de base."
 cm__priority_list__min_discount_postfix: "%"
 cm__priority_list__min_discount_prefix_high: "#R "
 cm__priority_list__min_discount_postfix_high: "%#!"
 cm__priority_list__min_discount_prefix_low: "#G "
 cm__priority_list__min_discount_postfix_low: "%#!"

