 cm__ab_master__ab_master_name: "$cm__ab_master_name$" # NO-TRANSLATE
 cm__ab_master__ab_master_desc: "Construction automatisée. Chaque mois, les catégories ci-dessous dépensent le trésor excédant la réserve d'or pour les meilleures constructions disponibles. Fonctionne en parallèle des autres fonctionnalités d'automatisation sans modifier leurs paramètres."
 cm__ab_enabled_name: "Activer la construction automatique"
 cm__ab_enabled_desc: "Activer ou désactiver la construction automatique."
 cm__ab_save_unaffordable_name: "Épargner pour les bâtiments trop coûteux"
 cm__ab_save_unaffordable_desc: "Une catégorie achète le meilleur bâtiment trouvé même si son coût dépasse sa part mensuelle, puis s'abstient de tout achat jusqu'à ce que les mois suivants compensent la différence. Lorsqu'elle est désactivée, une catégorie n'achète rien qu'elle ne puisse financer intégralement."
 cm__ab_min_proximity_name: "Proximité minimale"
 cm__ab_min_proximity_desc: "Les lieux situés sous ce seuil de Proximité sont ignorés lors du choix de l'emplacement de construction. Les bâtiments de contrôle et @settlement_building! [ShowBuildingTypeNameWithNoTooltip('settlement_building')] sont construits malgré tout, car ce sont eux qui font l'intérêt de conserver des terres à faible Proximité. À 0, rien n'est ignoré."
 cm__ab_min_proximity_format: "[CMMV('cm__ab_min_proximity')]%" # NO-TRANSLATE
 cm__ab_master__ab_priority_list_name: "Catégories de construction automatique"
 cm__ab_master__ab_priority_list_desc: "Faites glisser pour réorganiser. Les catégories sont traitées de haut en bas chaque mois. Si deux catégories demandent le même bâtiment, la plus haute l'emporte, et s'il reste de l'or une fois que chaque catégorie a reçu sa part, la plus haute le récupère."
 cm__ab_priority_list_item_column_name: "Catégorie"
 cm__ab_priority_list_i1_name: "$cm__ab_custom_name$" # NO-TRANSLATE
 cm__ab_priority_list_i1_desc: "Construit l'infrastructure de soutien partout où cela est possible. Les bâtiments de capitale sont construits en premier, suivis des bâtiments de contrôle, puis des centres de marché, et enfin des bâtiments que vous sélectionnez vous-même. Les baillis sont affectés aux lieux dont les matières premières se vendent le plus cher, les autres bâtiments de contrôle aux lieux les plus riches, et les marchés aux lieux ayant le plus faible accès au marché."
 cm__ab_priority_list_i2_name: "$cm__ab_core_name$" # NO-TRANSLATE
 cm__ab_priority_list_i2_desc: "Augmente la production de matériaux de construction pour faire baisser leurs prix. Fonctionne dans les marchés dont vous possédez le centre de marché. Les lieux les plus productifs sont traités en priorité et reçoivent plusieurs niveaux à la fois, et les producteurs s'établissent même là où les travailleurs ne sont pas encore arrivés. Votre capitale, les lieux produisant de la nourriture et les producteurs qui seraient déficitaires sans subvention sont ignorés."
 cm__ab_priority_list_i3_name: "$cm__ab_food_name$" # NO-TRANSLATE
 cm__ab_priority_list_i3_desc: "Surveille l'approvisionnement en nourriture au cours de l'année dans les marchés dont vous possédez le centre de marché et, là où le mois médian a été insuffisant, active l'auto-nourriture sur les lieux ayant le plus haut potentiel de production. Les lieux sélectionnés brillent comme ceux activés par le joueur, mais le bouton d'activation reste le vôtre ; ils ne sont jamais désactivés sauf si le lieu n'est plus un établissement rural vous appartenant, si vous ne possédez plus son centre de marché ou si un meilleur lieu dans le même marché prend sa place."
 cm__ab_priority_list_i4_name: "$cm__ab_production_name$" # NO-TRANSLATE
 cm__ab_priority_list_i4_desc: "Construit, étend et améliore les bâtiments de production et les RGO qui remboursent leur coût le plus rapidement en revenus fiscaux. Les localisations utilisant l'auto-alimentation sont laissées de côté tant qu'un type de travailleur y est déjà en pénurie."
 cm__ab_priority_list_i5_name: "$cm__ab_roads_name$" # NO-TRANSLATE
 cm__ab_priority_list_i5_desc: "Construit le réseau routier le plus rentable pour l'or investi, selon trois bénéfices apportés par une route : la Proximité, l'Accès au marché et la connexion d'un lieu à votre capitale. Tous les quatre ans, ainsi qu'à chaque fois que votre capitale est déplacée, il calcule le meilleur itinéraire vers chaque lieu que vous possédez pour chacun de ces critères et classe les tronçons selon l'augmentation de l'Assiette fiscale qu'ils généreraient, en comptabilisant tout ce qui se trouve plus loin derrière eux sur le tracé ; en multijoueur, cela ne se produit que lorsque vous appuyez sur Forcer la planification des routes. Chaque mois, il parcourt cette liste et s'arrête au premier tronçon qu'il ne peut pas commencer plutôt que de passer au suivant. Les couloirs plats et bon marché sont posés en priorité, et un tronçon inférieur ne reçoit de l'or que lors d'un mois où celui du dessus n'a rien construit et n'économise pas pour un tronçon qu'il ne peut pas encore s'offrir."
 cm__ab_priority_list_i6_name: "$cm__ab_governors_name$" # NO-TRANSLATE
 cm__ab_priority_list_i6_desc: "Détermine où vos gouverneurs doivent siéger et les y affecte, en choisissant d'abord les meilleurs emplacements. Replanifie dès qu'un poste de gouverneur se libère, ou tous les vingt-cinq ans sinon. Solo uniquement."
 cm__ab_priority_list__budget_name: "Part du budget"
 cm__ab_priority_list__budget_desc: "La part du trésor au-dessus de la réserve d'or allouée chaque mois à cette catégorie. C'est un plancher plutôt qu'une limite : l'or non dépensé par une catégorie est de nouveau proposé en commençant par le haut de la liste, de sorte qu'une catégorie peut construire bien au-delà de sa part lors d'un mois où celles situées plus bas n'ont rien à acheter."
 cm__ab_priority_list__budget_postfix: "%" # NO-TRANSLATE
