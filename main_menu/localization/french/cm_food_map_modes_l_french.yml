l_french:
 mapmode_cm_breadbasket_name: "Greniers à blé"
 MAPMODE_CM_BREADBASKET: "#T $mapmode_cm_breadbasket_name$#!\nMet en évidence vos [locations|e] où la gestion automatique de la nourriture est actuellement configurée."
 MAPMODE_CM_BREADBASKET_TT_ENABLED: "[ROOT.GetLocation.GetName] est configuré pour la gestion automatique de la nourriture."
 MAPMODE_CM_BREADBASKET_TT_OWNED: "[ROOT.GetLocation.GetName] vous appartient mais n'a pas la gestion automatique de la nourriture activée."
 MAPMODE_CM_BREADBASKET_TT_FOREIGN: "[ROOT.GetLocation.GetName] ne vous appartient pas."
 MAPMODE_CM_BREADBASKET_TT_UNCOLONIZED: "[ROOT.GetLocation.GetName] n'est pas colonisé."
 MAPMODE_CM_BREADBASKET_TT_WATER: "$cm_txt_tt_sea_zone$"

 cm_breadbasket_enabled_legend_key: "Nourriture auto. activée"
 cm_breadbasket_owned_legend_key: "Vos autres localisations"
 cm_breadbasket_foreign_legend_key: "Localisations étrangères"
 cm_breadbasket_uncolonized_legend_key: "Non colonisé"

 mapmode_cm_location_food_potential_name: "Potentiel de nourriture par niveau de RGO"
 MAPMODE_CM_LOCATION_FOOD_POTENTIAL: "#T $mapmode_cm_location_food_potential_name$#!\nCeci colore les [locations|e] selon leur potentiel alimentaire naturel par niveau de [rgo|e]. Le score combine la valeur de [rgo|e] [food|e], les [food_productivity|e] cumulatifs (terrain, végétation, climat, modificateurs statiques nommés comme le Marché du hareng de Scanie ou le Delta du Nil fertile, modificateurs de production spécifiques au [rgo|e], etc.), l'accès à l'eau et les bonus maximaux supposés de [ShowBuildingTypeName('windmill')], [ShowBuildingTypeName('farming_village')] et [ShowBuildingTypeName('irrigation_systems')] là où le [rgo|e] le permet.\n\n[development|e] est exclu et chaque [location|e] est évalué comme s'il s'agissait d'un établissement rural, de sorte que le score affiche le potentiel du terrain plutôt que la production actuelle."
 mapmode_cm_location_food_potential_hidden_name: "$mapmode_cm_location_food_potential_name$"
 MAPMODE_CM_LOCATION_FOOD_POTENTIAL_HIDDEN: "$MAPMODE_CM_LOCATION_FOOD_POTENTIAL$"
 MAPMODE_CM_LOCATION_FOOD_POTENTIAL_TT_LAND: "[ROOT.GetLocation.GetName] a un potentiel alimentaire de [ROOT.GetLocation.MakeScope.ScriptValue('cm_location_food_potential')|1Y] par niveau de [rgo|e]."
 MAPMODE_CM_LOCATION_FOOD_POTENTIAL_TT_WATER: "[ROOT.GetLocation.GetName] n'est pas une terre, donc n'a pas de potentiel alimentaire."

 cm_location_food_potential_auto_food_legend_key: "Auto-alimentation activée (hachuré)"
 cm_location_food_potential_bright_green_legend_key: "45 (maximum possible)"
 cm_location_food_potential_green_legend_key: "27,5 (excellent)"
 cm_location_food_potential_yellow_legend_key: "20 (bon)"
 cm_location_food_potential_orange_legend_key: "12,5 (décent)"
 cm_location_food_potential_red_legend_key: "3.75 (bas)"
 cm_location_food_potential_black_legend_key: "0 (aucun)"
