l_french:
 mapmode_cm_breadbasket_name: "Greniers à blé"
 MAPMODE_CM_BREADBASKET: "#T $mapmode_cm_breadbasket_name$#!\nMet en évidence vos [locations|e] où la gestion automatique de la nourriture est actuellement configurée."
 MAPMODE_CM_BREADBASKET_TT_ENABLED: "[ROOT.GetLocation.GetName] est configuré pour la nourriture automatique."
 MAPMODE_CM_BREADBASKET_TT_OWNED: "[ROOT.GetLocation.GetName] vous appartient mais n'a pas l'alimentation automatique activée."
 MAPMODE_CM_BREADBASKET_TT_FOREIGN: "[ROOT.GetLocation.GetName] ne vous appartient pas."
 MAPMODE_CM_BREADBASKET_TT_UNCOLONIZED: "[ROOT.GetLocation.GetName] est non colonisée."
 MAPMODE_CM_BREADBASKET_TT_WATER: "[ROOT.GetLocation.GetName] est une zone maritime."

 cm_breadbasket_enabled_legend_key: "Alimentation auto activée"
 cm_breadbasket_owned_legend_key: "Vos autres localisations"
 cm_breadbasket_foreign_legend_key: "Localisations étrangères"
 cm_breadbasket_uncolonized_legend_key: "Non colonisé"

 mapmode_cm_location_food_potential_name: "Potentiel alimentaire par niveau de RGO"
 MAPMODE_CM_LOCATION_FOOD_POTENTIAL: "#T $mapmode_cm_location_food_potential_name$#!\nCeci colore les [locations|e] selon leur potentiel alimentaire naturel par niveau de [rgo|e]. Le score combine la valeur de [rgo|e] [food|e], le [food_productivity|e] cumulé (terrain, végétation, climat, modificateurs statiques nommés tels que le Marché aux harengs de Scanie ou le Delta fertile du Nil, modificateurs de production spécifiques à [rgo|e], etc.), l'accès à l'eau, et les bonus maximaux supposés de [ShowBuildingTypeName('windmill')], [ShowBuildingTypeName('farming_village')] et [ShowBuildingTypeName('irrigation_systems')] là où [rgo|e] le permet.\n\nLa contribution de [development|e] est exclue afin que le score reflète le pur potentiel du terrain plutôt qu'un aperçu de l'investissement actuel."
 mapmode_cm_location_food_potential_hidden_name: "$mapmode_cm_location_food_potential_name$"
 MAPMODE_CM_LOCATION_FOOD_POTENTIAL_HIDDEN: "$MAPMODE_CM_LOCATION_FOOD_POTENTIAL$"
 MAPMODE_CM_LOCATION_FOOD_POTENTIAL_TT_LAND: "[ROOT.GetLocation.GetName] a un potentiel alimentaire par niveau de [rgo|e] de [ROOT.GetLocation.MakeScope.ScriptValue('cm_location_food_potential')|1Y]."
 MAPMODE_CM_LOCATION_FOOD_POTENTIAL_TT_WATER: "[ROOT.GetLocation.GetName] n'est pas une terre et n'a donc pas de potentiel alimentaire."

 cm_location_food_potential_auto_food_legend_key: "Alimentation auto activée (hachuré)"
 cm_location_food_potential_bright_green_legend_key: "45 (maximum possible)"
 cm_location_food_potential_green_legend_key: "27.5 (excellent)"
 cm_location_food_potential_yellow_legend_key: "20 (bien)"
 cm_location_food_potential_orange_legend_key: "12.5 (décent)"
 cm_location_food_potential_red_legend_key: "3,75 (faible)"
 cm_location_food_potential_black_legend_key: "0 (aucun)"
