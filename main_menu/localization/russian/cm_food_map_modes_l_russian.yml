l_russian:
 mapmode_cm_breadbasket_name: "Житницы"
 MAPMODE_CM_BREADBASKET: "#T $mapmode_cm_breadbasket_name$#!\nПодсвечивает ваши [locations|e], где в данный момент настроено авто-продовольствие."
 MAPMODE_CM_BREADBASKET_TT_ENABLED: "[ROOT.GetLocation.GetName] настроен на авто-продовольствие."
 MAPMODE_CM_BREADBASKET_TT_OWNED: "[ROOT.GetLocation.GetName] принадлежит вам, но автоматическое производство еды не включено."
 MAPMODE_CM_BREADBASKET_TT_FOREIGN: "[ROOT.GetLocation.GetName] не принадлежит вам."
 MAPMODE_CM_BREADBASKET_TT_UNCOLONIZED: "[ROOT.GetLocation.GetName] не колонизирована."
 MAPMODE_CM_BREADBASKET_TT_WATER: "$cm_txt_tt_sea_zone$"

 cm_breadbasket_enabled_legend_key: "Авто-продовольствие включено"
 cm_breadbasket_owned_legend_key: "Ваши другие локации"
 cm_breadbasket_foreign_legend_key: "Иностранные локации"
 cm_breadbasket_uncolonized_legend_key: "Неколонизировано"

 mapmode_cm_location_food_potential_name: "Потенциал продовольствия за уровень добывающего предприятия"
 MAPMODE_CM_LOCATION_FOOD_POTENTIAL: "#T $mapmode_cm_location_food_potential_name$#!\nЭтот режим окрашивает [locations|e] в соответствии с их природным продовольственным потенциалом на каждый уровень [rgo|e]. Оценка объединяет значение [rgo|e] [food|e], совокупный [food_productivity|e] (ландшафт, растительность, климат, именные статические модификаторы, такие как «Рынок сельди в Сконе» или «Плодородная дельта Нила», специфические модификаторы производства для [rgo|e] и т. д.), доступ к воде и предполагаемые максимальные бонусы от [ShowBuildingTypeName('windmill')], [ShowBuildingTypeName('farming_village')] и [ShowBuildingTypeName('irrigation_systems')], где это позволяет [rgo|e].\n\n[development|e] исключается, и каждое [location|e] оценивается так, как если бы оно было сельским поселением, поэтому оценка показывает потенциал местности, а не текущую выработку."
 mapmode_cm_location_food_potential_hidden_name: "$mapmode_cm_location_food_potential_name$"
 MAPMODE_CM_LOCATION_FOOD_POTENTIAL_HIDDEN: "$MAPMODE_CM_LOCATION_FOOD_POTENTIAL$"
 MAPMODE_CM_LOCATION_FOOD_POTENTIAL_TT_LAND: "[ROOT.GetLocation.GetName] имеет потенциал производства пищи на уровень [rgo|e] в размере [ROOT.GetLocation.MakeScope.ScriptValue('cm_location_food_potential')|1Y]."
 MAPMODE_CM_LOCATION_FOOD_POTENTIAL_TT_WATER: "[ROOT.GetLocation.GetName] не является сушей, поэтому не имеет продовольственного потенциала."

 cm_location_food_potential_auto_food_legend_key: "Авто-еда включена (заштриховано)"
 cm_location_food_potential_bright_green_legend_key: "45 (максимально возможно)"
 cm_location_food_potential_green_legend_key: "27.5 (отлично)"
 cm_location_food_potential_yellow_legend_key: "20 (хорошо)"
 cm_location_food_potential_orange_legend_key: "12.5 (неплохо)"
 cm_location_food_potential_red_legend_key: "3.75 (низкий)"
 cm_location_food_potential_black_legend_key: "0 (нет)"
