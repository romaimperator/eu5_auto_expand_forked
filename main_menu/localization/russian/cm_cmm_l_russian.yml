 cm__urbanize_town_to_city_desc: "Ежемесячно улучшать подходящие городки до городов."
 cm__urbanize_rural_to_town_name: "Из села в город"
 cm__urbanize_rural_to_town_desc: "Ежемесячно улучшает подходящие сельские поселения до городов. Требуется 30 000 населения или не более 1 000 до лимита населения. Локации, чьи РГО отмечены в списке «Не урбанизировать» ниже, пропускаются. Локации под действием «Массового авто-продовольствия» также пропускаются."
