 cm__ab_core__ab_core_name: "$cm__ab_core_name$" # NO-TRANSLATE
 cm__ab_core__ab_core_desc: "Настройки основных товаров. Материалы обрабатываются сверху вниз по списку, при этом RGO расширяются раньше производственных зданий."
 cm__ab_core_target_name: "Целевая цена"
 cm__ab_core_target_desc: "Цена, при которой прекращается строительство для материала, относительно его базовой цены. При -33% предприятия строятся до тех пор, пока цена материала не станет на 33% ниже базовой. При 0% — до достижения базовой цены. При +33% — только пока цена более чем на 33% выше базовой."
 cm__ab_core_target_format: "[CMMV('cm__ab_core_target')]%" # NO-TRANSLATE
 cm__ab_core_item_column_name: "Материал"
 cm__ab_core_i1_name: "@masonry! [ShowGoodsName('masonry')]" # NO-TRANSLATE
