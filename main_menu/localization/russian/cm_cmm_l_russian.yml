l_russian:
 # Mod
 cm_name: "Менеджер строительства"
 cm_desc: "Масштабная модификация для повышения удобства игры, добавляющая новую автоматизацию, фильтры и режимы карты для значительного улучшения процесса строительства в EU5."

 # Settings (settings) Tab
 cm__settings_name: "Настройки"
 ## Global Control (settings) Group
 cm__pause_auto_expand_name: "Приостановить автоматизацию"
 cm__pause_auto_expand_desc: "Приостанавливает все функции автоматизации: авторасширение зданий, авторасширение РГО, улучшение всех зданий, автостроительство, автопродовольствие и автоурбанизацию."
 cm__minimum_gold_name: "Золотой запас"
 cm__minimum_gold_desc: "Минимальный золотой запас. Строительство не будет добавлено в очередь, если это приведет к снижению запасов казны ниже указанной суммы. Применяется ко всем функциям автоматизации, за исключением улучшений автоурбанизации (у которых есть собственная настройка золота)."
 cm__minimum_gold_format: "[CMMV('cm__minimum_gold')]@gold!"
 cm__allowed_building_overbuild_levels_name: "Лимит избыточного строительства"
 cm__allowed_building_overbuild_levels_desc: "На сколько уровней зданий локация может превысить лимит поддерживаемых уровней зданий, прежде чем авторасширение перестанет добавлять в очередь новое строительство. При значении 0 строительство сверх лимита невозможно."

 ## Priority List Group
 cm__settings__priority_list_name: "Автоматизация строительства"
 cm__settings__priority_list_desc: "Перетаскивайте для изменения приоритета функций. Каждый месяц включенные функции выполняются сверху вниз. Для авторасширения значение рядом с каждой функцией определяет, насколько выгодным должно быть расширение для начала постройки, на основании выбранного вами Показателя авторасширения: минимальный ежемесячный доход в золоте за уровень для Налогового дохода и Прибыли или максимальное количество лет для окупаемости стоимости строительства для ROI (0 = отключено). Мин. скидка устанавливает максимально допустимую наценку на стоимость строительных материалов (-33% = только когда дешево, 0 = по базовой цене, +33% = даже при завышенной цене)."
 cm__priority_list_item_column_name: "Особенность"
 cm__priority_list_i1_name: "Авторасширение зданий"
 cm__priority_list_i1_desc: "Автоматически расширяет многоуровневые производственные и непроизводственные здания, если они прибыльны, имеется доступное население, а количество золота превышает ваш Золотой резерв. Действует только в локациях, где включено авторасширение."
 cm__priority_list_i2_name: "Авторасширение РГО"
 cm__priority_list_i2_desc: "Автоматически расширяет уровни RGO в локациях, где включено авторасширение RGO, при наличии свободных рабочих и ресурсов."
 cm__priority_list_i3_name: "Автоматически улучшать все здания"
 cm__priority_list_i3_desc: "Автоматически улучшает все здания, ставшие устаревшими, независимо от того, включено ли для них авторасширение."
 cm__priority_list_i4_name: "Автоматическое строительство"
 cm__priority_list_i4_desc: "Автоматически возводит здания, строящиеся по одному на локацию (советы, библиотеки и т. д.), в порядке и с настройками, заданными на вкладке «Автоматическое строительство»."
 cm__priority_list_i5_name: "Авто-продовольствие"
 cm__priority_list_i5_desc: "Автоматически строит производящие пищу RGO и здания в сельских локациях, выбирая вариант с наибольшим предельным приростом производства пищи. Настраивается во вкладке «Авто-пища»."
 cm__priority_list_i6_name: "Автоурбанизация"
 cm__priority_list_i6_desc: "Ежемесячно повышает ранги локаций: сельские поселения до городков, а городки до городов. Для превращения поселения в городок требуется 30 000 населения (что сразу дает право на статус города) или ситуация, когда до лимита населения остается менее 1 000 (иначе рост остановится на лимите сельского поселения). Пропускает неинтегрированные локации. Настраивается на вкладке «Автоурбанизация»."
 cm__priority_list_i7_name: "Автоматическое строительство столичных зданий"
 cm__priority_list_i7_desc: "Автоматически возводит в вашей столице здания, доступные только для столиц (королевский двор, верховный суд, военную академию и т. д.), когда позволяют условия."
 cm__priority_list__enabled_name: "Включено"
 cm__priority_list__enabled_desc: "Включить или выключить эту функцию. Отключенные функции пропускаются каждый месяц."
 cm__priority_list__min_profit_name: "Минимальный налоговый доход"
 cm__priority_list__min_profit_desc: "Минимальный ежемесячный доход золота на уровень, необходимый для постановки строительства в очередь. Установите 0, чтобы отключить проверку."
 cm__priority_list__min_profit_postfix: "@gold!"
 cm__priority_list__min_discount_name: "Мин. скидка"
 cm__priority_list__min_discount_desc: "Максимально допустимая наценка на строительные материалы. При -33% строительство ведется только тогда, когда цена материалов на 33% ниже базовой. При 0% — только по базовой цене или ниже. При +33% строительство ведется, даже если цены на 33% выше базовых."
 cm__priority_list__min_discount_prefix_high: "#R "
 cm__priority_list__min_discount_postfix_high: "%#!"
 cm__priority_list__min_discount_prefix_low: "#G "
 cm__priority_list__min_discount_postfix_low: "%#!"

