l_russian:
 # Mod
 cm_name: "Менеджер строительства"
 cm_desc: "Масштабный мод на качество жизни, добавляющий новую автоматизацию, фильтры и режимы карты для значительного улучшения процесса строительства в EU5."

 # Settings (settings) Tab
 cm__settings_name: "Настройки"
 ## Global Control (settings) Group
 cm__pause_auto_expand_name: "Приостановить автоматизацию"
 cm__pause_auto_expand_desc: "Приостанавливает все функции автоматизации: авторасширение зданий, авторасширение ДРП, улучшение всех зданий, автостроительство, автостроительство столичных зданий, автопродовольствие, автоурбанизация, автоматическая выдача городских прав и Полная автоматизация."
 cm__minimum_gold_name: "Золотой запас"
 cm__minimum_gold_desc: "Минимальный золотой запас, который необходимо сохранять. Применяется ко всем функциям автоматизации, кроме Полной автоматизации."
 cm__minimum_gold_format: "[CMMV('cm__minimum_gold')]@gold!"
 cm__allowed_building_overbuild_levels_name: "Лимит избыточного строительства"
 cm__allowed_building_overbuild_levels_desc: "На сколько суммарных уровней зданий локация может превысить свой лимит поддерживаемых уровней зданий, прежде чем авторасширение перестанет ставить в очередь новые постройки. При значении 0 избыточное строительство запрещено. При значении 200+ ограничений нет."

 ## Priority List Group
 cm__settings__priority_list_name: "Автоматизация строительства"
 cm__settings__priority_list_desc: "Перетаскивайте, чтобы изменить приоритет функций. Каждый месяц активные функции выполняются сверху вниз, за исключением Авто-урбанизации, которая всегда запускается последней, после всех остальных функций и Полной автоматизации."
 cm__priority_list_item_column_name: "Особенность"
 cm__priority_list_i1_name: "Авторасширение зданий"
 cm__priority_list_i1_desc: "Автоматически расширяет многоуровневые производственные и непроизводственные здания, когда они прибыльны, доступно население, а количество золота выше вашего Золотого резерва. Применяется там, где включено авторасширение для локации или всего типа зданий, включая иностранные здания в локациях других стран."
 cm__priority_list_i2_name: "Авторасширение РГО"
 cm__priority_list_i2_desc: "Автоматически расширяет уровни RGO в локациях, где включено авторасширение RGO, при наличии свободных рабочих и ресурсов."
 cm__priority_list_i3_name: "Автостроительство"
 cm__priority_list_i3_desc: "Автоматически строит столичные здания и здания, строящиеся по одному на локацию (ратуши, библиотеки и т. д.), в порядке и с настройками, заданными на вкладке «Автостроительство»."
 cm__priority_list_i4_name: "Авто-продовольствие"
 cm__priority_list_i4_desc: "Автоматически строит производящие еду RGO и здания в сельских локациях, выбирая наиболее эффективный вариант. Настраивается на вкладке «Авто-еда»."
 cm__priority_list_i5_name: "Автоурбанизация"
 cm__priority_list_i5_desc: "Ежемесячно повышает ранги локаций: сельские поселения до городков, городки до городов, а города до мегаполисов. Пропускает захваченные локации. Настраивается на вкладке «Автоурбанизация»."
 cm__priority_list_i6_name: "Автоматически улучшать все здания"
 cm__priority_list_i6_desc: "Автоматически улучшает каждое здание, ставшее устаревшим, независимо от того, включено ли для него авторасширение."
 cm__priority_list__enabled_name: "Включено"
 cm__priority_list__enabled_desc: "Включить или отключить эту функцию."
 cm__priority_list__min_profit_name: "Минимальный налоговый доход"
 cm__priority_list__min_profit_desc: "Минимальный ежемесячный доход золота на уровень, необходимый для постановки строительства в очередь. Установите 0, чтобы отключить проверку."
 cm__priority_list__min_profit_postfix: "@gold!"
 cm__priority_list__min_discount_name: "Мин. скидка"
 cm__priority_list__min_discount_desc: "Максимально допустимая наценка на строительные материалы. При -33% строительство ведется только тогда, когда цена материалов на 33% ниже базовой. При 0% — только по базовой цене или ниже. При +33% строительство ведется, даже если цены на 33% выше базовых."
 cm__priority_list__min_discount_prefix_high: "#R "
 cm__priority_list__min_discount_postfix_high: "%#!"
 cm__priority_list__min_discount_prefix_low: "#G "
 cm__priority_list__min_discount_postfix_low: "%#!"

