l_russian:
 # Mod
 cm_name: "Менеджер строительства"
 cm_desc: "Масштабный мод, повышающий удобство игры и добавляющий новые инструменты автоматизации, фильтры и режимы карты для значительного улучшения процесса строительства в EU5."

 # Settings (settings) Tab
 ## Global Control (settings) Group
 cm__pause_auto_expand_name: "Приостановить автоматизацию"
 cm__pause_auto_expand_desc: "Приостанавливает все функции автоматизации, добавляемые этим модом."
 cm__minimum_gold_name: "Золотой запас"
 cm__minimum_gold_desc: "Автоматизация не расходует средства казны ниже этой суммы."
 cm__minimum_gold_format: "[CMMV('cm__minimum_gold')]@gold!"
 cm__allowed_building_overbuild_levels_name: "Лимит избыточного строительства"
 cm__allowed_building_overbuild_levels_desc: "На сколько суммарных уровней зданий локация может превысить свой предел поддерживаемых уровней зданий, прежде чем новые постройки перестанут добавляться в очередь. Продовольствие, губернаторы и здания в локациях других стран являются исключениями. При значении 0 избыточное строительство запрещено. При значении 200+ ограничений нет."

 ## Priority List Group
 cm__priority_list_item_column_name: "Особенность"
 cm__priority_list_i1_name: "Здания с включённым авторасширением"
 cm__priority_list_i1_desc: "Автоматически расширяет многоуровневые производственные и непроизводственные здания, если это прибыльно, есть доступное население и золото остается выше вашего золотого запаса. Применяется там, где авторасширение включено для локации или целого типа зданий, включая иностранные здания в локациях других стран."
 cm__priority_list_i2_name: "РДО с включенным авторасширением"
 cm__priority_list_i2_desc: "Автоматически расширяет уровни RGO в локациях, где включено авторасширение RGO, при наличии свободных рабочих и ресурсов."
 cm__priority_list_i3_name: "Авторасширение еды во включённых локациях"
 cm__priority_list_i3_desc: "Автоматически строит производящие пищу РП и здания в сельских локациях с включенной функцией «Авто-еда», выбирая наиболее эффективный вариант."
 cm__priority_list_i4_name: "Автоматически улучшать все здания"
 cm__priority_list_i4_desc: "Автоматически улучшает каждое здание, которое стало устаревшим, независимо от того, включено ли для него авторасширение."
 cm__priority_list__enabled_name: "$cm_txt_enabled$"
 cm__priority_list__enabled_desc: "Включить или отключить эту функцию."
 cm__priority_list__min_profit_name: "Минимальный налоговый доход"
 cm__priority_list__min_profit_desc: "Минимальный ежемесячный доход золота на уровень, необходимый для постановки строительства в очередь. Установите 0, чтобы отключить проверку."
 cm__priority_list__min_profit_postfix: "@gold!"
 cm__priority_list__min_discount_name: "$cm_txt_min_discount$"
 cm__priority_list__min_discount_desc: "$cm_txt_min_discount_desc$"
 cm__priority_list__min_discount_prefix_high: "#R "
 cm__priority_list__min_discount_postfix_high: "%#!"
 cm__priority_list__min_discount_prefix_low: "#G "
 cm__priority_list__min_discount_postfix_low: "%#!"

