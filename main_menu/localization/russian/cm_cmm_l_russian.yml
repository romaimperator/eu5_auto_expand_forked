 cm__auto_town_rights_list_i37_name: "@agrarian_community_town_right! [ShowTownRightsName('agrarian_community_town_right')]"
 cm__auto_town_rights_list_i38_name: "@enlightened_leadership_reform_town_right! [ShowTownRightsName('enlightened_leadership_reform_town_right')]"
 cm__expand_metric: "cm__expand_metric"
 cm__town_rights_free_grants_name: "Убрать стоимость городских прав"
 cm__town_rights_free_grants_desc: "Если включено, предоставление городских прав не требует государственной мощи, а их отзыв не стоит стабильности."
 cm__town_rights_min_gov_power_name: "Минимальная государственная мощь"
 cm__town_rights_min_gov_power_desc: "Автоматическое дарование перестает выдавать городские права, если следующее дарование снизит вашу государственную власть (легитимность, республиканские традиции, преданность или ордынское единство, в зависимости от типа правительства) ниже этого значения."
 cm__allowed_building_overbuild_levels_format: "[CMMV('cm__allowed_building_overbuild_levels')][Select_CString(GreaterThanOrEqualTo_CFixedPoint(CMMV('cm__allowed_building_overbuild_levels'), CMMMapValue('cmm_max', 'cm__allowed_building_overbuild_levels')), '+', '')]"
 cm__auto_build_capital_name: "Столичные здания"
 cm__auto_build_capital_desc: "Автоматически строит здания, доступные только в столице (королевский двор, верховный суд, военная академия и т. д.), в локации вашей столицы, когда позволяют условия. Они строятся раньше зданий из списка ниже."
 cm__urbanize_city_to_megalopolis_name: "Город в мегалополис"
 cm__urbanize_city_to_megalopolis_desc: "Улучшите свою столицу до мегалополиса, как только она станет рыночным центром с населением не менее 400 000 человек."
 cm__megalopolis_ignore_capital_name: "Мегаполис: игнорировать требование столицы"
 cm__megalopolis_ignore_capital_desc: "Позволяет основать мегаполис в городе, не являющемся вашей столицей."
 cm__megalopolis_ignore_market_center_name: "Мегалополис: игнорировать требование рыночного центра"
 cm__megalopolis_ignore_market_center_desc: "Позволяет основать мегаполис в городе, который не является рыночным центром."
 cm__deurbanize_name: "Деурбанизировать"
 cm__deurbanize_desc: "Каждый месяц понижать статус подконтрольных локаций до сельских поселений, если производимый в них товар RGO отмечен в списке «Не урбанизировать» ниже. Ваша столица, завоеванные локации и локации, обеспечивающие близость (Proximity), такие как резиденции губернатора, затронуты не будут."
 cm__auto_urbanize_ignore_list_i20_name: "@wool! [ShowGoodsName('wool')] ([GetGlobalVariable('cm_goods_wool').GetGoods.GetDefaultMarketPrice]@gold!)"
 cm__full_automation_name: "Полная автоматизация"
 cm__full_automation__full_automation_name: "Полная автоматизация"
 cm__full_automation__full_automation_desc: "Автоматическое строительство. Каждый месяц категории ниже тратят средства из казны сверх золотого резерва на лучшие из доступных построек. Работает параллельно с другими функциями автоматизации, не затрагивая их настройки."
 cm__fa_enabled_name: "Включить полную автоматизацию"
 cm__fa_enabled_desc: "Включить или выключить полную автоматизацию."
 cm__fa_reserve_name: "Золотой запас"
 cm__fa_reserve_desc: "Полная автоматизация никогда не расходует казну ниже этой суммы. Отдельно от Золотого запаса на вкладке настроек."
 cm__fa_reserve_format: "[CMMV('cm__fa_reserve')]@gold!"
 cm__fa_save_unaffordable_name: "Копить на недоступные здания"
 cm__fa_save_unaffordable_desc: "Категория покупает лучшее найденное здание, даже если оно стоит больше её месячной доли, а затем ничего не строит, пока разница не будет восполнена в последующие месяцы. В выключенном состоянии каждая категория тратит столько, сколько может, и передаёт остаток дальше."
 cm__full_automation__fa_priority_list_name: "Приоритеты"
 cm__full_automation__fa_priority_list_desc: "Перетащите, чтобы изменить порядок. Категории обрабатываются сверху вниз каждый месяц. Если две категории претендуют на одно и то же здание, его строит та, что находится выше."
 cm__fa_priority_list_item_column_name: "Категория"
 cm__fa_priority_list_i1_name: "Продовольствие"
 cm__fa_priority_list_i1_desc: "Отслеживает годовой запас продовольствия на рынках, торговыми центрами которых вы владеете, и в случаях, когда медианный показатель месяца оказался дефицитным, включает авто-производство пищи в локациях с самым высоким потенциалом. Выбранные локации подсвечиваются так же, как включенные игроком, но переключатель остается под вашим контролем; они никогда не отключаются, пока локация остается вашим сельским поселением и вы владеете её торговым центром."
 cm__fa_priority_list_i2_name: "Промышленность"
 cm__fa_priority_list_i2_desc: "Строит, расширяет и улучшает производственные здания и РГО, которые быстрее всего окупают свою стоимость за счёт налоговых доходов. Локации с автоматическим производством еды не затрагиваются, если там уже наблюдается нехватка рабочих любого типа."
 cm__fa_priority_list_i3_name: "Ценовой коллапс"
 cm__fa_priority_list_i3_desc: "Расширяет производство строительных материалов, чтобы снизить цены на них. Работает на рынках, чей рыночный центр принадлежит вам. В первую очередь расширяются наиболее эффективные локации, каждой из которых добавляется сразу несколько уровней; производство запускается даже там, где рабочие еще не прибыли. Ваша столица, локации, производящие еду, и предприятия, которые были бы убыточными без субсидий, пропускаются."
 cm__fa_priority_list_i4_name: "Дороги"
 cm__fa_priority_list_i4_desc: "Строит дорожную сеть с наиболее выгодным соотношением цены и результата по трем параметрам: Близость, Доступ к рынку и связь локации со столицей. Раз в год система определяет оптимальный маршрут к каждой вашей локации для каждой из этих целей, после чего ежемесячно начинает строительство участков, обеспечивающих наибольший прирост Налоговой базы (с учетом всех последующих точек маршрута). Сначала прокладываются дешевые равнинные коридоры; две нижестоящие цели получают золото только в те месяцы, когда у вышестоящей не осталось доступных участков."
 cm__fa_priority_list_i5_name: "Коммунальные службы"
 cm__fa_priority_list_i5_desc: "Строит вспомогательную инфраструктуру везде, где это возможно: столичные здания, список автостроительства, ртутные патио, здания торговых центров, бейлифов и любые уникальные здания вашей страны, повышающие контроль, рынки, здания, повышающие сопротивляемость болезням, и в последнюю очередь амбары. Здания контроля в первую очередь строятся в самых богатых локациях, а рынки — в локациях с самым низким доступом к рынку."
 cm__fa_priority_list_i6_name: "Очистка зданий"
 cm__fa_priority_list_i6_desc: "Раз в год закрывает производственные здания, которые перестали приносить доход и не субсидируются, и вместо этого сносит их, если локация находится в пределах десяти уровней от поддерживаемых уровней зданий. Закрытые здания открываются снова, как только данный тип зданий снова станет прибыльным на этом рынке, и сносятся позже, если в локации закончится место. @farming_village! [ShowBuildingTypeNameWithNoTooltip('farming_village')] никогда не закрывается и не сносится."
 cm__fa_priority_list_i7_name: "Губернаторы"
 cm__fa_priority_list_i7_desc: "Планирует размещение ваших губернаторов и назначает их на должности, начиная с наиболее выгодных локаций. Повторно планирует при каждом освобождении ячейки губернатора, а в остальных случаях — каждые двадцать пять лет. Только для одиночной игры."
 cm__fa_priority_list_i8_name: "Городские права"
 cm__fa_priority_list_i8_desc: "Предоставляет городские права вашим городкам и городам. Сначала идет [ShowTownRightsNameWithNoTooltip('granary_town')], затем — одно право на специализацию, выбираемое случайным образом из тех, что подходят для товаров, производимых в этой локации."
 cm__fa_priority_list__budget_name: "Доля бюджета"
 cm__fa_priority_list__budget_desc: "Доля казны сверх золотого резерва, которую эта категория может расходовать каждый месяц."
 cm__fa_priority_list__budget_postfix: "%"
 cm__fa_priority_list__enabled_name: "Включено"
 cm__fa_priority_list__enabled_desc: "Разрешить строительство в этой категории."
 cm__full_automation__fa_industry_name: "Промышленность"
 cm__full_automation__fa_industry_desc: "Настройки для категории промышленности выше."
 cm__fa_industry_algorithm_name: "Стратегия строительства"
 cm__fa_industry_algorithm_desc: "Как промышленность выбирает, что строить."
 cm__fa_industry_algorithm_option_1_name: "Жадный"
 cm__fa_industry_algorithm_option_1_desc: "Строить в первую очередь наиболее быстроокупаемые варианты и только те, что находятся вблизи лучшего из найденных мест для производства таких же товаров."
 cm__fa_industry_max_rel_roi_name: "Макс. относительная окупаемость"
 cm__fa_industry_max_rel_roi_desc: "Насколько медленнее, чем в лучшем найденном месте для производства того же товара, здание или улучшение может окупать свою стоимость и при этом всё равно строиться. При 30%, если лучшее место окупается за 10 лет, будут построены только те, что окупаются в течение 13 лет; всё, что медленнее, будет ждать. При 0% каждый месяц строится только лучший производитель для каждого товара. При 100%+ ограничений нет, и действует только «Макс. лет окупаемости». Все здания, производящие один и тот же товар, оцениваются вместе, независимо от их типа. Расширения РГО всегда строятся в порядке окупаемости."
 cm__fa_industry_max_rel_roi_format: "[CMMV('cm__fa_industry_max_rel_roi')]%[Select_CString(GreaterThanOrEqualTo_CFixedPoint(CMMV('cm__fa_industry_max_rel_roi'), CMMMapValue('cmm_max', 'cm__fa_industry_max_rel_roi')), '+', '')]"
 cm__fa_industry_min_roi_name: "Максимальный срок окупаемости (лет)"
 cm__fa_industry_min_roi_desc: "Рассматриваются только те постройки, налоговый доход которых окупает стоимость строительства за указанное количество лет. Установите 0, чтобы отключить проверку."
 cm__fa_industry_min_roi_format: "[CMMV('cm__fa_industry_min_roi')]г @efficiency!"
 cm__full_automation__fa_collapsar_name: "Коллапсар цен"
 cm__full_automation__fa_collapsar_desc: "Настройки для категории «Ценовой коллапсар» выше. Материалы обрабатываются сверху вниз по списку, при этом РГО расширяются раньше производственных зданий."
 cm__fa_collapsar_target_name: "Целевая цена"
 cm__fa_collapsar_target_desc: "Цена, при которой прекращается строительство для материала, относительно его базовой цены. При -33% предприятия строятся до тех пор, пока материал не будет торговаться на 33% ниже базовой цены. При 0% — до достижения базовой цены. При +33% — только до тех пор, пока он стоит более чем на 33% выше базовой."
 cm__fa_collapsar_target_format: "[CMMV('cm__fa_collapsar_target')]%"
 cm__fa_collapsar_item_column_name: "Материал"
 cm__fa_collapsar_i1_name: "@masonry! [ShowGoodsName('masonry')]"
 cm__fa_collapsar_i2_name: "@lumber! [ShowGoodsName('lumber')]"
 cm__fa_collapsar_i3_name: "@sand! [ShowGoodsName('sand')]"
 cm__fa_collapsar_i4_name: "@glass! [ShowGoodsName('glass')]"
 cm__fa_collapsar__enabled_name: "Включено"
 cm__fa_collapsar__enabled_desc: "Работайте над снижением цены на этот материал."
 cm__full_automation__fa_food_name: "Продовольствие"
 cm__full_automation__fa_food_desc: "Настройки для категории «Продовольствие» выше."
 cm__fa_food_target_name: "Целевой излишек"
 cm__fa_food_target_desc: "Рынок получает дополнительные пищевые локации, пока его предложение не достигнет этой доли от спроса. При 125% производство еды расширяется на любом рынке, где в медианный месяц года не был достигнут 25% профицит. Увеличьте это значение, чтобы поддерживать больший запас, или уменьшите его, чтобы помогать только рынкам, близким к дефициту."
 cm__fa_food_target_format: "[CMMV('cm__fa_food_target')]%"
 cm__fa_food_min_potential_name: "Минимальный продовольственный потенциал"
 cm__fa_food_min_potential_desc: "Автоматизация продовольствия включается только в локациях, чей потенциал продовольствия на уровень РПО достигает этого значения — того же самого, что отображается в режиме карты $mapmode_cm_location_food_potential_name$. Увеличьте его, чтобы дожидаться более качественных угодий, или понизьте, чтобы задействовать менее плодородные земли."
 cm__fa_food_min_potential_format: "[CMMV('cm__fa_food_min_potential')]"
 cm__full_automation__fa_urban_rights_name: "Городские права"
 cm__full_automation__fa_urban_rights_desc: "Настройки для категории «Городские права» выше."
 cm__fa_urban_rights_window_name: "Порог соответствия"
 cm__fa_urban_rights_window_desc: "Насколько хорошо право на специализацию должно соответствовать локации относительно самого подходящего варианта, чтобы участвовать в отборе. При 50% может быть выбрано любое право, подходящее хотя бы наполовину так же хорошо, при этом более подходящие варианты выпадают чаще. При 100% предоставляется только самое подходящее право."
 cm__fa_urban_rights_window_format: "[CMMV('cm__fa_urban_rights_window')]%"
 cm__fa_urban_rights_reserve_name: "Запас государственной мощи"
 cm__fa_urban_rights_reserve_desc: "Городское право не предоставляется, если плата за него снизит вашу государственную власть (легитимность, республиканские традиции, преданность или единство орды, в зависимости от формы правления) ниже этого значения."
 cm__fa_urban_rights_expand_name: "Расширить стимулируемые отрасли"
 cm__fa_urban_rights_expand_desc: "При предоставлении права на специализацию также включается авторасширение в этой локации для предприятий, которые улучшает это право, и для добычи сырья, производимого в этой локации. Аналогично нажатию правой кнопкой мыши на кнопку предоставления на карте «Рекомендуемые городские права»."
 cm__full_automation__fa_cleanup_name: "Очистка зданий"
 cm__full_automation__fa_cleanup_desc: "Настройки для категории «Очистка зданий» выше."
 cm__fa_cleanup_min_profit_name: "Минимальная прибыль"
 cm__fa_cleanup_min_profit_desc: "Здание, приносящее в месяц меньше этой суммы, считается нерентабельным и закрывается или сносится, если оно не субсидируется. Одновременно на одном рынке может быть закрыто не более половины работающих зданий одного типа."
 cm__fa_cleanup_min_profit_format: "[Divide_CFixedPoint(CMMV('cm__fa_cleanup_min_profit'), '(CFixedPoint)100')|2]@gold!"
 cm__fa_cleanup_core_goods_name: "Приоритизировать строительные материалы"
 cm__fa_cleanup_core_goods_desc: "Удерживать здания, потребляющие в основном @masonry![ShowGoodsNameWithNoTooltip('masonry')], @lumber![ShowGoodsNameWithNoTooltip('lumber')], @sand![ShowGoodsNameWithNoTooltip('sand')] или @glass![ShowGoodsNameWithNoTooltip('glass')], на уровне двойной Минимальной прибыли или 0.1@gold!, в зависимости от того, что больше. Здания, производящие один из этих четырех товаров, оцениваются по обычной Минимальной прибыли."
 cm__fa_cleanup_auto_food_name: "Очистить локации с авто-пищей"
 cm__fa_cleanup_auto_food_desc: "Если активно автопроизводство еды и любые рабочие уже в дефиците, сносить производственные здания, не производящие еду. @market_village! [ShowBuildingTypeNameWithNoTooltip('market_village')] сокращается до одного уровня вместо уничтожения."
 cm__full_automation__fa_roads_name: "Дороги"
 cm__full_automation__fa_roads_desc: "Настройки для категории дорог выше."
 cm__fa_roads_proximity_name: "Близость"
 cm__fa_roads_proximity_desc: "Прокладывать участки дорог, максимально повышающие Близость за золото, с учётом каждой локации дальше по маршруту за ними."
 cm__fa_roads_market_access_name: "Доступ к рынку"
 cm__fa_roads_market_access_desc: "Прокладывать участки дорог, максимально повышающие доступность рынка (Market Access) за вложенное золото. Средства расходуются только в те месяцы, когда не осталось участков для повышения близости (Proximity)."
 cm__fa_roads_capital_name: "Связь со столицей"
 cm__fa_roads_capital_desc: "Прокладывает участки дорог для соединения ваших локаций со столицей, продвигаясь от уже соединённых. Средства тратятся только в те месяцы, когда больше не осталось участков Близости и Доступа к рынку для прокладки."
 cm__full_automation__fa_governors_name: "Губернаторы"
 cm__full_automation__fa_governors_desc: "Настройки для категории «Наместники» выше."
 cm__fa_gov_move_seats_name: "Разрешить перемещение губернаторов"
 cm__fa_gov_move_seats_desc: "Когда все ячейки губернаторов заполнены, снимает губернатора и назначает его в более подходящем месте. Новое место должно уже быть городом или иметь оценку более чем на 10% выше, чем у заменяемого. Если параметр отключен, губернаторы будут назначаться только в пустые ячейки."
 cm__fa_gov_prepare_sites_name: "Разрешить подготовку новых локаций"
 cm__fa_gov_prepare_sites_desc: "Учитывать локации, которые еще не могут принять губернатора, и подготавливать их в первую очередь, основывая там городок или город и прокладывая дорогу до вашей столицы. Если эта опция отключена, будут учитываться только те локации, которые уже являются городом и имеют дорогу до вашей столицы."
 cm__map_modes_name: "Режимы карты"
 cm__map_modes__placement_finder_name: "Рекомендуемое местоположение столицы и губернатора"
 cm__map_modes__placement_finder_desc: "Настройки для режимов карты «Рекомендуемый наместник» и «Рекомендуемое размещение столицы»."
 cm__placement_finder_method_name: "Оценка поиска размещения"
 cm__placement_finder_method_desc: "Как режимы карты «Рекомендуемый губернатор» и «Рекомендуемая столица» ранжируют ваши локации."
 cm__placement_finder_method_option_1_name: "Налоговая база"
 cm__placement_finder_method_option_1_desc: "Сортировать по тому, насколько назначение губернатора или размещение столицы увеличит вашу общую налоговую базу. Более богатые локации имеют больший вес."
 cm__placement_finder_method_option_2_name: "Близость"
 cm__placement_finder_method_option_2_desc: "Сортировать по количеству близости, которую добавит размещение там наместника или столицы."
 cm__placement_finder_roads_name: "Наземная инфраструктура"
 cm__placement_finder_roads_desc: "Будут ли режимы карты «Рекомендуемый наместник» и «Рекомендуемая столица» учитывать идеальную сухопутную инфраструктуру или же использовать фактически построенную."
 cm__placement_finder_roads_option_1_name: "Текущий"
 cm__placement_finder_roads_option_1_desc: "Используйте дороги, которые вы действительно построили."
 cm__placement_finder_roads_option_2_name: "Макс. дорог"
 cm__placement_finder_roads_option_2_desc: "Считается, что лучшая из открытых вами дорог построена на каждом соединении."
 cm__placement_finder_roads_option_3_name: "Наилучший возможный"
 cm__placement_finder_roads_option_3_desc: "Считать, что на каждом соединении построена лучшая из открытых дорог, а каждое открытое здание, улучшающее сухопутную близость, построено во всех подходящих местах."
 cm__placement_finder_naval_name: "Морская инфраструктура"
 cm__placement_finder_naval_desc: "Определяет, будут ли режимы карты «Рекомендуемый наместник» и «Рекомендуемая столица» исходить из идеальной морской инфраструктуры или использовать текущую пропускную способность портов и морское присутствие."
 cm__placement_finder_naval_option_1_name: "Текущее"
 cm__placement_finder_naval_option_1_desc: "Использует вашу текущую вместимость гаваней и морское присутствие."
 cm__placement_finder_naval_option_2_name: "Максимальное присутствие"
 cm__placement_finder_naval_option_2_desc: "Исходить из полного морского присутствия повсюду при текущей вместимости портов."
 cm__placement_finder_naval_option_3_name: "Наилучший из возможных"
 cm__placement_finder_naval_option_3_desc: "Предполагать полное военно-морское присутствие и лучшие из разблокированных вами портовых зданий во всех прибрежных локациях."
 cm__placement_finder_accuracy_name: "Точность поиска"
 cm__placement_finder_accuracy_desc: "Насколько тщательно режимы карты «Рекомендуемый губернатор» и «Рекомендуемая столица» выполняют поиск лучших локаций. Пропущенные локации отображаются чёрным."
 cm__placement_finder_accuracy_option_1_name: "Исчерпывающий"
 cm__placement_finder_accuracy_option_1_desc: "Оценивать каждую локацию. Самый точный и медленный."
 cm__placement_finder_accuracy_option_2_name: "Тщательный"
 cm__placement_finder_accuracy_option_2_desc: "Пропускать локации, которые не могут войти в тройку лучших. Первая тройка и их баллы идентичны режиму «Исчерпывающий», но вычисляются быстрее."
 cm__placement_finder_accuracy_option_3_name: "Сбалансированно"
 cm__placement_finder_accuracy_option_3_desc: "Пропускать локации, которые не могут быть лучшими. Определение лучшей локации по-прежнему гарантированно точно; маркеры 2-го и 3-го мест могут иногда различаться."
 cm__placement_finder_accuracy_option_4_name: "Быстро"
 cm__placement_finder_accuracy_option_4_desc: "Также пропускать локации, вероятность которых стать лучшими крайне мала. Найденная лучшая локация находится в пределах 20% от истинно лучшей и обычно всё равно будет точной."
 cm__placement_finder_accuracy_option_5_name: "Самый быстрый"
 cm__placement_finder_accuracy_option_5_desc: "Оценивает наиболее перспективную локацию в каждой провинции, затем проводит уточнение среди лидеров. Значительно быстрее для больших стран; может упустить наилучшую локацию."
 cm__debug_name: "Отладка"
 cm__debug__logging_name: "Журнал действий"
 cm__debug__logging_desc: "Какие действия этого мода записываются в журнал действий мода."
 cm__log_cycle_name: "Цикл строительства"
 cm__log_cycle_desc: "Строки ежемесячного цикла, пропущенного из-за того, что предыдущий еще не завершился, и сброса после двух пропусков подряд."
 cm__log_industry_name: "Промышленность"
 cm__log_industry_desc: "Строки для каждого здания, которое категория «Промышленность» ставит в очередь, и каждого рассматриваемого расширения добычи сырья, с указанием окупаемости и дохода для каждого из них."
 cm__log_collapsar_name: "Ценовой коллапс"
 cm__log_collapsar_desc: "Строки, отслеживающие одну локацию на протяжении цикла Price Collapsar: дефицит рынка и запрошенные уровни, а затем то, что было выделено локации, её оценка и то, что было построено. Сначала пометьте локацию с помощью консольной команды effect location:<key> = { cm_fa_col_watch_on = yes }."
 cm__log_food_name: "Авто-продовольствие"
 cm__log_food_desc: "Строки для категории «Продовольствие»: ежемесячное предложение, спрос и соотношение продовольствия на каждом рынке, годовая медиана, по которой это соотношение оценивается относительно целевого показателя, количество локаций, уже производящих там продовольствие, и каждая локация, которую это включает или отключает."
 cm__log_roads_name: "Дороги"
 cm__log_roads_desc: "По одной строке для каждой дороги, заказанной в категории «Дороги», с указанием локации, одной из трех целей покупки и стоимости."
 cm__log_cleanup_name: "Очистка зданий"
 cm__log_cleanup_desc: "Строки ежегодного цикла очистки зданий и каждого здания, которое он закрывает, сокращает, сносит или открывает заново, с указанием прибыли по каждому из них и порога, относительно которого они оценивались."
 cm__log_governors_name: "Губернаторы"
 cm__log_governors_desc: "Строки плана губернатора: выбранные и отмененные площадки, улучшения городков и городов, размещения, переносы и отказы, а также перенос столицы удачливой державы."
 cm__log_military_name: "Армия удачливой державы"
 cm__log_military_desc: "Строки для удачливой державы: снос крепостей и строительство зданий на рекрутов."
 cm__log_government_name: "Правительство счастливой державы"
 cm__log_government_desc: "Строки для удачливой державы при упразднении бюрократии или совершении действия сословия."
 cm__debug__diagnostics_name: "Диагностика"
 cm__placement_finder_debug_path_name: "Включить отладочную диагностику"
 cm__placement_finder_debug_path_desc: "Добавляет диагностический блок в подсказки режимов карты «Рекомендуемый губернатор» и «Рекомендуемая столица»: прогнозируемый маршрут от вашей столицы до каждой локации со стоимостью каждого перехода, а также прогнозируемую близость в сравнении с вашей фактической близостью."
 cm__debug__probes_name: "Пробы"
 cm__debug__probes_desc: "Разовая диагностика, записываемая в журнал действий мода."
 cm__probe_budget_name: "Бюджет полной автоматизации"
 cm__probe_budget_desc: "Баланс каждой категории полной автоматизации: положительный, если золото откладывается на вариант, который она пока не может себе позволить, и отрицательный при задолженности из-за перерасхода; также указаны лимит окупаемости промышленности и лучший кандидат, ожидающий на рынке, пропущенном в этом цикле."
 cm__probe_budget_text: "Запустить"
 cm__probe_governors_name: "План губернатора"
 cm__probe_governors_desc: "Статус выполнения плана губернатора: его фаза, сколько участков занято и сколько еще предстоит разместить, использует ли он казну, оплаченные губернаторы, а также лимиты слотов и мест, в рамках которых он работает."
 cm__probe_governors_text: "Запустить"
 cm__probe_military_name: "Армия удачливых держав"
 cm__probe_military_desc: "Уровень зданий для рекрутов, на котором находится страна, возможность их постройки, состояние столичной пары, военный бюджет и количество локаций, которые могут принять этот уровень, в сравнении с количеством тех, где он уже есть."
 cm__probe_military_text: "Запустить"
 cm__probe_industry_anchors_name: "Промышленные якоря"
 cm__probe_industry_anchors_desc: "Одна строка на товар с лучшей окупаемостью, зафиксированной Промышленностью, и установленным лимитом окупаемости, с указанием здания и локации для каждого."
 cm__probe_industry_anchors_text: "Запустить"
 cm__probe_industry_rgo_name: "Промышленное сырье"
 cm__probe_industry_rgo_desc: "По одной строке для каждой причины, по которой промышленность проигнорировала сырьевые товары локации, или одна строка, если причин не было. Считывает показатели столицы, если только вы не пометите локацию консольной командой effect location:<key> = { cm_fa_col_watch_on = yes }."
 cm__probe_industry_rgo_text: "Запустить"
 cm__probe_collapsar_name: "Ценовой коллапсар"
 cm__probe_collapsar_desc: "Все числа, которые Price Collapsar считывает в локации, указаны рядом с собственными значениями игры, а затем — сколько рынок этой локации может поглотить за цикл. Считывает столицу, если только вы не пометили локацию консольной командой effect location:<key> = { cm_fa_col_watch_on = yes }; столица никогда не является кандидатом для Price Collapsar, поэтому пометьте локацию, чтобы увидеть данные для той, в которой он бы строил."
 cm__probe_collapsar_text: "Запустить"
 cm__probe_roads_name: "Дороги"
 cm__probe_roads_desc: "Количество коридоров, удерживаемых планом дорог для близости, доступа к рынку и связи со столицей; сколько из столичных связей уже можно начать; сколько дорог уже строится и остаток в пуле категории."
 cm__probe_roads_text: "Запустить"
 cm__probe_log_gate_name: "Порог журнала действий"
 cm__probe_log_gate_desc: "Категория логов Price Collapsar дважды: так, как её считывает фильтр логов, и так, как её сохраняет меню, чтобы отображалась категория, включённая в одном месте и выключенная в другом."
 cm__probe_log_gate_text: "Запустить"
