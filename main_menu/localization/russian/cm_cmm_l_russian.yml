 cm__general__general_name: "$cm__general_name$" # NO-TRANSLATE
 cm__general__general_desc: "Золотой резерв, лимит избыточного строительства и общая пауза."
 cm__auto_expand_name: "Авторасширение"
 cm__auto_expand__priority_list_name: "Автоматизация строительства"
 cm__auto_expand__priority_list_desc: "Перетащите, чтобы изменить приоритет функций. Каждый месяц включенные функции выполняются сверху вниз."
 cm__auto_expand__debug_name: "$cm_txt_debug$" # NO-TRANSLATE
 cm__dbg_run_expand_buildings_name: "Запустить авторасширение включенных зданий"
 cm__dbg_run_expand_buildings_desc: "$cm_txt_dbg_run_feature_desc$" # NO-TRANSLATE
 cm__dbg_run_expand_buildings_text: "$cm_txt_run_now$" # NO-TRANSLATE
 cm__dbg_run_expand_rgos_name: "Запустить авторасширение включенных добывающих предприятий"
 cm__dbg_run_expand_rgos_desc: "$cm_txt_dbg_run_feature_desc$" # NO-TRANSLATE
 cm__dbg_run_expand_rgos_text: "$cm_txt_run_now$" # NO-TRANSLATE
 cm__dbg_run_auto_food_name: "Запустить авторасширение производства пищи во включенных локациях"
 cm__dbg_run_auto_food_desc: "$cm_txt_dbg_run_feature_desc$" # NO-TRANSLATE
 cm__dbg_run_auto_food_text: "$cm_txt_run_now$" # NO-TRANSLATE
 cm__dbg_run_upgrade_all_name: "Запустить автоулучшение всех зданий"
 cm__dbg_run_upgrade_all_desc: "$cm_txt_dbg_run_feature_desc$" # NO-TRANSLATE
 cm__dbg_run_upgrade_all_text: "$cm_txt_run_now$" # NO-TRANSLATE
 cm__ab_master_name: "Панель управления"
 cm__ab_custom_name: "Пользовательский"
 cm__ab_core_name: "Основные товары"
 cm__ab_food_name: "Продовольствие"
 cm__ab_production_name: "Производство"
 cm__ab_roads_name: "Дороги"
 cm__ab_governors_name: "Губернаторы"
 cm__ab_master__ab_master_name: "$cm__ab_master_name$" # NO-TRANSLATE
 cm__ab_master__ab_master_desc: "Автоматизированное строительство. Каждый месяц указанные ниже категории тратят средства из казны сверх золотого резерва на лучшие из доступных построек. Работает параллельно с другими функциями автоматизации, не затрагивая их настройки."
 cm__ab_enabled_name: "Включить автостроительство"
 cm__ab_enabled_desc: "Включить или выключить автостроительство."
 cm__ab_save_unaffordable_name: "Копить на недоступные здания"
 cm__ab_save_unaffordable_desc: "Категория покупает лучшее из найденных зданий, даже если оно стоит больше её месячной доли, а затем ничего не строит, пока разница не будет восполнена в последующие месяцы. Если эта опция отключена, категория не покупает ничего, что не может оплатить сразу."
 cm__ab_min_proximity_name: "Минимальная близость"
 cm__ab_min_proximity_desc: "Локации с Близостью ниже этого значения пропускаются при выборе места для строительства. Здания управления и @settlement_building! [ShowBuildingTypeNameWithNoTooltip('settlement_building')] строятся в любом случае, так как именно они делают земли с низкой Близостью ценными для владения. При 0 ничего не пропускается."
 cm__ab_min_proximity_format: "[CMMV('cm__ab_min_proximity')]%" # NO-TRANSLATE
 cm__ab_master__ab_priority_list_name: "Категории автостроительства"
 cm__ab_master__ab_priority_list_desc: "Перетащите, чтобы изменить порядок. Категории обрабатываются сверху вниз каждый месяц. Если две категории претендуют на одно и то же здание, его строит та, что выше. Если после распределения золота между всеми категориями остаются излишки, их получает та, что выше."
 cm__ab_priority_list_item_column_name: "Категория"
 cm__ab_priority_list_i1_name: "$cm__ab_custom_name$" # NO-TRANSLATE
 cm__ab_priority_list_i1_desc: "Строит вспомогательную инфраструктуру везде, где это возможно. Сначала возводятся столичные здания, затем здания контроля, затем здания рыночных центров, а затем здания, выбранные вами самостоятельно. Бейлифы направляются в локации с самой дорогой продажей сырья, другие здания контроля — в самые богатые локации, а рынки — в локации с наименьшим доступом к рынку."
 cm__ab_priority_list_i2_name: "$cm__ab_core_name$" # NO-TRANSLATE
 cm__ab_priority_list_i2_desc: "Расширяет производство строительных материалов, чтобы снизить их цены. Работает на рынках, рыночный центр которых принадлежит вам. В первую очередь выбираются наиболее эффективные локации, каждой из которых добавляется сразу несколько уровней; производство запускается даже там, где рабочие ещё не прибыли. Ваша столица, локации, производящие пищу, и предприятия, которые были бы убыточны без субсидий, пропускаются."
 cm__ab_priority_list_i3_name: "$cm__ab_food_name$" # NO-TRANSLATE
 cm__ab_priority_list_i3_desc: "Отслеживает предложение продовольствия в течение года на рынках, рыночными центрами которых вы владеете, и там, где показатели медианного месяца оказались недостаточными, включает автопроизводство еды в локациях с наибольшим потенциалом. Выбранные локации подсвечиваются так же, как включенные игроком, но переключатель остается под вашим контролем; они никогда не отключаются, если только локация не перестанет быть вашим сельским поселением, вы не перестанете владеть её рыночным центром или более подходящая локация на том же рынке не займет её место."
 cm__ab_priority_list_i4_name: "$cm__ab_production_name$" # NO-TRANSLATE
 cm__ab_priority_list_i4_desc: "Строит, расширяет и улучшает производственные здания и RGO, которые быстрее всего окупают свою стоимость за счёт налоговых доходов. Локации с автоматическим производством пищи не затрагиваются, пока там наблюдается нехватка работников любого типа."
 cm__ab_priority_list_i5_name: "$cm__ab_roads_name$" # NO-TRANSLATE
 cm__ab_priority_list_i5_desc: "Строит дорожную сеть с наилучшим соотношением цены и качества по трем параметрам, которые обеспечивают дороги: Близость, Доступ к рынку и связь локации со столицей. Раз в четыре года, а также при переносе столицы, система определяет оптимальный маршрут до каждой вашей локации по каждому из параметров и выстраивает участки в очередь согласно приросту налоговой базы, который они принесут (с учетом всех последующих участков на пути за ними); в многопользовательской игре это происходит только при нажатии кнопки «Принудительно перепланировать дороги». Каждый месяц система продвигается по списку и останавливается на первом участке, который не может начать строить, вместо того чтобы пропустить его. Дешевые равнинные коридоры прокладываются первыми, а нижестоящий участок получает золото только в том месяце, когда вышестоящий ничего не построил и не копит на отрезок, который пока не может себе позволить."
 cm__ab_priority_list_i6_name: "$cm__ab_governors_name$" # NO-TRANSLATE
 cm__ab_priority_list_i6_desc: "Планирует размещение ваших губернаторов и назначает их, выбирая лучшие локации в первую очередь. Повторное планирование происходит при каждом освобождении слота губернатора, а в остальных случаях — каждые двадцать пять лет. Только для одиночной игры."
 cm__ab_priority_list__budget_name: "Доля бюджета"
 cm__ab_priority_list__budget_desc: "Доля казны сверх Золотого запаса, выделяемая этой категории каждый месяц. Это скорее нижний порог, а не ограничение: золото, не потраченное категориями, снова распределяется с начала списка, поэтому категория может строить на суммы, значительно превышающие её долю, если нижестоящим категориям нечего покупать."
 cm__ab_priority_list__budget_postfix: "%" # NO-TRANSLATE
 cm__ab_priority_list__enabled_name: "$cm_txt_enabled$" # NO-TRANSLATE
 cm__ab_priority_list__enabled_desc: "Разрешить строительство в этой категории."
 cm__ab_priority_list__settings_name: "Настройки"
 cm__ab_priority_list__settings_desc: "Перейти к настройкам этой категории."
 cm__ab_priority_list__settings_text: "Открыть"
 cm__ab_master__debug_name: "$cm_txt_debug$" # NO-TRANSLATE
 cm__dbg_run_auto_build_name: "Запустить автостроительство"
 cm__dbg_run_auto_build_desc: "Теперь обрабатывает каждую включенную категорию по списку сразу, не дожидаясь начала нового месяца. Каждая категория расходует остаток своей доли, поэтому категория, уже исчерпавшая месячный лимит, ничего не строит. «Приостановка автоматизации» не блокирует это действие."
 cm__dbg_run_auto_build_text: "$cm_txt_run_now$" # NO-TRANSLATE
 cm__ab_custom__ab_custom_name: "$cm__ab_custom_name$" # NO-TRANSLATE
 cm__ab_custom__ab_custom_desc: "Наборы обрабатываются сверху вниз каждый месяц, поэтому те, что находятся выше, забирают золото первыми."
 cm__ab_custom_item_column_name: "Здания"
 cm__ab_custom_i1_name: "Столичные здания"
 cm__ab_custom_i1_desc: "Стройте в столице здания, предназначенные только для столицы: королевский двор, верховный суд, военную академию и прочие. Они возводятся в первую очередь среди зданий этой категории."
 cm__ab_custom_i2_name: "Управление зданиями"
 cm__ab_custom_i2_desc: "Стройте приставов там, где сырье продается дороже всего, а также любые уникальные здания вашей страны, повышающие контроль, в самых богатых локациях. Локация получает все доступные ей уникальные здания, прежде чем очередь перейдет к следующей."
 cm__ab_custom_i3_name: "Здания рыночного центра"
 cm__ab_custom_i3_desc: "Строить здания, которые окупаются в рыночном центре, в каждом вашем рыночном центре."
 cm__ab_custom_i4_name: "Выбрать здания"
 cm__ab_custom_i4_desc: "Постройте здания, перечисленные ниже."
 cm__ab_custom__enabled_name: "$cm_txt_enabled$" # NO-TRANSLATE
 cm__ab_custom__enabled_desc: "Построить этот набор"
 cm__ab_custom__auto_build_list_name: "$cm__ab_custom_i4_name$" # NO-TRANSLATE
 cm__ab_custom__auto_build_list_desc: "Перетащите, чтобы изменить порядок. Здания обрабатываются сверху вниз каждый месяц, поэтому те, что находятся выше, забирают золото первыми."
