 cm__auto_town_rights_list_i38_name: "@enlightened_leadership_reform_town_right! [ShowTownRightsName('enlightened_leadership_reform_town_right')]"
 cm__expand_metric: "cm__expand_metric"
 cm__town_rights_free_grants_name: "Убрать стоимость городских прав"
 cm__town_rights_free_grants_desc: "Если включено, предоставление городских прав не требует государственной мощи, а их отзыв не стоит стабильности."
 cm__town_rights_min_gov_power_name: "Минимальная государственная мощь"
 cm__town_rights_min_gov_power_desc: "Автоматическое дарование перестает выдавать городские права, если следующее дарование снизит вашу государственную власть (легитимность, республиканские традиции, преданность или ордынское единство, в зависимости от типа правительства) ниже этого значения."
 cm__allowed_building_overbuild_levels_format: "[CMMV('cm__allowed_building_overbuild_levels')][Select_CString(GreaterThanOrEqualTo_CFixedPoint(CMMV('cm__allowed_building_overbuild_levels'), CMMMapValue('cmm_max', 'cm__allowed_building_overbuild_levels')), '+', '')]"
 cm__auto_build_capital_name: "Столичные здания"
 cm__auto_build_capital_desc: "Автоматически строит в вашей столице здания, доступные только для столицы (королевский двор, верховный суд, военную академию и т. д.), когда позволяют условия. Они строятся раньше зданий из списка ниже."
 cm__urbanize_city_to_megalopolis_name: "Город в мегаполис"
 cm__urbanize_city_to_megalopolis_desc: "Улучшите свою столицу до мегалополиса, как только она станет городом — рыночным центром с населением не менее 400 000 человек."
 cm__megalopolis_ignore_capital_name: "Мегалополис: игнорировать требование столицы"
 cm__megalopolis_ignore_capital_desc: "Позволяет построить «Основать мегаполис» в городе, не являющемся вашей столицей."
 cm__megalopolis_ignore_market_center_name: "Мегаполис: игнорировать требование рыночного центра"
 cm__megalopolis_ignore_market_center_desc: "Позволяет основать мегаполис в городе, который не является торговым центром."
 cm__deurbanize_name: "Деурбанизировать"
 cm__deurbanize_desc: "Каждый месяц понижать статус подконтрольных локаций до сельских поселений, если производимый в них ресурс RGO отмечен в нижеуказанном списке «Не урбанизировать». Ваша столица, завоеванные локации и локации, обеспечивающие близость (например, резиденции губернаторов), затронуты не будут."
 cm__auto_urbanize_ignore_list_i20_name: "@wool! [ShowGoodsName('wool')] ([GetGlobalVariable('cm_goods_wool').GetGoods.GetDefaultMarketPrice]@gold!)"
 cm__full_automation_name: "Полная автоматизация"
 cm__full_automation__full_automation_name: "Полная автоматизация"
 cm__full_automation__full_automation_desc: "Автоматическое строительство. Каждый месяц указанные ниже категории расходуют средства из казны сверх золотого резерва на лучшие доступные постройки. Работает параллельно с другими функциями автоматизации, не затрагивая их настройки."
 cm__fa_enabled_name: "Включить полную автоматизацию"
 cm__fa_enabled_desc: "Включить или выключить полную автоматизацию."
 cm__fa_reserve_name: "Золотой запас"
 cm__fa_reserve_desc: "Полная автоматизация никогда не опускает остаток казны ниже этой суммы. Учитывается отдельно от Золотого резерва на вкладке настроек."
 cm__fa_reserve_format: "[CMMV('cm__fa_reserve')]@gold!"
 cm__fa_save_unaffordable_name: "Копить на недоступные здания"
 cm__fa_save_unaffordable_desc: "Категория покупает лучшее найденное здание, даже если оно стоит больше её месячной доли, а затем ничего не строит, пока разница не будет восполнена в последующие месяцы. Если эта опция отключена, каждая категория тратит столько, сколько может, и передает остаток ниже."
 cm__full_automation__fa_priority_list_name: "Приоритеты"
 cm__full_automation__fa_priority_list_desc: "Перетащите, чтобы изменить порядок. Категории обрабатываются сверху вниз каждый месяц. Если две категории запрашивают одно и то же здание, строить его будет та, что находится выше."
 cm__fa_priority_list_item_column_name: "Категория"
 cm__fa_priority_list_i1_name: "Продовольствие"
 cm__fa_priority_list_i1_desc: "Отслеживает предложение продовольствия в течение года на рынках, рыночными центрами которых вы владеете, и в тех из них, где медианный месяц показал нехватку, включает автоматизацию продовольствия в локациях с самым высоким потенциалом. Выбранные локации подсвечиваются так же, как включённые игроком, но переключатель остаётся под вашим контролем; они никогда не отключаются, если только локация не перестаёт быть вашим сельским поселением или вы перестаёте владеть её рыночным центром."
 cm__fa_priority_list_i2_name: "Промышленность"
 cm__fa_priority_list_i2_desc: "Строит, расширяет и улучшает производственные здания и ресурсные промыслы, которые быстрее всего окупают свою стоимость за счёт налоговых доходов. Локации с автоматическим производством еды не затрагиваются, если в них уже наблюдается нехватка рабочих любого типа."
 cm__fa_priority_list_i3_name: "Коллапсар цен"
 cm__fa_priority_list_i3_desc: "Расширяет производство строительных материалов для снижения их стоимости. Работает на рынках, торговый центр которых принадлежит вам. Приоритет отдается наиболее эффективным локациям, каждой из которых добавляется сразу несколько уровней; строительство начинается даже там, куда еще не прибыли рабочие. Ваша столица, локации, производящие продовольствие, и предприятия, которые были бы убыточны без субсидий, пропускаются."
 cm__fa_priority_list_i4_name: "Дороги"
 cm__fa_priority_list_i4_desc: "Строит дорожную сеть, максимально эффективную за вложенное золото, исходя из трёх показателей: близости, доступа к рынку и связи локаций со столицей. Раз в год рассчитывается оптимальный маршрут до каждой вашей локации для каждого из них, а затем ежемесячно закладываются участки, дающие наибольший прирост налоговой базы с учётом всех последующих точек маршрута. Сначала прокладываются дешёвые равнинные коридоры; два нижестоящих приоритета получают золото только в те месяцы, когда для вышестоящего не осталось доступных вариантов для строительства."
 cm__fa_priority_list_i5_name: "Коммунальные службы"
 cm__fa_priority_list_i5_desc: "Строит вспомогательную инфраструктуру везде, где это возможно: столичные здания, здания из списка автостроительства, ртутные патио, здания рыночных центров, бейлифов и любые имеющиеся у вашей страны уникальные здания, повышающие контроль, рынки, здания, повышающие сопротивляемость болезням, и в последнюю очередь амбары. Здания контроля в первую очередь строятся в самых богатых локациях, а рынки — в локациях с наименьшим доступом к рынку."
 cm__fa_priority_list_i6_name: "Очистка зданий"
 cm__fa_priority_list_i6_desc: "Раз в год закрывает производственные здания, которые перестали приносить доход и не субсидируются, и вместо этого уничтожает их, если локация находится в пределах десяти уровней от поддерживаемого ею лимита уровней зданий. Закрытые здания открываются снова, как только этот тип зданий вновь станет прибыльным на данном рынке, и уничтожаются позже, если в локации закончится место. @farming_village! [ShowBuildingTypeNameWithNoTooltip('farming_village')] никогда не закрывается и не уничтожается."
 cm__fa_priority_list_i7_name: "Губернаторы"
 cm__fa_priority_list_i7_desc: "Планирует размещение ваших губернаторов и назначает их, выбирая в первую очередь лучшие места. Планирование повторяется при освобождении ячейки губернатора, а в иных случаях — каждые двадцать пять лет. Только для одиночной игры."
 cm__fa_priority_list_i8_name: "Городские права"
 cm__fa_priority_list_i8_desc: "Предоставляет городские права во всех ваших городках и городах. Сначала идет [ShowTownRightsNameWithNoTooltip('granary_town')], затем одно право на специализацию, выбранное случайным образом из тех, что подходят для производимых в этой локации товаров."
 cm__fa_priority_list__budget_name: "Доля бюджета"
 cm__fa_priority_list__budget_desc: "Доля казны сверх золотого запаса, которую эта категория может расходовать каждый месяц."
 cm__fa_priority_list__budget_postfix: "%"
 cm__fa_priority_list__enabled_name: "Включено"
 cm__fa_priority_list__enabled_desc: "Разрешить строительство в этой категории."
 cm__full_automation__fa_industry_name: "Промышленность"
 cm__full_automation__fa_industry_desc: "Настройки для категории «Промышленность» выше."
 cm__fa_industry_algorithm_name: "Стратегия строительства"
 cm__fa_industry_algorithm_desc: "Как промышленность выбирает, что строить."
 cm__fa_industry_algorithm_option_1_name: "Жадный"
 cm__fa_industry_algorithm_option_1_desc: "Строить в первую очередь самые быстроокупаемые варианты и только те, которые находятся рядом с лучшим из найденных мест для производства таких же товаров."
 cm__fa_industry_max_rel_roi_name: "Макс. относительная рентабельность"
 cm__fa_industry_max_rel_roi_desc: "Насколько медленнее (относительно лучшего найденного места для производства тех же товаров) здание или улучшение может окупать свою стоимость, чтобы всё равно быть построенным. При 30%, если лучшее место окупается за 10 лет, будут построены только те объекты, срок окупаемости которых не превышает 13 лет; остальные будут ждать. При 0% каждый месяц строится только лучший производитель для каждого вида товаров. При 100% и выше ограничения нет, и действует только параметр «Макс. годы окупаемости». Все здания, производящие одни и те же товары, оцениваются совместно, независимо от их типа. Расширения РДО всегда строятся в порядке окупаемости."
 cm__fa_industry_max_rel_roi_format: "[CMMV('cm__fa_industry_max_rel_roi')]%[Select_CString(GreaterThanOrEqualTo_CFixedPoint(CMMV('cm__fa_industry_max_rel_roi'), CMMMapValue('cmm_max', 'cm__fa_industry_max_rel_roi')), '+', '')]"
 cm__fa_industry_min_roi_name: "Макс. лет окупаемости"
 cm__fa_industry_min_roi_desc: "Рассматриваются только те постройки, налоговый доход которых окупает стоимость строительства за указанное количество лет. Установите значение 0, чтобы отключить эту проверку."
 cm__fa_industry_min_roi_format: "[CMMV('cm__fa_industry_min_roi')] г. @efficiency!"
 cm__full_automation__fa_collapsar_name: "Ценовой коллапсар"
 cm__full_automation__fa_collapsar_desc: "Настройки для категории Price Collapsar выше. Материалы обрабатываются сверху вниз по списку, при этом RGO расширяются перед производственными зданиями."
 cm__fa_collapsar_target_name: "Целевая цена"
 cm__fa_collapsar_target_desc: "Цена, при которой прекращается строительство для материала, относительно его базовой цены. При -33% производители строятся до тех пор, пока материал не станет торговаться на 33% ниже базовой цены. При 0% — до достижения базовой цены. При +33% — только пока он стоит более чем на 33% выше базовой."
 cm__fa_collapsar_target_format: "[CMMV('cm__fa_collapsar_target')]%"
 cm__fa_collapsar_item_column_name: "Материал"
 cm__fa_collapsar_i1_name: "@masonry! [ShowGoodsName('masonry')]"
 cm__fa_collapsar_i2_name: "@lumber! [ShowGoodsName('lumber')]"
 cm__fa_collapsar_i3_name: "@sand! [ShowGoodsName('sand')]"
 cm__fa_collapsar_i4_name: "@glass! [ShowGoodsName('glass')]"
 cm__fa_collapsar__enabled_name: "Включено"
 cm__fa_collapsar__enabled_desc: "Работать над снижением цены на этот материал."
 cm__full_automation__fa_food_name: "Продовольствие"
 cm__full_automation__fa_food_desc: "Настройки для категории продовольствия выше."
 cm__fa_food_target_name: "Целевой излишек"
 cm__fa_food_target_desc: "Рынок получает дополнительные пищевые локации до тех пор, пока его предложение не достигнет указанной доли от спроса. При значении 125% производство пищи расширяется на любом рынке, где в медианном месяце года не был достигнут излишек в 25%. Увеличьте это значение для создания большего запаса или уменьшите, чтобы помогать только рынкам, близким к дефициту."
 cm__fa_food_target_format: "[CMMV('cm__fa_food_target')]%"
 cm__fa_food_min_potential_name: "Минимальный продовольственный потенциал"
 cm__fa_food_min_potential_desc: "Автоматизация производства пищи включается только в локациях, чей потенциал пищи на уровень RGO достигает этого значения — того же самого, что показывает режим карты $mapmode_cm_location_food_potential_name$. Повысьте его, чтобы дождаться лучших пахотных земель, или понизьте, чтобы допустить менее продуктивные земли."
 cm__fa_food_min_potential_format: "[CMMV('cm__fa_food_min_potential')]"
 cm__full_automation__fa_urban_rights_name: "Городские права"
 cm__full_automation__fa_urban_rights_desc: "Настройки для категории «Городские права» выше."
 cm__fa_urban_rights_window_name: "Порог соответствия"
 cm__fa_urban_rights_window_desc: "Насколько хорошо право на специализацию должно подходить локации относительно самого подходящего варианта, чтобы участвовать в отборе. При 50% может быть выбрано любое право, которое подходит хотя бы наполовину так же хорошо, при этом более подходящие варианты выпадают чаще. При 100% выдается только самое подходящее право."
 cm__fa_urban_rights_window_format: "[CMMV('cm__fa_urban_rights_window')]%"
 cm__fa_urban_rights_reserve_name: "Запас государственной мощи"
 cm__fa_urban_rights_reserve_desc: "Городское право не предоставляется, если плата за него снизит вашу государственную власть (легитимность, республиканские традиции, преданность или сплоченность орды, в зависимости от формы правления) ниже этого значения."
 cm__fa_urban_rights_expand_name: "Расширить приоритетные отрасли"
 cm__fa_urban_rights_expand_desc: "При предоставлении права на специализацию также включается авторасширение в этой локации для предприятий, которые усиливаются данным правом, а также для производимого в ней сырья. Это аналогично нажатию правой кнопкой мыши на кнопку выдачи на карте рекомендованных городских прав."
 cm__full_automation__fa_cleanup_name: "Очистка зданий"
 cm__full_automation__fa_cleanup_desc: "Настройки для категории «Очистка зданий» выше."
 cm__fa_cleanup_min_profit_name: "Минимальная прибыль"
 cm__fa_cleanup_min_profit_desc: "Здание, приносящее в месяц меньше этой суммы, считается нерентабельным и будет закрыто или снесено, если оно не субсидируется. Одновременно может быть закрыто не более половины действующих зданий одного типа на рынке."
 cm__fa_cleanup_min_profit_format: "[Divide_CFixedPoint(CMMV('cm__fa_cleanup_min_profit'), '(CFixedPoint)100')|2]@gold!"
 cm__fa_cleanup_core_goods_name: "Приоритизировать строительные материалы"
 cm__fa_cleanup_core_goods_desc: "Установить для зданий, в основном потребляющих @masonry![ShowGoodsNameWithNoTooltip('masonry')], @lumber![ShowGoodsNameWithNoTooltip('lumber')], @sand![ShowGoodsNameWithNoTooltip('sand')] или @glass![ShowGoodsNameWithNoTooltip('glass')], порог вдвое выше Минимальной прибыли или 0.1@gold!, в зависимости от того, что больше. Здания, производящие один из этих четырёх товаров, оцениваются по обычной Минимальной прибыли."
 cm__fa_cleanup_auto_food_name: "Очистить локации с авто-продовольствием"
 cm__fa_cleanup_auto_food_desc: "Там, где включено авто-обеспечение едой и уже ощущается нехватка рабочих любого типа, уничтожать производственные здания, не производящие еду. @market_village! [ShowBuildingTypeNameWithNoTooltip('market_village')] сокращается до одного уровня вместо уничтожения."
 cm__full_automation__fa_roads_name: "Дороги"
 cm__full_automation__fa_roads_desc: "Настройки для категории дорог выше."
 cm__fa_roads_proximity_name: "Близость"
 cm__fa_roads_proximity_desc: "Прокладывать участки дорог, которые дают наибольший прирост Близости на единицу золота, учитывая все локации далее по маршруту за ними."
 cm__fa_roads_market_access_name: "Доступ к рынку"
 cm__fa_roads_market_access_desc: "Прокладывать участки дорог, которые наиболее эффективно повышают рыночный доступ за свою стоимость. Тратит золото только в те месяцы, когда не осталось доступных участков для улучшения близости."
 cm__fa_roads_capital_name: "Связь со столицей"
 cm__fa_roads_capital_desc: "Прокладывайте участки дорог, чтобы соединить ваши локации со столицей, продвигаясь от уже соединенных мест. Средства тратятся только в те месяцы, когда не осталось доступных участков для улучшения Близости и Доступа к рынку."
 cm__full_automation__fa_governors_name: "Губернаторы"
 cm__full_automation__fa_governors_desc: "Настройки для категории наместников выше."
 cm__fa_gov_move_seats_name: "Разрешить перемещение губернаторов"
 cm__fa_gov_move_seats_desc: "Когда все ячейки губернаторов заполнены, отозвать губернатора и назначить его в более подходящее место. Новое место уже должно быть городом или иметь оценку более чем на 10% выше, чем у заменяемого. Если эта функция отключена, губернаторы назначаются только в пустые ячейки."
 cm__fa_gov_prepare_sites_name: "Разрешить подготовку новых локаций"
 cm__fa_gov_prepare_sites_desc: "Рассматривать локации, которые ещё не могут иметь губернатора, и подготавливать их в первую очередь, основывая там городок или город и прокладывая дорогу к вашей столице. Если параметр отключен, будут учитываться только те локации, которые уже являются городами и имеют дорогу до столицы."
 cm__map_modes_name: "Режимы карты"
 cm__map_modes__placement_finder_name: "Рекомендуемое местоположение столицы и губернатора"
 cm__map_modes__placement_finder_desc: "Настройки для режимов карты «Рекомендуемый губернатор» и «Рекомендуемое размещение столицы»."
 cm__placement_finder_method_name: "Оценка поиска мест размещения"
 cm__placement_finder_method_desc: "Как режимы карты «Рекомендуемый губернатор» и «Рекомендуемая столица» ранжируют ваши локации."
 cm__placement_finder_method_option_1_name: "Налоговая база"
 cm__placement_finder_method_option_1_desc: "Сортировать по тому, насколько назначение губернатора или размещение столицы увеличит вашу общую налоговую базу. Более богатые локации дают больший эффект."
 cm__placement_finder_method_option_2_name: "Близость"
 cm__placement_finder_method_option_2_desc: "Сортировать по количеству близости, которое добавило бы размещение там губернатора или столицы."
 cm__placement_finder_roads_name: "Наземная инфраструктура"
 cm__placement_finder_roads_desc: "Будут ли режимы карты «Рекомендованный губернатор» и «Рекомендованная столица» учитывать идеальную сухопутную инфраструктуру или фактически построенную."
 cm__placement_finder_roads_option_1_name: "Текущий"
 cm__placement_finder_roads_option_1_desc: "Использовать фактически построенные вами дороги."
 cm__placement_finder_roads_option_2_name: "Макс. дорог"
 cm__placement_finder_roads_option_2_desc: "Считать, что на каждом соединении построена лучшая из открытых вами дорог."
 cm__placement_finder_roads_option_3_name: "Наилучший"
 cm__placement_finder_roads_option_3_desc: "Предполагается, что на каждом соединении построена лучшая из открытых вами дорог, а все открытые здания, улучшающие сухопутную близость, построены везде, где это возможно."
 cm__placement_finder_naval_name: "Морская инфраструктура"
 cm__placement_finder_naval_desc: "Определяет, исходят ли режимы карты «Рекомендуемый губернатор» и «Рекомендуемая столица» из идеальной морской инфраструктуры или используют текущую пропускную способность гаваней и морское присутствие."
 cm__placement_finder_naval_option_1_name: "Текущий"
 cm__placement_finder_naval_option_1_desc: "Использует вашу текущую пропускную способность гаваней и морское присутствие."
 cm__placement_finder_naval_option_2_name: "Максимальное присутствие"
 cm__placement_finder_naval_option_2_desc: "Предполагать полное морское присутствие повсеместно при текущей вместимости гаваней."
 cm__placement_finder_naval_option_3_name: "Наилучший из возможных"
 cm__placement_finder_naval_option_3_desc: "Предполагается полное морское присутствие и наличие лучших из открытых портовых зданий в каждой прибрежной локации."
 cm__placement_finder_accuracy_name: "Точность поиска"
 cm__placement_finder_accuracy_desc: "Насколько тщательно режимы карты «Рекомендуемый губернатор» и «Рекомендуемая столица» ищут лучшие локации. Пропущенные места отображаются чёрным цветом."
 cm__placement_finder_accuracy_option_1_name: "Исчерпывающий"
 cm__placement_finder_accuracy_option_1_desc: "Оценивать каждую локацию. Самый точный и самый медленный."
 cm__placement_finder_accuracy_option_2_name: "Тщательный"
 cm__placement_finder_accuracy_option_2_desc: "Пропускать локации, которые не могут войти в тройку лучших. Состав топ-3 и их оценки идентичны режиму «Исчерпывающий», только быстрее."
 cm__placement_finder_accuracy_option_3_name: "Сбалансированный"
 cm__placement_finder_accuracy_option_3_desc: "Пропускать локации, которые заведомо не могут быть лучшими. Определение лучшей локации по-прежнему гарантированно точное; 2-й и 3-й маркеры могут иногда различаться."
 cm__placement_finder_accuracy_option_4_name: "Быстро"
 cm__placement_finder_accuracy_option_4_desc: "Также пропускать локации, которые вряд ли окажутся лучшими. Лучшая найденная локация находится в пределах 20% от истинно лучшей и обычно всё ещё совпадает с ней."
 cm__placement_finder_accuracy_option_5_name: "Самая высокая"
 cm__placement_finder_accuracy_option_5_desc: "Оценивает наиболее перспективную локацию в каждой провинции, затем проводит уточнение среди лидеров. Значительно быстрее для больших стран; может пропустить наилучшую локацию."
 cm__debug_name: "Отладка"
 cm__debug__logging_name: "Журнал действий"
 cm__debug__logging_desc: "Какие из действий этого мода записываются в журнал действий мода."
 cm__log_cycle_name: "Цикл строительства"
 cm__log_cycle_desc: "Строки для ежемесячного цикла, пропущенного из-за незавершённого предыдущего, и для сброса после двух пропусков подряд."
 cm__log_industry_name: "Промышленность"
 cm__log_industry_desc: "Строки для каждого здания, которое ставит в очередь категория «Промышленность», и каждого рассматриваемого расширения добычи сырья, с указанием окупаемости и дохода для каждого из них."
 cm__log_collapsar_name: "Ценовой коллапсар"
 cm__log_collapsar_desc: "Строки, отслеживающие одну локацию на протяжении цикла Price Collapsar: рыночный дефицит и запрошенные им уровни, а затем то, что получила локация, её оценка и постройки. Сначала отметьте локацию с помощью консольной команды effect location:<key> = { cm_fa_col_watch_on = yes }."
 cm__log_food_name: "Авто-продовольствие"
 cm__log_food_desc: "Строки для категории «Еда»: ежемесячное предложение, спрос и соотношение еды на каждом рынке, годовая медиана, по которой это соотношение оценивается относительно цели, количество локаций, уже производящих там еду, и все локации, которые это включает или отключает."
 cm__log_roads_name: "Дороги"
 cm__log_roads_desc: "По одной строке для каждой дороги, заказанной категорией «Дороги», с указанием локации, цели строительства (из трёх возможных) и её стоимости."
 cm__log_cleanup_name: "Очистка зданий"
 cm__log_cleanup_desc: "Записи ежегодного цикла очистки зданий для каждого здания, которое было закрыто, сокращено, снесено или открыто заново, с указанием прибыли каждого из них и минимального порога, по которому проводилась оценка."
 cm__log_governors_name: "Губернаторы"
 cm__log_governors_desc: "Строки для плана губернатора: выбранные и отмененные площадки, улучшения городков и городов, размещение, переносы и отказы, а также перенос столицы удачливой державы."
 cm__log_military_name: "Армия удачливых держав"
 cm__log_military_desc: "Очереди для удачливой державы по сносу крепостей и строительству зданий на рекрутов."
 cm__log_government_name: "Правительство удачливой державы"
 cm__log_government_desc: "Строки для счастливой державы при упразднении бюрократии или выполнении действия сословия."
 cm__debug__diagnostics_name: "Диагностика"
 cm__placement_finder_debug_path_name: "Включить отладочную диагностику"
 cm__placement_finder_debug_path_desc: "Добавляет диагностический блок во всплывающие подсказки режимов карты «Рекомендуемый наместник» и «Рекомендуемая столица»: прогнозируемый маршрут от вашей столицы до каждой локации со стоимостью каждого перехода, а также сравнение прогнозируемой близости с вашей текущей близостью."
 cm__debug__probes_name: "Зонды"
 cm__debug__probes_desc: "Разовая диагностика, записываемая в журнал действий мода."
 cm__probe_budget_name: "Бюджет полной автоматизации"
 cm__probe_budget_desc: "Баланс каждой категории полной автоматизации: положительный, если золото удерживается для выбора, который она пока не может себе позволить, и отрицательный при задолженности из-за перерасхода; также указаны лимит окупаемости промышленности и лучший кандидат, ожидающий на рынке, пропущенном в этом цикле."
 cm__probe_budget_text: "Запустить"
 cm__probe_governors_name: "План губернатора"
 cm__probe_governors_desc: "Текущий прогресс плана губернатора: его фаза, количество закреплённых и оставшихся для размещения площадок, распоряжение казной, оплаченные губернаторы, а также доступные ячейки и места."
 cm__probe_governors_text: "Запустить"
 cm__probe_military_name: "Армия удачливых держав"
 cm__probe_military_desc: "Уровень зданий на рекрутов, на котором находится страна, возможность их строительства, состояние столичной пары, военный бюджет и количество локаций, которые могут принять этот уровень, по отношению к числу тех, где он уже есть."
 cm__probe_military_text: "Запустить"
 cm__probe_industry_anchors_name: "Промышленные якоря"
 cm__probe_industry_anchors_desc: "По одной строке на товар с лучшим зафиксированным промышленностью сроком окупаемости и установленным лимитом, с указанием здания и локации для каждого."
 cm__probe_industry_anchors_text: "Запустить"
 cm__probe_industry_rgo_name: "Промышленное сырье"
 cm__probe_industry_rgo_desc: "По одной строке для каждой причины, по которой промышленность пропустила сырьевые товары локации, или одна строка, если пропусков не было. Считывает показатели столицы, если только вы не пометили локацию консольной командой effect location:<key> = { cm_fa_col_watch_on = yes }."
 cm__probe_industry_rgo_text: "Запустить"
 cm__probe_collapsar_name: "Ценовой коллапсар"
 cm__probe_collapsar_desc: "Все числа, которые Price Collapsar считывает в локации, каждое рядом с собственным значением игры, а затем объем, который рынок локации может поглотить за цикл. Считывает столицу, если только вы не отметите локацию консольной командой effect location:<key> = { cm_fa_col_watch_on = yes }; столица никогда не является кандидатом для Price Collapsar, поэтому отметьте локацию, чтобы увидеть данные там, где он мог бы строить."
 cm__probe_collapsar_text: "Запустить"
 cm__probe_roads_name: "Дороги"
 cm__probe_roads_desc: "Сколько коридоров содержит план дорог для каждого из критериев (близость, доступ к рынку и связь со столицей), сколько из столичных уже можно начать, сколько дорог уже строится и сколько осталось в пуле категории."
 cm__probe_roads_text: "Запустить"
 cm__probe_log_gate_name: "Фильтр журнала действий"
 cm__probe_log_gate_desc: "Категория журнала «Коллапс цен» дважды: так, как её считывает шлюз логов, и так, как её сохраняет меню, чтобы отображалась категория, которая включена в одном месте и выключена в другом."
 cm__probe_log_gate_text: "Запустить"
