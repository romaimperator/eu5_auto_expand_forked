 cm__expand_metric_name: "Метрика авторасширения"
 cm__expand_metric_desc: "Выберите, что авторасширение использует для принятия решения о добавлении уровня здания или РДП."
 cm__expand_metric_option_1_name: "@income! Налоговый доход"
 cm__expand_metric_option_1_desc: "Добавлять новый уровень, только если его ежемесячный налоговый доход не ниже установленного вами Мин. налогового дохода."
 cm__expand_metric_option_2_name: "@wealth! Прибыль"
 cm__expand_metric_option_2_desc: "Добавлять новый уровень только в том случае, если его общая ежемесячная прибыль не меньше установленной вами мин. прибыли."
 cm__expand_metric_option_3_name: "@efficiency! Окупаемость (налоги)"
 cm__expand_metric_option_3_desc: "Добавлять новый уровень только тогда, когда доход от налогов окупает стоимость строительства в течение установленного вами срока «Макс. лет окупаемости»."
 cm__expand_metric_option_4_name: "@efficiency! ROI (Прибыль)"
 cm__expand_metric_option_4_desc: "Добавлять новый уровень только тогда, когда его прибыль окупает стоимость строительства в течение установленного вами Макс. кол-ва лет окупаемости."
