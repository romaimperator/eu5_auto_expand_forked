 cm__auto_food_list__in_subjects_desc: "Также автоматически строить в локациях субъектов."

 # Auto-Urbanize (auto_urbanize) Tab
 cm__auto_urbanize_name: "Авто-урбанизация"
 ## Auto-Urbanize Settings (auto_urbanize) Group
 cm__auto_urbanize__auto_urbanize_name: "Настройки авто-урбанизации"
 cm__auto_urbanize__auto_urbanize_desc: "Выберите, какие повышения ранга локаций проводить каждый месяц."
 cm__urbanize_town_to_city_name: "Из городка в город"
 cm__urbanize_town_to_city_desc: "Ежемесячно повышать подходящие городки до городов."
 cm__urbanize_rural_to_town_name: "Из села в город"
 cm__urbanize_rural_to_town_desc: "Ежемесячно повышает статус подходящих сельских поселений до городов. Требуется 30 000 жителей (сразу дает право на статус города) или численность населения в пределах 1000 от лимита (иначе рост остановится на сельском лимите). Локации, чьи добывающие предприятия (RGO) отмечены в списке исключений ниже, будут пропущены. Локации, охваченные функцией «Массовое авто-производство еды», также пропускаются, чтобы они оставались сельскими и продолжали производить продовольствие."
