 cm__auto_town_rights_name: "Городские права"
 ## Auto-Grant Town Rights (auto_town_rights) Group
 cm__auto_town_rights__auto_town_rights_name: "Автоматическое дарование городских прав"
 cm__auto_town_rights__auto_town_rights_desc: "Каждый месяц подходящим городам и мегаполисам предоставляются включенные городские права в порядке, настроенном ниже. Каждое предоставление стоит государственной мощи."
 cm__auto_grant_town_rights_name: "Включено"
 cm__auto_grant_town_rights_desc: "Включить или отключить этап автоматической выдачи прав. Если функция отключена, список прав ниже игнорируется."
 ## Town Rights Priority (auto_town_rights_list) Group
 cm__auto_town_rights__auto_town_rights_list_name: "Приоритет городских прав"
 cm__auto_town_rights__auto_town_rights_list_desc: "Перетащите для изменения порядка. Каждый месяц активные права предоставляются подходящим городам и мегаполисам в порядке сверху вниз. Каждое предоставление стоит очков управления. Права пропускаются, если локация не интегрирована, уже имеет это право или не имеет свободного слота."
