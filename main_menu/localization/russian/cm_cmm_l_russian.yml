 cm__ab_food__ab_food_name: "$cm__ab_food_name$" # NO-TRANSLATE
 cm__ab_food_target_name: "Целевой избыток"
 cm__ab_food_target_desc: "Рынок получает больше пищевых локаций до тех пор, пока его предложение не достигнет этой доли от спроса. При 125% производство пищи расширяется на любом рынке, где в медианном месяце года не был достигнут излишек в 25%. Увеличьте это значение, чтобы поддерживать больший запас, или уменьшите, чтобы помогать только рынкам, близким к дефициту."
 cm__ab_food_target_format: "[CMMV('cm__ab_food_target')]%" # NO-TRANSLATE
 cm__ab_food_min_potential_name: "Минимальный потенциал продовольствия"
 cm__ab_food_min_potential_desc: "Авто-еда включена только в локациях, чей потенциал производства еды на уровень RGO достигает этого значения — того же, что отображается в режиме карты $mapmode_cm_location_food_potential_name$. Увеличьте его, чтобы дождаться лучших сельхозугодий, или уменьшите, чтобы задействовать менее плодородные земли."
 cm__ab_food_min_potential_format: "[CMMV('cm__ab_food_min_potential')]" # NO-TRANSLATE
 cm__ab_food_subsidize_name: "Субсидировать продовольственные здания"
 cm__ab_food_subsidize_desc: "Субсидировать здания, производящие пищу и возводимые автоматикой. Здание, не приносящее прибыли, никого не нанимает и не производит еду, поэтому фермерская деревня на скудных землях будет простаивать; субсидирование позволяет сохранять штат работников и обеспечивать сбор урожая. Субсидии никогда не отключаются."
 cm__ab_food_run_now_name: "Принудительно перепланировать продовольствие"
 cm__ab_food_run_now_desc: "Перевыбрать локации для производства продовольствия прямо сейчас, основываясь на балансе за этот месяц наряду с уже учтенными месяцами, вместо того чтобы ждать ежегодной проверки."
 cm__ab_food_run_now_text: "$cm_txt_run_now$" # NO-TRANSLATE
 cm__ab_food__debug_name: "$cm_txt_debug$" # NO-TRANSLATE
 cm__dbg_run_food_name: "Запустить: Продовольствие"
 cm__dbg_run_food_desc: "$cm_txt_dbg_run_category_desc$" # NO-TRANSLATE
 cm__dbg_run_food_text: "$cm_txt_run_now$" # NO-TRANSLATE
 cm__ab_production__ab_production_name: "$cm__ab_production_name$" # NO-TRANSLATE
 cm__ab_production_algorithm_name: "Стратегия строительства"
 cm__ab_production_algorithm_desc: "Как производство выбирает, что строить."
 cm__ab_production_algorithm_option_1_name: "Жадный"
 cm__ab_production_algorithm_option_1_desc: "Строить в первую очередь самые быстроокупаемые варианты и только те, что близки к лучшему найденному месту для производства тех же товаров."
 cm__ab_production_max_rel_roi_name: "Макс. относительная рентабельность"
 cm__ab_production_max_rel_roi_desc: "Насколько медленнее по сравнению с лучшим найденным местом для производства тех же товаров здание или улучшение может окупать свою стоимость и при этом оставаться в очереди на строительство. При 30%, если лучшее место окупается за 10 лет, будут построены только те, что окупаются в течение 13 лет; остальные будут ждать. При 0% каждый месяц строится только лучший производитель каждого товара. При 100%+ ограничений нет, и применяется только «Максимальный срок окупаемости». Все здания, производящие одни и те же товары, оцениваются вместе, независимо от их типа. Расширения РДП всегда строятся в порядке окупаемости."
 cm__ab_production_max_rel_roi_format: "[CMMV('cm__ab_production_max_rel_roi')]%[Select_CString(GreaterThanOrEqualTo_CFixedPoint(CMMV('cm__ab_production_max_rel_roi'), CMMMapValue('cmm_max', 'cm__ab_production_max_rel_roi')), '+', '')]" # NO-TRANSLATE
 cm__ab_production_min_roi_name: "Макс. лет окупаемости"
 cm__ab_production_min_roi_desc: "Рассматриваются только те постройки, налоговый доход от которых окупает стоимость строительства за указанное количество лет. Установите 0, чтобы отключить проверку."
 cm__ab_production_min_roi_format: "[CMMV('cm__ab_production_min_roi')]y @efficiency!" # NO-TRANSLATE
 cm__ab_production_min_discount_name: "$cm_txt_min_discount$" # NO-TRANSLATE
 cm__ab_production_min_discount_desc: "$cm_txt_min_discount_desc$" # NO-TRANSLATE
 cm__ab_production_min_discount_format: "[CMMV('cm__ab_production_min_discount')]%" # NO-TRANSLATE
 cm__ab_production__debug_name: "$cm_txt_debug$" # NO-TRANSLATE
 cm__dbg_run_production_name: "Запустить производство"
 cm__dbg_run_production_desc: "$cm_txt_dbg_run_category_desc$" # NO-TRANSLATE
 cm__dbg_run_production_text: "$cm_txt_run_now$" # NO-TRANSLATE
 cm__ab_roads__ab_roads_name: "$cm__ab_roads_name$" # NO-TRANSLATE
 cm__ab_roads_proximity_name: "$cm_txt_proximity$" # NO-TRANSLATE
 cm__ab_roads_proximity_desc: "Прокладывать участки дорог, максимально повышающие Близость за золото, с учётом всех последующих локаций далее по маршруту."
 cm__ab_roads_market_access_name: "Доступ к рынку"
 cm__ab_roads_market_access_desc: "Прокладывать участки дорог, которые максимально повышают рыночный доступ за свою стоимость. Траты происходят только в те месяцы, когда Близость ничего не построила и не ведется накопление на участок, который пока не по карману."
 cm__ab_roads_capital_name: "Связь со столицей"
 cm__ab_roads_capital_desc: "Прокладывайте участки дорог для соединения ваших локаций со столицей, продвигаясь от уже соединенных. Средства расходуются только в те месяцы, когда «Близость» и «Доступ к рынку» ничего не построили и не копят на участок, который пока не могут себе позволить."
 cm__ab_roads_min_discount_name: "$cm_txt_min_discount$" # NO-TRANSLATE
 cm__ab_roads_min_discount_desc: "Максимально допустимая наценка на стоимость стройматериалов. При -33% этап строительства начинается только тогда, когда необходимые пиломатериалы, камень и песок стоят на 33% ниже базовой цены. При 0% — только по базовой цене или ниже. При +33% строительство ведется, даже если цены на 33% выше базовых."
 cm__ab_roads_min_discount_format: "[CMMV('cm__ab_roads_min_discount')]%" # NO-TRANSLATE
 cm__ab_roads_run_now_name: "Принудительно перепланировать дороги"
 cm__ab_roads_run_now_desc: "Определяет, какие участки дорог следует проложить заново сейчас, не дожидаясь планового обновления. В сетевой игре это единственный способ их расчета. Сама функция не строит дороги; найденные участки возводятся по мере выделения средств из дорожного бюджета."
 cm__ab_roads_run_now_text: "$cm_txt_run_now$" # NO-TRANSLATE
 cm__ab_roads__debug_name: "$cm_txt_debug$" # NO-TRANSLATE
 cm__dbg_run_roads_name: "Прокладка дорог"
 cm__dbg_run_roads_desc: "Немедленно заказывает строительство участков дорог согласно текущему плану, не дожидаясь наступления нового месяца. Расходует остаток выделенной доли, поэтому категория, которая уже исчерпала свой лимит в текущем месяце, ничего не проложит. Функция «Приостановить автоматизацию» не блокирует это действие."
 cm__dbg_run_roads_text: "$cm_txt_run_now$" # NO-TRANSLATE
 cm__ab_governors__ab_governors_name: "$cm__ab_governors_name$" # NO-TRANSLATE
 cm__ab_gov_move_seats_name: "Разрешить перемещение губернаторов"
 cm__ab_gov_move_seats_desc: "Когда все ячейки губернаторов заполнены, снимает губернатора и назначает его в более подходящую локацию. Новая локация должна уже быть городом или иметь оценку на 10% выше, чем заменяемая. Если эта опция отключена, губернаторы назначаются только в пустые ячейки."
 cm__ab_gov_prepare_sites_name: "Разрешить подготовку новых локаций"
 cm__ab_gov_prepare_sites_desc: "Рассматривать локации, которые ещё не могут принимать губернатора, и подготавливать их в первую очередь, основывая там городок или город и прокладывая дорогу к вашей столице. Если этот параметр отключен, учитываются только локации, которые уже являются городами и соединены дорогой со столицей."
 cm__ab_governors__debug_name: "$cm_txt_debug$" # NO-TRANSLATE
 cm__dbg_run_governors_name: "Начать план губернатора"
 cm__dbg_run_governors_desc: "Запускает новый план сейчас, а не по истечении обычного двадцатипятилетнего цикла. Затем план проходит через свои этапы в течение следующих месяцев, как и обычно. По-прежнему требуются мирное время, наличие столицы и отсутствие другого запущенного поиска."
 cm__dbg_run_governors_text: "Начать"
 cm__urbanization_name: "Урбанизация"
 cm__auto_urbanize_enabled_name: "$cm_txt_enabled$" # NO-TRANSLATE
 cm__auto_urbanize_enabled_desc: "Включить или выключить автоурбанизацию."
 cm__auto_urbanize_min_discount_name: "$cm_txt_min_discount$" # NO-TRANSLATE
 cm__auto_urbanize_min_discount_desc: "Максимально допустимая наценка на стоимость стройматериалов. При -33% города и поселения основываются только тогда, когда цена материалов на 33% ниже базовой. При 0% — только по базовой цене или ниже. При +33% они основываются, даже если цена на 33% выше базовой."
 cm__auto_urbanize_min_discount_format: "[CMMV('cm__auto_urbanize_min_discount')]%" # NO-TRANSLATE
 cm__auto_urbanize__debug_name: "$cm_txt_debug$" # NO-TRANSLATE
 cm__dbg_run_auto_urbanize_name: "Запустить авто-урбанизацию"
 cm__dbg_run_auto_urbanize_desc: "Запускает повышение уровней отдельно, прямо сейчас, вместо того чтобы ждать смены месяца. В запущенном цикле ничего другого не строится, а «Приостановка автоматизации» не сдерживает этот процесс."
 cm__dbg_run_auto_urbanize_text: "$cm_txt_run_now$" # NO-TRANSLATE
 cm__auto_town_rights__auto_town_rights_specialization_name: "Дарователь права на умную специализацию"
 cm__auto_town_rights__auto_town_rights_specialization_desc: "Предоставляется после того, как Custom Right Granter завершит свою очередь."
 cm__auto_grant_specialization_name: "Автоматически предоставлять права на городскую специализацию"
 cm__auto_grant_specialization_desc: "Предоставить по одному праву на специализацию в каждой локации, выбирая наиболее ценное в золоте из тех, что подходят для производимых поблизости товаров."
 cm__specialization_window_name: "Порог соответствия"
 cm__specialization_window_desc: "Насколько хорошо право на специализацию должно подходить локации относительно наиболее подходящего права, чтобы участвовать в отборе. При 50% любое право, подходящее хотя бы наполовину так же хорошо, попадает в список претендентов, и выдается то, которое приносит больше всего золота. При 100% выдается только самое подходящее право."
 cm__specialization_window_format: "[CMMV('cm__specialization_window')]%" # NO-TRANSLATE
 cm__specialization_expand_name: "Расширить усиленные отрасли"
 cm__specialization_expand_desc: "При предоставлении права на специализацию также включается авторасширение в этой локации для предприятий, которые это право усиливает, и для добычи сырья, если локация его производит. То же самое, что и нажатие правой кнопкой мыши на кнопку предоставления на карте рекомендуемых городских прав."
 cm__auto_town_rights__debug_name: "$cm_txt_debug$" # NO-TRANSLATE
 cm__dbg_run_town_rights_name: "Запустить автоматическое дарование городских прав"
 cm__dbg_run_town_rights_desc: "Выполняет сейчас, не дожидаясь смены месяца, обрабатывая сначала список включенных объектов, а затем права специализации. «Приостановить автоматизацию» не блокирует это действие."
 cm__dbg_run_town_rights_text: "$cm_txt_run_now$" # NO-TRANSLATE
 cm__miscellaneous_name: "Разное"
 cm__cleanup_name: "Очистка зданий"
 cm__cleanup__cleanup_name: "$cm__cleanup_name$" # NO-TRANSLATE
 cm__cleanup_close_open_name: "Закрытие и открытие зданий"
 cm__cleanup_close_open_desc: "Раз в год закрывает производственные здания, которые перестали приносить прибыль и не субсидируются. Закрытые здания открываются снова, как только этот тип зданий снова станет прибыльным на данном рынке. @farming_village! [ShowBuildingTypeNameWithNoTooltip('farming_village')] и @market_village! [ShowBuildingTypeNameWithNoTooltip('market_village')] никогда не закрываются."
 cm__cleanup_destroy_name: "Снести здания"
 cm__cleanup_destroy_desc: "Раз в год сносить производственные здания, переставшие приносить доход, если количество уровней зданий в локации находится в пределах десяти от максимально поддерживаемого, а также уже закрытые здания в локациях, где закончилось место. @market_village! [ShowBuildingTypeNameWithNoTooltip('market_village')] вместо этого сокращается до одного уровня. @fruit_orchard! [ShowBuildingTypeNameWithNoTooltip('fruit_orchard')] сносится и никогда не строится заново, какой бы доход оно ни приносило, а @farming_village! [ShowBuildingTypeNameWithNoTooltip('farming_village')] никогда не сносится."
 cm__cleanup_min_profit_name: "Минимальная прибыль на уровень"
 cm__cleanup_min_profit_desc: "Здание, приносящее меньше этой суммы за уровень в месяц, считается нерентабельным и закрывается или сносится, если оно не субсидируется."
 cm__cleanup_min_profit_format: "[Divide_CFixedPoint(CMMV('cm__cleanup_min_profit'), '(CFixedPoint)100')|2]@gold!" # NO-TRANSLATE
 cm__cleanup_max_changed_name: "Макс. изменений за проход"
 cm__cleanup_max_changed_desc: "Доля зданий определенного типа на рынке, которая может измениться за один ежегодный проход. При 50% половина открытых зданий может быть закрыта или разрушена, а половина закрытых — открыта заново. Никогда не меньше одного, поэтому последнее здание этого типа всё равно может быть закрыто."
 cm__cleanup_max_changed_format: "[CMMV('cm__cleanup_max_changed')]%" # NO-TRANSLATE
 cm__cleanup_core_goods_name: "Приоритет строительных материалов"
 cm__cleanup_core_goods_desc: "Удерживать здания, которые в основном потребляют @masonry![ShowGoodsNameWithNoTooltip('masonry')], @lumber![ShowGoodsNameWithNoTooltip('lumber')], @sand![ShowGoodsNameWithNoTooltip('sand')] или @glass![ShowGoodsNameWithNoTooltip('glass')], на уровне удвоенной минимальной прибыли на уровень или 0.1@gold! на уровень, в зависимости от того, что выше. Здания, производящие один из этих четырёх ресурсов, никогда не закрываются и не сносятся, пока эта опция включена."
 cm__cleanup_auto_food_name: "Очистить локации авто-еды"
 cm__cleanup_auto_food_desc: "Если включено автопроизводство еды и рабочих любого типа уже не хватает, сносите производственные здания, не производящие пищу. @market_village! [ShowBuildingTypeNameWithNoTooltip('market_village')] сокращается до одного уровня вместо уничтожения."
 cm__cleanup_run_now_name: "Запустить очистку зданий"
 cm__cleanup_run_now_desc: "Запустить очистку сейчас, не дожидаясь ежегодного цикла."
 cm__cleanup_run_now_text: "$cm_txt_run_now$" # NO-TRANSLATE
 cm__placement_finder_method_option_3_name: "Население"
 cm__placement_finder_method_option_3_desc: "Ранжировать по количеству близости, которую добавит размещение здесь губернатора или столицы, с учётом населения каждой локации. Небольшой прирост для большого населения ценится меньше, чем значительный прирост для малого."
 cm__log_production_name: "$cm__ab_production_name$" # NO-TRANSLATE
 cm__log_production_desc: "Строки для каждого здания, которое ставит в очередь категория «Производство», и для каждого рассматриваемого расширения добычи сырья, с указанием окупаемости и дохода для каждого из них."
 cm__log_core_name: "$cm__ab_core_name$" # NO-TRANSLATE
 cm__log_core_desc: "Строки, отслеживающие одну локацию в течение цикла основных товаров: дефицит рынка и запрошенные уровни, затем то, что было выделено этой локации, оценка и постройка. Сначала отметьте локацию с помощью консольной команды effect location:<key> = { cm_ab_core_watch_on = yes }."
 cm__debug__rotation_name: "Ротация рынков"
 cm__debug__rotation_desc: "Крупная страна обрабатывает свои рынки по несколько за раз, и каждая автоматизация строит в том наборе, который активен в данный момент."
 cm__dbg_rotate_slice_name: "Смена рынков"
 cm__dbg_rotate_slice_desc: "Переход к следующей группе рынков. Цикл, запущенный одной из кнопок «Запустить сейчас», остается на найденной группе, поэтому данная функция продвигает его дальше, пока игра на паузе."
 cm__dbg_rotate_slice_text: "Повернуть"
 cm__probe_production_anchors_name: "Производственные якоря"
 cm__probe_production_anchors_desc: "По одной строке на товар с лучшей окупаемостью, зафиксированной производством, и установленным им лимитом окупаемости, с указанием здания и локации для каждого."
 cm__probe_production_anchors_text: "$cm_txt_run$" # NO-TRANSLATE
 cm__probe_production_rgo_name: "Производство сырья"
 cm__probe_production_rgo_desc: "По одной строке для каждой причины, по которой производство пропустило сырье локации, или одна строка, если пропусков не было. Отображает данные столицы, если только локация не помечена консольной командой effect location:<key> = { cm_ab_core_watch_on = yes }."
 cm__probe_production_rgo_text: "$cm_txt_run$" # NO-TRANSLATE
 cm__probe_core_name: "$cm__ab_core_name$" # NO-TRANSLATE
 cm__probe_core_desc: "Все показатели, считываемые Core Goods в локации, каждый рядом с собственным значением игры, а затем объем, который рынок этой локации может поглотить за цикл. Отображает столицу, если вы не пометите локацию консольной командой effect location:<key> = { cm_ab_core_watch_on = yes }; столица никогда не является кандидатом для Core Goods, поэтому пометьте локацию, чтобы просмотреть данные о товаре, под который в ней будет строиться производство."
 cm__probe_core_text: "$cm_txt_run$" # NO-TRANSLATE
 cm__probe_setup_name: "$cm_txt_setup_data$" # NO-TRANSLATE
 cm__probe_setup_desc: "Какие данные карты содержит сохранение и версия, в которой был обработан каждый из них, а также разрешение для данной машины на их обработку. Версия 0 означает, что данные еще не были обработаны и будут обработаны при следующей загрузке."
 cm__probe_setup_text: "$cm_txt_run$" # NO-TRANSLATE
 cm__debug__setup_name: "$cm_txt_setup_data$" # NO-TRANSLATE
 cm__debug__setup_desc: "Данные карты, которые мод вычисляет один раз, а затем считывает на протяжении всей игры."
 cm__dbg_rebuild_setup_name: "Пересобрать данные настройки"
 cm__dbg_rebuild_setup_desc: "Заново пересчитывает данные карты: сырьевые товары для фильтров бонусов R.G.O., охват промышленности для «Рекомендованных городских прав», показатели для $mapmode_cm_location_food_potential_name$, речные переправы, через которые прокладываются пути алгоритмов размещения, и то, какие здания во что улучшаются. Это занимает несколько секунд, игра при этом продолжает работать."
 cm__dbg_rebuild_setup_text: "Перестроить"
