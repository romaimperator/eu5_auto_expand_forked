 # Auto-Food (auto_food) Tab
 cm__auto_food_name: "Массовое автопродовольствие"
 ## Auto-Food RGO Types (auto_food_list) Group
 cm__auto_food__auto_food_list_name: "Массовое авто-продовольствие"
 cm__auto_food__auto_food_list_desc: "Включает «Авто-еду» во всех сельских локациях, соответствующих выбранным ниже критериям (например, пшеница на клетках у реки). Вам не требуется активировать их в режиме индивидуальной «авто-еды» для локаций. Локации, подпадающие под это правило, не переводятся в статус города функцией «Авто-урбанизация», поэтому они остаются сельскими и продолжают производить продовольствие."
