 cm__ab_core_i3_name: "@sand! [ShowGoodsName('sand')]" # NO-TRANSLATE
 cm__ab_core_i4_name: "@glass! [ShowGoodsName('glass')]" # NO-TRANSLATE
 cm__ab_core__enabled_name: "$cm_txt_enabled$" # NO-TRANSLATE
 cm__ab_core__enabled_desc: "Работайте над снижением цены этого материала."
 cm__ab_core__debug_name: "$cm_txt_debug$" # NO-TRANSLATE
