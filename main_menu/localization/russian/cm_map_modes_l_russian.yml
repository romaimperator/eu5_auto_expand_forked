l_russian:
 mapmode_cm_breadbasket_name: "Житницы"
 MAPMODE_CM_BREADBASKET: "#T $mapmode_cm_breadbasket_name$#!\nПодсвечивает ваши [locations|e], где в данный момент настроено автопроизводство еды."
 MAPMODE_CM_BREADBASKET_TT_ENABLED: "[ROOT.GetLocation.GetName] настроен(а) на авто-продовольствие."
 MAPMODE_CM_BREADBASKET_TT_OWNED: "[ROOT.GetLocation.GetName] принадлежит вам, но функция авто-еды не включена."
 MAPMODE_CM_BREADBASKET_TT_FOREIGN: "[ROOT.GetLocation.GetName] не принадлежит вам."
 MAPMODE_CM_BREADBASKET_TT_UNCOLONIZED: "[ROOT.GetLocation.GetName] не колонизировано."
 MAPMODE_CM_BREADBASKET_TT_WATER: "[ROOT.GetLocation.GetName] является морской зоной."

 cm_breadbasket_enabled_legend_key: "Авто-еда: Включено"
 cm_breadbasket_owned_legend_key: "Ваши другие локации"
 cm_breadbasket_foreign_legend_key: "Иностранные локации"
 cm_breadbasket_uncolonized_legend_key: "Незаколонизировано"

 mapmode_cm_location_food_potential_name: "Потенциал продовольствия за уровень RGO"
 MAPMODE_CM_LOCATION_FOOD_POTENTIAL: "#T $mapmode_cm_location_food_potential_name$#!\nЭто окрашивает [locations|e] в соответствии с их естественным потенциалом производства пищи на уровень [rgo|e]. Оценка учитывает значение [rgo|e] [food|e], совокупный [food_productivity|e] (ландшафт, растительность, климат, именованные статические модификаторы, такие как «Рынок сельди в Сконе» или «Плодородная дельта Нила», специфические модификаторы производства [rgo|e] и т. д.), доступ к воде и предполагаемые максимальные бонусы от [ShowBuildingTypeName('windmill')], [ShowBuildingTypeName('farming_village')] и [ShowBuildingTypeName('irrigation_systems')], где это позволяет [rgo|e].\n\nВклад [development|e] исключен, поэтому оценка отражает чистый потенциал местности, а не текущий уровень инвестиций."
 mapmode_cm_location_food_potential_hidden_name: "$mapmode_cm_location_food_potential_name$"
 MAPMODE_CM_LOCATION_FOOD_POTENTIAL_HIDDEN: "$MAPMODE_CM_LOCATION_FOOD_POTENTIAL$"
 MAPMODE_CM_LOCATION_FOOD_POTENTIAL_TT_LAND: "[ROOT.GetLocation.GetName] имеет продовольственный потенциал [ROOT.GetLocation.MakeScope.ScriptValue('cm_location_food_potential')|1Y] за уровень [rgo|e]."
 MAPMODE_CM_LOCATION_FOOD_POTENTIAL_TT_WATER: "[ROOT.GetLocation.GetName] не является сушей, поэтому у этой локации нет продовольственного потенциала."

 cm_location_food_potential_auto_food_legend_key: "Автоматизация еды включена (заштриховано)"
 cm_location_food_potential_bright_green_legend_key: "45 (макс. возможно)"
 cm_location_food_potential_green_legend_key: "27.5 (отлично)"
 cm_location_food_potential_yellow_legend_key: "20 (товар)"
 cm_location_food_potential_orange_legend_key: "12.5 (приемлемо)"
 cm_location_food_potential_red_legend_key: "3.75 (низкий)"
 cm_location_food_potential_black_legend_key: "0 (нет)"
