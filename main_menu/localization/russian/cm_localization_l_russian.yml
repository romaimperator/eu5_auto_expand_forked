 cm_txt_min_discount_desc: "Максимально допустимая наценка на стоимость стройматериалов. При -33% строительство ведется только тогда, когда материалы стоят на 33% ниже базовой цены. При 0% — только по базовой цене или ниже. При +33% строительство ведется даже при ценах на 33% выше базовых."
 cm_txt_dbg_run_feature_desc: "Запускает эту функцию немедленно, не дожидаясь смены месяца. В запущенном ею цикле больше ничего не строится, и «Приостановить автоматизацию» не препятствует этому."
 cm_txt_dbg_run_category_desc: "Обрабатывает эту категорию сейчас, отдельно, не дожидаясь смены месяца. Расходует остаток своей доли, поэтому категория, которая уже совершила траты в этом месяце, ничего не построит. «Приостановка автоматизации» не блокирует это действие."
 cm_txt_tt_sea_zone: "[ROOT.GetLocation.GetName] является морской зоной."
 CM_AUTO_FOOD_REQ_EARNING: "Уже имеющиеся продовольственные здания всё ещё приносят доход или субсидируются"
 CM_AB_AUTO_FOOD_ACTIVE_TT: "Автоматическая постройка выращивает продовольствие в этой локации, оплачивая это из своего бюджета на продовольствие. Переключение кнопки активирует или деактивирует функцию только для вас."
 CM_AB_RANK_UPGRADE_FOOD_NOTE: "Авто-строительство выращивает здесь продовольствие. Автоматическая урбанизация пропускает эту локацию; ручное улучшение удаляет её из авто-строительства."
