l_russian:
 mapmode_cm_location_proximity_modifier_name: "Влияние эффективности близости"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER: "#T $mapmode_cm_location_proximity_modifier_name$#!\nОкрашивает [locations|e] по их $mapmode_cm_location_proximity_modifier_name$: комбинированный штраф, который их [topography|e] и [vegetation|e] накладывают на [proximity|e] (горы, холмы, плато, заболоченные земли, леса, джунгли и т. д.). Зелёный цвет означает, что местность не препятствует близости; красный — что препятствует значительно. Штрафы топографии масштабируются бонусами владельца к влиянию на близость, такими как бонусы от ландшафта столицы или достижений; в незанятых локациях отображаются базовые значения местности. [road|e] или [river|e] в локации отменяют штраф [vegetation|e]; штраф [topography|e] применяется всегда."
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_LAND: "$mapmode_cm_location_proximity_modifier_name$: [ROOT.GetLocation.MakeScope.ScriptValue('cm_location_proximity_modifier')|+=%]"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_LAND_HARBOR: "$MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_LAND$\nПригодность естественной гавани: [ROOT.GetLocation.GetModifierValueFixed('natural_harbor_suitability')|0%]"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER: "[ROOT.GetLocation.GetName] не является сушей, поэтому здесь нет $mapmode_cm_location_proximity_modifier_name$."

 cm_location_proximity_modifier_none_legend_key: "0% (без штрафа)"
 cm_location_proximity_modifier_light_legend_key: "-25% (слабо)"
 cm_location_proximity_modifier_noticeable_legend_key: "-35% (заметно)"
 cm_location_proximity_modifier_moderate_legend_key: "-50% (умеренно)"
 cm_location_proximity_modifier_heavy_legend_key: "-65% (тяжёлый)"
 cm_location_proximity_modifier_severe_legend_key: "-75% (сильный)"
 cm_location_proximity_modifier_worst_legend_key: "-100% (худший)"
 cm_location_proximity_modifier_harbor_legend_key: "Пригодность природной гавани (заштриховано)"
