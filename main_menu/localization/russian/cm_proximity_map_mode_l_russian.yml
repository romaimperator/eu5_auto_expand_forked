l_russian:
 mapmode_cm_location_proximity_modifier_name: "Влияние эффективности близости"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER: "#T $mapmode_cm_location_proximity_modifier_name$#!\nОкрашивает [locations|e] по их $mapmode_cm_location_proximity_modifier_name$: совокупному штрафу, который их [topography|e] и [vegetation|e] накладывают на [proximity|e] (горы, холмы, плато, болота, леса, джунгли и т. д.). Зелёный цвет означает, что местность не препятствует близости; красный — что препятствует значительно. Штрафы топографии масштабируются бонусами владельца к влиянию на близость, например от местности столицы или достижений; в незанятых локациях отображаются базовые значения местности. [road|e] или [river|e] в локации отменяют штраф её [vegetation|e]; штраф за [topography|e] применяется всегда.\n\nВода вместо этого показывает [maritime_presence|e], которое там имеет выбранная [country|e], от зелёного на минимуме через светло-зелёный до светло-голубого на максимуме. Высокое присутствие снижает потерю [proximity|e] при пересечении [seazone|e]."
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_LAND: "$mapmode_cm_location_proximity_modifier_name$: [ROOT.GetLocation.MakeScope.ScriptValue('cm_location_proximity_modifier')|+=%]"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_LAND_HARBOR: "$MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_LAND$\nПригодность естественной гавани: [ROOT.GetLocation.GetModifierValueFixed('natural_harbor_suitability')|0%]"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER: "[ROOT.GetLocation.GetName] не является сушей, поэтому здесь нет $mapmode_cm_location_proximity_modifier_name$, и у выбранного [country|e] здесь нет [maritime_presence|e]."

 cm_location_proximity_modifier_none_legend_key: "0% (без штрафа)"
 cm_location_proximity_modifier_light_legend_key: "-25% (слабо)"
 cm_location_proximity_modifier_noticeable_legend_key: "-35% (заметно)"
 cm_location_proximity_modifier_moderate_legend_key: "-50% (умеренно)"
 cm_location_proximity_modifier_heavy_legend_key: "-65% (тяжёлый)"
 cm_location_proximity_modifier_severe_legend_key: "-75% (сильный)"
 cm_location_proximity_modifier_worst_legend_key: "-100% (худший)"
 cm_location_proximity_modifier_harbor_legend_key: "Пригодность природной гавани (заштриховано)"
 cm_location_proximity_modifier_maritime_none_legend_key: "Отсутствует морское присутствие (открытое море)"
 cm_location_proximity_modifier_maritime_low_legend_key: "Низкое морское присутствие"
 cm_location_proximity_modifier_maritime_half_legend_key: "50% морского присутствия"
 cm_location_proximity_modifier_maritime_full_legend_key: "100% морское присутствие"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER_M0: "[maritime_presence|E]: 0-10%"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER_M10: "[maritime_presence|E]: 10-20%"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER_M20: "[maritime_presence|E]: 20-30%"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER_M30: "[maritime_presence|E]: 30-40%"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER_M40: "[maritime_presence|E]: 40-50%"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER_M50: "[maritime_presence|E]: 50-60%"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER_M60: "[maritime_presence|E]: 60-70%"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER_M70: "[maritime_presence|E]: 70-80%"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER_M80: "[maritime_presence|E]: 80-90%"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER_M90: "[maritime_presence|E]: 90-100%"
