l_russian:
 mapmode_cm_location_proximity_modifier_name: "Влияние эффективности близости"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER: "#T $mapmode_cm_location_proximity_modifier_name$#!\nОкрашивает [locations|e] в соответствии с их влиянием на эффективность близости: совокупный штраф, который их [topography|e] и [vegetation|e] накладывают на [proximity|e] (горы, холмы, плато, заболоченные земли, леса, джунгли и т. д.). Зелёный цвет означает, что ландшафт не препятствует близости; красный — что он сильно ей мешает. Штрафы за рельеф масштабируются бонусами владельца к влиянию близости, например, от ландшафта столицы или достижений; в незанятых локациях отображаются базовые значения ландшафта. [road|e] или [river|e] в локации отменяют штраф за [vegetation|e]; штраф за [topography|e] применяется всегда."
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_LAND: "Влияние эффективности близости: [ROOT.GetLocation.MakeScope.ScriptValue('cm_location_proximity_modifier')|+=%]"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_LAND_HARBOR: "Влияние эффективности близости: [ROOT.GetLocation.MakeScope.ScriptValue('cm_location_proximity_modifier')|+=%]\nПригодность естественной гавани: [ROOT.GetLocation.GetModifierValueFixed('natural_harbor_suitability')|0%]"
 MAPMODE_CM_LOCATION_PROXIMITY_MODIFIER_TT_WATER: "[ROOT.GetLocation.GetName] не является сушей, поэтому не имеет влияния на эффективность близости."

 cm_location_proximity_modifier_none_legend_key: "0% (без штрафа)"
 cm_location_proximity_modifier_light_legend_key: "-25% (слабо)"
 cm_location_proximity_modifier_noticeable_legend_key: "-35% (заметно)"
 cm_location_proximity_modifier_moderate_legend_key: "-50% (умеренно)"
 cm_location_proximity_modifier_heavy_legend_key: "-65% (тяжёлый)"
 cm_location_proximity_modifier_severe_legend_key: "-75% (сильный)"
 cm_location_proximity_modifier_worst_legend_key: "-100% (худший)"
 cm_location_proximity_modifier_harbor_legend_key: "Пригодность природной гавани (заштриховано)"
